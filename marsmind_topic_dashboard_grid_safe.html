,"一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 10:56:29","用户":"文丰","群":"","用户问询":"第一次出单的品，我填的克重是200，平台测重400克。之后再出单平台会自动更新克重运费吗","AI响应":"你好！很高兴为你解答。\n\n平台不会自动更新你 Listing 里的克重。\n\n如果仓库测重与你填写的重量不符，平台会按测重的 400g 计费。为了避免后续运费持续异常，你必须手动在后台修改该商品的件重尺信息。\n\n重要提示：修改完成后，请务必登记并通知仓库进行重新称重，这样才能确保后续订单按优化后的重量计费。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 21:17:56","用户":"勇攀高峰。","群":"","用户问询":"你好，我问下美国转运仓，拉美地区出单后，尾程仓库派送呢？还是官方物流去仓库取件呢？","AI响应":"你好！很高兴为你解答。在美国转运仓模式下，Listing出单后，由美客多官方完成订单的尾程配送，不需要官方去取件，也不需要你额外处理。你只需提前将货物备好并存放在美客多位于美国德州的官方FULL仓即可。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 15:25:30","用户":"ㅤ  ㅤ","群":"","用户问询":"尾程配送费怎么是从美国全境发往墨西哥呢我的站点就在墨西哥你们美客多在墨西哥应该也有站点呀","AI响应":"你好！美客多在墨西哥设有本地海外仓（FBM）。若你从墨西哥本地仓库发货至美客多仓库，仅需支付本地尾程配送费。此前提到的美国发货是指美国转运仓模式，若你已在墨西哥本地补货，则按墨西哥本土配送标准计费。\n\n网页参考资料\n美客多墨西哥站点尾程配送费用：https://global-selling.mercadolibre.com/help/40025","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-19 14:20:34","用户":"灯火星星","群":"","用户问询":"自发货模式中，运费从哪一段开始算起？是卖家把商品发到国内的中转仓开始吗？","AI响应":"你好！很高兴为你解答。自发货运费主要指国际段运费，即从美客多国内集运仓运往目的国买家的全程费用。卖家需要自行承担将货物送达国内集运仓的头程转运费。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-18 19:58:09","用户":"Li","群":"","用户问询":"你好，我是自发货，请问勾选了最下面后，是要提前把货备到官方仓是吗？","AI响应":"不是的。勾选最下方的 **Drop off | Cainiao**（卖家自寄）是指当您产生订单后，需要您**自行联系国内快递**或亲自将包裹送到菜鸟指定的国内扫码仓，而不是提前备货到海外仓。\n\n这两种选项的区别在于：\n1. **Pickup（上门揽收）**：菜鸟快递员到您填写的地址上门取件。\n2. **Drop off（卖家自寄）**：您自己找顺丰、中通等快递把包裹寄到菜鸟仓库，运费由您承担。\n\n无论选哪种，都是**出单后**再发货，不需要提前备货。\n\n网页参考资料：\nhttps://global-selling.mercadolibre.com/help/cainiao-warehouses-drop-off_36979","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 23:16:07","用户":"楠","群":"","用户问询":"你好500克以内不算计抛吗，比如实际重量350，计抛1700，运费按哪个计算","AI响应":"你好！目前 500g 以下的货件仍按实际重量计费。如果你的实际重量是 350g，即便计抛重量为 1700g，目前仍会按 350g 计算运费。但请务必确保后台申报尺寸准确，避免产生附加费。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 17:15:19","用户":"骑着毛驴去拉萨","群":"","用户问询":"自发货，到达目的地了 然后派送不了 运费是卖家出吗 售价20美金","AI响应":"你好！售价20美金（约合400比索）已超过墨西哥299比索的包邮门槛，因此发货运费由卖家承担。若因买家原因导致派送失败，运费不予退还。自发货运费按货件毛重计收，直接与平台结算。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 13:48:43","用户":"ricky","群":"","用户问询":"请问系统里这个自动调整价格的最低价格和最高价格是指收益还是前台售价？","AI响应":"你好！很高兴为你解答。\n\n根据你提供的图片显示，价格调整规则选择的是 Best net proceeds，因此这里填写的最低价格和最高价格是指你的净收益，而不是前台售价。\n\n系统会根据你设定的净收益范围，自动计算并加上佣金、税费及运费，从而生成最终的前台售价。你只需要定义你愿意接受的最低净收益，工具在自动调价时不会低于这个数值，确保你的利润空间受控。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 13:11:27","用户":"爱种地的老狗","群":"","用户问询":"经理你好，我想问下，从国内发货到墨西哥，运费的计算模版哪里可以看到","AI响应":"你好！关于自发货物流的运费表，你可以在美客多卖家后台的运费查询页面查看详细的运费标准，包括不同重量区间的费用。\n\n如果你需要查看墨西哥站点的具体菜鸟运费表，可以参考以下官方链接：\n墨西哥站点：菜鸟运费查询表（https://global-selling.mercadolibre.com/help/shipping-costs-envio-cainiao-mexico_41817）\n\n另外，如果你需要计算具体订单的运费成本，推荐使用官方的利润计算器进行测算（https://global-selling.mercadolibre.com/listings/cost-calculator）。\n\n建议你在上架商品前，先通过卖家后台查询好各站点的运费：https://global-selling.mercadolibre.com/help/37369","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 20:20:14","用户":"柯培鑫","群":"","用户问询":"我是不是只需要把货发到国内的转运仓就行了吗？物流费用要不要我支付呢","AI响应":"是的，在全托管模式下，你只需要负责将货物发送到平台指定的国内集货仓（位于广东省东莞市）。\n\n关于物流费用的支付规则如下：\n\n1. **国内段运费（商家承担）**：从你的仓库发货到美客多东莞集货仓的这一段物流费用，需要由你自行承担。你可以选择任意快递或物流公司，也可以自行送货到仓。\n\n2. **国际段及尾程运费（平台承担）**：货物到达东莞仓并签收后，后续从中国发往墨西哥的国际物流、清关、以及在墨西哥当地的尾程派送费用，全部由平台承担。\n\n**总结：** 你只需要支付“国内发货至官方仓”的这一小段运费，真正大头的国际运费和海外派送费都是0成本。\n\n**全托管国内集货仓信息：**\n寄送地址：广东省东莞市沙田镇进港南路第一产业园205号库台\n联系人：叶宗虎 18025233509\n可接受货物时间：周一至周日，9:00am-18:00pm\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 16:03:47","用户":"柯培鑫","群":"","用户问询":"在哪里设置的汇率和运费模板，图片语言会不会自动翻译成当地国家语言","AI响应":"关于设置汇率、运费以及图片翻译的问题，解答如下：\n\n**1. 汇率与定价设置**\n在美客多跨境店铺后台，你通常不需要手动设置实时汇率，系统会自动根据国际汇率进行换算。\n*   **设置路径**：在上传产品或编辑 Listing 时，进入 **Price** 模块。\n*   **操作逻辑**：你可以直接输入你期望收到的**美金金额（USD）**，系统会根据当前汇率自动计算并展示给当地买家对应的墨西哥比索或巴西雷亚尔。\n*   **差异化调整**：如果你想针对不同国家设置不同的利润率，可以在 **Global Selling** 页面针对特定站点调整价格百分比（例如：墨西哥站加价 10% 以覆盖 RFC 税费）。\n\n**2. 运费模板设置**\n跨境卖家的运费主要由系统根据产品的重量和体积自动计算。\n*   **设置路径**：在 Listing 的 **Shipping** 或 **Technical Specs** 部分，准确填写产品的**包装后重量和尺寸**。\n*   **运费承担**：你可以选择由买家支付运费，或者选择“免运费（Free Shipping）”由卖家承担。系统会根据你填写的尺寸，在后台显示该产品在不同站点的预估运费成本。\n\n**3. 图片语言会自动翻译吗？**\n**不会。**\n*   **系统局限性**：美客多的自动翻译系统只能处理**文本内容**（如标题、描述、属性表）。\n*   **图片文字**：如果你的图片中带有中文或英文描述（例如图片上写着“纯棉材质”或“Waterproof”），系统是**无法自动翻译**这些像素文字的。\n*   **合规要求**：根据平台规则，店铺首页展现的所有文字（含图片中的文字）必须使用本地语言（西班牙语或葡萄牙语）。\n\n**建议操作：**\n*   **图片去字**：为了通用性，建议主图和副图尽量使用简洁的视觉表达，减少文字堆砌。\n*   **手动汉化/西化**：如果必须在图片中加入文字说明（如尺码表或功能标注），建议针对墨西哥站制作西班牙语图片，针对巴西站制作葡萄牙语图片。如果想省事，使用**通用的英文**在某些类目也是被允许的，但体验不如本地语言好。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 11:40:26","用户":"啊楼🍉","群":"","用户问询":"自发货是不是500G以下按重量？售价运费不足的会从我的账户扣除对吧","AI响应":"你好！美客多各站点的自发货运费均按货件毛重计收。\n\n关于运费扣除规则如下：\n1. 平台结算确实是从您的总账户扣除的。\n2. 售价低于包邮门槛的商品运费由买家承担，卖家只需为售价高于包邮门槛的商品支付运费。\n3. 如果买家支付的运费不足以覆盖实际产生的运费，差额部分会从您的账户中扣除。\n\n您可以在卖家后台查看详细的运费账单明细。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-19 14:54:19","用户":"灯火星星","群":"","用户问询":"我还是没太懂，卖家承担运费的情况下，会不会牺牲净收益？","AI响应":"你好！很高兴为你解答。不会牺牲净收益。在收益价格模式下，系统会自动将运费和佣金加在你的净收益之上生成最终售价。即使运费发生变动，系统也会调整售价来保护你设定的净收益不变。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 17:49:06","用户":"Felicity 103%","群":"","用户问询":"那如果被海关扣留的包裹会退回发货地吗 退回会产生费用吗","AI响应":"你好！很高兴为你解答。被海关扣留的包裹处理方式取决于当地海关政策。若包裹被退回，通常会退回至您后台填写的退货地址，且会产生退回运费。若无法退回或选择弃置，则可能产生弃置费。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 16:40:17","用户":"大山","群":"","用户问询":"产生退货的话，运费、佣金和商品成本，都是卖家负责吗","AI响应":"退货产生的发货运费和广告费通常不退，佣金会退还。若商品损坏选择弃置会产生弃置费。商品成本由卖家承担，退回可能产生退回运费。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 12:00:49","用户":"纯属巧合","群":"","用户问询":"你好， 现在墨西哥半托管的尾程费用是按照哪个算的？","AI响应":"你好！很高兴为你解答。\n\n半托管模式下，商家的定价逻辑和运费承担方式与常规模式不同。\n\n在半托管模式下，商家不需要自己支付尾程费用，也不需要设置包邮或不包邮。\n\n半托管采用的是收益价格模式（Net Proceeds）：\n1. 商家定价：你只需要设置你想要获得的收益（即商家供货价）。这个价格建议包含：单件货物成本 + 你的目标利润 + 单件国内发货到东莞仓的物流成本（需转化成美元填写）。\n2. 平台处理：剩余的官方收费部分，包括平台佣金和尾程运费，平台会进行前端售价藏价。也就是说，平台会根据算法统一计算这些费用并展示给消费者，不需要商家手动计算尾程运费。\n\n简单来说，你只需要考虑你想拿回多少钱，剩下的运费和佣金由平台在前端价格中自动处理。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 10:48:03","用户":"孫明山","群":"","用户问询":"退回的包裹只是收取运费，还会收取中国海关关税嘛？","AI响应":"你好！很高兴为你解答。\n\n自发货模式下，卖家不需要考虑关税。目前自发货卖家不涉及墨西哥36%的增值税代扣，关税方面暂时没有额外影响。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-19 21:37:34","用户":"蓝色星空","群":"","用户问询":"请问自发货店铺产生退货时，进口费用谁承担？","AI响应":"你好！很高兴为你解答。自发货订单产生退货时，进口费用通常由卖家承担。建议你在后台设置好退货地址，并与买家协商处理。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-19 18:00:23","用户":"A～猴子","群":"","用户问询":"同意的净收益 为什么别人的售价比我低 同样","AI响应":"你好！根据图片显示，虽然你们的净收益（Net Proceeds）几乎相同，但对方的前台售价（商品标价）明显更低。\n\n这是因为前台售价是由“净收益 + 佣金 + 运费”组成的。对方售价更低，通常是因为其物流成本更低（例如包裹更轻小、计费权重更低）或享受到了平台的佣金补贴。系统会自动在您的净收益基础上叠加这些费用，从而导致最终展示给买家的价格出现差异。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-19 14:42:20","用户":"灯火星星","群":"","用户问询":"方便解释一下这几个按钮的意思吗？","AI响应":"你好！很高兴为你解答。图片中的筛选按钮含义如下：\n1. FULL：筛选由美客多海外仓发货且满299比索免运费的商品。\n2. Internacional：筛选跨境发货（自发货）且满299比索免运费的商品。\n3. Envío local：筛选墨西哥本地发货的商品。\n4. Envío gratis：筛选所有提供免运费服务的商品。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 17:14:30","用户":"骑着毛驴去拉萨","群":"","用户问询":"到达目的地了 然后派送不了 运费是卖家出吗","AI响应":"你好！如果是因为买家原因（如地址错误、拒收）导致派送失败，商品退回海外仓的运费通常由卖家承担。如果商品标价等于或高于299 MXN，初始发货运费也是由卖家支付的。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 14:03:03","用户":"啊邝","群":"","用户问询":"商品低于15美金，是由买家付运费吗","AI响应":"你好！很高兴为你解答。\n\n关于运费承担的规则如下：\n\n1. **包邮门槛**：美客多的包邮门槛是以当地货币计算的。以墨西哥站点为例，包邮门槛是 **299 墨西哥比索（MXN）**。\n2. **运费归属**：\n   - 如果商品标价**低于 299 MXN**，买家将承担运费。\n   - 如果商品标价**等于或高于 299 MXN**，卖家需要支付运费。\n\n你提到的 15 美金，建议你换算成当地货币进行对比。如果换算后的价格低于 299 MXN，则由买家承担运费，卖家无需支付该部分的物流费用。\n\n**网页参考资料**\nhttps://global-selling.mercadolibre.com/help/18500","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 11:45:08","用户":"kun","群":"","用户问询":"我的净收益是已经扣除了佣金和物流费用是吗？","AI响应":"是的，净收益（Net Proceeds）是您在销售后扣除所有适用费用后获得的金额。\n\n在美客多自发货模式下，您在后台录入的净收益金额，是已经扣除了平台佣金和跨境物流费用后的预计到账金额。平台系统会自动在您填写的净收益基础上，叠加佣金、运费以及相关税费，最终生成买家在前台看到的销售价格。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 14:08:42","用户":"wd","群":"","用户问询":"为什么两件产品 退一件是16美金","AI响应":"你好！很高兴为你解答。\n\n从你提供的图片来看，订单总计金额为 19.11 美金。退款金额显示为 16.63 美金，这通常是因为退款金额是基于买家实际支付的商品单价计算的。\n\n即使是退货退款，平台仍会扣除已产生的服务费用，包括：\n1. **平台佣金（销售费用）**\n2. **广告费**（如有）\n3. **物流运输费**\n\n这些费用是平台提供服务产生的，不因退款而免除。具体扣费明细建议你在后台账单中查看详情。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 11:27:40","用户":"Li","群":"","用户问询":"你好，这种未送达的快递费还是要商家承担吗？？","AI响应":"你好！对于自发货订单，如果因买家未取件导致“未送达”，已经产生的国际段运费通常仍需由卖家承担。\n\n从你的账单明细看，商品价格、销售费用、物流运输和取消记录相互抵消，最终总计为 0.00。这意味着平台退回了佣金，但你付出的物流成本和货值损失确实需要自行承担。\n\n建议及时联系物流商，看包裹是否能退回或转寄，以减少损失。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 16:05:47","用户":"kaykay子琪","群":"","用户问询":"请问全托和半托管分别的运费和佣金是？","AI响应":"全托管模式：0佣金、0国际运费。\n半托管模式：收取8%佣金（享最高50%佣金折扣），国际段运费由平台负责并进行前端售价藏价，商家无需计算运费。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 11:40:01","用户":"A辰龍跨境-苗苗","群":"","用户问询":"如果我的商品重量填少了，额外运费如何算","AI响应":"你好！很高兴为你解答。\n\n运费是根据商品的实际重量（包含商品及其包装）计算的。卖家必须申报准确的重量和尺寸。\n\n关于自发货物流实际超重的运费扣费查询，您可以前往卖家后台“账单详情”，了解系统二次测重后的最终扣费。如果卖家反复出现商品重量或尺寸与申报不符的情况，可能会导致额外收费或账户被暂停。\n\n建议您正确填写产品尺寸及重量，避免仓库信息同步滞后，导致运费计算不准。您可以前往卖家后台的运费查询页面查看详细的运费标准。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 18:53:49","用户":"大大大明","群":"","用户问询":"所以我这个价格是因为没有超过79才没有包邮吗","AI响应":"你好！很高兴为你解答。\n\n是的，从图片来看，该商品的折后价格为 70.45 雷亚尔，未达到巴西站 79 雷亚尔的免运费门槛，所以前端显示需要买家支付运费。只有当单笔购买金额超过 79 雷亚尔时，买家才能享受免运费。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 18:47:13","用户":"大大大明","群":"","用户问询":"为什么在前端显示不包邮，进去确实包邮的","AI响应":"你好！很高兴为你解答。\n\n从图片看，该商品属于巴西站点。巴西站点的免运费门槛是 79 雷亚尔。\n\n你的商品标价为 133.22 雷亚尔，已超过门槛，因此系统自动判定为“免费配送”，并由你支付 9.60 美金的运费。列表页显示的“不含免运费”可能是系统缓存或显示延迟，请以详情页和实际扣费为准。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 16:04:02","用户":"波波波pewpewpew突突突","群":"","用户问询":"你好，自发货的运费价格表哪里可查看","AI响应":"你好！很高兴为你解答。自发货运费按货件毛重计收，你可以在卖家后台查看。各站点具体菜鸟运费表请参考以下链接：\n\n墨西哥：https://global-selling.mercadolibre.com/help/shipping-costs-envio-cainiao-mexico_41817\n巴西：https://global-selling.mercadolibre.com/help/shipping-fee-cainiao-costos-brasil_41814\n智利：https://global-selling.mercadolibre.com/help/shipping-fees-chile-cainiao_38716\n哥伦比亚：https://global-selling.mercadolibre.com/help/shipping-fees-colombia-cainiao_37289\n阿根廷：https://global-selling.mercadolibre.com/help/costos-envio-argentina-cainiao_42837","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 11:14:27","用户":"若初见","群":"","用户问询":"等于他拒收运费也是我出的 他什么都不损失","AI响应":"你好！很高兴为你解答。\n\n确实如你所说，在自发货模式下，如果买家拒收，卖家需要承担发货时的跨境运费，这部分费用是不会退还的。\n\n对于买家而言，如果他们选择拒收，通常可以获得全额退款，确实没有直接的资金损失。\n\n为了降低这种风险，建议你在发货前通过后台私信与买家确认收货信息，并保证商品描述准确，以减少因买家主观原因导致的拒收情况。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 10:24:51","用户":"j、","群":"","用户问询":"图片中，折扣20%为什么促销后利润还有6.87","AI响应":"从图片看，该促销活动总折扣为24%，其中你承担20%（4.40美元），平台承担4%（0.88美元）。促销后净收益6.87美元，是基于你原始净收益7.70美元，扣除你承担的4.40美元折扣后，再结合平台补贴及佣金/运费重新计算得出的结果。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 00:00:39","用户":":-P","群":"","用户问询":"我这个订单显示的运费是固定服务费吗？","AI响应":"从您提供的图片来看，这一项并不是固定服务费。\n\n图片中显示的 3.27 美元明确标注为“运费”，并且下方有补充说明“运费基于包裹的毛重（由您承担）”。这属于订单的配送费用，是根据您商品的重量或体积计算出的实际运费。\n\n固定服务费（低价附加费）通常会包含在“销售费用”这一栏的明细中，或者以单独的固定金额形式出现。当您的商品单价低于各站点的门槛时，平台才会按件加收那笔固定的处理费。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 16:01:46","用户":"lxy","群":"","用户问询":"运费的话 是包含巴西国内的派件费吗","AI响应":"目前巴西站点自发货采用净收益模式，您不需要自己去计算复杂的运费模版。您只需要在后台录入您的目标净收益，也就是您的采购成本加上您想赚取的利润，平台系统就会根据产品的重量，自动为您叠加运费和销售佣金，从而生成买家在前台看到的最终售价。\n\n这个系统生成的最终售价已经包含了从中国发货到买家手中的全流程运费。\n\n如果您想了解具体的运费标准，可以参考巴西站点的菜鸟运费查询表：https://global-selling.mercadolibre.com/help/shipping-fee-cainiao-costos-brasil_41814","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 11:13:12","用户":"柯培鑫","群":"","用户问询":"商品促销中心有什么作用，以及是要自动降价售卖吗","AI响应":"商品促销中心是卖家自主管理和提报活动的核心板块，它的作用和运行逻辑如下：\n\n**1. 促销中心的作用**\n*   **提升流量与转化**：通过设置折扣，商品在前台会显示醒目的折扣标签（如 -5%），吸引买家点击。\n*   **提报官方活动**：除了自主创建折扣，平台组织的各类大促（如 DoD、LD 等）也会在这里展示，你可以一键提报以获取平台流量红利。\n*   **价格管理**：你可以在这里直观地看到折后价格以及你最终能拿到的“净收益（你将收到）”，方便控制利润。\n\n**2. 是自动降价售卖吗？**\n*   **不是自动的**：平台不会在未经你允许的情况下自动调低你的价格。\n*   **需要手动参与**：如你截图所示，右侧有一个蓝色的**“立即参与”**按钮。只有当你点击并确认后，折扣才会生效。\n*   **自主创建**：你也可以点击右上角的“创建促销活动”，自主决定折扣比例和持续时间。\n\n**3. 截图内容解读**\n*   **商品价格折扣**：系统建议你设置 5% 的折扣（减去 1.15 美元）。\n*   **你将收到**：如果你参与这个 5% 的折扣，你的净收益将从原来的 11 美元降至 **10.04 美元**。\n*   **商品促销价**：前台买家看到的最终售价将变为 21.72 美元（约 110.96 雷亚尔）。\n\n**操作建议：**\n如果你觉得 10.04 美元的净收益依然有利润空间，且想通过折扣换取更多流量，可以点击“立即参与”。一旦活动创建成功，在活动期间价格是无法修改的。\n\n此外，在设置折扣时要留意：如果折后价格低于了站点的强制包邮门槛，运费将转由买家承担；如果依然高于门槛，则继续由你承担运费。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"}]},{"一级大类":"产品管理","二级子类":"侵权合规","Past 7 Days":149,"Previous 2026-07-06 to 2026-07-12":156,"Change":-7,"WoW":-0.04487179487179487,"Past 7 Share":0.021628683408332124,"高频问题":"侵权/品牌/合规处理","__details":[{"时间":"2026-07-14 18:18:19","用户":"F","群":"","用户问询":"Cabeça De Substituição 52B Para Barbeador Elétrico Braun Série 5 这样会侵权吗","AI响应":"你好！很高兴为你解答。若出售品牌产品的配件，加上“ for”或“ compatible with”，避免侵权。\n\n针对你提供的标题，Braun 是知名品牌，为了降低侵权风险，建议你将标题修改为：Cabeça De Substituição 52B Compatible With Barbeador Elétrico Braun Série 5。\n\n请注意，Listing 出单后将无法自行修改标题，建议在发布前确保格式正确。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-19 15:45:40","用户":"wd","群":"","用户问询":"Protector De Llave Hm Zinc Para Chirey Tiggo 2, 4 Y 7z 侵权吗","AI响应":"你好！很高兴为你解答。\n\n该标题存在侵权风险。\n\n正确做法是：\n1. 标题应改为：Protector De Llave **compatible con** Chirey Tiggo 2, 4 Y 7z。\n2. 品牌字段必须填写为 **Generic**（通用）。\n3. 确保产品实物和图片上**没有任何 Chirey 的 Logo**。\n\n如果不加兼容性词汇或实物带 Logo，会被系统判定为品牌侵权。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-13 09:31:10","用户":"wd","群":"","用户问询":"Direcionais Led Moto Yamaha Mt07 Mt09 Mt10 R15 侵权吗","AI响应":"你好！很高兴为你解答。\n\n这个标题存在**侵权风险**。\n\n虽然你列出了多个型号，但直接将品牌词“Yamaha”与产品名称连接，且没有使用兼容性连接词，极易被系统判定为品牌侵权。\n\n**为了降低风险，请务必按照以下要求修改：**\n\n1. **修改标题：** 必须加上“for”或“compatible with”来指明兼容性。建议修改为：\n`Direcionais Led Moto compatible con Yamaha Mt07 Mt09 Mt10 R15`\n\n2. **属性设置：** 在后台上品或编辑 Listing 时，**【品牌（Brand）】**字段必须填写为**“Generic”（通用）**。千万不要填写“Yamaha”，否则会被系统抓取判定侵权。\n\n3. **图片检查：** 确保产品图片中没有出现 Yamaha 的 Logo。\n\n**核心原则：**\n店铺没有做品牌备案的，listing“品牌”字段中不能填写任何的品牌，标题和图片也不能使用对应品牌。正确做法是使用“兼容xx品牌或型号”字段，且“品牌”和“型号”字段应始终设置为“通用”！\n\n网页参考资料：\nhttps://global-selling.mercadolibre.com/help/1078","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-17 13:50:55","用户":"路亚饵工厂基地","群":"","用户问询":"5. 品牌资质（可选）：如果您打算开品牌店，还需要准备R标或TM标。这个R标和TM标是啥意思？","AI响应":"在商标领域，R标和TM标代表了商标的不同法律状态：\n\n1. R标（Registered）：\n指已经在销售目的国（如墨西哥、巴西等）的国家商标局正式注册成功并获得商标注册证的商标。在美客多申请官方旗舰店（Official Store）或进行品牌备案时，通常需要提供R标证书。\n\n2. TM标（Trademark）：\n指已经向国家商标局提出申请，并已收到受理通知书，但尚未正式注册成功的商标。它表示该商标正处于申请审核阶段。\n\n在美客多进行品牌备案，您需要准备以下核心材料：\n1. 商标证书：提供在销售目的国注册成功的商标证书（R标）。\n2. 品牌授权书：如果您不是商标的所有人，必须提供由商标持有人出具的正式授权书。\n3. 产品实物图：需要提供带有品牌 Logo 的产品实物照片。\n4. 品牌信息：包括品牌名称、所属类目等基本信息。\n\n备案流程及注意事项：\n1. 提交方式：通过客户经理提交上述材料。\n2. 审核周期：通常需要 2至4周。\n3. 获得权限：审核通过后，您可以获得品牌保护以及品牌广告（Display）的投放权限。\n4. 邮件跟进：若提交后超过 4 周没有回音，请按 “【品牌审核跟进】+店铺名+ID” 的邮件标题格式联系您的客户经理，或联系官方客服催促。\n\n请注意，官方旗舰店（Official Store）的申请与品牌保护计划（BPP）是两套不同的流程，对资质的要求可能有所不同。其他站点也需要R标才能申请官方店。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-19 01:12:53","用户":"Vinson","群":"","用户问询":"品牌旗舰店只能卖一个类目吗？还是同一品牌的产品都可以升级为品牌旗舰店","AI响应":"你好！很高兴为你解答。认证一个店无法做多品牌官方店，但同一品牌下的产品都可以升级为品牌旗舰店。直接售卖就可以了。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-17 22:03:28","用户":"问道","群":"","用户问询":"我主要经营的男装，在上传图片时，是否需要避免图片中出现的品牌logo？","AI响应":"你好！很高兴为你解答。\n\n是的，在上传商品图片时需要注意以下几点：\n\n1. 避免品牌Logo：由于你的品牌未在销售目的国备案，图片中应避免出现明显的品牌Logo、水印或商标，以免被系统判定为品牌侵权。\n\n2. 纯净展示：照片中严禁出现文字、边框、二维码或联系方式（如电话、链接等）。\n\n3. 真实展示：不要在照片中加入不属于购买范围的配件或上下文元素，以免买家产生困惑。\n\n4. 质量要求：建议分辨率达到1200x1200px。针对时尚服饰类目，建议图片能够清晰展示商品细节。\n\n网页参考资料：\nhttps://global-selling.mercadolibre.com/learning-center/news/photo-requirements-for-tops","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-17 21:45:17","用户":"问道","群":"","用户问询":"我是中国地区的服装品牌授权经销商，我应该在哪里登记我的授权文书？","AI响应":"你可以登录卖家后台，在导航栏中寻找 Listings 菜单下的 Brand Protection（品牌保护）或 Brand Registry（品牌注册）选项进行资料上传。\n\n如果你是需要加入品牌保护计划（BPP），可以直接访问官方自查与申请入口。\n\n在添加品牌授权时，如果你是被授权的品牌商（非品牌权利人），请在选项中选择第二个。品牌商本身则选择第一个。\n\n需要注意的是，如果你拥有合法经销商销售授权但非一级授权（二级授权链路），在上架产品时，【品牌】字段里请填写通用。\n\n品牌审核周期通常为2-4周，请优先核实商标是否为销售目的国R标。若提交后一直没有回音，请务必按 “【品牌审核跟进】+店铺名+ID” 的邮件标题格式联系客户经理，或联系美客多官方客服催促。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-17 10:21:04","用户":"随心","群":"","用户问询":"那假如说我卖工具行业中的一些什么布轮那些之类的。那会不会涉及到侵权","AI响应":"销售布轮等工具类产品本身不属于禁售品，但仍需注意以下侵权风险：\n1. 品牌侵权：确保产品及包装上没有未经授权的他人品牌Logo。\n2. 版权侵权：Listing的标题、描述及图片必须原创，严禁盗用其他卖家的图片或肖像。\n3. 专利侵权：核实产品外观或结构是否已申请专利保护。\n\n建议上架前在官方自查入口核实风险：https://global-selling.mercadolibre.com/help/1078","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-19 12:54:41","用户":"Li","群":"","用户问询":"原视频是我用软件剪的，加了我设计的LOGO，没有品牌，可以吗","AI响应":"可以投诉。即便没有品牌备案，对方盗用你原创剪辑且带有你设计LOGO的视频，仍属于侵权行为。你可以通过后台的举报功能，以“盗用图片/视频”或“版权侵权”为由发起投诉。建议准备好视频的原始剪辑工程文件或未加LOGO的原片作为原创证明。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-19 10:52:25","用户":"纳洛童","群":"","用户问询":"如果我没有授权，我可以售卖吗？我要怎么才能规避平台的侵权扫描","AI响应":"你好！很高兴为你解答。\n\n**如果没有正式授权，强烈建议不要售卖。**\n\n美客多对侵权行为采取**零容忍政策**，一旦发现会直接下架产品甚至永久关闭店铺。平台拥有极严的反作弊和侵权算法，**无法通过技术手段规避扫描**。\n\n**风险提示：**\n1. **系统自动抓取**：系统会自动识别标题、描述中的违规词（如 Spiderman）以及图片中的经典Logo和造型。\n2. **品牌方投诉**：漫威等权利人会定期在平台进行版权清理。\n3. **严重后果**：涉及售假/仿牌通常会直接永久封号，不存在所谓的“安全次数”。\n\n为了您的账号安全，建议选择无版权风险的通用款式或自有品牌产品进行售卖。\n\n**网页参考资料：**\n如何避免版权侵权：https://global-selling.mercadolibre.com/help/1078","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-18 09:41:46","用户":"j、","群":"","用户问询":"那我怎么看我开的是不是品牌广告 没有找到设置关键词的地方","AI响应":"你好！很高兴为你解答。品牌广告（Brand Ads）展示在搜索结果页最上方的“0号位”。如果你在广告后台没有看到关键词设置，可能是因为你目前开启的是商品广告（Product Ads），或者品牌广告选择了自动投放模式。手动模式下才可以直接增删关键词。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-17 20:44:38","用户":"骑着毛驴去拉萨","群":"","用户问询":"需要设置并开通你的品牌/店铺主页 这个需要怎么操作，流程发一下","AI响应":"你好！很高兴为你解答。\n\n树立品牌形象和开通主页，你可以通过以下步骤操作：\n\n1. 登录卖家后台，进入店铺装修或 My Page 模块。\n2. 设置店铺封面（Header）：上传具有辨识度的品牌背景图。\n3. 设置店铺 Logo：上传清晰的品牌图标。\n4. 设置店铺名称：确保名称准确且具有辨识度。\n\n通过以上板块的设置，即可塑造品牌风格并建立品牌第一印象。目前品牌店铺申请有新政策，建议你先完成上述页面装修，具体流程可向你的客户经理进一步查询。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-17 16:59:54","用户":"c.","群":"","用户问询":"我现在有品牌，但是我做的自发货，可以上传品牌授权吗","AI响应":"你好！很高兴为你解答。\n\n自发货卖家也是可以上传品牌授权的。在注册阶段填写申请表时，如果暂时没有准备好可以先空着，但是提交完申请后记得及时补上。\n\n在美客多进行品牌备案，你需要准备以下核心材料：\n1. 商标证书：提供在销售目的国（如墨西哥、巴西等）注册成功的商标证书（R标）。\n2. 品牌授权书：如果你不是商标的所有人，必须提供由商标持有人出具的正式授权书。\n3. 产品实物图：需要提供带有品牌 Logo 的产品实物照片。\n4. 品牌信息：包括品牌名称、所属类目等基本信息。\n\n你可以登录卖家后台，在导航栏中寻找 Listings 菜单下的 Brand Protection（品牌保护）或 Brand Registry（品牌注册）选项进行操作。\n\n需要注意的是，品牌审核周期通常为 2 至 4 周。审核通过后，你可以获得品牌保护以及品牌广告（Display）的投放权限。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-16 14:30:14","用户":"狗不吃你","群":"","用户问询":"我的店铺已经申请为官方品牌店，为什么没有品牌广告的投放权限","AI响应":"你好！品牌备案审核通过后，通常需要 2至4周 才能获得品牌广告（Display）的投放权限。\n\n如果您的官方品牌店已经申请成功且超过 4 周仍未获得权限，请按 “【品牌审核跟进】+店铺名+ID” 的邮件标题格式联系您的客户经理，或联系官方客服进行催促。\n\n此外，请确保您的店铺满足以下激活条件：\n1. 店铺信誉等级为绿色。\n2. 店铺内至少有三条在售商品。\n3. 在广告经营范畴中归属头部客户。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-16 11:25:27","用户":"狗不吃你","群":"","用户问询":"我已经满足了品牌广告的要求，在哪里可以查看品牌广告入口","AI响应":"...你好！品牌广告入口位于卖家中心后台。如果您在后台找不到具体的品牌入口位置，建议您联系我们的客服或者在后台开Case咨询，他们会指导您找到正确的操作位置。关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-14 18:49:24","用户":"波波波pewpewpew突突突","群":"","用户问询":"如果对方也有品牌授权的话两个相同的产品会被归类到一起吗","AI响应":"不会。美客多目前没有类似亚马逊的“跟卖”机制，即使是相同品牌和产品，不同卖家上传的Listing也是相互独立的，不会被归类或合并在一起。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-13 15:16:34","用户":"Charlene-Fulinda mic","群":"","用户问询":"半托管买家可以看到我们品牌主题吗 .联系到我们吗","AI响应":"你好！很高兴为你解答。\n\n在半托管模式下，买家是可以感知到你的品牌和店铺存在的：\n\n1. 品牌展示：买家在商品详情页（Listing）可以看到你的品牌名称。如果你已经完成了品牌备案，还可以拥有品牌旗舰店的展示效果，这对于工厂型卖家建立品牌心智非常有帮助。\n\n2. 店铺信息：买家可以看到你的店铺名称和信誉评级。\n\n3. 联系沟通：买家可以通过平台自带的问答系统（Pre-sale questions）在下单前向你咨询产品细节。在订单完成后，如果涉及售后问题，买家也可以通过订单消息系统与你取得联系。\n\n总结来说，半托管模式保留了你作为卖家的“身份感”，买家知道是在向你买东西，你也可以通过优质的服务和品牌形象来积累忠实客户。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-13 11:39:46","用户":"子聪","群":"","用户问询":"请问，我们本本店铺的品牌认证怎么弄，我们弄了好几次都不行","AI响应":"你好，表里留下注册邮箱后，就可以咨询我入驻、选品以及运营相关的问题啦。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-19 13:54:54","用户":"c","群":"","用户问询":"已经有自发货店铺怎么上传品牌授权","AI响应":"你好！很高兴为你解答。\n\n你可以登录卖家后台，在导航栏中寻找 Listings 菜单下的 Brand Protection（品牌保护）或 Brand Registry（品牌注册）选项进行资料上传。\n\n如果你是需要加入品牌保护计划（BPP），可以直接访问官方自查与申请入口：https://brand-protection.mercadolibre.com/ \n\n请注意，品牌备案通常需要2至4周。通过后方可获得品牌保护及品牌广告（Display）权限。只有品牌旗舰店才能在listing的品牌字段填写该品牌。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-18 09:53:21","用户":"j、","群":"","用户问询":"品牌店开通了不会自动开通品牌广告的吗","AI响应":"你好！很高兴为你解答。品牌官方店开通后不会自动开通品牌广告。你需要满足至少三条在售商品、店铺绿色信誉等条件，并提供美金付款账户、联系人及投放配置信息，联系对接经理或通过特定流程申请激活。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-17 22:01:59","用户":"问道","群":"","用户问询":"是一级授权，是否可以填写品牌名称？","AI响应":"你好！很高兴为你解答。\n\n虽然你拥有一级授权，但由于该品牌并未在销售目的国注册，目前无法在平台完成品牌备案。\n\n最近平台在严查品牌侵权，对于没有做品牌备案的店铺，后台上架产品时，在【品牌】字段处请填写通用，不要填写具体的品牌名称。如果直接填写品牌名称，会被系统抓取并判定为侵权，从而导致产品下架或店铺受损。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-17 10:39:05","用户":"时倾","群":"","用户问询":"就是你们现在还不能有品牌官方店吗","AI响应":"你好！很高兴为你解答。现在没有local品牌不能注册官方店。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-17 09:44:46","用户":"joker","群":"","用户问询":"普通品牌的足球鞋，品牌需要怎么填写","AI响应":"如果您的产品没有品牌或属于普通无品牌商品，在上传时品牌（Brand）字段必须填写 Generic。请勿在品牌、型号或制造商字段填写未获得授权的品牌名，以免被系统判定侵权。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-16 14:58:52","用户":"Echo","群":"","用户问询":"申请成为品牌旗舰店键鼠类目有什么要求","AI响应":"申请品牌旗舰店通常需要满足以下条件：\n1. 必须已成功加入品牌保护计划（BPP）。\n2. 店铺信誉等级为绿色。\n3. 键鼠类目需提供该品牌在销售目的国的商标证书（R标）。\n4. 半托管或全托管模式仅限申请一个。\n\n具体申请请联系您的客户经理，由经理评估店铺表现及品牌影响力后协助开通。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-16 14:58:03","用户":"Echo","群":"","用户问询":"申请品牌保护需要店铺销售额和单量有要求吗","AI响应":"申请品牌保护计划对店铺的销售额和单量没有硬性要求。只要您拥有销售目的国的有效商标证书（R标）或相关授权，即可按流程提交申请。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-16 14:43:37","用户":"狗不吃你","群":"","用户问询":"申请品牌店之后还可以做什么操作来提升店铺的流量","AI响应":"你好！申请品牌店后，你可以通过以下操作进一步提升店铺流量：\n\n1. 完善店铺装修：使用My Page店铺装修工具，在Header下方添加横幅（Main banner）展示品牌故事、活动或爆品。建议按照“促销>>分类>>产品”的顺序布局，打造场景营销。\n\n2. 使用Clips短视频：这是目前非常推荐的工具，能直接增加曝光入口，直观展示产品功能，帮助销量提升。\n\n3. 开启广告工具：利用品牌推广广告和竞价广告撬动流量，实现搜索排名和出单的突破。\n\n4. 参加平台活动：积极提报DoD、LD、rebate等促销活动，利用大促流量红利实现销量增长。\n\n5. 优化Listing：确保每个产品有3张以上高质量图片，全方位展示细节，并持续优化标题和关键词。\n\n6. 提升品类权重：通过持续的广告投放和Listing优化，增加被搜索关键词搜到的次数，解锁更多品类专属流量。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-16 11:23:47","用户":"狗不吃你","群":"","用户问询":"你好，我需要怎么做才能开启品牌店铺广告呢","AI响应":"...你好！首次激活美客多品牌广告需要具备以下条件：拥有美客多品牌官方店铺，店铺内至少有三条在售商品，店铺信誉等级为绿色，并且在广告经营范畴中归属头部客户。关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-15 16:24:48","用户":"wydsn","群":"","用户问询":"是否可以针对竞争对手的品牌名称投流？","AI响应":"视情况而论，可参考下图：\nhttps://file.marsmind.cc/boot-admin/mercado/20260715/2077293749856690178.jpg","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-15 16:16:41","用户":"David Xu","群":"","用户问询":"是否可以针对竞争对手的品牌名称投流？","AI响应":"视情况而论，可参考下图：\nhttps://file.marsmind.cc/boot-admin/mercado/20260715/2077293749856690178.jpg","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-15 16:16:39","用户":"David Xu","群":"","用户问询":"是否可以针对竞争对手的品牌名称投流？","AI响应":"不可以。美客多品牌广告不支持针对竞争对手的品牌名称进行投流。\n\nhttps://file.marsmind.cc/boot-admin/mercado/20260715/2077293749856690178.jpg","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-15 16:16:19","用户":"David Xu","群":"","用户问询":"创建美客多品牌广告需要提供哪些信息？","AI响应":"创建品牌广告需提供：美金付款银行账户，账单联系人、邮箱及电话。此外需配置品牌名称、官方店/落地页链接、投放周期、预算及投放方式（手动投放需提供商品和关键词）。\n\nhttps://file.marsmind.cc/boot-admin/mercado/20260715/2077297883590746113.jpg","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-15 16:15:49","用户":"David Xu","群":"","用户问询":"是否可以针对竞争对手的品牌名称投流？","AI响应":"视情况而论，可参考下图：\nhttps://file.marsmind.cc/boot-admin/mercado/20260715/2077293749856690178.jpg","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-15 16:15:23","用户":"David Xu","群":"","用户问询":"是否可以针对竞争对手的品牌名称投流？","AI响应":"不可以。美客多品牌广告不支持针对竞争对手的品牌名称进行投流。\n\nhttps://file.marsmind.cc/boot-admin/mercado/20260715/2077293749856690178.jpg","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-15 16:13:50","用户":"David Xu","群":"","用户问询":"是否可以针对竞争对手的品牌名称投流？","AI响应":"不可以。美客多品牌广告不支持针对竞争对手的品牌名称进行投流。\n\nhttps://file.marsmind.cc/boot-admin/mercado/20260715/2077293749856690178.jpg","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-15 16:07:54","用户":"David Xu","群":"","用户问询":"美客多品牌广告优化时需要关注哪些信号指标？","AI响应":"美客多品牌广告优化时需要关注以下信号指标：\n\n1. Budget Losses：因预算不足导致的曝光受限。\n2. Losses Due to Ranking：因排名不足导致的曝光受限，此时需要考虑提高CPC出价和商品的CVR。\n\nhttps://file.marsmind.cc/boot-admin/mercado/20260715/2077294571864776706.jpg","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-15 16:02:35","用户":"David Xu","群":"","用户问询":"品牌广告是否仅适合比较大的品牌？","AI响应":"不是，品牌广告适用于所有符合条件的品牌广告主。它的适用场景非常广泛，包括强化特定品类或产品线的销售、提升品牌知名度并为官方店铺引流、增强新品发布的考虑度，以及在促销活动中提升曝光。此外，你还可以利用品牌广告在关键词上挑战竞争对手、突出产品卖点，或为排名较低的通用产品争取更多曝光。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-15 16:02:20","用户":"David Xu","群":"","用户问询":"创建美客多品牌广告需要提供哪些信息？","AI响应":"创建品牌广告需提供：美金付款银行账户，账单联系人、邮箱及电话。此外需配置品牌名称、官方店/落地页链接、投放周期、预算及投放方式（手动投放需提供商品和关键词）。\n\nhttps://file.marsmind.cc/boot-admin/mercado/20260715/2077297883590746113.jpg","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-15 16:00:37","用户":"David Xu","群":"","用户问询":"品牌广告的投放模式是否有不同选择？","AI响应":"请参考此图:\nhttps://file.marsmind.cc/boot-admin/mercado/20260715/2077296555204337666.jpg","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-14 23:53:08","用户":"joker","群":"","用户问询":"销售不是品牌的足球鞋，需要注意什么","AI响应":"卖家您好，销售非品牌足球鞋需注意：\n1. 严禁侵权：确保产品外观、Logo及描述不侵犯知名品牌（如耐克、阿迪达斯等）的知识产权。\n2. 属性填写：品牌属性请填写“Generic”或“Generic Brand”，切勿乱填。\n3. 图片合规：实拍图不可出现任何品牌标识或经过遮挡的痕迹。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-14 16:03:21","用户":"东","群":"","用户问询":"可以查侵权的 网址发一下 查侵权的 网址发一下","AI响应":"你可以通过以下官方渠道查询商标、专利等信息，以规避侵权风险：\n\n1. 世界知识产权组织（WIPO）：https://www.wipo.int/reference/en/\n2. 墨西哥工业产权局（IMPI）：https://www.gob.mx/impi\n3. 巴西国家工业产权局（INPI）：https://www.gov.br/inpi/pt-br\n4. 美国专利商标局（USPTO）：https://www.uspto.gov/\n\n在选品时，请务必确保产品不涉及品牌侵权、外观侵权或专利侵权。如果产品包含知名IP元素（如迪士尼、漫威等），必须获得品牌方的正式授权。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-14 09:37:53","用户":"波波波pewpewpew突突突","群":"","用户问询":"做了品牌备案后还可以使用自发货吗","AI响应":"可以的。品牌备案与物流模式无关，完成品牌备案后，您依然可以根据业务需求选择使用自发货模式或海外仓模式。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-18 09:44:17","用户":"j、","群":"","用户问询":"我的品牌店是美标的符合资质吗","AI响应":"你好！很高兴为你解答。只要你拥有品牌官方店且店铺信誉为绿色，即符合申请品牌广告的资质。平台支持卖家通过品牌旗舰店和品牌推广广告等工具进行推广。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-18 09:40:59","用户":"j、","群":"","用户问询":"会有单独的品牌广告的窗口吗","AI响应":"你好！很高兴为你解答。品牌广告没有单独的入口，它集成在卖家后台的广告中心（Advertising Center）内。你可以通过广告后台设置预算，平台会根据你的设置自动调整投放。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-18 09:38:43","用户":"时倾","群":"","用户问询":"就是说品牌官方店怎么做","AI响应":"现在没有local品牌不能注册官方店。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-17 19:56:08","用户":"蓝七","群":"","用户问询":"没有品牌填写什么？","AI响应":"你好！如果您的产品没有品牌，在上传商品填写品牌（Brand）字段时，请务必填写 Generic。这样可以避免因未备案而产生的侵权风险。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-17 18:06:38","用户":"肖丽娟｜Sherilyn@大数跨境","群":"","用户问询":"可以用美国R标做品牌备案吗","AI响应":"你好！很高兴为你解答。\n\n在美客多进行品牌备案，需要提供在销售目的国（如墨西哥、巴西等）注册成功的商标证书（R标）。\n\n目前平台不支持直接使用美国商标在墨西哥或巴西等站点进行品牌备案。如果您希望在对应站点获得品牌保护及广告投放权限，建议您在销售目的国当地注册商标。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-16 22:31:49","用户":"Echo","群":"","用户问询":"申请成为品牌旗舰店需要销售额吗","AI响应":"申请品牌官方旗舰店对销售额没有明确的数额要求，但绿色信誉是必备条件。此外，官方旗舰店的申请由客户经理根据品牌影响力和店铺表现进行综合评估。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-16 14:28:41","用户":"狗不吃你","群":"","用户问询":"品牌广告需要怎么申请","AI响应":"你好！首次激活美客多品牌广告需要具备以下条件：拥有美客多品牌官方店铺，至少有三条在售商品，店铺信誉等级为绿色，并且在广告经营范畴中归属头部客户。\n\n如果您尚未完成品牌备案，需要准备以下核心材料：\n1. 商标证书：提供在销售目的国注册成功的商标证书（R标）。\n2. 品牌授权书：若非商标所有人，需提供正式授权书。\n3. 产品实物图：带有品牌 Logo 的产品实物照片。\n4. 品牌信息：品牌名称、所属类目等。\n\n备案流程通常需要2至4周，审核通过后即可获得品牌广告（Display）的投放权限。\n\n网页参考资料：\nhttps://mp.weixin.qq.com/s/ERWrC_KNnIdUDLBqHQEJZQ\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-16 13:30:38","用户":"Echo","群":"","用户问询":"好的，本土账号怎么申请品牌保护","AI响应":"本土账号申请品牌保护，请直接登录卖家后台，通过 Brand Protection 页面提交商标证书和产品图。审核时间通常为 5 个工作日。若在后台找不到入口，建议联系后台客服开 Case 咨询具体操作位置。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-16 11:35:01","用户":"狗不吃你","群":"","用户问询":"品牌店的流量优势体现在哪里","AI响应":"你好！绿色信誉是申请品牌官方店的必备条件。品牌官方店在流量和运营方面具有显著优势，主要体现在：Full仓（海外仓）模式下物流时效快，能显著缩短配送时间，提升买家购物体验，减少物流延迟导致的投诉。同时，品牌店拥有更高的转化率，因为买家更倾向于购买配送速度快的商品，非常适合有一定销售规模、需要快速响应市场的卖家。关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"}]}],"top100_wow":[{"一级大类":"其他","二级子类":"其他","Past 7 Days":2454,"Previous 2026-07-06 to 2026-07-12":2687,"Change":-233,"WoW":-0.0867138072199479,"Past 7 Share":0.3562200609667586,"高频问题":"其他具体问题","__details":[{"时间":"2026-07-18 20:58:42","用户":"兔","群":"","用户问询":"{\"coverImageId\":\"306c0201020465306302010002045bb32c5502031e9038020469c7f46d02046a5b78800436313533383436383934395f313538323835333730385f643739343661306531396631643062656336353337386464656363623038333502031038000202519004000201010201000400\",\"appName\ 易碎品限制。建议直接使用这个版本尝试上架。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-17 09:12:34","用户":"泽创-刘奕鸿 18922412549","群":"","用户问询":"我们的产品是成分是 nylon+spandex 但是洗水标为了方便全球售卖，统一改为 polyamide+elastane 这个对销售有影响吗","AI响应":"没有影响。Polyamide（聚酰胺）是 Nylon（尼龙）的学名，Elastane（弹性纤维）是 Spandex（氨纶）的学名，这些表达在拉美市场是通用的，符合洗水票成分标注要求。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-16 19:09:30","用户":"左右","群":"","用户问询":"你好，我再问一下这个商品的重量或者体积，比如我填写的比实际的体积重量要大，但是实际没有那么大，那么按照的是实际重量体积，还是填写的重量体积？？","AI响应":"你好！很高兴为你解答。\n\n运费是根据商品的实际重量（包含商品及其包装）计算的。建议你准确填写，如果填写的尺寸或重量与实际不符，可能导致运费计算不准。若反复出现申报不符，可能会导致额外收费或账户被暂停。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-15 20:35:43","用户":"大大大明","群":"","用户问询":"Cuadro La Última Cena Relieve 3D Resina Colgar o Apoyar 30cm这个怎么样","AI响应":"你好！很高兴为你解答。\n\n这个标题写得非常好，非常符合墨西哥买家的搜索习惯。\n\n**优点分析：**\n1. **关键词精准**：La Última Cena 是核心流量词，Relieve 3D 突出了产品最大的视觉卖点。\n2. **功能明确**：Colgar o Apoyar（可挂可摆）直接解决了买家对安装方式的顾虑，是极佳的转化点。\n3. **规格清晰**：30cm 让买家一眼确认尺寸是否符合需求。\n\n**小建议：**\n上传时建议去掉 **Ú** 上的重音符号，改为 **Ultima**。虽然西语语法需要重音，但为了避免部分系统识别乱码或搜索匹配兼容性，使用无重音的纯英文字符往往更稳妥。\n\n**最终建议版本：**\nCuadro La Ultima Cena Relieve 3D Resina Colgar o Apoyar 30cm","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-15 15:53:21","用户":"*****************】","群":"","用户问询":"你好，我是自己家有童鞋工厂，是有做SHEIN的全托管，流水是够的，但是我SHEIN的主体是个体的执照，有什么办法可以下全托的店铺吗？","AI响应":"全托管模式要求提供流水的店铺主体必须与入驻的营业执照一致，且营业执照上的法人需与身份证一致。目前规则要求主体绑定关系明确，建议您使用与流水证明一致的主体进行申请。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-19 17:14:14","用户":"纳洛童","群":"","用户问询":"Kpop 的 cos 备货到半托管店铺推荐哪些款，尺码 110，120，130，140，150，160 这些码数推荐先备哪些？","AI响应":"你好！很高兴为你解答。Kpop 风格的 COS 或演出服在拉美市场非常受欢迎。\n\n**款式推荐：**\n1. **经典打歌服**：推荐黑色、银色或粉色系的亮片、皮革材质套装，这类风格在巴西等站点极具人气。\n2. **学院风套装**：百褶裙配短款西装或背心，是 Kpop 风格的常青款。\n3. **高街工装风**：宽松工装裤配紧身短上衣，符合拉美买家的审美。\n\n**尺码备货建议：**\n针对 110-160 码数，建议优先备货 **130、140、150** 这三个码数。\n*   **原因**：这三个尺码覆盖了 8-12 岁左右的青少年群体，是 Kpop 粉丝最集中的年龄段，也是此类服装的需求核心区。\n*   **策略**：首批备货可以按 130-150 码作为主力，120 和 160 少量测款，110 码需求相对较小，可延后考虑。\n\n**特别提醒**：\n*   **尺码表**：务必在 Listing 中提供详细的厘米（cm）对照表，因为拉美孩子体型差异较大。\n*   **合规性**：确保服装上没有韩国知名团体的 Logo 或受版权保护的特定标志，以防侵权。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-15 13:21:44","用户":"XIAOMEI","群":"","用户问询":"您好，最近平台连续取消我好多的订单是平台出现什么问题吗？我连客服员工都找不到，根本就没有人处理平台的问题。真是让我们的体验感差","AI响应":"您好！非常理解您的焦虑，订单被连续取消确实会严重影响店铺经营体验。\n\n关于订单被取消，通常有以下几种常见原因：\n1. 买家端问题：买家主动申请取消，或者支付环节出现异常导致系统自动拦截。\n2. 平台风控：平台系统检测到订单存在欺诈风险或异常交易，为了保护卖家利益会自动关闭订单。\n3. 物流时效：如果是自发货订单，若未在规定时间内上传单号或点击发货，系统也会自动取消。\n\n针对您无法联系到客服的问题，请按照以下步骤操作：\n1. 呼叫人工：请在后台右上角的“？”→“Need Help”中，直接在对话框向 Seller Assistant 输入您的人工服务需求。\n2. 选择方式：收到机器人回复后，点击转接卡片。目前提供 CHAT（在线聊天）和 Email（邮件）两种方式。如果 CHAT 选项是灰色的，说明当前排队人数较多，建议您直接选择 Email 提交问题，并附上被取消订单的截图和订单号，客服会进行核查。\n3. 语言建议：请务必使用英语进行交流，这样能更快速地得到处理。\n\n平台对买家取消订单有处理规定，如果是由于系统原因导致的异常，建议您尽快通过上述路径开 Case 申诉，以免影响您的店铺信誉指标。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-14 10:40:26","用户":"Sally","群":"","用户问询":"你好，现在有很多全托管和半托管的业务，我想问下这种模式对我们做美国转运仓的卖家冲击大吗？我该如何构建自己的竞争力而不被瓜分市场","AI响应":"全托管和半托管主要针对工厂和品牌方，由平台统一运营或深度控价。美国转运仓卖家的核心竞争力在于：\n\n1. 选品灵活性：利用“一仓发五国”优势，快速测试多站点爆款，降低单站点库存风险。\n2. 自主定价权：相比全托管，您能根据利润目标灵活调价，自主掌控营销节奏。\n3. 差异化选品：避开全托管集中的高频标品，深挖长尾、个性化或需精细化运营的类目。\n\n建议采取多款式、轻库存策略，利用美国转运仓无需RFC税号的合规优势，快速覆盖拉美多国流量。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-13 10:16:56","用户":"纯属巧合","群":"","用户问询":"你好， 半托管国内需要缴税吗？ 具体是要怎么缴？ 税局是根据哪些数据核算税费， 这些数据是通过什么形式发给税局？","AI响应":"你好！很高兴为你解答。\n\n关于墨西哥RFC税务政策，根据墨西哥政府最新税务法规要求，自2026年1月1日起，所有电商平台须按新标准执行增值税及所得税的预扣缴义务。\n\n1. RFC税号缺失的影响\n未提供RFC税号不影响您在美客多平台的现有销售权限。但依据新规，若未能按时上传有效RFC税号，平台将依法对您的墨西哥销售额按36%的税率实施强制预扣税。\n\n2. 适用范围\n本政策目前适用于通过墨西哥海外仓进行销售的订单，即所有存储于墨西哥境内的商品所产生的销售额（自发货不适用，自发货不需要税号）。自2026年1月1日起，上述范围商家如未上传有效RFC税号，平台将按上述税率执行预扣。\n\n3. RFC税务制度与预扣税率对应关系\n根据您登记的RFC类型及收款账户性质，平台将适用不同预扣税率，具体如下：\na. 已上传墨西哥本地RFC税号 + 使用本地收款账户：总预扣税率为10.5%\nb. 已上传墨西哥本地RFC税号 + 使用海外收款账户：总预扣税率为18.5%\nc. 已上传海外RFC税号 + 使用本地或海外收款账户：总预扣税率为16%\nd. 未上传任何RFC税号：总预扣税率为36%\n\n4. 税费核算与申报\n平台会根据您在墨西哥境内的实际销售额数据进行税费预扣。如您尚未注册RFC税号或需进一步了解相关税务细节，建议及时咨询专业税务代理服务机构，以确保合规经营。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-19 18:34:37","用户":"爱老虎呦🐯","群":"","用户问询":"仅有贸易零售和批发可以吗。进出口我们这边没有海关，办理进出口手续慢，难。等着之后做起来了再添加可以吗","AI响应":"可以的。只要经营范围中包含“贸易”、“零售”或“批发”等具备货物贸易属性的字样即可，不强制要求必须包含“进出口”。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-18 11:15:55","用户":"几木晴天","群":"","用户问询":"那就先不用管 等后面需要在去提交 感谢 对了 产品我只需要上到一个站点 他就会同步到其他站点对吧","AI响应":"是的。美客多跨境店支持一个账号开通所有站点，开店做自发货时，其他站点都是自动开通的，你可以同时在巴西、墨西哥、智利等五大站点销售。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-17 17:32:27","用户":"企业微信团队","群":"","用户问询":"你的账号进行了网站登录操作 登录网站：微盛·企微管家 登录时间：2026年07月17日17:32","AI响应":"收到。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-17 09:13:33","用户":"泽创-刘奕鸿 18922412549","群":"","用户问询":"洗水标是 polyamide+elastane，详情成分我们写的是 nylon+spandex 有影响吗","AI响应":"建议保持一致。虽然含义相同，但为避免买家因“产品和描述不一致”发起投诉影响购物体验分，建议将详情描述中的成分修改为与洗水标一致的Polyamide和Elastane。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-15 16:24:11","用户":"辽宁～刘工","群":"","用户问询":"我是锦州金之渊科技有限公司，这里是否填中国辽宁锦州金之渊科技？需要加中国辽宁等字样么？用中文还是英文？","AI响应":"Business Name请填写您营业执照上的公司中文全称：锦州金之渊科技有限公司。请务必确保填写的名称与营业执照上的文字完全一致。来源地请根据营业执照签发地选择对应的地区。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-15 13:36:46","用户":"XIAOMEI","群":"","用户问询":"您好，请问一下还有没有其他的联系方式，刚刚打了白班的电话，他说他已经辞职了，还有没有其他的联系方式麻烦提交我","AI响应":"非常抱歉，由于信息更新可能存在延迟，给您带来了不便。\n\n目前我这里掌握的东莞仓其他联系方式如下：\n\n李达红（晚班）： +86 18825215759\n\n如果是关于托管备货仓（全托管/半托管）的业务，请联系：\n叶宗虎：18025233509\n\n您可以尝试拨打李达红或叶宗虎的电话进行咨询。非常抱歉，目前我的信息中暂无其他新增的联系人，我会尽快反馈并更新相关信息。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-14 20:22:31","用户":"柯培鑫","群":"","用户问询":"美客多全托管模式是不是只能做墨西哥市场？巴西市场能不能做，还是说又要单独开一个全托管店铺才能做巴西市场","AI响应":"目前美客多的全托管模式已经覆盖了**墨西哥、巴西、智利、哥伦比亚、阿根廷**这五个站点。\n\n但是，全托管模式并不是通过一个店铺同时卖向所有国家，而是需要**分站点运营**。如果你想做巴西市场，确实需要根据平台的招商计划和要求，针对巴西站点进行申请或开通。\n\n**关于全托管站点的说明：**\n1. **独立性**：每个国家的市场环境、准入门槛和物流链路不同，因此全托管业务在不同国家是分开管理的。\n2. **巴西市场**：巴西全托管已经开通，但巴西站点的清关和税务政策与墨西哥不同，具体的入驻条件和选品要求建议你联系你的客户经理进行详细确认。\n3. **货权与库存**：由于全托管是供货模式，你的货物需要发往国内集货仓，平台会根据不同站点的需求进行分发和销售。\n\n如果你目前已经有墨西哥的全托管意向或店铺，想要拓展巴西市场，可以向平台经理表达增开巴西站点的意愿。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-14 14:57:19","用户":"Frank","群":"","用户问询":"你好，经理，我的店铺cust id 680808590，由于国内主体要注销，现在申请更换绑定主体。","AI响应":"你好！很高兴为你解答。关于更换绑定主体的问题，目前我的知识库中没有直接的操作路径。建议你联系对应的客户经理或通过卖家后台开case咨询，由平台工作人员核实具体情况并提供处理方案。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-14 14:18:38","用户":"-Tatsu 🐶","群":"","用户问询":"{\"realName\":\"\",\"corpId\":0,\"avatarUrl\":\" 你可以添加这个人吗","AI响应":"你好！很高兴为你解答。我无法主动添加个人微信，建议您将我的名片或对话链接直接分享给对方，由他发起咨询即可。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-13 11:51:38","用户":"周政翔","群":"","用户问询":"Hubo un error accediendo a esta pagina... 为什么歧视中国","AI响应":"你好！美客多非常欢迎中国卖家入驻，绝不存在歧视。你遇到的报错通常是由网络环境或浏览器兼容性引起的。建议优先使用Chrome浏览器并清除缓存或使用无痕模式，并务必关闭网页自动翻译功能。若仍失败，请尝试更换设备或切换网络环境重试。目前人工咨询量巨大，请见谅。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-13 10:17:35","用户":"企业微信团队","群":"","用户问询":"你的账号进行了网站登录操作 登录网站：微盛·企微管家 登录时间：2026年07月13日10:17","AI响应":"收到。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-18 19:43:05","用户":"十月","群":"","用户问询":"也是一致的，好像都是一致的啊，怎么后台还是说我不通过，我联系在线客服问也说我数据不一致","AI响应":"你好！目前无法直接判断具体原因。既然您已核实一致但客服仍反馈不符，建议您再次仔细比对 CSF 文件中的邮编、街道地址等细节是否与后台完全重合。若确认无误，建议通过后台 Case 附上 CSF 文件截图，请工作人员明确指出具体哪项数据不一致。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-17 17:26:23","用户":"ㅤ  ㅤ","群":"","用户问询":"那么如何判断是否属于菜鸟揽收范围呢是根据菜鸟的城市定点还是根据什么 免费的揽收范围","AI响应":"你好！很高兴为你解答。你可以通过菜鸟揽收范围查询链接，输入详细地址核实是否在服务范围内。此外，也可以拨打对应城市的仓库电话进行确认。\n\n网页参考资料：\nhttps://gpn.cainiao.com/global/portal/productservice?slug=af63clngtvt0ggps","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-17 15:05:11","用户":"Chen🍊","群":"","用户问询":"1我就是用谷歌浏览器的 然后，我如果没有登录账号，他是我点到别人的产品那里，他就不让我继续看了","AI响应":"你好！很高兴为你解答。如果前台限制浏览，请尝试以下操作：1. 清除浏览器缓存或换用无痕模式。2. 切换至稳定的网络环境。3. 务必关闭网页自动翻译功能，该功能常导致页面加载异常。若仍无法查看，建议通过前台 Help 中心反馈。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-17 11:18:27","用户":"'Mint","群":"","用户问询":"我可后台选Pickup，但是时间是自寄吗 我可后台选Pickup，但是实际是自寄吗","AI响应":"可以。若后台分配了菜鸟物流，你可以选择卖家自寄（Drop Off）模式，将包裹自行送至菜鸟指定的国内扫码仓，运费需自行承担。建议在后台设置中确认发货方式为自寄。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-15 15:50:30","用户":"*T","群":"","用户问询":"我已经有了 CBT 墨西哥店铺 运营 1 年了 想找到我的客服经理请问该如何联系？","AI响应":"若店铺已审核通过，运营经理通常会通过邮件、电话或微信主动联系您，请查看审核通过邮件中的联系方式。技术问题可通过后台右上角问号图标联系在线客服。若需更精准的扶持，可关注美客多高阶卖家成长服务。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-15 14:45:33","用户":"DD.","群":"","用户问询":"你好 我认为我的店铺模式适合半托管 可以邀请我开通吗 我在速卖通做的就是半托管 我的备货量充足","AI响应":"你好！很高兴为你解答。\n\n如果你想要申请入驻美客多托管模式，请您先登记入驻申请问卷，统一提交这个表单：http://kks.ink/ss/vKx9ph/d12030。\n\n目前半托管模式的入驻要求和流程如下：\n1. 资质要求：支持中国大陆或香港公司主体入驻，暂不支持个体户。具备跨境电商经验。\n2. 审核流程：已填写问卷且符合项目画像的商家，买手和客户经理都会通过微信或者电话联系您，请务必保持预留联系方式的通讯畅通。\n3. 审核时效：因目前商家登记数量较多，客户经理将逐一按批次联系，预计时效为20-30个工作日。\n\n入驻沟通进度可点击此链接查询：https://mercadolibre.cn/seller/info?id=478&type=consignment","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-15 09:13:52","用户":"Star Chow","群":"","用户问询":"为什么这种订单会超过48h后，平台还会取消？这样卖家的货如果发出，退不回，不就是损失吗？","AI响应":"自发货48小时时效是指物流商揽收并扫描的时效。即便已揽收，若包裹在后续运输中被检测出违禁、超材或清关异常，平台为保障买家体验会强制取消订单并作废包裹。若包裹已被作废，通常无法退回，建议联系客服核实异常详情以减少后续损失。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-13 13:59:11","用户":"Felicity 103%","群":"","用户问询":"我的公司名为：莆田市艾迈逊贸易有限公司 已申请了半托店与FTI店，有43天了还未收到消息","AI响应":"你好！很高兴为你解答。\n\n已填写问卷且符合项目画像的商家，买手和客户经理会通过微信或电话联系，请保持通讯畅通。目前登记数量较多，客户经理正按批次联系，预计时效20-30个工作日。\n\n由于你已等待超过40天，建议私聊将公司名和登记邮箱发给你的对接经理帮忙跟进进度。感谢你的理解与等待！","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-18 17:00:06","用户":"KIM","群":"","用户问询":"A电脑登陆店铺后台 B电脑开VPN用于看美客多官网选品 网络固定同一个。","AI响应":"只要不使用VPN登录店铺后台，通常不会产生影响。平台主要风控的是登录后台的IP环境，建议操作后台的电脑保持网络环境纯净。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"}]},{"一级大类":"财税合规","二级子类":"税务合规","Past 7 Days":688,"Previous 2026-07-06 to 2026-07-12":480,"Change":208,"WoW":0.43333333333333335,"Past 7 Share":0.0998693569458557,"高频问题":"RFC/税号/扣税政策","__details":[{"时间":"2026-07-17 15:30:50","用户":"张志明","群":"","用户问询":"你好 想咨询一下RFC问题，在跨境店的RFC是本土店的税号，第一次签署的时候，有邮件发来：您账户中登记的RFC信息与您所代表的法人实体信息不符。 后续第二次签署的时候，我们更换了另外一个本土店的税号，可以找得到人，但是更换税号后，一直没有签署文件发过来。这该怎么办？","AI响应":"你好！很高兴为你解答。\n\n针对你提到的RFC税号主体不一致以及更换税号后未收到签署文件的问题，处理流程如下：\n\n关于税号主体不一致的解决方式：\n美客多近期针对“店铺注册主体”与“卖家后台所绑定RFC税号主体”不一致的海外仓卖家开展一致性验证工作。你需要使用此前提交CSF文件时登记的邮箱，登录并签署官方通告邮件中的《RFC知情授权书》，确认RFC所有人已充分知晓并正式授权该税号用于您的跨境店铺。\n\n关于更换税号后未收到签署文件：\n如果你在后台提交了RFC变更申请，请确保新RFC对应的CSF邮箱是有效的。平台会通过邮件向需验证卖家发出通告。签署流程通常是：签署完成后，你的卖家注册邮箱会即刻收到第二封邮件，用于核实并确认你的CSF邮箱信息。在确认CSF邮箱信息成功后，你的CSF邮箱才会收到对应的授权信，请登录该CSF邮箱点击并完成签署。\n\n建议你立即自查：\n1. 登录卖家后台，核实当前绑定的RFC税号主体是否已更新。\n2. 检查新RFC对应的CSF登记邮箱，确认是否漏掉了平台发送的验证邮件。\n3. 如果需要变更RFC，请确保在后台提交变更申请并提供新的RFC及对应的CSF。\n\n请务必在规定时间内完成验证。若未能完成，自7月20日之后，店铺的预扣税率将被依法上调至36%。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-13 09:52:42","用户":"Cecelia","群":"","用户问询":"经理， Cust ID: 1541200487 邮箱： ，垃圾箱已经找过了，只有通知RFC等待验证的邮件，我们没有更新税号，税代可以配合处理，","AI响应":"你好！很高兴为你解答。平台会通过CSF登记邮箱发送相关邮件，请卖家按照邮件指引完成签署。请确保该邮箱有效并检查垃圾箱。若确实未收到，请准确填写【CSF邮箱查询信息登记表】查询。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-15 11:25:31","用户":"广告衫·服装定制 17620681808 周","群":"","用户问询":"您好 跨境店 自发货 需要准备 墨西哥 RFC 税号么？ 净收益定价 成本需要把税算进去么？ 除了墨西哥 其他站点需要扣税么？","AI响应":"你好！很高兴为你解答。\n\n关于你咨询的墨西哥跨境店自发货及税费问题，回复如下：\n\n1. 是否需要准备RFC税号\n自发货模式目前不需要绑定墨西哥RFC税号。RFC税号主要针对海外仓模式，自发货卖家目前不涉及墨西哥36%的增值税代扣。\n\n2. 净收益定价是否需要包含税费\n不需要。美客多自发货采用收益价格模式。你只需要在后台录入目标净收益（即：采购成本+利润），平台系统会自动叠加运费、佣金以及可能产生的相关税费生成最终售价，无需你人工计算并加入税费。\n\n3. 其他站点是否需要扣税\n在自发货模式下，其他站点的税费同样由平台系统处理。美客多为跨境卖家提供直邮解决方案，你只需将商品送达至平台指定的中国境内集运仓，后续的国际运输、清关及目的地派送由官方负责。相关进口税费通常由买家在下单时承担。\n\n网页参考资料\n墨西哥RFC税号相关信息：https://mp.weixin.qq.com/s/gLZ3iC9XLqFE4j075JaNSg?from=industrynews&version=4.1.22.6009&platform=win\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-13 10:20:50","用户":"哎嘿","群":"","用户问询":"如果这次美客多税号审核不通过坐等平台移除RFC税号，我能等自己税号下来之后再重新更新税号吗，还是需要自己主动解绑税号","AI响应":"如果您的RFC税号验证未通过，平台将遵从墨西哥税务法规要求，将相关账户的预扣税率上调至 36%。\n\n如果您需要变更RFC，请及时在后台提交变更申请，提供新的RFC及对应的CSF文件。请确保该新RFC对应的CSF邮箱有效性，以便能够接受并配合后续的验证信息。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-18 16:10:51","用户":"ㅤ  ㅤ","群":"","用户问询":"我的货要是在墨西哥别人的仓库呢是否需要RFC税号 是从墨西哥境内发货的跨境卖家都需要提供RFC税号吗","AI响应":"你好！只要货物存储在墨西哥境内并从当地发货，无论是在美客多官方仓还是第三方仓库，都需要绑定RFC税号。若未绑定，平台将面临36%的强制预扣税。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-17 15:49:50","用户":"Lyla 想小鱼🐟","群":"","用户问询":"这个邮箱，貌似是我们找的代理帮我们注册RFC的会计师邮箱，本来他们不提供这个邮箱，就算我们填了这个找到邮箱的话，是不是也需要那边配合才行？ 但是我有个疑问， 不配合的话，我店铺是不是也RFC审核不通过？","AI响应":"是的，必须确保CSF登记邮箱能收信并配合操作。如果未能通过该邮箱完成授权书签署，将导致RFC验证无法通过，届时店铺税率将上调至36%。若该邮箱无法使用，RFC所有者可通过登录墨西哥SAT官网更改关联的电子邮箱，具体操作建议咨询您的财税服务商。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-16 16:57:22","用户":"窦红建","群":"","用户问询":"这里的先绑定美金账号，再绑定墨西哥本土银行账号，是说在RFC没注册下来之前，先绑连连或pingpong的美金账号，RFC注册下来以后再换成墨西哥本土银行账号？还有一个问题，这里本土银行账号，对应的是我用来开店的公司主体，而不是要到墨西哥再注册一个公司？","AI响应":"你好！很高兴为你解答。\n\n关于你的两个疑问，详细说明如下：\n\n1. **绑定顺序与RFC的关系**：\n你的理解基本正确。在没有RFC税号的情况下，为了能正常回款并尝试规避高额代扣税，目前的实操方案是：先在后台绑定连连或PingPong提供的**非美国美金账号**，然后再绑定一个**墨西哥本土银行账号**（通常也是由第三方收款机构如PingPong、派安盈等提供的墨西哥比索收款账户）。\n当你的RFC税号正式注册下来并上传至后台验证通过后，你就不再需要通过这种“美金+本土”的组合来规避税收，而是直接进入合规纳税流程。\n\n2. **本土银行账号的主体问题**：\n不需要在墨西哥注册公司。这里提到的“墨西哥本土银行账号”，是指由第三方收款机构（如PingPong、连连、派安盈等）为你开店的**中国公司主体**代开的墨西哥比索（MXN）收款账户。\n这个账号的收款人信息依然是你用来开店的中国公司，它只是一个具备墨西哥本地清算能力的银行账号，用于接收美客多拨付的比索。\n\n**特别提醒：**\n首次绑定墨西哥本土收款账户的正确步骤是：务必先在国际收款绑定入口完成美元账户绑定，刷新后台弹出本土收款绑定的入口后，再进行本土收款账号的绑定。直接在国际收款入口绑定墨西哥本土账号是无效操作。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-15 23:18:34","用户":"TT","群":"","用户问询":"不好意思打扰了，就是 CBT 换绑这个 RFC 税号进行验证授权，然后姓名那里是填公司名称还是填法人的名字？","AI响应":"你好！很高兴为你解答。关于RFC知情授权书的签署，现有信息未明确提及姓名处应填写公司名称还是法人姓名。请按照平台发送至CSF登记邮箱的邮件指引完成签署。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-15 09:51:15","用户":"💚","群":"","用户问询":"新店铺上传了RFC税号已通过，但是一直没有收到税号主体不一致的邮件，20号后会被强制交税36%吗","AI响应":"你好！平台将于未来一周通过邮件向主体不一致的卖家发出通告。请务必关注提交CSF文件时登记的邮箱，并于7月20日前完成验证。若未按时完成，预扣税率将上调至36%。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-13 21:16:20","用户":"游济远","群":"","用户问询":"你好，又要打扰一下，还有三个问题，1. 中国大陆营业执照入驻德州转运仓，不需要办墨西哥税号？不办墨西哥税号的情况下，税费是多少呢？2. 注册入驻审核时间大概是几个工作日？3. 首批入住德州仓第一票货物是不是店铺激活后30天必须入仓，10SKU以上，并且总商品数量不少于600件。","AI响应":"你好！很高兴能为你服务，一点也不打扰。针对你的三个问题，解答如下：\n\n1. 税号与税费问题\n使用美国转运仓配送墨西哥不需要提供RFC税号。该模式属于跨境直邮，而非本土发货，因此不需要办理墨西哥属地化税务登记。关于税费，相应的进口税费由买家在下单时承担并支付，卖家可以有效避免复杂的税务预扣风险。\n\n2. 审核时间\n美客多的注册审核周期通常为20-30天。如果提交资料后等待时间超过20个工作日仍未更新，可以联系官方客服进一步查询。\n\n3. 首批入仓要求\n关于德州仓的首批入仓规则，目前官方资料中并未强制要求必须在30天内入仓或必须达到10个SKU及600件商品。不过，为了保证店铺的活跃度和经营效果，建议在账号激活后尽快安排发货上架。\n\n普通自发货/海外仓也可选择自注册（PC端登入）：https://global-selling.mercadolibre.com/landing/about\n\n入驻准备材料：\n1. 企业资质：中国内地或香港公司营业执照（不接受个体户，须是“有限公司”）。\n2. 法人信息：法人身份证，且法人需配合进行人脸识别认证。\n3. 收款账户：提供一个非美国境内的美元（USD）银行账户用以接收结算款项（如第三方收款账户）。\n4. 联系方式：准备谷歌邮箱、Outlook邮箱或阿里云邮箱（不接受163、QQ、新浪等国内邮箱），以及联系人电话。\n5. 品牌要求：如果是品牌店，还需提供R标或TM标。\n6. 唯一性：一套资料只能注册一个店铺，之前注册过美客多的信息不可重复使用。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-13 14:01:25","用户":"［ PuPu ]","群":"","用户问询":"您好，我想知道店铺的RFC税号如何更换呢，我将新的RFC税号文件上传后，总是会出现第二天再次让我上传的情况。","AI响应":"你好！很高兴为你解答。\n\n关于更换RFC税号的操作，请你登录美客多商户后台，点击“设置”（Settings）中的“销售偏好”（Selling Preferences），或通过下方链接直接提交：https://global-selling.mercadolibre.com/kyc/?initiative=cbt-fiscal-upgrade&amp;congrats=true&amp;landing=true 即可进行 RFC 的更换。\n\n针对你提到的上传后第二天又提示上传的情况，请务必注意以下几点：\n1. 收到验证邮件后，请先确认你当前准备绑定的RFC信息能通过一致性验证。若确认无法通过，请切勿开启验证流程，应先前往卖家后台更新RFC信息，并等待系统触发新的验证邮件。\n2. 请确保新RFC对应的CSF邮箱有效，能够正常接收并配合验证信息。\n3. 平台会针对主体不一致的卖家开展验证工作，请确保你使用的是此前提交CSF文件时登记的邮箱，登录并签署官方通告邮件中的《RFC知情授权书》。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-19 22:55:24","用户":"王雪云","群":"","用户问询":"你好， Editar shen zhen shi he feng wan li shi ye you xian gong si RFC更新，但我已经更新了，后台为什么不能解决。","AI响应":"你好！很高兴为你解答。目前无法直接判断后台未更新的具体 无论是美客多官方仓还是第三方海外仓）并进行销售，根据墨西哥税法，都需要绑定RFC税号。若未绑定，平台将按36%的税率进行代扣代缴。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-14 20:08:49","用户":"Chen","群":"","用户问询":"经理晚上好，我想请教个问题：就是我们RFC文件更新了对应的邮箱，签署授权的时候是填更新过后的邮箱吗，我看很多卖家也说更新过邮箱，签授权的时候填新邮箱直接说不一致不通过[發抖]","AI响应":"你好！很高兴为你解答。\n\n在进行RFC税号主体授权及一致性验证时，请务必使用此前提交CSF（Constancia de Situación Fiscal 纳税状况登记证明）文件时登记的邮箱，登录并签署官方通告邮件中的《RFC知情授权书》。\n\n如果您已经更新了RFC信息，请确保该新RFC对应的CSF邮箱有效性，以便接受并配合验证信息。收到验证邮件后，请务必先确认您当前绑定的RFC信息能通过一致性验证。若确认无法通过，请切勿开启验证流程，应先前往卖家后台更新RFC信息，并等待系统触发新的验证邮件。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-13 16:18:15","用户":"MGG","群":"","用户问询":"3162626272 3161702353 我想知道这两个店铺本次RFC审核是否闭环，是否完成全部内容了 我这边目前只收到了三方签署的邮件，但是还没收到最终平台确认的邮件，","AI响应":"你好！很高兴为你解答。\n\n非常抱歉，我无法通过你提供的店铺编号直接查询后台的实时审核进度或审核状态。\n\n关于你提到的RFC验证流程，根据你提供的图片内容和目前的进展，可以参考以下信息：\n\n1. 审核闭环标志\n图片中显示的“Your RFC has been validated”以及“There is nothing you need to do right now”是平台确认RFC验证成功的标准提示。如果你在邮件中收到了类似内容，说明该店铺的RFC知情授权书签署及主体一致性核验已完成。\n\n2. 邮件确认\n通常流程是：卖家完成三方电子签署 -> 平台进行内部核验 -> 平台发送最终验证成功的确认邮件。如果你目前只完成了签署，但尚未收到如图片所示的最终确认邮件，说明平台仍在核验过程中。\n\n3. 建议操作\n请持续关注CSF登记邮箱以及卖家后台的通知。如果核验通过，你会收到正式的确认邮件；如果资料有误或需要补充，平台也会通过邮件指引你下一步操作。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-13 12:41:29","用户":"牛奶","群":"","用户问询":"这些被多扣的税务，在我最后提交了RFC税号后，会不会可以申诉回来","AI响应":"现有信息未提及多扣税费是否可以申诉退回。建议您在成功绑定有效RFC税号后，联系平台后台或咨询专业税务代理确认相关政策。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-18 16:24:29","用户":"ㅤ  ㅤ","群":"","用户问询":"没有RFC税号的话这个扣36%从什么时候开始执行","AI响应":"你好！根据墨西哥政府最新税务法规要求，自2026年1月1日起，若未能按时上传有效RFC税号，平台将依法对您的墨西哥销售额按36%的税率实施强制预扣税。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-18 15:16:27","用户":"野海","群":"","用户问询":"美客多墨西哥站点注册海外仓，必须要提交墨西哥RFC税号资料吗","AI响应":"你好！很高兴为你解答。\n\n做美客多墨西哥官方海外仓模式是需要绑定境外RFC税号的。\n\n如果您暂时还没有RFC税号，可以先绑定美金账号，再绑定墨西哥本土银行账号，平台暂时不会代扣代缴，等申请到税号后再绑定即可。\n\n但需要注意的是，根据墨西哥政府最新税务法规要求，自2026年1月1日起，所有电商平台须按新标准执行预扣缴义务。如果您在2026年1月1日后仍未上传有效RFC税号，平台将依法对您的墨西哥海外仓销售额按36%的税率（16%增值税 + 20%所得税）实施强制预扣税。\n\n如果您选择的是自发货模式，则不需要提供RFC税号。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-18 09:47:56","用户":"Morii","群":"","用户问询":"我们的店铺是跨境店现在还挂着本土RFC税号有事吗","AI响应":"你好！很高兴为你解答。\n\n关于跨境店挂着本土RFC税号的情况，建议如下：\n\n对于跨境卖家，强烈建议选择离岸税号，其合规性与账户安全性最高。本土税号虽在部分环节税务成本较低，但面临极高的税务稽查与账号关联风险，极易导致店铺封禁及资金冻结。\n\n如果您的RFC税号主体与账号主体不一致，则需要完成一致性验证。7月20日之后，对于未能完成验证的店铺，平台将遵从墨西哥税务法规要求，将相关账户预扣税率上调至 36%，协助实现依法合规纳税。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-15 13:09:38","用户":"Jungle King    Jackie","群":"","用户问询":"不在墨西哥官方海外仓模式运营就可以不用RFC税号吧？","AI响应":"是的，自发货模式和美国转运仓模式不需要RFC税号。只有选择墨西哥官方海外仓（Full仓）模式才必须办理并绑定。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-14 18:49:31","用户":"hui","群":"","用户问询":"我已经上传新的RFC税号，目前还在审核中，请问需要几天审核","AI响应":"从您提供的图片来看，您的公司法律信息已批准，目前处于“全墨西哥RFC号正在验证中”的状态。\n\n关于RFC税号的审核时效，现有信息未明确提及具体的审核天数。建议您每日检查后台系统状态更新以及注册邮箱（包括垃圾邮件箱）的通知邮件。如果审核时间过长，您可以联系对应的招商经理或官方客服进一步查询进度。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-19 06:36:22","用户":"楊","群":"","用户问询":"你好 我后台上传RFC税号入口没了","AI响应":"你好，表里留下注册邮箱后，就可以咨询我入驻、选品以及运营相关的问题啦。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-18 19:04:28","用户":"十月","群":"","用户问询":"您好，这个可以帮我看下是什么问题吗，我不是很理解，说是数据不一致，是指哪个呢，和店铺不一致的话不是签署RFC知情授权书就可以了吗","AI响应":"你好！根据图片提示，数据不一致是指你提交的CSF文件信息与后台填写的RFC信息（如姓名、公司名称、税号、地址等）存在差异。请核实后台填写的每一项数据是否与CSF文件完全对应。若确认数据一致但仍被拒，建议联系对应工作人员核实。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-18 11:25:27","用户":"hui","群":"","用户问询":"我先开店，后期RFC税号下来了，再添加可以吗？","AI响应":"你好！可以的。\n\nRFC税号的添加不需要等产品上架出单，也不强制在开店初期就拥有。你可以在店铺开通后先正常经营，等后期申请到RFC税号了，再在后台提交相关信息进行绑定。\n\n如果你做的是美客多墨西哥官方海外仓模式，建议尽早准备。如果暂时还没有RFC税号，可以先绑定美金账号，再绑定墨西哥本土银行账号，平台暂时不会代扣代缴，等申请到税号后再补充上去即可。自发货模式则不需要税号。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-16 11:26:53","用户":"yea","群":"","用户问询":"RFC税号变更，需要提交什么文件到平台呢","AI响应":"如果需要变更RFC，请及时在后台提交变更申请，提供新的RFC及对应的CSF文件。请确保该新RFC对应的CSF邮箱有效，以便接收并配合验证信息。\n\n您可以通过以下链接直接提交或更新您的RFC信息（建议电脑端打开）：https://global-selling.mercadolibre.com/kyc/?initiative=cbt-fiscal-upgrade&congrats=true&landing=true","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-14 16:58:23","用户":"Mr.J","群":"","用户问询":"之前提交过RFC税号，现在是更新，可以吗","AI响应":"可以的。请通过链接 https://global-selling.mercadolibre.com/kyc/?initiative=cbt-fiscal-upgrade&congrats=true&landing=true 直接提交或更新您的RFC信息（复制链接在电脑端打开）。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-13 11:48:59","用户":"刘文杰","群":"","用户问询":"那本土RFC绑定的税号的法人也是本土的吗","AI响应":"是的，墨西哥本土RFC税号的法人必须是墨西哥公民或持有合法居留许可（如居留证）的外国公民。\n\n如果是以墨西哥公司（Persona Moral）名义申请，该公司必须在墨西哥当地注册，且其法定代表人（Representante Legal）必须拥有墨西哥当地的身份证明和有效的RFC税号。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-18 09:51:22","用户":"Morii","群":"","用户问询":"那我们的跨境店铺7月20日之后还挂着本土税号，也没验证，会不会封店，还是只会扣36%的税，会不会被税务局查到，查到会怎么样","AI响应":"你好！很高兴为你解答。\n\n1. 关于封店与扣税：\n7月20日之后，若未完成RFC主体一致性验证，店铺不会被封，但预扣税率将依法上调至36%。\n\n2. 关于税务风险：\n本土税号虽在部分环节税务成本较低，但面临极高的税务稽查与账号关联风险。如果被税务机关查实主体不一致或存在违规，极易导致店铺封禁及资金冻结。\n\n3. 建议：\n对于跨境卖家，强烈建议选择与注册主体一致的离岸税号，其合规性与账户安全性最高。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-18 09:50:20","用户":"Morii","群":"","用户问询":"那我们的跨境店铺7月20日之后还挂着本土税号，也没验证，会不会封店，还是只会扣36%的税，会不会被税务局查到，查到会怎么样","AI响应":"你好！很高兴为你解答。\n\n根据目前的信息，如果你的跨境店铺在7月20日之后未能完成RFC主体一致性验证，平台将遵从墨西哥税务法规要求，将相关账户的预扣税率上调至36%，以协助实现依法合规纳税。\n\n关于你担心的其他风险：\n1. 封店风险：虽然目前政策明确的影响是税率上调，但使用与账号主体不一致的本土税号面临极高的税务稽查与账号关联风险，这极易导致店铺封禁及资金冻结。\n2. 税务稽查：本土税号如果被税务局查到主体不符或存在违规授权，可能会面临高额罚款及业务关停风险。\n\n对于跨境卖家，强烈建议选择与注册主体一致的离岸税号，这是合规性与账户安全性最高的做法。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-17 09:38:47","用户":"黄少敏","群":"","用户问询":"需要更新RFC税号，可以吗","AI响应":"你好！很高兴为你解答。\n\n关于墨西哥RFC税号的更新，请参考以下信息：\n\n1. 验证要求：墨西哥跨境店铺需要进行RFC税号有效性验证。如果您的RFC税号与账号主体不一致，则需要完成一致性验证。\n2. 预扣税影响：对于未能完成验证的店铺，平台将遵从墨西哥税务法规要求，将相关账户预扣税率上调至36%。\n3. 操作建议：建议您按照平台指引及时更新并验证。对于跨境卖家，强烈建议选择与注册主体一致的离岸税号，其合规性与账户安全性最高。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-15 23:20:05","用户":"TT","群":"","用户问询":"这个指引有两个选项，有一个姓名跟邮箱 那我姓名这一栏不知道怎么填 因为这是一家 SA 公司的税号，也是我们自己的","AI响应":"从您提供的图片来看，这是 DocuSign 的签署界面。在 RFC 知情授权书的签署场景下，姓名一栏应填写 RFC 税号对应的主体名称。既然是 SA 公司的税号，建议填写该公司的官方登记名称，并确保与 CSF 文件上的主体名称一致。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-15 11:41:55","用户":"ㅤ  ㅤ","群":"","用户问询":"跨境店也需要RFC税号吗上传","AI响应":"你好！跨境店是否需要RFC取决于业务模式：自发货不需要；海外仓模式需要。若做海外仓未上传RFC，平台将按36%税率强制预扣。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-15 10:10:54","用户":"Bruce","群":"","用户问询":"怎么注册rfc税号","AI响应":"你好，很高兴为您解答。关于墨西哥RFC税号的办理，您可以联系专业的税务服务商进行办理。RFC是由墨西哥税务机关 SAT分配的唯一12位字母数字识别码。\n\n对于跨境卖家，强烈建议选择与注册主体一致的离岸税号，其合规性与账户安全性最高。如果您是自发货卖家，暂时不做墨西哥RFC税号的强制要求。但如果您使用墨西哥海外仓，建议您提前评估并准备。\n\n网页参考资料：\nRFC提交指引：https://doc.weixin.qq.com/pdf/d3_AfYAYgZCAGgKWsXU04xQce3N7RC12?scode=AI8A3wfvAAouqPnVrtAfYAYgZCAGg&isFromNewImportWithExcel=1\n税务合规渠道SPN：https://mercadolibre.cn/melispn\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-14 18:14:09","用户":"H","群":"","用户问询":"rfc税号需要怎么办理","AI响应":"你好！办理墨西哥RFC税号，你可以联系专业的税务服务商进行办理。RFC是由墨西哥税务机关分配的唯一识别码，建议选择与注册主体一致的离岸税号。\n\n网页参考资料\nRFC提交指引：https://doc.weixin.qq.com/pdf/d3_AfYAYgZCAGgKWsXU04xQce3N7RC12?scode=AI8A3wfvAAouqPnVrtAfYAYgZCAGg&isFromNewImportWithExcel=1\n税务合规渠道SPN：https://mercadolibre.cn/melispn\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-14 15:55:09","用户":"+k","群":"","用户问询":"自发货需要办理RFC税号吗","AI响应":"自发货不需要提供税号。\n\n关于墨西哥RFC税号的要求，主要取决于您选择的业务模式：\n如果您选择的是自发货模式，目前不涉及墨西哥36%的增值税代扣，您可以先激活店铺跑自发货。\n如果您选择的是海外仓模式，建议您办理RFC税号。如果没有税号，平台将面临约36%的代扣税（16%增值税 + 20%所得税）。\n如果您使用美国转运仓配送墨西哥，则不需要提供RFC。因为这种模式属于跨境直邮而非本土发货，相应的进口税费由买家在下单时承担。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-13 10:18:29","用户":"纯属巧合","群":"","用户问询":"半托管不是不需要RFC税号的吗","AI响应":"你好！很高兴为你解答。\n\n你的理解是正确的。在美客多半托管模式下，墨西哥站点的税费是代扣代缴的，卖家确实不需要RFC税号。\n\n在半托管模式下，卖家在定价时不包含税费，最终前端显示给消费者的价格是包含税费的，这部分税费由买家承担。同时，平台也不会对半托管卖家进行36%的增值税和所得税代扣。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-19 23:22:01","用户":"2号线","群":"","用户问询":"方案一税率要达到10.5%的话，回款到对方公户，然后会计月度税务申报，对方公户再回款给我，是只能打到PINGPONG吗，或其他什么方式回款才能到我手上，这些环节中哪些环节是需要回款费或税率转化费等其他费用，分别多少 方案二平台回款我要自己掌控只能回款到PINGPONG，这个费用要多少呢","AI响应":"你好！很高兴为你解答。针对你提到的两种RFC税务及回款方案，详细费用拆解如下：\n\n**方案一：使用第三方服务商（如离岸RFC代办/挂靠）**\n1. **回款路径**：平台结算 -> 绑定在后台的第三方收款工具（如PingPong/Payoneer） -> 提现至你的国内银行卡。\n2. **费用环节**：\n   - **平台扣税**：绑定离岸RFC后，平台仅代扣16%增值税（IVA），所得税（ISR）为0%。\n   - **平台提现费**：平台提现操作可能收取少量手续费。\n   - **收款工具手续费**：PingPong等工具提现至国内银行卡，通常收取 **0.3% - 1.2%** 的手续费（根据你的流水量可谈）。\n   - **汇损/转化费**：美金转人民币时，收款工具会按实时汇率扣除约 **0.5% - 1%** 的汇损。\n   - **会计申报费**：需支付给税务代理月度申报费（通常为固定月费）。\n\n**方案二：自行掌控回款（绑定自己的PingPong）**\n1. **回款路径**：平台结算 -> 你的PingPong账户 -> 你的国内个人或公司卡。\n2. **费用环节**：\n   - **税务成本**：同上，绑定RFC后平台代扣16% IVA。\n   - **PingPong提现费**：标准费率通常在 **1%** 左右。如果你的店铺流水大，可以申请更低的费率（如0.5%甚至更低）。\n   - **汇率损失**：同上，约 **0.5% - 1%**。\n\n**总结建议：**\n无论哪种方案，平台回款都是先到你绑定的第三方收款账户（如PingPong）。\n- **主要成本**：16%增值税（IVA）+ 约1%的提现手续费 + 约1%的汇损。\n- **回款方式**：除了PingPong，美客多还支持Payoneer（派安盈）和WorldFirst（万里汇）。\n\n建议你直接绑定自己的PingPong账户，这样资金流向最清晰，费用也最透明。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-18 16:22:05","用户":"ㅤ  ㅤ","群":"","用户问询":"请问36%的预扣税是否为最终税负？如果中国主体后续办理RFC并依法申报，已预扣的税款是否可以抵扣或退还？","AI响应":"你好！根据墨西哥税务法规，平台执行的强制预扣通常作为最终税款缴纳给税务局。目前现有信息未提及已预扣的税款可以在后续办理RFC后进行抵扣或退还。建议咨询专业税务代理了解具体的税务申报及抵扣规则。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-16 16:06:14","用户":"纳洛童","群":"","用户问询":"RELOJ DEPORTIVO SANDA 6200 - 5ATM, LED, ALARMA, CRONOMETROELEVA TU ESTILO ACTIVO TODOS LOS DIASDescubre el Reloj SANDA 6200, un reloj doble pantalla analogica-digital disenado para acompanarte en cada momento.Necesitas un reloj que funcione en la alberca, el gym y la vida diaria?=== POR QUE ELEGIR ESTE RELOJ? ===* DISENO EXCLUSIVO: Esfera redonda clasica con diseno atemporal.* FUNCIONES INTELIGENTES: Incluye luz LED para ver la hora en la oscuridad, cronometro para tus rutinas, calendario visible (Fecha y Dia), 4 alarmas independientes, cuenta regresiva, doble pantalla analogica-digital, formato 12/24H.* COMODIDAD TOTAL: Equipado con una correa de TPU flexible, suave y comoda para llevarlo puesto todo el dia sin molestias.* MOVIMIENTO DE CUARZO: Precision para que tu dia siempre este en hora. Pila de larga duracion incluida (12 a 24 meses).=== RESISTENCIA AL AGUA 5ATM (Natacion en Agua Fria) === SI SOPORTA: Natacion en alberca, lluvia, sudor, lavado de manos. NO SOPORTA: Agua caliente, vapor, buceo profundo.(IMPORTANTE: Nunca presiones los botones cuando el reloj este mojado o sumergido).=== ESPECIFICACIONES TECNICAS ===- Marca: SANDA- Modelo: 6200- Estilo: Deportivo- Material de la Caja: ABS resistente a golpes- Material de la Correa: TPU- Cristal: Cristal Acrilico- Fondo: Acero Inoxidable 304- Diametro de la caratula: 47mm- Formato de hora: 12/24H=== EL REGALO PERFECTO ===Una excelente opcio cm，高≤35cm，三边之和≤135cm，重量≤15kg。\n3. 避免填写过于夸张或不合理的数值，否则会导致发布失败或账户风险。\n\n请在Listing编辑板块修改为准确的数值后重新提交。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-13 16:47:01","用户":"Rosa Chen（家居家具汽摩配full仓）","群":"","用户问询":"Detail of the retrieval #7416873 Hello 我们有个退仓订单11件货，显示投递失败了在退回官方中，能帮我们查到货在哪里吗？还能再次退仓不","AI响应":"不好意思，该问题我没有答案，请点击以下链接咨询人工客服：\nhttps://work.weixin.qq.com/kfid/kfc7c47108dec2b0070?enc_scene=ENCGH59j4kB9XCrk4dX6Jt2BZeAhKD7ZBUNQhrF2CcGYyCW&scene_param=customer_id=1688858097688347","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-13 10:30:05","用户":"Fearless Dare Devote","群":"","用户问询":"我在信息提交页面选择的是半托和全托，但是信息登记的页面显示的是全托的。这个不影响我开半托的店铺的吧","AI响应":"你好，很高兴为您解答。\n\n这个是不影响的。您在上架全托产品的同时也可以同时上架半托产品。半托管模式和全托管模式在前端展示时，买家是无法区分的。\n\n半托管模式下，您拥有自主定价权，不需要核价，直接上架就可以销售。而全托管模式则由平台负责定价和运营。\n\n网页参考资料\nhttps://mercadolibre.cn/news/info?id=215&type=live","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-18 18:00:09","用户":"迷迷 苏","群":"","用户问询":"东莞仓申请提取商品的 VAS NO后面号码错误，但是提取货物的OC码没错会影响提货吗","AI响应":"你好！很高兴为你解答。\n\n只要你的**OC提货码**是正确的，通常不会影响最终提货。\n\n在退仓提货流程中，**OC提货码**是仓库核验货件最关键的凭证。VAS NO（增值服务单号）虽然是关联单号，但仓库现场主要通过OC码来定位和交付包裹。\n\n**建议操作：**\n1. 在发送预约邮件时，请务必在邮件正文再次清晰写明正确的**OC提货码**。\n2. 提货人到达东莞仓库现场时，直接出示**OC提货码**进行核对。\n3. 务必提醒提货人员在现场当面核对退货实物数量，如有差异需当场反馈，货品离仓后将无法处理。\n\n**退仓预约邮件提醒：**\n收件人：MKDCF2026168@365fanyi.com 和 gpncustomerservice-latinamerica@service.cainiao.com\n邮件标题：Mercado Libre Withdrawal Order + 正确的OC单号\n邮件正文：写明OC提货码 + 提货时间\n\n请注意，库内停滞时长超过5天未提货的货件将会被销毁，请尽快安排。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-17 02:54:25","用户":"楠","群":"","用户问询":"您好，商品实际重量300克，订单显示1400克，还没发，邮费多了，这个订单的重量已经改不了吗","AI响应":"你好！订单生成后，该笔订单的计费重量无法修改。建议你尽快在后台检查并修正该商品的包装后重量和尺寸，确保与实际一致，避免后续订单继续产生运费差异或附加费。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-18 17:35:01","用户":"Michael-拾荒的小男孩","群":"","用户问询":"为什么我上传的马黛茶罐只能在墨西哥显示，其他国家都不能显示呢","AI响应":"你好！很高兴为你解答。\n\n马黛茶罐属于食品接触类产品或可能涉及海关限制。不同国家对进口产品的法律规定不同，建议你优先检查海关限制产品列表。\n\n此外，请确认你在上传时是否勾选了其他国家，并检查其他站点的 Listing 状态是否因为类目审核、禁售限制或物流尺寸超标而被系统自动拦截。\n\n网页参考资料：\nhttps://global-selling.mercadolibre.com/help/16621?&utm_source=vendedores&utm_medium=referral&utm_campaign=Core_ListMyProducts&utm_content=customrestrictedproducts","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-18 17:27:40","用户":"十月","群":"","用户问询":"那我之前绑定特签署过授权书了，怎么还显示不通过呀","AI响应":"目前无法直接判断具体原因。建议您优先核查CSF文件中的RFC主体信息是否与您签署授权书时的主体完全一致。若确认无误但仍未通过，建议联系对应工作人员或通过后台Case进一步核实。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-18 11:52:04","用户":"泫林","群":"","用户问询":"问下，我站点后台，产品 显示 共享，这情况，是怎么定义的，","AI响应":"不好意思，该问题我没有答案","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-18 10:43:23","用户":"鸽子","群":"","用户问询":"为什么美客多后台账单管理显示已支付，但是没有收到钱是什么原因","AI响应":"请优先登录后台 Mercado Pago 板块，核实该笔款项状态是否显示为 Transferred。确认平台放款成功后，请持记录联系您的第三方支付服务商查询入账进度。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-17 17:10:49","用户":"sincere","群":"","用户问询":"请问一下，我为什么上传会出现S/L/XL一传 失败","AI响应":"你好！尺码上传失败通常是因为变体信息填写不完整。请核查：\n1. 每个尺码是否都填写了唯一的通用代码（EAN/UPC）。\n2. 变体属性（如Size/Color）是否与模板要求一致。\n3. 必填项是否有遗漏。\n建议检查报错提示的具体原因。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-17 12:45:18","用户":"兵道伐谋","群":"","用户问询":"我们是全托管和半托管 在提交页面扫码进群 怎么进群呢","AI响应":"添加Abby Wang，备注好公司名称+拉半托群/全托群。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-14 12:03:51","用户":"朵儿","群":"","用户问询":"我绑定万里汇的时候提示上传信息失败是什么原因呢，要怎么解决呢","AI响应":"你好！绑定收款账户时提示上传失败，通常有以下几种原因及解决方法：\n\n1. **网络或浏览器问题**：这是最常见的原因。建议清除浏览器缓存，或更换为 Chrome 浏览器（建议使用无痕模式）重试。\n2. **系统环境波动**：如果更换网络和浏览器后依然无效，说明可能存在系统对接错误。\n\n**解决方法：**\n请填写【KYC问题反馈问卷】：https://www.wjx.cn/vm/tUk4i1V.aspx# \n该问卷专门处理绑定失败、上传错误等系统问题。请详细填写报错页面截图及操作信息，技术团队核查后会通过邮件答复。\n\n**温馨提示：**\n绑定或更换收款账户均需完成**法人人脸识别验证**，请确保操作环境光线充足。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-13 15:43:33","用户":"Deven","群":"","用户问询":"你好 怎么我登录他是空白的，信息刷新不出来 需要翻墙么","AI响应":"你好！从你提供的图片来看，后台界面无法正常加载显示内容。\n\n这通常属于网络波动或浏览器缓存问题。建议你优先使用 Chrome 浏览器并清除缓存，或者直接开启无痕模式重试。\n\n如果界面出现乱码，请务必关闭网页自动翻译功能。若依然无法加载，通常需要切换网络节点或等待系统恢复。如果是新开站点，也可能存在权限同步延迟的情况。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-13 00:46:58","用户":"MGG","群":"","用户问询":"可是为什么我现在看到的后天实际显示每天5.36美金呢","AI响应":"你好！很高兴为你解答。\n\n后台显示的数值与理论计算值存在差异，通常是由以下几个原因造成的：\n\n1. 实际超量件数是动态的\n超量罚款是根据每天仓库实时的库存快照来计算的。虽然你提到的超量总数是 690 个，但如果其中有部分订单正在处理、买家退货尚未入库，或者有部分库存处于不可售状态，系统计算罚款的“实际超量件数”会以每天结算时的实时数据为准。\n\n2. 库容类型的占比\n如果你同时拥有标准件和大件库存，系统会分别计算。如果你的超量部分中，体积较小的标准件占绝大多数，或者部分商品被系统判定为不计入超量罚款的特殊状态，每天的罚款总额就会比预估的要低。\n\n3. 汇率或计费延迟\n后台显示的金额有时会存在一定的汇率换算或数据同步延迟。\n\n4. 具体的计算逻辑\n建议你以卖家后台“购买历史记录（Purchase History）”或“库存绩效”面板中显示的每日明细为准，那是系统根据你店铺实时库存状态得出的最终扣费金额。\n\n既然目前每天产生 5.36 美金的罚款，说明你目前的超量情况确实在产生额外成本。购买库容后，这笔每日扣费将会停止。\n\n网页参考资料\nhttps://global-selling.mercadolibre.com/help/21423","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-19 09:16:50","用户":"Bran","群":"","用户问询":"为什么商品已经在运输中，为何显示影响我得声誉","AI响应":"你好！很高兴为你解答。\n\n如果商品已在运输中仍影响声誉，通常有以下原因：\n1. 延迟发货：虽然已在途中，但实际交给货运公司的时间超过了平台要求的处理时效。\n2. 跟踪号上传延迟：货件已发出但未及时在后台填写跟踪号，导致系统判定为延迟。\n3. 缺货取消：若之前因缺货取消过订单，也会持续影响声誉。\n\n建议在卖家后台“Reputation”板块查看具体的扣分指标。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-18 14:39:43","用户":"骑着毛驴去拉萨","群":"","用户问询":"这种界面的时候退出，自动调价会关闭吗","AI响应":"你好！图片显示系统“正在更新商品”，此时如果直接退出，可能会导致正在处理的更新中断，从而无法成功关闭自动调价。建议等待下方进度条显示更新完成后再退出，以确保设置生效。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-17 15:12:54","用户":"我叫不知道","群":"","用户问询":"没有错误页面，就是点提交之后跳回原页面","AI响应":"你好！很高兴为你解答。在尝试过换浏览器、换网络等手段依然无效的话，可以填写以下问卷进行反馈：https://www.wjx.cn/vm/tUk4i1V.aspx# \n这是专门为了解决KYC阶段问题准备的【KYC问题反馈问卷】。请您花费几分钟时间，详细填写您遇到的具体问题、报错页面截图及相关操作信息。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-17 14:07:02","用户":"iee","群":"","用户问询":"是还在处理吗 但是里面数据都是00","AI响应":"是的，根据截图顶部的橙色提示，系统正在处理您的数据，这可能需要几个小时。由于报表尚未生成完毕，目前下载的文件数据会显示为0。请耐心等待处理完成，待橙色提示消失后再重新下载即可。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-16 12:30:59","用户":"白月光","群":"","用户问询":"请问这里是全部的国家站点都默认开通的吗","AI响应":"你好！美客多跨境账户通常默认开通巴西、墨西哥、智利、哥伦比亚等主要站点。具体以你后台显示的“活跃”状态为准。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-15 15:58:07","用户":"敏","群":"","用户问询":"后台中显示的旗舰产品是什么意思？","AI响应":"你好。旗舰产品是指在特定品类中具有高销量、高转化潜力的核心产品。平台会通过该标识提醒卖家重点关注，并建议通过优化库存、参与促销或开启广告来进一步提升其表现。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-15 15:53:07","用户":"叶子","群":"","用户问询":"我填写邮箱后，为什么一直是灰的，点不了下一步呢","AI响应":"这种情况通常由网络环境或浏览器兼容性引起。建议优先使用Chrome浏览器并关闭网页自动翻译功能，尝试更换设备、切换网络环境或连接VPN后多次刷新重试。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-15 09:50:06","用户":"Later","群":"","用户问询":"为什么没有看到Payments页面","AI响应":"不好意思，该问题我没有答案","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-14 20:40:45","用户":"柯培鑫","群":"","用户问询":"全托管店铺和半托管店铺页面有什么不同吗","AI响应":"在美客多买家前台页面，普通消费者是无法直接区分半托管和全托管店铺的。\n\n两者的前端展示特征非常相似：\n1. **标识一致**：全托管和半托管的产品都会带有“小飞机”图标和“FULL”绿色闪电标识。\n2. **流量权重**：两者都属于托管模式，在搜索排名中都享有极高的流量倾斜。\n\n**虽然买家看不出区别，但对你（卖家）来说，后台操作和核心逻辑有很大不同：**\n\n1. **定价权**：\n- **半托管**：你拥有自主定价权，可以根据成本和利润随时调整前端售价。\n- **全托管**：你只有供货权，最终的前端销售价格由平台根据市场情况统一制定。\n\n2. **费用结构**：\n- **半托管**：你需要支付佣金（目前有50%减免，约为8%），且需要承担广告费。\n- **全托管**：0佣金、0广告费、0仓储费，你只管供货，剩下的费用全由平台承担。\n\n3. **运营深度**：\n- **半托管**：你需要自己上架、优化Listing、提报活动。\n- **全托管**：平台负责上架、翻译、优化和所有营销推广。\n\n总结来说，前端展示上它们都是平台的“亲儿子”，都带FULL标，但全托管更省心，半托管更灵活。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-14 16:37:11","用户":"一个真正的man🏀🐔","群":"","用户问询":"你们出现bug我还要在审核5天？","AI响应":"建议您按照系统提示重新提交数据，此问题通常由系统升级维护引起。提交后我们会尽快为您处理。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-14 16:36:59","用户":"一个真正的man🏀🐔","群":"","用户问询":"系统升级bug？ 那我都等5天了","AI响应":"非常抱歉，目前无法直接判断具体原因。建议您先核查后台是否有报错提示，若无提示且状态回退，请尝试重新提交资料。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-14 15:16:13","用户":"戚","群":"","用户问询":"新绑定到erp的店铺 显示UP字样是什么意思","AI响应":"UP字样代表您的店铺已经升级到了全新的UP（User Product）模式。\n\n目前UP模式无需卖家手动申请开通，平台系统会自动为您进行升级。由于全平台的商品数量非常庞大，为了保障大家店铺和商品的稳定性，目前系统正在分批次平稳迁移中。在迁移过程中，技术团队也会严谨地进行系统调优，因此会有部分店铺先体验到新功能。\n\n预计将在七月底完成全量迁移，还请暂未升级的卖家朋友们耐心等待一下，迁移完成后您即可无缝体验新功能！\n\n如果您是通过自研API发品的商家，需尽快重新开发对接UP新版API。未及时迁移，后续将无法通过API发品，只能后台手动上新，影响正常运营上架。请大家尽快完成UP API迁移，早对接早用新功能，避免后续发品受限。\n\n网页参考资料\nAPI接入文档直达：https://global-selling.mercadolibre.com/devsite/en_us/user-products-cbt","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-14 11:34:01","用户":"Michael-拾荒的小男孩","群":"","用户问询":"保质期这个在终端显示在哪里，是否有截图","AI响应":"你好！很高兴为你解答。\n\n保修时间（Warranty time）通常显示在商品详情页右侧的购买区块下方，或者在页面下方的“Garantía”（保修）板块中。买家可以清晰地看到卖家提供的保修期限和保修类型。\n\n非常抱歉，目前我无法为你提供该位置的具体展示截图。你可以尝试在美客多前台搜索同类产品，查看页面右侧或底部的“Garantía”部分作为参考。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-14 09:56:36","用户":"扣泥几蛙","群":"","用户问询":"我包裹拆分，为什么其中一个包裹一直不显示出来","AI响应":"如果您在后台操作了订单拆分，但其中一个包裹的物流信息一直没有更新或显示，通常是因为物流商的扫描环节出现了延迟。\n\n针对这种情况，请参考以下说明：\n\n1. 扫描时效：包裹派送至中转仓/集运仓后，物流商通常需要12-24小时完成扫描上网。如果超过24小时仍未显示，请联系美客多官方客服，提供交易订单号或货物运单号，客服会协助联系菜鸟核实包裹状态并催促扫描。\n\n2. 检查面单：请确认该包裹是否粘贴了正确的、独立的物流面单。如果面单模糊、损坏或重复使用，会导致仓库无法正常扫描入库。\n\n3. 包裹规范：请确保该包裹符合菜鸟的尺寸和重量限制（长度≤60cm，宽度≤40cm，高度≤35cm，三边之和≤135cm，重量≤15kg）。若包裹超材，可能会被拦截处理而无法正常更新状态。\n\n网页参考资料\n订单拆分具体操作指引：https://doc.weixin.qq.com/pdf/d3_ARIAagYiAMICNcAuVTohoQeSPkKV8?scode=AI8A3wfvAAo0s11m9uAXUA7AYZANA","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-13 16:54:11","用户":"纯属巧合","群":"","用户问询":"你好， 为什么美客多前台打不开？","AI响应":"你好！很高兴为你解答。美客多前台打不开通常有以下几种原因：\n\n1. 网络环境限制：由于美客多是拉美地区的平台，国内网络环境有时无法直接访问前台页面，建议尝试切换网络节点或使用海外代理环境访问。\n\n2. 浏览器缓存：建议优先使用 Chrome 浏览器，并尝试清除浏览器缓存，或者使用无痕模式（Incognito window）重新打开。\n\n3. 网页自动翻译：如果浏览器开启了网页自动翻译功能，可能会导致页面加载异常或乱码，请务必关闭自动翻译功能。\n\n4. 站点维护：有时平台会进行系统维护或更新，可能会出现短暂的无法访问情况，可以稍后再试。\n\n网页参考资料：https://mp.weixin.qq.com/s?__biz=MzI5NDU3NzE0NQ==&mid=2247509458&idx=1&sn=097489beab779671868e146f1e458cb4&scene=21#wechat_redirect","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-19 21:46:11","用户":"Ivan","群":"","用户问询":"网站打不开 要用VPN吗","AI响应":"你好！很高兴为你解答。建议在连接VPN的情况下访问，并清除浏览器缓存或换用最新版本的谷歌浏览器。如果界面加载异常，请务必关闭网页自动翻译功能。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-19 16:39:53","用户":".","群":"","用户问询":"为什么还显示重新上传要","AI响应":"你好！很高兴为你解答。\n\n从你提供的图片来看，页面依然显示需要提供RFC编号，这通常是因为验证流程尚未完全闭环。\n\n如果你已经多次提交，请检查以下环节：\n1. 邮件签署：请检查您的卖家注册邮箱以及CSF登记邮箱，是否收到了平台发送的RFC知情授权书邮件。只有完成所有邮件中的签署指引，系统状态才会更新。\n2. 网络同步：这可能属于网络波动或浏览器缓存问题，建议更换浏览器重试或开启无痕模式查看。\n\n如果确认邮件已全部签署且网络环境正常，但页面依然提示重新上传，请耐心等待系统同步。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-19 15:11:24","用户":"sty","群":"","用户问询":"这里目录指的什么意思","AI响应":"目录是指平台已有的产品库。如果您发布的产品在目录中已存在，需复制产品代码并粘贴到“ML目录代码”列，此时部分字段会显示为灰色且无需重复填写。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-19 14:41:48","用户":"价值2","群":"","用户问询":"热搜词页面在哪里","AI响应":"你好！你可以通过以下链接查看美客多各站点的热搜词：\nhttps://tendencias.mercadolibre.com.mx/\n\n网页参考资料\nhttps://tendencias.mercadolibre.com.mx/","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-18 17:02:01","用户":"小火鸡","群":"","用户问询":"在哪里我可以装修我店铺页面","AI响应":"你好！很高兴为你解答。\n\n首先，您需进入卖家后台 >> Listings Management >> My page 页面，在Design editor的导航栏中选择对【移动端】或【电脑端】进行装修。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-17 22:26:54","用户":"蓝七","群":"","用户问询":"你好 这是什么意思呀","AI响应":"你好！图片中的报错意思是你在 catalog_product_id 这一列输入的数据无效。请不要手动粘贴或输入单元格选项之外的内容。如果搜索不到对应的目录代码，请将该列留空，直接填写其他必填项即可。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-17 19:13:05","用户":"Ti","群":"","用户问询":"上产品报错怎么处理？","AI响应":"上产品报错通常有以下几种处理方式：\n\n1. 检查标题规范：\n如果报错提示 [title] 属性丢失，请检查标题是否包含特殊符号、营销词汇（如 Hot Sale、Best Price）或超过 60 个字符。建议修正后删除原 SKU 重新手动上传。\n\n2. 完善类目与属性：\n确保类目选择精准，并填全品牌、型号、规格等技术参数。信息越完整，系统校验通过率越高。\n\n3. 检查图片要求：\n首图必须为纯白底，不能带有水印或文字，尺寸建议在 1200 像素以上。\n\n4. 批量上传报错：\n如果是批量上传，请检查下载的 Excel 模板是否为对应类目的最新模板，并查看表格上传后的报错提示进行针对性修改。\n\n如果修改后问题依然存在，建议您：\n1. 参考官方公众号【美客多拉美电商】中关于 Listing 优化的文章。\n2. 在卖家后台联系美客多官方客服，并提供具体的报错截图，以便客服团队提供精准帮助。\n\n网页参考资料：\nhttps://mercadolibre.cn/news/info?id=64&type=live","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-17 18:22:29","用户":"准备去","群":"","用户问询":"这个下载标签为什么点不了","AI响应":"你好！这种情况通常由网络环境或浏览器兼容性引起。建议优先使用Chrome浏览器并清除缓存或使用无痕模式，并务必关闭网页自动翻译功能。若仍失败请更换设备或切换网络环境重试。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-17 14:38:12","用户":"ㅤㅤㅤㅤㅤㅤㅤㅤ玉米柒柒","群":"","用户问询":"上面为什么显示的是深圳广东？","AI响应":"这是因为面单上方显示的是**发货人（卖家）信息**。\n\n由于你注册店铺时填写的发货地址或在后台设置的默认发货地址位于深圳沙井，系统生成面单时会自动抓取该地址作为退货或发货来源地。\n\n这不影响你从河南寄往郑州集运仓。仓库扫描的是中间的条形码，只要条码正确，包裹就能正常发往墨西哥。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-17 09:35:00","用户":"Star Chow","群":"","用户问询":"那为什么ROAS显示是0","AI响应":"从截图看，ROAS显示为横杠，是因为你的Income（广告带来的收入）目前显示为US$ 0。由于ROAS的计算方式是收入除以投资，当收入为0时，系统无法计算出具体数值。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-17 06:48:06","用户":"QINGZHOU","群":"","用户问询":"你好，我应该该怎么样截图给他？","AI响应":"请使用电脑登录卖家后台，打开显示“审核中”或报错的完整页面。截图时务必包含浏览器顶部的URL地址栏，确保图片清晰且小于10MB，格式为JPG或PNG，然后回复该邮件即可。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-16 17:47:07","用户":"fxt","群":"","用户问询":"这个为什么不能选择继续","AI响应":"此情况通常由网络环境或浏览器兼容性引起。建议优先使用Chrome浏览器并清除缓存或使用无痕模式，并务必关闭网页自动翻译功能。若仍失败请更换设备、切换网络环境或连接VPN重试。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-16 12:15:25","用户":"简单","群":"","用户问询":"检查表格有什么错误","AI响应":"根据你提供的多张图片，目前表格主要存在以下错误，请逐一核对修改：\n\n1. **物流模式冲突**：同一行产品不能同时填写海外仓（J、K列）和自发货（N、O列）的价格。请确保每行只保留一种物流方式的数据，另一种保持空白。\n2. **必填项缺失**：E列的 **SKU** 必须填写；F列的 **Color** 建议从下拉菜单选择。\n3. **无效行干扰**：第9行及之后的空白行若显示红色错误，请直接选中这些行并**彻底删除**，确保表格中没有残留的空格或字符。\n4. **目录代码**：确保B列已填入通过“搜索代码”获取的正确数字编号。\n\n修正后，左侧的红色“出现错误”标签应会消失。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-16 07:51:58","用户":"若初见","群":"","用户问询":"问题，回答显示已关闭什么意思","AI响应":"你好！很高兴为你解答。\n\n在美客多平台，买家提问后显示“已关闭”通常有以下几种情况：\n\n1. 卖家已回复：你已经对该问题进行了回答，系统会自动关闭该提问通道，买家无法在同一个问题下继续追问，若有新问题需要重新发起提问。\n2. 违反平台规则：如果买家的问题中包含敏感词、联系方式、外部链接等违规信息，系统可能会自动屏蔽并关闭该问题。\n3. 买家自行撤回：买家在提问后也可以选择撤回或删除自己的提问。\n4. 订单已生成：有时候买家在提问后直接下单购买了该商品，部分场景下售前咨询可能会随之关闭。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-15 20:16:33","用户":"简简单单普罗达商贸","群":"","用户问 常3-5个工作日给反馈，请留意卖家后台审核状态的变化。但是加速审核只有一次机会，请谨慎提交！","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-14 19:04:28","用户":"ぅ Oath°3 jin","群":"","用户问询":"您好，提交填写 KYC 反馈问卷吧","AI响应":"你好！很高兴为你解答。\n\n在尝试过换浏览器、换网络等手段依然无效的话，可以填写以下问卷进行反馈：https://www.wjx.cn/vm/tUk4i1V.aspx# \n\n这是专门为了解决KYC阶段问题准备的【KYC问题反馈问卷】。请您花费几分钟时间，详细填写您遇到的具体问题、报错页面截图及相关操作信息。\n\n我们的审核与技术团队在收到您提交的详细报告后，会第一时间进行核查与处理，并尽快通过邮件或平台通知给您答复。\n\n提交邮箱后即为您开通KYC审核绿色通道，通常3-5个工作日给反馈，请留意卖家后台审核状态的变化。但是加速审核只有一次机会，请谨慎提交！","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-14 16:06:05","用户":"自由如龙","群":"","用户问询":"跨境自发货店铺Kyc审核通道发一个","AI响应":"提交邮箱后即为您开通KYC审核绿色通道，通常3-5个工作日给反馈，请留意卖家后台审核状态的变化。但是加速审核只有一次机会，请谨慎提交！","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-13 16:41:08","用户":"吕工","群":"","用户问询":"KYC已经通过并且可以上架了，但是前端没有看到","AI响应":"卖家您好，很高兴听到您的 KYC 已经通过并可以开始运营了。\n\n关于前端没有看到“已验证”相关标识，为您说明如下：\n\n1. **数据同步延迟**：KYC 审核通过后，系统数据同步到前端页面通常需要一定的缓冲时间，建议您在审核通过后的 **24-48 小时**后再观察。\n\n2. **展示逻辑限制**：美客多前端页面的标签展示（如 Empresa Verificada）往往与店铺的**信誉等级（Reputation）**挂钩。新店铺在没有产生足够的初始订单（通常是前 10 单）并计算出信誉颜色（绿色）之前，很多高级标识和卖家信息是不会完整展示给消费者的。\n\n3. **站点与终端差异**：不同站点（如墨西哥、巴西）以及不同终端（APP端与网页端）的展示界面存在差异。有些标识可能仅在特定的页面深度或特定的终端下才会显示。\n\n4. **跨境账号特性**：对于跨境（CBT）账号，平台更核心的信任背书是 **MercadoLíder**（大商）勋章。建议您优先通过稳定发货和优质服务积累订单，一旦获得绿色信誉条或大商勋章，店铺的专业标识会更加显著。\n\n目前既然已经可以上架，建议您先专注于产品运营和出单，标识问题通常会随着店铺权重的提升而自然显现。","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-19 12:16:27","用户":"maxgtrs-Cindy","群":"","用户问询":"kyc审核需要提交股东证明书吗","AI响应":"你好！很高兴为你解答。\n\n关于股东证明书的提交要求，美客多平台已经更新了政策。自2025年10月13日起，对中国大陆公司注册的跨境店铺实行股东信息电子化填报。\n\n您无需再提交纸质版股东证明材料，也无需上传扫描件，仅需在入驻过程中的KYC认证环节，在线填写完整、真实、准确的股东信息即可完成认证。\n\n如果是香港公司入驻，仍需在KYC审核界面下载官方提供的股东证明书模板进行填写，并附上公司注册证书、商业登记证和NAR1-年度申报表或NNC1-公司注册表格。","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-19 12:07:00","用户":"Boby","群":"","用户问询":"我KYC 审核好了吗","AI响应":"你好！KYC审核通常需要2-3周以上。你可以登录卖家后台，通过Settings中的Company legal information实时查询审核进度。","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-19 09:55:40","用户":"西格玛","群":"","用户问询":"KYC极速审核绿通","AI响应":"你好！很高兴为你解答。\n\n提交邮箱后即为您开通KYC审核绿色通道，通常3-5个工作日给反馈，请留意卖家后台审核状态的变化。但是加速审核只有一次机会，请谨慎提交！\n\n参考图片：\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260618/69555cc95b3e4793a417208bfb9921de.jpeg\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260618/c2dd106092304f6383cc9c52ad647a5a.png\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260618/0d4da780ff8e4f7fa3332062b8fe7fdb.png\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260618/ae366904c52648f6b2ec7ecd8c3e23f6.png\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260618/1db5a5eb4683453d8e2c7a01ace3ab12.jpeg\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260618/bd5d174a71ab4e16847b23c614452ad3.jpeg\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260618/c79cd6ae6c764d398c9a29f234e58436.jpeg\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260618/888dffc69de54b13bae52156936e7d77.jpeg\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260618/1877b3441efa41c094061c5ade203f20.png\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260618/a266f8e18ddb4ac7afbbb37c772092c7.png\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260618/45c5998cd287403aa3dff46982a75da2.png\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260618/b7283914685f467c866c90c57a73d914.png\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260618/029aacb46721467d8164292a9f72d247.png\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260618/dc52f521064f428eaae83574705b828e.png\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260618/7b0e10e0e1fe429bac6233401a38a3fc.png\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260618/93a2e7ef737344
