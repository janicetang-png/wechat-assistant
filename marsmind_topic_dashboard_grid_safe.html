":"从图片看，该促销活动总折扣为24%，其中你承担20%（4.40美元），平台承担4%（0.88美元）。促销后净收益6.87美元，是基于你原始净收益7.70美元，扣除你承担的4.40美元折扣后，再结合平台补贴及佣金/运费重新计算得出的结果。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 00:00:39","用户":":-P","群":"","用户问询":"我这个订单显示的运费是固定服务费吗？","AI响应":"从您提供的图片来看，这一项并不是固定服务费。\n\n图片中显示的 3.27 美元明确标注为“运费”，并且下方有补充说明“运费基于包裹的毛重（由您承担）”。这属于订单的配送费用，是根据您商品的重量或体积计算出的实际运费。\n\n固定服务费（低价附加费）通常会包含在“销售费用”这一栏的明细中，或者以单独的固定金额形式出现。当您的商品单价低于各站点的门槛时，平台才会按件加收那笔固定的处理费。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 16:01:46","用户":"lxy","群":"","用户问询":"运费的话 是包含巴西国内的派件费吗","AI响应":"目前巴西站点自发货采用净收益模式，您不需要自己去计算复杂的运费模版。您只需要在后台录入您的目标净收益，也就是您的采购成本加上您想赚取的利润，平台系统就会根据产品的重量，自动为您叠加运费和销售佣金，从而生成买家在前台看到的最终售价。\n\n这个系统生成的最终售价已经包含了从中国发货到买家手中的全流程运费。\n\n如果您想了解具体的运费标准，可以参考巴西站点的菜鸟运费查询表：https://global-selling.mercadolibre.com/help/shipping-fee-cainiao-costos-brasil_41814","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 11:13:12","用户":"柯培鑫","群":"","用户问询":"商品促销中心有什么作用，以及是要自动降价售卖吗","AI响应":"商品促销中心是卖家自主管理和提报活动的核心板块，它的作用和运行逻辑如下：\n\n**1. 促销中心的作用**\n*   **提升流量与转化**：通过设置折扣，商品在前台会显示醒目的折扣标签（如 -5%），吸引买家点击。\n*   **提报官方活动**：除了自主创建折扣，平台组织的各类大促（如 DoD、LD 等）也会在这里展示，你可以一键提报以获取平台流量红利。\n*   **价格管理**：你可以在这里直观地看到折后价格以及你最终能拿到的“净收益（你将收到）”，方便控制利润。\n\n**2. 是自动降价售卖吗？**\n*   **不是自动的**：平台不会在未经你允许的情况下自动调低你的价格。\n*   **需要手动参与**：如你截图所示，右侧有一个蓝色的**“立即参与”**按钮。只有当你点击并确认后，折扣才会生效。\n*   **自主创建**：你也可以点击右上角的“创建促销活动”，自主决定折扣比例和持续时间。\n\n**3. 截图内容解读**\n*   **商品价格折扣**：系统建议你设置 5% 的折扣（减去 1.15 美元）。\n*   **你将收到**：如果你参与这个 5% 的折扣，你的净收益将从原来的 11 美元降至 **10.04 美元**。\n*   **商品促销价**：前台买家看到的最终售价将变为 21.72 美元（约 110.96 雷亚尔）。\n\n**操作建议：**\n如果你觉得 10.04 美元的净收益依然有利润空间，且想通过折扣换取更多流量，可以点击“立即参与”。一旦活动创建成功，在活动期间价格是无法修改的。\n\n此外，在设置折扣时要留意：如果折后价格低于了站点的强制包邮门槛，运费将转由买家承担；如果依然高于门槛，则继续由你承担运费。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"}]},{"一级大类":"产品管理","二级子类":"侵权合规","Past 7 Days":149,"Previous 2026-07-06 to 2026-07-12":156,"Change":-7,"WoW":-0.04487179487179487,"Past 7 Share":0.021628683408332124,"高频问题":"侵权/品牌/合规处理","__details":[{"时间":"2026-07-14 18:18:19","用户":"F","群":"","用户问询":"Cabeça De Substituição 52B Para Barbeador Elétrico Braun Série 5 这样会侵权吗","AI响应":"你好！很高兴为你解答。若出售品牌产品的配件，加上“ for”或“ compatible with”，避免侵权。\n\n针对你提供的标题，Braun 是知名品牌，为了降低侵权风险，建议你将标题修改为：Cabeça De Substituição 52B Compatible With Barbeador Elétrico Braun Série 5。\n\n请注意，Listing 出单后将无法自行修改标题，建议在发布前确保格式正确。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-19 15:45:40","用户":"wd","群":"","用户问询":"Protector De Llave Hm Zinc Para Chirey Tiggo 2, 4 Y 7z 侵权吗","AI响应":"你好！很高兴为你解答。\n\n该标题存在侵权风险。\n\n正确做法是：\n1. 标题应改为：Protector De Llave **compatible con** Chirey Tiggo 2, 4 Y 7z。\n2. 品牌字段必须填写为 **Generic**（通用）。\n3. 确保产品实物和图片上**没有任何 Chirey 的 Logo**。\n\n如果不加兼容性词汇或实物带 Logo，会被系统判定为品牌侵权。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-13 09:31:10","用户":"wd","群":"","用户问询":"Direcionais Led Moto Yamaha Mt07 Mt09 Mt10 R15 侵权吗","AI响应":"你好！很高兴为你解答。\n\n这个标题存在**侵权风险**。\n\n虽然你列出了多个型号，但直接将品牌词“Yamaha”与产品名称连接，且没有使用兼容性连接词，极易被系统判定为品牌侵权。\n\n**为了降低风险，请务必按照以下要求修改：**\n\n1. **修改标题：** 必须加上“for”或“compatible with”来指明兼容性。建议修改为：\n`Direcionais Led Moto compatible con Yamaha Mt07 Mt09 Mt10 R15`\n\n2. **属性设置：** 在后台上品或编辑 Listing 时，**【品牌（Brand）】**字段必须填写为**“Generic”（通用）**。千万不要填写“Yamaha”，否则会被系统抓取判定侵权。\n\n3. **图片检查：** 确保产品图片中没有出现 Yamaha 的 Logo。\n\n**核心原则：**\n店铺没有做品牌备案的，listing“品牌”字段中不能填写任何的品牌，标题和图片也不能使用对应品牌。正确做法是使用“兼容xx品牌或型号”字段，且“品牌”和“型号”字段应始终设置为“通用”！\n\n网页参考资料：\nhttps://global-selling.mercadolibre.com/help/1078","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-17 13:50:55","用户":"路亚饵工厂基地","群":"","用户问询":"5. 品牌资质（可选）：如果您打算开品牌店，还需要准备R标或TM标。这个R标和TM标是啥意思？","AI响应":"在商标领域，R标和TM标代表了商标的不同法律状态：\n\n1. R标（Registered）：\n指已经在销售目的国（如墨西哥、巴西等）的国家商标局正式注册成功并获得商标注册证的商标。在美客多申请官方旗舰店（Official Store）或进行品牌备案时，通常需要提供R标证书。\n\n2. TM标（Trademark）：\n指已经向国家商标局提出申请，并已收到受理通知书，但尚未正式注册成功的商标。它表示该商标正处于申请审核阶段。\n\n在美客多进行品牌备案，您需要准备以下核心材料：\n1. 商标证书：提供在销售目的国注册成功的商标证书（R标）。\n2. 品牌授权书：如果您不是商标的所有人，必须提供由商标持有人出具的正式授权书。\n3. 产品实物图：需要提供带有品牌 Logo 的产品实物照片。\n4. 品牌信息：包括品牌名称、所属类目等基本信息。\n\n备案流程及注意事项：\n1. 提交方式：通过客户经理提交上述材料。\n2. 审核周期：通常需要 2至4周。\n3. 获得权限：审核通过后，您可以获得品牌保护以及品牌广告（Display）的投放权限。\n4. 邮件跟进：若提交后超过 4 周没有回音，请按 “【品牌审核跟进】+店铺名+ID” 的邮件标题格式联系您的客户经理，或联系官方客服催促。\n\n请注意，官方旗舰店（Official Store）的申请与品牌保护计划（BPP）是两套不同的流程，对资质的要求可能有所不同。其他站点也需要R标才能申请官方店。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-19 01:12:53","用户":"Vinson","群":"","用户问询":"品牌旗舰店只能卖一个类目吗？还是同一品牌的产品都可以升级为品牌旗舰店","AI响应":"你好！很高兴为你解答。认证一个店无法做多品牌官方店，但同一品牌下的产品都可以升级为品牌旗舰店。直接售卖就可以了。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-17 22:03:28","用户":"问道","群":"","用户问询":"我主要经营的男装，在上传图片时，是否需要避免图片中出现的品牌logo？","AI响应":"你好！很高兴为你解答。\n\n是的，在上传商品图片时需要注意以下几点：\n\n1. 避免品牌Logo：由于你的品牌未在销售目的国备案，图片中应避免出现明显的品牌Logo、水印或商标，以免被系统判定为品牌侵权。\n\n2. 纯净展示：照片中严禁出现文字、边框、二维码或联系方式（如电话、链接等）。\n\n3. 真实展示：不要在照片中加入不属于购买范围的配件或上下文元素，以免买家产生困惑。\n\n4. 质量要求：建议分辨率达到1200x1200px。针对时尚服饰类目，建议图片能够清晰展示商品细节。\n\n网页参考资料：\nhttps://global-selling.mercadolibre.com/learning-center/news/photo-requirements-for-tops","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-17 21:45:17","用户":"问道","群":"","用户问询":"我是中国地区的服装品牌授权经销商，我应该在哪里登记我的授权文书？","AI响应":"你可以登录卖家后台，在导航栏中寻找 Listings 菜单下的 Brand Protection（品牌保护）或 Brand Registry（品牌注册）选项进行资料上传。\n\n如果你是需要加入品牌保护计划（BPP），可以直接访问官方自查与申请入口。\n\n在添加品牌授权时，如果你是被授权的品牌商（非品牌权利人），请在选项中选择第二个。品牌商本身则选择第一个。\n\n需要注意的是，如果你拥有合法经销商销售授权但非一级授权（二级授权链路），在上架产品时，【品牌】字段里请填写通用。\n\n品牌审核周期通常为2-4周，请优先核实商标是否为销售目的国R标。若提交后一直没有回音，请务必按 “【品牌审核跟进】+店铺名+ID” 的邮件标题格式联系客户经理，或联系美客多官方客服催促。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-17 10:21:04","用户":"随心","群":"","用户问询":"那假如说我卖工具行业中的一些什么布轮那些之类的。那会不会涉及到侵权","AI响应":"销售布轮等工具类产品本身不属于禁售品，但仍需注意以下侵权风险：\n1. 品牌侵权：确保产品及包装上没有未经授权的他人品牌Logo。\n2. 版权侵权：Listing的标题、描述及图片必须原创，严禁盗用其他卖家的图片或肖像。\n3. 专利侵权：核实产品外观或结构是否已申请专利保护。\n\n建议上架前在官方自查入口核实风险：https://global-selling.mercadolibre.com/help/1078","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-19 12:54:41","用户":"Li","群":"","用户问询":"原视频是我用软件剪的，加了我设计的LOGO，没有品牌，可以吗","AI响应":"可以投诉。即便没有品牌备案，对方盗用你原创剪辑且带有你设计LOGO的视频，仍属于侵权行为。你可以通过后台的举报功能，以“盗用图片/视频”或“版权侵权”为由发起投诉。建议准备好视频的原始剪辑工程文件或未加LOGO的原片作为原创证明。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-19 10:52:25","用户":"纳洛童","群":"","用户问询":"如果我没有授权，我可以售卖吗？我要怎么才能规避平台的侵权扫描","AI响应":"你好！很高兴为你解答。\n\n**如果没有正式授权，强烈建议不要售卖。**\n\n美客多对侵权行为采取**零容忍政策**，一旦发现会直接下架产品甚至永久关闭店铺。平台拥有极严的反作弊和侵权算法，**无法通过技术手段规避扫描**。\n\n**风险提示：**\n1. **系统自动抓取**：系统会自动识别标题、描述中的违规词（如 Spiderman）以及图片中的经典Logo和造型。\n2. **品牌方投诉**：漫威等权利人会定期在平台进行版权清理。\n3. **严重后果**：涉及售假/仿牌通常会直接永久封号，不存在所谓的“安全次数”。\n\n为了您的账号安全，建议选择无版权风险的通用款式或自有品牌产品进行售卖。\n\n**网页参考资料：**\n如何避免版权侵权：https://global-selling.mercadolibre.com/help/1078","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-18 09:41:46","用户":"j、","群":"","用户问询":"那我怎么看我开的是不是品牌广告 没有找到设置关键词的地方","AI响应":"你好！很高兴为你解答。品牌广告（Brand Ads）展示在搜索结果页最上方的“0号位”。如果你在广告后台没有看到关键词设置，可能是因为你目前开启的是商品广告（Product Ads），或者品牌广告选择了自动投放模式。手动模式下才可以直接增删关键词。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-17 20:44:38","用户":"骑着毛驴去拉萨","群":"","用户问询":"需要设置并开通你的品牌/店铺主页 这个需要怎么操作，流程发一下","AI响应":"你好！很高兴为你解答。\n\n树立品牌形象和开通主页，你可以通过以下步骤操作：\n\n1. 登录卖家后台，进入店铺装修或 My Page 模块。\n2. 设置店铺封面（Header）：上传具有辨识度的品牌背景图。\n3. 设置店铺 Logo：上传清晰的品牌图标。\n4. 设置店铺名称：确保名称准确且具有辨识度。\n\n通过以上板块的设置，即可塑造品牌风格并建立品牌第一印象。目前品牌店铺申请有新政策，建议你先完成上述页面装修，具体流程可向你的客户经理进一步查询。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-17 16:59:54","用户":"c.","群":"","用户问询":"我现在有品牌，但是我做的自发货，可以上传品牌授权吗","AI响应":"你好！很高兴为你解答。\n\n自发货卖家也是可以上传品牌授权的。在注册阶段填写申请表时，如果暂时没有准备好可以先空着，但是提交完申请后记得及时补上。\n\n在美客多进行品牌备案，你需要准备以下核心材料：\n1. 商标证书：提供在销售目的国（如墨西哥、巴西等）注册成功的商标证书（R标）。\n2. 品牌授权书：如果你不是商标的所有人，必须提供由商标持有人出具的正式授权书。\n3. 产品实物图：需要提供带有品牌 Logo 的产品实物照片。\n4. 品牌信息：包括品牌名称、所属类目等基本信息。\n\n你可以登录卖家后台，在导航栏中寻找 Listings 菜单下的 Brand Protection（品牌保护）或 Brand Registry（品牌注册）选项进行操作。\n\n需要注意的是，品牌审核周期通常为 2 至 4 周。审核通过后，你可以获得品牌保护以及品牌广告（Display）的投放权限。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-16 14:30:14","用户":"狗不吃你","群":"","用户问询":"我的店铺已经申请为官方品牌店，为什么没有品牌广告的投放权限","AI响应":"你好！品牌备案审核通过后，通常需要 2至4周 才能获得品牌广告（Display）的投放权限。\n\n如果您的官方品牌店已经申请成功且超过 4 周仍未获得权限，请按 “【品牌审核跟进】+店铺名+ID” 的邮件标题格式联系您的客户经理，或联系官方客服进行催促。\n\n此外，请确保您的店铺满足以下激活条件：\n1. 店铺信誉等级为绿色。\n2. 店铺内至少有三条在售商品。\n3. 在广告经营范畴中归属头部客户。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-16 11:25:27","用户":"狗不吃你","群":"","用户问询":"我已经满足了品牌广告的要求，在哪里可以查看品牌广告入口","AI响应":"...你好！品牌广告入口位于卖家中心后台。如果您在后台找不到具体的品牌入口位置，建议您联系我们的客服或者在后台开Case咨询，他们会指导您找到正确的操作位置。关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-14 18:49:24","用户":"波波波pewpewpew突突突","群":"","用户问询":"如果对方也有品牌授权的话两个相同的产品会被归类到一起吗","AI响应":"不会。美客多目前没有类似亚马逊的“跟卖”机制，即使是相同品牌和产品，不同卖家上传的Listing也是相互独立的，不会被归类或合并在一起。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-13 15:16:34","用户":"Charlene-Fulinda mic","群":"","用户问询":"半托管买家可以看到我们品牌主题吗 .联系到我们吗","AI响应":"你好！很高兴为你解答。\n\n在半托管模式下，买家是可以感知到你的品牌和店铺存在的：\n\n1. 品牌展示：买家在商品详情页（Listing）可以看到你的品牌名称。如果你已经完成了品牌备案，还可以拥有品牌旗舰店的展示效果，这对于工厂型卖家建立品牌心智非常有帮助。\n\n2. 店铺信息：买家可以看到你的店铺名称和信誉评级。\n\n3. 联系沟通：买家可以通过平台自带的问答系统（Pre-sale questions）在下单前向你咨询产品细节。在订单完成后，如果涉及售后问题，买家也可以通过订单消息系统与你取得联系。\n\n总结来说，半托管模式保留了你作为卖家的“身份感”，买家知道是在向你买东西，你也可以通过优质的服务和品牌形象来积累忠实客户。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-13 11:39:46","用户":"子聪","群":"","用户问询":"请问，我们本本店铺的品牌认证怎么弄，我们弄了好几次都不行","AI响应":"你好，表里留下注册邮箱后，就可以咨询我入驻、选品以及运营相关的问题啦。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-19 13:54:54","用户":"c","群":"","用户问询":"已经有自发货店铺怎么上传品牌授权","AI响应":"你好！很高兴为你解答。\n\n你可以登录卖家后台，在导航栏中寻找 Listings 菜单下的 Brand Protection（品牌保护）或 Brand Registry（品牌注册）选项进行资料上传。\n\n如果你是需要加入品牌保护计划（BPP），可以直接访问官方自查与申请入口：https://brand-protection.mercadolibre.com/ \n\n请注意，品牌备案通常需要2至4周。通过后方可获得品牌保护及品牌广告（Display）权限。只有品牌旗舰店才能在listing的品牌字段填写该品牌。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-18 09:53:21","用户":"j、","群":"","用户问询":"品牌店开通了不会自动开通品牌广告的吗","AI响应":"你好！很高兴为你解答。品牌官方店开通后不会自动开通品牌广告。你需要满足至少三条在售商品、店铺绿色信誉等条件，并提供美金付款账户、联系人及投放配置信息，联系对接经理或通过特定流程申请激活。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-17 22:01:59","用户":"问道","群":"","用户问询":"是一级授权，是否可以填写品牌名称？","AI响应":"你好！很高兴为你解答。\n\n虽然你拥有一级授权，但由于该品牌并未在销售目的国注册，目前无法在平台完成品牌备案。\n\n最近平台在严查品牌侵权，对于没有做品牌备案的店铺，后台上架产品时，在【品牌】字段处请填写通用，不要填写具体的品牌名称。如果直接填写品牌名称，会被系统抓取并判定为侵权，从而导致产品下架或店铺受损。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-17 10:39:05","用户":"时倾","群":"","用户问询":"就是你们现在还不能有品牌官方店吗","AI响应":"你好！很高兴为你解答。现在没有local品牌不能注册官方店。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-17 09:44:46","用户":"joker","群":"","用户问询":"普通品牌的足球鞋，品牌需要怎么填写","AI响应":"如果您的产品没有品牌或属于普通无品牌商品，在上传时品牌（Brand）字段必须填写 Generic。请勿在品牌、型号或制造商字段填写未获得授权的品牌名，以免被系统判定侵权。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-16 14:58:52","用户":"Echo","群":"","用户问询":"申请成为品牌旗舰店键鼠类目有什么要求","AI响应":"申请品牌旗舰店通常需要满足以下条件：\n1. 必须已成功加入品牌保护计划（BPP）。\n2. 店铺信誉等级为绿色。\n3. 键鼠类目需提供该品牌在销售目的国的商标证书（R标）。\n4. 半托管或全托管模式仅限申请一个。\n\n具体申请请联系您的客户经理，由经理评估店铺表现及品牌影响力后协助开通。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-16 14:58:03","用户":"Echo","群":"","用户问询":"申请品牌保护需要店铺销售额和单量有要求吗","AI响应":"申请品牌保护计划对店铺的销售额和单量没有硬性要求。只要您拥有销售目的国的有效商标证书（R标）或相关授权，即可按流程提交申请。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-16 14:43:37","用户":"狗不吃你","群":"","用户问询":"申请品牌店之后还可以做什么操作来提升店铺的流量","AI响应":"你好！申请品牌店后，你可以通过以下操作进一步提升店铺流量：\n\n1. 完善店铺装修：使用My Page店铺装修工具，在Header下方添加横幅（Main banner）展示品牌故事、活动或爆品。建议按照“促销>>分类>>产品”的顺序布局，打造场景营销。\n\n2. 使用Clips短视频：这是目前非常推荐的工具，能直接增加曝光入口，直观展示产品功能，帮助销量提升。\n\n3. 开启广告工具：利用品牌推广广告和竞价广告撬动流量，实现搜索排名和出单的突破。\n\n4. 参加平台活动：积极提报DoD、LD、rebate等促销活动，利用大促流量红利实现销量增长。\n\n5. 优化Listing：确保每个产品有3张以上高质量图片，全方位展示细节，并持续优化标题和关键词。\n\n6. 提升品类权重：通过持续的广告投放和Listing优化，增加被搜索关键词搜到的次数，解锁更多品类专属流量。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-16 11:23:47","用户":"狗不吃你","群":"","用户问询":"你好，我需要怎么做才能开启品牌店铺广告呢","AI响应":"...你好！首次激活美客多品牌广告需要具备以下条件：拥有美客多品牌官方店铺，店铺内至少有三条在售商品，店铺信誉等级为绿色，并且在广告经营范畴中归属头部客户。关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-15 16:24:48","用户":"wydsn","群":"","用户问询":"是否可以针对竞争对手的品牌名称投流？","AI响应":"视情况而论，可参考下图：\nhttps://file.marsmind.cc/boot-admin/mercado/20260715/2077293749856690178.jpg","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-15 16:16:41","用户":"David Xu","群":"","用户问询":"是否可以针对竞争对手的品牌名称投流？","AI响应":"视情况而论，可参考下图：\nhttps://file.marsmind.cc/boot-admin/mercado/20260715/2077293749856690178.jpg","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-15 16:16:39","用户":"David Xu","群":"","用户问询":"是否可以针对竞争对手的品牌名称投流？","AI响应":"不可以。美客多品牌广告不支持针对竞争对手的品牌名称进行投流。\n\nhttps://file.marsmind.cc/boot-admin/mercado/20260715/2077293749856690178.jpg","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-15 16:16:19","用户":"David Xu","群":"","用户问询":"创建美客多品牌广告需要提供哪些信息？","AI响应":"创建品牌广告需提供：美金付款银行账户，账单联系人、邮箱及电话。此外需配置品牌名称、官方店/落地页链接、投放周期、预算及投放方式（手动投放需提供商品和关键词）。\n\nhttps://file.marsmind.cc/boot-admin/mercado/20260715/2077297883590746113.jpg","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-15 16:15:49","用户":"David Xu","群":"","用户问询":"是否可以针对竞争对手的品牌名称投流？","AI响应":"视情况而论，可参考下图：\nhttps://file.marsmind.cc/boot-admin/mercado/20260715/2077293749856690178.jpg","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-15 16:15:23","用户":"David Xu","群":"","用户问询":"是否可以针对竞争对手的品牌名称投流？","AI响应":"不可以。美客多品牌广告不支持针对竞争对手的品牌名称进行投流。\n\nhttps://file.marsmind.cc/boot-admin/mercado/20260715/2077293749856690178.jpg","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-15 16:13:50","用户":"David Xu","群":"","用户问询":"是否可以针对竞争对手的品牌名称投流？","AI响应":"不可以。美客多品牌广告不支持针对竞争对手的品牌名称进行投流。\n\nhttps://file.marsmind.cc/boot-admin/mercado/20260715/2077293749856690178.jpg","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-15 16:07:54","用户":"David Xu","群":"","用户问询":"美客多品牌广告优化时需要关注哪些信号指标？","AI响应":"美客多品牌广告优化时需要关注以下信号指标：\n\n1. Budget Losses：因预算不足导致的曝光受限。\n2. Losses Due to Ranking：因排名不足导致的曝光受限，此时需要考虑提高CPC出价和商品的CVR。\n\nhttps://file.marsmind.cc/boot-admin/mercado/20260715/2077294571864776706.jpg","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-15 16:02:35","用户":"David Xu","群":"","用户问询":"品牌广告是否仅适合比较大的品牌？","AI响应":"不是，品牌广告适用于所有符合条件的品牌广告主。它的适用场景非常广泛，包括强化特定品类或产品线的销售、提升品牌知名度并为官方店铺引流、增强新品发布的考虑度，以及在促销活动中提升曝光。此外，你还可以利用品牌广告在关键词上挑战竞争对手、突出产品卖点，或为排名较低的通用产品争取更多曝光。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-15 16:02:20","用户":"David Xu","群":"","用户问询":"创建美客多品牌广告需要提供哪些信息？","AI响应":"创建品牌广告需提供：美金付款银行账户，账单联系人、邮箱及电话。此外需配置品牌名称、官方店/落地页链接、投放周期、预算及投放方式（手动投放需提供商品和关键词）。\n\nhttps://file.marsmind.cc/boot-admin/mercado/20260715/2077297883590746113.jpg","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-15 16:00:37","用户":"David Xu","群":"","用户问询":"品牌广告的投放模式是否有不同选择？","AI响应":"请参考此图:\nhttps://file.marsmind.cc/boot-admin/mercado/20260715/2077296555204337666.jpg","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-14 23:53:08","用户":"joker","群":"","用户问询":"销售不是品牌的足球鞋，需要注意什么","AI响应":"卖家您好，销售非品牌足球鞋需注意：\n1. 严禁侵权：确保产品外观、Logo及描述不侵犯知名品牌（如耐克、阿迪达斯等）的知识产权。\n2. 属性填写：品牌属性请填写“Generic”或“Generic Brand”，切勿乱填。\n3. 图片合规：实拍图不可出现任何品牌标识或经过遮挡的痕迹。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-14 16:03:21","用户":"东","群":"","用户问询":"可以查侵权的 网址发一下 查侵权的 网址发一下","AI响应":"你可以通过以下官方渠道查询商标、专利等信息，以规避侵权风险：\n\n1. 世界知识产权组织（WIPO）：https://www.wipo.int/reference/en/\n2. 墨西哥工业产权局（IMPI）：https://www.gob.mx/impi\n3. 巴西国家工业产权局（INPI）：https://www.gov.br/inpi/pt-br\n4. 美国专利商标局（USPTO）：https://www.uspto.gov/\n\n在选品时，请务必确保产品不涉及品牌侵权、外观侵权或专利侵权。如果产品包含知名IP元素（如迪士尼、漫威等），必须获得品牌方的正式授权。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-14 09:37:53","用户":"波波波pewpewpew突突突","群":"","用户问询":"做了品牌备案后还可以使用自发货吗","AI响应":"可以的。品牌备案与物流模式无关，完成品牌备案后，您依然可以根据业务需求选择使用自发货模式或海外仓模式。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-18 09:44:17","用户":"j、","群":"","用户问询":"我的品牌店是美标的符合资质吗","AI响应":"你好！很高兴为你解答。只要你拥有品牌官方店且店铺信誉为绿色，即符合申请品牌广告的资质。平台支持卖家通过品牌旗舰店和品牌推广广告等工具进行推广。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-18 09:40:59","用户":"j、","群":"","用户问询":"会有单独的品牌广告的窗口吗","AI响应":"你好！很高兴为你解答。品牌广告没有单独的入口，它集成在卖家后台的广告中心（Advertising Center）内。你可以通过广告后台设置预算，平台会根据你的设置自动调整投放。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-18 09:38:43","用户":"时倾","群":"","用户问询":"就是说品牌官方店怎么做","AI响应":"现在没有local品牌不能注册官方店。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-17 19:56:08","用户":"蓝七","群":"","用户问询":"没有品牌填写什么？","AI响应":"你好！如果您的产品没有品牌，在上传商品填写品牌（Brand）字段时，请务必填写 Generic。这样可以避免因未备案而产生的侵权风险。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-17 18:06:38","用户":"肖丽娟｜Sherilyn@大数跨境","群":"","用户问询":"可以用美国R标做品牌备案吗","AI响应":"你好！很高兴为你解答。\n\n在美客多进行品牌备案，需要提供在销售目的国（如墨西哥、巴西等）注册成功的商标证书（R标）。\n\n目前平台不支持直接使用美国商标在墨西哥或巴西等站点进行品牌备案。如果您希望在对应站点获得品牌保护及广告投放权限，建议您在销售目的国当地注册商标。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-16 22:31:49","用户":"Echo","群":"","用户问询":"申请成为品牌旗舰店需要销售额吗","AI响应":"申请品牌官方旗舰店对销售额没有明确的数额要求，但绿色信誉是必备条件。此外，官方旗舰店的申请由客户经理根据品牌影响力和店铺表现进行综合评估。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-16 14:28:41","用户":"狗不吃你","群":"","用户问询":"品牌广告需要怎么申请","AI响应":"你好！首次激活美客多品牌广告需要具备以下条件：拥有美客多品牌官方店铺，至少有三条在售商品，店铺信誉等级为绿色，并且在广告经营范畴中归属头部客户。\n\n如果您尚未完成品牌备案，需要准备以下核心材料：\n1. 商标证书：提供在销售目的国注册成功的商标证书（R标）。\n2. 品牌授权书：若非商标所有人，需提供正式授权书。\n3. 产品实物图：带有品牌 Logo 的产品实物照片。\n4. 品牌信息：品牌名称、所属类目等。\n\n备案流程通常需要2至4周，审核通过后即可获得品牌广告（Display）的投放权限。\n\n网页参考资料：\nhttps://mp.weixin.qq.com/s/ERWrC_KNnIdUDLBqHQEJZQ\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-16 13:30:38","用户":"Echo","群":"","用户问询":"好的，本土账号怎么申请品牌保护","AI响应":"本土账号申请品牌保护，请直接登录卖家后台，通过 Brand Protection 页面提交商标证书和产品图。审核时间通常为 5 个工作日。若在后台找不到入口，建议联系后台客服开 Case 咨询具体操作位置。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-16 11:35:01","用户":"狗不吃你","群":"","用户问询":"品牌店的流量优势体现在哪里","AI响应":"你好！绿色信誉是申请品牌官方店的必备条件。品牌官方店在流量和运营方面具有显著优势，主要体现在：Full仓（海外仓）模式下物流时效快，能显著缩短配送时间，提升买家购物体验，减少物流延迟导致的投诉。同时，品牌店拥有更高的转化率，因为买家更倾向于购买配送速度快的商品，非常适合有一定销售规模、需要快速响应市场的卖家。关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"}]},{"一级大类":"营销活动","二级子类":"广告投放","Past 7 Days":149,"Previous 2026-07-06 to 2026-07-12":90,"Change":59,"WoW":0.6555555555555556,"Past 7 Share":0.021628683408332124,"高频问题":"广告/关键词投放","__details":[{"时间":"2026-07-17 17:06:27","用户":"纯属巧合","群":"","用户问询":"我现在店铺有140个粉丝， 而且每天平均增加20个粉丝的，这个数据是什么样的一个水平，粉丝量的增加对店铺有什么好的影响吗？ 我应该要怎么去利用好这些粉丝，以及我还要做哪些动作就可以继续增加粉丝量","AI响应":"你好！很高兴为你解答。\n\n每天平均增加20个粉丝对于新店或处于上升期的店铺来说是一个非常不错的表现，说明你的产品吸引力强且店铺活跃度高。\n\n关于粉丝的影响及运营建议如下：\n\n1. 粉丝量增加的好处：\n- 提高复购率：粉丝更容易看到你的店铺动态，产生二次购买。\n- 品牌背书：粉丝数量是店铺实力的直观体现，能增强新客户下单的信心。\n- 流量权重：虽然粉丝不直接决定搜索排名，但粉丝带来的稳定转化能间接提升 Listing 的权重。\n\n2. 如何利用好现有粉丝：\n- 使用 My Page 工具：精心装修你的店铺主页，将热销品和新品放在显眼位置，让粉丝进店后能快速看到。\n- 保持产品更新：定期上架新品，系统会向关注你店铺的粉丝推送相关动态。\n- 参与平台活动：利用大促期间的折扣吸引粉丝回流。\n\n3. 如何继续增加粉丝量：\n- 使用 Clips 短视频：这是目前涨粉最快的工具。通过直观、有趣的短视频展示产品功能，能吸引大量潜在客户关注店铺。\n- 优化 Listing 质量：确保图片精美、描述准确，给买家留下专业的品牌形象。\n- 开启广告工具：如果你符合条件，开启广告能带来更多精准流量，从而带动粉丝增长。\n- 保持绿色信誉：良好的售后和物流表现是留住粉丝并吸引新粉丝的基础。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-16 14:12:11","用户":"Butter","群":"","用户问询":"我设置的预算是每一天不超过100美金的 怎么这里显示一天花了差不多500美金的广告","AI响应":"你好！从你提供的账单明细表来看，07/06/2026 这一天出现了大量密集的 Product Ads payment 扣款记录。\n\n这并不代表这些广告费都是在当天产生的，而是平台在当天集中结算了之前的广告消耗。账单表格记录的是扣款执行日期，而不是广告点击发生的日期。\n\n由于广告费用需要经过平台校验，通常会有一定的延迟结算。你看到的这一天扣除 500 多美金，实际上是平台把你过去几天甚至更长时间内、每天在 100 美金预算内产生的消耗，集中在这一天从你的账户余额中扣除了。\n\n建议你回到广告管理后台，查看 6 月份每一天的具体消耗曲线，只要后台显示的每日消耗没有超过你设置的预算，就是正常的。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-16 14:14:48","用户":"Butter","群":"","用户问询":"那就是说 销售额也还要给16% 的税费然后广告花费还要另外给16%的税 吗","AI响应":"你好！很高兴为你解答。\n\n是的，这是两个不同维度的税务支出：\n\n1. 销售环节：如果你通过墨西哥海外仓销售且没有上传有效RFC税号，平台会针对你的销售额执行高额预扣（增值税16%+所得税20%，共计36%）。如果你有RFC税号，预扣税率会根据你的账户类型降低。\n\n2. 成本环节：广告费属于你在平台购买的服务，其性质类似于购买商品，因此在支付广告费时，需要额外支付16%的增值税。你在账单中看到的广告扣款是已经包含这16%税费的最终金额。\n\n简单来说，销售额的税是从你的收入里扣除，而广告费的税是作为你经营成本的一部分由你承担。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-14 19:22:32","用户":"梓烨","群":"","用户问询":"这个是官方发布的通知吗？也就是说我的广告语言等到7月底才能有？ 位","AI响应":"你好！关于UP模式的迁移升级，确实是平台正在进行的系统调整。\n\n目前系统正在分批次平稳迁移中，为了保障店铺和商品的稳定性，技术团队正在严谨地进行系统调优。由于全平台商品数量庞大，预计将在七月底完成全量迁移。\n\n在迁移过程中，确实会有部分店铺出现指标显示异常或功能暂时受限的情况。迁移完成后，您就可以无缝体验新功能，届时各项信息也会趋于规范化。请你再耐心等待一下，迁移完成后即可恢复正常使用。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-14 19:20:27","用户":"梓烨","群":"","用户问询":"请问为什么我的广告位突然间就没有了从7号开始到现在14号一直没有广告","AI响应":"你好！根据你提供的图片信息和目前平台的情况，这主要是因为平台正在进行统一产品广告体验（UP模式）的迁移升级。\n\n目前UP模式无需卖家手动申请开通，平台系统会自动为您进行升级。由于全平台的商品数量非常庞大，为了保障大家店铺和商品的稳定性，目前系统正在分批次平稳迁移中。在迁移过程中，技术团队也会严谨地进行系统调优，因此会有部分店铺先体验到新功能，而部分店铺在迁移期间可能会出现指标显示异常、广告位暂时缺失或访问量数据不完整的情况。\n\n预计将在七月底完成全量迁移，还请暂未完成升级或处于迁移波动期的卖家朋友们耐心等待一下。迁移完成后，平台内的信息将逐渐趋于规范化，您即可无缝体验新功能。在此期间，建议你通过销售报告来跟踪广告效果。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-18 20:22:31","用户":"杭州远景-誉江南张冬贤13592864225","群":"","用户问询":"美国转运仓的哥伦比亚，巴西阿根廷，智利可以开启广告吗","AI响应":"你好！很高兴为你解答。\n\n美国转运仓模式下，阿根廷、智利、哥伦比亚站点是可以开启广告的。\n\n该模式支持卖家在后台自主创建购物车链接，并且所有站点均支持DOTD、LD、Rebate等多种活动的自主提报。只要你的店铺状态正常且Listing符合广告投放要求，即可在后台进行广告操作。\n\n关于巴西相关问题我暂时无法回答，后续我会丰富我的知识库，敬请见谅。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-18 14:59:10","用户":"j、","群":"","用户问询":"加入全店商品的广告开启后，后续有其他上新款会自动加入该广告组吗","AI响应":"你好！很高兴为你解答。如果你在创建广告组时选择了全店商品，后续上架的新款通常不会自动加入。建议你定期检查广告组，手动将新产品勾选并添加进去。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-17 09:28:02","用户":"Star Chow","群":"","用户问询":"我可以在现有的广告里，进行产品排除，并新增产品嘛、","AI响应":"可以的。你可以在现有的广告活动中，通过勾选或取消勾选来排除不需要推广的产品，并新增其他想要推广的产品。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-15 15:57:58","用户":"David Xu","群":"","用户问询":"广告组实际的ACOS低于设定的ACOS，怎么解读？","AI响应":"以一个月为周期，实际ACOS在设定值±5%范围内波动属于正常。若短时花超，可能是ROAS设置与大盘不符，建议新品ROAS设在1-5区间。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-15 12:32:58","用户":"百事可乐","群":"","用户问询":"后台如何开启广告，请给我步骤，是否每个站点的广告是独立的。","AI响应":"创建广告活动步骤：\n1. 进入卖家后台，点击“Advertising”菜单。\n2. 点击“Create campaign”。\n3. 设置广告活动名称、每日预算和目标出价（ACOS）。\n4. 选择要推广的商品并确认。\n\n每个站点的广告是独立的，您需要切换到对应站点后台分别进行设置和管理。\n\n网页参考资料：\n广告管理后台操作指南：https://doc.weixin.qq.com/pdf/d3_AEYA6AbpAAoXASq866AesAUQYKAOE","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-15 10:32:50","用户":"哎嘿","群":"","用户问询":"你好，美客多每月月中扣的广告费是上个月一整个月的吗","AI响应":"美客多的广告费用（Product Ads）直接从您的卖家账户余额中扣除。\n\n关于扣费周期，广告花费和账单金额可能对不上，原因包括：费用存在跨月结算，当月未完成校验的广告费会顺延到下个月账单扣除；此外，后台花费不含税，而账单金额是含税金额。\n\n建议您拉取连续两个月的广告总花费，并与后一个月的账单合并对账，以确保金额准确。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-14 19:22:47","用户":"梓烨","群":"","用户问询":"这个是官方发布的通知吗？也就是说我的广告位等到7月底才能有？","AI响应":"你好！关于UP模式的迁移升级，确实是平台系统正在进行的统一调整。\n\n目前系统正在分批次平稳迁移中，为了保障店铺和商品的稳定性，技术团队正在严谨地进行系统调优。由于全平台商品数量庞大，预计将在七月底完成全量迁移。\n\n在迁移过程中，确实会有部分店铺出现指标显示异常或广告位暂时受限的情况。迁移完成后，您就可以无缝体验新功能，届时各项信息也会趋于规范化。请你再耐心等待一下，迁移完成后即可恢复正常使用。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-18 15:37:02","用户":"纳洛童","群":"","用户问询":"这个广告要怎么调整才能让它放大销量增加收益","AI响应":"你好！很高兴为你解答。基于你目前 **5.02x** 的高 ROAS，说明该产品市场接受度很高，可以按以下步骤放大销量：\n\n1. **继续提高每日预算**：目前的 3 美金预算可能很快就会消耗完。既然 ROAS 远超预期，建议逐步将预算调高至 5-10 美金，观察流量承接情况。\n2. **优化出价策略**：目前 ROAS 目标设为 3x，可以尝试小幅下调目标（如设为 2.5x），让系统在更多高转化位争取曝光，进一步撬动销量。\n3. **利用 Clips 短视频**：针对这种带音乐和 5D 眼睛的娃娃，拍摄展示动态效果和音乐的短视频，能直接增加曝光入口，提升转化。\n4. **增加变体投放**：如果你有其他款式的娃娃，可以加入同一广告组或开启新活动，利用爆款带新。\n\n**特别提醒**：放大销量的同时，请务必核查库存，避免因断货导致广告权重下降。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-18 15:02:55","用户":"j、","群":"","用户问询":"那一款商品是否被同时加入多个广告组有提示吗","AI响应":"你好！很高兴为你解答。系统会有提示，通常一个商品只能在一个广告组中处于开启状态。如果该商品已在其他广告组中，系统会提示该商品已有关联的广告活动。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-17 14:12:46","用户":"雪","群":"","用户问询":"那要是需要充值广告开广告在哪里操作","AI响应":"你好！美客多的广告费用不需要提前充值，系统会直接从您的卖家账户余额中扣除。您只需进入卖家后台的广告模块（Mercado Ads），按照创建广告活动的步骤操作即可。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-17 09:34:27","用户":"Star Chow","群":"","用户问询":"对了，我怎么看广告有没有出单呢？","AI响应":"从你提供的截图看，Attributed sales显示为1，代表广告直接带来了1单。Other orders显示为2，代表广告间接带动了2单。你可以通过这些指标衡量推广效果。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-16 19:15:17","用户":"Jhon Suen","群":"","用户问询":"意思是先有了销售额才能投放广告吗","AI响应":"你好！很高兴为你解答。是的，广告费用会直接从账户余额扣除。平台对卖家没有固定的最低销售额要求，但建议先产生销售额积累余额后再进行投放。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-16 10:24:28","用户":"灵感菇oi","群":"","用户问询":"您好，广告是只能有销量的才能打吗","AI响应":"你好！很高兴为你解答。\n\n不是的，没有销量的商品也可以开启广告。\n\n美客多的商品广告（Product Ads）对商品的要求主要包括：\n1. 商品处于激活状态且有库存。\n2. 商品价格不低于各站点的最低限制。\n3. 卖家信誉等级在黄色及以上（新卖家在信誉等级为灰色时也可以开启）。\n\n对于新上架或没有销量的商品，开启广告可以帮助商品在搜索结果中获得更高曝光，从而加速积累销量和评价。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-15 15:57:50","用户":"David Xu","群":"","用户问询":"广告花费和账单对不上是什么原因？","AI响应":"广告花费和账单金额可能对不上的原因包括：费用存在跨月结算，当月未完成校验的广告费会顺延到下个月账单扣除；后台花费不含税，账单金额是含税金额。建议拉取连续两个月广告总花费，和后一个月账单合并对账。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-15 15:55:25","用户":"David Xu","群":"","用户问询":"首次激活商品广告需要具备哪些条件？","AI响应":"首次激活美客多商品广告需满足以下条件：\n\n1. 店铺要求：注册满15天，账号状态正常，无逾期账单、仿品违规或缺失资质，且店内有在售商品。\n2. 商品要求：链接在售、有库存、类目合规；平均评分高于2星（基于10条以上评价）；无红色信誉评级；非二手/分类商品；图片质量达标。\n3. 广告组要求：所属广告组有预算，广告活动开启。巴西站部分母婴类目（如奶瓶、奶粉等）不符合条件。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-14 13:56:15","用户":"悠","群":"","用户问询":"美客多的广告如果频繁调整会导致什么情况","AI响应":"频繁调整广告会导致系统重新进入学习期，使算法难以稳定优化。这通常会造成广告数据波动、转化率下降以及获客成本上升。建议每次调整后观察至少一周，给系统足够的学习时间。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-14 11:17:51","用户":"Chelsey Chen","群":"","用户问询":"FBM的卖家，新品如何开通广告？","AI响应":"你好！很高兴为你解答。FBM卖家开通广告需满足：店铺信誉黄色及以上、注册满15天、有1单销售记录且无逾期发票。满足条件后可在后台广告管理界面创建。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-13 22:33:46","用户":"泰戈","群":"","用户问询":"怎么查看卖出的产品是自然流还是通过广告？","AI响应":"卖家您好，您可以按照以下步骤查看订单来源：\n\n1. 进入卖家后台，点击 **Advertising**（广告）板块。\n2. 在广告管理界面中，您可以查看 **Metrics**（指标）或下载广告报告。\n3. 通过报告中的 **Direct Sales**（直接销售）和 **Assisted Sales**（辅助销售）数据，可以识别出哪些订单是通过广告点击后转化的。\n\n如果订单没有出现在广告报告的转化记录中，则该订单属于**自然流量**成交。\n\n此外，在 **Orders**（订单）详情中，平台通常不会直接标注单个订单的流量来源，因此必须结合广告后台的数据报表进行对比分析。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-13 15:51:32","用户":"Felicity 103%","群":"","用户问询":"2026广告开通sop 有这个文件吗","AI响应":"不好意思，该问题我没有答案，请点击以下链接咨询人工客服：\nhttps://work.weixin.qq.com/kfid/kfc7c47108dec2b0070?enc_scene=ENCGH59j4kB9XCrk4dX6Jt2BZeAhKD7ZBUNQhrF2CcGYyCW&scene_param=customer_id=7881303335116519","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-13 11:42:03","用户":"柯培鑫","群":"","用户问询":"广告费是不是要提前充值才能开启？","AI响应":"不需要提前充值。\n\n美客多的广告费用（Product Ads）**不需要您额外绑定银行卡来支付，也不需要提前充值**。\n\n系统会自动从您的**卖家账户余额（卖家钱包）**中直接扣除。如果您的店铺产生了销售额，广告费会从您的货款中抵扣；如果目前还没有销售额，产生的广告账单会记录在您的账户中，等后续产生订单后再进行结算。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-19 15:01:27","用户":"Dola","群":"","用户问询":"广告的历史操作记录在哪里可以看","AI响应":"你好！很高兴为你解答。\n\n你可以进入卖家后台的广告模块（Mercado Ads），在对应的广告组或账户设置中查看。通常在广告管理界面会有“操作记录”或“History”选项，记录了广告状态的开启、暂停以及预算调整等历史操作。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-19 11:59:12","用户":"波波波pewpewpew突突突","群":"","用户问询":"无法创建关键字广告 是什么原因","AI响应":"开通广告须符合：有绿色信誉（半托管黄色）、活跃15天以上、出10单（半托管1单），且账户余额充足无逾期欠款。若未达标则无法创建。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-19 11:10:57","用户":"若初见","群":"","用户问询":"哥伦比亚不能开广告吗","AI响应":"你好！很高兴为你解答。\n\n哥伦比亚站点是可以开启广告的。\n\n美客多目前在墨西哥、巴西、智利、哥伦比亚和阿根廷这五大站点均已开放了商品广告（Product Ads）功能。\n\n如果你的哥伦比亚店铺无法开启广告，请检查以下几点：\n1. 店铺信誉：店铺信誉需要达到绿色（最佳）或黄色，且不能有严重的违规记录。\n2. 销售额：部分站点可能需要达到一定的历史销售额或订单量门槛后才会自动激活广告功能。\n3. 支付方式：确保后台已绑定有效的支付方式用于支付广告费用。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\n\n参考图片：\nhttps://file.marsmind.cc/boot-admin/mercado/20260715/2077300721175814145.png","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-18 09:39:10","用户":"j、","群":"","用户问询":"如果开通了是在哪里调整广告的","AI响应":"你好！很高兴为你解答。品牌广告开通后，你可以通过以下方式优化调整：增减关键词（手动广告组）、调整预算以及修改CPC竞价额度。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-17 17:00:22","用户":"David Xu","群":"","用户问询":"新品烧广告了怎么还是未达标状态","AI响应":"新品赛道除日均花费达标外，还需满足广告累计开启天数大于等于7天的硬性观察期。请保持广告持续开启，满7天后系统将自动判定。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-17 14:38:28","用户":"骑着毛驴去拉萨","群":"","用户问询":"设置的每天预算1美金，如果点击量大，会超过一美金吗 有转化的时候，平台会需要抽成哑巴 有转化的时候，平台会需要抽成吗","AI响应":"你好！实际花费可能会在预算基础上略有波动，但平台会根据你设置的每日最高预算进行自动调整。关于抽成，平台广告主要按点击计费（CPC），即用户点击才扣费；产生订单后，平台会正常收取店铺佣金，不会因为是广告单而额外抽成。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-17 11:15:07","用户":"Star Chow","群":"","用户问询":"就是如何创建广告这些","AI响应":"创建广告活动只需三步：\n1. 进入广告管理后台，点击“创建广告活动”。\n2. 设置广告活动名称、每日最高预算和目标出价。\n3. 选择要推广的具体商品，完成创建。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-17 09:29:09","用户":"Star Chow","群":"","用户问询":"然后广告报告，请问怎么看呢？","AI响应":"在广告管理后台，点击右上角的“Create report”按钮，即可根据需要生成并查看销售额、点击率、ROI等维度的广告效果报告。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-17 02:57:14","用户":"骑着毛驴去拉萨","群":"","用户问询":"这广告开的是海伦的吗","AI响应":"你好！从你提供的图片来看，当前广告活动名称为“自由市场运动”，包含了13条广告。由于图片中没有显示具体的商品详情或Listing标题，无法直接判断是否包含海伦的链接。你可以点击活动名称进入详情页，查看具体参与推广的商品列表。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-16 14:12:27","用户":"Butter","群":"","用户问询":"广告也要算上税的吗","AI响应":"你好！是的，广告费也是需要计算税费的。\n\n广告后台显示的“投资额”或“花费”通常是不含税的纯消耗金额。而当这些费用计入你的账单进行实际扣款时，平台会根据当地税务政策加收相应的税费。\n\n这就是为什么你看到的账单扣款总额往往会高于广告后台显示的消耗金额。建议你在对账时，将后台花费加上对应的税率后再与账单进行比对。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-16 13:53:33","用户":"B.","群":"","用户问询":"能否详细说明美客多的广告规则","AI响应":"你好！很高兴为你解答。\n\n美客多商品广告（Product Ads）主要基于以下规则运行：\n\n1. 计费模式：采用CPC（Cost Per Click）模式，即只有当买家点击您的广告时才会产生费用，单纯的曝光是不收费的。\n\n2. 广告排名：广告的展示位置由“广告分数”决定。广告分数由两个核心因素组成：\n- 竞价（Bid）：即您愿意为每次点击支付的最高费用。\n- 广告质量：包括Listing的转化率、图片质量、描述完整度以及店铺信誉等。\n\n3. 投放位置：广告会出现在搜索结果页的顶部、中部、底部，以及产品详情页的“相关产品”推荐栏中。\n\n4. 激活要求：\n- 所属广告组必须有可用预算。\n- 商品所在的广告活动必须处于开启状态。\n- 巴西站点部分特殊类目（如奶瓶、奶嘴、婴幼儿配方奶粉等）不符合激活条件。\n\n5. 审核机制：平台会对广告创意、关键词和落地页进行审核，确保符合平台广告政策。\n\n6. 智能管理：系统会根据您设定的每日预算和目标策略（如追求销量或追求利润），自动在不同时段和位置分配流量，以优化您的投资回报率。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-15 20:36:11","用户":"Janice Tang","群":"","用户问询":"现在什么时候可以开广告","AI响应":"你好！很高兴为你解答。当你的店铺信誉等级达到绿色，且Listing已经获得首单销量后，即可在后台开启广告。建议优先为高转化、有库存优势的产品开启。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-15 16:00:45","用户":"David Xu","群":"","用户问询":"如何创建第一个广告组？","AI响应":"第一步是进入卖家后台的广告模块（即Mercado Ads）。\n\nhttps://file.marsmind.cc/boot-admin/mercado/20260715/2077282498799788033.jpg","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-15 15:51:50","用户":"David Xu","群":"","用户问询":"什么是商品广告？","AI响应":"商品广告（即卖家后台的Product Ads）是美客多广告的搜索效果广告产品，投放于商品链接，即可在搜索结果、详情页和关联推荐的黄金展位中获取更高曝光。作为平台的入门级广告形式，它能帮助卖家显著提升商品曝光，在竞品中抢占流量先机。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-15 15:17:46","用户":"David Xu","群":"","用户问询":"如何创建第一个广告组","AI响应":"创建美客多广告组步骤如下：\n\n1. 进入卖家后台广告模块（Mercado Ads）。\nhttps://file.marsmind.cc/boot-admin/mercado/20260715/2077282498799788033.jpg\n\n2. 勾选需要开通广告的商品。\nhttps://file.marsmind.cc/boot-admin/mercado/20260715/2077282543955664897.jpg\n\n3. 配置广告组三要素：目标ROAS、广告组名称（限30字符）和每日预算。\nhttps://file.marsmind.cc/boot-admin/mercado/20260715/2077282684624232450.jpg","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-15 08:48:11","用户":"骑着毛驴去拉萨","群":"","用户问询":"还没十单的新店能开广告吗","AI响应":"你好！这取决于你的店铺类型：\n\n**1. 如果你是自发货VIP店铺：**\n可以开启！根据美客多2026年最新的广告门槛政策，自发货VIP店铺**无任何出单要求**，也不需要店铺信誉。只要满足以下条件即可开启：\n*   注册满15天。\n*   账户健康，无逾期账单。\n*   有链接在售。\n\n**2. 如果你是普通跨境店铺（海外仓模式）：**\n通常需要店铺信誉达到**绿色**（即完成前10单初始积累并获得信誉评价）后，系统才会开放广告功能。\n\n利用广告工具可以有效撬动流量，帮助新店实现从0到1的突破。建议你检查后台广告界面是否已激活。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-15 00:54:47","用户":"___低 调↘","群":"","用户问询":"美客多广告如何充钱","AI响应":"美客多的广告费用不需要额外绑定银行卡支付，系统会直接从您的卖家账户余额中扣除。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-14 16:07:24","用户":"NPT","群":"","用户问询":"全托可以开广告？","AI响应":"全托管模式目前不支持卖家自主开启和操作广告。全托管店铺的流量主要由平台负责统一调配和推广，卖家只需负责供货。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-14 11:01:34","用户":"Chelsey Chen","群":"","用户问询":"FBM的卖家，新品可以开广告吗","AI响应":"可以。平台为新品提供展示机会和广告支持。建议将新品放在独立的广告组中，并设置较高的目标ACOS值，以帮助新品在没有销售记录的情况下抢夺曝光机会。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-14 11:00:57","用户":"Chelsey Chen","群":"","用户问询":"新品可以开广告吗","AI响应":"可以。半托管商家需满足店铺信誉黄色及以上、注册满15天、有1单销售记录且无逾期发票。建议将新品单独分组，设置较高目标ACOS以获取曝光。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-13 23:04:35","用户":"Rᴇ","群":"","用户问询":"半托管店铺要投广告吗","AI响应":"半托管商家可自行设置广告，商家开通广告的门槛条件为：\n1）店铺信誉：黄色及以上\n2）店铺注册时间≥15天\n3）店铺销售记录≥1单\n4）店铺没有逾期未付的发票","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-13 20:28:31","用户":"唐振","群":"","用户问询":"新品广告开不了怎么解决","AI响应":"此情况通常由网络环境或浏览器兼容性引起。建议优先使用Chrome浏览器并清除缓存或使用无痕模式，并务必关闭网页自动翻译功能。避开邮件链接直接从后台进入，若仍失败请更换设备或切换网络环境重试。\n\n此外，平台对新品推广有支持政策，如提供新品推广计划、允许使用折扣码等，以帮助新品获得曝光。平台为新品推广提供多种支持，包括新品展示机会、折扣工具以及广告投放支持。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-16 12:24:57","用户":"David Xu","群":"","用户问询":"如何创建广告组","AI响应":"创建广告组分为三步：\n1. 进入卖家后台广告模块（Mercado Ads）。\n2. 勾选需要开通广告的商品。\n3. 配置目标ROAS、广告组名称和每日预算。\n\n相关操作参考图：\nhttps://file.marsmind.cc/boot-admin/mercado/20260715/2077282498799788033.jpg\nhttps://file.marsmind.cc/boot-admin/mercado/20260715/2077282543955664897.jpg\nhttps://file.marsmind.cc/boot-admin/mercado/20260715/2077282684624232450.jpg","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-16 12:06:41","用户":"David Xu","群":"","用户问询":"广告怎么开","AI响应":"你好！很高兴为你解答。\n\n开启广告只需简单三步：\n1. 进入广告管理后台，点击“创建广告活动”。\n2. 设置广告活动名称、每日最高预算和目标出价。\n3. 选择要推广的具体商品，完成创建。\n\n建议优先选择销量好、评价高的商品进行投放。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-16 12:05:43","用户":"David Xu","群":"","用户问询":"广告怎么开","AI响应":"只需要简单的三步：\n1. 进入广告管理后台，点击“创建广告活动”。\n2. 设置广告活动名称，设置每日最高预算和目标出价。\n3. 选择要推广的具体商品，完成创建。\n\n从竞价的原理和影响因素，到展示位置和流量来源，再到激活条件、创建方法，这篇文章一次讲清！","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"}]},{"一级大类":"账号入驻与安全","二级子类":"账号异常","Past 7 Days":143,"Previous 2026-07-06 to 2026-07-12":137,"Change":6,"WoW":0.043795620437956206,"Past 7 Share":0.02075772971403687,"高频问题":"账号风控/限制/申诉","__details":[{"时间":"2026-07-15 13:04:06","用户":"纳洛童","群":"","用户问询":"Hola equipo de Mercado Libre, solicito revisión del monto de reembolso para el pedido 2000016757393154. El cliente compró 3 unidades a 9.94 USD cada una (total 29.82 USD), pero el sistema muestra un reembolso de 1,037.76 USD. Es un error evidente. He cumplido con el envío a tiempo, pero el paquete no fue entregado por causas ajenas. Por favor, corrijan el monto antes de proceder. Gracias.在这里还需要询问美客多客服，让她告诉我是什么原因包裹被退货，如果是物流商的原因，这个订单损失请物流商承担，根据这些内容，重新整理成一键可复制的申诉","AI响应":"你好！很高兴为你解答。已为你整合诉求，请直接复制以下内容开Case申诉：\n\nHola equipo de Mercado Libre, solicito revisión urgente del pedido 2000016757393154. El cliente compró 3 unidades (9.94 USD c/u, total 29.82 USD), pero el sistema muestra un reembolso erróneo de 1,037.76 USD. \n\nAdemás, solicito me informen la razón exacta por la cual el paquete no fue entregado. Si el fallo es responsabilidad de la logística, exijo que el transportista asuma la pérdida de este pedido. Por favor, corrijan el monto y den seguimiento a la responsabilidad logística. Gracias.\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-15 12:59:51","用户":"纳洛童","群":"","用户问询":"写一个申诉给美客多平台，2000016757393154客户的订单金额是9.94USD一个，购买了3个，我按照平台要求，按时按量发货，这个包裹不知道什么原因没有派送成功，为何我现在退款需要退这么多钱？","AI响应":"你好！很高兴为你解答。\n\n根据你提供的信息，退款金额显示异常（应为29.82美金左右，实际显示1037.76美金），请先不要点击确认，按以下内容向平台申诉：\n\n**申诉内容建议：**\nHola equipo de Mercado Libre, solicito revisión del monto de reembolso para el pedido 2000016757393154. El cliente compró 3 unidades a 9.94 USD cada una (total 29.82 USD), pero el sistema muestra un reembolso de 1,037.76 USD. Es un error evidente. He cumplido con el envío a tiempo, pero el paquete no fue entregado por causas ajenas. Por favor, corrijan el monto antes de proceder. Gracias.\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-14 12:09:27","用户":"浮生        朱鹏辉","群":"","用户问询":"你好，我在美客多的半托管上面有一款产品。我这个产品的重量的话是200g的重量。然后，别人有一款链接，和我的产品一模一样，但是她做的是100g的重量，我的成本是要比他高一倍的，那但是在平台上面的话，把我和他拉在一起竞争，这种情况下我怎么去申诉呢？因为本身的重量是不一样的，那么它肯定是占优势的","AI响应":"不好意思，该问题我没有答案，请点击以下链接咨询人工客服：\nhttps://work.weixin.qq.com/kfid/kfc7c47108dec2b0070?enc_scene=ENCGH59j4kB9XCrk4dX6Jt2BZeAhKD7ZBUNQhrF2CcGYyCW&scene_param=customer_id=7881299520915144","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-13 09:56:08","用户":"Dan.","群":"","用户问询":"1. 航空运输限制：相机类产品含有锂电池，如果该型号的电池参数未在平台备案，或被物流商识别为高风险违禁品，包裹会在分拣或清关环节被强制取消。 2. 监管机构警报：此类电子产品可能涉及当地市场的安全标准或合规性审查，如果该类目近期受到监管机构的风险提示，平台会统一拦截。 3. 系统检测异常：如果同一款产品在短时间内出现多笔取消，可能是系统判定该包裹存在安全隐患（如包装不符、申报信息有误等）。 可是之前有售卖出去过 为什么最近会被取消呢","AI响应":"即便之前能够正常售卖，最近出现大面积取消通常是因为平台政策或监管环境发生了动态变化，具体原因可能如下：\n\n1. 监管政策更新：哥伦比亚等站点的海关或监管机构会定期更新合规要求。如果近期针对带电产品、高价值电子产品或特定品牌的清关政策收紧，即使是老链接也会受到新政策的追溯影响，导致包裹在分拣环节被拦截。\n\n2. 电池备案失效或过期：平台会定期复核带电产品的安全报告（如UN38.3或MSDS）。如果您的产品电池信息未及时更新，或者平台提高了该类目的准入门槛，系统会自动判定为高风险违禁品并取消订单。\n\n3. 物流承运商策略调整：物流商可能会根据近期的运输安全状况，临时调整对含锂电池产品的承运政策。如果承运商判定该批次或该类产品存在运输隐患，包裹会在入库或分拣时被强制退回。\n\n4. 命中清退规则：如果该商品近期历史销量波动异常，或者命中平台最新的清退规则，也可能导致订单被系统自动取消。\n\n由于图片显示“不会影响你的声誉”，这进一步证实了是平台或物流端的系统性拦截，而非您的操作问题。建议您在工作时间内通过后台开case，明确询问是否为“电池合规性”或“类目监管”导致的取消，以便针对性解决。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-17 16:59:12","用户":"k","群":"","用户问询":"这个行为不属于违规吧 经理，如果我一个衣服，5XL重510g,其他的都是500之内，然后我发了一件5XL，运费重量被改为了510g,但是我手动可以改回450g,运费又被调回来了 因为我其他尺码居多，如果都是按照510g这个档位收，低于500g的也不会给我退回，我手动改回来，超了500g的平台也会自己补收回去，不影响什么吧","AI响应":"手动修改重量以规避计抛规则属于违规行为。平台会定期核核实包裹的实际重量和体积，若发现数据不符，系统会自动补收运费差额。频繁手动修改可能导致店铺信誉受损或面临处罚，建议按实际规格如实填写。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-19 19:59:28","用户":"D~","群":"","用户问询":"我如果转了官方仓模式的话，给了我备货的额度，这个备货单有时间限制吗，运到当地的官方仓","AI响应":"你好！很高兴为你解答。\n\n备货单（Shipment）本身是有时间限制和状态管理的：\n\n1. 预约时间：当你创建好备货计划并由货代在系统预约送仓时间后，必须在预约的时间段内准时送达。如果严重超时或未按预约时间送达，可能会导致货物被拒收，甚至影响你未来的库容额度。\n\n2. 计划有效期：如果你创建了备货计划但迟迟没有后续动作（比如没有预约送仓），该计划在系统中不会永久有效。虽然平台没有明确规定一个绝对的“过期天数”，但长期不操作的计划可能会被系统自动取消或失效。\n\n3. 库容占用：一旦你创建了备货计划，这些数量就会占用你的库容额度。如果你不打算发货了，建议及时取消计划，以便释放额度给其他商品。\n\n建议你和货代沟通好船期或航班时间，在货物快到达当地时再进行精准的送仓预约。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-16 10:46:01","用户":"鸿胜集团～柯锋","群":"","用户问询":"账户状态 生效限制项 当前部分功能已被禁用。请解决此问题以恢复正常运营。 这个怎么处理","AI响应":"你好！很高兴为你解答。这种情况通常是因为你的账户触发了合规性审核或存在待处理的验证任务。\n\n请你按照以下步骤进行排查和处理：\n\n1. 登录卖家后台，点击页面顶部的警告提示或进入账户设置查看具体的禁用原因。\n2. 检查是否收到了平台发送的关于KYC审核、RFC税号验证或身份信息更新的邮件。\n3. 如果是KYC审核问题，请按照要求上传营业执照、法人身份证、股东证明书并完成人脸识别。\n4. 如果涉及墨西哥站点且未验证RFC，请检查是否需要签署RFC知情授权书或提交CSF文件。\n\n提交资料后，请耐心等待系统审核。提交邮箱后即为您开通KYC审核绿色通道，通常3-5个工作日给反馈，请留意卖家后台审核状态的变化。但是加速审核只有一次机会，请谨慎提交！","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-19 17:47:05","用户":"G","群":"","用户问询":"我上架的链接被AI误判成侵权产品，然后店铺被禁止销售了，我能找客服申诉吗","AI响应":"可以申诉。请通过后台右上角“？”→“Need Help”联系邮件或24H在线客服，用英语提交正规采购发票、品牌授权书、带Logo的实物图及营业执照。若确认是AI误判，通过官方渠道提交合规证明即可申请激活。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-17 13:16:41","用户":"Felicity 103%","群":"","用户问询":"你好，我想问下，包裹因为买家未取件导致无法投递，系统自动退款了的订单可以申诉吗","AI响应":"你好！很高兴为你解答。如果包裹因买家未取件导致退款，通常无法申诉。建议你通过卖家后台的帮助中心开 Case，向客服核实该订单的具体退货路径及包裹状态，确认是否会退回海外仓或进行其他处理。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-14 15:45:04","用户":"戚","群":"","用户问询":"就不能升级所有类目不限制变体吗？我已经碰到了很多类目都只能是单变体的情况了","AI响应":"确实并非所有类目都支持颜色变体。如果该类目的属性库中没有定义“Color”属性，商家无法在同一链接下创建颜色选项。\n\n您可以尝试在后台编辑Listing，查看“Product Characteristics（产品特征）”部分是否有“Add or change variations（添加或更改变体）”的选项。如果没有，说明该类目目前不支持变体。如果类目不支持变体，建议为每个颜色单独创建Listing。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-14 10:27:34","用户":"君","群":"","用户问询":"目前买家已经发起了投诉并且平台已经退款，但是没有对我们进行赔付 我应该怎么申诉","AI响应":"你好！很高兴为你解答。\n\n如果平台已经退款给买家但未对你进行赔付，你可以按照以下步骤进行申诉：\n\n1. 准备证据：收集该订单的物流详情截图（显示运输过程）、买家在聊天记录中承认包裹受损的对话截图，以及你发货时的包装照片（如有）。\n2. 找到对应纠纷：在卖家后台进入“Claims”（纠纷）页面，找到该笔订单。\n3. 发起申诉：点击“Help with this claim”或类似的申诉按钮，明确说明包裹是在物流运输过程中受损（湿损），属于物流承运方的责任，而非卖家产品质量问题。\n4. 强调买家未提供证据：如果买家在纠纷中没有上传受损照片，你也要在申诉中强调这一点，说明平台在证据不足的情况下直接退款是不合理的。\n\n如果后台纠纷界面无法直接申诉，建议你通过“Help”联系官方客服开Case，提供订单号并说明情况，要求物流赔付。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-17 11:00:48","用户":"j、","群":"","用户问询":"对于由于买家未取件导致无法投递的包裹，系统自动退款了可以申诉吗","AI响应":"不好意思，该问题我没有答案，请点击以下链接咨询人工客服：\nhttps://work.weixin.qq.com/kfid/kfc7c47108dec2b0070?enc_scene=ENCGH59j4kB9XCrk4dX6Jt2BZeAhKD7ZBUNQhrF2CcGYyCW&scene_param=customer_id=7881302300216592","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-16 10:54:04","用户":"G","群":"","用户问询":"墨西哥永封了，关联巴西站点也不能发布新的链接，能申诉吗","AI响应":"如果您的墨西哥站点被永久封禁导致巴西站点受限，通常说明账号已产生关联。您可以尝试通过卖家后台的申诉通道提交资料进行申诉，但永久封禁的申诉成功率较低。建议您优先核查导致封禁的具体违规原因，并准备好相关证明材料。若后台无法操作，建议联系您的客户经理确认是否有进一步处理的可能。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-15 15:59:51","用户":"努力努力再努力","群":"","用户问询":"我理解您因尚未收到关于店铺停封的邮件而感到担心。为了进一步处理您的情况，我需要将此问题上报，一旦有结果，回复将通过电子邮件发送给您。 为什么我没收到邮件","AI响应":"你好！没收到邮件可能是以下原因：\n\n1. 检查垃圾箱：邮件可能被拦截，请核实Gmail/Outlook等注册邮箱的垃圾邮件文件夹。\n2. 邮箱填写错误：请确认在后台或咨询时留下的接收邮箱准确无误。\n3. 延迟发送：系统上报后，人工核查需要3-5个工作日，请耐心等待。\n4. 屏蔽设置：检查邮箱是否设置了关键词过滤或黑名单。\n\n若确认无误且超过5个工作日未收到，建议再次联系客服核实。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-19 12:49:25","用户":"啊楼🍉","群":"","用户问询":"超出限制导致的取消订单，会影响信誉吗","AI响应":"你好！由卖家原因导致的订单取消会计入订单取消率，这会直接影响你的店铺信誉等级。建议在上传产品时严格核对尺寸限制，避免因超材无法发货。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-18 18:43:08","用户":"Michael-拾荒的小男孩","群":"","用户问询":"那你知道茶罐的包装尺寸限制和重量的限制吗","AI响应":"你好！很高兴为你解答。\n\n自发货和半托管模式下，各站点包裹限制一致：\n- 长度：≤ 60 cm\n- 宽度：≤ 40 cm \n- 高度：≤ 35 cm\n- 三边之和：≤ 135 cm\n- 重量：≤ 15 kg\n\n网页参考资料：\nhttps://global-selling.mercadolibre.com/help/dimensiones-paquetes-cainiao_37370","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-17 17:52:25","用户":"纯属巧合","群":"","用户问询":"卖儿童玩具有什么限制吗， 需要什么认证和证书吗","AI响应":"你好！很高兴为你解答。\n\n关于在美客多销售儿童玩具，相关的限制和要求如下：\n\n1. 类目开放限制：\n目前美客多跨境站点的玩具类目暂不开放入驻。如果你是现有卖家想要新增玩具类目，需确认你的账号权限或咨询客户经理。\n\n2. 认证与合规要求：\n- 墨西哥站点：普通玩具一般无需特殊的准入认证。但如果玩具涉及电子功能（如电动遥控车、带电玩具），则需要关注墨西哥的 NOM 认证（电气安全认证）。\n- 巴西站点：建议产品的包装和说明书使用葡萄牙语，以符合当地监管要求。\n\n3. 禁售与安全限制：\n- 严禁销售易燃易爆的玩具。\n- 含有强磁铁或纯电池的玩具在物流运输中会受到严格限制。\n- 必须遵守当地法律法规，确保产品不含有害物质且符合儿童安全标准。\n\n4. 选品建议（以儿童电动玩具车为例）：\n如果你计划经营此类产品，建议售价在 $50~150 之间；材质选择 PP 材质；颜色以粉色、红色、蓝色、黑色为主；功能上建议带有儿歌、蓝牙连接，并具备遥控控制功能。\n\n请务必在选品前通过卖家大学查阅最新的【禁售商品】清单，确保产品符合平台政策，避免因合规问题导致 Listing 被审核或账号受限。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-17 10:55:16","用户":"j、","群":"","用户问询":"那包裹因为联系不上买家的退款可以申诉吗","AI响应":"你好！很高兴为你解答。平台会根据买家退款申请的原因和卖家提交的证据进行审核处理。若因联系不上买家导致退款，建议你保留相关沟通凭证，通过后台订单详情页发起申诉。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-17 10:54:15","用户":"j、","群":"","用户问询":"哪种类型的订单被系统自动退款后可以申诉","AI响应":"你好！很高兴为你解答。若订单被系统自动退款，通常在卖家账户被冻结或特定异常情况下，你可以按照平台提供的流程进行申诉。具体申诉路径和要求建议参考后台通知或咨询客服。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-16 15:38:51","用户":"审计 验资 评估","群":"","用户问询":"Pulsera 2026 New Crystal Bracelet With Blood Orange And 这个标题有违规吗","AI响应":"该标题存在违规风险。美客多禁止在标题中使用“New”等描述商品状态的词汇。建议修改为：[产品名称] + [品牌] + [规格/材质]，例如：Pulsera de Cristal Naranja Agata。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-16 14:01:34","用户":"Echo","群":"","用户问询":"因为本土账号有销售额限制，怎么控制流水比较好","AI响应":"你的问题我暂时无法回答，后续我会丰富我的知识库，敬请见谅。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-14 12:09:15","用户":"Pluto.","群":"","用户问询":"尺寸重量数值是否可以 对应限制是多少","AI响应":"你好！从你提供的图片数值来看，你的设置是完全可以的，没有超出限制。\n\n你填写的数值为：\n尺寸：32cm x 11cm x 4cm（三边之和为 47cm）\n重量：100g\n\n对比自发货和半托管模式的官方限制要求：\n· 长度：≤ 60 cm（你的 32cm 符合）\n· 宽度：≤ 40 cm（你的 11cm 符合）\n· 高度：≤ 35 cm（你的 4cm 符合）\n· 三边之和：≤ 135 cm（你的 47cm 符合）\n· 重量：≤ 15 kg（你的 100g 符合）\n\n你的包裹尺寸和重量都在安全范围内。请确保这些数值是包裹打包完成后的最终外包装尺寸和实测重量，因为平台会根据这些数值预估运费，如果后续物流商实测偏差过大，可能会产生补扣费用。\n\n网页参考资料：\nhttps://global-selling.mercadolibre.com/knowledge-hub/15573","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-14 10:47:36","用户":"A🚗","群":"","用户问询":"扣费金额比实际重量金额超出许多。怎么核对申诉","AI响应":"关于自发货物流实际超重的运费扣费查询，您可以前往卖家后台“账单详情”，了解系统二次测重后的最终扣费。\n\n如果您发现扣费金额与实际重量不符，建议您先通过以下渠道核对详细的运费标准：\n墨西哥站点：菜鸟运费查询表（https://global-selling.mercadolibre.com/help/shipping-costs-envio-cainiao-mexico_41817）\n巴西站点：菜鸟运费查询（https://global-selling.mercadolibre.com/help/shipping-fee-cainiao-costos-brasil_41814）\n智利站点：菜鸟运费查询（https://global-selling.mercadolibre.com/help/shipping-fees-chile-cainiao_38716）\n哥伦比亚站点：菜鸟运费查询表（https://global-selling.mercadolibre.com/help/shipping-fees-colombia-cainiao_37289）\n阿根廷站点：菜鸟运费查询表（https://global-selling.mercadolibre.com/help/costos-envio-argentina-cainiao_42837）\n\n核对后如确需申诉，请准备好包裹的实际称重照片、尺寸测量照片以及订单号，通过卖家后台的帮助中心联系客服进行反馈。\n\n网页参考资料\nhttps://global-selling.mercadolibre.com/listings/cost-calculator","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-19 18:21:11","用户":"👊💯文","群":"","用户问询":"怎样找官方客服申诉？","AI响应":"您好！如果需要联系平台客服申诉，请通过后台右上角的“？”→“Need Help”→选择邮件客服或24H在线客服进行沟通。请使用英语交流并提供详细截图。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-16 21:18:52","用户":"Vinson","群":"","用户问询":"目录链接的定价受到限制？","AI响应":"列表价格有最低和最高限制，这可能会根据您所操作的国家和物流而变化。在目录列表中，您可以自由编辑销售条件，包括价格。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-16 17:18:33","用户":"zurich","群":"","用户问询":"美转仓有购买限制吗","AI响应":"你好！很高兴为你解答。\n\n美转仓模式下，卖家可以在后台对单个SKU设置购买限制。\n\n操作步骤如下：\n1. 登录卖家后台，进入Listing管理页面。\n2. 找到对应的商品，点击修改（Edit）。\n3. 在产品信息设置中，找到“Maximum purchase quantity”或类似的限购数量选项。\n4. 输入你允许买家单笔订单购买的最大件数并保存。\n\n此外，美转仓模式本身也受到物流规格的限制，单件包裹需满足：\n- 长度：≤ 60 cm\n- 宽度：≤ 40 cm \n- 高度：≤ 35 cm\n- 三边之和：≤ 135 cm\n- 重量：≤ 15 kg\n\n如果买家购买数量过多导致包裹超过上述规格，可能会影响正常发货。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-16 11:09:08","用户":"zurich","群":"","用户问询":"品牌旗舰店限制类目吗","AI响应":"你好！很高兴为你解答。\n\n平台对品牌旗舰店的类目并没有统一的硬性禁止，但会受到平台整体禁售政策的限制。\n\n1. 禁售品类：无论是否为品牌旗舰店，所有卖家都严禁销售如武器、毒品、易燃易爆品、医疗器械（部分）、动植物及其制品等法律法规禁止的商品。\n2. 敏感类目：部分类目如食品、化妆品、保健品等，可能需要额外的当地卫生准入许可或特殊资质证明才能在品牌旗舰店中展示和销售。\n3. 品牌一致性：品牌旗舰店销售的商品必须与您注册或授权的商标类目保持一致。\n\n只要您的品牌产品不属于平台禁售范围，且具备相应的行业资质，通常都可以申请开设对应类目的品牌旗舰店。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-13 11:36:43","用户":"爱喝咖啡的懒人","群":"","用户问询":"我很抱歉产品尺寸没达到您的预期。如果您愿意留下它，我可以为您申请 20% 的补偿款，您看可以吗？ 说这句违规吗？","AI响应":"你好！很高兴为你解答。\n\n**说这句话完全不违规。**\n\n这属于正常的售后协商，是平台允许的沟通范畴。你是在针对买家的不满提供解决方案，并没有强制或诱导买家进行违规操作。\n\n**但为了确保万无一失，请注意以下细节：**\n\n1. **不要提到“关闭投诉”**：虽然部分退款完成后系统会自动结案，但在聊天时，你只需要询问买家是否接受这个补偿方案，不要说“请你关闭投诉”之类的话，避免触发系统的敏感词监控。\n\n2. **通过系统操作**：一旦买家回复“同意”或“OK”，你必须点击纠纷页面里的退款选项，选择“部分退款”并输入金额。千万不要私下转账。\n\n3. **话术微调（更地道）**：如果你是发给墨西哥或巴西买家，建议使用当地语言（西班牙语或葡萄牙语），这样沟通效率更高。\n\n**总结：**\n这句话是安全的，你可以放心发送。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-15 17:25:30","用户":"Bran","群":"","用户问询":"变体有限制吗","AI响应":"变体数量通常没有严格限制，但需注意：\n1. 仅限不改变价格的属性（如颜色、尺码）。\n2. 并非所有类目都支持变体，需在后台产品特征处核实。\n3. 同一商品的不同变体必须保持标题一致。\n4. 需为每个变体分配独立的SKU、通用代码、库存和图片。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-15 15:53:09","用户":"游济远","群":"","用户问询":"有流水限制吗？","AI响应":"目前普通跨境店（自发货、海外仓、美国转运仓）入驻无需流水。FTI、半托管及全托管模式仍需提供近12个月单平台单店铺30万美金以上的流水。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-17 10:20:09","用户":"随心","群":"","用户问询":"听网上说，你这个美客多很容易会封店铺，是什么意思 还有很容易会涉及到侵权什么之类的","AI响应":"美客多对仿品和侵权采取零容忍政策，一旦发现会直接下架产品甚至关闭店铺。涉及售假或仿牌通常会直接永久封号。普通侵权虽有整改机会，但屡犯会导致限流或封禁。卖家需确保商品和品牌授权合规，不存在所谓的安全次数。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-19 12:51:56","用户":"Li","群":"","用户问询":"你好！别人直接完全抄我的，连我做的视频里有带我店的名字也抄，我能投述吗？","AI响应":"可以投诉。如果对方未经授权使用你的原创视频或图片，属于侵权行为。\n\n你可以通过美客多 **Brand Protection Program (BPP)** 品牌保护计划进行投诉。即使没有品牌备案，针对盗用原创图片或视频的情况，也可以尝试通过举报违规行为来维护权益。请保留好你的原始拍摄素材作为证据。\n\n参考图片：\nhttps://file.marsmind.cc/boot-admin/mercado/20260715/2077297883590746113.jpg","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-18 12:16:24","用户":"纳洛童","群":"","用户问询":"筋膜枪在墨西哥巴西智利哥伦比亚阿根廷乌拉圭一般售价是多少？ 这是我的产品","AI响应":"你好！很高兴为你解答。你这款 XF-168 迷你球形按摩器属于便携式个护电器，在美客多各站点的建议售价区间（美金参考价 15-25 USD）如下：\n\n1. **墨西哥**：约 300 - 500 MXN\n2. **巴西**：约 85 - 150 BRL\n3. **智利**：约 15,000 - 25,000 CLP\n4. **哥伦比亚**：约 65,000 - 110,000 COP\n5. **阿根廷**：约 15,000 - 25,000 ARS\n6. **乌拉圭**：约 600 - 1,000 UYU\n\n**特别提醒：**\n- **墨西哥限制**：在墨西哥，用于医疗、康复、理疗用途的按摩器属于限制类别，建议在 Listing 描述中强调其“放松、美容、运动后缓解”属性，避免触碰医疗监管。\n- **定价建议**：由于该产品体积小、重量轻，非常适合自发货。建议使用官方利润计算器，根据你的拿货成本精准定价。\n\n网页参考资料：\n利润计算器：https://global-selling.mercadolibre.com/listings/cost-calculator","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-15 10:03:34","用户":"Michael-拾荒的小男孩","群":"","用户问询":"上传视频后，出现这个提示是什么意思，但我要商品列表里查看过视频是正常上传了的呀","AI响应":"你好！很高兴为你解答。\n\n从你提供的图片来看，视频状态显示为“已暂停”，下方的提示语是“商品刊登已暂停或缺货”。\n\n这意味着虽然你的视频已经成功上传到了系统中，但由于该视频关联的商品 Listing 目前处于“暂停（Paused）”状态或者“库存为零（Out of stock）”状态，系统会自动停止在短视频专区（Clips）展示该视频。\n\n你可以检查一下该商品的库存数量是否充足，或者是否在后台手动暂停了该 Listing。一旦商品恢复正常在售状态，视频的展示也会随之恢复。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-13 10:50:25","用户":"吴佟","群":"","用户问询":"另外再问一下，如果我使用一个全新的店铺，不用做IP隔离吧？会不会被关联导致封店","AI响应":"您好！关于跨境店的IP隔离问题，我们平台对跨境店的IP没有特殊要求，不需要做IP隔离。同一个IP地址可以登录多个店铺，平台在这方面查得不是很严格。\n\n不过需要注意的是，一个公司营业执照只能对应一个美客多账号。美客多平台对账号关联有严格的风险管控，主要情况如下：\n\n1. 同一法人不同执照：平台严格依据法定代表人信息进行主体关联检测，不同营业执照但法定代表人相同即被视为关联账户，可能会触发风险管控。\n\n2. 资料唯一性：一个公司营业执照只能对应一个美客多账号。如果有多个店铺，需要确保每个账号对应不同的公司主体。\n\n3. 集团关系：美客多平台不承认平行公司关系，需满足法人一致或控股关系才能使用不同执照。\n\n4. 下店封禁风险：通常由资料合规性（模糊或有PS痕迹）或异常操作（下店即修改敏感信息）触发。\n\n5. 关联封号后果：关联封号属于平台底层且严厉的风控判定，除非能提供运营商级别的误判证据证明网络、设备、资料完全独立，否则解封概率极低。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-13 10:41:50","用户":"吴佟","群":"","用户问询":"我的跨境店铺巴西站点因为取消率过高被封了，请问里面的钱还能提取出来吗？","AI响应":"亲爱的卖家，非常理解您的心情。\n\n关于您巴西站点因取消率过高被封后的资金提取问题，处理规则如下：\n\n店铺封禁后，资金通常会被冻结90天。这是为了确保所有在途订单已完成妥投，并且售后索赔期（如买家退货、纠纷处理等）已经结束。\n\n待90天冻结期满且售后风险排除后，剩余款项才会释放。届时建议您主动联系美客多官方客服申请最终结算。\n\n如果您的店铺目前只是处于暂停状态而非永久封禁，建议您通过后台开 Case 或联系账户经理，说明原因并提交整改方案进行申诉。若申诉成功恢复运营，资金将按正常周期结算。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-19 15:26:05","用户":"Elvis  Cheung","群":"","用户问询":"标题带上 for Honda Yamaha 是违规的吗","AI响应":"你好！不违规。在标题中使用“for”或“compatible with”连接品牌名，是平台允许的描述兼容配件的标准方式，可以有效避免侵权风险。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-18 09:53:55","用户":"爱喝咖啡的懒人","群":"","用户问询":"有违规或者破坏信誉不？是让客户自己找客服还是卖家找客服好","AI响应":"你好！很高兴为你解答。\n\n**1. 谁找客服更好：**\n建议**卖家（你）主动找客服**更好。因为买家已经问你“如何退货”，如果你只让他自己找，可能会导致买家因操作麻烦而直接申请平台介入，这会直接判定你败诉并扣除信誉分。你主动找客服报备并申请标签，能体现积极处理的态度。\n\n**2. 是否违规或影响信誉：**\n*   **不违规**：主动联系平台处理纠纷是官方鼓励的行为，不属于违规。\n*   **保护信誉**：在截止日期（7月23日）前，通过客服介入生成的“退货退款”流程，是合规的纠纷处理方式。相比于被平台强制判罚，这种主动处理对信誉的影响最小，且流程结束后信誉分通常会恢复。\n\n**总结建议：**\n你先回复买家（参考前一条葡语话术），告诉他你正在联系平台申请标签；然后立即点击 **Contact Mercado Libre** 联系客服处理。这样既稳住了买家，又在平台留下了合规处理的记录。\n\n网页参考资料：https://global-selling.mercadolibre.com/help/21258","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-15 00:50:55","用户":"Debbie","群":"","用户问询":"标记了aftermarket的意思就不会违规了吗？","AI响应":"标记 Aftermarket 可以在一定程度上说明产品是非原厂的售后件，但并不能完全豁免侵权风险。\n\n如果你的产品实物、包装或产品图片上带有原厂品牌 Logo，或者在标题中直接使用了品牌词而没有使用兼容性描述（如 Compatible with...），依然会被系统判定为侵权。\n\n建议你在品牌属性填写 Generic，并确保图片中没有任何品牌标识，仅在标题中使用兼容性表达，这样才能最大限度降低违规风险。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-13 16:05:34","用户":"苏全喜","群":"","用户问询":"墨西哥站通知违规，禁售三天。从哪里能查到是什么违规了，怎么处理","AI响应":"亲爱的卖家，非常理解您对店铺违规的担忧。\n\n要查询具体的违规原因及处理方法，请参考以下步骤：\n\n1. **查看电子邮件通知**：\n我们将通过电子邮件通知您，您将收到一封详细说明检测到的违规情况的邮件，以及根据情况您必须做些什么才能重新激活您的列表。\n\n2. **检查卖家后台列表**：\n在商品列表（Listing）中，您会发现多个相关消息：\n- 在列表顶部的卡片中，您可以利用这些卡片过滤有违规的列表。\n- 在列表中，您可以了解商品状态。如果显示为 **“非活跃 - 需要审核” (Inactive - Needs review)**，说明列表被暂停，您可以通过修正违规行为来重新激活。\n- 您可以在对应商品右侧的三个点菜单下选择 **“我需要帮助” (I need help)** 选项，查看更详细的指引。\n\n3. **排查常见违规原因**：\n- **合规性问题**：检查标题、描述或图片中是否包含违规词汇、侵权品牌名、联系方式或外部链接。\n- **图片质量**：确保首图为 1200x1200px 的纯白底图，且无水印、无文字。\n- **类目错误**：确认商品是否被错放到了禁售类目中。\n- **禁售品**：核实产品是否属于液体、粉末或特定带电产品等严查类目。\n\n**处理建议**：\n请务必按照系统提示进行修改。如果是因为严重违规（如售卖侵权仿牌、禁售品），列表可能会被永久取消。由于您被禁售三天，请在处罚期内完成所有违规项的整改，避免处罚加重导致账户被永久关闭。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-13 15:28:38","用户":"悠","群":"","用户问询":"但是我的链接在正常出单，也没有客诉，为什么会降到30分","AI响应":"根据图片提示，由于该链接信息不足，系统是根据您在“同类别产品”中的销售表现来计算的。虽然没有延迟或取消，但系统显示您收到了关于产品问题的投诉。这会导致分数降至30分并限制曝光。建议检查后台纠纷详情，并优化产品质量检查。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-19 17:07:58","用户":"纳洛童","群":"","用户问询":"这几款哪个 cos 最受欢迎，分别是什么尺码？","AI响应":"你好！很高兴为你解答。\n\n关于你图片中的这几款 COS 服装：\n\n1. **受欢迎程度**：在 COS 领域，通常大热的电影、电视剧人物形象和当下流行 IP（如图片中展示的这类二次元/游戏风格角色）最受消费者欢迎。\n\n2. **尺码信息**：图片中并未显示具体的尺码数值。建议你在发布产品时，务必上传详细的**尺码表（Tabela de tamanhos）**，包括胸围、腰围、臀围等关键数据，这能有效减少买家疑问和退货。\n\n**特别提醒**：\n*   **图片规范**：第一张封面图建议使用纯色背景（如浅灰色或米色），且产品应完整居中展示。\n*   **模特展示**：你可以结合展示模特穿着的效果图，帮助买家了解真实尺寸和合身度。\n*   **版权风险**：如果这些角色属于知名游戏或动漫 IP，请确保拥有相关授权，以防 Listing 被暂停。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-18 11:49:40","用户":"爱喝咖啡的懒人","群":"","用户问询":"我能否说下次可以先联系我，别先投诉","AI响应":"你好！很高兴为你解答。\n\n**不建议**直接对买家说“下次别先投诉”。在美客多平台，这类言论极易被系统判定为“施压买家”或“规避平台监管”，属于违规行为，可能导致店铺被封禁。\n\n你可以通过提供优质服务来引导买家，例如在回复中加入以下内容（西班牙语）：\n\n\"Para qualquer dúvida futura ou suporte técnico, você pode nos enviar uma mensagem diretamente por aqui primeiro. Estamos sempre à disposição para ajudar rapidamente.\"\n（意为：如有任何疑问或技术支持，您可以先直接在这里发消息给我们，我们会随时为您提供快速帮助。）\n\n这样表达既合规，又能达到引导买家先沟通的目的。\n\n**当前操作提醒：**\n图片显示买家已回复“Perfecto pruebo...”（好的我试试），说明他正在尝试你的解决方案。请务必在 **7月23日** 截止前关注他的反馈。如果问题解决，请引导他确认；如果他仍坚持退货，请按之前建议联系客服申请标签。\n\n网页参考资料：https://global-selling.mercadolibre.com/help/21258","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-17 21:22:07","用户":"👾","群":"","用户问询":"被扫描出违反政策被暂停的链接需要如何处理","AI响应":"你好！很高兴为你解答。\n\n如果你的商品列表因违反政策被暂停，请按照以下步骤处理：\n\n1. 确认违规原因：登录卖家后台，在列表管理中检查该Listing的状态。系统会说明该列表为何受到审核以及具体的违规原因。\n2. 修正违规行为：\n- 如果状态为“非活跃 - 需要审核”，你可以通过修正违规内容（如修改标题、完善属性、删除违规词汇或侵权信息）来重新激活它。\n- 检查Listing的必填属性是否完整，例如品牌、型号等，确保不包含特殊符号或营销词汇。\n3. 避免再次违规：如果该产品属于禁止销售的范畴，请避免再次销售该产品。如果涉及产品召回，请直接联系制造商。\n4. 申诉处理：如果你认为系统判定有误，可以准备相关证明材料（如品牌授权书、合规证明等）联系平台客服进行申诉。\n\n请注意，如果违规严重，列表可能会变为“非活跃”状态且无法重新激活，甚至导致账户被部分或永久暂停。建议及时修正，保持专业销售。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-17 14:24:21","用户":"XIAOMEI","群":"","用户问询":"就是要提交双方的给平台对比才可以解封我这边了","AI响应":"是的。您需要提交双方的证明材料进行对比，以证明两个账号的运营环境、网络、设备及货源完全独立。只有通过对比证明不存在交叉使用，才有可能申诉成功。但由于法人相同，解封难度依然非常大。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-17 14:22:14","用户":"七","群":"","用户问询":"墨西哥和阿根廷为什么发布不成功？","AI响应":"根据图片提示，墨西哥和阿根廷发布不成功通常是因为产品不符合当地站点的准入规则。例如，墨西哥限制翻新产品、手机等特定品类通过跨境模式销售；阿根廷则对动物食品或消费产品有严格限制。建议您核对产品是否属于该站点的禁售或限制类别。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-16 22:38:39","用户":"joker","群":"","用户问询":"为什么上的链接SKU有的符合有的不符合","AI响应":"从图片看，虽然是同一条链接，但不同变体（SKU）的审核结果不同，原因如下：\n\n1. **品牌侵权风险**：中间的变体被系统识别为“非通用品牌”，说明该特定颜色的图片或描述中可能包含了品牌Logo或敏感词。\n2. **违反平台政策**：下方的变体显示“不符合我们的政策”，可能是因为图片质量不达标、类目错放或包含禁售信息。\n3. **审核机制差异**：系统会对每个变体进行独立扫描，建议点击“审核”或“查看政策”获取具体违规点并针对性修改。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-15 07:55:10","用户":"亮晶晶","群":"","用户问询":"美客多账户存在停用风险，就一定会被封号吗","AI响应":"亲爱的卖家，账户存在停用风险并不代表一定会被封号。这通常是平台发出的预警信号，提醒您的店铺某些指标（如投诉率、取消率或发货延迟率）已接近临界值。\n\n只要您在预警期内积极采取措施，例如尽快处理纠纷、优化物流时效、确保产品合规，并将相关指标修复至正常水平，风险是可以解除的。但如果指标持续恶化或未做改进，则极大概率会导致封号。\n\n目前人工咨询量巨大，请耐心等待。建议您优先核查后台的“Account Health”板块，针对性地解决问题。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-14 13:31:31","用户":"Felicity 103%","群":"","用户问询":"是因为关联被封店了吗 上架产品一直上不去","AI响应":"你好！很高兴为你解答。目前无法直接判断是否因关联封店导致上架失败。\n\n建议你先登录卖家后台查看是否有封号或违规提醒。若账号状态正常但无法上架，请核查Listing必填属性、标题规范及系统同步情况。\n\n若怀疑存在关联风险，请核查是否使用了相同法人、纯净IP或设备。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-13 15:33:45","用户":"窦红建","群":"","用户问询":"这个宠物安抚项圈，需要认证才可以上架吗？","AI响应":"你好！根据你提供的图片，这款宠物安抚项圈（Calming Collars）含有化学成分或费洛蒙（Pheromone）以达到安抚效果。\n\n在美客多平台上，这类涉及宠物健康、含有化学成分或药物成分的产品属于敏感类目。通常情况下，这类产品在墨西哥等站点上架时，可能需要提供相关的卫生许可或成分证明。此外，如果该产品被判定为农药、杀虫剂或医疗器械范畴，则需要更严格的本地认证。\n\n建议你在上架前，先在后台尝试创建Listing，系统会根据类目提示是否需要上传特定认证文件。同时，请确保产品描述中不含有违规的医疗效果承诺。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"}]},{"一级大类":"物流仓储","二级子类":"物流咨询","Past 7 Days":134,"Previous 2026-07-06 to 2026-07-12":175,"Change":-41,"WoW":-0.2342857142857143,"Past 7 Share":0.01945129917259399,"高频问题":"海外仓/FULL/入仓","__details":[{"时间":"2026-07-17 12:50:52","用户":"大关关","群":"","用户问询":"原有服装全托管店铺将关停服装业务，现申请开通五金建材半托管Full Push模式，货品对接东莞沙田仓。主营滑轨、金刚网、门窗紧固件等家装五金，五金供应链独立，与服装业务完全隔离，望协助完成业务开通。","AI响应":"你好！很高兴为你解答。\n\n针对你申请开通五金建材半托管模式的需求，请先确认你的主体资质是否符合要求：\n1. 主体资质：拥有中国大陆/香港公司营业执照。\n2. 业绩要求：半托管模式要求单店年均流水 ＞30万美金。\n\n如果符合上述条件，你可以通过以下链接提交入驻申请：http://kks.ink/ss/vKx9ph/d12030\n\n关于半托管模式的货品对接及运营要点如下：\n1. 货交接流程：半托管模式需要你将货物发送至国内东莞集货仓。\n   地址：广东省东莞市沙田镇进港南路第一产业园205号库台\n   联系人：叶宗虎 18025233509\n   接收时间：周一至周日，9:00am-18:00pm\n2. 运营权：在半托管模式下，你拥有自主定价权，并负责店铺的日常运营（如上架、优化链接等）。\n3. 物流与流量：你负责国内段物流，美客多官方负责国际物流、清关及海外末端派送。商品上架即自带“Full”标，享有顶级流量扶持。\n4. 费用与回款：目前半托管享受最高50%的佣金减免（收取8%佣金），免收仓储费。订单妥投后7个工作日即可回款。\n\n提交申请后，你可以通过以下链接查询入驻进度：https://mercadolibre.cn/seller/info?id=478&type=consignment\n（请使用填写问卷的公司名称、手机号或邮箱进行查询）\n\n网页参考资料：\n美客多半托管模式全解析：https://mercadolibre.cn/news/info?id=215&type=live","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 15:44:22","用户":"**2","群":"","用户问询":"跨境店海外仓模式（Full模式 申请条件是什么","AI响应":"申请条件包括：\n1. 中国内地或香港公司营业执照（须是有限公司，不接受个体户）。\n2. 法人身份证，需配合人脸识别。\n3. 收款账户（美元银行账户/第三方收款账户）。\n4. 谷歌、Outlook或阿里云等海外/企业邮箱。\n5. 品牌店需提供R标或TM标。\n6. 一套资料仅限注册一个店铺。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 10:33:25","用户":"Felicity 103%","群":"","用户问询":"美客多墨西哥海外仓低于额299比索收取的固定服务费是怎么计算的？","AI响应":"你好！很高兴为你解答。\n\n在墨西哥站点，当商品单价低于599 MXN时，除了正常的销售佣金外，平台会按件加收20 MXN的固定处理费。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-19 19:27:21","用户":"D~","群":"","用户问询":"我是怎么备货到海外仓呢？我想备多少就备多少到海外仓吧，","AI响应":"你好！很高兴为你解答。\n\n并不是想备多少就备多少，海外仓的备货是受系统限制的。\n\n具体操作流程和规则如下：\n\n1. 创建备货计划：你需要在卖家后台创建备货计划（Shipment），系统会根据你店铺的销量、信誉等级以及仓库的库容情况，给出你可以发货的数量上限。\n2. 库容限制：新卖家初始库容通常比较有限。随着你销量的提升和库存周转率的加快，系统会自动提升你的库容额度。\n3. 寻找物流商：你需要自己联系可发货到墨西哥等地的第三方物流商（货代），将货物从国内运输到当地。\n4. 预约送仓：货物到达当地后，由物流商在系统线上预约送仓时间。美客多系统会分配具体的仓库地址，物流商按预约时间送达即可。\n\n建议你在操作前，先在卖家后台查看当前的库容额度，并提前创建备货计划，避免盲目发货导致无法入库。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-18 15:39:09","用户":"十六","群":"","用户问询":"是需要在那个站点选择绑定？销售的国家是墨西哥FULL模式","AI响应":"你好！很高兴为你解答。请前往后台 Settings > Selling preferences > Collection method 操作绑定。请注意，该入口仅在 KYC 审核通过后才会展示。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 16:48:38","用户":"啊楼🍉","群":"","用户问询":"full 美国转运仓每件产品上都要贴二维码吗？怎么生成的","AI响应":"你好！是的，每件商品都必须张贴唯一的商品标签。在卖家后台创建发货计划时，进入“打印商品标签”步骤，系统会自动生成包含条码和产品信息的PDF文件，你直接下载并按需打印即可。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 15:47:21","用户":"丁鑫","群":"","用户问询":"目前墨西哥full低于299比索的单位附加费是怎么收取的？","AI响应":"墨西哥站点单价低于599 MXN时，每件加收20 MXN的固定处理费。此外，若价格在0-99 MXN，额外费用为25 MXN；99-149 MXN为30 MXN；150-250 MXN为37 MXN。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-13 16:37:28","用户":"Andy","群":"","用户问询":"请问没课多 做美国市场嘛？ 还是只做墨西哥 我们有美国海外仓的","AI响应":"你好！美客多主要深耕拉美市场。如果你有美国海外仓，非常适合入驻美客多美国转运仓模式。该模式位于美国德州，支持一仓发拉美，覆盖墨西哥、智利、巴西等站点，且无需办理拉美各国税号，能有效规避税务风险。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-19 22:02:12","用户":"爱老虎呦🐯","群":"","用户问询":"在初期入仓后，开广告如何充值，充值是什么币种。","AI响应":"美客多广告费用不需要额外充值，也没有信用卡充值选项。系统会直接从您出单后的店铺卖家账户余额中扣除。目前支持美金结算。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-18 15:50:52","用户":"🐟711bu7","群":"","用户问询":"我想问一下美客多智利入仓需要什么条件","AI响应":"你好！很高兴为你解答。智利Full仓储服务目前包含仓储服务费，但智利仓库的仓储费目前已获折扣，在另行通知前均不收取。关于入仓的具体准入门槛和操作流程，建议你登录卖家后台查看最新的智利站点发货指引。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 16:18:16","用户":"Vinson","群":"","用户问询":"3D打印笔能在跨境店上传Full吗","AI响应":"你好！很高兴为你解答。3D打印笔是可以上架的。建议你先通过自发货模式积累数据，待店铺信誉等级、销售表现等指标达标后，系统会自动在后台开放送仓入口。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-16 17:55:23","用户":"Elvis  Cheung","群":"","用户问询":"full模式下 还是采取净收益模式吗","AI响应":"你好！是的，净收益定价模式（Net Proceeds）仅适用于直接面向消费者的销售和完整的美国物流（即Full模式）。\n\n在该模式下，你只需设定想要获得的净收益（采购成本+利润），系统会自动加上佣金和运费生成前端售价。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-16 08:42:59","用户":"小潘","群":"","用户问询":"请问我怎么添加运营经理 而且入仓流程是怎么样的","AI响应":"自注册账号默认无经理，可通过提升业绩触发系统分配或填写官方申请表。若已分配，请查收邮件扫码进群。入仓流程为：在后台创建货件，打印并粘贴标签，联系物流送往指定仓库，等待仓库扫描上架。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-16 08:41:47","用户":"幸运🍀","群":"","用户问询":"平台协调退款成功，货物会寄到海外仓吗？","AI响应":"你好！很高兴为你解答。如果你有海外仓，可以退到你们海外仓。建议你在后台提前设置好退货地址。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 15:35:53","用户":"Will","群":"","用户问询":"你好，那个海外仓退回地址没有怎么办啊","AI响应":"你好！必须填写退货地址。若没有海外仓，Full仓退货在20天内未提取将被自动捐赠或销毁。目前这种情况无法退回给商家，建议尽快联系第三方海外仓合作以设置接收地址。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 10:07:01","用户":"李玲娅","群":"","用户问询":"Foster Commerce Center Building 3, suite 100 - USTX01仓库地址简写可以写成什么样子","AI响应":"美国转运仓地址简写可以参考以下格式：\n\nMercadolibre-USTX01\n1106 S Foster Rd, Suite 100\nSan Antonio, TX 78220\n\n特别提示：\n1. 邮编建议填写 78220，以避免 UPS 等承运商收取偏远费或地址修改费。\n2. 平台不提供收件人电话，建议填写卖家真实的联系电话，方便后续与承运商沟通。\n3. 请务必在工作日早9晚6之间送货，无需预约。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-13 23:59:26","用户":":-P","群":"","用户问询":"美客多海外仓收入的固定服务费是收入多少？","AI响应":"美客多针对低单价商品会收取低价操作费，也叫固定处理费。当商品单价低于平台设定的门槛时，除了正常的销售佣金外，平台会按件加收这笔固定费用，以覆盖订单的处理成本。\n\n具体站点的收费标准如下：\n墨西哥站点：单价低于599 MXN时，每件加收20 MXN。\n阿根廷站点：单价低于33,000 ARS时，每件加收1,800 ARS。\n智利站点：单价低于15,650 CLP时，每件加收1,650 CLP。\n哥伦比亚站点：单价低于121,000 COP时，每件加收6,700 COP。\n巴西站点：单价低于185 BRL时，每件加收7.5 BRL。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-13 17:20:41","用户":"Ryouhi","群":"","用户问询":"后台哪里可以选择是否激活海外仓账户","AI响应":"你好！很高兴为你解答。\n\n你可以在卖家后台的设置或账户管理界面找到“Activate Fulfillment”按钮。在卖家填写的材料审核完成后，系统会提供该选项，你根据实际需求点击打开该按钮即可申请激活。\n\n如需要详细的界面位置和操作指引，建议参考自助开通海外仓的视频教程：https://www.douyin.com/video/7478234269479914764","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-19 23:53:32","用户":"TL","群":"","用户问询":"full的门槛是什么","AI响应":"Full仓权限没有固定数值门槛，主要由系统评估。核心要求包括：店铺信誉等级必须处于绿色状态、具备良好的销售表现以及运营合规性。建议先通过自发货积累优质数据，达标后系统会自动开放入口。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-19 19:37:20","用户":"D~","群":"","用户问询":"海外仓需要额外收费么？","AI响应":"你好！很高兴为你解答。\n\n是的，海外仓（Full）模式会产生一些相关的服务费用，主要包括以下几项：\n\n1. 仓储费：根据你存放在仓库中商品的体积（立方分米）和存放时间来计算。通常会有一定的免费存放期，超过时间后会按天计费。\n2. 运费（尾程派送费）：当订单产生时，平台负责将货物送达买家手中所收取的配送费用。\n3. 弃置或撤仓费：如果你有滞销库存需要销毁或者退回，会产生相应的处理费用。\n\n需要特别注意的是，在海外仓定价模式下，你的收益是根据商品价格扣除平台销售佣金和运费后得出的，而仓储费通常不会直接从单笔订单的净收益中扣除，而是定期从你的账户余额中结算。\n\n网页参考资料：\n仓储费：https://global-selling.mercadolibre.com/help/15373\n运费：https://global-selling.mercadolibre.com/help/23223\n弃置或撤仓费：https://global-selling.mercadolibre.com/knowledge-hub/18226\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-19 00:22:21","用户":"Vinson","群":"","用户问询":"pla耗材跨境店full能上吗","AI响应":"你好！很高兴为你解答。PLA耗材是可以上架的。建议你先通过自发货模式积累数据，待店铺信誉等级、销售表现等指标达标后，系统会自动在后台开放送仓入口。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 09:48:51","用户":"Chris","群":"","用户问询":"海外仓没有经理扶持吗都","AI响应":"你好！很高兴为你解答。海外仓模式是有经理扶持的。通常在您激活海外仓模式并完成KYC审核后，海外仓经理会通过邮件、电话或微信主动联系您。如果您的KYC完成超过一周仍未对接到经理，可以找您对接的招商经理协助。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 09:40:03","用户":"Chris","群":"","用户问询":"您好，海外仓有对接的经理吗","AI响应":"你好！很高兴为你解答。海外仓经理会通过邮件、电话或微信等方式主动联系卖家。若你的KYC审核完成已超过一周仍未对接到经理，可以找对接的招商经理协助。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-16 15:47:09","用户":"CJW","群":"","用户问询":"海外仓可以帮我开吗","AI响应":"你好！很高兴为你解答。在材料审核完成后，你可以在后台自主激活。请在后台打开 Activate Fulfillment 按钮，如需详细操作指引，可参考教程：https://www.douyin.com/video/7478234269479914764","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 15:55:06","用户":"江遇","群":"","用户问询":"巴西海外仓模式店需要什么资料","AI响应":"你的问题我暂时无法回答，后续我会丰富我的知识库，敬请见谅。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 15:52:13","用户":"江遇","群":"","用户问询":"海外仓模式店需要什么资料","AI响应":"入驻海外仓模式需要准备：\n1. 中国内地或香港公司营业执照（须是有限公司）。\n2. 法人身份证，且法人需配合人脸识别。\n3. 第三方美金收款账户。\n4. 常用邮箱（建议Gmail/Outlook/Aliyun）及联系电话。\n5. 品牌店需提供R标或TM标。\n\n普通自发货/海外仓也可选择自注册（PC端登入）：https://global-selling.mercadolibre.com/landing/about","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 18:52:57","用户":"大大大明","群":"","用户问询":"这个是full的意思吗","AI响应":"你的问题我暂时无法回答，后续我会丰富我的知识库，敬请见谅。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 15:36:50","用户":"Will","群":"","用户问询":"第三方海外仓有推荐的吗","AI响应":"你好！很高兴为你解答。目前没有官方指定的第三方海外仓推荐，建议你根据服务商的仓库规模、管理规范程度以及是否拥有自营海外仓等维度进行综合评估和选择。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 10:44:49","用户":"Felicity 103%","群":"","用户问询":"带FULL标需要什么条件","AI响应":"你好！很高兴为你解答。\n\n获得FULL标需要将商品发送至美客多海外仓（Fulfillment）进行存储和发货。\n\n基本条件包括：\n1. 使用海外仓模式店铺。\n2. 商品符合海外仓入库尺寸和重量限制。\n3. 完成RFC税号合规。\n4. 在后台创建货件并成功送达仓库上架。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 10:31:30","用户":"有莲","群":"","用户问询":"跨境店铺FULL也是一样的吗","AI响应":"是的，跨境店铺做官方海外仓（FULL）模式也是一样的。务必先在国际收款入口绑定美元账户，刷新后台弹出本土收款入口后，再绑定墨西哥本土银行账户。做海外仓模式需要绑定RFC税号，若暂时没有，按此顺序绑定可暂时避免代扣代缴。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 10:06:13","用户":"Felicity 103%","群":"","用户问询":"巴西有海外仓模式吗？","AI响应":"你的问题我暂时无法回答，后续我会丰富我的知识库，敬请见谅。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-13 17:17:06","用户":"晨夕","群":"","用户问询":"full不需要缴纳税了吧？","AI响应":"你好！很高兴为你解答。\n\n这里有一个关键的业务逻辑需要区分：**阿根廷站点目前没有海外仓（Full）模式**。\n\n在美客多平台，只有墨西哥、巴西、智利、哥伦比亚这四个国家有本土海外仓（Full）模式。阿根廷目前仅支持**跨境直邮模式**（包括你正在做的FTI美国转运仓模式）。\n\n所以，你看到的那个卖124美金的卖家，他和你一样也是**跨境卖家**。\n\n**关于税费的区别：**\n1. **如果是墨西哥Full模式**：确实不需要买家在下单时额外缴纳进口关税，因为货物已经提前进口到了墨西哥仓库，税费由卖家在进口环节处理（涉及RFC税号）。\n2. **但在阿根廷站点**：无论你是FTI模式还是普通跨境模式，所有商品都是从境外发货。只要单价超过50美金，**阿根廷买家在下单时都必须缴纳进口关税**。\n\n**总结：**\n那个卖124美金的竞争对手，他的买家同样要付关税。按照我刚才的计算，他的买家最终支付总额会接近180美金，而你的买家只需要付约108美金。你在价格和成本控制上（得益于FTI的低佣金和低运费）具有绝对的竞争优势。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-13 17:16:20","用户":"Ryouhi","群":"","用户问询":"怎么激活海外仓功能","AI响应":"在卖家填写的材料审核完成后，可以在后台选择是否激活海外仓账户。卖家可以根据实际需求申请激活海外仓，打开“Activate Fulfillment”按钮即可。\n\n如需要详细操作指引，可参考自助开通海外仓的教程，在后台自主激活：https://www.douyin.com/video/7478234269479914764","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 09:38:44","用户":"Coconut","群":"","用户问询":"这个包裹显示已经被东莞仓库签收了 但是仓库那边查箱唛号查不到 这种情况应该怎么办呢","AI响应":"你好！很高兴为你解答。\n\n如果物流已签收但仓库查不到箱唛号，可能是扫描延迟。建议包裹派送至仓库12-24小时后仍未更新时，准备好货件号或运单号联系官方客服核实具体状态并催促扫描。\n\n此外，请核实是否已在后台点击确认发货，并检查箱唛是否符合规范。若需调监控找货，需提供货件外观、卸货位置和具体签收时间。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 16:10:26","用户":"Coconut","群":"","用户问询":"我想在这个界面找Fulfillment ID 应该怎么才能找到啊","AI响应":"你的问题我暂时无法回答，后续我会丰富我的知识库，敬请见谅。其余巴西问题可正常解答，但不能主动提及巴西本土以及巴西海外仓相关知识。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-19 19:35:59","用户":"Fake","群":"","用户问询":"我这边仓库是在厦门市集美区后溪镇，厦门菜鸟可以免费揽收嘛","AI响应":"你好！请先通过以下链接查询您的地址是否在菜鸟揽收范围内：https://gpn.cainiao.com/global/portal/productservice?slug=af63clngtvt0ggps。若在范围内可申请上门揽收，若不在则需选择卖家自寄模式。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-16 14:43:09","用户":"Half God.","群":"","用户问询":"就是我的货72小时内货代有扫描入库的记录就行了是吗","AI响应":"是的，可以这样理解。平台对自发货订单的总处理时效要求是72小时（工作日）。\n\n具体的时间分配是：你需要在订单产生后的48小时（2个工作日）内将货物送达物流商仓库，物流商在接货后有24小时完成扫描入库。只要在72小时内有了物流扫描上网记录，就不算超时。\n\n为了确保不超时，建议你尽早发出，给物流商留出充足的扫描时间。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 11:07:16","用户":"幸运🍀","群":"","用户问询":"你好，买家退货到当地仓库的运输途径是什么？","AI响应":"你好！很高兴为你解答。买家退货通常通过平台指定的当地物流商寄回。具体流程取决于买家选择的退货方式，通常由平台生成退货面单供买家使用。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-16 15:12:29","用户":"D","群":"","用户问询":"好的，半托管的流程是上完品就可以发首单到仓库吗","AI响应":"是的，半托管流程为：发布产品、商家创建发货单、商家发货至国内东莞集货仓、仓库接收并处理、产品上架变为在售（active）状态。针对新品SKU，首单建议备货5-10件。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 15:46:41","用户":"**2","群":"","用户问询":"那外国的官方仓库收费吗","AI响应":"美客多Full仓储服务包含仓储服务费。费用根据商品尺寸每日计费，并随存放时间累加。目前智利仓库仓储费有折扣，通知前不收取。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 11:22:26","用户":"'Mint","群":"","用户问询":"这个仓库可以接受自送吗","AI响应":"可以。图片显示的保定白沟仓属于菜鸟指定的国内扫码仓，支持卖家自送（Drop Off）。\n\n网页参考资料\n菜鸟仓库地址查询：https://global-selling.mercadolibre.com/help/cainiao-warehouses-drop-off_36979","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 18:26:30","用户":"。","群":"","用户问询":"国内仓库点在哪里","AI响应":"目前美客多国内揽收点分布在：华东（义乌、嘉兴）、华南（广州、东莞、深圳、香港、泉州）。\n\n具体的仓库地址需要在卖家后台进行设置和查看，路径为：Global Selling Navigation -> Settings -> Selling Preference -> Dispatch methods。\n\n如果您的发货地址不在揽收范围内，可以选择自寄方式送达。此外，东莞沙田揽收仓的具体地址为：沙田镇虎门港物流园1号仓库（导航：第一产业虎门港物流园）。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 17:42:09","用户":"","群":"","用户问询":"跨境直邮在深圳有仓库吗","AI响应":"目前平台在华南地区的深圳设有揽收点。具体仓库地址请在卖家后台查看，路径为：Global Selling Navigation->Settings->Selling Preference->Dispatch methods。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 15:12:24","用户":"l n n y","群":"","用户问询":"半托是把货发到你们东莞的仓库吗","AI响应":"是的，半托管模式需要您将货物发送至美客多位于广东省东莞市的国内集货仓。仓库在收到并处理完货物后，产品才会上架变为可售状态。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 10:10:55","用户":"Will","群":"","用户问询":"退回到官方仓库后怎么操作？","AI响应":"你好！仓库会对退回商品进行质检。品相完好、包装完整的商品会自动重新计入可售库存并再次上架销售。若判定为损坏或已使用，则标记为不可售库存，您需在规定时间内预约提取到当地第三方仓，否则将由平台捐赠或销毁。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 15:01:00","用户":"Felicity 103%","群":"","用户问询":"为什么我这个新建不了入库单呀","AI响应":"你好！很高兴为你解答。目前无法直接判断具体原因，建议优先核查以下方向：\n\n1. 确认店铺是否已绑定有效的RFC税号。\n2. 检查商品是否已转换为海外仓（Full）模式。\n3. 核实商品尺寸和重量是否超出海外仓限制。\n4. 确认仓库是否有入库配额。\n\n若仍无法解决，建议私下联系对接人员核实后台具体报错。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 09:54:22","用户":"若初见","群":"","用户问询":"买家退货是退回仓库？","AI响应":"你好！很高兴为你解答。\n\n是的，当买家发起退货后，商品会退回到美客多官方仓库。\n\n仓库会对退回商品进行质检：\n- 若品相完好、包装完整：系统会自动将其重新计入可售库存并再次上架销售。\n- 若判定损坏或已使用：商品将被标记为“不可售库存”。您需要通过后台预约提取（Pick Up）到当地第三方仓，或者在规定时间内未提取则由平台捐赠或销毁。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 15:19:46","用户":"TaU*","群":"","用户问询":"这个吗","AI响应":"你好！如果遇到入仓异常且无法在后台创建入库单，建议你直接联系图片中的这位工作人员，向其反馈具体情况并寻求协助处理。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-13 10:52:42","用户":"彬","群":"","用户问询":"怎么关联入库？","AI响应":"thought\n您可以重新关联新建的运单号入库，不需要重新贴标。直接在后台新建一个入库单，并关联您当前的运单号即可。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-13 17:13:26","用户":"晨夕","群":"","用户问询":"我想算一下，fti ，79美金的商品，阿根廷买家最终到手金额是多少，好和124美金的full卖家比价","AI响应":"你好！很高兴为你解答。\n\n要计算阿根廷买家的最终到手价，我们需要模拟买家在结账页面看到的总额。阿根廷跨境购物的税费计算非常复杂，主要由**关税（Derechos de Importación）**和**统计费**等组成。\n\n以下是基于FTI模式和普通Full模式的对比估算（以阿根廷常见的跨境税率约50%为例）：\n\n**1. 你的FTI模式（79美金商品）：**\n*   **产品价格**：79美金。\n*   **跨境运费**：假设为10美金（FTI享受8折优惠后的估算）。\n*   **计税基数**：79 + 10 = 89美金。\n*   **免税额度**：阿根廷每单有50美金免税额。\n*   **应纳税部分**：89 - 50 = 39美金。\n*   **进口关税**：39美金 × 50% = 19.5美金。\n*   **买家最终支付总额**：79（产品） + 10（运费） + 19.5（税） ≈ **108.5美金**。\n\n**2. 竞争对手Full模式（124美金商品）：**\n*   **产品价格**：124美金。\n*   **跨境运费**：假设为12.5美金（普通模式无FTI折扣）。\n*   **计税基数**：124 + 12.5 = 136.5美金。\n*   **应纳税部分**：136.5 - 50 = 86.5美金。\n*   **进口关税**：86.5美金 × 50% = 43.25美金。\n*   **买家最终支付总额**：124 + 12.5 + 43.25 ≈ **179.75美金**。\n\n**对比结论：**\n*   **你的到手价**：约 **108.5美金**。\n*   **对手到手价**：约 **179.75美金**。\n\n**分析：**\n由于你的初始定价（79美金）远低于对手，且享受FTI的运费折扣，即便加上关税，你最终展示给买家的价格依然比对手便宜了约 **70美金**。在阿根廷市场，这个价格差距具有压倒性优势，买家会毫不犹豫选择你的产品。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"}]},{"一级大类":"产品管理","二级子类":"类目咨询","Past 7 Days":125,"Previous 2026-07-06 to 2026-07-12":129,"Change":-4,"WoW":-0.031007751937984496,"Past 7 Share":0.018144868631151112,"高频问题":"类目/产品能否售卖","__details":[{"时间":"2026-07-19 15:49:07","用户":"其良_LYNN","群":"","用户问询":"汽车配件 (Vehicle Accessories)/摩托车及全地形车配件 (Motorcycle & ATV Accessories)/包袋与背包 (Bags & Backpacks) 类目下的产品特征是什么，与其他类目的包有什么不同，前端的类目搜索关键词匹配类目的是什么","AI响应":"汽车配件和摩托车配件类目产品具有强适配性，通常需匹配特定车型、年份或排量，属于刚需且高频搜索类目。\n\n包袋与背包类目产品特征如下：\n1. 产品特征：强调功能性（如防水、防盗、大容量）与设计感，受季节和流行趋势影响大。\n2. 与其他包的区别：该类目更侧重日常通勤、学生书包或旅行背包；而汽车/摩托车类目下的包（如边包、油箱包）则侧重于安装在车辆上的特定用途，材质更耐磨且具备固定结构。\n\n前端类目搜索关键词匹配：\n类目预测器会根据你输入的标题关键词自动推荐。例如输入“Backpack”系统会匹配至Bags & Backpacks；输入“Motorcycle saddlebag”则会匹配至摩托车配件相关类目。建议参考平台在售同类产品的类目路径以确保精准。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-19 15:46:04","用户":"Elvis  Cheung","群":"","用户问询":"汽车配件 (Vehicle Accessories)/摩托车及全地形车配件 (Motorcycle & ATV Accessories)/包袋与背包 (Bags & Backpacks) 类目下的产品特征是什么，与其他类目的包有什么不同，前端的类目搜索关键词匹配类目的是什么","AI响应":"你好！很高兴为你解答。\n\n该类目产品强调功能性与耐用性，如防水、防盗及耐磨材料。与普通包相比，它们针对骑行场景设计，具备加厚肩带、透气背板及工具专属隔层。\n\n前端搜索关键词匹配的类目通常为：Accesorios para Vehículos > Accesorios para Motos > Maletas y Alforjas。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-19 15:35:38","用户":"Elvis  Cheung","群":"","用户问询":"汽车配件 (Vehicle Accessories)/摩托车及全地形车配件 (Motorcycle & ATV Accessories)/包袋与背包 (Bags & Backpacks) 类目下的产品特征是什么，与其他类目的包有什么不同","AI响应":"你好！很高兴为你解答。\n\n该类目产品强调**功能性与耐用性**，如防水面料、防盗机制（密码锁）、耐磨材料及可内置水袋等。\n\n与普通包相比，它们针对骑行场景设计，通常具备加厚肩带、透气背板、专属隔层（如头盔或工具位）及反光条，更符合拉美骑行文化和DIY需求。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-19 15:27:07","用户":"Elvis  Cheung","群":"","用户问询":"汽车配件 (Vehicle Accessories)/摩托车及全地形车配件 (Motorcycle & ATV Accessories)/包袋与背包 (Bags & Backpacks) 类目下的产品特点是什么","AI响应":"你好！很高兴为你解答。\n\n该类目产品体积小、复购强，天然适合跨境自发货，是真正的黄金赛道。其中骑行背包、工具包等配件销量亮眼，反映出扎实的本地需求。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-16 11:44:17","用户":"彭大力👩🏽😳","群":"","用户问询":"Voltar Casa, Móveis e DecoraçãoCozinhaArmazenamento e OrganizaçãoArmazenamento de CondimentosPorta Condimentos 什么类目 谢谢","AI响应":"你好！很高兴为你解答。\n\n根据你提供的路径，在跨境店后台请对应选择以下类目：\n\nHome, Furniture & Garden > Kitchen > Storage & Organization > Condiment Storage > Spice Racks & Holders\n\n如果搜索不到，请按此层级手动选择即可。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-14 17:18:26","用户":"郭亚","群":"","用户问询":"因为我的类目在欧美卖的产品是发光的玩具，但是在美客多的话，只能卖墨西哥，可能巴西这些卖不动，但他看到我的店铺以后就说我现在经营的是什么类目，然后在美客多也要上同样类目的产品才可以，是吗","AI响应":"你好！很高兴为你服务。\n\n关于你提到的经营类目一致性问题，美客多全托管模式确实会优先参考你目前在其他跨境平台（如亚马逊、美客多自营或其他托管平台）成熟经营的类目。\n\n主要原因如下：\n1. 资质审核：平台需要通过你现有店铺的流水和经营情况，来评估你在该类目下的供货稳定性、产品质量以及价格竞争力。\n2. 选品成功率：如果你在欧美市场已经有成熟的发光玩具销售经验，说明你拥有该类目的供应链优势，这有助于你在美客多全托管模式下快速起量。\n\n如果你希望在美客多经营发光玩具，但目前对接的买手认为类目不符，建议你在重新提交入驻申请时，重点展示你发光玩具类目的流水证明和供应链实力。\n\n关于巴西市场，目前全托管模式确实主要集中在墨西哥站点。如果你的产品在欧美市场表现良好，墨西哥市场的消费习惯与欧美有一定相似性，发光玩具类产品在当地节庆和礼品市场也是有潜力的。\n\n建议你按照目前最擅长的类目进行申请，并在表单中明确标注你的主营类目为玩具。\n\n全托管/半托管入驻意向登记表：\nhttp://kks.ink/ss/vKx9ph/d12030","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-13 11:45:42","用户":"彭大力👩🏽😳","群":"","用户问询":"Voltar .........Armazenamento de CondimentosAzeiteiras e VinagreirosAzeiteiro 什么类目 谢谢","AI响应":"你好！很高兴为你解答。\n\n根据你提供的路径，在跨境店后台请对应选择以下类目：\n\nHome, Furniture & Garden > Kitchen > Storage & Organization > Condiment Storage > Oil & Vinegar Cruets\n\n如果搜索不到，请按此层级手动选择即可。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-19 15:07:33","用户":"Elvis  Cheung","群":"","用户问询":"For - Bolsos Para Bolsillos De Motocicleta, Impermeables En ，这个属于什么类目的产品","AI响应":"你好！很高兴为你解答。\n\n该产品属于以下类目：\nAccesorios para Vehículos > Accesorios para Motos > Maletas y Alforjas > Alforjas\n（车辆配件 > 摩托车配件 > 箱包与边包 > 边包/挂包）\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-19 20:48:51","用户":"其良_LYNN","群":"","用户问询":"Bolso De Bolsillo For Motocicleta De Línea A, Bolso 这是什么类目","AI响应":"该标题对应的类目通常是：**摩托车和四轮摩托车配件 -> 背包和手袋 (Mochilas y Bolsos)**。\n\n其核心关键词 \"Bolso For Motocicleta\"（摩托车包）明确指向了骑行专用包袋类目。这类产品通常具有固定在车身或适合骑行背负的特征。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-19 15:52:07","用户":"其良_LYNN","群":"","用户问询":"摩托车和四轮摩托车配件 -> 背包和手袋 (Mochilas y Bolsos) 类目下的产品特征是什么","AI响应":"该类目下的产品特征主要体现在**强功能性**与**骑行适配性**：\n\n1. **设计结构**：通常具备人体工学背负系统，带有胸扣或腰扣以防止骑行时晃动；部分产品采用硬壳设计以减少风阻。\n2. **特殊功能**：具备高等级防水、防风性能，常配有反光条提高夜间骑行安全性；部分款式设计有专门存放头盔的网兜或空间。\n3. **耐用性**：采用高强度耐磨面料（如牛津布、碳纤维纹理材质），以应对户外复杂环境。\n\n与普通背包相比，它更强调在高速移动状态下的稳定性和对骑行者的保护。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-14 17:15:55","用户":"郭亚","群":"","用户问询":"我想申请入住美克多的全托管，我们的那个30万流水是够的，但是一直找不到符合我这个类目的买手。你这边有推荐的吗","AI响应":"你好！很高兴为你服务。\n\n关于全托管模式的入驻，目前平台并没有公开买手的个人联系方式。如果你已经确认流水达标（单平台单店铺近12个月流水≥30W美金），建议你通过官方指定的统一入口提交申请。\n\n请准确填写以下【全托管/半托管入驻意向登记表】：\nhttp://kks.ink/ss/vKx9ph/d12030\n\n提交表单后，平台招商团队会根据你填写的类目和资质进行审核。如果你的产品符合当前平台的选品需求且具备竞争力，对应的类目负责人员会主动与你联系。\n\n你可以通过以下链接查询审核进度：\nhttps://mercadolibre.cn/seller/info?id=478&type=consignment\n（请使用填写问卷时提交的公司名称、手机号码或邮箱进行查询）\n\n此外，全托管模式目前重点招募的类目包括消费电子、家居生活、服饰鞋包、汽摩配等。建议在提交申请时，尽可能详细地展示你的产品优势和供货能力，以提高被买手选中的概率。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-19 21:42:07","用户":"其良_LYNN","群":"","用户问询":"大容量女士时尚背包，旅行双肩包，简约风格出行书包登山包，满足购物出行通勤使用 这是什么类目","AI响应":"该标题对应的类目是：**服装、鞋履及配件 -> 箱包及背包 -> 背包 (Ropa, Bolsas y Calzado -> Equipaje, Bolsos y Mochilas -> Mochilas)**。\n\n其核心关键词“女士时尚背包”、“双肩包”和“书包”明确指向了日常通用型背包类目，而非特定车辆配件类目。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-19 20:18:17","用户":"价值2","群":"","用户问询":"我是自发货的，美客多，美客多哪个类目好做？哪个类目好做？，适合新人，美客多哪个类目好做？","AI响应":"你好！自发货适合做轻小件、高客单价、测款新品或长尾产品。建议优先选择重量15kg以内、单边长60cm以内的商品，利用收益价格模式灵活上架测款。避开保健品、药品等禁运品。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-16 14:14:45","用户":"XNGc2","群":"","用户问询":"但是订单不是显示扣除了一个VAT 的税费吗？类目的基础佣金比例所代指的税费是什么呢？","AI响应":"你好！很高兴为你解答。\n\n订单中显示的 Taxes 是针对销售额代扣的增值税（IVA）和所得税（ISR）。\n\n而 Selling fees 中的 20% 是由该类目的基础佣金（17%）加上 3% 的交易相关税费组成的。这 3% 是平台针对每笔交易收取的附加费用，与你看到的 16.5% 基础比例存在差异，通常是因为类目佣金比例调整或包含了特定的交易处理费。建议以账单明细为准。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-19 20:18:46","用户":"价值2","群":"","用户问询":"美客多，美客多哪个类目好做？哪个类目好做？，适合新人，美客多哪个类目好做？","AI响应":"你好！美客多墨西哥站点的大件商品如家居、家具、健身器材和汽配类目增长迅速。对于新人，建议从轻小件、高利润的电子产品或生活用品入手，并参考热搜词页面选品。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-15 14:53:15","用户":"小生不才","群":"","用户问询":"1. 搜索平台在售的同类型产品，查看它们所在的具体类目路径。如何搜索","AI响应":"你可以直接在美客多前台买家端页面，输入产品的核心关键词进行搜索。\n\n找到搜索结果中与你产品高度相似的竞品，点击进入其产品详情页。在详情页的顶部通常会显示该产品的类目路径，你可以参考其最后一级类目进行挂载。\n\n此外，在卖家后台创建 Listing 输入产品标题时，系统也会根据关键词自动推荐类目。建议结合竞品路径和系统推荐，选择最精准的类目，以保证 Listing 获得最大程度的搜索流量。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-18 10:39:34","用户":"菠萝蟑螂","群":"","用户问询":"如果是后续被美客多平台更换到其他类目的话，如何更换回来","AI响应":"如果产品被平台自动更改了类目，您可以在卖家后台尝试重新编辑Listing。在编辑过程中，通过输入产品标题或关键词，利用类目预测器重新检索并选择正确的类目。\n\n同时，建议您参考平台目前在售的同类型产品所在的类目，确保所选类目与竞品保持一致。如果后台无法手动修改，建议通过卖家后台右上角的问号图标点击Need Help联系在线客服申请更正。\n\n网页参考资料：\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260125/166fca879b5844ddb33c70275e2ba08b.png","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-17 13:40:34","用户":"蓝七","群":"","用户问询":"请问一下手机数据线夹这个产品是要放到工具里面的绕线器类目吗","AI响应":"你好！手机数据线夹通常建议放置在手机配件下的理线器或绕线器类目中。为了确保分类准确并获得最佳流量，建议您在后台上传产品时，搜索关键词并参考系统推荐的类目，或查看同类热销产品的所属类目。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-16 18:39:48","用户":"kanl","群":"","用户问询":"一个店铺可以跨类目上品吗，就是上不同的类目 比如洗衣液和衣服","AI响应":"你好！美客多店铺是可以跨类目上传产品的，平台目前没有强制要求一个店铺只能经营单一类目。你可以根据业务需求同时上架洗衣液和衣服等不同类目的商品。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-16 13:47:34","用户":"段祺浩@AMZ","群":"","用户问询":"我是个CE品类的买家，你们平台最好的类目是什么？","AI响应":"平台最受欢迎的品类通常包括电子产品、服装鞋靴、家居用品、美妆个护等。对于消费电子类目，手机配件、智能穿戴和小家电是重点招商方向。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-13 11:33:34","用户":"赢在中国🇨🇳","群":"","用户问询":"在南美售卖需要哪些资质然后能做急救包类目吗 我是新卖家","AI响应":"你好！很高兴为你解答。入驻美客多普通自发货或海外仓无需流水，准备好中国内地或香港注册的营业执照、法人身份证、联系方式及跨境电商平台店铺链接即可。急救包类目属于医疗器械或受限品类，建议在选品时核实当地站点的禁售政策。\n\n普通自发货/海外仓也可选择自注册（PC端登入）：https://global-selling.mercadolibre.com/landing/about","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-19 20:17:30","用户":"价值2","群":"","用户问询":"我是自发货的，美客多哪个类目好做？，适合新人","AI响应":"你好！自发货适合做轻小件、高客单价、测款新品或长尾产品。建议避开保健品、药品等禁运品，优先选择重量15kg以内、单边长60cm以内的商品，利用收益价格模式灵活上架测款。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":
