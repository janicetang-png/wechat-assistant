:"kaykay子琪","群":"","用户问询":"多久可以收到通知","AI响应":"全托管和半托管入驻申请的预计联系时效均为20-30个工作日。请保持预留联系方式畅通，客户经理将按批次联系。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-15 13:58:26","用户":"GETIWEI","群":"","用户问询":"美客多上品没标准吗","AI响应":"你好！美客多上品是有标准的，但系统要求产品类目与尺码表类目必须完全一致。\n\n由于尺码表后台类目库与产品发布类目库存在同步差异，当你在尺码表后台找不到对应的运动类目时，最标准的处理方式就是将产品类目统一调整为 **Clothing and Accessories > T-shirts**。\n\n这并不影响产品属性，你只需在表格的 **Main color**、**Size** 以及标题中准确描述秋冬款特征即可。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-15 10:46:33","用户":"Mars","群":"","用户问询":"你好。为什么还没收到通知","AI响应":"你好！很高兴为你解答。\n\n提交入驻表单后没有收到回复，可能正处于正常的排队审核阶段，建议先检查注册邮箱的垃圾邮件文件夹。若是卡在最后一步无法提交，通常是网络环境导致，建议避开邮件链接直接从系统后台进入，或者尝试更换浏览器和网络环境多次刷新重试。\n\n普通自发货/海外仓也可选择自注册（PC端登入）：https://global-selling.mercadolibre.com/landing/about\n\n入驻准备材料如下：\n1. 营业执照：中国大陆（文化传播、咨询类除外）或香港公司营业执照的彩色扫描件或照片。\n2. 法人身份证：法人身份证正反面彩色扫描件或照片，身份证姓名需与营业执照法定代表人姓名一致。\n3. 注册邮箱：建议使用Gmail、Outlook或Hotmail，请勿使用QQ、163等国内邮箱。\n4. 手机号：建议使用法人实名认证的手机号。\n5. 跨境电商平台店铺链接：提供主流跨境电商平台（如亚马逊、eBay、Shopee等）的店铺链接。\n6. 流水证明：FTI工贸一体和半托管模式/全托管模式仍需要流水，普通自发货和海外仓模式不需要流水。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-14 15:26:25","用户":"Jiaqi Hu","群":"","用户问询":"最低门槛要求。是多少？","AI响应":"你好！很高兴为你解答。美客多不同类目对重量和尺寸的最小值要求有所不同，通常建议包裹的长、宽、高均不低于1厘米，重量不低于10克。如果报错持续存在，建议你尝试小幅度增加尺寸或重量数值后重新提交。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-14 12:26:15","用户":"西格玛","群":"","用户问询":"我填了申请表，多久会通知","AI响应":"你好！很高兴为你解答。\n\n全托管入驻审核预计需要一个月左右。目前商家登记数量较多，客户经理将逐一按批次联系，请保持预留联系方式的通讯畅通。\n\n你可以通过以下链接查询入驻进度：https://mercadolibre.cn/seller/info?id=478&type=consignment \n注意：请使用填写问卷的公司名称、手机号码或邮箱中任意一项进行查询。如有多项审核结果，请以最新日期的处理结果为准。\n\n如果长时间没有收到消息，也可以私聊把公司名和登记邮箱发给你的经理帮忙跟进查下进度。感谢你的理解与等待。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-16 17:36:29","用户":"笑","群":"","用户问询":"首图有什么要求","AI响应":"平台对产品图片有具体要求：\n1. 背景：主图背景需为纯白。\n2. 尺寸：建议在1200x1200px，且必须在1000像素以上。\n3. 格式：必须为JPEG、TIFF或PNG格式。\n4. 内容：仅展示待售商品，居中且清晰，不得添加水印、文字、标签或额外元素。\n\n部分类目现已支持情景化背景首图，具体可参考：https://global-selling.mercadolibre.com/help/43034","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-16 16:00:43","用户":"左右","群":"","用户问询":"需要什么要求？","AI响应":"申请开通Full仓权限通常需要满足以下要求：\n1. 店铺信誉等级：必须处于绿色状态。\n2. 销售表现：建议先通过自发货模式积累销售数据。\n3. 运营合规性：系统会综合评估各项指标。\n\n当各项指标达标后，系统会自动在后台“库存管理”板块开放送仓入口。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-16 14:15:23","用户":"Will","群":"","用户问询":"退仓规则是什么","AI响应":"你好！退仓规则如下：\n1. 平台针对一定周期内低动销或无动销商品发起退仓，商家也可在后台自主申请。\n2. 商家需自行安排上门提货，运费由商家承担。\n3. 提货流程：需发送邮件至指定邮箱预约，邮件标题需注明OC提货码或相关单号，正文写明提货时间（需提前24-48小时预约）。\n4. 仓库地址：广东省东莞市沙田镇进港南路周大福物流东莞物流中心205号库台。\n5. 若超期未提货，平台将对货品进行销毁处理。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-16 11:42:06","用户":"🇨🇳CICI . 蘇","群":"","用户问询":"属于什么类别","AI响应":"根据图片内容，这款产品属于“书籍”或“游戏和玩具”类别。\n\n这类产品在美客多平台上需要遵循特定的照片要求。\n\n网页参考资料：\nhttps://global-selling.mercadolibre.com/help/18605","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-15 19:47:36","用户":".","群":"","用户问询":"这个行吗","AI响应":"这张实拍图清晰完整，可以看到完整的边框和红章，符合上传要求。请确保上传的是原件实拍，不要有遮挡或反光。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-15 15:02:24","用户":"巫大英雄","群":"","用户问询":"有扶持政策吗？","AI响应":"全托管模式提供以下核心扶持：\n1.全链路0费用：0佣金、0年费、0仓储费、0国际运费、0广告费。\n2.专业托管：平台负责上架优化、活动提报及售后。\n3.顶级流量：专属FULL标，直通MELI Selection活动专场及站外投放。\n4.快速回款：订单妥投后7个工作日回款。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-13 19:58:15","用户":"冰咖啡","群":"","用户问询":"这是什么意思","AI响应":"你好！很高兴为你解答。\n\n这句话的意思是：请将你的脸部保持在椭圆框内。\n\n从你提供的图片来看，你的脸部位置偏高，且被手机遮挡了。请按照以下要求操作：\n\n1. 调整电脑摄像头角度或调整坐姿，让你的整个面部完整地出现在蓝色的椭圆框中心。\n2. 不要用手机遮挡脸部，双手放下，保持面部清晰可见。\n3. 确保光线充足，不要背光，也不要戴帽子或墨镜。\n\n调整好位置后，系统会自动识别并完成拍摄。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-13 10:43:13","用户":"猜猜","群":"","用户问询":"箱规有什么要求","AI响应":"美客多针对不同发货模式，对包裹的包装尺寸和箱规有不同的限制要求，具体如下：\n\n一、自发货模式（各站点一致）\n最大尺寸限制：\n- 长：不得超过 60cm\n- 宽：不得超过 40cm\n- 高：不得超过 35cm\n- 三边之和：不得超过 135cm\n- 最大重量限制：15kg\n\n二、托管模式（半托管/全托管）\n当产品到达仓库时，工作人员会测量原始包装或透明袋的尺寸：\n- 单件重量：小于 15kg\n- 任一边长：小于 60cm\n- 三边总和：小于或等于 135cm\n\n三、美国转运仓（美仓）FULL仓储模式\n针对一级包装（直接配送至买家手中的包装）的限制标准：\n- 重量限制：单件商品毛重须小于 55 磅 (55lb)\n- 边长限制：单边长度不得超过 48 英寸 (48in)\n- 周长总和：三边之和（长+宽+高）不得超过 102 英寸 (102in)\n\n四、大件商品政策支持\n针对特殊品类，平台提供大件专属库容支持：\n- 大件定义：尺寸 > 50x60x60cm 或 重量 > 18kg\n\n此外，半托管模式下发货单装箱没有严格的箱规要求，但建议不要使用太大的箱子，因为仓库不会协助卸货，需要司机或物流商自行卸货。\n\n网页参考资料：\nhttps://global-selling.mercadolibre.com/knowledge-hub/15573","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-13 08:46:32","用户":"朱朱","群":"","用户问询":"网络有要求吗","AI响应":"美客多对操作环境没有像亚马逊那样严格的防关联要求。但是，一个公司营业执照只能对应一个美客多账号。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-13 12:53:27","用户":"平凡的世界","群":"","用户问询":"麻烦您帮我看一下 巴西站这款产品 我看不到系统要求我归于哪个品类","AI响应":"从你提供的图片来看，系统在推荐类目那一栏显示的是代码错误（%ls()），所以你无法直接看到具体的建议品类。\n\n针对巴西站点的这款产品，建议你按照以下步骤操作：\n\n1. 参考竞品：在美客多巴西站前台搜索同款或同类产品，查看排名前列的卖家将产品放在了哪个类目路径下，这是最直接准确的参考方式。\n\n2. 手动调整类目：点击邮件中的“Go to the listing”按钮进入后台，或者在卖家后台找到该产品，尝试重新编辑类目。对于你之前提到的3C类产品（如无人机、相机），请务必确保进入“Electronics, Audio & Video”大类下寻找细分目。\n\n3. 避免错放：如果你卖的是无人机或相机，而之前的类目选成了眼镜配饰（Glasses & Accessories），系统会自动判定为类目错放并下架。\n\n如果手动修改时依然无法确定，可以尝试在刊登页面输入产品关键词，让系统重新自动匹配推荐类目。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-18 15:57:20","用户":"CT.Lau","群":"","用户问询":"之前我是patty的，现在换了 但是没有发邮件通知我","AI响应":"你好。如果店铺已审核通过，运营经理会主动通过邮件、电话或微信联系你，请查看审核通过邮件或近期系统邮件中的联系方式。若需修改公司信息，可联系原招商经理协助。技术问题请通过后台右上角问号图标联系在线客服。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-13 12:22:52","用户":"柯培鑫","群":"","用户问询":"卖服装和箱包有没有强制要求资质的，没有资质行不行","AI响应":"在美客多销售**服装和箱包**，相比3C电子和玩具类目，准入门槛要低得多。对于中国跨境卖家来说，这两个类目通常**没有强制性的行政许可资质（如认证证书）**，但在实际操作中，必须满足以下合规要求：\n\n**1. 不需要特殊资质，但要符合标签法**\n虽然不需要像NOM或ANATEL那样的证书，但墨西哥和巴西等国对纺织品有严格的**标签要求**。\n*   **成分标识**：必须用当地语言（墨西哥用西班牙语，巴西用葡萄牙语）标明面料成分（如 100% Algodón / 100% Cotton）。\n*   **洗涤说明**：需包含标准的洗涤图标或文字说明。\n*   **产地标识**：必须明确标注 \"Made in China\"。\n*   **尺码建议**：拉美人的体型与亚洲人差异较大，建议在 Listing 中提供详细的尺码对照表（厘米为单位），否则退货率会非常高。\n\n**2. 绝对不能涉及品牌侵权**\n这是服装箱包类目最容易踩坑的地方。\n*   **外观侵权**：不能售卖印有知名动漫形象（如迪士尼、小猪佩奇）、大牌 Logo（如 LV、Nike）或模仿大牌经典设计的款式。\n*   **关键词侵权**：标题和描述中不能出现他人注册的品牌词。\n*   **后果**：一旦被品牌方投诉或平台系统抓取，Listing 会被直接删除，多次违规会导致封店。\n\n**3. 材质限制（针对特定材质）**\n*   **真皮/动物皮**：如果涉及珍稀动物皮毛，海关查验非常严格，甚至禁售。建议跨境卖家优先选择人造革（PU）或普通织物材质。\n*   **木质配件**：如果箱包上有未经处理的木质装饰，可能会涉及植物检疫问题。\n\n**4. 墨西哥站点的特殊性（针对海外仓）**\n如果你打算走**墨西哥海外仓（FULL）**模式：\n*   虽然不需要NOM认证，但如果你的产品单价较高或属于特定纺织品类目，海关在入境时可能会核查你的**进口商资质**。\n*   对于普通跨境卖家，只要确保产品没有侵权且标签合规，通常可以正常入仓销售。\n\n**总结：**\n卖服装和箱包**“没有资质”是可以卖的**，只要你的产品是**原创或无品牌（白牌）**，且做好了**语言本地化**和**尺码适配**。这两个类目非常适合新卖家用来快速起步和积累店铺信誉。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-18 19:53:43","用户":"","群":"","用户问询":"按要求上传了的 上传两次还是这样喔","AI响应":"目前无法直接判断具体原因，建议您优先核查营业执照是否为最新版本，且图片是否包含完整的边框、无任何反光或阴影遮挡文字。若确认无误，提交邮箱后即为您开通KYC审核绿色通道，通常3-5个工作日给反馈，请留意卖家后台状态变化。加速审核只有一次机会，请谨慎提交。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-15 13:31:07","用户":"XIAOMEI","群":"","用户问询":"强烈要求你们改进客服的工作，这样子我们好麻烦","AI响应":"非常理解您的心情，这种找不到人处理、问题又持续堆积的情况确实非常令人沮丧，给您的经营带来了很大的困扰。\n\n我会将您关于“客服响应速度慢、人工入口难找”的反馈记录下来，并向相关团队反映。我们非常重视卖家的经营体验，您的建议对我们优化服务流程非常重要。\n\n目前为了能尽快解决您订单被取消的问题，建议您在**北京时间晚上22:00以后**（拉美当地办公时间）尝试登录后台，那个时段刷出 **CHAT（在线客服）** 的概率会更高。\n\n如果遇到问题需要联系我们平台客服，可以通过后台右上角的\"？\"→\"Need Help\"→选择邮件客服或24H在线客服进行沟通。记得用英语交流，并提供详细的截图说明，这样客服能更好地帮您解决问题。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-14 15:45:23","用户":"たい","群":"","用户问询":"分别有那些新卖家扶持和优惠政策。","AI响应":"你好，很高兴为你解答。美客多为新卖家提供的扶持和优惠政策主要包括以下内容：\n\n在费用优惠方面，平台不收取月租费，卖家可免费入驻各大站点。全站点适用Classic低佣金模式，销售佣金费率在10%至17%之间。当店铺信誉等级达标后，尾程配送费最高可享50%的减免。\n\n在运营扶持方面，平台提供免费的活动资源，包括各类大促、DOTD、LD等促销活动均可免费提报，更有活动补贴。针对新站点（MLA），激活链接即可获得出单补贴。此外，平台还会提供选品指南，包括市场及竞品分析、高需求和高增长产品分析报告，并有定期直播培训和新卖家运营手册。\n\n在物流与库容方面，新卖家拥有充足的初始库容，且支持自由申请扩容。送仓无需预约，工作日早上9点至下午6点均可送仓，且接受快递入仓。\n\n在广告与服务方面，激活链接可获得出单补贴，广告补贴详情可咨询客户经理。店铺审核通过后还会分配专属运营经理提供一对一指导。\n\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260125/2d1a0b6b5da04d45ae9cd6f17fcf65bc.png","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-13 12:07:56","用户":"柯培鑫","群":"","用户问询":"儿童玩具这几个国家都需要哪些资质要求呢","AI响应":"在美客多销售儿童玩具，平台和当地海关对安全性的要求非常高。以下是针对不同站点的核心资质要求：\n\n**1. 墨西哥站点（Mexico）**\n*   **NOM认证（强制性）**：墨西哥对玩具的安全性有严格规定。如果你的玩具涉及电子功能（带电池或插电），通常需要 **NOM-001** 或 **NOM-003** 认证。\n*   **卫生准入（COFEPRIS）**：对于 3 岁以下儿童使用的玩具，或者含有油漆、涂料的玩具，墨西哥海关可能会要求提供铅含量检测报告，确保不含重金属毒素。\n*   **语言要求**：包装和说明书必须包含**西班牙语**，并明确标注适用年龄段、警告语（如“内含小零件，不适合3岁以下儿童”）。\n\n**2. 巴西站点（Brazil）**\n*   **INMETRO认证（极其严格）**：这是巴西玩具市场的“入场券”。所有在巴西销售的玩具必须通过 INMETRO 认证，并在产品上加贴认证标志。\n*   **语言要求**：包装、说明书及警告语必须使用**葡萄牙语**。\n*   **注意**：由于巴西对玩具监管非常严厉，跨境自发货卖家如果缺少相关认证，极易在海关被扣押或退运。\n\n**3. 智利与哥伦比亚**\n*   这两个站点相对墨、巴来说准入门槛稍低，但依然要求产品符合国际通用的安全标准（如 EN71 或 ASTM）。\n*   **年龄分级**：必须在 Listing 和包装上清晰标注建议使用年龄。\n\n**4. 跨境卖家的通用建议**\n*   **避开侵权**：玩具类目是侵权的重灾区。千万不要售卖带有迪士尼、漫威、乐高、宝可梦等知名 IP 形象的产品，除非你有正式的品牌授权书。一旦被投诉，封店风险极大。\n*   **材质安全**：确保产品不含邻苯二甲酸盐等有害物质。虽然平台不一定每单都查，但一旦发生抽检或买家投诉，你需要能提供相关的检测报告。\n*   **物流限制**：如果玩具含有电池（特别是锂电池）或液体（如泡泡水），在选择物流渠道时需要确认是否支持运输此类“敏感货”。\n\n**总结：**\n如果你是新卖家，建议先从**不带电、不涉及知名 IP、材质简单**的益智类玩具入手（如积木、拼图），这类产品资质压力较小，出海更稳妥。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-18 17:31:05","用户":"西格玛","群":"","用户问询":"大概多久会通知结果","AI响应":"你好！很高兴为你解答。\n\n全托管入驻审核预计需要一个月左右。\n\n目前商家登记数量较多，客户经理将逐一按批次联系，预计时效为20-30个工作日。请务必保持预留联系方式的通讯畅通，买手和客户经理会通过微信或者电话联系你。\n\n你可以点击下述链接查询入驻进度：https://mercadolibre.cn/seller/info?id=478&type=consignment\n请使用填写问卷的公司名称或手机号码或邮箱任意一项即可查询。如有多项审核结果，请以最新日期的处理结果为准。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-18 15:51:30","用户":"A-偶像","群":"","用户问询":"美客多全托管流水新政策","AI响应":"你好！很高兴为你解答。全托管入驻新政策已放宽要求，不再强制提供30万美金托管平台年流水，调整为提供跨境电商30万美金年流水即可。但需注意，提供流水的店铺和主体必须是绑定关系。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-17 12:38:05","用户":"月儿公主假睫毛厂家-杨","群":"","用户问询":"亲。查询结果为空的话。","AI响应":"查询结果为空通常是因为信息尚未录入系统。建议您在提交问卷后的5-7个工作日后再尝试查询，或留意微信及电话通知。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-15 08:17:23","用户":"南瓜","群":"","用户问询":"邮件已经收到了店铺下来的通知了","AI响应":"恭喜店铺成功下达。建议您尽快登录后台完成初始设置。后续平台会通过邮件发送补货通知或违规提醒，请务必保持关注并确保邮箱接收正常。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-14 20:12:09","用户":"柯培鑫","群":"","用户问询":"全托管备货数量有没有要求","AI响应":"您好，很高兴为您解答全托管模式的备货要求。\n\n在全托管模式下，备货数量是有明确要求的，主要遵循以下原则：\n\n1. 首次备货：通常要求单个SKU的起备量在50-100件左右。这是为了确保产品上架后有足够的库存支撑初期的流量分配和测款需求。\n\n2. 补货逻辑：后续的备货数量将由平台系统根据您的销售速度、库存周转率以及未来的大促计划自动计算，并向您发出补货建议。\n\n3. 仓库接收限制：在实际操作中，您需要严格按照平台下发的入库单数量进行发货。如果单箱内有多个SKU，需要在箱内做好物理隔离。\n\n4. 混装禁忌：请勿将全托管或半托管的货物与普通自发货、FTI账号货物混装揽件送货，否则仓库无法接收。\n\n如果您准备开始备货，请务必注意标签规范：外箱标（BAG LABEL）为10*15cm，产品标（SKU LABEL）为7*2.2cm。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-14 15:23:33","用户":"王秀地","群":"","用户问询":"rebates提报规则","AI响应":"Rebate活动持续一周，单产品每月限报一次。平台最高补贴5%，卖家到手金额为Final price加上补贴金额。生效后无需每周重复提报，活动结束后再提即可。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-14 09:56:42","用户":"波波波pewpewpew突突突","群":"","用户问询":"哪些产品需要资质要求","AI响应":"平台允许销售的商品类别非常广泛，但部分类别的商品可能需要额外的资质审核，例如：服装、鞋靴、家居、母婴、美妆、个护健康、电子产品、图书、玩具等。此外，墨西哥站点涉及电气安全的产品需关注NOM认证，巴西站点的光源/灯泡相关产品需通过INMETRO认证。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-13 15:26:38","用户":"柯培鑫","群":"","用户问询":"图片最大像素要求多大的","AI响应":"平台对产品图片的尺寸和像素有明确的要求，建议参考以下标准：\n\n**1. 像素建议**\n*   **最佳尺寸**：建议使用 **1200 x 1200 像素**。这个尺寸能确保买家在点击放大时，图片依然清晰，不会出现模糊或像素块。\n*   **最低要求**：较大的一侧至少为 **500 像素**，较小的一侧至少为 **50 像素**。\n*   **主图门槛**：主图的分辨率建议在 **1000 x 1000 像素** 以上，以确保最佳的展示效果。\n\n**2. 特殊产品要求**\n*   对于非常细长的产品（例如铅笔），底部需要至少 **250 像素** 的分辨率。\n\n**3. 图片比例与格式**\n*   **比例**：建议使用 **1:1 的正方形** 图片，确保宽度和高度相同。\n*   **格式**：必须为 **JPEG、TIFF 或 PNG** 格式。\n\n**4. 构图建议**\n*   产品应居中展示，并占据整个图像面积的 **80% 到 95%**，避免留出过大的边距。\n\n**温馨提示：**\n如果图片分辨率过低或上传后显得模糊，系统可能会判定 Listing 不合规，从而影响曝光。请务必优先核实图片分辨率是否满足 >1200px 且为纯白背景。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-17 17:03:13","用户":"Dford","群":"","用户问询":"[{\"type\":\"image\",\"content\":\"https://file.marsmind.cc/link-mind/wecom_wkteam/1688857857859744/20260717/f535fbd13d9c4c48a7cee0a60c8cafbd.png\"}]","AI响应":"从你提供的图片看，分辨率为1920x1920像素，这完全符合平台大于1200px的要求。只要保证是纯白背景且无水印文字，上传就没有问题。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"}]},{"一级大类":"账号入驻与安全","二级子类":"店铺等级","Past 7 Days":42,"Previous 2026-07-06 to 2026-07-12":40,"Change":2,"WoW":0.05,"Past 7 Share":0.006096675860066773,"高频问题":"店铺等级综合咨询","__details":[{"时间":"2026-07-16 15:54:36","用户":"壹号国际-Jason","群":"","用户问询":"60天内达到40单 又会重新计算信誉了吗","AI响应":"是的。一旦您在过去60天内达到40个订单，系统就会根据这60天内的订单延迟率、投诉率和取消率等综合表现，重新评定您的店铺信誉等级。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"店铺等级综合咨询"},{"时间":"2026-07-13 12:16:07","用户":"爱喝咖啡的懒人","群":"","用户问询":"也就是说不管我怎么做信誉一定会先被影响？","AI响应":"你好！很高兴为你解答。\n\n**是的，你的理解是正确的。**\n\n在美客多的机制下，只要买家发起了投诉，且投诉页面已经出现了“Reputation affected”的字样，你的店铺信誉就已经被**预扣分**了。这属于平台的“先扣分，后审核”机制。\n\n**目前的情况可以总结为：**\n\n1. **信誉受损是既定事实**：无论你现在是点“直接退款”还是“同意退货”，这笔纠纷都已经计入你的纠纷率统计中。\n2. **唯一的“翻盘”机会**：只有通过 **“Contact Mercado Libre”** 申请平台介入，并且平台最终判定**卖家无责**（例如：买家证据不足、买家恶意投诉、或者买家未按要求退回商品），平台才会人工撤销这笔纠纷对你信誉的影响。\n3. **为什么不能直接退款**：如果你直接点退款，就等于你默认了产品有问题，系统会永久保留这笔负面记录，没有任何撤销的可能。\n\n**总结：**\n信誉确实已经先被影响了。如果你想挽回，就必须走平台介入流程，证明自己没问题或者要求买家必须退货。如果你认栽退款，这笔信誉损失就坐实了。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"店铺等级综合咨询"},{"时间":"2026-07-13 11:16:56","用户":"爱喝咖啡的懒人","群":"","用户问询":"那我直接退钱的话会不会不 影响信誉？","AI响应":"你好！很高兴为你解答。\n\n**直接退钱（Refund money）并不能消除对信誉的影响。**\n\n在美客多平台，一旦纠纷已经标注了“Reputation affected”，即使你现在点击退款关闭纠纷，这笔投诉记录依然会计入你的店铺纠纷率中，信誉受损的事实已经造成。\n\n直接退钱的后果：\n1. **钱货两失**：买家拿到了全额退款，且不需要退回商品，你损失了货款和产品。\n2. **信誉依然受损**：系统会认为是因为产品质量问题导致了退款，这笔负面记录会保留在你的后台数据中。\n\n**建议操作：**\n既然直接退款也无法挽回信誉，你更应该点击“Contact Mercado Libre”申请平台介入。\n只要平台客服介入后判定责任不在卖家（例如买家无理取闹或未按要求退货），平台才有权限帮你**人工移除**这笔纠纷对信誉的影响。\n\n所以，不要轻易点退款，申请介入是你保护资金和恢复信誉的唯一机会。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"店铺等级综合咨询"},{"时间":"2026-07-17 18:47:42","用户":"🐜","群":"","用户问询":"“Reputation”是什么","AI响应":"店铺信誉 (Reputation) 是美客多运营最重要的衡量指标，直接体现在所有Listing前台，高度影响订单转化率。其等级以颜色区分，深绿色代表最佳，红色代表较差。\n\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260125/49a7867607574509905604343dcb979a.png","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"店铺等级综合咨询"},{"时间":"2026-07-16 15:53:14","用户":"壹号国际-Jason","群":"","用户问询":"、这句是什么意思","AI响应":"这句话的意思是：如果您的店铺在过去60天内订单量达到40单，平台将只根据这60天的数据计算信誉；若未达到，则会追溯计算过去365天的数据。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"店铺等级综合咨询"},{"时间":"2026-07-16 13:17:06","用户":"啊楼🍉","群":"","用户问询":"拆单后的取消单会计入信誉里吗","AI响应":"你好！由卖家发起的订单取消会计入订单取消率，这会直接影响你的店铺信誉等级。如果取消订单太多导致信誉变差，可能面临降权或封店风险。建议慎重操作，尽量通过库存管理避免拆单取消。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"店铺等级综合咨询"},{"时间":"2026-07-16 09:20:50","用户":"啊邝","群":"","用户问询":"怎么加入起飞计划","AI响应":"你好！很高兴为你解答。\n\n加入起飞计划通常有以下几种方式：\n\n1. 经理邀请制：起飞计划主要针对通过招商经理入驻的优质卖家。如果您的店铺表现良好或符合特定类目的招商需求，招商经理会主动联系您并邀请加入。\n\n2. 满足入驻条件：如果您是托管模式（全托管/半托管）或FTI工贸一体模式的卖家，在入驻成功后，通常会自动进入官方的扶持体系，享受类似起飞计划的流量和运营支持。\n\n3. 积极参与官方活动：建议您关注美客多官方公众号或卖家后台的通知，积极参与平台组织的线上招商会或线下沙龙，这些场合往往有加入扶持计划的申请入口。\n\n4. 保持良好表现：新店铺上线后，请务必保证产品质量、物流时效和回复率。表现优异的店铺更容易被系统捕捉并获得经理的关注，从而获得加入起飞计划的机会。\n\n如果您目前已有对接的招商经理，建议直接向经理咨询您当前的店铺状态是否符合加入起飞计划的要求。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"店铺等级综合咨询"},{"时间":"2026-07-16 09:18:26","用户":"啊邝","群":"","用户问询":"起飞计划是什么","AI响应":"起飞计划是美客多官方针对新卖家推出的扶持项目，旨在帮助新入驻的卖家快速度过起步期，提升店铺权重和销量。\n\n该计划通常包含以下核心权益：\n1. 专属流量扶持：新店铺和新产品会获得额外的曝光机会，帮助产品快速出单。\n2. 官方经理指导：会有专门的客户经理对接，提供选品建议、运营指导以及广告投放优化建议。\n3. 促销活动优先权：有机会优先参与平台的各类大促活动和秒杀活动。\n4. 绿色审核通道：在入驻审核、KYC审核等环节享受更快的处理速度。\n\n如果您是新入驻的卖家，建议积极配合客户经理的要求，完成起飞计划中的各项任务，以便最大化利用平台资源。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"店铺等级综合咨询"},{"时间":"2026-07-13 14:27:04","用户":"爱喝咖啡的懒人","群":"","用户问询":"这单不对信誉有损失，所以并不用太理会信誉问题，现在转入被白嫖的可能性","AI响应":"你好！很高兴为你解答。\n\n既然你已经明确了保住信誉不是首要目标，而是想**防止被白嫖**，那么目前的局势确实比较被动。在没有本地退货地址的情况下，要拿回这 17.31 美金或商品，建议按以下逻辑操作：\n\n1. **利用“部分退款”进行博弈**：\n既然点击 **Choose refund option** 出现了百分比选项，你可以尝试给出一个较低的退款比例（例如 10%-20%），并在留言中告诉买家：“由于跨境退货流程极其复杂且耗时，为了补偿你的心理落差，我愿意直接补偿你一部分金额，你可以留下这个音箱送人或备用。”\n- **目的**：如果买家贪小便宜接受了，纠纷会立即关闭，你保住了大部分货款。\n\n2. **坚持要求平台介入（Contact Mercado Libre）**：\n在联系平台时，不要说你没有本地地址，而是强调：**“我坚持要求买家退货，我才能退款。”**\n- **博弈点**：有时候平台客服会因为买家无法提供有效的质量问题证据，或者觉得买家只是主观嫌小，而拒绝买家的全额退款要求。\n- **风险**：如果平台强制要求你提供退货地址而你提供不出，平台最终还是会判全额退款给买家。\n\n3. **拖延战术**：\n买家的回复截止日期是 **7月17日**。你可以继续在聊天框里和买家“磨”，比如询问他是否愿意接受更高额度的部分退款补偿。只要买家在截止日期前没有达成一致，或者他没有主动找平台，这笔钱就暂时还在平台手里。\n\n**残酷的现实提醒：**\n在美客多跨境业务中，如果没有本地退货地址，一旦买家坚持退货退款且平台介入，**“被白嫖”的概率极高**。因为平台政策是保护消费者的，卖家无法提供退货方案时，平台通常会直接退款给买家并让其保留商品。\n\n**总结建议：**\n先发一个 **20% 的部分退款申请** 试探买家。如果买家拒绝并坚持全额退款，而你又没有地址，这单大概率只能认损。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"店铺等级综合咨询"},{"时间":"2026-07-18 16:37:30","用户":"@pp","群":"","用户问询":"已经完成了 完成10单履约以获得绿色信誉","AI响应":"收到。恭喜您获得绿色信誉，这有助于提升店铺权重。接下来建议您通过Clips短视频工具增加产品曝光，并积极报名参加平台大促活动，进一步提升销量。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"店铺等级综合咨询"},{"时间":"2026-07-13 11:14:55","用户":"爱喝咖啡的懒人","群":"","用户问询":"这样会影响信誉不","AI响应":"你好！很高兴为你解答。\n\n根据你提供的图片显示，该投诉下方标注了“Reputation affected”（信誉受影响）。这意味着只要投诉处于开启状态，你的店铺信誉就已经受到了暂时性的负面影响。\n\n但是，请不要过度担心，后续的操作决定了影响是否会消除：\n\n1. 如果你申请平台介入且最终胜诉（例如平台判定买家必须退货但买家未退，或者判定买家无理取闹并关闭投诉），那么该投诉对信誉的影响通常会被移除，信誉会恢复。\n\n2. 如果你能在48小时内处理投诉并给出买家满意的解决方案，确保投诉被关闭，也能最大程度维护店铺健康度。\n\n3. 如果你被动等待或处理不当导致平台强制退款给买家，那么该笔投诉产生的负面信誉记录将会被保留，从而影响你的自然流量权重和订单转化率。\n\n目前最稳妥的做法依然是立即点击“Contact Mercado Libre”申请介入，通过官方渠道证明你已尽责，争取撤销该投诉对信誉的影响。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"店铺等级综合咨询"},{"时间":"2026-07-19 10:17:18","用户":"2号线","群":"","用户问询":"我是跨行初次做美客多墨西哥站的电商卖家，跨境店做半托管官方墨西哥FULL海外仓，关于我想深入知道美客多售卖柯达储存卡等小件电子产品，从开店到上架标题详情页广告客服等整个环节，从上架第一个产品到后续其他产品，从时间和专业运营考虑需要怎么规划设计才能让每一个产品链接得到自然流的最大流量扶持，哪些情况下才能需要考虑打广告和参加活动，怎么样得到店铺做平台最快的流量和持续流量，得到最好信誉指数 我喜欢高效率沟通，结合以上我需求请帮我做一个系统深入的执行可落地且生效的方案","AI响应":"你好！很高兴能为你提供一份系统且可落地的运营方案。针对柯达存储卡这类高频、标品且竞争激烈的电子产品，建议按以下四个阶段执行：\n\n**第一阶段：极速启动与信誉建立（第1-2周）**\n1. **快速拿绿标**：新店最核心的任务是完成前10单履约。建议首批产品上架后，通过适度降价（比竞品低5%-10%）或站外引流，迅速完成10个订单，拿到绿色信誉，这是开启所有流量通道的“入场券”。\n2. **Listing精细化**：\n   - **标题**：品牌+产品名+核心参数（如：Kodak Micro SD 128GB Class 10）。\n   - **图片**：必须包含3张以上高清图，展示包装、防伪标识及使用场景。\n   - **属性**：填满所有技术参数，这直接影响搜索权重。\n\n**第二阶段：利用官方工具撬动自然流（第3-4周）**\n1. **Clips短视频**：这是目前最高效的免费流量入口。为存储卡拍摄15-60秒的实拍视频（展示读写速度、兼容设备），能提升25%-30%的销量。\n2. **半托管/FULL入仓**：确保产品带有“Full”标识。墨西哥买家极度依赖物流时效，Full标自带流量权重和转化加持。\n\n**第三阶段：广告与活动组合拳（第2个月起）**\n1. **开启广告（Product Ads）**：\n   - **触发条件**：Listing有基础销量（评价）且信誉为绿。\n   - **策略**：新品期设置较高的目标ACOS，与有销售记录的商品抢夺曝光。\n2. **参加平台活动**：美客多的Hot Sale、Buen Fin等活动是免费参加的。只要系统提示可提报，务必参加，这是获取爆发式流量的最快路径。\n\n**第四阶段：持续增长与信誉维护**\n1. **降价反应期**：注意系统对降价的反应有4天左右的周期，不要频繁调价，给算法留出学习时间。\n2. **售后管理**：存储卡易出现兼容性投诉，务必在详情页写清兼容设备，并及时回复买家消息，避免因投诉导致信誉降级。\n\n**核心总结：**\n- **最快流量**：降价出单拿绿标 + Clips短视频。\n- **持续流量**：保持Full仓库存充足 + 持续参加平台促销。\n- **最好信誉**：严控产品质量，确保100%准时发货，积极处理售后。\n\n建议你先从精选10-20款核心SKU开始，精细化运营每一个Listing，而非盲目铺货。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"入驻/注册/开店流程"},{"时间":"2026-07-15 13:16:42","用户":"j、","群":"","用户问询":"Pending label Generating the label is taking longer than it should. Do not worry, this delay will not affect your reputation. We are working to solve it.订单里这样提示为什么一直无法生成标签","AI响应":"你好！很高兴为你解答。建议按以下方式排查：\n1. 检查 Selling Preferences > Dispatch Methods 是否正确选择了菜鸟物流。\n2. 确认发货和取件地址准确完整，且在菜鸟揽收范围内。\n3. 检查 Listing 是否为 Active 状态。\n若排查无误仍无法生成，请联系官方客服或经理处理。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-15 11:22:00","用户":"萤火虫","群":"","用户问询":"我美客多11号出了一单订单 我13号打印好面单自行用中通快递送到了就近的菜鸟仓，我看物流轨迹14号已经送到了仓库地址，但是现在还没有显示已发货，快到截止日期16号了怎么办？然后我出单之后把配送方式选择了上门取件，客服说刚填完要几天才能更新，但是刚刚又给我联系了要上门，我要重复发货吗，为了不超过我的截止日期，影响我的信誉","AI响应":"你好！针对你的情况，请按以下步骤处理，**千万不要重复发货**：\n\n1. **无需重复发货**：你已经通过中通寄出的包裹只要送达了菜鸟仓，仓库就会进行扫描。重复发货会导致订单异常或产生额外费用。\n\n2. **联系客服催促扫描**：如果包裹送达仓库超过 12-24 小时仍未更新“已揽收/上网”状态，请立即联系美客多官方客服，提供你的**交易订单号**和**中通快递单号**。客服会帮你联系菜鸟核实并催促扫描。\n\n3. **关于上门取件**：既然你已经自行寄出，当取件员联系你时，直接告知该订单已自行寄往仓库即可。\n\n4. **时效宽限**：自发货有 24 小时的宽限期用于催促扫描。只要你在 16 号截止前联系客服备案并完成扫描，就不会影响你的店铺声誉。\n\n**建议：** 以后建议在出单后 24 小时内打印面单并尽快发出，为仓库扫描留出充足时间。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 17:03:58","用户":"j、","群":"","用户问询":"我们分析了您关于销售编号2000013937527053的情况，并检测到该交易存在异常。 请您不要通过邮寄方式发货，并请从订单详情页取消该笔销售。这样，我们会将款项退还给买家。 请注意，正如卖家必须符合某些文件要求一样，买家也必须如此，且可能缺少某些信息；然而，由于我们不是负责审核买家文件的团队，因此无法确切获知检测到了哪种异常。 4:51 PM 如果你已经发货，可以从销售详情中告知我们。我们将作废该面单，你将在 下次付款报告 中收到这笔款项。此外，请放心，此操作不会影响你的卖家信誉。 对于给你带来的不便，我们深表歉意。我们正持续努力以确保网站的安全。什么意思","AI响应":"你好！很高兴为你解答。\n\n这段话的意思是平台检测到该订单存在安全风险或买家账号异常。\n\n1. **若未发货**：请务必在订单详情页取消销售，系统会自动退款给买家，此操作不影响你的信誉。\n2. **若已发货**：请在销售详情中告知平台，官方会作废面单并补偿你该笔货款。\n\n这是平台的风险保护机制，旨在确保交易安全，请按指引操作即可。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 15:42:39","用户":"Mr.Wen","群":"","用户问询":"这种显示不影响声誉的投诉，但是详情页中有退款按钮的，我需要全额退款来解决投诉最后避免影响声誉吗？还是说我不退款也能不影响声誉","AI响应":"从图片看，该投诉已被系统标记为“不影响您的信誉”（Did not affect your reputation），原因是买家选择了“产品比预期大”。\n\n即便不全额退款，只要您在截止日期前回复并妥善处理，就不会影响声誉。但请注意：\n\n1. 必须在期限内回复：若未在规定时间内响应，平台介入后可能会改变判定，进而影响声誉。\n2. 协商解决：您可以先与买家沟通，尝试部分退款或引导退货退款。\n3. 平台原则：平台不强制“只退款不退货”，您可以根据实际情况选择合适的处理方式。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-19 10:44:48","用户":"2号线","群":"","用户问询":"关于第一步完成前10单得到绿色信誉，只有3-4个产品链接的话每个库存多少，怎么在合适的时间阶段完成这10单","AI响应":"你好！很高兴为你解答。针对你只有3-4个链接的情况，建议按以下方案执行：\n\n**1. 库存准备：**\n每个SKU建议备货 **20-30件**。虽然拿到绿标只需10单，但考虑到算法测款需要一定的动销深度，且要防止出单太快导致断货（断货会严重伤权重），这个库存量能保证你在拿到绿标后有充足的缓冲期进行补货。\n\n**2. 时间阶段规划：**\n*   **第1-3天（上架即冲刺）：** 采用“极致低价”策略。将价格设为类目最低，甚至平价出货。存储卡是标品，买家对价格极度敏感，低价是触发算法首单的最快方式。\n*   **第4-7天（流量爆发期）：** 配合 **Clips短视频**。每天为这几个链接各发一条实拍视频。算法对新链接有扶持，低价+视频能吸引大量精准自然流，通常在这一周内就能完成10单。\n\n**3. 执行细节：**\n*   **不要分散火力：** 集中力量推其中1-2个最有价格优势的链接，只要店铺总单数满10单且履约良好，全店都会变绿。\n*   **监控进度：** 一旦满10单，系统评定信誉通常有1-2天延迟，变绿后立即恢复正常利润价并开启广告。\n\n这种方式能确保你在最短时间内激活算法，拿到流量入场券。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-18 10:24:59","用户":"一花一草","群":"","用户问询":"为什么售后订单刚开始显示解决后不影响信誉，之后又换成了影响信誉了","AI响应":"你好！很高兴为你解答。这种情况通常是因为您未能在48小时内给出让买家满意的解决方案，导致投诉未能在规定时间内成功关闭。一旦超过处理时效或买家未确认解决，系统会自动判定该投诉影响店铺信誉。建议您定期核查后台指标波动，确保及时响应。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-16 11:03:37","用户":"纯属巧合","群":"","用户问询":"我有一个售后的投诉，明天就到期了， 但是客户一直还没回复我， 应该要怎么办","AI响应":"你好！很高兴为你解答。\n\n从你提供的图片来看，该投诉的状态显示为“买家取消了购买”，且右上角明确标注“不影响您的信誉”。\n\n针对这种情况，处理建议如下：\n\n1. 保持现状等待：既然目前显示不影响信誉，且你已经发送了询问消息（Are you satisfied with this solution?），你可以继续等待买家回复。如果到期前买家仍未操作，平台通常会根据当前状态自动结案。\n\n2. 申请平台介入：如果明天即将到期你担心状态变化，可以点击“查看投诉”进入详情页，寻找“Need help”或“Request Mercado Libre mediation”按钮，请求平台客服介入处理。说明你已经提供了解决方案但买家未回复，请求平台协助关闭投诉。\n\n3. 避免直接退款：除非你确定要通过退款来快速了结，否则不要轻易点击“退款关闭投诉”，因为这笔订单金额虽然不大，但主动退款通常意味着接受投诉。\n\n4. 检查信誉表现：只要右上角一直显示“不影响您的信誉”，你就不用过于担心。\n\n建议你明天到期前再次关注该投诉的状态变化，若平台未自动处理，请务必联系官方客服。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"广告/关键词投放"},{"时间":"2026-07-13 12:12:05","用户":"爱喝咖啡的懒人","群":"","用户问询":"确实我的产品问题，下面有退货选择，我可不可以用退货来解决信誉问题","AI响应":"你好！很高兴为你解答。\n\n如果确实是产品质量问题，点击 **“Offer return”**（提供退货）是比直接退款更好的选择，但关于信誉问题，你需要了解以下逻辑：\n\n1. **信誉能否恢复**：在美客多，一旦投诉开启且标注了影响信誉，单纯的“退货退款”操作通常**无法自动消除**已经产生的信誉扣分。系统会认为这确实是一次因为产品问题导致的负面交易体验。\n\n2. **为什么仍建议选“Offer return”而不是直接退款**：\n- **防止白嫖**：选退货意味着买家必须把坏掉的产品寄回，你才退钱。这能过滤掉一部分虚假投诉的买家。\n- **合规性**：这是平台标准的纠纷处理流程，展示了你积极解决问题的态度。\n- **二次核实**：有时候买家嫌退货麻烦，可能就不退了，如果买家在规定时间内没寄出，纠纷会自动关闭，你的信誉和钱就都保住了。\n\n3. **如何最大程度挽回信誉**：\n如果你选择了“Offer return”，买家也退货了，在退款结案后，你可以尝试联系卖家支持（Seller Support），说明你已经积极配合买家完成了退货退款流程，申请人工审核是否能移除该笔纠纷对信誉的影响。虽然不是百分之百成功，但这是唯一的补救途径。\n\n**总结建议：**\n既然是产品问题，请点击 **“Offer return”**。这样至少能保证“货回钱才走”，如果买家最终没退货，你反而能保住信誉和货款。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-13 09:24:55","用户":"周文静","群":"","用户问询":"这个订单是7月11日的订单，7月16日之前到平台仓库就行，对吗？","AI响应":"你好！很高兴为你解答。\n\n是的，根据图片显示，你需要在7月16日之前确保包裹送达物流承运商的集运仓并完成收件扫描（A-scan）。\n\n收到订单后，您需要在3个工作日内完成打印面单、打包并发送至集运仓的操作。只有当物流承运商收到货物并做收件扫描后，系统自动回传Tracking ID，货件状态从“Ready to ship”变成“In transit”，才算处理时效截止。\n\n请务必在规定时间内完成，否则买家有权开启纠纷或取消订单，这也会影响您的店铺信誉。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 09:48:32","用户":"爱喝咖啡的懒人","群":"","用户问询":"客户能以这种理由退货吗？这个理由应该不属于无法使用吧？","AI响应":"你好！很高兴为你解答。\n\n根据图片显示，买家投诉的理由是“产品无法使用”，但在聊天中提到的具体原因是“大部分游戏是英文的”。\n\n**1. 理由是否成立：**\n在美客多平台，买家拥有“无理由退货”的权利（通常为收到货后的7天或30天内，视具体政策而定）。虽然“游戏是英文”不属于硬件故障，但如果买家认为这导致产品不符合其使用预期，平台通常会支持其退货退款要求。\n\n**2. 应对建议：**\n*   **不要强硬拒绝**：买家已经拒绝了你10%的折扣提议，说明其退货意愿强烈。强行争辩理由是否充分，容易导致平台介入并判定你败诉。\n*   **尝试引导设置**：你可以询问买家是否可以通过系统设置将语言更改为葡语，或者指导其下载葡语版游戏。\n*   **及时处理**：由于该投诉已影响信誉（Reputation affected），且处理截止日期是 **7月22日**，如果无法通过沟通让买家撤销投诉，建议在截止前同意退货退款，以避免更严重的信誉扣分。\n\n网页参考资料：https://global-selling.mercadolibre.com/help/21258","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-18 23:31:21","用户":"观云","群":"","用户问询":"为何对方价格比我高这么多，缺获胜","AI响应":"价格并非获胜的唯一因素。对方虽然价格高，但其净收益和预估进口税费显示其销售条件可能更优。获胜还取决于配送时效（如是否使用Full仓）、店铺信誉、Listing质量得分及购物体验分。建议您优化产品规格表和图片，提升服务指标以增强竞争力。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-16 17:31:16","用户":"Elvis  Cheung","群":"","用户问询":"full仓的信誉跟其他站点的信誉有交叉影响吗","AI响应":"你好！美客多各站点的店铺信誉是独立核算的，互不影响。例如，墨西哥站点的信誉等级不会影响巴西或智利站点的信誉。但请注意，同一站点内，自发货和Full仓的订单表现会共同影响该站点的整体店铺信誉。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 10:31:06","用户":"骑着毛驴去拉萨","群":"","用户问询":"这个一定要创建活动吗","AI响应":"你好！不是必须创建。如果你已经有正在运行的活动，可以继续使用。但如果你想推广新商品或尝试不同的竞价策略，就需要点击“创建活动”。绿色信誉是参与广告投放的必备条件。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-15 09:14:02","用户":"迷迷 苏","群":"","用户问询":"这是处理完结了吗","AI响应":"你好！很高兴为你解答。\n\n从图片显示的状态来看，该投诉尚未完全完结。\n\n虽然右上角显示“不影响您的信誉”，且买家已取消购买，但中间提示“待处理投诉截止星期四 16 七月”，并明确告知您可以等待买家回复，或直接退款关闭投诉。\n\n成功关闭的投诉不会影响店铺信誉。您需要在48小时内处理投诉并给出买家满意的解决方案，确保投诉被关闭。购物体验分与店铺信誉体系直接关联您的自然流量权重及订单转化率。请定期核查后台指标波动，依据系统诊断建议优化运营动作，持续维护店铺与商品健康度，确保您在美客多长期稳定的销售。\n\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260125/7100679de6bf419b896e8dca4f3afad4.png","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"广告/关键词投放"},{"时间":"2026-07-13 14:13:10","用户":"吕工","群":"","用户问询":"这种也没有标注品牌啥的","AI响应":"卖家您好，根据您提供的图片，这个店铺其实已经包含了非常明显的品牌和企业实力标注：\n\n1. **蓝标标识**：在店铺名称“Distrinox EPI”下方，有一行字“Loja oficial do Mercado Livre”，后面跟着一个**蓝色勾选图标**。这就是您之前提到的“蓝标”，代表该店铺是美客多官方认证的品牌旗舰店（Official Store）。\n\n2. **大商认证等级**：图片中显示了 **MercadoLíder Platinum**（铂金大商）。这是美客多大商认证中的最高等级。要达到这个等级，卖家需要满足极高的成交订单量（如近60天成交≥415单）和成交金额要求，且各项绩效指标（如投诉率、纠纷率、迟发率）必须保持在极优水平。\n\n3. **信誉温度计**：下方的横条显示为**深绿色**，代表该卖家的服务质量非常可靠。\n\n4. **经营数据**：图片显示该店铺拥有超过10万粉丝（Seguidores），销售量超过25万单（Vendas），这些都是企业实力的直接体现。\n\n总结来说，您图片中的这个店铺就是典型的“品牌大商”账号。普通跨境卖家下店后，需要通过持续的优异运营来积累订单，从而获得 MercadoLíder 认证；而想要获得那个“蓝色勾选图标”，则需要拥有自有品牌R标或完整授权，并向平台申请品牌大商认证。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"入驻/注册/开店流程"},{"时间":"2026-07-18 12:07:07","用户":"爱喝咖啡的懒人","群":"","用户问询":"这么回复如何","AI响应":"你好！很高兴为你解答。\n\n图片中的回复话术非常专业且合规。建议优先使用**精简版**，因为它表达直接且礼貌，能有效引导买家反馈结果。\n\n**精简版（西语）：**\n\"Hola, después de probar el timbre, contáme si la pantalla ya funciona bien, por favor.\"\n\n**为什么要这么回复：**\n1. **主动确认**：能促使买家在测试后尽快给你答复。\n2. **闭环工单**：只有买家确认没问题并撤销投诉，你的信誉分才不会受损。\n3. **截止日期**：请务必在 **7月23日** 前得到买家的明确回复，否则请及时联系客服介入。\n\n网页参考资料：https://global-selling.mercadolibre.com/help/21258","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-17 11:35:50","用户":"爱喝咖啡的懒人","群":"","用户问询":"这种后续如何办","AI响应":"你好！很高兴为你解答。\n\n从最新的聊天记录看，买家已经回复了“Okay. Thank you.”和“Ok. Obrigado.”，这表明买家目前接受了你的技术指导（充电及重置建议），纠纷处理有了积极进展。\n\n**后续操作建议：**\n\n1. **观察并引导撤销**：既然买家表达了感谢，你可以顺势礼貌地询问产品现在是否已恢复正常工作。如果正常了，请引导买家关闭该纠纷（Complaint）。只有买家主动关闭，你的信誉分（Reputation）才不会受到持续影响。\n   \n   **建议话术（葡语）：**\n   \"Fico feliz em ajudar! O tablet já está funcionando normalmente? Se sim, você poderia, por favor, encerrar a reclamação? Isso nos ajuda muito. Qualquer outra dúvida, estou à disposição.\"\n   （很高兴能帮到您！平板电脑现在运行正常了吗？如果正常了，能否请您关闭投诉？这对我们很有帮助。有任何其他问题，我随时为您服务。）\n\n2. **关注截止日期**：虽然买家口头表示感谢，但如果他没有主动关闭纠纷，该工单依然会在 **7月22日（周三）** 到期。\n\n3. **不要主动点退款**：在买家确认产品可以使用期间，**千万不要**点击“Refund money”，否则钱会自动退回且无法撤回。\n\n4. **最坏打算**：如果到22号买家仍未关闭纠纷且不再回复，为了防止平台介入扣除更多信誉分，你可能仍需在到期前联系官方客服（Contact Mercado Libre）报备买家已表示感谢但未关单的情况。\n\n网页参考资料：https://global-selling.mercadolibre.com/help/21258","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"广告/关键词投放"},{"时间":"2026-07-16 15:18:31","用户":"XIAOMEI","群":"","用户问询":"是这样子的？","AI响应":"是的，就是这个界面。\n\n请在“订单编号”处填写受影响的订单号，在“描述”框中用英文详细说明问题（例如：大量订单被平台自动取消，且显示不影响信誉，请求核查原因）。\n\n填写完毕后点击“继续”，后续可以上传截图证明。提交后，请留意您的注册邮箱或后台的 Case 进展。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"入驻/注册/开店流程"},{"时间":"2026-07-15 18:07:17","用户":"骑着毛驴去拉萨","群":"","用户问询":"共享是什么意思","AI响应":"你好！“共享中”意味着你的商品目前正在和其他卖家竞争同一个展示位（黄金购物车 Buy Box）。\n\n简单来说，因为你提供的价格、物流时效或店铺信誉等条件与其他卖家非常接近，系统无法判定谁更优，所以让你们轮流获得展示机会。\n\n如果想结束共享状态并独占流量，建议点击“改善条件”，通过降低价格、缩短配送时间或提升服务质量来获得竞争优势。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-18 10:26:44","用户":"一花一草","群":"","用户问询":"那给客户退款后，这个信誉会不会撤销","AI响应":"你好！退款并不会自动撤销已产生的信誉影响。如果您在48小时内通过退款解决了投诉并关闭了纠纷，则不会计入负面指标；若已超过48小时或投诉已判定影响信誉，即使退款，该记录通常也会保留。建议通过增加优质订单量来稀释影响。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-18 11:59:47","用户":"爱喝咖啡的懒人","群":"","用户问询":"为何翻译的意思跟你不一样","AI响应":"你好！很高兴为你解答。\n\n非常抱歉，之前的理解确实存在偏差。根据你提供的图片分析，买家的原话是 **\"Perfecto pruebo y cualquier cosa le escribo\"**。\n\n在阿根廷西语语境下，这里的 **\"pruebo\"** 是动词原形或第一人称现在时，结合上下文，买家的意思确实是：**“太好了，我测试一下，有任何情况我再联系你。”** \n\n**为什么翻译会有差异：**\n*   **\"Perfecto\"** 是对你提供方案的认可。\n*   **\"pruebo\"** 表达的是“去尝试/去测试”的动作，而不是“测试完了”的结果。\n\n**核心风险提示：**\n即便买家态度缓和，**纠纷依然处于“Reputation affected”（影响信誉）状态**。如果买家测试后没再回复，或者忘记撤销投诉，到7月23日截止时，系统仍可能判定你未解决问题。\n\n**建议操作：**\n请使用图片中推荐的**精简短句版**回复买家，主动确认测试结果。如果买家确认没问题了，请礼貌地引导他关闭投诉，这样信誉影响才会真正消除。\n\n网页参考资料：https://global-selling.mercadolibre.com/help/21258","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-17 17:03:58","用户":"准备去","群":"","用户问询":"现在出单了，要发快递啊","AI响应":"你好！恭喜出单。自发货订单处理流程如下：\n\n1. 点击图中的“打印标签”，获取首公里物流面单。\n2. 按照要求包装商品，并将面单贴在包裹外。\n3. 在3个工作日内将包裹发送至菜鸟集运仓（可选择上门揽收或自行寄送）。\n4. 仓库扫描上网（A-scan）后，订单状态会自动更新。\n\n请务必在规定时间内完成，以免影响店铺信誉。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 22:55:02","用户":"骑着毛驴去拉萨","群":"","用户问询":"今天刚才出了一单，还是2","AI响应":"你好！图片显示你目前的投诉率为2.08%，已经超过了2%的阈值，这会影响你的信誉颜色。\n\n这里的“2 零投诉”是指：为了让信誉恢复到浅绿色，你需要在接下来的新订单中，保持连续 **2单零投诉**。只要后续两单没有投诉，你的指标就会达标。请务必服务好接下来的客户。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-15 12:56:41","用户":"纳洛童","群":"","用户问询":"这个退款是退多少前","AI响应":"你好！很高兴为你解答。\n\n根据你提供的图片显示，你即将退款的金额为 **1,037.76 美金**。\n\n点击“Confirm refund”后，该笔纠纷将关闭且不会影响你的店铺信誉（Reputation），但买家将收到这笔全额退款。请在确认金额无误后再操作。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"广告/关键词投放"},{"时间":"2026-07-15 10:54:28","用户":"伊恩","群":"","用户问询":"这种是不是仓库在拣货中","AI响应":"是的，图片显示的“仓库处理中”状态意味着仓库正在进行拣货、打包或准备发货的操作。\n\n由于系统提示“生成标签的时间比预期要长”，这说明目前存在一定的系统延迟或处理积压。不过请放心，界面明确标注了此延迟不会影响你的店铺信誉，你只需耐心等待仓库完成处理即可。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 21:26:17","用户":"cyc","群":"","用户问询":"[{\"type\":\"image\",\"content\":\"https://file.marsmind.cc/link-mind/wecom_wkteam/1688857857859744/20260717/ad3d8b8fefd949ec9c2f01f255135117.jpg\"}]","AI响应":"你好！很高兴为你解答。从图片看，系统提示已超出最大容量，最多仅能发送14件。目前库容由店铺信誉和动销动态决定，建议优先提升订单履约率，随着信誉等级提升，系统会自动扩充额度。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 12:35:20","用户":"D~","群":"","用户问询":"这样就行了撒","AI响应":"你好！很高兴为你解答。\n\n是的，后台操作到这一步就可以了。\n\n图片显示“标签已打印”，说明你已经成功下载了物流面单。接下来的线下流程是：\n1. 打印面单：使用10*15cm热敏纸打印出来。\n2. 打包贴单：把面单贴在包裹上。\n3. 寄送仓库：因为你选的是货代自寄，现在你需要联系国内快递，把这个包裹寄往菜鸟的自寄仓库。\n\n只要菜鸟仓库收到货并扫描了你贴的这张面单，后台状态就会自动更新，不需要你再做其他点击操作了。请务必在7月22日之前让仓库完成扫描上网，以免影响店铺信誉。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 16:41:34","用户":"A💓vivi💓👠","群":"","用户问询":"这个要多久发货","AI响应":"从您提供的图片来看，这是一个发往阿根廷的FULL海外仓订单。目前订单状态显示为“我们正在审核您的买家是否符合国际购买要求”。\n\n在这种情况下，平台正在对买家的购买资格进行审核。一旦审核通过，平台将自动开始处理发货流程。由于这是由平台海外仓负责配送的订单，您不需要手动操作发货。通常审核过程不会影响您的店铺信誉，请您耐心等待系统更新状态即可。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-15 09:18:10","用户":"迷迷 苏","群":"","用户问询":"[{\"type\":\"image\",\"content\":\"https://file.marsmind.cc/link-mind/wecom_wkteam/1688857580807235/20260715/dd187e0ac40342d5b153bb3bec2706d3.png\"}]","AI响应":"你好！很高兴为你解答。\n\n从你提供的聊天截图来看，你已经向买家解释了退款方案（退款10%且无需退回商品），目前的状态正是“等待买家回复”。\n\n图片中明确显示：Your buyer has until Thursday, July 16 to respond（您的买家在7月16日星期四之前可以做出回复）。\n\n接下来的操作建议如下：\n1. 无需重复发送信息：你已经清晰表达了方案，现在主动权在买家手中。如果买家同意，他可以接受该方案并关闭投诉。\n2. 关注截止日期：如果到了7月16日买家仍未回复，系统通常会根据情况介入或自动处理。\n3. 避免信誉受损：只要你在48小时内回复了买家，就不会因为响应不及时而影响信誉。\n\n目前你只需要静候买家的确认即可。如果买家拒绝并要求全额退款，你再根据实际情况决定是否接受。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-14 09:16:16","用户":"幸运🍀","群":"","用户问询":"[{\"type\":\"image\",\"content\":\"https://file.marsmind.cc/link-mind/wecom_wkteam/1688855998763142/20260714/d3efd137f47b4c32b28da947614624db.png\"}]","AI响应":"你好！很高兴为你解答。这是后台的非工作日设置界面，您可以勾选不发货的日期。设置后，这些日期下单的订单将延长送达承诺时间，从而保护您的处理时间和店铺信誉。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"物流发货/面单/包装"}]},{"一级大类":"营销活动","二级子类":"促销活动","Past 7 Days":41,"Previous 2026-07-06 to 2026-07-12":104,"Change":-63,"WoW":-0.6057692307692307,"Past 7 Share":0.005951516911017564,"高频问题":"促销/折扣/优惠券/活动","__details":[{"时间":"2026-07-18 14:32:50","用户":"TMR商学院运营-萍萍","群":"","用户问询":"你好，我出单后商品列表的挂牌价和净收益，和我实际结余的净收益不一致，会是什么原因导致的，没有参与促销活动","AI响应":"您好，很高兴为您解答。\n\n在没有参与促销的情况下，实际结余净收益与设定不一致，通常由以下原因导致：\n\n1. **物流尺寸校准**：最终到账金额可能因物流实测的尺寸或重量与您填写的数值有偏差，导致运费调整，从而产生微小波动。\n2. **汇率转换**：系统在结算时会考虑站点当地货币与美金之间的汇率转换因素。\n3. **税费因素**：系统计算时会包含相关的税费扣除。\n\n建议您登录卖家后台，在管理库存页面查看各项费用明细，或使用官方利润计算器进行精准测算：https://global-selling.mercadolibre.com/listings/cost-calculator","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-15 21:56:55","用户":"奋斗的小鸟","群":"","用户问询":"经理，参加美客多的活动，这个地方不能设个一建打折的功能吗？一个个修改折扣，好慢呀","AI响应":"你好！很高兴为你解答。目前平台促销活动确实需要针对列表逐个设置折扣。如果列表已暂停，你可以先将其移出活动，待重新激活后再参与。","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-18 11:11:02","用户":"圣斗土","群":"","用户问询":"美客多半托管一个站点设置了一个促销活动，其它站点要重新设置活动吗","AI响应":"你好！是的，美客多各站点是独立运营的。如果您在半托管模式下为一个站点设置了促销活动，其他站点需要分别进入对应的后台页面重新进行设置。","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-14 12:32:41","用户":"j、","群":"","用户问询":"如果我更改了促销折扣的百分比，那折后的金额要手动改吗，还是上传后会自动改","AI响应":"你好！很高兴为你解答。上传完成后，系统会根据你填写的折扣百分比自动计算并更新折后金额，不需要你手动修改。","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-14 17:58:40","用户":"🏀HQQ_Clara","群":"","用户问询":"请问我要如何在后台设置折扣，没有找到促销按钮","AI响应":"你好！很高兴为你解答。\n\n在卖家后台，你可以通过以下路径找到促销设置：\n\n1. 进入卖家后台，在左侧菜单栏找到并点击 Advertising 选项。\n2. 在展开的子菜单中选择 Promotions，即可进入促销管理页面。\n3. 在该页面，你可以看到所有自主创建的活动类型，点击 Quantity Discount 即可创建组合促销。\n\n如果你是 UP 模式下的商品，也可以直接在商品列表页面找到对应商品进行编辑，为不同变体独立定价。\n\n请注意，如果你的店铺信誉等级为红色，后台可能会限制促销功能的设置。另外，设置折扣时请务必关注折后价格是否低于站点的强制包邮门槛，因为包邮费用的承担方是以折后最终售价为准的。\n\n网页参考资料\n自主折扣活动创建：https://doc.weixin.qq.com/pdf/d3_ARIAagYiAMICNsqvs8LNZR8aLIkBY?scode=AI8A3wfvAAofJvi4mHARIAagYiAMI","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-13 14:38:20","用户":".","群":"","用户问询":"为什么系统总是自动修改我的促销折扣","AI响应":"你好！很高兴为你解答。系统通常不会自动修改折扣，请核查是否设置了自动定价工具或参与了平台大促。若促销重叠或设置了最低售价，系统可能会根据规则调整。建议在后台促销管理页面核查具体设置，或开Case联系客服确认是否存在系统异常。","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-16 15:04:06","用户":"左右","群":"","用户问询":"促销活动跟商机提报是两种么？","AI响应":"你好！很高兴为你解答。\n\n商机提报通常是平台针对特定品类或趋势发起的招商，旨在引导卖家补充高潜力商品；而促销活动（如每日交易、大促等）侧重于通过折扣换取流量。两者都能增加曝光，建议结合使用。","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-16 12:19:07","用户":"j、","群":"","用户问询":"怎么筛选没有报名折扣活动的商品","AI响应":"你好！很高兴为你解答。你可以进入卖家后台促销页面，点击“Offers to create”或“待创建活动”选项卡，这里列出的就是目前可以报名但尚未参加折扣活动的商品。","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-14 11:29:04","用户":"j、","群":"","用户问询":"折扣活动报名可以批量操作吗","AI响应":"你好！很高兴为你解答。折扣活动可以批量操作。你可以进入卖家后台的“促销”板块，选择“通过表格邀请”或类似的批量上传选项，下载Excel模板，填写好产品信息和折扣力度后重新上传即可。","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-15 09:01:06","用户":"黄天鹏","群":"","用户问询":"Why haven't I received a separate email from DocuSign (sent by ) yet? Could you please send a verification email on my behalf?","AI响应":"你好！平台会通过CSF登记邮箱发送相关邮件，请卖家按照邮件指引完成签署。目前现有信息未提及可以由他人代发验证邮件，请务必密切关注此前提交CSF文件时登记的邮箱。关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-14 14:36:18","用户":"啊楼🍉","群":"","用户问询":"1. [ERROR] [369] body.required fields items The variations[0]none of the following properties [id, attribute combinations] 什么原因","AI响应":"你好！这个报错通常出现在通过 API 或 ERP 上传/更新产品时，系统无法识别变体信息。\n\n主要原因有以下几点：\n1. 变体 ID 缺失：系统在更新现有变体时，找不到对应的 id 字段，导致无法匹配到具体的变体。\n2. 属性组合缺失：如果是新建变体，没有填写 attribute_combinations（变体属性组合，如颜色、尺码等），系统不知道这个变体靠什么属性来区分。\n3. 格式错误：变体信息的 JSON 结构不完整，导致系统读取不到 id 或属性组合。\n\n处理建议：\n1. 如果是修改现有产品，请确保在提交的变体数据中包含了该变体在平台生成的唯一 ID。\n2. 如果是上传新产品，请检查是否正确填写了变体的核心属性（如 Color, Size 等）。\n3. 建议在卖家后台手动尝试修改或重新通过官方 Excel 模板上传，这样更容易排查具体的字段缺失问题。","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-17 10:19:53","用户":"迷迷 苏","群":"","用户问询":"非常抱歉鞋子尺码偏小不合脚。希望不用退回商品，可以送人，我们可以针对这笔订单给您补贴订单金额的 10% 作为补偿，若您同意该方案，请告知我们，会立刻为您处理补贴。 有什么不合理的回复吗","AI响应":"你好！很高兴为你解答。\n\n你的回复逻辑是清晰的，但在美客多平台的实际操作中，有几个细节需要注意：\n\n1. 补偿方式的局限性：美客多后台并没有直接“部分退款”或“发放现金补贴”的功能。如果你想给买家 10% 的补偿，通常只能通过“退还部分订单金额”来实现，但这需要买家先发起投诉，然后你在投诉处理界面选择退还部分款项。\n\n2. 引导话术建议：如果买家已经开了投诉，你可以直接在投诉对话框里提出这个方案。但如果买家坚持要换货，10% 的补偿可能不足以打动他，因为鞋子不合脚是无法穿着的。\n\n3. 风险提示：如果买家接受了补偿但不退货，这笔订单就完成了。但如果买家之后反悔再次投诉，处理起来会比较麻烦。\n\n建议微调后的回复（更符合平台口吻）：\n非常抱歉鞋子尺码不合脚给您带来困扰。如果您愿意将鞋子留作送人而无需退回，我们愿意为您申请订单金额 10% 的补偿作为心意。若您接受此方案，请告知我们，我们将通过平台系统为您操作部分退款。若您坚持需要合适的尺码，建议您按平台流程申请退货退款后重新下单。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-19 18:23:04","用户":"大大大明","群":"","用户问询":"是的，我运输方式是免费 图片里商品折扣-4%是什么意思","AI响应":"你好！很高兴为你解答。\n\n商品价格折扣 -4% 表示该商品正在参加 Boost Your Sales 促销活动，系统在原价基础上自动减去了 4% 的金额（即优惠了 0.88 美金）。\n\n请注意，美客多平台的包邮门槛是以折扣后的最终售价为准的。如果折后价格低于 299 比索，系统可能会要求重新设置运费承担方。","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-18 10:51:58","用户":"圣斗土","群":"","用户问询":"在“促销”（Promotions）板块如何进行批量操作","AI响应":"你好！在后台“Promotions”页面，你可以点击“Offers to prepare”下方的“Download Excel”下载表格，批量填写折扣信息后，再通过“Upload Excel”上传即可完成批量操作。","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-16 17:14:51","用户":"B.","群":"","用户问询":"DoD、LD 、Rebates是什么活动，怎么参加，有什么要求","AI响应":"你好！很高兴为你解答。\n\n这三类是美客多平台核心的促销活动，具体说明如下：\n\n1. DoD (Deal of the Day - 今日特惠)\n- 定义：为期 24 小时的短期促销，拥有极高的流量入口。\n- 要求：通常要求折扣力度在 15% 以上，且产品近期销量稳定，评价良好。\n- 参加方式：在后台促销中心（Promotions）查看是否有系统邀请，符合条件的商品可直接勾选参加。\n\n2. LD (Lightning Deal - 秒杀活动)\n- 定义：限时限量的秒杀活动，通常持续 6 到 12 小时。\n- 要求：折扣力度大，且对库存数量有明确要求，必须是 Full 仓货物。\n- 参加方式：通过后台促销中心申请，系统会根据商品表现给出建议折扣和库存量。\n\n3. Rebates (平台补贴)\n- 定义：由平台出资进行的折扣补贴，卖家只需承担部分或不承担折扣成本。\n- 要求：通常针对特定大促期间（如 Hot Sale、Black Friday）表现优异的爆款商品。\n- 参加方式：由系统自动筛选并发送邀请，卖家在后台确认接受即可。\n\n通用参加要求：\n- 店铺信誉等级需为绿色。\n- 产品必须有足够的库存（建议使用 Full 仓）。\n- 价格必须具有竞争力，且在活动前一段时间内没有提价行为。\n\n网页参考资料：\nhttps://file.marsmind.cc/boot-admin/mercado/20260508/2052675802303561729.png","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-15 16:43:55","用户":"施夷光","群":"","用户问询":"因长期无销售或活动未激活的，有办法一键重新激活吗？","AI响应":"如果您暂停了列表并希望重新激活它，请在三个点菜单中选择“重新激活”。目前平台没有提供一键批量重新激活的功能，需要您手动对相应的列表进行操作。","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-14 12:49:18","用户":"j、","群":"","用户问询":"那我只修改折扣百分比可以吗 其他自动会自动计算相对应的价格吗","AI响应":"你好！很高兴为你解答。可以只修改折扣百分比，上传后系统会自动根据你填写的百分比计算出对应的折后价格。","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-17 17:18:57","用户":"David Xu","群":"","用户问询":"活动奖励形式是什么？什么时候发放？","AI响应":"本次活动的奖励统一为 Mercado Ads Bonus（广告返点）。奖励将在每期活动结束后的 5 个工作日内由系统自动发放至您的广告后台，返点有效期为 30 天。系统将优先消耗您的返点，后扣除账户余额。","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-17 11:18:20","用户":"悠","群":"","用户问询":"我已经设置了折扣，为什么还没有显示","AI响应":"你好！很高兴为你解答。根据图片显示，该商品目前处于“正在损失中”状态，提示其他卖家提供的条件更好。如果折扣未显示，请检查折扣是否已生效或是否满足该站点的最低折扣要求。此外，建议定期更新商品信息以保证准确性。","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-17 09:37:11","用户":"李章炼","群":"","用户问询":"美客多没有象其他平台那样的打折促销的功能吗","AI响应":"你好！很高兴为你解答。美客多有打折促销功能，系统会根据你的定价逻辑计算最终售价。若发现折扣显示与预期不符，通常受佣金基数变化、汇率波动取整或多种促销活动叠加影响。建议查看卖家后台订单明细中的费用拆解。","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-14 10:26:36","用户":"j、","群":"","用户问询":"所以这个促销后净利润是绝对准确不会变化的吗","AI响应":"最终到账金额即为设定的净收益，但可能因物流实测尺寸重量校准产生微小偏差。此外，若涉及墨西哥RFC税收政策，实际到账可能还会扣除相应税费。","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-19 15:04:06","用户":"价值2","群":"","用户问询":"美客多满额活动怎么参加","AI响应":"你好！美客多近期推出的“满包邮”活动旨在降低消费者决策门槛。你可以通过卖家后台的“促销（Promotions）”板块查看并参加相关活动。建议定期关注后台邀约或咨询您的客户经理获取具体参与资格。","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-18 11:13:36","用户":"几木晴天","群":"","用户问询":"那后续需要打折促销什么的吗","AI响应":"你可以根据运营需求参加平台活动或设置折扣。需要注意的是，美客多的活动折扣只能向下调整，建议你使用平台提供的促销工具并遵守相关规定。","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-17 16:59:50","用户":"David Xu","群":"","用户问询":"如何查询我目前的活动参赛进度？","AI响应":"可以登录 https://mercado.ideawuhe.com/ ，点击查看您的专属新品门槛和季节品费比小目标。请务必保存该链接，随时监控达标进度。看板数据每周一和周四更新，较后台有2天系统延迟。","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-17 10:32:52","用户":"骑着毛驴去拉萨","群":"","用户问询":"如果 不创建活动会怎么样","AI响应":"你好！如果不创建广告活动，你的商品就无法在搜索结果和详情页的黄金展位获得额外曝光。对于新店或新链接，不开启广告可能会导致流量匮乏、出单缓慢，难以快速积累订单来提升信誉等级。","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-17 09:38:08","用户":"李章炼","群":"","用户问询":"没看到有这个活动的入口啊","AI响应":"你好！很高兴为你解答。促销活动入口通常在卖家后台的“Advertising”或“Promotions”菜单下。如果你的商品列表处于暂停状态，需先将其从已参与的活动中移除，待重新激活后再返回促销页面参与新优惠。","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-17 07:25:04","用户":"骑着毛驴去拉萨","群":"","用户问询":"这两个活动什么区别","AI响应":"你好！这两个活动的主要区别在于：\n1. 推广商品数量：第一个活动包含“+99条广告”，即推广商品较多；第二个活动显示“0条广告”，目前没有生效的推广商品。\n2. 目标ROAS：第一个活动设定的目标是5.5倍，第二个是5.88倍，后者对转化效率的要求更高。","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-16 14:37:00","用户":"流姝","群":"","用户问询":"后台活动力度上调，是什么原因？","AI响应":"你好！后台活动力度上调通常有以下原因：\n1. 平台大促临近：如热卖节或黑五，平台会要求更高的折扣以获取流量。\n2. 竞品价格变动：系统监测到同类产品价格下降，为保持竞争力自动调整建议折扣。\n3. 销量表现：为刺激转化，系统会根据算法推荐更具吸引力的活动力度。","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-14 10:47:38","用户":"Felicity 103%","群":"","用户问询":"活动编码怎么查看","AI响应":"你好！很高兴为你解答。\n\n申请美客多巴西本土店活动时，活动编码为：ZHKX0710。","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-13 16:08:48","用户":"是小张呀","群":"","用户问询":"、怎么会出现负数折扣呢","AI响应":"在美客多后台，商品价格折扣显示为负数（如图片中的 USD -0.11）是正常的系统表达方式。\n\n这里的负数并不代表折扣为负，而是指在原价基础上“减去”的金额。系统通过这种方式直观地告知您，该商品在参加促销活动时，售价会比原价降低 0.11 美金。\n\n简单来说，负号代表的是减价金额，而不是折扣比例为负。","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-16 11:30:12","用户":"😐","群":"","用户问询":"活动都有什么","AI响应":"你好！很高兴为你解答。美客多的活动类型主要包括以下几种：\n\n1. 每日特卖（DOTD）：这是流量最高的活动，通常持续24小时。\n2. 闪购（Lightning Deals）：限时限量的促销活动，通常持续几个小时。\n3. 季节性大促：如 Hot Sale、Buen Fin、圣诞节等全平台大型促销活动。\n4. 类目活动：针对特定品类的促销，如电子产品周、时尚周等。\n\n网页参考资料\nhttps://global-selling.mercadolibre.com/help/21832","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-18 14:44:29","用户":"岩","群":"","用户问询":"怎么可以帮我们查到全托管是报名了还是没报名呢","AI响应":"你好！很高兴为你解答。请通过以下链接，输入公司名、手机号或邮箱进行查询：\nhttps://mercadolibre.cn/seller/info?id=478&type=consignment","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-17 07:28:16","用户":"骑着毛驴去拉萨","群":"","用户问询":"现在是每天一美金吗","AI响应":"你好！目前生效的只有第一个活动，其平均每日预算是 1 美元。虽然左上角显示总预算为 2 美元，但因为第二个活动处于关闭状态，所以实际每天只会消耗 1 美元。","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-14 12:36:11","用户":"j、","群":"","用户问询":"已经报名过的会在表格里体现吗","AI响应":"你好！很高兴为你解答。已经报名参加活动的商品通常会出现在导出的表格中，你可以通过表格查看已报名的状态或对折扣信息进行修改。","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-13 19:23:40","用户":"柯培鑫","群":"","用户问询":"我先设置一样的价格，价格先设置高一点，后面再通过活动大幅度降价促销，行不行","AI响应":"这种策略在美客多是**可行**的，但有几个关键点你需要注意，以免影响效果：\n\n1. **价格对比功能**：不久后，你将能够将产品的价格与竞争对手的价格进行比较。如果在你的承受范围内，提供有吸引力的折扣可以吸引更多买家。\n\n2. **包邮门槛的影响**：这是最需要注意的一点。在美客多，包邮门槛是以**折扣后的最终售价**为准的。\n   - 例如墨西哥站的包邮门槛是299比索。如果你的原价高于299比索（卖家包邮），但大幅度打折后价格低于了299比索，你可以为该商品设置不包邮，运费将转由买家承担。\n   - 如果折后价格依然高于299比索，买家继续享受包邮，运费仍由你承担。所以大幅降价时，要核算好运费成本的变化。\n\n3. **促销设置的灵活性**：你可以为“自定义商品”设置各种促销活动。在“促销管理”中操作即可。\n\n4. **流量加持周期**：如果你的商品参加活动降价，系统通常在降价后的**第4天**开始才会有明显的流量加持和出单，所以降价后不要着急，给系统一点反应时间。\n\n5. **变体定价**：如果你有多个颜色（变体），你可以为同一个商品链接中的不同变体独立定价。但要注意，一旦促销活动创建成功，价格是无法修改的。\n\n**总结建议：**\n先设高价再打折是常见的运营手段，但一定要实时关注各站点折后价格是否低于站点的强制包邮门槛，以免影响产品的转化率或改变你的运费成本结构。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-16 11:31:56","用户":"😐","群":"","用户问询":"这些活动的折扣率是多少","AI响应":"你好！很高兴为你解答。在美客多平台活动中，建议折扣预留25%以上的空间，很多时候的活动是有折扣要求的。\n\n具体的折扣要求会根据活动类型有所不同：\n1. 建议折扣预留25%以上的空间打折，以确保能够满足大部分活动的门槛。\n2. 针对部分品牌专区展示，通常需要重新设置至少5%-10%的折扣，否则不会展示。\n3. 参加活动时，折扣只能向下调整，不能向上调价。\n\n请注意，活动折扣后的最终售价会影响包邮政策。如果折后价格低于站点强制包邮门槛（如墨西哥299比索），运费将由买家承担。","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-16 11:27:53","用户":"😐","群":"","用户问询":"平台活动的等级和固定折扣","AI响应":"你好！很高兴为你解答。在美客多平台活动中，建议折扣预留25%以上的空间，很多时候的活动是有折扣要求的。\n\n具体的折扣逻辑如下：\n1. 建议折扣预留25%以上的空间打折。\n2. 美客多的活动折扣是只能向下调整的。\n3. 针对部分品牌专区展示，需要重新设置折扣至少5%-10%，否则不会展示。\n\n此外，包邮门槛是以折扣后的最终售价为准的。如果商品参加折扣活动后，折后价格低于了站点的强制包邮门槛（如墨西哥站299比索），运费将转由买家承担；如果折后价格依然高于门槛，则由卖家承担包邮运费。","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-16 14:35:18","用户":"流姝","群":"","用户问询":"我商品已经发布成功了，也添加了活动，但被下架了","AI响应":"你好！商品被下架通常有以下原因：\n1. 触发审核：状态显示为 Inactive - Needs review，需检查标题、描述或图片是否违规。\n2. 缺货：库存为零会自动暂停。\n3. 侵权或违规：收到权利人举报或违反知识产权政策。\n建议前往管理列表查看具体状态和后台通知。","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-14 12:31:19","用户":"j、","群":"","用户问询":"我导出了表格，如果不参加活动是不填还是删除","AI响应":"你好！很高兴为你解答。如果不参加活动，请直接删除该行或保持该行的折扣信息为空，不要填写任何数据。","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-18 11:14:15","用户":"几木晴天","群":"","用户问询":"好的 所以还是要留一点折扣空间","AI响应":"是的，建议折扣预留25%以上的空间。很多平台活动对折扣有明确要求，预留充足空间能确保你的产品顺利参加活动并保证利润。","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"},{"时间":"2026-07-17 09:44:35","用户":"迷迷 苏","群":"","用户问询":"Rebate 活动","AI响应":"你好！很高兴为你解答。\n\n关于 Rebate（出单补贴）活动，核心规则如下：\n\n1. 价格构成：Rebate 是在 Final Price（最终售价）的基础上，由平台给予卖家额外的补贴。例如，如果你填写的折后售价是 100 美金，买家在前台看到的售价就是 100 美金，但平台如果补贴 5%，你最终到手的金额就是 105 美金。\n\n2. 补贴额度：平台最多可补贴 5%，客户经理会根据实际情况自行调整具体的补贴金额。\n\n3. 提报要求：\n- 活动通常持续一周。\n- 单个产品每个月只能提报一次，下个月可以重复提报。\n- 提报的价格需要比普通折扣更低，至少不低于 5%，且会会计入最低价（credibility price）计算。\n- 请确保：平台补贴金额 / (原价 - rebate后售价) < 30%。\n\n4. 提报周期：Rebate 活动生效后不需要每周重复提报，等当前活动结束了再重新提报即可。\n\n5. 注意事项：如果你同时参加了 DOD（Deal of the Day），DOD 的价格通常需要比 Rebate 和其他活动的价格再低 5%。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"营销活动","二级子类":"促销活动","问题主题":"促销/折扣/优惠券/活动"}]},{"一级大类":"物流仓储","二级子类":"库容管理","Past 7 Days":39,"Previous 2026-07-06 to 2026-07-12":32,"Change":7,"WoW":0.21875,"Past 7 Share":0.005661199012919146,"高频问题":"海外仓/FULL/入仓","__details":[{"时间":"2026-07-13 00:37:00","用户":"MGG","群":"","用户问询":"但是这不对啊，如果按照你所说的，如果想锁定7月的库容，就必须在6月23号前完成操作，但我6月23号并没有操作，实际却在7月13号还能购买7月的库容，这你怎么解释呢","AI响应":"你好！很高兴为你解答。\n\n这并不矛盾，请参考以下规则说明：\n\n1. 购买当月库容（即买即用）：\n当月购买不可取消。一旦您在当前自然月（如7月）发现库容不足，您可以随时购买当月的额外库容并立即分配生效。这属于紧急补救措施，用于覆盖当前的库存缺口并停止按天收取的超量罚款。\n\n2. 购买未来月份库容（提前规划）：\n“每月23日前截止”的规定，主要是针对提前预订未来长达3个月库容的操作。例如，在6月23日前预订7月的库容，是为了让卖家能提前以更低的成本锁定额度，避免进入7月后因超量产生高额罚款。\n\n3. 为什么你现在还能买：\n因为平台允许卖家在“当前自然月”内根据实际库存情况随时增购库容。你6月23日前没有操作，只是错过了“提前预订”的机会，导致7月1日到7月13日期间因为超量产生了罚款。但现在（7月13日）你依然有权购买7月剩余天数的库容来止损。\n\n总结来说：23号是一个针对“未来月份预购”的截止节点，而“当月增购”在整个自然月内都是开放的，只是越晚购买，前期产生的超量罚款就越多。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-13 00:40:09","用户":"MGG","群":"","用户问询":"而“当月增购”在整个自然月内都是开放的 ----这一点为什么我7月前几天没看到呢？就是我在那几天是没有购买我想要的小体积库容的入口的，那里是灰色的","AI响应":"你好！很高兴为你解答。\n\n如果你在 7 月初看到购买入口是灰色的，通常是由以下几种情况导致的：\n\n1. IPI 分数变动\n购买额外库容的功能仅对 IPI 分数低于 70 分（红/黄状态）的卖家开放。如果 7 月初你的 IPI 分数刚好在达标边缘波动，或者系统正在更新你的 IPI 状态，入口可能会暂时不可用。\n\n2. 库容类型限制\n系统会根据你实际在库商品的类型（标准件或大件）来开放对应的购买权限。如果你当时没有对应类型的库存超量，或者系统判定你不需要该类型的额外库容，入口也可能是灰色的。\n\n3. 系统结算与更新期\n每个月初，平台系统会进行上个月费用的结算以及本月基础库容的重新分配。在数据更新和同步的过程中，部分后台功能可能会有短暂的延迟或显示异常。\n\n4. 账户状态\n如果账户存在其他限制或未处理的违规，也可能影响到库容购买功能的使用。\n\n既然你现在（7月13号）已经可以看到购买入口，说明目前你的账户状态和 IPI 分数符合购买条件，建议你尽快完成操作以规避后续的超量罚款。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 15:25:15","用户":"BONBONS","群":"","用户问询":"FULL库存提取库存的费用怎么计算","AI响应":"提取库存会产生弃置或撤仓费。费用根据商品的尺寸和重量计算，具体标准请参考：https://global-selling.mercadolibre.com/knowledge-hub/18226","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-13 00:32:12","用户":"MGG","群":"","用户问询":"那是否就是当我选择购买后，我的7月总库容会马上更新，我的总库容大于现有库容，就不会产生超库容罚款，就只有那一笔买库容的费用了是吗？","AI响应":"你好！很高兴为你解答。\n\n关于你的疑问，具体规则如下：\n\n1. 生效时间\n购买未来月份（7月）的库容并不会在当前月份立即更新总额度。该额度会在 7 月 1 日起正式生效并分配到您的账户中。\n\n2. 罚款规避\n一旦进入 7 月份，如果你的总库容（基础 890 + 购买 1190 = 2080）大于你的实际库存，那么在 7 月份确实不会产生超库容罚款，你只需要支付购买库容的费用。\n\n3. 当前月份情况\n需要注意的是，如果你现在（6月份）已经处于超库容状态，购买 7 月的库容无法抵消 6 月份剩余天数产生的超量罚款。超量罚款是按天收取的，只有当购买的库容正式生效且总额度覆盖了实际库存后，罚款才会停止。\n\n4. 费用结算\n所有购买库容的费用以及之前产生的超量罚款，都将在交易发生后的次月进行统一结算。\n\n建议你尽快在后台完成购买操作，以确保 7 月 1 日额度准时生效，从而将仓储成本降到最低。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 20:48:50","用户":"cyc","群":"","用户问询":"经理，我半托的补货规则改了，现在我库存的货都不支持我卖 3 天 [破涕为笑] 经理我怎么办 现在买 20 只能补 20 了","AI响应":"你好！很高兴为你解答。\n\n美客多半托管模式的强制移除（清退）规则是基于单件商品（即单个SKU）在仓库内的存放时长和动销情况来计算的，而不是根据整个链接的总销量。\n\n针对你提到的补货受限和库存不足问题，建议采取以下策略：\n\n1. 监控维度：请务必关注后台库存绩效指标，针对每一个入库的SKU进行动销监控，而非仅看Listing的总数据。\n\n2. 库存策略：建议采取“多款式、轻库存”的策略，单个SKU首批入库建议准备10-20个Units，以降低因动销停滞导致被强制清货或弃置的风险。\n\n3. 关注清退条件：\n- 低销与长库龄触发（2026年3月9日执行）：如果单件商品连续7天无销售，或存储超过14天且属于低销产品，系统将强制执行打折清仓活动。\n- 逾期强制移除（2026年3月23日执行）：在仓存放超过30天的单件商品必须移除。如果卖家未在规定时间内取回，将导致系统自动弃置。\n\n4. 健康库存定义：若商品连续30个自然日无销售，或库龄超过60天，或超出分配库容，均会被界定为“不健康库存”，可能面临分批强制折扣清货。\n\n建议你先通过提升现有库存的动销率来改善账号的库存绩效，从而获得更多的补货额度。后续有问题可以继续发问。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-13 00:29:18","用户":"MGG","群":"","用户问询":"比如我现在7月库容显示是890，我实际超量库容1580 我另外还需要再送500个进去，那我现在购买7月库容应该是买多少个？","AI响应":"你好！很高兴为你解答。\n\n根据你提供的数据，建议按照以下逻辑计算需要购买的库容数量：\n\n1. 计算现有缺口\n你目前的库容是 890，实际库存已经达到 1580，这意味着你目前已经超量了 690 个（1580 - 890 = 690）。\n\n2. 加上计划入库数量\n你计划再送 500 个商品进去，那么总需求量为 1190 个（超量的 690 个 + 计划入库的 500 个 = 1190 个）。\n\n3. 购买建议\n为了覆盖现有的超量库存并确保新货能正常入库，你现在购买 7 月库容时，建议购买数量应不少于 1190 个。\n\n重要提示：\n由于超量罚款（标准件 $0.012/件/天，大件 $0.12/件/天）的成本高于购买库容的成本，建议你尽早操作。如果你在 7 月 1 日前购买成功，该额度将在 7 月生效。如果 7 月份你的 IPI 分数提升至绿色健康度，系统会自动分配充足库容并全额退还你购买 7 月库容的费用。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-13 00:45:25","用户":"MGG","群":"","用户问询":"2403079921 那你能查到这个店铺下实时的最新每天超额库容费用是多少，怎么计算的吗","AI响应":"非常抱歉，我无法通过您提供的店铺编号查询到您后台的实时数据或具体的费用流水。\n\n关于超额库容费用的计算方式，您可以参考以下标准自行核算：\n\n**1. 计算公式**\n超量罚款是按天收取的，计算公式为：\n**每日超量罚款 = 每日超量件数 × 每日单件罚款金额**\n\n**2. 罚款标准**\n根据商品的尺寸类型，每日罚款金额如下：\n*   **标准件（Standard）：** 每件商品每天收取 **$0.012**。\n*   **大件（Oversize）：** 每件商品每天收取 **$0.12**。\n\n**3. 举例说明**\n以您之前提到的数据为例，假设您超量了 690 个标准件：\n*   您每天产生的超量罚款约为：690 × $0.012 = **$8.28 / 天**。\n\n**4. 如何查看官方明细**\n您可以登录卖家后台，通过以下路径查看最准确的费用信息：\n*   进入 **“购买历史记录（Purchase History）”** 面板，这里会显示所有已产生的费用流水。\n*   查看 **“库存绩效（IPI）”** 页面，系统通常会显示当前的超量情况及预估罚款。\n\n所有产生的超量罚款都会在次月统一结算并开票。建议您尽快完成库容购买，因为购买库容的成本通常远低于按天累计的罚款金额。\n\n网页参考资料\nhttps://global-selling.mercadolibre.com/help/21423","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-13 00:35:52","用户":"MGG","群":"","用户问询":"但现在实际的情况是，目前是7月13号，我却依旧能够购买7月的库容，这不是和你说的就相悖了吗","AI响应":"你好！很高兴为你解答。\n\n这并不相悖，这里需要区分两种不同的购买场景：\n\n1. 购买“当月”库容：\n在当前月份（如现在的7月），只要你的IPI分数处于红/黄状态，你随时可以购买本月的额外库容，购买后立即生效，用于抵扣本月剩余天数的超量罚款。\n\n2. 购买“未来月份”库容：\n平台强调“23号”这个时间点，主要是针对预购未来月份（如8月、9月）的操作。为了方便平台提前规划仓储资源，卖家通常需要在每月23日前截止对未来月份库容的预购申请。\n\n总结来说：你现在（7月13号）购买7月的库容是即买即用的，不受23号预购截止日期的限制；但如果你想提前锁定8月份的库容，就必须在7月23日前完成操作。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-13 00:30:58","用户":"MGG","群":"","用户问询":"那么假设我现在就购买1190个库容，那我7月的总库容就是890+1190=2080对吗","AI响应":"是的，你的理解是正确的。\n\n如果你现在购买 1190 个库容单元，那么你 7 月份的总库容额度就是系统分配的 890 个基础库容加上你额外购买的 1190 个，总计为 2080 个。\n\n这样操作后，你的总库容（2080）将能够覆盖你目前已有的 1580 个库存以及计划新入库的 500 个商品，从而避免产生超库容罚款。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-19 20:47:14","用户":"云水禅心","群":"","用户问询":"被客户取消了的订单，库存少了，货物也没有退回到我们的退货地址，怎么查询货物去向","AI响应":"建议您先在卖家后台确认订单的物流扫描状态。如果货物已进入国际段，通常无法拦截；若在进入国际段前取消，菜鸟会定期退回。您可以联系菜鸟客服（0532-66202077）或在后台开case提供订单截图，请平台协助核查货物具体去向。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 15:50:13","用户":"心海","群":"","用户问询":"像这种情况是正常的是吗？就是要把货先发到德州仓了，仓库扫描了才会显示有库存是吗","AI响应":"是的，这是正常情况。在美客多美国转运仓模式下，系统逻辑是有库存才会显示上架。\n\n您需要先在后台创建发货计划，将货物发送至美国德州官方仓。只有当仓库收到货物并完成扫描入库后，系统才会自动更新库存数量，此时您的产品链接才会从“未激活”状态变为“已激活”并正常售卖。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 15:08:43","用户":"Eli","群":"","用户问询":"你好！店铺分数70分以上，我这个月申请8月库容，8月还能再申请9月库容吗？","AI响应":"你好！很高兴为你解答。\n\n如果您的店铺IPI分数在70分以上，是可以申请额外库容的。关于申请频率，每个店铺每个月只有一次申请额外库容的机会。如果您在8月已经提交了申请并获得了额度，那么需要等到下个月才能再次提交针对后续月份的库容申请。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-13 00:35:09","用户":"MGG","群":"","用户问询":"为什么强调23号呢，你的意思是过了7月23号我就无法给8月买库容了吗？","AI响应":"你好！很高兴为你解答。\n\n是的，你的理解是正确的。\n\n根据平台规则，购买额外库容有明确的时间限制：您必须在每月 23 日前完成当月操作，以购买未来月份的库容。\n\n这意味着，如果你想为 8 月份购买额外库容，最晚必须在 7 月 23 日之前在后台完成操作。一旦超过这个日期，系统将截止当月针对未来月份库容的购买申请。\n\n所以，如果你预估 8 月份的 IPI 分数仍无法达标（低于 70 分）且库容缺口依然存在，请务必在 7 月 23 日前完成 8 月库容的购买。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-19 12:06:05","用户":"波波波pewpewpew突突突","群":"","用户问询":"修改库存数量后还是显示原来的数量1个，这是什么情况","AI响应":"目前无法直接判断具体原因。建议优先核查是否为海外仓卖家，海外仓库存需在创建入库货件时确认，无法直接在后台修改。若为自发货，请检查网络延迟或系统同步状态，建议刷新页面或稍后查看。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 16:35:31","用户":"Eli","群":"","用户问询":"但我想确定下我的对接经理是哪个人，我需要申请库容","AI响应":"你好！很高兴为你解答。\n\n关于库容扩容，根据您的店铺信誉和商品类型，有以下几种情况和处理方式：\n\n1. 常规商品库容\n常规商品的上架总数和库容是由店铺信誉等级动态决定的，无法人工申请增加。建议您专注提升订单履约率与销售业绩，随着店铺信誉等级提升（保持绿色状态），系统会自动为您扩充库容额度。\n\n2. 大件商品库容\n如果您是老卖家，系统会基于大件商品的动销情况给予库容。若后台库容不能满足您的发货需求，在IPI分数大于70分时可以向您的客户经理申请额外库容。\n\n3. 库容保障与新功能\n若您的IPI分数在3个月内始终保持绿色状态，当月实际库容配额将不低于当月库容预测值。针对墨西哥海外仓中IPI处于红色或黄色状态且库容不足的卖家，平台的“购买库容”功能可以解决此类问题。\n\n关于您询问的对接经理信息，目前提供的CSF邮箱查询表仅用于找回税务登记邮箱。如果您的店铺目前没有对接经理的联系方式，建议您通过卖家后台的帮助中心提交工单咨询，或查看入驻时的往来邮件确认是否有买手或经理的联系信息。\n\n网页参考资料：\nWhat are the listing limits?（https://global-selling.mercadolibre.com/help/21423）","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 15:57:58","用户":"j、","群":"","用户问询":"那显示的库存数量是共享的吗，还是显示的都是各自站点的库存","AI响应":"你好！很高兴为你解答。显示的库存数量不是共享的，各站点后台显示的都是该站点各自的库存数量。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-13 18:10:51","用户":"Aurora","群":"","用户问询":"店铺无法修改库存，但是显示账号正常，这是什么原因","AI响应":"你好！很高兴为你解答。\n\n如果你的账号状态正常但无法修改库存，通常有以下几种可能的原因：\n\n1. 系统缓存或网络问题：这是最常见的原因。建议你尝试清除浏览器缓存，或者更换 Chrome 浏览器、开启无痕模式后再试。\n\n2. 平台系统波动：美客多后台有时会出现接口不稳定的情况，导致部分字段暂时无法编辑。你可以尝试避开高峰时段，稍后再进行操作。\n\n3. 站点限制：如果你操作的是巴西站点的本土或海外仓业务，由于相关规则限制，我暂时无法为你提供解答。\n\n4. 批量操作延迟：如果你是通过批量表格上传修改的，系统同步可能存在延迟，建议等待一段时间后刷新查看。\n\n如果排除以上情况依然无法修改，建议你在卖家后台通过 Help 页面开 Case 联系官方技术支持，并提供报错截图，以便平台核查是否存在系统层面的限制。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-13 15:16:54","用户":"木木木弓虽","群":"","用户问询":"我美区仓库有库存 ，美客多出单我可以用美区的库存吗","AI响应":"你好！很高兴能为你解答。\n\n普通卖家是可以做美客多美国转运仓（美仓）模式的，你可以利用在美国德克萨斯州的官方仓库库存向拉美国家销售。\n\n目前美转仓已开放墨西哥、阿根廷、智利、巴西、哥伦比亚5个国家。该模式具有非常明显的优势，非常适合想要合规起步，且降低备货拉美多国风险及压力的卖家。\n\n以下是关于该模式的一些核心信息供你参考：\n\n1. 核心优势：使用美国转运仓属于远程配送，因此不需要提供销售国RFC税号。因为该模式属于跨境直邮而非本土发货，进口税费由买家在下单时支付，卖家可以有效避免复杂的税务预扣风险。\n\n2. 一仓发拉美：卖家只需备货至美国德州的官方仓库，即可通过跨境销售至阿根廷、墨西哥等站点。例如销售至阿根廷，出单后由美客多完成尾程配送，时效约12-15天。\n\n3. 运营支持：该模式完全支持卖家在后台自主创建购物车链接（Catalog Listing）。同时，所有站点均支持DOTD、LD、Rebate等多种活动的自主提报。\n\n4. 入驻条件：\n- 需要中国内地或香港公司营业执照（不接受个体户，须是有限责任公司）。\n- 法人身份证及人脸识别认证。\n- 收款账户：需提供非美国境内的美元（USD）银行账户。\n- 邮箱：建议使用Gmail、Outlook、Aliyun等海外或主流邮箱。\n\n5. 备货建议：建议采取多款式、轻库存策略。首批入库建议不少于10-15个SKU，单个SKU准备10-20个单位，以快速通过算法测款并覆盖流量。\n\n如果你打算开启美仓业务，请务必关注库存健康状况，避免因动销停滞或库龄超标导致商品被系统自动纳入强制清货流程。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 19:05:35","用户":"wydsn","群":"","用户问询":"@美客多本土号小助手黛西 库容申请","AI响应":"你好！请完成以下3步：\n1. 扫码添加小助手。\n2. 填写信息收集表：https://28151754.beschannels-plus.com/forms/6WU4ZMA。\n3. 完成库容申请：https://28151754.beschannels-plus.com/forms/6SU4ZNC。\n申请需IPI > 70，且已提前创建货件。\n\n网页参考资料：\nhttps://vendedores.mercadolivre.com.br/nota/guia-para-envios-e-reposicao-de-estoque-no-full\n\nhttps://file.marsmind.cc/boot-admin/mercado_local/20260716/2077647562425778177.png","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 17:20:25","用户":"迷迷 苏","群":"","用户问询":"哪里下载商品的销售数据和库存的Excel表格","AI响应":"你好！很高兴为你解答。\n\n你可以通过以下路径下载相关的Excel表格：\n\n1. 下载库存数据：\n进入卖家后台，点击 Listings（刊登管理），在页面右上角可以看到 Export（导出）按钮，点击即可下载当前所有产品的库存及状态明细表。\n\n2. 下载销售数据：\n进入卖家后台，点击 Reports（报告）> Metrics（指标），在这里你可以选择特定的时间范围，然后点击下载销售报告，获取详细的订单和销售数据。\n\n如果你是使用海外仓（Full）模式，也可以在 Warehouse Management（仓库管理）界面找到对应的库存报告进行下载。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 18:36:38","用户":"Rosalía.H","群":"","用户问询":"CBT 半托管，发一批货，库存适用于所有站点吗","AI响应":"你好！很高兴为你解答。\n\n在CBT半托管模式下，你发往东莞集运仓的库存是适用于所有开通站点的。\n\n目前半托管模式支持墨西哥、智利、巴西、哥伦比亚等站点。你只需要将货物发送至国内集运仓，平台会根据各站点的订单情况，自动从该库存中调拨并完成国际段的配送。这意味着你不需要为每个站点分别准备库存，实现了一份库存卖向多个国家。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-13 00:34:30","用户":"MGG","群":"","用户问询":"那么我购买的库容是仅7月生效吗？","AI响应":"你好！很高兴为你解答。\n\n是的，你购买的库容仅在 7 月份当月生效。\n\n购买额外库容是按月计算的，该额度会在每个月的最后一天到期。如果你预计 8 月份依然存在库容不足的情况，你需要在 7 月 23 日之前，通过后台操作提前购买 8 月份的额外库容。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-16 12:38:08","用户":"对方正在输入...","群":"","用户问询":"买家因为没有库存退货怎么解决","AI响应":"如果是因为卖家缺货导致买家退货，建议按以下步骤处理：\n\n1. **及时沟通**：主动联系买家说明情况并致歉，询问是否愿意等待补货或更换其他款式。\n2. **取消订单**：若无法发货，请在后台取消订单。注意，因缺货取消订单会直接影响你的**店铺信誉（Reputation）**和取消率指标。\n3. **库存管理**：立即下架或调整该商品的库存数量，避免产生更多违规订单。\n4. **信誉维护**：如果信誉受损，需通过后续大量优质订单来稀释负面影响。\n\n建议卖家务必实时同步库存，避免因缺货导致的纠纷和降权。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 10:44:51","用户":"李玲娅","群":"","用户问询":"你好 库容怎么扩大","AI响应":"你好！很高兴为你解答。\n\n美客多海外仓的库容是根据店铺的销售表现和库存周转率自动调整的，人工无法直接干预申请扩大。\n\n想要提升库容，建议从以下几个方面优化：\n1. 提高周转率：加快库存消化速度，避免货物在仓库积压。周转越快，系统分配的库容额度通常会越高。\n2. 提升销售额：销量持续增长是系统增加库容的核心指标。\n3. 改善信用分（Reputation）：保持良好的店铺信用等级，绿色店铺通常拥有更稳定的库容待遇。\n4. 清理冗余库存：及时处理长期不售出的商品，释放被占用的库容空间。\n\n系统通常会定期（如每周或每月）根据你过去一段时间的经营数据自动更新库容额度，请留意卖家后台的库容进度条变化。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 15:57:14","用户":"j、","群":"","用户问询":"库存是所有站点共享的吗","AI响应":"你好！很高兴为你解答。美客多同一SKU在不同站点上架后，库存是分开计算的，每一个SKU都有单独的条码。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 19:36:43","用户":"7655","群":"","用户问询":"是这个吗","AI响应":"是的，就是点击图片中蓝色的“在批量编辑器中修改”。进入后你可以通过过滤器筛选商品，然后统一更新价格、库存或状态。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 21:27:27","用户":"cyc","群":"","用户问询":"但是他给我的库容是不够给我卖 3 天的","AI响应":"你好！很高兴为你解答。目前半托管模式的库容和补货额度是由系统根据动销情况动态分配的。如果当前额度无法满足三天周转，建议你先按系统允许的最大值补货，以维持Listing权重。随着销量持续稳定增长，系统会自动识别并逐步提升你的补货上限。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 06:59:01","用户":"Aurora","群":"","用户问询":"我更换了电脑设备和网络，依旧无法修改库存","AI响应":"你好！很高兴为你解答。\n\n从你提供的截图来看，你操作的是巴西站点的后台。关于巴西本土以及巴西海外仓相关内容，你的问题我暂时无法回答，后续我会丰富我的知识库，敬请见谅。\n\n针对非巴西本土/海外仓场景，如果你已经更换了设备和网络依然无法修改，建议你：\n1. 检查是否开启了网页自动翻译功能，若开启请务必关闭，翻译插件常会导致后台按钮失效或字段无法编辑。\n2. 确认该商品是否正在参加平台活动，部分活动期间库存会被锁定无法手动增加。\n3. 避开邮件中的直接链接，尝试从官网后台首页重新进入批量编辑器。\n\n若以上操作均无效，建议通过后台右上角“？”→“Need Help”联系24小时在线客服，并提供具体的错误截图，我们会尽快帮您解决！我也可以帮您联系我们同事进行后台技术支持。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-13 00:25:37","用户":"MGG","群":"","用户问询":"你好，请问我现在买7月的库容是否会立即生效。","AI响应":"你好！很高兴为你解答。\n\n关于购买库容的生效时间，规则如下：\n\n1. 购买规则\n您现在可以提前购买未来长达 3 个月的额外库容。如果您现在购买 7 月份的库容，该额度将在 7 月 1 日起正式生效并分配到您的账户中，而不是立即在当前月份生效。\n\n2. 购买时限\n请注意，每月 23 日前需截止当月针对未来月份的操作。\n\n3. 适用对象\n该功能仅限库存绩效指标（IPI）分数低于 70 分（处于“红/黄”健康度）的卖家使用。如果您的 IPI 分数达标（“绿”健康度），系统会自动分配充足库容，无需也无法使用购买功能。\n\n4. 取消与退款\n如果您为未来月份购买了库容，在当前月份最后一天前均可手动取消，但系统将收取购买总金额 20% 的手续费。若您的 IPI 分数在下个月改善至“绿色”健康度，系统自动分配了更多免费库容，则之前购买的额外库容会被自动免费取消并获得 100% 全额退款。\n\n网页参考资料\nhttps://global-selling.mercadolibre.com/help/21423","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 15:37:41","用户":"Eiiiii","群":"","用户问询":"这个提取得库存是在哪个仓库得","AI响应":"从您提供的图片顶部蓝条可以看到，当前选中的站点是 AR (Full)，这代表该库存位于阿根廷的 Full 仓。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 09:47:52","用户":"Dford","群":"","用户问询":"我不作库存的","AI响应":"如果不做库存，建议您关注库存退出机制。7天销量为0或14天销量低的SKU可能被清退。若入库30天无动销，可能面临退仓或清货处理。请务必通过变体管理好库存状态，避免因缺货导致售后投诉。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-13 08:35:41","用户":"迷迷 苏","群":"","用户问询":"没有这个号码","AI响应":"你好！很高兴为你解答。\n\n针对买家询问是否有 9 或 9.5 码的问题，如果目前确实没有这两个号码，你可以这样回复：\n\n早上好！非常感谢你的祝福。很抱歉，目前我们暂时没有 9 码或 9.5 码的库存。建议你参考我们详情页的尺码表，测量脚长后看看其他相近尺码是否合适。如果你有其他喜欢的款式，也欢迎随时查看，祝你生活愉快！","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-13 17:33:47","用户":"Aurora","群":"","用户问询":"美客多自发货模式最近无法修改库存吗","AI响应":"你好！很高兴为你解答。\n\n目前美客多自发货模式是可以正常修改库存的。\n\n如果你在修改时遇到报错，通常是由于以下原因导致的：\n1. 系统网络波动或后台接口不稳定，建议你清除浏览器缓存、更换浏览器（推荐使用Chrome）或稍后再试。\n2. 账号权限或状态异常，请检查店铺是否有违规提醒。\n3. 批量编辑器的系统延迟。\n\n如果多次尝试依然显示“字段不可修改”，请在卖家后台通过帮助中心开Case联系官方客服，并附上报错截图，以便技术团队排查具体原因。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 19:05:25","用户":"冰咖啡","群":"","用户问询":"看下没问题吧 提交","AI响应":"你好！很高兴为你解答。\n\n请注意，你的“企业法定名称 - 拼音”这一栏填写有误。\n\n图片中显示的拼音是“Shenzhen Meijiabao Youxian Gongsi”，但这与你左侧填写的中文公司名称“清河县紫竹羊绒制品有限公司”完全不匹配。\n\n请将其修改为公司名称对应的正确拼音：Qinghe Xian Zizhu Yangrong Zhipin Youxian Gongsi。\n\n修改完成后，确认其他信息（统一社会信用代码、日期等）与营业执照一致，再点击继续。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"广告/关键词投放"},{"时间":"2026-07-17 21:24:15","用户":"cyc","群":"","用户问询":"那我寄过去东莞，我大概是需要三天时间，一天快递加两天入仓。那如果我一个晚上我就把我库存的10个全部出完，然后我10个还在路上 那我就断货了","AI响应":"你好！很高兴为你解答。系统预估库存不足会提前通知补货以保证流量。目前托管备货仓需商家自寄，建议你合理规划发货时间，提前安排寄送，确保货物在断货前入仓。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 21:25:07","用户":"cyc","群":"","用户问询":"我现在有一款产品，就是在一天之内出 10 单，库存剩 7 个 然后我重新发货过去，他最多只让我补 13 个，然后我就断货了 对的","AI响应":"你好！很高兴为你解答。系统会基于过去销售数据和未来预期计算补货范围。若补货限制导致断货风险，建议确保库存不为零以维持Listing权重。目前无法直接干预系统算法，建议持续关注动销，随着销量稳定，系统预估的补货额度会逐步提升。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 11:19:37","用户":"Z","群":"","用户问询":"我已经点击取消了，但是系统推送的计划又出来了，","AI响应":"收到。这种情况是因为你取消了之前的货件，系统识别到你的库存依然不足，所以重新生成了补货任务。\n\n这是正常现象。既然供应商延期，你可以先不用理会这个任务。等供应商货备好后，再点击进入该补货任务，填入实际发货数量并创建新的货件计划即可。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 14:30:32","用户":"迷迷 苏","群":"","用户问询":"哪一个是退货的地址","AI响应":"你好！很高兴为你解答。\n\n图片下方标注为“始发地退件地址”的板块就是设置退货地址的地方。\n\n对于自发货物流模式，未填地址将导致您在纠纷中无法要求退货，只能被迫“仅退款”；对于海外仓卖家，若退货地址留空，退货商品将被送至 Mercado Libre 仓库。卖家必须在20天内自行提取，否则商品将被捐赠或销毁。\n\n如果你需要设置或修改，可以点击该板块进入，按照以下步骤操作：\n1. 登录您的 Global Selling 账户。\n2. 进入 Settings（设置） > Selling Preferences（销售偏好设置）。\n3. 选择对应站点及物流模式。\n4. 点击 “Add return address（添加退货地址）”并填写信息。\n\n网页参考资料：\nhttps://global-selling.mercadolibre.com/learning-center/news/how-do-i-set-my-local-return-address","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-18 09:15:14","用户":"时倾","群":"","用户问询":"这些不用填写吧","AI响应":"必须填写。若退货地址留空，海外仓退货在20天内未提取将被自动捐赠或销毁；自发货模式则会导致纠纷中无法要求退货，只能被迫仅退款。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"物流发货/面单/包装"}]},{"一级大类":"财税合规","二级子类":"发票开具","Past 7 Days":26,"Previous 2026-07-06 to 2026-07-12":29,"Change":-3,"WoW":-0.10344827586206896,"Past 7 Share":0.003774132675279431,"高频问题":"发票开具综合咨询","__details":[{"时间":"2026-07-16 15:36:13","用户":"Star Chow","群":"","用户问询":"这个跟客户所需要的发票，一致妈？“ 这个跟客户所需要的发票，是一样的东西吗？","AI响应":"不一样。这是平台开给卖家的费用账单。若买家需要发票，你应在后台Invoice模块下载Commercial Invoice，或通过ERP生成PDF发给买家。","一级大类":"财税合规","二级子类":"发票开具","问题主题":"发票开具综合咨询"},{"时间":"2026-07-15 11:22:35","用户":"杨莉","群":"","用户问询":"平台开具的官方发票 Commercial Invoice 在哪里，没找着","AI响应":"你好！很高兴为你解答。\n\n请按以下路径操作：\n1. 登录卖家后台。\n2. 进入 Invoice（发票）相关模块。\n3. 根据订单信息选择交易。\n4. 使用系统导出功能下载电子发票。\n\n你也可以通过ERP生成PDF版，在订单聊天窗口发送给买家。","一级大类":"财税合规","二级子类":"发票开具","问题主题":"发票开具综合咨询"},{"时间":"2026-07-17 09:28:09","用户":"🍀时光","群":"","用户问询":"你好，在美客多发票中，逾期发票自动催收，这个是扣的什么费用？","AI响应":"不好意思，该问题我没有答案","一级大类":"财税合规","二级子类":"发票开具","问题主题":"发票开具综合咨询"},{"时间":"2026-07-14 09:36:37","用户":"纯属巧合","群":"","用户问询":"我在后台找不到发票路口， 可以给到一个明确的路径吗","AI响应":"你好！很高兴为你解答。\n\n在美客多卖家后台，下载官方发票的具体操作路径如下：\n\n1. 登录您的卖家后台（Seller Central）。\n2. 在左侧菜单栏中找到并点击 **Orders**（订单）模块。\n3. 在订单列表中找到买家要求发票的那笔具体交易。\n4. 点击进入该订单的详情页面。\n5. 在订单详情页中寻找 **Invoice** 或 **Actions** 按钮，选择下载 **Commercial Invoice**（商业发票）。\n\n如果您在订单详情页没有看到下载选项，通常是因为该订单还在处理中，或者您可以通过后台的 **Message**（订单聊天窗口）直接询问买家是否接受由您的ERP系统生成的PDF电子版发票，并以附件形式发送给对方。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"发票开具","问题主题":"发票开具综合咨询"},{"时间":"2026-07-13 17:19:02","用户":"戏文","群":"","用户问询":"贷记单编号-付款类型（贷记单）-已开票是什么意思","AI响应":"不好意思，该问题我没有答案，请点击以下链接咨询人工客服：\nhttps://work.weixin.qq.com/kfid/kfc7c47108dec2b0070?enc_scene=ENCGH59j4kB9XCrk4dX6Jt2BZeAhKD7ZBUNQhrF2CcGYyCW&scene_param=customer_id=7881302528026320","一级大类":"财税合规","二级子类":"发票开具","问题主题":"发票开具综合咨询"},{"时间":"2026-07-15 16:20:24","用户":"哎嘿","群":"","用户问询":"你好，美客多逾期发票扣款是怎么回事","AI响应":"你好！很高兴为你解答。\n\n关于逾期发票扣款，通常是指卖家未能在规定时间内上传有效的商业发票（Invoice），导致平台根据相关政策进行的扣款。\n\n在美客多平台，卖家有义务为每笔订单及时提供发票。如果发票缺失或上传逾期，可能会产生相应的罚金或费用扣除。建议你登录卖家后台，在账单详情中查看该笔扣款的具体说明，并核对对应订单的发票上传状态。\n\n为了避免此类扣款，请务必在订单处理流程中及时上传合规的发票文件。","一级大类":"财税合规","二级子类":"发票开具","问题主题":"发票开具综合咨询"},{"时间":"2026-07-15 08:28:08","用户":"Manda","群":"","用户问询":"你好，客户要开发票的话我这里是可以开的么","AI响应":"你好！很高兴为你解答。\n\n美客多平台未与墨西哥税务局 (SAT) 集成，因此平台无法代开发票。如果您的客户需要电子发票，作为卖家，您有义务在税务服务提供商的帮助下管理发票，并将其附加在发送给买家的消息中。您还有责任 100% 遵守账单问题。\n\n一般情况下，如买家无特殊要求，您可为买家下载平台开具的官方发票 Commercial Invoice，具体操作路径如下：\n1. 登录您的卖家后台。\n2. 找到并进入 Invoice（发票） 相关模块。\n3. 根据订单信息，选择需要开具发票的交易。\n4. 使用系统的导出功能，即可下载正式的电子发票文件。\n\n您也可以通过ERP生成PDF电子版，随后通过后台“订单聊天窗口（Message）”以附件形式发送给买家。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"财税合规","二级子类":"发票开具","问题主题":"发票开具综合咨询"},{"时间":"2026-07-15 11:29:14","用户":"杨莉","群":"","用户问询":"怎么下载官方电子发票 没找着","AI响应":"你好！很高兴为你解答。\n\n请登录卖家后台，进入订单详情页面，找到并进入 Invoice（发票）相关模块，根据订单信息选择交易并使用导出功能下载。\n\n若后台未显示，你也可以通过ERP生成PDF电子版，随后通过后台“订单聊天窗口（Message）”以附件形式发送给买家。","一级大类":"财税合规","二级子类":"发票开具","问题主题":"发票开具综合咨询"},{"时间":"2026-07-14 09:49:19","用户":"纯属巧合","群":"","用户问询":"后台不能直接下载发票吗","AI响应":"你好！很高兴为你解答。\n\n在美客多平台，尤其是墨西哥站点，平台无法直接为你生成并提供正式的税务发票供你下载。\n\n这是因为我们的平台未与墨西哥税务局 (SAT) 集成，因此无法代开。如果买家需要发票，通常需要由卖家自行准备。\n\n你可以通过以下方式处理：\n1. 如果买家没有特殊税务要求，你可以使用 ERP 系统根据订单数据生成一份 Commercial Invoice（商业发票）PDF文件。\n2. 如果你没有 ERP，需要根据订单详情手动制作一份 PDF 电子发票。\n3. 准备好文件后，点击订单页面的 Attach invoice 按钮进行上传，或者通过订单聊天窗口发送给买家。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"发票开具","问题主题":"发票开具综合咨询"},{"时间":"2026-07-14 09:49:04","用户":"纯属巧合","群":"","用户问询":"后台不能直接上传发票吗","AI响应":"你好！很高兴为你解答。\n\n后台是可以直接上传发票的。你看到的 **Attach invoice** 按钮就是专门用来上传发票的入口。\n\n具体操作如下：\n1. 你需要先准备好一份 PDF 格式的电子发票（可以通过 ERP 生成，或根据订单信息手动制作）。\n2. 点击订单详情页中的 **Attach invoice** 按钮。\n3. 选择你准备好的 PDF 文件进行上传。\n\n上传完成后，这份发票就会关联到该订单，买家可以在他们的账户后台直接查看和下载。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"发票开具","问题主题":"发票开具综合咨询"},{"时间":"2026-07-13 16:23:16","用户":"iee","群":"","用户问询":"汇总的发票怎么开/","AI响应":"卖家您好，美客多平台目前**不支持一键开具月度汇总发票**。\n\n如果您需要为买家提供凭证，通常是提供单笔订单的官方发票。具体操作如下：\n\n1. 登录卖家后台，进入 **Invoices and Credit Notes**。\n2. 根据订单信息，逐一选择并下载对应的 **Commercial Invoice**。\n3. 您也可以通过 ERP 系统生成 PDF 电子版，通过后台订单聊天窗口发送给买家。\n\n如果您是指自己对账用的汇总数据，请下载 **Billing period report (US$)**，该报告会汇总您在特定周期内的所有收支明细，但它属于财务报告，而非法律意义上的单一汇总发票。\n\n网页参考资料\nInvoice-发票导出功能：https://doc.weixin.qq.com/pdf/d3_ARIAagYiAMICNQKOggiVhQl6jK03M?scode=AI8A3wfvAAoWR63MJpARIAagYiAMI","一级大类":"财税合规","二级子类":"发票开具","问题主题":"发票开具综合咨询"},{"时间":"2026-07-13 11:22:34","用户":"知行合一","群":"","用户问询":"采购发票是什么样的？","AI响应":"采购发票需要是正规的增值税发票。在提交申诉或验证时，发票应包含以下关键信息：\n\n1. 供应商信息：包含供应商的名称、地址和联系方式。\n2. 购买方信息：必须与您美客多账号后台注册的公司名称一致。\n3. 产品详情：清晰列出产品的名称、型号、数量和单价，且产品信息需与您店铺中销售的商品相匹配。\n4. 开票日期：发票日期应在您上传产品或收到投诉之前，通常建议是近半年内的采购记录。\n5. 发票章：必须加盖供应商的财务专用章或发票专用章。\n\n请注意，平台不接受形式发票（Proforma Invoice）、收据或简单的发货单作为合规证明。建议提供彩色扫描件，确保所有文字和印章清晰可见。","一级大类":"财税合规","二级子类":"发票开具","问题主题":"发票开具综合咨询"},{"时间":"2026-07-15 16:22:06","用户":"哎嘿","群":"","用户问询":"怎么上传发票","AI响应":"你好！很高兴为你解答。\n\n一般情况下，如买家无特殊要求，您可为买家下载平台开具的官方发票 Commercial Invoice，具体操作路径如下：\n\n1. 登录您的卖家后台。\n2. 找到并进入 Invoice（发票） 相关模块。\n3. 根据订单信息，选择需要开具发票的交易。\n4. 使用系统的导出功能，即可下载正式的电子发票文件。\n\n您也可以通过ERP生成PDF电子版，随后通过后台“订单聊天窗口（Message）”以附件形式发送给买家。","一级大类":"财税合规","二级子类":"发票开具","问题主题":"发票开具综合咨询"},{"时间":"2026-07-13 16:30:03","用户":"iee","群":"","用户问询":"目前每个月下载下来是多张 PDF，想确认是否支持按月导出汇总账单或汇总发票。","AI响应":"你好！目前平台不支持导出单一的月度汇总发票 PDF。\n\n报税建议使用 **Billing period report (US$)**，该报告能以 Excel 形式按月汇总所有收支和税费明细，方便财务对账。若需法律凭证，仍需保留现有的单份 PDF 发票。","一级大类":"财税合规","二级子类":"发票开具","问题主题":"发票开具综合咨询"},{"时间":"2026-07-18 08:00:30","用户":"雪天","群":"","用户问询":"你好，客户需要具有财务报销的发票，墨西哥站点怎样提供，谢谢","AI响应":"你好！很高兴为你解答。美客多平台未与墨西哥税务局（SAT）集成，无法代开发票。\n\n如果客户需要电子发票，作为卖家，你有义务在税务服务提供商的帮助下管理发票，并将其附加在发送给买家的消息中。你需 100% 负责处理账单问题并遵守相关规定。","一级大类":"财税合规","二级子类":"发票开具","问题主题":"发票开具综合咨询"},{"时间":"2026-07-15 11:30:16","用户":"杨莉","群":"","用户问询":"进入 Invoice（发票）相关模块 ，没看到电子发票","AI响应":"你好！很高兴为你解答。\n\n如果后台 Invoice 模块未显示电子发票，可能是因为平台未与当地税务局集成，无法自动生成。\n\n这种情况下，建议你通过 ERP 系统手动生成 PDF 版本的发票，或者联系你的税务代理协助开具，随后通过后台订单聊天窗口发送给买家。","一级大类":"财税合规","二级子类":"发票开具","问题主题":"发票开具综合咨询"},{"时间":"2026-07-15 11:21:31","用户":"杨莉","群":"","用户问询":"那给顾客开发票了，岂不是收双份税了嘛","AI响应":"你好！很高兴为你解答。\n\n平台代扣代缴是基于墨西哥税务法规的预扣行为。作为卖家，你有义务为客户提供发票。\n\n如果你已绑定RFC税号，平台会根据你的税务身份调整预扣比例，你开具的发票是履行交易账单义务，不存在收双份税的情况。请务必确保账单合规。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"财税合规","二级子类":"发票开具","问题主题":"发票开具综合咨询"},{"时间":"2026-07-19 23:40:28","用户":"周兴","群":"","用户问询":"买家投诉叫我开发票，无法开票就退款，怎么办","AI响应":"您好，平台无法代开发票。若买家需要，您有义务通过税务服务商管理发票，或通过ERP生成PDF电子版，在后台订单聊天窗口以附件形式发给买家。若无特殊要求，也可在后台Invoice模块下载官方Commercial Invoice提供给买家。","一级大类":"财税合规","二级子类":"发票开具","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-14 09:29:43","用户":"纯属巧合","群":"","用户问询":"我们是做 半托的， 客户要求开发票要怎么办","AI响应":"你好！很高兴为你解答。\n\n关于买家索要发票的问题，处理方式如下：\n\n1. 下载官方发票：一般情况下，如果买家没有特殊要求，你可以直接在卖家后台为买家下载平台开具的官方发票 Commercial Invoice。\n操作路径：登录卖家后台 -> 进入 Invoice（发票）相关模块 -> 选择对应订单 -> 使用导出功能下载电子发票。\n\n2. 通过ERP发送：你也可以通过ERP系统生成PDF电子版发票，随后通过后台的“订单聊天窗口（Message）”以附件形式发送给买家。\n\n3. 卖家的责任：由于美客多平台未与墨西哥税务局（SAT）集成，平台无法直接开具正式的电子发票。如果客户明确需要电子发票，作为卖家，你有义务在税务服务提供商的帮助下管理发票，并将其附加在发送给买家的消息中。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"发票开具","问题主题":"平台政策/官方规则"},{"时间":"2026-07-17 21:23:44","用户":"👾","群":"","用户问询":"这种需要找客服吗","AI响应":"卖家您好，从您提供的图片来看，这些链接的状态属于严重的违规限制，具体处理建议如下：\n\n1. 酒精测试仪（Alcoholímetro）：状态显示“该产品在国内被禁止”。这类产品通常涉及当地法律法规限制或医疗器械监管，属于禁售品，找客服申诉成功的概率极低，建议直接删除。\n\n2. 钥匙扣（Keychain）：显示“不符合我们的政策”。请检查是否涉及侵权（如世界杯Logo、品牌形象等）。\n\n3. 太阳镜（Gafas De Sol）：显示“该产品易被仿冒”。这通常是触发了品牌的知识产权保护机制。\n\n4. 宠物去毛手套：显示“因违反政策已暂停商品”。\n\n针对这些情况，如果您的产品确实拥有合法的品牌授权或不属于禁售品，您可以点击状态下方的“查看政策”或“检查政策”了解详情，并准备好相关证明材料（如品牌授权书、合规发票等）联系客服进行申诉。\n\n但如果产品确实涉及侵权或属于站点禁售品，建议不要强行申诉，应及时清理违规链接，以免影响店铺权重甚至导致封号。","一级大类":"财税合规","二级子类":"发票开具","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-17 15:53:40","用户":"o泡果奶","群":"","用户问询":"买家没有要求开票还需要开票吗","AI响应":"一般情况下，如果买家没有特殊要求，您不需要主动开具发票。\n\n如果买家后续有需要，您可以直接在卖家后台下载平台开具的官方发票 Commercial Invoice 提供给买家。具体操作是登录卖家后台，进入发票相关模块，选择对应交易并导出电子发票文件。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"财税合规","二级子类":"发票开具","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-17 08:41:03","用户":"迷迷 苏","群":"","用户问询":"买家的发票哪里下载","AI响应":"你好！很高兴为你解答。\n\n买家的发票（Commercial Invoice）下载路径如下：\n\n1. 登录你的卖家后台。\n2. 找到并进入 Invoice（发票）相关模块。\n3. 根据订单信息，选择需要开具发票的交易。\n4. 使用系统的导出功能，即可下载正式的电子发票文件。\n\n你也可以通过 ERP 生成 PDF 电子版，随后通过后台“订单聊天窗口（Message）”以附件形式发送给买家。\n\n需要注意的是，你刚才截图里的页面是平台开给你的费用账单，不是买家的发票。买家的发票需要去具体的订单详情里或者专门的订单发票管理模块操作。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"财税合规","二级子类":"发票开具","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-15 18:11:57","用户":"o泡果奶","群":"","用户问询":"我需要给买家开发票吗","AI响应":"一般情况下，如果买家没有特殊要求，你可以直接在卖家后台下载平台开具的官方发票 Commercial Invoice 发送给买家。\n\n如果买家需要电子发票，作为卖家，你有义务在税务服务提供商的帮助 将根据您的产品毛重和产品价格是否高于各国的包邮门槛来支付。如果价格高于门槛，您需支付全部运费，买家获得免邮；如果低于门槛，您和买家都需支付运费。","一级大类":"物流仓储","二级子类":"入库异常","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 00:13:04","用户":"星源~Z聪","群":"","用户问询":"怎么设置多件装 后台没有看到这个功能","AI响应":"在美客多后台并没有一个名为“多件装”的独立功能按钮，设置多件装通常是通过创建新的Listing来实现的。\n\n您可以按照以下步骤操作：\n\n1. 创建新Listing：在后台新建一个产品刊登，标题中明确标注数量，例如在标题末尾加上“Pack of 5”或“5 Units”。\n2. 填写包装数量：在填写产品规格参数（Technical Specifications）时，找到“Units per package”或“Units per pack”字段，填入对应的数量（如 5）。\n3. 调整价格与重量：确保定价涵盖了多件商品的成本，并根据多件装后的实际包装尺寸和重量填写物流信息，以免产生运费差异。\n4. 图片展示：建议在主图或副图中清晰展示出多件产品的集合，让买家直观看到购买的是组合装。\n\n通过这种方式，您可以将同一款产品以单件、5件、10件等不同规格分别上架，从而满足买家的批量购买需求。","一级大类":"物流仓储","二级子类":"入库异常","问题主题":"入库异常综合咨询"}]}],"category_issues":[{"二级子类":"其他","高频问题":"其他具体问题","Past 7 Days":2454,"Previous":2687,"WoW":-0.0867138072199479,"代表性问询":"您好，这边提交过，这边是还需要继续提交吗？","Past 7 Days代表性问询":"您好，这边提交过，这边是还需要继续提交吗？","Previous代表性问询":"How can I do IDS?"},{"二级子类":"税务合规","高频问题":"RFC/税号/扣税政策","Past 7 Days":667,"Previous":472,"WoW":0.413135593220339,"代表性问询":"您好，我想问下我RFC邮件已经验证过了，怎么后台审核RFC显示这样，这种是还在审核中吗","Past 7 Days代表性问询":"您好，我想问下我RFC邮件已经验证过了，怎么后台审核RFC显示这样，这种是还在审核中吗","Previous代表性问询":"我的后台RFC的状态是在审核当中，但是我上传了五天，到现在还是在审核当中，另外就是我今天早上收到了一封邮件，说在7月14号之前必须要验证成功，但是我现在的后台是审核这种情况怎么办？"},{"二级子类":"税务合规","高频问题":"税务合规综合咨询","Past 7 Days":10,"Previous":4,"WoW":1.5,"代表性问询":"平台推送给税务的数据怎么下载核对","Past 7 Days代表性问询":"平台推送给税务的数据怎么下载核对","Previous代表性问询":"这里需要填写什么语言？"},{"二级子类":"税务合规","高频问题":"产品上架/变体/SKU","Past 7 Days":4,"Previous":0,"WoW":null,"代表性问询":"你好 我们送进full仓的商品触发到平台的税务审查，现在链接被下架了，为什么会出现这种情况？","Past 7 Days代表性问询":"你好 我们送进full仓的商品触发到平台的税务审查，现在链接被下架了，为什么会出现这种情况？","Previous代表性问询":""},{"二级子类":"税务合规","高频问题":"买家纠纷/客诉/售后","Past 7 Days":3,"Previous":0,"WoW":null,"代表性问询":"你好，想请问下平台关于中国企业涉税信息报送，平台这边具体提交了什么数据给税务局呢？这些数据我们买家可以在哪里下载获取？","Past 7 Days代表性问询":"你好，想请问下平台关于中国企业涉税信息报送，平台这边具体提交了什么数据给税务局呢？这些数据我们买家可以在哪里下载获取？","Previous代表性问询":""},{"二级子类":"税务合规","高频问题":"物流发货/面单/包装","Past 7 Days":2,"Previous":1,"WoW":1,"代表性问询":"中国自发货模式，平台会把平台经营情况推送到国家税务局吗？","Past 7 Days代表性问询":"中国自发货模式，平台会把平台经营情况推送到国家税务局吗
