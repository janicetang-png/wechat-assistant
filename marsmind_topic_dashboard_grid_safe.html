词。\n\n2. **类目属性不全**：你的描述中缺少墨西哥强制要求的 **Safety code**（安全代码，如 NOM 认证信息）。如果后台属性未填全，系统会降低权重。\n\n3. **关键词缺失**：标题和描述中应加入更多高频搜索词，如 **Squishy, Fidget Toy, Juguete Sensorial**。\n\n4. **图片质量**：请确保首图为纯白底、无水印、无文字，且产品占比在 80% 以上，否则会被系统屏蔽曝光。\n\n建议先删除侵权品牌词并补全后台属性，再观察曝光变化。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 17:03:04","用户":"三十一","群":"","用户问询":"这个活动是海外仓还是自发货的","AI响应":"你好！该广告补贴活动通常针对海外仓（Full）模式卖家。自发货模式采用的是收益价格模式，系统会自动处理运费与佣金。建议你点击详情链接或联系招商经理核实具体参与资格。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 13:47:36","用户":"B.","群":"","用户问询":"墨西哥full仓，开广告的模式流程是怎样的？","AI响应":"你好！很高兴为你解答。\n\n墨西哥Full仓开启广告的流程如下：\n\n1. 确认资格：店铺需注册满15天，账户健康状态良好，且有Full仓库存。\n2. 进入后台：登录卖家后台，找到“Advertising”（广告）模块。\n3. 创建计划：点击创建新的广告计划（Campaign），选择您想要推广的Full仓产品。\n4. 设置预算：为计划设置每日最高预算限额。\n5. 设定策略：根据您的目标选择广告策略，例如“增长（Growth）”或“盈利（Profit）”。\n6. 启动监控：系统会自动根据算法在搜索结果页等位置展示您的产品，您可以根据后台数据实时调整预算和策略。\n\n网页参考资料：\nhttps://file.marsmind.cc/boot-admin/mercado/20260508/2052675802303561729.png","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 12:18:25","用户":"张学琴","群":"","用户问询":"full仓应该不需要广告投入吧","AI响应":"Full仓权限由系统根据店铺信誉等级、销售表现和合规性自动激活。虽然Full仓能提升转化，但仍需配合广告投入来增加产品曝光和竞争力。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 17:03:49","用户":"iee","群":"","用户问询":"full仓怎么设置单个优惠券","AI响应":"卖家您好，Full仓设置单个优惠券的操作路径如下：\n\n1. 登录卖家后台，进入 **Advertising**（广告/促销）模块，选择 **Promotions**（促销）。\n2. 点击 **Create new promotion**（创建新促销），选择 **Coupon**（优惠券）。\n3. 在设置页面，您可以选择针对单个 SKU 进行设置。\n4. 填写优惠券的折扣比例、有效期、预算等信息。\n5. 确认并发布。\n\n请注意，优惠券的折扣金额是由卖家承担的，建议您在设置前核算好利润空间。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-13 16:28:38","用户":"RxL","群":"","用户问询":"我们是跨境自发货店铺，并没有广告费和仓储费","AI响应":"你好！很高兴为你解答。\n\n回款金额需减去退款金额、佣金、物流费等费用。\n\n对于自发货店铺，如果回款与销售额不符，建议优先核查订单详情中的佣金比例以及是否产生了运费差额。目前无法直接判断具体原因，建议核查后台订单明细中的各项扣费项。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"}]},{"业务模块":"海外仓","高频问题":"定价/佣金/费用测算","Past 7 Days":6,"Previous":9,"WoW":-0.3333333333333333,"代表性问询":"full仓有哪些费用？","Past 7 Days代表性问询":"full仓有哪些费用？","Previous代表性问询":"海外仓模式有商家自主定价权吗？","__details":[{"时间":"2026-07-19 23:55:08","用户":"TL","群":"","用户问询":"full仓的佣金和自发货对比","AI响应":"你好！Full仓（海外仓）与自发货的佣金政策是一致的，均根据商品类目收取销售佣金。\n\n两者的主要区别在于：\n1. 自发货：采用收益价格模式，系统自动叠加国际运费与佣金生成售价。\n2. Full仓：需手动扣除佣金、尾程配送费、仓储费及可能的墨西哥税费来核算收益。\n\n网页参考资料：\nhttps://mp.weixin.qq.com/s/gLZ3iC9XLqFE4j075JaNSg?from=industrynews&version=4.1.22.6009&platform=win","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 17:39:36","用户":"三毛","群":"","用户问询":"如果是海外仓的话 什么费用呢","AI响应":"平台海外仓的费用通常包括仓储费、订单处理费、头程运费等，具体费用会根据仓库位置、商品体积和重量等因素有所不同。\n\n目前海外仓（Full）开放了墨西哥和智利两个站点。\n\n具体的费用构成如下：\n\n1. 仓储服务费\n按月收取，根据商品的尺寸和仓储时间计算。商品分为小型、中型、大型和超大/重型，每日产生相应费用，月底汇总。\n小型产品：每日收费0.0006美元。\n中型产品：每日收费0.0022美元。\n大型产品：每日收费0.0050美元。\n超大或重型产品：每日收费0.0276美元。\n注意：智利仓库的仓储费目前有折扣，在另行通知前不收取。\n\n2. 长期仓储费\n存放满4个月（120个自然日）或以上的商品将产生月度长期仓储费。\n\n3. 配送费用（尾程派送费）\n按店铺信誉等级收取，绿色等级的店铺最高可享受60%的折扣。\n\n4. 其他费用\n包括入库费、退货费、弃置或撤仓费等。\n\n海外仓卖家的收益计算公式为：\n您的实际收益 = 商品售价 - 平台销售佣金 - 税费 - 配送费用。\n目前的收益计算中暂时不扣除仓储费，仓储费会单独结算。\n\n网页参考资料：\n仓储费详情：https://global-selling.mercadolibre.com/help/15373\n配送运费详情：https://global-selling.mercadolibre.com/help/23223\n长期仓储费说明：https://global-selling.mercadolibre.com/help/15731","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 10:32:20","用户":"Tao Zhu","群":"","用户问询":"full仓有哪些费用？","AI响应":"Full仓费用主要包括：\n1. 销售佣金：根据商品类目收取。\n2. 尾程配送费：根据商品重量和尺寸计算。\n3. 仓储费：包含日常存储服务费。\n4. 长期存储费：针对存放超过120天的库存收取。\n5. 墨西哥税费：涉及RFC相关的代扣税。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-16 17:25:50","用户":"PEIING","群":"","用户问询":"墨西哥跨境full，客户退货退款费用是不是全额退回给卖家","AI响应":"不是全额退回。退货退款时，发货运费通常不退，且广告费和已发生的固定处理费也不予退还。如果商品损坏选择弃置，还会产生弃置费。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 09:20:55","用户":"焱七","群":"","用户问询":"full仓的费用是怎么算的呢","AI响应":"你好！很高兴为你解答。\n\n美客多Full仓储服务的费用主要由以下几部分构成：\n\n1. 仓储服务费：\n适用于仓库内所有商品，按月收取。费用根据商品的尺寸（小型、中型、大型、超大/重型）和每日仓储时间计算，月底汇总每日费用生成总金额。\n- 小型产品（12x15x25cm且≤18kg）：每日约 0.0006 美元。\n- 中型产品（28x36x51cm且≤18kg）：每日约 0.0022 美元。\n- 大型产品（50x60x60cm且≤18kg）：每日约 0.0050 美元。\n- 超大或重型（大于50x60x60cm或>18kg）：每日约 0.0276 美元。\n\n2. 长期存储费：\n为了优先考虑畅销商品的库存空间，存放满 4 个月（120天）或以上的商品将产生每月一次的长期仓储费。费用根据库存时长和产品尺寸变化。例如，小型产品存放 4-6 个月费用为 0.77 美元；超大重型产品存放超过 12 个月费用为 25.32 美元。\n\n3. 销售费用和运费：\n在美客多上列出产品是免费的，但每次销售时，你需要支付相应的销售佣金和尾程运费。\n\n4. 其他费用：\n还包括弃置费或撤仓费（如果你需要销毁库存或将库存退回）。\n\n目前智利仓库的仓储费已获折扣，通知前均不收取。\n\n网页参考资料：\n仓储费详情：https://global-selling.mercadolibre.com/help/15373\n运费详情：https://global-selling.mercadolibre.com/help/23223\n弃置或撤仓费：https://global-selling.mercadolibre.com/knowledge-hub/18226","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 00:01:48","用户":":-P","群":"","用户问询":"这个商品定价是低于299，并且是海外仓订单","AI响应":"根据您提供的信息和图片，针对墨西哥海外仓订单，规则如下：\n\n如果商品标价低于 299 MXN，买家将承担运费，卖家支付相应的重量运费。\n\n从您的账单截图可以看到，虽然商品定价低于包邮门槛，但您仍然支付了 3.27 美元的运费。这符合平台规定，即在售价低于 299 MXN 时，买家支付的运费会覆盖基础配送，但卖家仍需承担基于包裹毛重计算的重量运费部分。\n\n此外，由于该商品单价低于 599 MXN，在销售费用明细中，平台还会每件加收 20 MXN 的固定处理费。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"}]},{"业务模块":"海外仓","高频问题":"回款周期/提现/汇款渠道","Past 7 Days":4,"Previous":2,"WoW":1,"代表性问询":"跨境账号FULL站点怎样怎么收款账户","Past 7 Days代表性问询":"跨境账号FULL站点怎样怎么收款账户","Previous代表性问询":"墨西哥Full还有就是万里汇不可以收款吗？","__details":[{"时间":"2026-07-18 15:34:43","用户":"十六","群":"","用户问询":"跨境账号FULL站点怎样怎么收款账户","AI响应":"你好！很高兴为你解答。请先在国际收款入口绑定美元账户，刷新后台弹出本土收款入口后，再绑定墨西哥本土银行账号。\n\n网页参考资料：https://doc.weixin.qq.com/pdf/d3_ARIAagYiAMICNuiRVWHWURYOCgmT4?scode=AI8A3wfvAAogeW1VMg","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-15 16:42:15","用户":"天黑黑","群":"","用户问询":"墨西哥full暂时先绑定美金收款的影响","AI响应":"做墨西哥海外仓模式，如果暂时没有RFC，可以先绑定美金账号再绑定墨西哥本土银行账号，这样平台暂时不会代扣代缴，等后续申请到RFC后再完善即可。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-15 16:41:15","用户":"天黑黑","群":"","用户问询":"墨西哥full不绑本土收款的影响","AI响应":"如果不绑定墨西哥本土收款账户，将无法完成海外仓模式的收款配置。长期合规来看，建议先绑定美金账户，再绑定本土比索账户，以确保资金正常结算。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-15 13:56:17","用户":"张丽-深圳市雅乐电子有限公司","群":"","用户问询":"墨西哥full仓收款账号","AI响应":"做墨西哥海外仓模式，如果暂时还没有申请到RFC税号，可以先绑定非大陆/香港的美金账号，再绑定墨西哥银行账号，这样可以暂时避免代扣代缴，后续申请到税号后再进行完善。\n\n如果你已经有RFC税号，根据你登记的类型及收款账户性质，平台会适用不同的预扣税率：\n1. 已上传墨西哥本地RFC税号 + 使用本地收款账户：总预扣税率为10.5%\n2. 已上传墨西哥本地RFC税号 + 使用海外收款账户：总预扣税率为18.5%\n3. 已上传海外RFC税号 + 使用本地或海外收款账户：总预扣税率为16%\n4. 未上传任何RFC税号：总预扣税率为36%\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"}]},{"业务模块":"海外仓","高频问题":"类目/产品能否售卖","Past 7 Days":3,"Previous":5,"WoW":-0.4,"代表性问询":"已经在full仓的产品如何更换类目","Past 7 Days代表性问询":"已经在full仓的产品如何更换类目","Previous代表性问询":"派对餐巾，厨房纸巾类目只能海外仓模式发布商品吗？","__details":[{"时间":"2026-07-18 10:39:02","用户":"菠萝蟑螂","群":"","用户问询":"已经在full仓的产品如何更换类目","AI响应":"已经在Full仓的产品，如果需要更换类目，通常在卖家后台的Listing编辑页面进行操作。当您在卖家后台开始编辑商品并输入产品标题或关键词时，系统会通过类目预测器推荐正确的类目。\n\n此外，在选择类目时，建议您同时参考平台在售的同类型产品所在的类目，以确保选择最为精准。\n\n网页参考资料：\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260125/166fca879b5844ddb33c70275e2ba08b.png","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-17 17:27:34","用户":"KEY","群":"","用户问询":"类目是物体查找器，对比墨西哥full和智利full的市场对比、费用结构、类目数据等数据","AI响应":"针对物体查找器类目，墨西哥和智利Full模式对比参考如下：\n\n1. 市场对比\n墨西哥：市场规模大，消费力强，是跨境卖家的核心站点，竞争相对激烈。\n智利：属于蓝海市场，注重利润和品牌化，环境较稳定，适合寻求稳健增长的卖家。\n\n2. 费用结构\n佣金：墨西哥海外仓佣金通常为17%（含税）；智利佣金根据类目不同约在12%-15%左右。\n仓储费：墨西哥Full仓包含存储服务费和超过120天的长期存储费；智利仓库目前仓储费全免（另行通知前不收取）。\n配送费：墨西哥299 MXN以上卖家包邮，以下买家付运费；智利同样存在免邮门槛及基于重量的配送费。\n\n3. 类目数据\n物体查找器在两站均属于电子配件类。墨西哥流量倾斜大，转化率高；智利虽流量稍小，但目前仓储成本极低，利润空间相对更大。\n\n网页参考资料\n墨西哥运费：https://global-selling.mercadolibre.com/help/40025\n智利运费：https://global-selling.mercadolibre.com/help/18500","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-17 11:23:10","用户":"Adelina Yang","群":"","用户问询":"我还想详细了解一下贵平台。想对平台流量，我们产品所属类目流量，用户人群，类目，平台优势、特点等想了解了解。还有我们如果做，是做海外仓模式还是自发货模式，还是两个都做，目前我们在亚马逊是FBA和自发货都做的。比例大致是6比4。单店铺月销100万美金上下，我们有2个自有品牌，4个店铺","AI响应":"你好！很高兴为你解答。\n\n美客多是拉美最大的电商平台，流量稳居第一。用户人群覆盖墨西哥、巴西、智利等核心市场，消费力强且对中国品牌接受度高。\n\n**平台优势与特点：**\n1. **流量倾斜：** 海外仓（Full）模式产品自带标识，转化率远高于自发货。\n2. **定价简便：** 采用收益价格模式，系统自动计算运费佣金，无需人工核算。\n3. **税务优势：** 跨境店自发货或美仓模式无需RFC税号。\n\n**模式建议：**\n鉴于您在亚马逊有成熟的FBA和自发货经验，且单店月销达100万美金，建议您**两种模式同步开展**：\n- **海外仓模式：** 针对您的自有品牌和爆款，利用Full仓提升物流时效和流量权重，对标亚马逊FBA。\n- **自发货模式：** 用于新品测款或长尾产品，灵活上架，无需提前备货。\n\n**入驻准备材料：**\n1. 中国内地或香港公司营业执照（有限公司）。\n2. 法人身份证及人脸识别。\n3. 第三方收款账户。\n4. 谷歌/Outlook/阿里云邮箱。\n5. 品牌R标或TM标。\n\n普通自发货/海外仓也可选择自注册（PC端登入）：https://global-selling.mercadolibre.com/landing/about","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"}]},{"业务模块":"自发货","高频问题":"发货/物流/运费/尾程","Past 7 Days":30,"Previous":24,"WoW":0.25,"代表性问询":"自发货怎么计算运费？","Past 7 Days代表性问询":"自发货怎么计算运费？","Previous代表性问询":"自发货物流费如何收取？","__details":[{"时间":"2026-07-19 14:20:34","用户":"灯火星星","群":"","用户问询":"自发货模式中，运费从哪一段开始算起？是卖家把商品发到国内的中转仓开始吗？","AI响应":"你好！很高兴为你解答。自发货运费主要指国际段运费，即从美客多国内集运仓运往目的国买家的全程费用。卖家需要自行承担将货物送达国内集运仓的头程转运费。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-19 14:17:59","用户":"灯火星星","群":"","用户问询":"自发货怎么计算运费？","AI响应":"你好！很高兴为你解答。自发货运费按货件毛重计收，直接与平台结算。售价高于包邮门槛的商品由卖家支付运费，低于门槛则由买家承担。平台采用收益价格模式，你只需输入目标净收益，系统会自动叠加运费和佣金生成售价。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-19 13:53:02","用户":"萤火虫","群":"","用户问询":"如果我有自发货和一件代发，我后台物流揽收方式怎么填","AI响应":"美客多后台的物流揽收方式是**针对全店自发货订单统一设置**的，无法针对单个订单分别设置。\n\n如果你的货源既有自己的库存，又有一件代发，建议按以下逻辑设置：\n\n1. **设置路径**：Selling Preferences > Dispatch Methods > Select dispatch methods。\n2. **选择方式**：\n   - **若你的货源地和代发货源地都在菜鸟揽收范围内**：建议选择 **Pick Up（上门取货）**。\n   - **若地址不统一或不在范围内**：建议选择 **Drop Off（卖家自寄）**。\n3. **操作建议**：\n   - **自有货源**：你自己打包贴单后，通过国内快递寄往菜鸟仓。\n   - **一件代发**：让代发供应商帮你打印美客多面单并贴好，由供应商直接寄往菜鸟仓。\n\n**核心原则**：无论哪种方式，最终都必须使用美客多后台生成的菜鸟面单，并确保包裹在出单后 **72小时（工作日）** 内送达菜鸟仓并完成扫描上网。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-19 12:48:48","用户":"啊楼🍉","群":"","用户问询":"自发货长62cm,宽12cm,能发货吗","AI响应":"你好！不能发货。自发货包裹的最长边限制为60cm，你的包裹长度为62cm，已超过菜鸟物流的尺寸限制。\n\n网页参考资料：\nhttps://global-selling.mercadolibre.com/help/dimensiones-paquetes-cainiao_37370","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-19 12:01:33","用户":"品牌（出口版）","群":"","用户问询":"哦哦 我现在自行发货 所以不太需要对吧","AI响应":"是的，自发货模式目前不需要提供RFC税号，也不涉及墨西哥36%的增值税代扣。您可以先激活店铺跑自发货，后续如果转海外仓模式再办理即可。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-18 21:02:48","用户":"灯火星星","群":"","用户问询":"就是自发货和海外仓模式都集中在了一个站点下，可以安排自发货也可以通过海外仓发货吗？","AI响应":"你好！很高兴为你解答。是的，美客多支持卖家从自发货模式转为海外仓（FULL）模式，或者两种模式同时运营。海外仓可以根据卖家需求在后台自动激活，申请下来不激活也不影响店铺只做自发货。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-18 17:26:49","用户":"BUZZ","群":"","用户问询":"自发货出单如何发货和打包","AI响应":"自发货出单后，需在48个工作小时内送达首公里仓。\n\n发货流程：\n1. 确认物流：由菜鸟承接，可选择上门揽收或自行寄送至菜鸟仓库。\n2. 设置路径：Selling Preferences > Dispatch Methods。\n3. 打印面单：24小时内打印10*15cm热敏纸面单，确保清晰。\n\n打包要求：\n1. 包装：建议使用包裹袋并用紫色扎带封口，避免使用纸箱。\n2. 贴标：面单平整粘贴，勿覆盖、褶皱或重复使用。\n3. 保护：易碎品需充分保护。\n\n网页参考资料：\n发货打包指引：https://global-selling.mercadolibre.com/help/42016\n菜鸟自寄仓库地址：https://global-selling.mercadolibre.com/help/cainiao-warehouses-drop-off_36979","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-18 09:56:58","用户":"穎","群":"","用户问询":"我想知道我们自发货的物流成本","AI响应":"美客多自发货的开店成本主要由以下几部分构成：\n\n主要成本构成：https://global-selling.mercadolibre.com/help/31800\n\n1.产品销售成本：您采购产品的进货成本\n\n2.平台佣金：根据不同产品类目和销售站点，佣金比例通常在 16% - 22% 之间。您可以通过官方链接查询具体类目的费率。（https://global-selling.mercadolibre.com/landing/selling-fee）\n\n3.物流费用：这是自发货的核心成本，主要包括：\n• 国内头程转运费：将货物从您的仓库运至跨境物流商揽收仓的费用。\n• 跨境运费：从中国运往目的国买家的全程物流费用。自2025年9月1日起，自发货官方物流模式主要由菜鸟承运。各站点的具体运费标准可通过官方链接查询。 （https://global-selling.mercadolibre.com/help/31800）\n• 营销费用：您为推广产品而投入的广告等营销活动产生的费用。\n\n特别费用提醒：\n1.各站点上架产品价格限制一览：https://global-selling.mercadolibre.com/help/22799\n2.包邮门槛：平台为各站点设定了免运费门槛。如果您的产品售价高于该门槛，您需要承担海外段物流费；如果售价低于门槛，则该段运费通常由卖家和平台承担。具体门槛金额请以卖家后台显示的各站点当地货币为准。（以墨西哥为例：https://global-selling.mercadolibre.com/help/shipping-costs-envio-cainiao-mexico_41817）\n3.低价产品附加费：如果您的产品售价低于免邮门栏，平台可能会收取一笔额外的操作费。（https://global-selling.mercadolibre.com/help/tarifas-venta-costo-adicional_17600）\n\n4.实用工具推荐\n您可以使用官方提供的利润计算器来更精确地估算最终收益（https://global-selling.mercadolibre.com/help/41742）\n\n网页参考资料：\n墨西哥站点菜鸟运费查询表：https://global-selling.mercadolibre.com/help/shipping-costs-envio-cainiao-mexico_41817","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 17:23:14","用户":"ㅤ  ㅤ","群":"","用户问询":"就是自发货模式我的揽收地址在菜鸟的免费揽收范围内的话 这段没有费用 也就是我只需要知道从菜鸟到墨西哥买家手中的这段历程的国际运费是吗","AI响应":"你好！是的，如果你的地址在菜鸟免费揽收范围内，国内段就没有费用。你只需要关注从菜鸟仓库到买家手中的国际段运费。\n\n自发货运费按货件毛重计收，你可以通过官方链接查询各站点运费标准：https://global-selling.mercadolibre.com/help/31800","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 17:15:19","用户":"骑着毛驴去拉萨","群":"","用户问询":"自发货，到达目的地了 然后派送不了 运费是卖家出吗 售价20美金","AI响应":"你好！售价20美金（约合400比索）已超过墨西哥299比索的包邮门槛，因此发货运费由卖家承担。若因买家原因导致派送失败，运费不予退还。自发货运费按货件毛重计收，直接与平台结算。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 16:52:49","用户":"ㅤ  ㅤ","群":"","用户问询":"那我想问自发货模式除了物流时效和半托管不同还有平台佣金还有流量扶持不同还有其他不同的吗","AI响应":"你好！除了你提到的差异，主要区别还包括：\n1. 仓储费：自发货无仓储费；半托管目前也暂无仓储费。\n2. 运营标识：半托管产品带Full标，享有更高流量权重；自发货没有。\n3. 配送责任：自发货需卖家送货至国内集运仓；半托管需提前备货至东莞仓。\n4. 售后处理：半托管由平台负责尾程配送及相关售后，自发货需卖家更多参与。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 16:19:26","用户":"ღ ᥫᩣ🐭","群":"","用户问询":"广州白云鹤龙路有美客多full仓直发的物流公司电话吗","AI响应":"你好！很高兴为你解答。目前我这里没有特定区域（如广州白云鹤龙路）物流公司的具体联系电话。建议你咨询为你开店的招商经理，或在美客多官方卖家群、行业社群中寻找推荐。选择货代时，请务必确认其具备美客多官方海外仓（Full）的送仓资质。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 13:28:51","用户":"海盜","群":"","用户问询":"自发货 商品发货包装可以用纸箱包装吗","AI响应":"可以的。自发货模式下，您可以使用纸箱进行包装。请确保包装能够保护商品在运输过程中不受损坏，并符合菜鸟的尺寸和重量限制（如最长边≤60cm，重量≤15kg）。同时，请务必在平整面上粘贴好清晰的物流标签。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 17:17:01","用户":"小火鸡","群":"","用户问询":"有没有六个站点自发货物流运费计算标准","AI响应":"你好！很高兴为你解答。\n\n美客多各站点的自发货运费均按货件毛重计收，直接与平台结算。\n\n目前美客多主要面向中国跨境卖家开放的自发货站点包括墨西哥、巴西、智利、哥伦比亚和阿根廷。以下是各站点的官方运费查询参考链接：\n\n墨西哥站点：https://global-selling.mercadolibre.com/help/shipping-costs-envio-cainiao-mexico_41817\n巴西站点：https://global-selling.mercadolibre.com/help/shipping-fee-cainiao-costos-brasil_41814\n智利站点：https://global-selling.mercadolibre.com/help/shipping-fees-chile-cainiao_38716\n哥伦比亚站点：https://global-selling.mercadolibre.com/help/shipping-fees-colombia-cainiao_37289\n阿根廷站点：https://global-selling.mercadolibre.com/help/costos-envio-argentina-cainiao_42837\n\n如果您需要计算具体订单的运费成本，推荐使用官方的利润计算器进行测算：https://global-selling.mercadolibre.com/listings/cost-calculator\n\n另外，建议您登录卖家后台实时查看系统分配的具体承运商及费用明细，因为实际承运物流商由平台系统根据订单情况自动分配。\n\n网页参考资料\n自发货官方运费说明文档：https://global-selling.mercadolibre.com/help/17557","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 16:11:31","用户":"sks","群":"","用户问询":"发货呢，自发货流程","AI响应":"你好！自发货核心流程如下：\n1. 确认物流：由菜鸟（Cainiao）承接。\n2. 设置方式：在后台选择上门揽收或自行寄送至菜鸟仓。\n3. 包装贴标：按官方指南完成商品包装。\n4. 扫描上网：务必在72小时（工作日）内完成仓库扫描上网。\n\n网页参考资料：\nhttps://mp.weixin.qq.com/s/Qf9MIrB0QXMq58aeUUMbPg","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 13:44:22","用户":"X.wang","群":"","用户问询":"现在的自发货标签和以前的不一样，递四方扫描不出来，说是他们不收了，这种情况需要怎么处理，有其他的快递来揽收吗？这是现在的标签","AI响应":"你好！目前美客多自发货物流已全面切换为**菜鸟物流**，你提供的面单正是菜鸟的面单，递四方确实不再处理此类包裹。\n\n请按以下步骤处理：\n1. **核实揽收范围**：请通过以下链接查询你的地址是否在菜鸟揽收范围内：https://cainiao.4px.com/site/helpDetailsLs\n2. **上门揽收**：如果在范围内，请在后台设置 Pick Up（上门揽收），由菜鸟安排人员上门。\n3. **卖家自寄（Drop Off）**：如果不在揽收范围，你需要自行将包裹寄送至菜鸟指定的国内扫码仓，运费需自行承担。\n\n**面单打印要求**：\n- 请务必使用 **10*15cm** 的热敏纸打印。\n- 确保条码清晰、无褶皱、无遮挡，且不要在热敏纸上粘贴透明胶带，以免字迹模糊导致仓库无法扫描。\n\n网页参考资料：\nhttps://global-selling.mercadolibre.com/knowledge-hub/15573","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-16 10:44:41","用户":"孫明山","群":"","用户问询":"美客多自发货，买家拒收后包裹退回，物流费由谁承担？","AI响应":"你好！很高兴为你解答。\n\n自发货模式下，如果买家拒收导致包裹退回，发去国内集运仓的费用以及官方物流尾程运费仍由卖家承担。自发货运费均按货件毛重计收，直接与平台结算。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 21:36:06","用户":"陈雷","群":"","用户问询":"请问自发货是怎么联系物流的","AI响应":"自发货物流统一由菜鸟承接。出单后，您需在后台设置发货方式：选择上门揽收（需在服务范围内）或自行寄送至菜鸟仓库。物流商扫描包裹后，订单状态会自动更新。\n\n网页参考资料：\n添加发货方式：https://global-selling.mercadolibre.com/addresses/withdrawals/add-dispatch\n菜鸟自寄仓库地址：https://gpn.cainiao.com/global/portal/productservice?slug=af63clngtvt0ggps","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 17:47:23","用户":"","群":"","用户问询":"我找货代发货也是自发货对吧","AI响应":"是的，如果您通过货代将包裹送达美客多指定的菜鸟集运仓，也属于自发货模式。后续的国际段运输仍由平台官方物流承运。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 16:49:44","用户":"秋天","群":"","用户问询":"自发货的物流时效一般是多少？","AI响应":"自发货订单要求72小时（工作日）上网。您需在48小时内送达物流商仓库，物流商在24小时内完成扫描入库。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 16:13:11","用户":"************金","群":"","用户问询":"我之前入住的应该是个半托管。我先把这个发货模式能切换成自发货吗？","AI响应":"你好！半托管和自发货是两种独立的物流模式，目前无法直接切换。如果你想做自发货，需要使用不同的邮箱重新注册一个自发货账户，分开店铺进行运作。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 14:11:16","用户":"番茄🍅","群":"","用户问询":"自发货物流是自己承担吗","AI响应":"在自发货模式下，商家承担的物流费用包括发往国内集运仓的费用以及官方物流的尾程运费。\n\n自发货运费按货件毛重计收，直接与平台结算，你可以在卖家后台查看运费账单。\n\n关于运费的承担方，主要取决于商品的售价：\n如果商品标价低于299 MXN，运费由买家承担。\n如果商品标价等于或高于299 MXN，则由卖家支付运费。\n\n在定价时，美客多自发货采用收益价格模式，你只需录入目标净收益，系统会自动叠加运费与佣金生成最终售价，无需人工计算运费。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 11:38:38","用户":"蓝天白云","群":"时骏科技-美客多助手","用户问询":"@美客多小助手萝拉 我上了巴西站点，我是自发货，应该都是有开启巴西站点的配送服务啊","AI响应":"请前往卖家后台 Selling Preferences -> Dispatch Methods 检查物流设置。发货地址务必填写完整准确，并确认在菜鸟揽收范围内。\n\n目前巴西站点自发货采用净收益模式，您不需要自己去计算复杂的运费模版。您只需要在后台录入您的目标净收益，也就是您的采购成本加上您想赚取的利润，平台系统就会根据产品的重量，自动为您叠加运费和销售佣金，从而生成买家在前台看到的最终售价。\n\n如果您想了解具体的运费标准，可以参考巴西站点的菜鸟运费查询表：https://global-selling.mercadolibre.com/help/shipping-fee-cainiao-costos-brasil_41814","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 16:04:02","用户":"波波波pewpewpew突突突","群":"","用户问询":"你好，自发货的运费价格表哪里可查看","AI响应":"你好！很高兴为你解答。自发货运费按货件毛重计收，你可以在卖家后台查看。各站点具体菜鸟运费表请参考以下链接：\n\n墨西哥：https://global-selling.mercadolibre.com/help/shipping-costs-envio-cainiao-mexico_41817\n巴西：https://global-selling.mercadolibre.com/help/shipping-fee-cainiao-costos-brasil_41814\n智利：https://global-selling.mercadolibre.com/help/shipping-fees-chile-cainiao_38716\n哥伦比亚：https://global-selling.mercadolibre.com/help/shipping-fees-colombia-cainiao_37289\n阿根廷：https://global-selling.mercadolibre.com/help/costos-envio-argentina-cainiao_42837","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 15:17:15","用户":"ㅤ  ㅤ","群":"","用户问询":"自发货模式的尾程费用是如何计算","AI响应":"你好！美客多自发货运费均按货件毛重计收，直接与平台结算。售价低于包邮门槛的商品运费由买家承担，高于门槛的则由卖家支付。您只需录入目标净收益，系统会自动叠加运费与佣金生成最终售价。具体账单可于卖家后台查看。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 11:15:58","用户":"肖丽娟｜Sherilyn@大数跨境","群":"","用户问询":"美客多自发货可以自己安排国际物流直邮到买家手上吗","AI响应":"你好！美客多自发货模式不支持卖家自行安排国际物流直邮给买家。卖家必须将包裹发送至美客多指定的国内集运仓（如菜鸟仓），由平台指定的物流承运商负责跨境运输及最后一公里的派送。\n\n网页参考资料：\nhttps://global-selling.mercadolibre.com/landing/shipping","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 11:40:26","用户":"啊楼🍉","群":"","用户问询":"自发货是不是500G以下按重量？售价运费不足的会从我的账户扣除对吧","AI响应":"你好！美客多各站点的自发货运费均按货件毛重计收。\n\n关于运费扣除规则如下：\n1. 平台结算确实是从您的总账户扣除的。\n2. 售价低于包邮门槛的商品运费由买家承担，卖家只需为售价高于包邮门槛的商品支付运费。\n3. 如果买家支付的运费不足以覆盖实际产生的运费，差额部分会从您的账户中扣除。\n\n您可以在卖家后台查看详细的运费账单明细。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 11:33:33","用户":"风儿掠过波西米亚的草原","群":"","用户问询":"我TEMU店铺jit模式有5个店铺 你好，我已经有美客多自发货店铺","AI响应":"你好！既然你已有美客多自发货店铺，且拥有多个TEMU JIT模式店铺的供应链优势，建议你通过以下方式尝试：\n\n1. 内部升级：若你现有美客多店铺表现优异，可联系对接的客户经理，沟通是否能基于现有店铺表现及TEMU的综合实力申请开通全托管。\n\n2. 资料整合：全托管模式通常看重整体供应链实力，你可以尝试将多个TEMU店铺的流水汇总，作为实力的证明提交申请。\n\n全托管申请表单：http://kks.ink/ss/vKx9ph/d12030","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 11:16:37","用户":"萤火虫","群":"","用户问询":"我美客多出单了 怎么发货呀 自发货模式的】","AI响应":"你好！美客多自发货模式发货流程如下：\n\n1. 确认物流：目前统一由菜鸟（Cainiao）承接。\n2. 处理订单：出单后在后台打印物流面单，按照官方指南进行商品包装和贴标。\n3. 寄送货物：你可以选择上门揽收（需在服务范围内）或自行寄送至菜鸟仓库。\n4. 扫描上网：务必在工作日72小时内确保包裹送达仓库并被扫描上网，否则订单可能被取消。\n\n网页参考资料：\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260125/8fc8936f8bbc49dd8c309e801d7cbf43.png","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 09:31:44","用户":"a","群":"","用户问询":"墨西哥自发货，菜鸟运费查询表","AI响应":"墨西哥站点菜鸟运费查询表链接如下：\nhttps://global-selling.mercadolibre.com/help/shipping-costs-envio-cainiao-mexico_41817\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"}]},{"业务模块":"自发货","高频问题":"开通/入驻/审核进度","Past 7 Days":15,"Previous":33,"WoW":-0.5454545454545454,"代表性问询":"自发货和半托是两个申请入口吗","Past 7 Days代表性问询":"自发货和半托是两个申请入口吗","Previous代表性问询":"我跨境自发货的账户刚审核通过，还没有上品，怎么查找店铺","__details":[{"时间":"2026-07-18 15:57:17","用户":"野海","群":"","用户问询":"如果先注册自发货，后续还能不能更改为海外仓","AI响应":"你好！很高兴为你解答。\n\n美客多支持卖家从自发货模式转为海外仓（FULL）模式，或者两种模式同时运营。\n\n在卖家填写的材料审核完成后，可以在后台选择是否激活海外仓账户。卖家可以根据实际需求申请激活海外仓，打开“Activate Fulfillment”按钮即可。\n\n网页参考资料：\nhttps://www.douyin.com/video/7478234269479914764","一级大类":"账号入驻与安全","二级子类":"入驻流程","问题主题":"入驻/注册/开店流程"},{"时间":"2026-07-18 15:49:46","用户":"perfect","群":"","用户问询":"想请教一下，我想入驻咱们自发货工贸一体店铺","AI响应":"你好！工贸一体FTI模式入驻门槛如下：\n1. 近12个月跨境平台单账号或2个账号流水总额 > 30万美金（需含全托/半托流水）。\n2. 需为自有工厂或深度合作工厂。\n3. 具备全托管或半托管经验。\n4. 需满足出单后48小时内发货至集运中心。\n5. 需自行定价及运营，接受核价。\n\n工贸一体入驻绿通：https://mp.weixin.qq.com/s/1E72a6vF11R59FV4pf2OCg","一级大类":"账号入驻与安全","二级子类":"入驻流程","问题主题":"入驻/注册/开店流程"},{"时间":"2026-07-17 08:58:35","用户":"窦红建","群":"","用户问询":"我是新入驻的商家，目前是美客多墨西哥自发货跨境站点和full站点，还没有出单，如果自发货站点出了10单，是不是full站点也能开通广告账户了？","AI响应":"你好！很高兴为你解答。\n\n对于自发货VIP店铺，2026年的广告开启门槛已经全面更新，更加利好新卖家。\n\n根据最新的规则，自发货店铺开启广告**不需要出满10单**，具体的门槛如下：\n1. **销售门槛**：无任何出单要求！只要保持有链接在售即可。\n2. **注册时长**：店铺注册满15天。\n3. **卖家信誉**：无任何店铺信誉要求（不需要出单积累信誉）。\n4. **账户健康**：无逾期账单。\n\n所以，只要你的店铺注册满15天且有在售链接，就可以开启广告工具来撬动流量，实现从0到1的突破。\n\n需要注意的是，Full站点的广告权限通常是随着店铺整体广告权限开启的。如果你是自发货VIP客户，达到上述15天的要求即可尝试开启。\n\n网页参考资料：\n自发货VIP店铺广告门槛：https://file.marsmind.cc/boot-admin/mercado/20260508/2052675802303561729.png","一级大类":"账号入驻与安全","二级子类":"入驻流程","问题主题":"入驻/注册/开店流程"},{"时间":"2026-07-16 09:49:02","用户":"Stitch-Beryl","群":"","用户问询":"一个营业执照可以开通多少各自发货的中国跨境店铺","AI响应":"一个营业执照只能开一个店铺。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 15:41:00","用户":"l n n y","群":"","用户问询":"自发货和半托是两个申请入口吗","AI响应":"是的，自发货和半托管是两个独立的申请入口。\n\n普通自发货/海外仓也可选择自注册（PC端登入）：https://global-selling.mercadolibre.com/landing/about\n\n半托管则需要通过专门的托管申请链接进行登记，由经理审核后邀约入驻。\n\n入驻准备材料：\n1. 法人身份证正反面照片\n2. 营业执照彩色扫描件/照片（需与身份证法人一致）\n3. 准确的联系方式（手机号及常用邮箱）","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 14:58:33","用户":"Yvonne Wang","群":"","用户问询":"我是在公众号上注册自发货模式，没有招商经理，给我 户外运动 渔具类目的招商经理联系方式","AI响应":"自注册账号默认没有分配专属客户经理。目前无法直接提供特定类目经理的联系方式，建议通过官方客服反馈审核进度。\n\n若您符合FTI项目要求、IDS PRO项目资质，或通过提升业绩触发系统分配，可对接到招商经理。\n\nFTI项目申请：https://doc.weixin.qq.com/forms/AI8A3wfvAAoAZAAaQazAKgCNI0iZoEFqf?page=1\n\nIDS PRO项目详情：https://mp.weixin.qq.com/s/SOextL25EnZqMxGr09tSWQ","一级大类":"账号入驻与安全","二级子类":"入驻流程","问题主题":"入驻/注册/开店流程"},{"时间":"2026-07-15 12:05:09","用户":"JOJO","群":"","用户问询":"你好 ，先注册自发货模式的是在这里申请吗","AI响应":"你好！普通自发货/海外仓也可选择自注册（PC端登入）：https://global-selling.mercadolibre.com/landing/about\n\n入驻准备材料：\n1. 公司营业执照原件照片\n2. 法人身份证原件照片（需人脸识别）\n3. 美金或第三方收款账户（如Payoneer、PingPong等）\n4. 常用联系邮箱（建议使用Gmail或Outlook）","一级大类":"账号入驻与安全","二级子类":"入驻流程","问题主题":"入驻/注册/开店流程"},{"时间":"2026-07-15 08:50:25","用户":"骑着毛驴去拉萨","群":"","用户问询":"自发货VIP店铺怎么申请 需要什么条件","AI响应":"你好！自发货VIP店铺（也称为自发货精品店铺）是平台针对具备优质货源和运营能力的卖家提供的专项扶持模式。\n\n申请自发货VIP店铺通常需要满足以下条件：\n1. 垂直类目深耕：建议店铺经营类目单一且垂直，具备较强的供应链优势。\n2. 优质货源：产品质量过硬，且具备一定的品牌属性或差异化竞争优势。\n3. 运营能力：卖家需要具备成熟的跨境电商运营经验，能够保证发货时效和售后服务质量。\n4. 业绩表现：如果是现有店铺申请转VIP，通常会对近期的单量、转化率及店铺信誉有一定要求。\n\n申请路径：\n该模式目前主要通过招商经理进行定向邀约或审核申请。如果你已经入驻，建议联系你的客户经理提交申请资料；如果你尚未入驻，可以在入驻申请时说明你的供应链优势，由招商团队进行评估。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 02:03:39","用户":".","群":"","用户问询":"普通自发货 多久能注册好 审核时间多久","AI响应":"你好！很高兴为你解答。\n\n普通自发货模式的审核时间一般在5-7个工作日内处理完成。\n\n如果资料提交后超过20个工作日状态仍未更新，建议你联系经理或检查邮箱附件是否违规。\n\n目前普通自发货模式不需要流水，你可以直接通过以下链接进行自主注册：\nhttps://global-selling.mercadolibre.com/landing/about\n\n入驻准备材料：\n1. 营业执照：中国大陆（三证合一）或中国香港营业执照。\n2. 法人身份证：正反面彩色扫描件。\n3. 注册邮箱：建议使用Gmail、Outlook等海外邮箱。\n4. 店铺名称：英文名称，不可包含Mercado字样。","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"入驻/注册/开店流程"},{"时间":"2026-07-14 21:52:08","用户":"柯培鑫","群":"","用户问询":"注册全托管店铺邮箱和手机号码，能不能跟跨境自发货一样","AI响应":"不可以。\n\n注册全托管店铺的**邮箱和手机号码必须是全新的**，不能与你已经注册过的跨境自发货店铺（Global Selling）或海外仓店铺重复。\n\n**具体要求如下：**\n1. **邮箱**：必须使用从未在美客多注册过任何店铺的新邮箱。建议使用 Gmail、Outlook、Hotmail 或 Yahoo 邮箱。\n2. **手机号**：必须使用从未在美客多平台绑定过的新手机号，用于接收验证码和招商经理联系。\n\n如果使用重复的邮箱或手机号，系统会识别为重复入驻，可能导致申请被驳回或无法正常创建新账号。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-14 13:43:40","用户":"小火鸡","群":"","用户问询":"申请成为美客多品牌方自发货 · VIP品牌新星计划要求是什么，还没注册美客多的公司可以申请吗","AI响应":"你好！很高兴为你解答。\n\n美客多【自发货 · VIP品牌新星计划】主要面向具备品牌实力的卖家，具体要求如下：\n\n1. 品牌资质：必须拥有R标或TM标。\n2. 业务规模：需要近12个月跨境电商平台单账号或2个账号流水总销售额大于30万美金。\n3. 经营模式：主要针对工贸一体（FTI）或具备强供应链能力的品牌卖家。\n\n关于您的疑问，还没注册美客多的公司是可以申请的。该计划本身就是针对“新卖家”的入驻激励政策，旨在帮助优质品牌方快速入驻并获得资源扶持。\n\n如果您符合上述流水和品牌要求，可以通过招商经理渠道进行内邀入驻申请。若不符合流水要求，您也可以先通过自注册渠道开启普通自发货模式。\n\n普通自发货/海外仓也可选择自注册（PC端登入）：https://global-selling.mercadolibre.com/landing/about\n\n入驻准备材料：\n1. 中国大陆或香港公司营业执照。\n2. 法人身份证及人脸识别。\n3. 第三方美金收款账户。\n4. 海外常用邮箱（如Gmail）。\n5. 跨境平台流水证明（仅VIP/FTI模式需要）。","一级大类":"账号入驻与安全","二级子类":"入驻流程","问题主题":"入驻/注册/开店流程"},{"时间":"2026-07-14 10:44:48","用户":"小火鸡","群":"","用户问询":"开通美客多跨境店铺自发货模式需要准备哪些资料","AI响应":"你好！很高兴为你解答。\n\n开通美客多跨境店铺自发货模式需要准备以下资料：\n\nA. 中国内地或香港公司营业执照：不接受个体户，必须是“有限公司”或“有限责任公司”。\nB. 法人身份证：法人需配合人脸识别认证。\nC. 收款的银行账户：美金银行账户或第三方收款账户（如PingPong、派安盈、连连支付等）。\nD. 邮箱及联系人电话：不接受163、QQ、新浪等国内邮箱，请使用 Gmail、Outlook、Aliyun、Hotmail 或 Foxmail 邮箱，以免无法收到注册链接。\nE. 品牌店资料：如果是申请品牌店，还需提供R标或TM标。\n\n目前普通自发货模式不需要提供流水，您可以直接申请。\n\n普通自发货/海外仓也可选择自注册（PC端登入）：https://global-selling.mercadolibre.com/landing/about\n\n入驻准备材料：\n1. 中国内地或香港公司营业执照（有限公司性质）。\n2. 法人身份证及人脸识别配合。\n3. 第三方美金收款账户。\n4. 海外常用邮箱（如Gmail）。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 19:17:52","用户":"沛霖","群":"","用户问询":"有招商经理吗？就是我们现在好多问题都是找同行那边帮忙处理的，比如自发货员工运费计算错误，然后需要不影响店铺的情况下取消订单，诸如此类的情况","AI响应":"自注册账号默认无客户经理，日常运营问题由官方客服支持。若需对接经理，可申请FTI项目（需流水门槛）、报名IDS PRO服务，或通过提升业绩触发系统自动分配。运费及订单问题建议优先通过后台官方客服渠道反馈处理。","一级大类":"其他","二级子类":"系统报错","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 11:20:07","用户":"阿伟","群":"","用户问询":"有自发货的招商经理吗 我有个朋友准备做自发货 有点搞不懂想问问","AI响应":"你好！很高兴为你解答。\n\n自注册账号默认没有分配专属客户经理，日常的运营问题主要由美客多官方客服提供支持。如果你的朋友想要入驻自发货模式，可以选择自注册，但无法获得经理流量扶持。\n\n普通自发货/海外仓也可选择自注册（PC端登入）：https://global-selling.mercadolibre.com/landing/about\n\n如果你的朋友希望对接到招商经理，目前有以下三种形式：\n\n第一，如果符合FTI(工贸一体)项目要求，可以申请入驻。FTI是美客多的一种托管项目模式，享受佣金补贴和流量扶持。\n入驻门槛包括：\n1. 近12个月内，跨境电商平台单账号或两个账号流水总销售额需大于30万美元，且至少有一个账号流水来自全托管或半托管模式平台。\n2. 具备自有工厂或者与工厂有深度合作关系。\n3. 具备全托管或半托管模式的经验。\n4. 需满足出单后48小时内发货要求。\n申请链接：https://doc.weixin.qq.com/forms/AI8A3wfvAAoAZAAaQazAKgCNI0iZoEFqf?page=1\n\n第二，关注美客多高阶卖家成长服务（IDS PRO）。该项目专为有意向深耕自发货业务的优质卖家打造，提供官方运营诊断和策略建议。\n入驻门槛包括：\n1. 已入驻美客多自发货业务。\n2. 单店铺全站点周流水大于等于2000美元。\n3. 店铺信誉良好。\n详情请查看：https://mp.weixin.qq.com/s/SOextL25EnZqMxGr09tSWQ\n\n第三，如果未满足以上条件，也可以通过提升销售业绩来触发系统自动分配经理。\n\n目前我无法直接提供特定经理的个人联系方式，建议先通过官方渠道了解和入驻。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 10:16:14","用户":"意盛","群":"","用户问询":"我现在申请的是半托模式 可以改为自发货吗","AI响应":"目前无法直接在后台更改模式。半托管和自发货是独立的入驻通道，建议您联系对接的招商经理说明情况，或重新通过自发货链接提交申请。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"}]},{"业务模块":"自发货","高频问题":"RFC/税号是否必需/扣税影响","Past 7 Days":13,"Previous":8,"WoW":0.625,"代表性问询":"你好，请问美客多自发货需要注册提交巴西墨西哥税号那些吗、","Past 7 Days代表性问询":"你好，请问美客多自发货需要注册提交巴西墨西哥税号那些吗、","Previous代表性问询":"自发货现在是也要求rfc了吗","__details":[{"时间":"2026-07-19 16:07:36","用户":"yixiR","群":"","用户问询":"美客多自发货的话，墨西哥站是扣税多少？是设定净收入后平台呈现的售价里已经自动算进去扣税了，还是说在输入净收入的时候就得注意这个问题？","AI响应":"自发货模式下，目前不涉及墨西哥36%的增值税代扣。\n\n美客多采用收益价格模式（Net Proceeds），您只需在后台录入目标净收益（采购成本+利润），系统会自动叠加运费、佣金及相关税费生成最终售价，无需您人工计算并加入。最终前端显示给消费者的价格是包含税费的，由买家承担。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-18 16:03:56","用户":"ㅤ  ㅤ","群":"","用户问询":"跨境自发货的模式仓库在海外是否需要RFC税号","AI响应":"你好！如果你的仓库在海外（非墨西哥本土），例如从中国直发或从美国转运仓发货，属于跨境直邮模式，不需要提供RFC税号。只有当货物存储在墨西哥境内发货时，才需要绑定RFC税号。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-18 04:47:56","用户":"楠","群":"","用户问询":"您好，墨西哥自发货full仓的要求，税号和发票类的，美妆香水类什么要求","AI响应":"你好！很高兴为你解答。\n\n关于你的问题，要求如下：\n\n1. 税号要求：自发货模式目前不需要RFC税号。但如果你使用Full仓（海外仓），建议办理RFC税号，否则平台将按36%的税率执行预扣。\n\n2. 发票要求：根据墨西哥法律，卖家必须向所有墨西哥客户开具带有RFC编号的发票。\n\n3. 品类限制：香水属于禁运品，无法通过自发货或Full仓销售。美妆类膏体、易碎品发往Full仓需用保鲜膜二次加固，且面单需清晰粘贴在箱体外侧。\n\n网页参考资料：\nhttps://global-selling.mercadolibre.com/help/27305","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-16 17:32:43","用户":"Elvis  Cheung","群":"","用户问询":"我是跨境自发货卖家，在full仓模式下我的墨西哥税号该如何解决","AI响应":"你好！很高兴为你解答。\n\n作为跨境卖家，如果你想使用墨西哥海外仓（Full仓），建议办理**离岸RFC税号**，其合规性与账户安全性最高。\n\n你可以通过以下方式解决：\n1. **自行申请或找代办**：联系专业的税务代理机构协助办理墨西哥RFC税号。\n2. **绑定后台**：拿到税号后，在卖家后台绑定。如果不绑定，平台将对你的销售额实施约36%的强制预扣税（16%增值税+20%所得税）。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/gLZ3iC9XLqFE4j075JaNSg?from=industrynews&version=4.1.22.6009&platform=win","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-16 13:36:51","用户":"*外","群":"","用户问询":"问下 咱们平台 自发货 fti 以及半托 国内税务是自行缴纳还是平台代扣啊","AI响应":"目前美客多平台不代扣代缴卖家在国内产生的相关税费。国内税务申报及缴纳事宜，建议您咨询专业的财税机构或当地税务部门。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-16 13:32:30","用户":"*外","群":"","用户问询":"问下 咱们平台 自发货 fti 以及半托 税务是自行缴纳还是平台代扣啊","AI响应":"自发货和FTI模式目前不涉及墨西哥36%的增值税代扣。半托管模式下，税费由买家承担，平台不会对卖家进行36%的增值税和所得税代扣。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-15 11:25:31","用户":"广告衫·服装定制 17620681808 周","群":"","用户问询":"您好 跨境店 自发货 需要准备 墨西哥 RFC 税号么？ 净收益定价 成本需要把税算进去么？ 除了墨西哥 其他站点需要扣税么？","AI响应":"你好！很高兴为你解答。\n\n关于你咨询的墨西哥跨境店自发货及税费问题，回复如下：\n\n1. 是否需要准备RFC税号\n自发货模式目前不需要绑定墨西哥RFC税号。RFC税号主要针对海外仓模式，自发货卖家目前不涉及墨西哥36%的增值税代扣。\n\n2. 净收益定价是否需要包含税费\n不需要。美客多自发货采用收益价格模式。你只需要在后台录入目标净收益（即：采购成本+利润），平台系统会自动叠加运费、佣金以及可能产生的相关税费生成最终售价，无需你人工计算并加入税费。\n\n3. 其他站点是否需要扣税\n在自发货模式下，其他站点的税费同样由平台系统处理。美客多为跨境卖家提供直邮解决方案，你只需将商品送达至平台指定的中国境内集运仓，后续的国际运输、清关及目的地派送由官方负责。相关进口税费通常由买家在下单时承担。\n\n网页参考资料\n墨西哥RFC税号相关信息：https://mp.weixin.qq.com/s/gLZ3iC9XLqFE4j075JaNSg?from=industrynews&version=4.1.22.6009&platform=win\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-15 10:43:44","用户":"清风明月","群":"","用户问询":"税号我们自发货要怎么搞","AI响应":"自发货模式不需要提供墨西哥RFC税号，目前也不涉及36%的增值税代扣。你可以直接激活店铺进行运营。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-14 15:55:09","用户":"+k","群":"","用户问询":"自发货需要办理RFC税号吗","AI响应":"自发货不需要提供税号。\n\n关于墨西哥RFC税号的要求，主要取决于您选择的业务模式：\n如果您选择的是自发货模式，目前不涉及墨西哥36%的增值税代扣，您可以先激活店铺跑自发货。\n如果您选择的是海外仓模式，建议您办理RFC税号。如果没有税号，平台将面临约36%的代扣税（16%增值税 + 20%所得税）。\n如果您使用美国转运仓配送墨西哥，则不需要提供RFC。因为这种模式属于跨境直邮而非本土发货，相应的进口税费由买家在下单时承担。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-14 13:39:19","用户":"张丽-深圳市雅乐电子有限公司","群":"","用户问询":"自发货墨西哥需要36%的税？","AI响应":"目前自发货卖家不涉及墨西哥 36% 的增值税代扣。\n\n自发货模式下，卖家主要承担的是物流费用（国内头程+跨境运费）和平台佣金，税务合规方面相对简单。自发货卖家暂时不做墨西哥RFC税号的强制要求。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-14 10:05:51","用户":"小火鸡","群":"","用户问询":"你好，请问美客多自发货需要注册提交巴西墨西哥阿根廷智利哥伦比亚巴拉圭税号那些吗","AI响应":"你好！很高兴为你解答。\n\n关于美客多自发货模式是否需要税号，具体情况如下：\n\n1. 墨西哥站点：自发货卖家暂时不需要提供墨西哥RFC税号。您可以先激活店铺跑自发货，待后续转为海外仓（Full仓）模式时，才需要绑定RFC税号，否则将面临最高36%的代扣税。\n\n2. 巴西、智利、哥伦比亚站点：目前中国跨境卖家在这些站点主要通过CBT项目进行销售，支持自发货模式。\n\n3. 阿根廷站点：虽然是美客多的核心站点之一，但目前主要面向本土卖家或特定跨境项目开放。\n\n4. 巴拉圭站点：目前美客多面向中国跨境卖家开放的流量站点主要为巴西、墨西哥、智利和哥伦比亚，暂不包括巴拉圭。\n\n总结来说，自发货模式在入驻初期通常不需要像海外仓模式那样强制绑定墨西哥RFC税号。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-14 10:04:00","用户":"小火鸡","群":"","用户问询":"你好，请问美客多自发货需要注册提交巴西墨西哥税号那些吗、","AI响应":"你好！很高兴为你解答。\n\n关于美客多自发货模式是否需要税号，具体情况如下：\n\n1. 墨西哥站点：自发货卖家暂时不需要提供墨西哥RFC税号，目前也不涉及墨西哥36%的增值税代扣。您可以直接激活店铺进行自发货销售。\n\n2. 巴西站点：目前跨境店巴西站只能做自发货模式，卖家需要提供RFC税号，并遵守巴西当地的税务合规要求。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-13 14:00:37","用户":"lxy","群":"","用户问询":"你好 请问RFC怎么办理的？ 自发货模式过去要多久？","AI响应":"你好！很高兴为你解答。\n\n关于墨西哥RFC税号的办理，您可以联系专业的税务服务商进行办理。RFC是由墨西哥税务机关 SAT分配的唯一12位字母数字识别码。对于跨境卖家，强烈建议选择与注册主体一致的离岸税号，其合规性与账户安全性最高。\n\n如果您是自发货卖家，暂时不做墨西哥RFC税号的强制要求。\n\n关于自发货模式的物流时效，美客多自发货模式为跨境卖家提供了一套直邮解决方案，您只需将商品送达至平台指定的中国境内集运仓，后续的国际运输、清关及目的地派送由官方指定的物流承运商负责。具体的运输时长会根据目的地站点及物流承运商的处理速度有所不同。\n\n网页参考资料：\nRFC提交指引：https://doc.weixin.qq.com/pdf/d3_AfYAYgZCAGgKWsXU04xQce3N7RC12?scode=AI8A3wfvAAouqPnVrtAfYAYgZCAGg&isFromNewImportWithExcel=1\n税务合规渠道SPN：https://mercadolibre.cn/melispn\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"}]},{"业务模块":"自发货","高频问题":"上架/链接/SKU/变体/寄样","Past 7 Days":10,"Previous":14,"WoW":-0.2857142857142857,"代表性问询":"自发货链接怎么创建","Past 7 Days代表性问询":"自发货链接怎么创建","Previous代表性问询":"香水可以上架美客多自发货吗","__details":[{"时间":"2026-07-17 22:38:54","用户":"🍁","群":"","用户问询":"美客多墨西哥自发货后台已上链接后面的下拉框“在其他市场启用”为什么没反应？","AI响应":"目前无法直接判断具体原因。建议您优先核查网络环境或更换浏览器尝试。若仍无反应，可能涉及后台权限或系统延迟，建议联系平台客服或您的客户经理进一步确认。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-17 20:05:18","用户":"A～猴子","群":"","用户问询":"自发货上了很多链接还是不出单怎么办","AI响应":"你好！建议从以下方向优化：\n1. 检查价格：自发货竞争激烈，需确保价格有竞争力。\n2. 开启广告：注册满15天且有在售链接即可开启广告撬动流量。\n3. 优化选品：优先选择轻小件、高利润或测款新品。\n4. 提升信誉：若信誉变黄，建议通过降价或推广增加单量以平衡数据。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-17 18:47:31","用户":"吕亚举","群":"","用户问询":"自发货和半托管可以创建目录链接吗","AI响应":"你好！自发货和半托管模式都可以创建目录链接。系统会要求您将所销售的产品与目录中的某个产品关联，并确认保证和状态等信息。完成后，您的产品将参与目录竞争。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-16 16:38:45","用户":"777","群":"","用户问询":"自发货能不能上架目录链接","AI响应":"可以。自发货模式同样可以上架目录链接。您只需在后台上传产品时输入准确的UPC/EAN码，若该产品已在目录库中，即可选择加入。\n\n网页参考资料：https://global-selling.mercadolibre.com/help/18882","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-15 10:43:49","用户":"Cher","群":"","用户问询":"墨西哥站自发货，能不能做一堆商品随机发货的链接，会在描述中和标题中说明清楚","AI响应":"卖家您好，很高兴为您解答。\n\n在美客多平台上，这种“随机发货”或“盲盒”形式的链接是不被允许的。\n\n根据平台规则，您的商品标题、描述和图片必须与买家最终收到的实物完全一致。如果买家收到的商品与链接展示不符，会直接导致极高的投诉率和退货率，进而严重影响您的店铺信誉和账号健康。\n\n建议您为每一款商品创建独立的Listing，或者通过变体（Variations）功能让买家自行选择具体的款式、颜色或规格，以确保交易的透明度和合规性。\n\n网页参考资料：\n如何创建高质量的Listing：https://global-selling.mercadolibre.com/help/18626","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-14 23:01:34","用户":"joker","群":"","用户问询":"普通自发货，刊登类型怎么选择，可以选高级吗？","AI响应":"卖家您好，普通自发货店铺在刊登时可以选择高级刊登（Premium）。高级刊登虽然佣金比例略高，但能为产品提供更高的搜索权重和曝光量，并支持买家分期付款，有助于提升转化率。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-14 16:05:34","用户":"自由如龙","群":"","用户问询":"跨境自发货店铺 发个链接","AI响应":"普通自发货/海外仓也可选择自注册（PC端登入）：https://global-selling.mercadolibre.com/landing/about\n\n入驻准备材料：\n1. 法人身份证正反面照片及手持身份证照片。\n2. 营业执照彩色扫描件或照片。\n3. 常用邮箱（建议使用Gmail或Outlook）。\n4. 手机号。\n5. 收款账户信息。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-14 10:52:35","用户":"X.wang","群":"","用户问询":"自发货提示listing修改类目，并且下架了当前的listing，但是使用新的类目上架，总是失败","AI响应":"根据你提供的邮件截图，平台下架你的 Listing 是因为类目错放。邮件中明确建议你将产品从原来的 Tools > Hand Tools > Tool Sets > Other 更改为：\nConstruction > Construction Work Materials > Steel Cables & Accessories > Fish Tapes。\n\n如果使用新类目上架总是失败，建议按以下步骤排查处理：\n\n1. 检查必填属性：不同类目对应的必填属性（Attributes）不同。切换到新类目后，系统会要求填写该类目特有的参数（如材质、长度、直径等）。请确保所有带星号的必填项已准确填写。\n\n2. 避免违规词汇：检查标题和描述中是否包含原类目的关键词，或者包含促销词、特殊符号、联系方式等违规内容。\n\n3. 图片合规性：确保首图为 1200x1200px 的纯白底图，无水印、无文字。\n\n4. 系统同步延迟：如果刚修改完就报错，可能是系统数据同步问题。建议删除失败的草稿，清除浏览器缓存，或者更换浏览器后，直接按照邮件建议的路径重新创建一条新的 Listing。\n\n5. 查看具体报错信息：在上架失败的页面通常会有红字提示具体的错误原因（如“Invalid attribute”或“Missing information”），请根据提示针对性修改。\n\n如果以上操作后仍然无法上架，建议联系卖家支持并附上报错截图，询问是否该类目对自发货卖家有特殊限制。","一级大类":"其他","二级子类":"系统报错","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-13 16:01:56","用户":"悠","群":"","用户问询":"自发货链接怎么创建","AI响应":"创建自发货链接需在卖家后台点击 Listings > Add listings。输入产品名称并选择正确类目后，填写品牌、型号、技术规格等信息。在物流设置中，确保已勾选自发货（Cainiao）模式。完成后上传图片并确认发布即可。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-13 10:12:13","用户":"IWannaReset","群":"","用户问询":"跨境自发货站点想要上架保健品，需要什么资质吗？","AI响应":"不可以。保健品、药品属于美客多禁运、禁售类目。\n\n美客多平台对禁售商品有严格的规定，为了确保您的账号安全，请务必避开以下类目：\n\n1. 知识产权类：\n- 假冒或仿牌商品。\n- 侵犯他人知识产权（商标、专利、版权）的商品。\n\n2. 消费性包装商品 (CPG) 禁运项：\n- 任何种类的食物和饮料。\n- 补充剂、复合维生素、运动增强剂、混合维生素和矿物质补充剂。\n- 香水和香料。\n\n3. 医疗与健康类：\n- 药品、保健品。\n- 医疗器械（除非获得特定授权）。\n\n4. 危险品与限制品：\n- 液体、粉末。\n- 易燃易爆品。\n- 特定带电产品（需参考菜鸟物流禁运清单）。\n\n5. 其他违禁品：\n- 武器、毒品、烟草等法律明令禁止的物品。\n\n温馨提示：\n- 建议卖家建立事前核查机制，选品前务必查看官方禁售品清单详情：https://global-selling.mercadolibre.com/landing/prohibited-items\n- 若涉及自发货，建议您前往卖家后台 Selling Preferences -> Dispatch Methods 详细查看菜鸟的禁运清单，否则商品可能被海关扣押且无法退回。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"}]},{"业务模块":"自发货","高频问题":"入仓/入库/库存/库容","Past 7 Days":9,"Previous":12,"WoW":-0.25,"代表性问询":"自发货模式需要备货吗","Past 7 Days代表性问询":"自发货模式需要备货吗","Previous代表性问询":"自发货无法改库存了吗","__details":[{"时间":"2026-07-19 17:39:09","用户":"。","群":"","用户问询":"自发货模式需要备货吗","AI响应":"自发货模式不需要您提前将备货发往官方仓库。\n\n当您收到订单后，您需要在中国境内将商品打包，并贴上物流面单，在3个工作日内发送至美客多指定的国内物流集运仓即可。\n\n这种模式非常适合测款新品，您可以利用自发货模式灵活上架，测试市场反应，无需提前备货至海外仓，降低了库存积压的风险。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-18 16:52:58","用户":"Jiaqi Hu","群":"","用户问询":"FTI 店铺 自发货，收货仓库地址","AI响应":"你好！很高兴为你解答。\n\n目前美客多中国卖家的自发货物流已统一由菜鸟（Cainiao）承接。如果您选择自行寄送（Drop Off），可以在此查看最新的菜鸟仓库地址列表：\n\n菜鸟自寄仓库地址：https://cainiao.4px.com/site/helpDetailsLs\n\n请在前往卖家后台 Selling Preferences > Dispatch Methods 检查并设置您的发货地址，确保地址填写完整准确。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 16:54:37","用户":"ㅤ  ㅤ","群":"","用户问询":"自发货是不是可以理解为我需要自己赵物流商送到美客多的国内仓库再由美客多送到买家手中 但是半托管是直接把货可以放在美客多的国内仓库的而且没有费用","AI响应":"你好！你的理解基本正确。自发货是出单后48小时内送达集运仓；半托管是提前备货至东莞仓，目前免仓储费。两者国内段运费均由你承担，国际段及尾程由美客多负责。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 17:44:48","用户":"fxt","群":"","用户问询":"自发货是需要发到你们在国内的仓库吗","AI响应":"是的，自发货模式下，您需要在收到订单后的3个工作日内，将商品打包并贴好面单，发送至美客多指定的国内物流集运仓（目前由菜鸟承接）。您可以选择菜鸟上门揽收或自行寄送至仓库。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 13:45:03","用户":"lxy","群":"","用户问询":"我们自发货能自己备货到南美吗","AI响应":"你好！很高兴为你解答。\n\n自发货模式（Global Selling）是不可以自己备货到南美当地的。\n\n自发货模式的流程是：当你的店铺出单后，你需要在中国境内将商品打包，并贴上物流面单，在3个工作日内发送至美客多指定的国内物流集运仓（目前统一由菜鸟承接）。后续的国际段运输、清关和目的地派送由平台负责。\n\n如果你希望提前备货到南美当地仓库，那属于海外仓模式（Fullfillment）。目前美客多仅支持卖家将货物发往官方的海外仓（Full仓），不支持卖家使用自己的第三方海外仓进行自发货业务。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 17:45:49","用户":"Holly","群":"","用户问询":"托管服务也能自发货吗？还是需要先把货物备货去海外仓？","AI响应":"自发货和托管模式可以一起做，但需分开店铺运作。全托管模式下，商家需要将货物发送至平台指定的国内集货仓，无需提前备货到海外仓。\n\n国内集货仓地址：广东省东莞市沙田镇进港南路第一产业园205号库台\n联系人：叶宗虎 18025233509","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 12:00:07","用户":"蓝天白云","群":"时骏科技-美客多助手","用户问询":"这一点我们不在菜鸟揽收范围，但是我们可以自发货到菜鸟仓库","AI响应":"你好！很高兴为你解答。\n\n既然你不在菜鸟揽收范围内，需要采取“自寄”模式。请按照以下步骤操作：\n\n1. 设置物流方式：在后台 Selling Preferences > Dispatch Methods 中，将发货方式设置为 Drop Off（卖家自寄）。\n2. 填写发货地址：虽然是自寄，但后台仍需填写准确的发货地址。\n3. 寄送至仓库：你需要自行联系国内快递，将包裹寄送到菜鸟指定的自寄仓库。\n\n请务必确保订单在出单后 2天内 送达菜鸟仓库并被扫描上网。如果包裹已经寄出但仓库还未扫描，订单状态不会更新，可能会导致超时。\n\n你可以通过此链接查看最新的菜鸟自寄仓库地址列表：菜鸟自寄仓库地址。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 17:33:47","用户":"Aurora","群":"","用户问询":"美客多自发货模式最近无法修改库存吗","AI响应":"你好！很高兴为你解答。\n\n目前美客多自发货模式是可以正常修改库存的。\n\n如果你在修改时遇到报错，通常是由于以下原因导致的：\n1. 系统网络波动或后台接口不稳定，建议你清除浏览器缓存、更换浏览器（推荐使用Chrome）或稍后再试。\n2. 账号权限或状态异常，请检查店铺是否有违规提醒。\n3. 批量编辑器的系统延迟。\n\n如果多次尝试依然显示“字段不可修改”，请在卖家后台通过帮助中心开Case联系官方客服，并附上报错截图，以便技术团队排查具体原因。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 10:13:12","用户":"菲菲菲","群":"","用户问询":"美客多自发货业务是发货到哪个仓库","AI响应":"你好！很高兴为你解答。\n\n美客多自发货模式下，卖家需要将包裹发送至平台指定的国内集运仓。目前美客多中国卖家的自发货物流已统一由菜鸟（Cainiao）承接。\n\n您可以根据自己的需求选择以下两种方式：\n\n1. 上门揽收（Pick Up）：如果您所在的地区在菜鸟的揽收范围内，可以选择此方式。\n2. 自行寄送（Drop Off）：如果您选择自行寄送，需要将包裹寄往菜鸟指定的自寄仓库。\n\n具体的菜鸟自寄仓库地址列表，您可以在卖家后台的物流设置页面或通过菜鸟官方提供的地址清单进行查看。\n\n网页参考资料：\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260125/8fc8936f8bbc49dd8c309e801d7cbf43.png","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"}]},{"业务模块":"自发货","高频问题":"类目/产品能否售卖","Past 7 Days":5,"Previous":6,"WoW":-0.16666666666666666,"代表性问询":"美客多自发货能卖鞋垫吗","Past 7 Days代表性问询":"美客多自发货能卖鞋垫吗","Previous代表性问询":"自发货每个类目的标准有吗","__details":[{"时间":"2026-07-19 20:34:10","用户":"A   大华","群":"","用户问询":"请给我中国自发货模式禁售和限售和不支持运输的产品","AI响应":"你好！很高兴为你解答。\n\n美客多自发货模式对禁售和限售商品有严格规定，请务必避开以下类目以确保账号安全：\n\n1. 知识产权类：\n- 假冒或仿牌商品。\n- 侵犯他人知识产权（商标、专利、版权）的商品。\n\n2. 消费性包装商品 (CPG) 禁运项：\n- 任何种类的食物和饮料。\n- 补充剂、复合维生素、运动增强剂、混合维生素和矿物质补充剂。\n- 香水和香料。\n\n3. 医疗与健康类：\n- 药品、保健品。\n- 医疗器械（除非获得特定授权）。\n\n4. 危险品与限制品（物流运输限制）：\n- 液体、粉末。\n- 易燃易爆品。\n- 纯电池产品（如移动电源、充电宝等，属于菜鸟物流禁运品类）。\n- 强磁产品。\n\n5. 其他违禁品：\n- 武器、毒品、烟草等法律明令禁止的物品。\n\n温馨提示：\n- 建议卖家建立事前核查机制，选品前务必查看官方禁售品清单详情：https://global-selling.mercadolibre.com/landing/prohibited-items\n- 建议您前往卖家后台 Selling Preferences -> Dispatch Methods 详细查看菜鸟的禁运清单，否则商品可能被海关扣押且无法退回。\n\n网页参考资料：\n自发货禁售清单：https://global-selling.mercadolibre.com/help/16621\n自发货物流运输限制/禁运产品：https://global-selling.mercadolibre.com/help/41748","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-19 20:18:17","用户":"价值2","群":"","用户问询":"我是自发货的，美客多，美客多哪个类目好做？哪个类目好做？，适合新人，美客多哪个类目好做？","AI响应":"你好！自发货适合做轻小件、高客单价、测款新品或长尾产品。建议优先选择重量15kg以内、单边长60cm以内的商品，利用收益价格模式灵活上架测款。避开保健品、药品等禁运品。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-19 20:17:30","用户":"价值2","群":"","用户问询":"我是自发货的，美客多哪个类目好做？，适合新人","AI响应":"你好！自发货适合做轻小件、高客单价、测款新品或长尾产品。建议避开保健品、药品等禁运品，优先选择重量15kg以内、单边长60cm以内的商品，利用收益价格模式灵活上架测款。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-17 11:23:10","用户":"Adelina Yang","群":"","用户问询":"我还想详细了解一下贵平台。想对平台流量，我们产品所属类目流量，用户人群，类目，平台优势、特点等想了解了解。还有我们如果做，是做海外仓模式还是自发货模式，还是两个都做，目前我们在亚马逊是FBA和自发货都做的。比例大致是6比4。单店铺月销100万美金上下，我们有2个自有品牌，4个店铺","AI响应":"你好！很高兴为你解答。\n\n美客多是拉美最大的电商平台，流量稳居第一。用户人群覆盖墨西哥、巴西、智利等核心市场，消费力强且对中国品牌接受度高。\n\n**平台优势与特点：**\n1. **流量倾斜：** 海外仓（Full）模式产品自带标识，转化率远高于自发货。\n2. **定价简便：** 采用收益价格模式，系统自动计算运费佣金，无需人工核算。\n3. **税务优势：** 跨境店自发货或美仓模式无需RFC税号。\n\n**模式建议：**\n鉴于您在亚马逊有成熟的FBA和自发货经验，且单店月销达100万美金，建议您**两种模式同步开展**：\n- **海外仓模式：** 针对您的自有品牌和爆款，利用Full仓提升物流时效和流量权重，对标亚马逊FBA。\n- **自发货模式：** 用于新品测款或长尾产品，灵活上架，无需提前备货。\n\n**入驻准备材料：**\n1. 中国内地或香港公司营业执照（有限公司）。\n2. 法人身份证及人脸识别。\n3. 第三方收款账户。\n4. 谷歌/Outlook/阿里云邮箱。\n5. 品牌R标或TM标。\n\n普通自发货/海外仓也可选择自注册（PC端登入）：https://global-selling.mercadolibre.com/landing/about","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-13 13:09:42","用户":"审计 验资 评估","群":"","用户问询":"美客多自发货能卖鞋垫吗","AI响应":"可以卖。鞋垫不属于禁售品类，自发货模式下可以正常销售。建议在发布时选择正确的类目路径，并确保产品描述准确。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"}]},{"业务模块":"自发货","高频问题":"侵权/品牌/合规处理","Past 7 Days":4,"Previous":2,"WoW":1,"代表性问询":"自发货需要品牌授权吗","Past 7 Days代表性问询":"自发货需要品牌授权吗","Previous代表性问询":"半托管和自发货对品牌有要求吗","__details":[{"时间":"2026-07-19 13:54:54","用户":"c","群":"","用户问询":"已经有自发货店铺怎么上传品牌授权","AI响应":"你好！很高兴为你解答。\n\n你可以登录卖家后台，在导航栏中寻找 Listings 菜单下的 Brand Protection（品牌保护）或 Brand Registry（品牌注册）选项进行资料上传。\n\n如果你是需要加入品牌保护计划（BPP），可以直接访问官方自查与申请入口：https://brand-protection.mercadolibre.com/ \n\n请注意，品牌备案通常需要2至4周。通过后方可获得品牌保护及品牌广告（Display）权限。只有品牌旗舰店才能在listing的品牌字段填写该品牌。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-17 16:59:54","用户":"c.","群":"","用户问询":"我现在有品牌，但是我做的自发货，可以上传品牌授权吗","AI响应":"你好！很高兴为你解答。\n\n自发货卖家也是可以上传品牌授权的。在注册阶段填写申请表时，如果暂时没有准备好可以先空着，但是提交完申请后记得及时补上。\n\n在美客多进行品牌备案，你需要准备以下核心材料：\n1. 商标证书：提供在销售目的国（如墨西哥、巴西等）注册成功的商标证书（R标）。\n2. 品牌授权书：如果你不是商标的所有人，必须提供由商标持有人出具的正式授权书。\n3. 产品实物图：需要提供带有品牌 Logo 的产品实物照片。\n4. 品牌信息：包括品牌名称、所属类目等基本信息。\n\n你可以登录卖家后台，在导航栏中寻找 Listings 菜单下的 Brand Protection（品牌保护）或 Brand Registry（品牌注册）选项进行操作。\n\n需要注意的是，品牌审核周期通常为 2 至 4 周。审核通过后，你可以获得品牌保护以及品牌广告（Display）的投放权限。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-15 14:21:49","用户":"番茄🍅","群":"","用户问询":"自发货需要品牌授权吗","AI响应":"你好！很高兴为你解答。\n\n在自发货模式下，如果你销售的是品牌产品，是需要品牌授权的。\n\n如果你没有品牌授权，建议在上传产品时不要在品牌（Brand）一栏填写该品牌名称，可以填写通用品牌（Generic）或者不填，以避免因侵权导致的产品下架或店铺违规。\n\n如果你拥有自己的品牌，建议在美客多后台进行品牌备案，这样可以获得更好的品牌保护和流量支持。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"},{"时间":"2026-07-14 09:37:53","用户":"波波波pewpewpew突突突","群":"","用户问询":"做了品牌备案后还可以使用自发货吗","AI响应":"可以的。品牌备案与物流模式无关，完成品牌备案后，您依然可以根据业务需求选择使用自发货模式或海外仓模式。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"侵权/品牌/合规处理"}]},{"业务模块":"自发货","高频问题":"买家纠纷/客诉/售后","Past 7 Days":4,"Previous":5,"WoW":-0.2,"代表性问询":"自发货可以回复买家的评论吗","Past 7 Days代表性问询":"自发货可以回复买家的评论吗","Previous代表性问询":"你好 国内自发货退货地址要写么","__details":[{"时间":"2026-07-18 04:50:01","用户":"楠","群":"","用户问询":"您好，我在美客多买家前端能看到香水通过自发货以及full仓售卖","AI响应":"你好！你看到的可能是本土账号在售卖。跨境卖家目前无法通过自发货或海外仓销售香水，因为香水属于航空禁运品且涉及复杂的进口清关限制。建议你严格遵守跨境禁售规则，避免违规。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 16:43:36","用户":"大山","群":"","用户问询":"跨境自发货呢，选择怎么样的退货和售后策略","AI响应":"自发货售后由平台处理，商家无需介入。退货商品由平台评估退仓或销毁。若您在当地有退货地址，可要求买家退货至该地址；若无本地地址，通常建议根据货值评估，高客单价产品可尝试引导退回，低客单价产品建议协商部分退款以降低损失。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 12:25:50","用户":"灵感菇oi","群":"","用户问询":"自发货可以回复买家的评论吗","AI响应":"你好！很高兴为你解答。\n\n目前美客多平台不支持卖家直接回复买家的评价（Review）。\n\n买家在收到货后可以对商品进行评分和文字评论，这些内容会展示在商品详情页下方。虽然卖家无法直接回评，但你可以通过以下方式提升评价质量：\n1. 保持良好的售后沟通：在买家收到货后，如果对方通过后台消息联系你，请积极解决问题，避免产生差评。\n2. 提升商品质量与描述一致性：确保实物与Listing描述、图片一致，减少因落差导致的负面评价。\n\n如果评价中包含侮辱性言语、个人隐私信息或与商品本身无关的内容，你可以联系卖家支持申请人工审核处理。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 13:48:38","用户":"孫明山","群":"","用户问询":"美客多自发货，买家使用商品后要退货，怎么处理？","AI响应":"?你好！很高兴为你解答。\n\n当买家发起退货请求时，您需要采取以下步骤：\n\n1. 确认请求：您必须在24小时内确认客户的退货请求，并说明下一步的处理措施。\n2. 审查原因：需要仔细审查退货原因，并判断是否符合退货政策。\n3. 处理不符政策的产品：如果收到的退货产品已使用或不符合退货政策，您应在48小时内通知客户，并提供详细的原因。您可以与客户协商处理方案，例如将其作为损坏品处理或退还给客户（运费由客户承担）。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"}]},{"业务模块":"自发货","高频问题":"促销/活动/广告投放","Past 7 Days":4,"Previous":2,"WoW":1,"代表性问询":"自发货需要开广告吗","Past 7 Days代表性问询":"自发货需要开广告吗","Previous代表性问询":"自发货如何投广告","__details":[{"时间":"2026-07-17 17:03:04","用户":"三十一","群":"","用户问询":"这个活动是海外仓还是自发货的","AI响应":"你好！该广告补贴活动通常针对海外仓（Full）模式卖家。自发货模式采用的是收益价格模式，系统会自动处理运费与佣金。建议你点击详情链接或联系招商经理核实具体参与资格。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 17:02:34","用户":"三十一","群":"","用户问询":"这个活动是针对自发货的吗？","AI响应":"你好！自发货模式主要面向能从国内直发拉美的卖家，适合轻小件、高利润、测款新品或长尾产品。关于该广告补贴活动的具体适用范围，建议您通过活动详情链接或咨询对应的招商经理确认。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 18:18:40","用户":"自由如风","群":"","用户问询":"自发货需要开广告吗","AI响应":"你好！很高兴为你解答。\n\n自发货卖家是非常建议开启广告的。利用广告工具可以有效撬动流量，实现店铺从0到1的成交突破，以及从1到10的增量成长。\n\n目前美客多针对自发货VIP客户的广告门槛非常低：\n1. 卖家信誉：无任何店铺信誉要求。\n2. 销售门槛：无任何出单要求，只要保持有链接在售即可。\n3. 注册时长：注册满15天。\n4. 账户健康：无逾期账单。\n\n此外，平台还针对自发货卖家推出了限时补贴活动。例如针对未开广告的新卖家有Welcome Package机制，在活动周期内广告投入比例达到2.5%及以上，可获得1.5%的返点。针对已开广告的卖家也有Farming机制的广告金补贴。\n\n建议你在开启广告前调研关键词，虽然商品广告主要靠系统智能算法自动竞价，但了解搜索词有助于你优化链接。\n\n网页参考资料：\nhttps://file.marsmind.cc/boot-admin/mercado/20260508/2052675802303561729.png","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 16:28:38","用户":"RxL","群":"","用户问询":"我们是跨境自发货店铺，并没有广告费和仓储费","AI响应":"你好！很高兴为你解答。\n\n回款金额需减去退款金额、佣金、物流费等费用。\n\n对于自发货店铺，如果回款与销售额不符，建议优先核查订单详情中的佣金比例以及是否产生了运费差额。目前无法直接判断具体原因，建议核查后台订单明细中的各项扣费项。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"}]},{"业务模块":"托管","高频问题":"开通/入驻/审核进度","Past 7 Days":117,"Previous":55,"WoW":1.1272727272727272,"代表性问询":"好的。再就是，平台的全托管入驻申请提交了那个问卷后，5到7个工作日给结果后，再有入口提交营业执照等资质吗？","Past 7 Days代表性问询":"好的。再就是，平台的全托管入驻申请提交了那个问卷后，5到7个工作日给结果后，再有入口提交营业执照等资质吗？","Previous代表性问询":"什么意思？ 全托管已经提交入驻了","__details":[{"时间":"2026-07-19 22:55:05","用户":"🍃᭄淡若清风💞࿐","群":"","用户问询":"晚上好，怎么入驻全托管","AI响应":"你好！全托管模式入驻要求如下：\n1. 主体资质：中国内地或香港公司营业执照。\n2. 业绩要求：跨境电商单店年流水大于30万美金。\n3. 供货能力：建议售价5-50美金，重量小于1.5kg，需提前备货至东莞仓。\n4. 模式优势：0佣金、0仓储费、0国际运费、0广告费。\n\n入驻申请链接：http://kks.ink/ss/vKx9ph/d12030","一级大类":"账号入驻与安全","二级子类":"入驻流程","问题主题":"入驻/注册/开店流程"},{"时间":"2026-07-19 22:50:52","用户":"ぅ Oath°3 jin","群":"","用户问询":"您好，问一下我的美客，多半托管店铺已经审核通过了。这样的话，页面还需要无痕模式，页面可以翻译吗","AI响应":"你好！很高兴为你解答。\n\n既然你的店铺已经审核通过并进入正常运营阶段，你可以根据个人习惯使用浏览器。\n\n关于页面翻译：在日常浏览后台、查看销量或回复消息时，可以使用翻译功能。但请务必注意，当你需要进行“修改产品价格”、“编辑Listing详情”、“上传库存”或“提交重要资料”等涉及系统保存和提交的操作时，必须关闭网页自动翻译功能，否则极易导致系统报错、乱码或保存失败。\n\n关于无痕模式：无痕模式主要用于排查登录异常或页面加载错误。在正常运营时，使用常规模式即可，但建议定期清理 Chrome 浏览器缓存，以保证后台运行流畅。","一级大类":"其他","二级子类":"系统报错","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-19 18:29:25","用户":"林世远Ada","群":"","用户问询":"有全托管入驻推荐码吗","AI响应":"你好！全托管入驻无需推荐码，请直接通过以下链接提交表单申请：http://kks.ink/ss/vKx9ph/d12030","一级大类":"账号入驻与安全","二级子类":"入驻流程","问题主题":"入驻/注册/开店流程"},{"时间":"2026-07-19 18:24:12","用户":"林世远Ada","群":"","用户问询":"木工铣刀适合入驻全托管吗","AI响应":"你好！木工铣刀这类结构简单、标准化程度高且售后率低的产品非常适合全托管。建议产品重量在1.5KG以内，包装体积小于0.03立方米，供货价在5-50美金之间。\n\n入驻链接：http://kks.ink/ss/vKx9ph/d12030\n\n网页参考资料：\nhttps://file.marsmind.cc/boot-admin/mercado/20260306/2029751573895790594.png\nhttp signment\n\n如果查询结果显示还在审核中，请保持通讯畅通，耐心等待官方人员的联系。","一级大类":"账号入驻与安全","二级子类":"入驻流程","问题主题":"入驻/注册/开店流程"},{"时间":"2026-07-16 13:27:36","用户":"辛巴","群":"","用户问询":"你发个全托管问卷给我","AI响应":"你好！很高兴为你提供全托管模式的入驻申请通道。\n\n如果你想申请全托管，请统一提交这个表单：http://kks.ink/ss/vKx9ph/d12030\n\n全托管模式下，商家仅需负责供货，店铺运营、物流配送、营销推广、售后服务等环节均由平台一站式托管。\n\n【资质要求】\n1. 主体资质：拥有中国大陆/香港公司营业执照。\n2. 业绩要求：托管店铺单店年均流水 ＞30万美金（注：极其优秀的知名品牌卖家请告知）。\n3. 供货能力：符合平台选品方向，具备绝对价格竞争力。建议重量≤1.5KG，供货价建议在5-50 USD之间，包装后体积 ≤ 0.03m³。\n\n提交表单后，你可以通过之前那个链接查询进度。由于申请量较大，审核周期通常为20-30个工作日，请耐心等待。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-16 13:04:56","用户":"Ai吕心景¹⁵⁸⁶⁸⁰¹⁷⁵⁰⁵","群":"","用户问询":"半托管模式审核周期多长时间？","AI响应":"你好！很高兴为你解答。符合半托管入驻画像的卖家，客户经理将逐一按批次联系，预计时效20-30个工作日。因目前登记数量较多，请耐心等待并保持通讯畅通。若长时间无消息，可私聊经理提供公司名和登记邮箱跟进。","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC & 审核综合咨询"},{"时间":"2026-07-16 11:50:35","用户":"Charlene-Fulinda mic","群":"","用户问询":"14号（星期二）成功提交了半托管模式的申请 16号查询结果","AI响应":"你好！很高兴为你解答。\n\n非常理解你焦急的心情。虽然从14号到16号已经过了两天，但查询结果显示为空通常属于正常现象，原因如下：\n\n1. 系统同步延迟：半托管模式的申请量非常大，后台数据同步到前端查询页面往往需要更长的时间。目前查询不到并不代表提交失败，只要你提交时看到了成功提示，资料就已经在系统里了。\n\n2. 审核尚未启动：半托管模式的审核周期预计在一个月左右。在买手或经理正式开始处理你的申请并更新状态之前，查询页面可能会一直显示为空。\n\n3. 信息匹配：请再次确认查询时输入的“公司名称”与问卷中填写的完全一致。\n\n由于你们是麦克风工厂，属于平台重点招募的画像，建议你先耐心等待。如果一周后依然查询不到，或者你非常担心，可以尝试更换浏览器（推荐Chrome）或开启无痕模式再次查询。\n\n请放心，只要资质符合要求，经理会通过微信或电话直接联系你的，查询页面仅作为一个参考。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"其他","二级子类":"系统报错","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-16 09:20:50","用户":"啊邝","群":"","用户问询":"怎么加入起飞计划","AI响应":"你好！很高兴为你解答。\n\n加入起飞计划通常有以下几种方式：\n\n1. 经理邀请制：起飞计划主要针对通过招商经理入驻的优质卖家。如果您的店铺表现良好或符合特定类目的招商需求，招商经理会主动联系您并邀请加入。\n\n2. 满足入驻条件：如果您是托管模式（全托管/半托管）或FTI工贸一体模式的卖家，在入驻成功后，通常会自动进入官方的扶持体系，享受类似起飞计划的流量和运营支持。\n\n3. 积极参与官方活动：建议您关注美客多官方公众号或卖家后台的通知，积极参与平台组织的线上招商会或线下沙龙，这些场合往往有加入扶持计划的申请入口。\n\n4. 保持良好表现：新店铺上线后，请务必保证产品质量、物流时效和回复率。表现优异的店铺更容易被系统捕捉并获得经理的关注，从而获得加入起飞计划的机会。\n\n如果您目前已有对接的招商经理，建议直接向经理咨询您当前的店铺状态是否符合加入起飞计划的要求。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"店铺等级综合咨询"},{"时间":"2026-07-16 09:18:26","用户":"啊邝","群":"","用户问询":"起飞计划是什么","AI响应":"起飞计划是美客多官方针对新卖家推出的扶持项目，旨在帮助新入驻的卖家快速度过起步期，提升店铺权重和销量。\n\n该计划通常包含以下核心权益：\n1. 专属流量扶持：新店铺和新产品会获得额外的曝光机会，帮助产品快速出单。\n2. 官方经理指导：会有专门的客户经理对接，提供选品建议、运营指导以及广告投放优化建议。\n3. 促销活动优先权：有机会优先参与平台的各类大促活动和秒杀活动。\n4. 绿色审核通道：在入驻审核、KYC审核等环节享受更快的处理速度。\n\n如果您是新入驻的卖家，建议积极配合客户经理的要求，完成起飞计划中的各项任务，以便最大化利用平台资源。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"店铺等级综合咨询"},{"时间":"2026-07-16 07:59:14","用户":"一丢丢","群":"","用户问询":"半托管专属问卷重新登记一次，链接为：","AI响应":"你好！很高兴为你解答。全托管和半托管入驻请统一提交该表单，无需重新提交声明。你的问题中涉及巴西半托管的相关内容我暂时无法回答，后续我会丰富我的知识库，敬请见谅。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-16 07:57:47","用户":"一丢丢","群":"","用户问询":"你好，链接上没有选项说明是注册什么站点的半托管，这样会有问题吗，需要重新提交说明吗","AI响应":"你好！很高兴为你解答。你的问题我暂时无法回答，后续我会丰富我的知识库，敬请见谅。其余巴西问题可正常解答。","一级大类":"账号入驻与安全","二级子类":"入驻流程","问题主题":"入驻/注册/开店流程"},{"时间":"2026-07-16 00:53:12","用户":"🌵","群":"","用户问询":"同一个公司，我申请了全托管模式，还能申请自营模式吗","AI响应":"可以的。全托管和普通跨境店铺（自营模式）需要使用不同的店铺进行操作。您可以根据供应链优势合理分配产品。\n\n全托管申请：http://kks.ink/ss/vKx9ph/d12030\n自发货/海外仓申请：https://global-selling.mercadolibre.com/landing/about","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"}]},{"业务模块":"托管","高频问题":"其他具体问题","Past 7 Days":105,"Previous":90,"WoW":0.16666666666666666,"代表性问询":"有钱全托管模式吗","Past 7 Days代表性问询":"有钱全托管模式吗","Previous代表性问询":"半托管需要授权吗","__details":[{"时间":"2026-07-19 20:50:50","用户":"biubiu","群":"","用户问询":"好了 咱们这个全托入住都需要什么","AI响应":"全托管入驻请先提交表单：http://kks.ink/ss/vKx9ph/d12030\n\n准备材料如下：\n1. 中国内地或香港公司营业执照（有限责任公司，不接受个体户）。\n2. 法人身份证（需配合人脸识别）。\n3. 收款银行账户（美金账户或第三方收款账户）。\n4. 邮箱及联系电话。\n5. FTI工贸一体模式需提供流水。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-19 17:26:45","用户":"FGW","群":"","用户问询":"全托管中什么状态下代表核价通过？","AI响应":"在美客多全托管模式中，核价结果显示为 appeal 即代表核价通过。\n\n此外，您也可以通过以下方式判断：\n1. 后台状态：在卖家后台查看商品状态，如果从 under review（核价中）变为其他通过状态，或者不再显示为 reject（核价失败），则说明核价已完成。\n2. 申诉表状态：在核价结果申诉表中，如果 A 列显示为 appeal，则该商品无需申诉，直接等待买家选品即可。\n\n需要注意的是，核价通过后不能再调高供货价。核价判定通过后，买家会进行选品，通过后才会下发备货单。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-19 17:00:32","用户":"FGW","群":"","用户问询":"我这边两个店铺，我把邮箱发给你，你帮我看一下哪个是全托，哪个是
