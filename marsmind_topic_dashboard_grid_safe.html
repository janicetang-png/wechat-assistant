地机器人我都出单了"}],"module_issues":[{"业务模块":"海外仓","高频问题":"入仓/入库/库存/库容","Past 7 Days":95,"Previous":79,"WoW":0.20253164556962025,"代表性问询":"还没有库存但是审核通过了的商品怎么知道平台订的市场价","Past 7 Days代表性问询":"还没有库存但是审核通过了的商品怎么知道平台订的市场价","Previous代表性问询":"为什么无法更改库存","__details":[{"时间":"2026-07-19 22:02:12","用户":"爱老虎呦🐯","群":"","用户问询":"在初期入仓后，开广告如何充值，充值是什么币种。","AI响应":"美客多广告费用不需要额外充值，也没有信用卡充值选项。系统会直接从您出单后的店铺卖家账户余额中扣除。目前支持美金结算。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-19 20:47:14","用户":"云水禅心","群":"","用户问询":"被客户取消了的订单，库存少了，货物也没有退回到我们的退货地址，怎么查询货物去向","AI响应":"建议您先在卖家后台确认订单的物流扫描状态。如果货物已进入国际段，通常无法拦截；若在进入国际段前取消，菜鸟会定期退回。您可以联系菜鸟客服（0532-66202077）或在后台开case提供订单截图，请平台协助核查货物具体去向。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-19 20:01:59","用户":"D~","群":"","用户问询":"是我货到了在去预约入仓的时间吧 这个意思吧","AI响应":"你好！很高兴为你解答。\n\n是的，就是这个意思。\n\n通常的操作流程是：货物在海上运输期间，你不需要去预约具体的入仓日期。等到货物已经到达目的地国家，并且货代完成了清关、把货拉到了他们当地的转运仓库后，货代会根据美客多后台的空档，去预约一个具体的送货时间。\n\n只要在预约好的那个时间点把货送到官方仓就可以了。所以，海运的长途运输时间完全不会影响你的入仓预约。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-19 19:41:44","用户":"云水禅心","群":"","用户问询":"处于清仓中的产品手动退仓后，又重新入仓上架，此时产品是清仓价还是原价?","AI响应":"处于清仓中的产品通过退仓形式发起退出后，重新入仓上架会恢复原价销售。清仓活动是针对特定滞销库存的，重新入仓的货件将作为新库存处理。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-19 19:40:55","用户":"D~","群":"","用户问询":"仓储费是怎么算的呢","AI响应":"你好！很高兴为你解答。\n\n仓储服务费适用于仓库内所有商品，按月收取，并根据商品的尺寸和仓储时间计算。\n\n具体的计算规则如下：\n\n1. 计费方式：\n商品按尺寸分为小型、中型、大型和超大/重型，每日产生相应的费用。月底会汇总每日费用生成总金额。\n\n2. 不同尺寸商品的每日仓储费用（以墨西哥为例）：\n小型产品（尺寸12x15x25厘米或以下，重量18千克或以下）：每日收费0.0006美元。\n中型产品（尺寸28x36x51厘米或以下，重量18千克或以下）：每日收费0.0022美元。\n大型产品（尺寸50x60x60厘米或以下，重量18千克或以下）：每日收费0.0050美元。\n超大或重型产品（尺寸大于50x60x60厘米或重量大于18千克）：每日收费0.0276美元。\n\n3. 长期仓储费：\n为优先考虑畅销商品的库存空间，存放满4个月（120天）或以上的商品将产生长期仓储费用。费用会根据产品老化程度和大小每月收取。\n\n4. 国家差异：\n这些费用目前主要适用于墨西哥。智利仓库的仓储费目前全部为折扣价，在另行通知前不收取费用。\n\n当商品售出或从仓库取出后，将停止收取该件商品的每日仓储费。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-19 19:27:21","用户":"D~","群":"","用户问询":"我是怎么备货到海外仓呢？我想备多少就备多少到海外仓吧，","AI响应":"你好！很高兴为你解答。\n\n并不是想备多少就备多少，海外仓的备货是受系统限制的。\n\n具体操作流程和规则如下：\n\n1. 创建备货计划：你需要在卖家后台创建备货计划（Shipment），系统会根据你店铺的销量、信誉等级以及仓库的库容情况，给出你可以发货的数量上限。\n2. 库容限制：新卖家初始库容通常比较有限。随着你销量的提升和库存周转率的加快，系统会自动提升你的库容额度。\n3. 寻找物流商：你需要自己联系可发货到墨西哥等地的第三方物流商（货代），将货物从国内运输到当地。\n4. 预约送仓：货物到达当地后，由物流商在系统线上预约送仓时间。美客多系统会分配具体的仓库地址，物流商按预约时间送达即可。\n\n建议你在操作前，先在卖家后台查看当前的库容额度，并提前创建备货计划，避免盲目发货导致无法入库。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-19 12:06:05","用户":"波波波pewpewpew突突突","群":"","用户问询":"修改库存数量后还是显示原来的数量1个，这是什么情况","AI响应":"目前无法直接判断具体原因。建议优先核查是否为海外仓卖家，海外仓库存需在创建入库货件时确认，无法直接在后台修改。若为自发货，请检查网络延迟或系统同步状态，建议刷新页面或稍后查看。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-19 10:44:48","用户":"2号线","群":"","用户问询":"关于第一步完成前10单得到绿色信誉，只有3-4个产品链接的话每个库存多少，怎么在合适的时间阶段完成这10单","AI响应":"你好！很高兴为你解答。针对你只有3-4个链接的情况，建议按以下方案执行：\n\n**1. 库存准备：**\n每个SKU建议备货 **20-30件**。虽然拿到绿标只需10单，但考虑到算法测款需要一定的动销深度，且要防止出单太快导致断货（断货会严重伤权重），这个库存量能保证你在拿到绿标后有充足的缓冲期进行补货。\n\n**2. 时间阶段规划：**\n*   **第1-3天（上架即冲刺）：** 采用“极致低价”策略。将价格设为类目最低，甚至平价出货。存储卡是标品，买家对价格极度敏感，低价是触发算法首单的最快方式。\n*   **第4-7天（流量爆发期）：** 配合 **Clips短视频**。每天为这几个链接各发一条实拍视频。算法对新链接有扶持，低价+视频能吸引大量精准自然流，通常在这一周内就能完成10单。\n\n**3. 执行细节：**\n*   **不要分散火力：** 集中力量推其中1-2个最有价格优势的链接，只要店铺总单数满10单且履约良好，全店都会变绿。\n*   **监控进度：** 一旦满10单，系统评定信誉通常有1-2天延迟，变绿后立即恢复正常利润价并开启广告。\n\n这种方式能确保你在最短时间内激活算法，拿到流量入场券。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-18 18:00:09","用户":"迷迷 苏","群":"","用户问询":"东莞仓申请提取商品的 VAS NO后面号码错误，但是提取货物的OC码没错会影响提货吗","AI响应":"你好！很高兴为你解答。\n\n只要你的**OC提货码**是正确的，通常不会影响最终提货。\n\n在退仓提货流程中，**OC提货码**是仓库核验货件最关键的凭证。VAS NO（增值服务单号）虽然是关联单号，但仓库现场主要通过OC码来定位和交付包裹。\n\n**建议操作：**\n1. 在发送预约邮件时，请务必在邮件正文再次清晰写明正确的**OC提货码**。\n2. 提货人到达东莞仓库现场时，直接出示**OC提货码**进行核对。\n3. 务必提醒提货人员在现场当面核对退货实物数量，如有差异需当场反馈，货品离仓后将无法处理。\n\n**退仓预约邮件提醒：**\n收件人：MKDCF2026168@365fanyi.com 和 gpncustomerservice-latinamerica@service.cainiao.com\n邮件标题：Mercado Libre Withdrawal Order + 正确的OC单号\n邮件正文：写明OC提货码 + 提货时间\n\n请注意，库内停滞时长超过5天未提货的货件将会被销毁，请尽快安排。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-18 17:54:12","用户":"不破不立，大破大立","群":"","用户问询":"Full Managed 模式是要自己寄送到指定仓库？","AI响应":"你好，很高兴为您解答全托管模式的货交接问题。\n\n在全托管模式下，商家确实需要将货物发送至平台指定的国内集货仓。目前全托管和半托管模式的国内集货仓地址如下：\n\n寄送地址/联系人：广东省东莞市沙田镇进港南路第一产业园205号库台\n联系人：叶宗虎 18025233509\n可接受货物时间：周一至周日，9:00am-18:00pm\n\n在发货时，请您务必注意以下要求：\n\n1. 标签尺寸：BAG LABEL（外箱标）为10*15cm，SKU LABEL（产品标）为7*2.2cm。\n2. 物理隔离：如果单箱内有多个SKU，需要在箱内做好物理隔离。\n3. 标签粘贴：如果是自寄到仓，外箱需要贴上快递面单和IC单（bag label），并且在箱内多放一张IC单，防止运输途中外标掉落；如果是自送到仓，外箱贴上IC单即可。\n4. 混装禁忌：请勿将全托管或半托管的货物与普通自发货、FTI账号货物混装揽件送货，否则仓库无法接收。\n\n如果您还没有入驻，可以先通过这个链接提交申请：http://kks.ink/ss/vKx9ph/d12030","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-18 16:58:52","用户":"涛声依旧","群":"","用户问询":"那跟半托的区别就是半托入到东莞仓，出单了由东莞仓直接发货到买家手里，全托就是我们发到东莞仓，然后平台再发到目的国本土仓，出单了再由本土仓发送到买家手里","AI响应":"是的，你的理解非常准确。\n\n**半托管：**货在东莞仓，出单后从东莞直邮给海外买家。\n**全托管：**货先到东莞仓，平台统一海运/空运至目的国本土仓，出单后从本土仓发货。\n\n全托管时效更快，且商家无需承担国际运费和佣金。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-18 15:50:52","用户":"🐟711bu7","群":"","用户问询":"我想问一下美客多智利入仓需要什么条件","AI响应":"你好！很高兴为你解答。智利Full仓储服务目前包含仓储服务费，但智利仓库的仓储费目前已获折扣，在另行通知前均不收取。关于入仓的具体准入门槛和操作流程，建议你登录卖家后台查看最新的智利站点发货指引。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-18 11:25:09","用户":"A.roc","群":"","用户问询":"美客多墨西哥Full备货到东莞沙田仓，叫货拉拉送过去，仓库那边联系谁对接收货啊","AI响应":"你好！很高兴为你解答。\n\n货拉拉送货到仓后，请联系叶宗虎，手机号：18025233509。\n\n仓库地址：广东省东莞市沙田镇进港南路周大福物流东莞物流中心205号库台。\n收货时间：周一到周日，9:00am-18:00pm。\n\n请务必提醒司机，到仓后跟工作人员说清楚提货类型和单号。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 21:27:27","用户":"cyc","群":"","用户问询":"但是他给我的库容是不够给我卖 3 天的","AI响应":"你好！很高兴为你解答。目前半托管模式的库容和补货额度是由系统根据动销情况动态分配的。如果当前额度无法满足三天周转，建议你先按系统允许的最大值补货，以维持Listing权重。随着销量持续稳定增长，系统会自动识别并逐步提升你的补货上限。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 21:25:07","用户":"cyc","群":"","用户问询":"我现在有一款产品，就是在一天之内出 10 单，库存剩 7 个 然后我重新发货过去，他最多只让我补 13 个，然后我就断货了 对的","AI响应":"你好！很高兴为你解答。系统会基于过去销售数据和未来预期计算补货范围。若补货限制导致断货风险，建议确保库存不为零以维持Listing权重。目前无法直接干预系统算法，建议持续关注动销，随着销量稳定，系统预估的补货额度会逐步提升。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 21:24:15","用户":"cyc","群":"","用户问询":"那我寄过去东莞，我大概是需要三天时间，一天快递加两天入仓。那如果我一个晚上我就把我库存的10个全部出完，然后我10个还在路上 那我就断货了","AI响应":"你好！很高兴为你解答。系统预估库存不足会提前通知补货以保证流量。目前托管备货仓需商家自寄，建议你合理规划发货时间，提前安排寄送，确保货物在断货前入仓。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 19:05:35","用户":"wydsn","群":"","用户问询":"@美客多本土号小助手黛西 库容申请","AI响应":"你好！请完成以下3步：\n1. 扫码添加小助手。\n2. 填写信息收集表：https://28151754.beschannels-plus.com/forms/6WU4ZMA。\n3. 完成库容申请：https://28151754.beschannels-plus.com/forms/6SU4ZNC。\n申请需IPI > 70，且已提前创建货件。\n\n网页参考资料：\nhttps://vendedores.mercadolivre.com.br/nota/guia-para-envios-e-reposicao-de-estoque-no-full\n\nhttps://file.marsmind.cc/boot-admin/mercado_local/20260716/2077647562425778177.png","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 16:54:02","用户":"迷迷 苏","群":"","用户问询":"东莞仓申请退仓开始还未发送邮件需在几天内拿回商品","AI响应":"你好！很高兴为你解答。\n\n根据规定，你需要在退仓单打包完成后的【5天】内安排提货并拿回商品。\n\n请注意以下关键点：\n1. 逾期后果：库内停滞时长超过 5 天未提货的货件，仓库将会进行销毁处理，请务必尽快发送邮件预约并安排取件，避免造成资产损失。\n2. 预约时间：发送预约邮件时，提货时间至少需设定在发送邮件后的 T+1 天（工作时间），给仓库留出 24-48 小时的准备时间。\n3. 提货要求：提货时需出示 OC 提货码，并务必与仓库现场当面核对退货实物数量。货品离仓后反馈的数量问题将无法处理。\n\n仓库地址：广东省东莞市沙田镇进港南路周大福物流东莞物流中心205号库台\n联系人：叶宗虎 18025233509","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-17 16:51:00","用户":"ㅤ  ㅤ","群":"","用户问询":"这个海外仓是你们美客多的还是我自行选择第三方仓库","AI响应":"你好！半托管模式下的退货地址需要是你自行选择的第三方仓库，或者是你在当地的自有仓库。美客多官方仓目前不提供退货接收和二次上架服务。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 15:50:13","用户":"心海","群":"","用户问询":"像这种情况是正常的是吗？就是要把货先发到德州仓了，仓库扫描了才会显示有库存是吗","AI响应":"是的，这是正常情况。在美客多美国转运仓模式下，系统逻辑是有库存才会显示上架。\n\n您需要先在后台创建发货计划，将货物发送至美国德州官方仓。只有当仓库收到货物并完成扫描入库后，系统才会自动更新库存数量，此时您的产品链接才会从“未激活”状态变为“已激活”并正常售卖。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 15:40:51","用户":"A～猴子","群":"","用户问询":"为啥菜鸟没退回来而是给u我销毁了呀？ @众想主管 为啥菜鸟没退回来而是给我销毁了呀？","AI响应":"你好！根据图片显示，包裹已在退货仓库被销毁。通常未入仓异常件需在5个工作日内发邮件预约自提，打包好的退仓单若超5天未提货也会被销毁。目前无法直接判断您的具体原因，建议核查是否及时完成了邮件预约及提货。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 15:37:41","用户":"Eiiiii","群":"","用户问询":"这个提取得库存是在哪个仓库得","AI响应":"从您提供的图片顶部蓝条可以看到，当前选中的站点是 AR (Full)，这代表该库存位于阿根廷的 Full 仓。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 15:31:03","用户":"Eiiiii","群":"","用户问询":"可提取库存在哪看","AI响应":"从您提供的图片来看，可提取库存就在页面中间的输入框位置。输入框下方显示“您将拥有 9 个适合销售的单位”，说明您目前有 9 件可售商品。若需提取，在框内输入数量即可。","一级大类":"其他","二级子类":"系统报错","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 15:26:33","用户":"Eiiiii","群":"","用户问询":"想确认本次待提货清单里，是买家退回订单商品，还是仓库检测出瑕疵货品？如果我暂时不提货，最晚的操作截止日期是哪天，是否会产生额外仓储费用？","AI响应":"清单包含买家退货、清仓或货不对板等货件。库内停滞超5天未提货将销毁。不可售库存会产生仓储费，建议尽快发邮件预约提货。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 14:06:12","用户":"Lisa","群":"","用户问询":"但是我其他产品预约成功后会显示在途库存/运输中库存","AI响应":"你好！很高兴为你解答。\n\n有库存才会显示上架。\n\n在全托管模式下，库存状态通常分为以下几种：\n1. 无库存 (Out of stock)：没有储存或在途库存。\n2. 临界 (Critical)：库存即将耗尽。\n3. 适中 (Moderate)：库存处于中间点。\n4. 最优 (Optimal)：状态最佳，有足够件数满足需求。\n5. 积压、过剩(surplus)：库存过多。\n\n如果你的其他产品显示在途，而这个单号没有显示，可能是因为系统同步存在延迟。只要你的发货单状态显示为“待接收”且预约成功，就不会影响后续的入库流程。建议你先按照预约时间正常发货，待仓库签收后，库存状态会自动更新。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 12:00:50","用户":"古💋月","群":"","用户问询":"预约到仓日期是7月16日 实际到仓7月17日 货物会正常入仓吗","AI响应":"一旦预约确定，您最多可以在预约日期前1个工作日内添加或移除最多20%的单位。若实际到仓时间晚于预约日期，建议您提前在后台重新安排预约，以免影响正常入仓。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 11:16:18","用户":"'Mint","群":"","用户问询":"我现在有一家跨境店，后台取件地址设置在广州天河区。然后一般我自己寄送的是送到广州东莞仓的。现在我有个产品在河北，我能同时自己寄送到河北的仓库吗？","AI响应":"可以。若不在揽收范围或附近无取件点，可选择“卖家自寄（Drop Off）”模式自行将货物运至揽收仓，运费需卖家承担。\n\n目前全国共有25个与菜鸟合作的可接受自送的仓库，您可以将包裹自行送至菜鸟指定的国内扫码仓。\n\n网页参考资料\n菜鸟仓库地址查询：https://global-selling.mercadolibre.com/help/cainiao-warehouses-drop-off_36979","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 09:47:52","用户":"Dford","群":"","用户问询":"我不作库存的","AI响应":"如果不做库存，建议您关注库存退出机制。7天销量为0或14天销量低的SKU可能被清退。若入库30天无动销，可能面临退仓或清货处理。请务必通过变体管理好库存状态，避免因缺货导致售后投诉。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 09:38:44","用户":"Coconut","群":"","用户问询":"这个包裹显示已经被东莞仓库签收了 但是仓库那边查箱唛号查不到 这种情况应该怎么办呢","AI响应":"你好！很高兴为你解答。\n\n如果物流已签收但仓库查不到箱唛号，可能是扫描延迟。建议包裹派送至仓库12-24小时后仍未更新时，准备好货件号或运单号联系官方客服核实具体状态并催促扫描。\n\n此外，请核实是否已在后台点击确认发货，并检查箱唛是否符合规范。若需调监控找货，需提供货件外观、卸货位置和具体签收时间。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 09:35:40","用户":"Hehehaaa","群":"","用户问询":"请问我的快递已经到达广东省东莞市沙田镇进港南路周大福物流东莞物流中心205号库台，但由于没有贴箱麦，导致无法入库，请问怎么解决","AI响应":"关于无主件：到仓快递无箱唛和商品标签，请到无主件认领表格进行认领，没有表格的亲联系我。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 17:59:24","用户":"Elvis  Cheung","群":"","用户问询":"full模式下 仓储费如何计算","AI响应":"你好！很高兴为你解答。\n\nFull仓储费由两部分组成：\n1. **仓储服务费**：按月收取，根据商品尺寸（小/中/大/超大）每日产生费用。\n2. **长期存储费**：针对存放超过4个月（120天）的商品，根据老化程度和尺寸每月额外收取。\n\n网页参考资料：\nhttps://global-selling.mercadolibre.com/help/15373","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-16 17:38:30","用户":"笑","群":"","用户问询":"首图符合要求，变体也全部激活，并且都有库存，为什么看不到前台","AI响应":"你好！如果上述条件均满足但前台仍不可见，请核查以下两点：\n\n1. **通用代码（UPC/EAN）**：请检查每个变体是否都填写了有效的通用代码，缺失或重复的代码会导致链接无法在前台展示。\n2. **配送设置**：请确认该 Listing 是否已关联有效的运费模板或配送方式。\n\n若排除以上问题且超过 24 小时仍未显示，建议在后台开 Case 联系技术支持核查该 Item ID 的同步状态。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-16 17:35:47","用户":"厚德载物","群":"","用户问询":"我的库容低于实际送仓产品的数量，但是仍然约仓成功了，这种情况会影响送仓上架吗","AI响应":"你好！很高兴为你解答。只要约仓成功并生成了货件单，通常可以正常送仓。但如果实际到货数量严重超过库容限制，仓库可能会拒绝接收超出的部分，或导致上架速度变慢。建议关注后台货件状态，确保货物符合入仓标准。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-16 17:06:26","用户":"XNGc2","群":"","用户问询":"您好 我想要询问一下 我的货代错误送了产品 但是这个产品又不属于我的。这批货物占用着我的库容数量，我需要怎么做可以移除这部分数量呢？","AI响应":"你好！很高兴为你解答。\n\n你可以通过“提货”服务取回这部分货物。该服务支持卖家通过第三方物流承运商取回已入仓但不想继续销售或产生滞销费用的货物。\n\n请在后台货件管理页面申请提货，并联系你的货代安排上门取件，以此释放被占用的库容。","一级大类":"其他","二级子类":"系统报错","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-16 16:03:43","用户":"迷迷 苏","群":"","用户问询":"半托已经备货过去的商品还未入仓，不小心有重复上架了相同的商品，已经手动下架了，但是卖家的listing还是看得到这有影响吗","AI响应":"你好！很高兴为你解答。\n\n这种情况没有影响，请放心。\n\n1. 链接显示问题：你手动下架后，卖家后台可能存在数据同步延迟，导致你依然能看到该 Listing。只要状态显示为“Paused（暂停）”或“Inactive（非激活）”，买家端就无法搜索或购买该商品，不会产生重复订单。\n\n2. 备货入仓：你已经备货过去的商品，入仓时会根据你创建货件时关联的 SKU 进行识别。只要你下架的是重复多余的 Listing，而保留了与货件信息一致的那个 Listing，入仓和后续销售就不会受到影响。\n\n3. 规则影响：美客多半托管和全托管店铺上架相同的商品本身就不会产生冲突。你及时下架重复链接是为了方便库存管理，避免库存分散，这是正确的操作。\n\n建议你稍后刷新后台，或通过买家端搜索确认该重复链接是否已不可见。只要确保发货关联的那个 Listing 处于 Active 状态即可。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-16 14:43:09","用户":"Half God.","群":"","用户问询":"就是我的货72小时内货代有扫描入库的记录就行了是吗","AI响应":"是的，可以这样理解。平台对自发货订单的总处理时效要求是72小时（工作日）。\n\n具体的时间分配是：你需要在订单产生后的48小时（2个工作日）内将货物送达物流商仓库，物流商在接货后有24小时完成扫描入库。只要在72小时内有了物流扫描上网记录，就不算超时。\n\n为了确保不超时，建议你尽早发出，给物流商留出充足的扫描时间。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-16 12:38:08","用户":"对方正在输入...","群":"","用户问询":"买家因为没有库存退货怎么解决","AI响应":"如果是因为卖家缺货导致买家退货，建议按以下步骤处理：\n\n1. **及时沟通**：主动联系买家说明情况并致歉，询问是否愿意等待补货或更换其他款式。\n2. **取消订单**：若无法发货，请在后台取消订单。注意，因缺货取消订单会直接影响你的**店铺信誉（Reputation）**和取消率指标。\n3. **库存管理**：立即下架或调整该商品的库存数量，避免产生更多违规订单。\n4. **信誉维护**：如果信誉受损，需通过后续大量优质订单来稀释负面影响。\n\n建议卖家务必实时同步库存，避免因缺货导致的纠纷和降权。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-16 11:11:54","用户":"Z","群":"","用户问询":"你好，美客多全托的送到东莞仓的货件，因为供应商延期了，货无法再最后发货日期前送达，应该怎么办 可以取消这个货件吗","AI响应":"你好！很高兴为你解答。\n\n如果全托管货件无法在最后期限前送达，请按以下方式处理：\n\n1. **可以取消**：在卖家后台找到该货件，点击取消即可。\n2. **重新创建**：取消后，你可以根据供应商最新的交货时间，重新创建一个新的货件计划。\n3. **及时处理**：建议尽早取消，避免因货件过期导致系统记录异常或影响后续的入仓预约。\n\n请确保新货件的信息准确，并按照最新的预约时间送达东莞仓。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 08:42:59","用户":"小潘","群":"","用户问询":"请问我怎么添加运营经理 而且入仓流程是怎么样的","AI响应":"自注册账号默认无经理，可通过提升业绩触发系统分配或填写官方申请表。若已分配，请查收邮件扫码进群。入仓流程为：在后台创建货件，打印并粘贴标签，联系物流送往指定仓库，等待仓库扫描上架。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 21:17:56","用户":"勇攀高峰。","群":"","用户问询":"你好，我问下美国转运仓，拉美地区出单后，尾程仓库派送呢？还是官方物流去仓库取件呢？","AI响应":"你好！很高兴为你解答。在美国转运仓模式下，Listing出单后，由美客多官方完成订单的尾程配送，不需要官方去取件，也不需要你额外处理。你只需提前将货物备好并存放在美客多位于美国德州的官方FULL仓即可。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 17:45:49","用户":"Holly","群":"","用户问询":"托管服务也能自发货吗？还是需要先把货物备货去海外仓？","AI响应":"自发货和托管模式可以一起做，但需分开店铺运作。全托管模式下，商家需要将货物发送至平台指定的国内集货仓，无需提前备货到海外仓。\n\n国内集货仓地址：广东省东莞市沙田镇进港南路第一产业园205号库台\n联系人：叶宗虎 18025233509","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 17:20:25","用户":"迷迷 苏","群":"","用户问询":"哪里下载商品的销售数据和库存的Excel表格","AI响应":"你好！很高兴为你解答。\n\n你可以通过以下路径下载相关的Excel表格：\n\n1. 下载库存数据：\n进入卖家后台，点击 Listings（刊登管理），在页面右上角可以看到 Export（导出）按钮，点击即可下载当前所有产品的库存及状态明细表。\n\n2. 下载销售数据：\n进入卖家后台，点击 Reports（报告）> Metrics（指标），在这里你可以选择特定的时间范围，然后点击下载销售报告，获取详细的订单和销售数据。\n\n如果你是使用海外仓（Full）模式，也可以在 Warehouse Management（仓库管理）界面找到对应的库存报告进行下载。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 16:35:31","用户":"Eli","群":"","用户问询":"但我想确定下我的对接经理是哪个人，我需要申请库容","AI响应":"你好！很高兴为你解答。\n\n关于库容扩容，根据您的店铺信誉和商品类型，有以下几种情况和处理方式：\n\n1. 常规商品库容\n常规商品的上架总数和库容是由店铺信誉等级动态决定的，无法人工申请增加。建议您专注提升订单履约率与销售业绩，随着店铺信誉等级提升（保持绿色状态），系统会自动为您扩充库容额度。\n\n2. 大件商品库容\n如果您是老卖家，系统会基于大件商品的动销情况给予库容。若后台库容不能满足您的发货需求，在IPI分数大于70分时可以向您的客户经理申请额外库容。\n\n3. 库容保障与新功能\n若您的IPI分数在3个月内始终保持绿色状态，当月实际库容配额将不低于当月库容预测值。针对墨西哥海外仓中IPI处于红色或黄色状态且库容不足的卖家，平台的“购买库容”功能可以解决此类问题。\n\n关于您询问的对接经理信息，目前提供的CSF邮箱查询表仅用于找回税务登记邮箱。如果您的店铺目前没有对接经理的联系方式，建议您通过卖家后台的帮助中心提交工单咨询，或查看入驻时的往来邮件确认是否有买手或经理的联系信息。\n\n网页参考资料：\nWhat are the listing limits?（https://global-selling.mercadolibre.com/help/21423）","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 15:25:15","用户":"BONBONS","群":"","用户问询":"FULL库存提取库存的费用怎么计算","AI响应":"提取库存会产生弃置或撤仓费。费用根据商品的尺寸和重量计算，具体标准请参考：https://global-selling.mercadolibre.com/knowledge-hub/18226","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 15:02:08","用户":"Yvonne Wang","群":"","用户问询":"我没手动暂停 我的货刚到仓一部分 7/24 我以为是不是只要入库一部分 这个链接就应该被激活啊 我需要手动激活码","AI响应":"货件入库后，系统通常会自动激活链接。请先检查后台Listing状态是否为Paused，若是请手动改为Active。同时确认库存数量是否已同步显示大于0。若24小时后仍未激活，建议联系客户经理核实收货状态。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-15 13:31:41","用户":"XIAOMEI","群":"","用户问询":"我还要一个问题想问你，我怎么样联系到东莞仓的物流客服员的联系方式？","AI响应":"关于东莞仓的联系方式，为您查询到以下信息：\n\n袁杰（白班）：+86 18018715994\n李达红（晚班）： +86 18825215759\n\n如果是关于托管备货仓的业务，联系人信息如下：\n联系人：叶宗虎 18025233509\n仓库地址：广东省东莞市沙田镇进港南路周大福物流东莞物流中心205号库台\n可接受货物时间：周一到周日，9:00am-18:00pm","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 13:26:10","用户":"XIAOMEI","群":"","用户问询":"这不是我库存没有，也是不是我的原因？","AI响应":"从您提供的图片来看，这些订单明确显示为“Mercado Libre取消的包裹”，并且右上角标注了“不影响您的信誉”。\n\n这说明订单取消确实不是由您（卖家）发起的，也不是因为您库存不足或发货延迟导致的。这种情况通常属于以下几种平台行为：\n\n1. 支付风险拦截：平台系统检测到买家的支付环境存在欺诈风险或资金安全问题，为了保护交易安全，由系统强制取消了订单。\n2. 买家端异常：买家账号状态异常或在下单后立即发起了取消请求，平台在处理后同步了状态。\n3. 调解完成：其中一张图片显示“调解完成，资金已解冻”，这通常发生在订单出现争议后，平台介入处理并判定将资金退还或解冻给您。\n\n既然系统已经明确标注“不影响您的信誉”，您无需担心店铺权重受到影响。对于这类由平台发起的批量取消，建议您：\n- 无需进行发货操作：既然订单已取消，请勿再寄出货物。\n- 正常运营：继续处理其他状态正常的订单。\n- 留存截图：保留好这些显示“不影响信誉”的截图，万一后续信誉分出现异常波动，可以作为证据开 Case 申诉。\n\n请放心，这属于平台的风控或系统自动处理机制，并非您的操作失误。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-15 13:02:44","用户":"Zic.","群":"","用户问询":"地址栏只能填写东莞仓 不能写自己这边地址怎么回事","AI响应":"你好。那个地址是会覆盖掉的，东莞仓那边不能进行处理。建议您核实操作步骤，若仍无法修改，可能需要联系平台后台确认具体原因。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-15 12:37:42","用户":"迷迷 苏","群":"","用户问询":"东莞仓商品要申请退仓是先后台操作退仓再写申请邮件吗","AI响应":"你好！很高兴为你解答。\n\n是的，顺序是先在后台操作申请，再发送预约邮件。具体步骤如下：\n\n1. 后台操作：\n首先在商家后台申请退仓，路径为：Listings management - created pickup full。操作完成后，点击提货生成 OC 提货码。\n\n2. 发送预约邮件：\n拿到 OC 提货码后，你需要发送邮件预约提货时间。请务必同时发送给以下两个收件人：\nMKDCF2026168@365fanyi.com\ngpncustomerservice-latinamerica@service.cainiao.com\n\n邮件要求：\n邮件标题：写明相应的提货单号（已入仓商品退仓需写明 OC 提货单号）。\n邮件正文：写明 OC 提货码和预约提货时间。\n提货时间：至少是在发送邮件后的 T+1 天（工作时间），给仓库 24-48 小时准备时间。\n\n3. 安排提货：\n邮件预约成功后，即可安排人员前往东莞仓库自提。提货时需出示 OC 提货码，并与仓库现场核对实物数量。\n\n注意：库内停滞时长超过 5 天未提货的货件将会被销毁，请在后台显示打包完成后尽快预约提货。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-15 11:42:48","用户":"ㅤ  ㅤ","群":"","用户问询":"没有海外仓直接菜鸟一件代发到墨西哥美客多仓库","AI响应":"你好！这种模式属于海外仓（Full）业务。只要货物存储在墨西哥境内仓库并销售，就需要RFC税号。若未上传，平台将按36%税率实施强制预扣。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"}]},{"业务模块":"海外仓","高频问题":"其他具体问题","Past 7 Days":54,"Previous":60,"WoW":-0.1,"代表性问询":"怎么激活海外仓功能","Past 7 Days代表性问询":"怎么激活海外仓功能","Previous代表性问询":"这个 模式和海外仓对比有什么优势呢","__details":[{"时间":"2026-07-19 23:53:32","用户":"TL","群":"","用户问询":"full的门槛是什么","AI响应":"Full仓权限没有固定数值门槛，主要由系统评估。核心要求包括：店铺信誉等级必须处于绿色状态、具备良好的销售表现以及运营合规性。建议先通过自发货积累优质数据，达标后系统会自动开放入口。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-19 19:37:20","用户":"D~","群":"","用户问询":"海外仓需要额外收费么？","AI响应":"你好！很高兴为你解答。\n\n是的，海外仓（Full）模式会产生一些相关的服务费用，主要包括以下几项：\n\n1. 仓储费：根据你存放在仓库中商品的体积（立方分米）和存放时间来计算。通常会有一定的免费存放期，超过时间后会按天计费。\n2. 运费（尾程派送费）：当订单产生时，平台负责将货物送达买家手中所收取的配送费用。\n3. 弃置或撤仓费：如果你有滞销库存需要销毁或者退回，会产生相应的处理费用。\n\n需要特别注意的是，在海外仓定价模式下，你的收益是根据商品价格扣除平台销售佣金和运费后得出的，而仓储费通常不会直接从单笔订单的净收益中扣除，而是定期从你的账户余额中结算。\n\n网页参考资料：\n仓储费：https://global-selling.mercadolibre.com/help/15373\n运费：https://global-selling.mercadolibre.com/help/23223\n弃置或撤仓费：https://global-selling.mercadolibre.com/knowledge-hub/18226\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-19 00:22:21","用户":"Vinson","群":"","用户问询":"pla耗材跨境店full能上吗","AI响应":"你好！很高兴为你解答。PLA耗材是可以上架的。建议你先通过自发货模式积累数据，待店铺信誉等级、销售表现等指标达标后，系统会自动在后台开放送仓入口。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-18 15:51:42","用户":"🐟711bu7","群":"","用户问询":"我的店铺是没有智利full仓 只有墨西哥full仓","AI响应":"你好！智利海外仓（Full）需要联系你的海外仓客户经理申请人工激活。目前智利站点自发货是默认开启的，但海外仓权限需要单独申请。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-18 15:49:11","用户":"巴达通-巴西本土店铺注册-阿涛","群":"","用户问询":"这会影响我们后续的产品送进full仓吗？","AI响应":"你的问题我暂时无法回答，后续我会丰富我的知识库，敬请见谅。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-18 15:39:09","用户":"十六","群":"","用户问询":"是需要在那个站点选择绑定？销售的国家是墨西哥FULL模式","AI响应":"你好！很高兴为你解答。请前往后台 Settings > Selling preferences > Collection method 操作绑定。请注意，该入口仅在 KYC 审核通过后才会展示。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-18 05:04:38","用户":"楠","群":"","用户问询":"美白霜，防晒霜，也属于膏体类吧，只能走full","AI响应":"你好！美白霜和防晒霜属于膏体类，自发货是禁运的。虽然它们属于膏体，但跨境卖家通过Full仓模式也无法售卖液体、粉末及乳霜类产品，因为这些品类涉及复杂的进口卫生许可和清关限制。建议优先选择美妆工具或个护电器。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-18 05:01:13","用户":"楠","群":"","用户问询":"full仓可以售卖的美妆个护产品有哪些呢","AI响应":"你好！Full仓可售卖美妆工具、个护电器、美甲产品等。膏体类产品需用保鲜膜二次加固。但请注意，香水、液体、粉末及医疗器械即便在Full仓模式下，跨境卖家也无法售卖。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 16:48:38","用户":"啊楼🍉","群":"","用户问询":"full 美国转运仓每件产品上都要贴二维码吗？怎么生成的","AI响应":"你好！是的，每件商品都必须张贴唯一的商品标签。在卖家后台创建发货计划时，进入“打印商品标签”步骤，系统会自动生成包含条码和产品信息的PDF文件，你直接下载并按需打印即可。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 16:18:16","用户":"Vinson","群":"","用户问询":"3D打印笔能在跨境店上传Full吗","AI响应":"你好！很高兴为你解答。3D打印笔是可以上架的。建议你先通过自发货模式积累数据，待店铺信誉等级、销售表现等指标达标后，系统会自动在后台开放送仓入口。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 10:59:24","用户":"iee","群":"","用户问询":"full仓的","AI响应":"你好！Full仓订单收入导出路径如下：\n1. 进入卖家后台，点击 **Reports**（报表）下的 **Financial reports**（财务报表）。\n2. 在 **Settlement report**（结算报表）中选择对应周期。\n3. 点击 **Download** 导出 Excel，即可查看包含销售额、佣金、配送费及净收入的明细。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 10:56:54","用户":"斌","群":"","用户问询":"开Full","AI响应":"你好！很高兴为你解答。\n\n关于开通Full仓（海外仓）权限，通常是由系统根据店铺的信誉等级（需处于绿色状态）、销售表现和运营合规性自动激活的。\n\n建议你先通过自发货模式积累运营数据，当各项指标达标后，系统会自动在后台的“库存管理”板块开放送仓入口。\n\n如果你是自发货的VIP店，请注意在注册时不要激活Full。\n\n如果你想了解的是全托管或半托管模式（官方负责仓储物流），这类模式对卖家有特定的招募要求：\n1. 主体资质：拥有中国大陆或香港公司营业执照。\n2. 业绩要求：跨境电商单店年均流水需大于30万美金。\n3. 供货能力：具备价格竞争力，首单建议5-10件/SKU，补货周期在15天以内。\n\n如果你满足以上条件，可以联系你的客户经理申请开通托管模式。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 10:49:31","用户":"Zaxxxay","群":"","用户问询":"智利full仓","AI响应":"智利Full仓需联系您的海外仓客户经理申请人工激活。目前智利仓库的仓储费已获折扣，通知前均不收取。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 09:48:51","用户":"Chris","群":"","用户问询":"海外仓没有经理扶持吗都","AI响应":"你好！很高兴为你解答。海外仓模式是有经理扶持的。通常在您激活海外仓模式并完成KYC审核后，海外仓经理会通过邮件、电话或微信主动联系您。如果您的KYC完成超过一周仍未对接到经理，可以找您对接的招商经理协助。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 09:40:03","用户":"Chris","群":"","用户问询":"您好，海外仓有对接的经理吗","AI响应":"你好！很高兴为你解答。海外仓经理会通过邮件、电话或微信等方式主动联系卖家。若你的KYC审核完成已超过一周仍未对接到经理，可以找对接的招商经理协助。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-16 18:59:17","用户":"陈创杰","群":"","用户问询":"你好 我海外仓跟自发货只能选一个吗","AI响应":"你好！跨境店支持海外仓和自发货两种模式。但在入驻申请表单中，建议您先根据主要经营意向选择其一，后续开店后可以根据业务需求进行调整或同时运营。","一级大类":"账号入驻与安全","二级子类":"入驻流程","问题主题":"入驻/注册/开店流程"},{"时间":"2026-07-16 17:58:40","用户":"Elvis  Cheung","群":"","用户问询":"墨西哥full仓模式下，卖家的收益如何计算","AI响应":"你好！很高兴为你解答。\n\n在墨西哥Full仓模式下，你的实际收益计算公式为：\n实际收益 = 商品售价 - 平台销售佣金 - 税费 - 配送费用。\n\n需要注意的是，目前的收益计算中不扣除仓储费。建议你使用官方利润计算器进行精准测算：https://global-selling.mercadolibre.com/listings/cost-calculator","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-16 17:55:23","用户":"Elvis  Cheung","群":"","用户问询":"full模式下 还是采取净收益模式吗","AI响应":"你好！是的，净收益定价模式（Net Proceeds）仅适用于直接面向消费者的销售和完整的美国物流（即Full模式）。\n\n在该模式下，你只需设定想要获得的净收益（采购成本+利润），系统会自动加上佣金和运费生成前端售价。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-16 17:55:06","用户":"鹤儿","群":"","用户问询":"我是海外仓卖家","AI响应":"你好！很高兴为你解答。海外仓模式适合有稳定销量、希望提升物流时效和买家体验的企业卖家。入驻需准备有限公司营业执照、法人身份证、第三方收款账户及海外邮箱。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-16 17:31:16","用户":"Elvis  Cheung","群":"","用户问询":"full仓的信誉跟其他站点的信誉有交叉影响吗","AI响应":"你好！美客多各站点的店铺信誉是独立核算的，互不影响。例如，墨西哥站点的信誉等级不会影响巴西或智利站点的信誉。但请注意，同一站点内，自发货和Full仓的订单表现会共同影响该站点的整体店铺信誉。","一级大类":"账号入驻与安全","二级子类":"店铺等级","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-16 17:16:16","用户":"Elvis  Cheung","群":"","用户问询":"如何拿到full仓资格","AI响应":"你好！Full仓权限通常由系统根据店铺信誉等级（需处于绿色状态）、销售表现和运营合规性自动激活。建议先通过自发货模式积累数据，各项指标达标后系统会自动在“库存管理”板块开放送仓入口。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-16 15:58:21","用户":"左右","群":"","用户问询":"我想问一下那个FULL仓我们自发货的可以开放么？","AI响应":"你好！很高兴为你解答。\n\nFull仓权限通常由系统根据店铺信誉等级（需处于绿色状态）、销售表现和运营合规性自动激活。建议先通过自发货模式积累数据，各项指标达标后系统会自动在“库存管理”板块开放送仓入口。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 11:40:39","用户":"Rosa Chen（家居家具汽摩配full仓）","群":"","用户问询":"进墨西哥full仓","AI响应":"若跨境海外仓卖家需要发货至平台full仓，首先应找到可发货到墨西哥的第三方物流商，先将货物从国内运至墨西哥本地第三方仓。随后由物流商在系统预约送仓时间，系统分配具体full仓后，按时送仓即可。建议操作前先在后台创建备货计划。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-16 11:08:08","用户":"爱喝咖啡的懒人","群":"","用户问询":"这是平台的货就是FULL的","AI响应":"你好！很高兴为你解答。\n\n既然你确认这是 **FULL（海外仓）** 的货，那这张面单就是最核心的证据。\n\n**1. 核心发现：**\n面单上显示的 **Remitente（发件人）** 是东莞的物流中心，这通常意味着该产品在入库 FULL 仓前，其原始贴标或外包装信息可能存在偏差，或者仓库在二次贴标时出现了混乱。\n\n**2. 针对性回复话术（西语）：**\n\"Hola, gracias por la foto. He verificado que este pedido fue gestionado y enviado directamente por la bodega de **Mercado Libre FULL**. Parece que hubo un error de etiquetado o despacho en el almacén. Por favor, inicie la devolución en el sistema seleccionando **'Recibí algo diferente'**. Yo aprobaré la solicitud de inmediato para que reciba su reembolso. Lamentamos mucho este error del centro de distribución.\"\n\n**3. 后续必做动作：**\n*   **联系客服开 Case**：拿着这张面单图和买家收到的实物图，联系平台客服。明确告知：**“Order #2000017213582 was shipped by FULL warehouse, but the buyer received a completely different product. This is a warehouse picking/labeling error. Please protect my reputation and investigate the stock.”**\n*   **检查库存**：如果这单发错了，说明你 FULL 仓里的同批次货物可能都贴错标了，建议联系经理或客服核查该 SKU 的库存实物，防止后续订单连续报错。\n\n网页参考资料：https://global-selling.mercadolibre.com/help/21258","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 18:02:47","用户":"Janice Tang","群":"","用户问询":"墨西哥海外仓","AI响应":"你好！很高兴为你解答。墨西哥海外仓是目前最成熟、体量最大的站点，支持本土支付并拥有完善的重大件项目。\n\n做该模式需要绑定RFC税号。若暂无税号，可先绑定美金账号再绑定墨西哥本土银行账号以暂时避免代扣代缴。\n\n普通海外仓也可选择自注册：https://global-selling.mercadolibre.com/landing/about","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 15:55:06","用户":"江遇","群":"","用户问询":"巴西海外仓模式店需要什么资料","AI响应":"你的问题我暂时无法回答，后续我会丰富我的知识库，敬请见谅。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 15:53:22","用户":"江遇","群":"","用户问询":"巴西海外仓模式呢","AI响应":"你的问题我暂时无法回答，后续我会丰富我的知识库，敬请见谅。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 15:52:13","用户":"江遇","群":"","用户问询":"海外仓模式店需要什么资料","AI响应":"入驻海外仓模式需要准备：\n1. 中国内地或香港公司营业执照（须是有限公司）。\n2. 法人身份证，且法人需配合人脸识别。\n3. 第三方美金收款账户。\n4. 常用邮箱（建议Gmail/Outlook/Aliyun）及联系电话。\n5. 品牌店需提供R标或TM标。\n\n普通自发货/海外仓也可选择自注册（PC端登入）：https://global-selling.mercadolibre.com/landing/about","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 15:47:21","用户":"丁鑫","群":"","用户问询":"目前墨西哥full低于299比索的单位附加费是怎么收取的？","AI响应":"墨西哥站点单价低于599 MXN时，每件加收20 MXN的固定处理费。此外，若价格在0-99 MXN，额外费用为25 MXN；99-149 MXN为30 MXN；150-250 MXN为37 MXN。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 15:04:36","用户":"Yvonne Wang","群":"","用户问询":"Full仓现在有那几个国家","AI响应":"目前跨境店官方海外仓（Full）开放了墨西哥和智利两个站点。此外，美客多还提供美国转运仓服务，可覆盖墨西哥、智利、哥伦比亚、巴西等站点。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 14:23:11","用户":"David Xu","群":"","用户问询":"墨西哥海外仓","AI响应":"墨西哥海外仓（Full）模式可获得更多流量扶持。\n\n1. 税务：需绑定RFC税号，否则平台将执行36%的强制预扣税。\n2. 流程：先将货发至墨西哥本地第三方仓，再预约送入美客多Full仓。\n3. 费用：涉及仓储费、运费及弃置/撤仓费。\n\n入驻链接：https://global-selling.mercadolibre.com/landing/about\n\n网页参考资料：\nhttps://mp.weixin.qq.com/s/gLZ3iC9XLqFE4j075JaNSg","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 14:16:03","用户":"David Xu","群":"","用户问询":"墨西哥海外仓","AI响应":"墨西哥海外仓（Full）模式是目前的主流选择，产品带Full标志，享受流量倾斜和极速配送。\n\n1. 税务要求：建议办理RFC税号。若无税号，平台将面临约36%的代扣税（16%增值税+20%所得税）。\n2. 入驻资料：中国内地或香港公司营业执照、法人身份证（需人脸识别）、收款账户、谷歌/Outlook等海外邮箱。\n3. 发货流程：需先将货物运至墨西哥本地第三方仓，再通过物流系统预约送入美客多Full仓。\n4. 相关费用：包含仓储费、运费、弃置或撤仓费。\n\n入驻链接：https://global-selling.mercadolibre.com/landing/about\n\n网页参考资料：\nhttps://mp.weixin.qq.com/s/gLZ3iC9XLqFE4j075JaNSg","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 14:14:38","用户":"Supermen阳","群":"","用户问询":"full店铺","AI响应":"你好！很高兴为你解答。海外仓（FULL）店铺入驻，普通自发货/海外仓也可选择自注册（PC端登入）：https://global-selling.mercadolibre.com/landing/about\n\n入驻准备材料：\n1. 中国大陆或香港公司营业执照（需在有效期内）。\n2. 法人身份证彩色扫描件（正反面）。\n3. 能够接收验证码的手机号。\n4. 注册邮箱（建议使用Gmail或Outlook）。\n\n网页参考资料：\nhttps://global-selling.mercadolibre.com/landing/about","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 13:55:52","用户":"Eason丶","群":"","用户问询":"你好这边地址填一个美国第三方海外仓可以吗？还是要填一个墨西哥海外仓","AI响应":"你好！墨西哥站点的退货地址必须填写美国或墨西哥当地的第三方仓地址。若填写美国地址，请确保地址准确且有人签收，否则默认弃置。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 13:43:15","用户":"张丽-深圳市雅乐电子有限公司","群":"","用户问询":"我卖的是的墨西哥full仓","AI响应":"如果你选择的是墨西哥Full仓（海外仓）模式，建议你办理RFC税号。\n\n在墨西哥海外仓模式下，如果你没有提供RFC税号，平台将面临约36%的代扣税（16%增值税 + 20%所得税）。对于跨境卖家，强烈建议选择办理离岸税号，这样可以有效降低税负，提高账户的合规性与安全性。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 13:40:09","用户":"Yancie","群":"","用户问询":"我暂时不需要使用墨西哥海外仓，是自发货模式","AI响应":"卖家您好，收到您的反馈。\n\n如果您确定使用自发货模式（CBT），那么您可以忽略后台关于RFC税号的提示，因为自发货模式目前不需要RFC税号。\n\n从您提供的截图来看，您当前处于“商品 Full”管理界面，这是专门管理海外仓产品的页面。由于您是自发货卖家，后续上架产品时，请确保选择自发货相关的刊登选项。\n\n目前您的首要任务是等待“企业法律信息验证（KYC）”审核通过。一旦审核通过，后台的限制将会解除，您就可以点击截图中的“立即上架”来发布您的首饰类产品了。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"其他","二级子类":"系统报错","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-15 12:43:47","用户":"多宝（跨境定制私人号）","群":"","用户问询":"海外仓自发货模式也能用吗","AI响应":"可以的。国内营业执照申请的跨境店，支持海外仓（FULL）和自发货两种模式，你可以根据业务需求选择其中一种，或者两种模式同时运营。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 10:08:28","用户":"Felicity 103%","群":"","用户问询":"我看到好像没有巴西海外仓","AI响应":"你的问题我暂时无法回答，后续我会丰富我的知识库，敬请见谅。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 18:52:57","用户":"大大大明","群":"","用户问询":"这个是full的意思吗","AI响应":"你的问题我暂时无法回答，后续我会丰富我的知识库，敬请见谅。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 15:36:50","用户":"Will","群":"","用户问询":"第三方海外仓有推荐的吗","AI响应":"你好！很高兴为你解答。目前没有官方指定的第三方海外仓推荐，建议你根据服务商的仓库规模、管理规范程度以及是否拥有自营海外仓等维度进行综合评估和选择。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 15:35:53","用户":"Will","群":"","用户问询":"你好，那个海外仓退回地址没有怎么办啊","AI响应":"你好！必须填写退货地址。若没有海外仓，Full仓退货在20天内未提取将被自动捐赠或销毁。目前这种情况无法退回给商家，建议尽快联系第三方海外仓合作以设置接收地址。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 10:44:49","用户":"Felicity 103%","群":"","用户问询":"带FULL标需要什么条件","AI响应":"你好！很高兴为你解答。\n\n获得FULL标需要将商品发送至美客多海外仓（Fulfillment）进行存储和发货。\n\n基本条件包括：\n1. 使用海外仓模式店铺。\n2. 商品符合海外仓入库尺寸和重量限制。\n3. 完成RFC税号合规。\n4. 在后台创建货件并成功送达仓库上架。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 10:33:25","用户":"Felicity 103%","群":"","用户问询":"美客多墨西哥海外仓低于额299比索收取的固定服务费是怎么计算的？","AI响应":"你好！很高兴为你解答。\n\n在墨西哥站点，当商品单价低于599 MXN时，除了正常的销售佣金外，平台会按件加收20 MXN的固定处理费。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 10:31:30","用户":"有莲","群":"","用户问询":"跨境店铺FULL也是一样的吗","AI响应":"是的，跨境店铺做官方海外仓（FULL）模式也是一样的。务必先在国际收款入口绑定美元账户，刷新后台弹出本土收款入口后，再绑定墨西哥本土银行账户。做海外仓模式需要绑定RFC税号，若暂时没有，按此顺序绑定可暂时避免代扣代缴。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 10:30:25","用户":"Vangogh","群":"","用户问询":"不懂呀，不是可以做full仓的么","AI响应":"你好！很高兴为你解答。\n\n国内营业执照完全可以申请海外仓店铺模式，也就是你提到的Full仓。\n\n在美客多跨境店中，你可以根据自己的业务需求选择不同的发货模式：\n1. 海外仓模式（Full）：你将货物批量运送到美客多位于墨西哥等站点的官方仓库，由平台负责仓储、打包和配送。这种模式物流时效快，能显著提升买家购物体验和转化率。\n2. 自发货模式：由你自行负责从国内发货给买家。\n\n如果你使用国内营业执照申请跨境店并选择墨西哥Full仓模式，通常会涉及墨西哥RFC税号。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 10:06:13","用户":"Felicity 103%","群":"","用户问询":"巴西有海外仓模式吗？","AI响应":"你的问题我暂时无法回答，后续我会丰富我的知识库，敬请见谅。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-13 23:59:26","用户":":-P","群":"","用户问询":"美客多海外仓收入的固定服务费是收入多少？","AI响应":"美客多针对低单价商品会收取低价操作费，也叫固定处理费。当商品单价低于平台设定的门槛时，除了正常的销售佣金外，平台会按件加收这笔固定费用，以覆盖订单的处理成本。\n\n具体站点的收费标准如下：\n墨西哥站点：单价低于599 MXN时，每件加收20 MXN。\n阿根廷站点：单价低于33,000 ARS时，每件加收1,800 ARS。\n智利站点：单价低于15,650 CLP时，每件加收1,650 CLP。\n哥伦比亚站点：单价低于121,000 COP时，每件加收6,700 COP。\n巴西站点：单价低于185 BRL时，每件加收7.5 BRL。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-13 17:17:06","用户":"晨夕","群":"","用户问询":"full不需要缴纳税了吧？","AI响应":"你好！很高兴为你解答。\n\n这里有一个关键的业务逻辑需要区分：**阿根廷站点目前没有海外仓（Full）模式**。\n\n在美客多平台，只有墨西哥、巴西、智利、哥伦比亚这四个国家有本土海外仓（Full）模式。阿根廷目前仅支持**跨境直邮模式**（包括你正在做的FTI美国转运仓模式）。\n\n所以，你看到的那个卖124美金的卖家，他和你一样也是**跨境卖家**。\n\n**关于税费的区别：**\n1. **如果是墨西哥Full模式**：确实不需要买家在下单时额外缴纳进口关税，因为货物已经提前进口到了墨西哥仓库，税费由卖家在进口环节处理（涉及RFC税号）。\n2. **但在阿根廷站点**：无论你是FTI模式还是普通跨境模式，所有商品都是从境外发货。只要单价超过50美金，**阿根廷买家在下单时都必须缴纳进口关税**。\n\n**总结：**\n那个卖124美金的竞争对手，他的买家同样要付关税。按照我刚才的计算，他的买家最终支付总额会接近180美金，而你的买家只需要付约108美金。你在价格和成本控制上（得益于FTI的低佣金和低运费）具有绝对的竞争优势。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-13 17:16:20","用户":"Ryouhi","群":"","用户问询":"怎么激活海外仓功能","AI响应":"在卖家填写的材料审核完成后，可以在后台选择是否激活海外仓账户。卖家可以根据实际需求申请激活海外仓，打开“Activate Fulfillment”按钮即可。\n\n如需要详细操作指引，可参考自助开通海外仓的教程，在后台自主激活：https://www.douyin.com/video/7478234269479914764","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-13 16:37:28","用户":"Andy","群":"","用户问询":"请问没课多 做美国市场嘛？ 还是只做墨西哥 我们有美国海外仓的","AI响应":"你好！美客多主要深耕拉美市场。如果你有美国海外仓，非常适合入驻美客多美国转运仓模式。该模式位于美国德州，支持一仓发拉美，覆盖墨西哥、智利、巴西等站点，且无需办理拉美各国税号，能有效规避税务风险。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"}]},{"业务模块":"海外仓","高频问题":"开通/入驻/审核进度","Past 7 Days":28,"Previous":9,"WoW":2.111111111111111,"代表性问询":"我要入驻海外仓模式，类似于亚马逊FBA模式的店铺，请问我怎么申请？找谁申请？ 我们前面对接了全托管和半托管申请，审核通过了，发现我们想要的是海外仓模式","Past 7 Days代表性问询":"我要入驻海外仓模式，类似于亚马逊FBA模式的店铺，请问我怎么申请？找谁申请？ 我们前面对接了全托管和半托管申请，审核通过了，发现我们想要的是海外仓模式","Previous代表性问询":"就是注册一个店铺，可以同时做6个站点，开通自发货，托管，海外仓模式对吗","__details":[{"时间":"2026-07-19 23:51:13","用户":"TL","群":"","用户问询":"full仓怎么申请","AI响应":"Full仓权限通常由系统根据店铺信誉等级（需处于绿色状态）、销售表现和运营合规性自动激活。建议先通过自发货模式积累数据，各项指标达标后系统会自动在“库存管理”板块开放送仓入口。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-19 19:00:27","用户":"cc","群":"","用户问询":"跨店卖家申请FULL仓需要什么条件","AI响应":"你好！很高兴为你解答。\n\nFull仓权限通常由系统根据店铺信誉等级、销售表现和运营合规性自动激活。具体要求如下：\n\n1. 店铺信誉等级：需要处于绿色状态。\n2. 销售表现：建议先通过自发货模式积累销售数据。\n3. 运营合规性：各项运营指标需达到平台标准。\n\n当各项指标达标后，系统会自动在“库存管理”板块开放送仓入口。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-19 18:58:56","用户":"cc","群":"","用户问询":"请问跨境店可以申请full仓码？","AI响应":"你好！很高兴为你解答。\n\n跨境卖家是可以申请Full仓权限的。Full仓权限通常由系统根据店铺信誉等级（需处于绿色状态）、销售表现和运营合规性自动激活。\n\n建议你先通过自发货模式积累数据，当各项指标达标后，系统会自动在“库存管理”板块开放送仓入口。\n\n若你已经获得了权限并准备发货，操作流程如下：\n1. 在卖家后台完成备货计划的创建。\n2. 找到可发货到墨西哥的第三方物流商，先将货物从国内运输到墨西哥本地第三方仓。\n3. 让物流商在物流系统线上预约送仓时间，系统会将货件分配到具体的某个Full仓。\n4. 物流商根据预约的时间和地点按时送仓即可。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-19 17:37:18","用户":"爱老虎呦🐯","群":"","用户问询":"你好。现在新入驻的跨境店可以直接开通海外仓吗？我这边只想做海外仓","AI响应":"你好！可以的。新入驻的跨境店可以直接开通海外仓模式。\n\n在注册过程的第六步，勾选“Request activation”选项即可申请。注册成功后，在卖家后台点击“Activate Fulfillment”按钮即可激活。目前海外仓入驻无需流水。\n\nPC端入驻链接：https://global-selling.mercadolibre.com/landing/about","一级大类":"账号入驻与安全","二级子类":"入驻流程","问题主题":"入驻/注册/开店流程"},{"时间":"2026-07-19 10:17:18","用户":"2号线","群":"","用户问询":"我是跨行初次做美客多墨西哥站的电商卖家，跨境店做半托管官方墨西哥FULL海外仓，关于我想深入知道美客多售卖柯达储存卡等小件电子产品，从开店到上架标题详情页广告客服等整个环节，从上架第一个产品到后续其他产品，从时间和专业运营考虑需要怎么规划设计才能让每一个产品链接得到自然流的最大流量扶持，哪些情况下才能需要考虑打广告和参加活动，怎么样得到店铺做平台最快的流量和持续流量，得到最好信誉指数 我喜欢高效率沟通，结合以上我需求请帮我做一个系统深入的执行可落地且生效的方案","AI响应":"你好！很高兴能为你提供一份系统且可落地的运营方案。针对柯达存储卡这类高频、标品且竞争激烈的电子产品，建议按以下四个阶段执行：\n\n**第一阶段：极速启动与信誉建立（第1-2周）**\n1. **快速拿绿标**：新店最核心的任务是完成前10单履约。建议首批产品上架后，通过适度降价（比竞品低5%-10%）或站外引流，迅速完成10个订单，拿到绿色信誉，这是开启所有流量通道的“入场券”。\n2. **Listing精细化**：\n   - **标题**：品牌+产品名+核心参数（如：Kodak Micro SD 128GB Class 10）。\n   - **图片**：必须包含3张以上高清图，展示包装、防伪标识及使用场景。\n   - **属性**：填满所有技术参数，这直接影响搜索权重。\n\n**第二阶段：利用官方工具撬动自然流（第3-4周）**\n1. **Clips短视频**：这是目前最高效的免费流量入口。为存储卡拍摄15-60秒的实拍视频（展示读写速度、兼容设备），能提升25%-30%的销量。\n2. **半托管/FULL入仓**：确保产品带有“Full”标识。墨西哥买家极度依赖物流时效，Full标自带流量权重和转化加持。\n\n**第三阶段：广告与活动组合拳（第2个月起）**\n1. **开启广告（Product Ads）**：\n   - **触发条件**：Listing有基础销量（评价）且信誉为绿。\n   - **策略**：新品期设置较高的目标ACOS，与有销售记录的商品抢夺曝光。\n2. **参加平台活动**：美客多的Hot Sale、Buen Fin等活动是免费参加的。只要系统提示可提报，务必参加，这是获取爆发式流量的最快路径。\n\n**第四阶段：持续增长与信誉维护**\n1. **降价反应期**：注意系统对降价的反应有4天左右的周期，不要频繁调价，给算法留出学习时间。\n2. **售后管理**：存储卡易出现兼容性投诉，务必在详情页写清兼容设备，并及时回复买家消息，避免因投诉导致信誉降级。\n\n**核心总结：**\n- **最快流量**：降价出单拿绿标 + Clips短视频。\n- **持续流量**：保持Full仓库存充足 + 持续参加平台促销。\n- **最好信誉**：严控产品质量，确保100%准时发货，积极处理售后。\n\n建议你先从精选10-20款核心SKU开始，精细化运营每一个Listing，而非盲目铺货。","一级大类":"账号入驻与安全","二级 l、Foxmail邮箱。\n\n在注册美客多时，请务必避开QQ、163、126以及新浪邮箱，以免无法收到注册链接或审核通知。如果谷歌等国外邮箱注册不便，您可以尝试注册阿里云邮箱（Aliyun）或者Foxmail。\n\n普通自发货/海外仓也可选择自注册（PC端登入）：https://global-selling.mercadolibre.com/landing/about\n\n入驻准备材料：\nA.中国内地或香港公司营业执照（不接受个体户，须是“有限公司”）\nB.法人身份证，法人需配合人脸识别认证\nC.收款的银行账户，第三方收款账户/非美国银行账户\nD.邮箱及联系人电话，不接受163、QQ、新浪等国内邮箱，请使用谷歌邮箱，Outlook邮箱，阿里云邮箱。\nE.品牌店还需R标或TM标。\nF.一套资料，只可以注册一个店铺（之前注册过美客多的信息 不可以重复使用）","一级大类":"账号入驻与安全","二级子类":"入驻流程","问题主题":"入驻/注册/开店流程"},{"时间":"2026-07-13 12:18:48","用户":"LianG","群":"","用户问询":"就是常规的full店铺注册的对吗","AI响应":"是的，该链接适用于常规的跨境海外仓（FULL）及自发货普通店。请在PC端登录并建议在VPN环境下提交注册。\n\n入驻准备材料：\n1. 营业执照：中国大陆（有限责任公司）或香港公司彩色扫描件。\n2. 法人身份证：有效期内的彩色扫描件，需配合人脸识别。\n3. 收款账户：美金银行账户或第三方收款账户。\n4. 联系方式：建议使用Gmail/Outlook/Aliyun等邮箱及中国大陆手机号。\n\n普通自发货/海外仓也可选择自注册（PC端登入）：https://global-selling.mercadolibre.com/landing/about","一级大类":"账号入驻与安全","二级子类":"入驻流程","问题主题":"入驻/注册/开店流程"}]},{"业务模块":"海外仓","高频问题":"发货/物流/运费/尾程","Past 7 Days":28,"Previous":28,"WoW":0,"代表性问询":"海外仓物流是什么样的呢","Past 7 Days代表性问询":"海外仓物流是什么样的呢","Previous代表性问询":"这种带有FULL标志的但是发货地在中国的方式要在后台怎么操作","__details":[{"时间":"2026-07-19 19:39:28","用户":"D~","群":"","用户问询":"除了仓储费是不从净收益中扣除，其他的比如尾程运费，税费，服务费是扣除掉了的吧","AI响应":"你好！很高兴为你解答。\n\n是的，你的理解基本正确。\n\n在海外仓模式下，当你设置“净收益（Net Proceeds）”时，系统已经帮你自动扣除了以下费用：\n1. **平台销售佣金**\n2. **尾程配送费**（即发给买家的运费）\n3. **增值税/所得税**（如果涉及代扣代缴）\n\n也就是说，你在后台看到的那个“净收益”数值，就是已经减去上述费用后，平台预计会打入你账户的钱。\n\n而**仓储费**、**广告费**以及可能产生的**超重附加费**或**退货处理费**，通常不会体现在单笔订单的净收益计算中，而是作为店铺的整体支出，定期从你的账户总余额里扣除。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-19 19:36:19","用户":"D~","群":"","用户问询":"海外仓模式，如果净收益写的是2美元，是要扣除我国内运费和国内运到国外官方仓的运费，还要扣除我的货品价值吧","AI响应":"你好！很高兴为你解答。\n\n是的，你的理解非常到位。\n\n在海外仓模式下，如果你设置净收益为 2 美元，这 2 美元就是平台最终结算给你的钱。你必须用这 2 美元去覆盖以下所有成本：\n1. **货品价值**：你采购这件商品的成本。\n2. **国内段运费**：你把货发给国内货代仓库的快递费。\n3. **头程运费**：货代帮你把货从中国运到墨西哥官方仓的空运或海运费。\n4. **其他杂费**：比如贴标费、打包费等。\n\n剩下的才是你真正的纯利润。所以，如果你的货品成本加上头程运费就已经超过 2 美元了，那你设置 2 美元的净收益就会亏本。在定价时，请务必把这些成本全部加进去。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-19 19:31:47","用户":"D~","群":"","用户问询":"就是平台给了我10件的数量，我把这10件从国内找货代发到国外的官方仓，然后出单了就是平台负责尾程派送吧 这个意思么？","AI响应":"你好！很高兴为你解答。\n\n是的，你的理解完全正确。\n\n具体的流程就是：\n1. **头程发货**：你按照系统给的 10 件额度，在国内找货代把这 10 件货运到墨西哥官方仓。\n2. **官方入库**：货物到了仓库并上架后，你的产品链接就会显示“FULL”标识。\n3. **自动派送**：一旦有买家下单，美客多仓库的工作人员会直接从架上取货、打包，并安排快递送到买家手里。\n\n这个过程中，出单后的所有打包和发货动作你都不需要参与，非常省心。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-19 19:25:08","用户":"D~","群":"","用户问询":"海外仓物流是什么样的呢","AI响应":"你好！很高兴为你解答。\n\n海外仓模式（在美客多被称为 FULL 模式）的物流流程非常清晰，类似于亚马逊的 FBA，具体步骤如下：\n\n1. 卖家备货：你先在国内采购货物，并按照平台的贴标要求完成打包。\n2. 跨境运输：你联系货代，通过海运或空运将货物从中国运送到美客多位于当地（如墨西哥、智利等）的官方仓库。\n3. 官方入库：货物到达后，美客多仓库会进行清点并上架。\n4. 订单处理：一旦有买家下单，美客多官方仓库会自动抓取订单，负责拣货、包装并进行尾程派送。\n5. 售后物流：如果发生退货，通常也是退回到美客多的官方仓库。\n\n海外仓模式的优势：\n1. 配送极快：当地发货，通常 3-5 天就能送达买家手中。\n2. 流量倾斜：产品会有“FULL”标识，搜索排名更靠前，转化率比自发货高出数倍。\n3. 运营省心：出单后你不需要自己找快递发货，平台全权负责。\n\n如果你想做海外仓模式，需要具备一定的备货资金和稳定的销量。\n\n关于墨西哥 RFC 税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-19 17:22:47","用户":"TL","群":"","用户问询":"你好，我问一下上门揽收的话，是快递员取件了后台就显示发货 还是要等到揽收仓以后才扫描单号才显示发货","AI响应":"你好！很高兴为你解答。\n\n上门揽收后，需要等包裹送达物流承运商的集运仓，并由物流商完成收件扫描（A-scan）后，系统才会自动回传Tracking ID，此时订单状态才会从“Ready to ship”变为“In transit”，即显示发货成功。\n\n请务必预留充足时间，确保订单在出单后48小时内送达仓库并完成扫码。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-19 14:25:45","用户":"灯火星星","群":"","用户问询":"这个图片中带FULL字样的是不是都是海外仓发货的模式？","AI响应":"你好！很高兴为你解答。是的，在美客多买家前台，带有“FULL”标志的商品即代表该商品通过海外仓模式发货，由平台负责仓储和配送。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-18 21:02:48","用户":"灯火星星","群":"","用户问询":"就是自发货和海外仓模式都集中在了一个站点下，可以安排自发货也可以通过海外仓发货吗？","AI响应":"你好！很高兴为你解答。是的，美客多支持卖家从自发货模式转为海外仓（FULL）模式，或者两种模式同时运营。海外仓可以根据卖家需求在后台自动激活，申请下来不激活也不影响店铺只做自发货。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 20:56:12","用户":"啊楼🍉","群":"","用户问询":"full美国转运仓包装袋是要半透明？","AI响应":"你好！是的，所有产品必须使用半透明包装，且包装需完全覆盖产品。此外，必须在包装外部标注通用代码或可见的产品标签。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 16:19:26","用户":"ღ ᥫᩣ🐭","群":"","用户问询":"广州白云鹤龙路有美客多full仓直发的物流公司电话吗","AI响应":"你好！很高兴为你解答。目前我这里没有特定区域（如广州白云鹤龙路）物流公司的具体联系电话。建议你咨询为你开店的招商经理，或在美客多官方卖家群、行业社群中寻找推荐。选择货代时，请务必确认其具备美客多官方海外仓（Full）的送仓资质。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 15:45:43","用户":"**2","群":"","用户问询":"那些产品是通过中国的官方物流运到海外仓库吗","AI响应":"不是的。官方海外仓（Full）模式需要卖家自行负责将货物从中国运送至美客多位于目的国的官方仓库。货物到仓并完成上架后，后续的订单出库、末端配送及售后服务才由美客多官方物流负责。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 20:13:07","用户":"啊楼🍉","群":"","用户问询":"这里怎么下载每个商品的标签 美国full 转运仓","AI响应":"你好！在发货流程中，点击图片中红色箭头所指的“Identify your products by verifying their ID”这一栏右侧的蓝色箭头，进入后即可看到下载商品标签（Product labels）的选项。下载时有不同尺寸可选，请确保打印清晰并张贴在每个商品的独立包装上。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-16 12:00:49","用户":"纯属巧合","群":"","用户问询":"你好， 现在墨西哥半托管的尾程费用是按照哪个算的？","AI响应":"你好！很高兴为你解答。\n\n半托管模式下，商家的定价逻辑和运费承担方式与常规模式不同。\n\n在半托管模式下，商家不需要自己支付尾程费用，也不需要设置包邮或不包邮。\n\n半托管采用的是收益价格模式（Net Proceeds）：\n1. 商家定价：你只需要设置你想要获得的收益（即商家供货价）。这个价格建议包含：单件货物成本 + 你的目标利润 + 单件国内发货到东莞仓的物流成本（需转化成美元填写）。\n2. 平台处理：剩余的官方收费部分，包括平台佣金和尾程运费，平台会进行前端售价藏价。也就是说，平台会根据算法统一计算这些费用并展示给消费者，不需要商家手动计算尾程运费。\n\n简单来说，你只需要考虑你想拿回多少钱，剩下的运费和佣金由平台在前端价格中自动处理。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 11:20:25","用户":"Hz","群":"","用户问询":"你好，请问下价格不同full的配送费是否不同","AI响应":"你好！很高兴为你解答。\n\nFull仓的配送费主要受商品重量和尺寸影响，与商品价格高低没有直接关系。\n\n在海外仓（Full）定价模式下，你需要根据商品重量和尺寸手动扣除尾程配送费。此外，实际扣款明细中还会包含平台佣金、广告费、仓储费以及可能的税费等。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 18:29:49","用户":"。","群":"","用户问询":"把商品给菜鸟揽收仓后就算发货完成了是吗","AI响应":"是的，当您将包裹送达菜鸟国内揽收仓，且仓库完成扫描入库（A-scan）后，该订单在系统上的发货流程就算正式完成了。\n\n需要注意以下几点：\n1. 扫描时效：包裹送达仓库后，仓库通常会在24小时内完成扫描。\n2. 状态更新：只有在仓库扫描后，订单状态才会从“待发货”变更为“已发货”，此时才算真正规避了发货延迟的风险。\n3. 责任划分：一旦仓库完成扫描，后续的国际运输、清关以及目的地派送将由美客多官方物流负责，不再计入卖家的发货时效考核。\n\n建议您在包裹送达后及时关注后台订单状态的变化，确保扫描成功。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 16:39:43","用户":"窦红建","群":"","用户问询":"根据当地政策，发往墨西哥或智利海外仓的商品的初级包装上必须贴附西班牙语标签（标明原产地、成分、储存条件等信息）。 您可以自行编辑标签信息或向您的客户经理领取标签模板。 每个商品外包装上都要有贴完整的这个，还是说只做个简单的格式就可以？就像**Hecho en China**这样的？","AI响应":"你好！根据你提供的图片和描述，每个商品的外包装上必须贴附完整的西班牙语标签，不能只贴简单的“Hecho en China”。\n\n拉美各国（尤其是墨西哥和智利）的海关清关以及当地消费者权益保护法对此有硬性要求。你图片中的模板已经包含了核心要素，建议按照以下要求完善并张贴：\n\n1. 完整性要求：每个发往海外仓的最小销售单元（即买家收到的那个包装）都必须张贴。\n2. 核心内容：\n- Fabricante（制造商名称）：需与实际生产商一致。\n- Dirección（地址）：制造商的详细地址。\n- Nombre del producto（产品名称）：必须使用西班牙语。\n- País de origen（原产地）：Hecho en China。\n- Material（材质/成分）：如你图片中的 ABS，如果是服装则需标注纤维成分。\n- Lote de producción（生产批次）和 Fecha de producción（生产日期）：建议填上，方便追溯。\n- Peso neto（净重）：如 1.27KG。\n3. 物理要求：标签必须牢固粘贴或印刷在包装上，文字清晰，不能轻易脱落。\n\n总结：只贴“Hecho en China”风险很高，极可能导致清关被扣、仓库拒收或买家投诉。请务必使用你图片中这种包含详细信息的完整西语标签。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-15 15:05:17","用户":"Yvonne Wang","群":"","用户问询":"那full仓智利发货的接收地址，也是要先发到墨西哥本地仓嚒","AI响应":"智利Full仓发货不需要发往墨西哥。跨境卖家需先找到可发货到智利的第三方物流商，将货物运至智利本地，再由物流商在系统预约并送往系统分配的智利Full仓。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 15:02:44","用户":"Yvonne Wang","群":"","用户问询":"你好！CBT跨境卖家 国内发货去FULL仓的接收地址是什么？","AI响应":"跨境卖家发货到Full仓需先通过第三方物流运至墨西哥本地仓。随后物流商在线预约，系统会分配具体Full仓地址，物流商再按约送达。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 14:41:46","用户":"Sahara","群":"","用户问询":"巴西本土店入full仓包装","AI响应":"你的问题我暂时无法回答，后续我会丰富我的知识库，敬请见谅。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 14:40:29","用户":"Sahara","群":"","用户问询":"美客多巴西本土店入full仓需要的包装是什么","AI响应":"你的问题我暂时无法回答，后续我会丰富我的知识库，敬请见谅。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 08:30:05","用户":"三横一竖","群":"","用户问询":"发full仓产品是否需要贴产地标签，是否有模板","AI响应":"目前知识中未提及发往Full仓的产品是否需要贴产地标签及相关模板。\n\n关于发往Full仓的产品标识，请遵循以下核心要求：\n1. 必须使用Mercado Libre提供的唯一且不可转让的标签。\n2. 标签需贴在产品最小包装最大的一侧，保持平整，严禁折叠或贴在封口处。\n3. 必须移除或覆盖包装上原有的旧条形码。\n4. 即使是原厂箱内的单品，也必须逐一贴标。\n\n若涉及墨西哥RFC税号相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 15:42:12","用户":"南笙","群":"","用户问询":"请问下送往墨西哥full仓的货，有部分说是包装问题或者其他问题 不可售 这个可以查到具体的原因吗","AI响应":"你好！很高兴为你解答。\n\n当商品被标记为不可售库存时，仓库会对退回商品进行质检。如果判定为损坏、包装破损或已使用，商品就会变为不可售状态。\n\n关于查询具体原因，你可以通过卖家后台的库存管理页面查看这些不可售商品的状态。通常情况下，仓库会根据质检结果将商品分类，你可以看到是因为商品损坏还是包装问题导致的不可售。\n\n对于这些不可售库存，你需要注意以下处理方式：\n1. 你需要通过后台预约提取（Pick Up）到当地第三方仓。\n2. 如果不可售商品在仓库停留超过规定时间（通常为20天）且未被提取，平台将会对商品进行捐赠或销毁处理。\n\n建议你定期检查后台库存状态，及时处理不可售商品，以免造成不必要的损失。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 15:25:30","用户":"ㅤ  ㅤ","群":"","用户问询":"尾程配送费怎么是从美国全境发往墨西哥呢我的站点就在墨西哥你们美客多在墨西哥应该也有站点呀","AI响应":"你好！美客多在墨西哥设有本地海外仓（FBM）。若你从墨西哥本地仓库发货至美客多仓库，仅需支付本地尾程配送费。此前提到的美国发货是指美国转运仓模式，若你已在墨西哥本地补货，则按墨西哥本土配送标准计费。\n\n网页参考资料\n美客多墨西哥站点尾程配送费用：https://global-selling.mercadolibre.com/help/40025","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 15:17:15","用户":"ㅤ  ㅤ","群":"","用户问询":"自发货模式的尾程费用是如何计算","AI响应":"你好！美客多自发货运费均按货件毛重计收，直接与平台结算。售价低于包邮门槛的商品运费由买家承担，高于门槛的则由卖家支付。您只需录入目标净收益，系统会自动叠加运费与佣金生成最终售价。具体账单可于卖家后台查看。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 10:40:24","用户":"゛大梦三生゛","群":"","用户问询":"海外仓发货为什么产品缺少了配件，我应该怎么办","AI响应":"你好！很高兴为你解答。针对海外仓发货缺少配件的问题，建议你按以下步骤处理：\n\n1. 及时回复客户咨询，在24小时内提供解决方案，保持专业和礼貌。\n2. 平台处理方式包括全额退款、部分退款或换货，具体需根据实际情况和平台政策决定。\n3. 建议核查发货前的装箱清单，避免后续再次出现漏发。\n\n若需进一步协助，请联系平台后台确认。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 15:39:04","用户":"不退转","群":"","用户问询":"我指的是半托管、全托管的头程、尾程运费","AI响应":"你好！很高兴为你解答。\n\n在美客多半托管和全托管模式下，运费的承担方式和计算逻辑如下：\n\n1. 半托管模式：\n- 头程运费：商家需要负责将货物发送至美客多位于国内的东莞仓，这部分的物流成本由商家自行承担。\n- 国际段及尾程运费：由平台负责。在定价时，商家采用的是收益价格模式（Net Proceeds），你只需要设置想要获得的收益（即供货价 = 单件货物成本 + 目标利润 + 国内发货到东莞仓的物流成本）。平台会自动在前端售价中进行藏价，包含国际运费、尾程运费和佣金，无需商家人工计算。\n\n2. 全托管模式：\n- 头程运费：商家仅需负责将货物发往国内指定仓库。\n- 国际段及尾程运费：全托管模式下享有“0国际运费”的政策，后续全流程的物流配送由平台负责。\n\n总结来说，这两种模式下，商家都不需要直接支付国际段和海外尾程的运费，也不需要设置包邮或不包邮，平台会通过系统自动计算并展示给消费者。\n\n网页参考资料\n关于这两种模式的深度解析，您可以参考以下视频内容：\n视频名字：美客多半托管模式全解析\n知识点：半托管与全托管模式对比及优势\n视频时刻点：05:15\n视频链接：https://mercadolibre.cn/news/info?id=215&type=live","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 10:48:39","用户":"Rosa Chen（家居家具汽摩配full仓）","群":"","用户问询":"是不是客户退货导致外箱破损 到了full仓后需要找货代重新包装啊 官方仓没法给换包装对吗","AI响应":"当买家发起退货后，商品会退回到美客多官方仓库。仓库工作人员会对退回的商品进行质检。\n\n如果商品在质检过程中被判定为损坏、包装破损或已使用，该商品将被标记为不可售库存。对于不可售库存，平台不会自动进行二次销售，也不会提供更换包装的服务。\n\n您需要通过后台的库存管理页面，选择将这些商品提取。如果不可售商品在仓库停留超过规定时间，通常为20天且未被提取，平台将会对商品进行捐赠或销毁处理。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 10:01:31","用户":"a","群":"","用户问询":"墨西哥full运费","AI响应":"墨西哥Full海外仓运费由以下部分组成：\n1. 尾程配送费：根据商品重量和尺寸计算。\n2. 仓储费：按商品占用的体积（立方分米）和存放天数计费。\n3. 基础服务费：包括入库、拣货、包装等处理费用。\n\n具体费用需在后台根据商品实际规格核算。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 08:41:14","用户":"晨夕","群":"","用户问询":"还要仓储费和头程物流费，佣金也高","AI响应":"你好！很高兴为你解答。\n\n你观察得很仔细，确实在成本结构上，美国转运仓（美仓）模式和自发货模式有明显区别。但之所以建议你考虑美仓，是因为它在成本之外提供了更高的**综合收益**：\n\n**1. 关于仓储费与头程：**\n虽然美仓需要你承担头程运费和仓储费，但它实现了**“一仓卖多国”**。你只需要发货到美国德州，就可以同时覆盖墨西哥、智利、阿根廷、巴西、哥伦比亚。相比于自发货每出一单都要付昂贵的国际小包运费，美仓通过批量发货到德州，平摊到单件商品上的物流成本其实更低。\n\n**2. 关于佣金：**\n美仓模式的佣金确实存在，但它换取的是**极高的转化率**。美仓商品在搜索结果中拥有更高的权重，且买家更信任官方配送。对于高客单价产品，买家更愿意为这种“官方保障”买单，这能帮你实现更高的溢价，从而覆盖掉佣金成本。\n\n**3. 运营效率的提升：**\n自发货模式下，你每天都要处理打包、贴单和发货，且物流时效不稳定，容易产生投诉。美仓模式下，出单后由官方自动发货，你只需要关注补货和运营，极大地节省了人力成本。\n\n**4. 避税优势：**\n正如之前提到的，美仓模式属于跨境直邮，在墨西哥不需要办理RFC税号，这为你省去了大笔的税务合规费用和复杂的申报流程。\n\n**总结：**\n如果你追求的是**极致的单量爆发和多国布局**，美仓的投入产出比通常优于自发货。如果你目前更看重**零库存压力和低启动成本**，那么自发货确实更适合前期测款。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\n\n网页参考资料：\nhttps://global-selling.mercadolibre.com/landing/about","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"}]},{"业务模块":"海外仓","高频问题":"RFC/税号是否必需/扣税影响","Past 7 Days":19,"Previous":15,"WoW":0.26666666666666666,"代表性问询":"美客多跨境full店rfc过了验证要求的时间还可以上传吗","Past 7 Days代表性问询":"美客多跨境full店rfc过了验证要求的时间还可以上传吗","Previous代表性问询":"我们目前还没有海外仓的销售数据。是否可以7月20日后继续进行rfc税号的邮箱验证","__details":[{"时间":"2026-07-18 16:15:31","用户":"ㅤ  ㅤ","群":"","用户问询":"36%的预扣税是针对所有跨境卖家统一适用，还是仅针对符合特定税务身份的卖家？如果我是中国主体注册的跨境店，使用第三方海外仓，是否同样适用36%预扣？\"","AI响应":"你好！36%的预扣税率适用于所有存储在墨西哥境内商品产生的销售，包括跨境店Full仓及三方仓模式。如果你是中国主体注册的跨境店且使用第三方海外仓，若未上传RFC税号，同样适用36%的强制预扣。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-18 15:32:56","用户":"野海","群":"","用户问询":"目前只是需要注册店铺，不销售，注册海外仓可以不提交墨西哥RFC税号吗","AI响应":"你好！很高兴为你解答。\n\n注册美客多墨西哥站海外仓模式时，目前不强制要求在注册阶段就提交RFC税号。\n\n您可以先完成店铺注册并激活，在没有税号的情况下，您可以先绑定非大陆/香港的美金账号，再绑定墨西哥银行账号，这样可以暂时避免代扣代缴。\n\n但请注意，如果您后续开始使用海外仓发货销售，且在2026年1月1日后仍未上传有效RFC税号，平台将依法对您的销售额按36%的税率实施强制预扣。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-18 15:16:27","用户":"野海","群":"","用户问询":"美客多墨西哥站点注册海外仓，必须要提交墨西哥RFC税号资料吗","AI响应":"你好！很高兴为你解答。\n\n做美客多墨西哥官方海外仓模式是需要绑定境外RFC税号的。\n\n如果您暂时还没有RFC税号，可以先绑定美金账号，再绑定墨西哥本土银行账号，平台暂时不会代扣代缴，等申请到税号后再绑定即可。\n\n但需要注意的是，根据墨西哥政府最新税务法规要求，自2026年1月1日起，所有电商平台须按新标准执行预扣缴义务。如果您在2026年1月1日后仍未上传有效RFC税号，平台将依法对您的墨西哥海外仓销售额按36%的税率（16%增值税 + 20%所得税）实施强制预扣税。\n\n如果您选择的是自发货模式，则不需要提供RFC税号。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-18 14:39:38","用户":"ㅤ  ㅤ","群":"","用户问询":"你好货物备到美客多官方仓需要RFC税号对吧那备货道第三方海外仓库呢也需要吗","AI响应":"你好！只要货物存储在墨西哥境内（无论是美客多官方仓还是第三方海外仓）并进行销售，根据墨西哥税法，都需要绑定RFC税号。若未绑定，平台将按36%的税率进行代扣代缴。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-18 04:47:56","用户":"楠","群":"","用户问询":"您好，墨西哥自发货full仓的要求，税号和发票类的，美妆香水类什么要求","AI响应":"你好！很高兴为你解答。\n\n关于你的问题，要求如下：\n\n1. 税号要求：自发货模式目前不需要RFC税号。但如果你使用Full仓（海外仓），建议办理RFC税号，否则平台将按36%的税率执行预扣。\n\n2. 发票要求：根据墨西哥法律，卖家必须向所有墨西哥客户开具带有RFC编号的发票。\n\n3. 品类限制：香水属于禁运品，无法通过自发货或Full仓销售。美妆类膏体、易碎品发往Full仓需用保鲜膜二次加固，且面单需清晰粘贴在箱体外侧。\n\n网页参考资料：\nhttps://global-selling.mercadolibre.com/help/27305","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-17 09:40:56","用户":"Chris","群":"","用户问询":"因为我需要申请海外仓 我这边税号已经弄好了，下一步怎么做","AI响应":"你好！很高兴为你解答。既然你已经准备好了RFC税号，请按照以下步骤操作：\n\n1. **激活海外仓权限**：登录卖家后台，在设置中找到“Activate Fulfillment”按钮并打开。如果后台未自动开启，你可以参考此教程自主激活：https://www.douyin.com/video/7478234269479914764 \n\n2. **绑定RFC税号**：在后台税务设置板块上传你的RFC证书（CSF文件）。绑定成功后，可以避免被平台执行36%的高额预扣。\n\n3. **创建货件送仓**：权限开启后，你可以在“库存管理”板块创建送仓计划，预约送货时间并将货物发往墨西哥官方仓库。\n\n4. **联系经理**：如果你已有对接的招商经理，请将店铺名、注册邮箱及已开通海外仓的情况告知经理，以便获得后续的运营扶持。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-16 17:32:43","用户":"Elvis  Cheung","群":"","用户问询":"我是跨境自发货卖家，在full仓模式下我的墨西哥税号该如何解决","AI响应":"你好！很高兴为你解答。\n\n作为跨境卖家，如果你想使用墨西哥海外仓（Full仓），建议办理**离岸RFC税号**，其合规性与账户安全性最高。\n\n你可以通过以下方式解决：\n1. **自行申请或找代办**：联系专业的税务代理机构协助办理墨西哥RFC税号。\n2. **绑定后台**：拿到税号后，在卖家后台绑定。如果不绑定，平台将对你的销售额实施约36%的强制预扣税（16%增值税+20%所得税）。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/gLZ3iC9XLqFE4j075JaNSg?from=industrynews&version=4.1.22.6009&platform=win","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-16 17:28:08","用户":"Elvis  Cheung","群":"","用户问询":"full仓需要什么资质，税号，发货时效，备货周期等等？","AI响应":"你好！很高兴为你解答。\n\n关于Full仓（海外仓）的相关要求如下：\n\n1. **资质与税号**：入驻需中国内地或香港公司执照（不接受个体户）。使用墨西哥Full仓必须绑定墨西哥RFC税号，否则平台会代扣最高36%的税费。\n2. **发货要求**：膏体、易碎品需保鲜膜二次加固，面单需清晰贴在箱外。首次送仓需提前约号。\n3. **时效与备货**：Full仓由平台负责末端配送，时效极快。备货周期需根据你的销量表现和库存周转自行规划，建议通过自发货积累数据后再行备货。\n4. **开通条件**：店铺信誉需为绿色，系统会根据销售表现自动激活权限。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/gLZ3iC9XLqFE4j075JaNSg?from=industrynews&version=4.1.22.6009&platform=win","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-16 13:47:13","用户":"lxy","群":"","用户问询":"要进行海外仓是不是要墨西哥的RFC呢","AI响应":"你好！很高兴为你解答。\n\n关于墨西哥海外仓是否需要RFC税号，具体情况如下：\n\n1. 政策要求：\n做墨西哥海外仓模式是需要绑定境外RFC税号的。根据墨西哥政府最新税务法规要求，自2026年1月1日起，所有通过墨西哥海外仓进行销售的订单，如未上传有效RFC税号，平台将依法对您的墨西哥销售额按36%的税率实施强制预扣税（16%增值税 + 20%所得税）。\n\n2. 现状建议：\n虽然目前未提供RFC税号不影响您在美客多平台的现有销售权限，但为了避免高额的代扣税，强烈建议您办理RFC税号。对于跨境卖家，建议选择离岸税号，其合规性与账户安全性最高。\n\n3. 临时方案：\n如果暂时还没有RFC税号，可以先绑定非大陆/香港的美金账号，再绑定墨西哥本土银行账号，平台暂时不会代扣代缴，等申请到税号后再补充绑定即可。\n\n4. 自发货模式：\n如果您选择的是自发货模式，则不需要提供RFC税号，目前不涉及墨西哥36%的增值税代扣。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-16 10:13:51","用户":"窦红建","群":"","用户问询":"就是如果我按36￥的税率强制预扣，但没有RFC，也是可以把货发到官方海外仓进行销售吧？","AI响应":"你好！很高兴为你解答。\n\n是的，没有RFC税号也可以将货物发往官方海外仓进行销售。RFC税号目前并不是强制性的准入门槛，不影响你现有的销售权限。\n\n但是，如果你在没有绑定有效RFC税号的情况下使用海外仓模式，平台将依法对你的墨西哥销售额执行最高约36%的强制预扣税（包含16%增值税和20%所得税）。\n\n从长期经营和利润空间的角度考虑，建议你自行评估是否需要准备RFC税号。如果你打算长期深耕墨西哥海外仓，办理离岸税号的合规性与账户安全性是最高的。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-16 10:12:12","用户":"窦红建","群":"","用户问询":"没有税号，不能发官方海外仓吗？","AI响应":"你好！根据你提供的截图和平台政策，做墨西哥官方海外仓模式是需要绑定 RFC 税号的。\n\n虽然目前没有 RFC 税号不影响你在平台的现有销售权限，但如果你选择海外仓模式且没有税号，平台将面临约 36% 的代扣税（16% 增值税 + 20% 所得税）。\n\n如果你暂时还没有申请到 RFC，可以先通过以下方式操作：\n1. 绑定非大陆/香港的美金账号。\n2. 再绑定墨西哥本土银行账号。\n这样操作可以暂时避免代扣代缴，等后续申请到 RFC 税号后再进行完善绑定即可。\n\n需要注意的是，自 2026 年 1 月 1 日起，所有通过墨西哥海外仓销售的订单，如果未上传有效 RFC 税号，平台将依法按 36% 的税率执行强制预扣。因此，强烈建议你尽早办理离岸 RFC 税号，以确保合规经营和账户安全。\n\n关于墨西哥 RFC 税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-15 17:03:24","用户":"Felicity 103%","群":"","用户问询":"My Mexico Full RFC verification issue is being routed to the wrong support entry. I already submitted the complete RFC information and the Tax Registration Certificate, but the page still says an RFC number is required to operate. Please route me to the correct team manually.","AI响应":"Hello! I'm happy to help. For RFC verification issues, please scan the QR code to add the Mercado Libre AI Assistant for 24/7 support, or visit the Global Selling Help Center to chat with a live agent for one-on-one assistance.","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-15 13:09:38","用户":"Jungle King    Jackie","群":"","用户问询":"不在墨西哥官方海外仓模式运营就可以不用RFC税号吧？","AI响应":"是的，自发货模式和美国转运仓模式不需要RFC税号。只有选择墨西哥官方海外仓（Full仓）模式才必须办理并绑定。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-14 15:25:50","用户":"简单","群":"","用户问询":"我刚才已经上传了RFC文件了，入仓需要什么条件？","AI响应":"你好！既然你已经上传了RFC文件，待平台审核通过后，你可以按照以下步骤准备入仓：\n\n1. 确认FULL仓权限：在卖家后台查看是否已激活“Mercado Envíos Full”选项。如果已激活，你就可以开始创建货件。\n2. 准备产品：确保你的产品符合美客多海外仓的准入要求，且产品信息（如尺寸、重量、类目）填写准确。\n3. 打印标签：在后台创建货件后，下载并打印产品标签（ML标签）和外箱标签，务必按照要求粘贴。\n4. 预约送仓：如果你是自行发货到墨西哥，需要通过系统预约送仓时间；如果是通过货代，请确保货代具备送仓资质。\n\n重要提醒：\n做墨西哥海外仓模式需要RFC。如果你的RFC还在审核中，或者暂时还没有申请下来，可先绑定非大陆/香港美金账号，再绑定墨西哥银行账号，可暂时避免代扣代缴，后续完善RFC税号即可。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-13 21:16:20","用户":"游济远","群":"","用户问询":"你好，又要打扰一下，还有三个问题，1. 中国大陆营业执照入驻德州转运仓，不需要办墨西哥税号？不办墨西哥税号的情况下，税费是多少呢？2. 注册入驻审核时间大概是几个工作日？3. 首批入住德州仓第一票货物是不是店铺激活后30天必须入仓，10SKU以上，并且总商品数量不少于600件。","AI响应":"你好！很高兴能为你服务，一点也不打扰。针对你的三个问题，解答如下：\n\n1. 税号与税费问题\n使用美国转运仓配送墨西哥不需要提供RFC税号。该模式属于跨境直邮，而非本土发货，因此不需要办理墨西哥属地化税务登记。关于税费，相应的进口税费由买家在下单时承担并支付，卖家可以有效避免复杂的税务预扣风险。\n\n2. 审核时间\n美客多的注册审核周期通常为20-30天。如果提交资料后等待时间超过20个工作日仍未更新，可以联系官方客服进一步查询。\n\n3. 首批入仓要求\n关于德州仓的首批入仓规则，目前官方资料中并未强制要求必须在30天内入仓或必须达到10个SKU及600件商品。不过，为了保证店铺的活跃度和经营效果，建议在账号激活后尽快安排发货上架。\n\n普通自发货/海外仓也可选择自注册（PC端登入）：https://global-selling.mercadolibre.com/landing/about\n\n入驻准备材料：\n1. 企业资质：中国内地或香港公司营业执照（不接受个体户，须是“有限公司”）。\n2. 法人信息：法人身份证，且法人需配合进行人脸识别认证。\n3. 收款账户：提供一个非美国境内的美元（USD）银行账户用以接收结算款项（如第三方收款账户）。\n4. 联系方式：准备谷歌邮箱、Outlook邮箱或阿里云邮箱（不接受163、QQ、新浪等国内邮箱），以及联系人电话。\n5. 品牌要求：如果是品牌店，还需提供R标或TM标。\n6. 唯一性：一套资料只能注册一个店铺，之前注册过美客多的信息不可重复使用。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-13 18:56:11","用户":"火野丽","群":"","用户问询":"美客多跨境full店rfc过了验证要求的时间还可以上传吗","AI响应":"你好！提交邮箱后即为您开通KYC审核绿色通道，通常3-5个工作日给反馈，请留意卖家后台审核状态的变化。但是加速审核只有一次机会，请谨慎提交！\n\n关于RFC验证，平台要求在7月20日前完成。若已逾期，建议尽快登录卖家后台核实RFC绑定状态。若未完成验证，平台将按规定将预扣税率上调至36%。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-13 13:35:48","用户":"AA  优尚灯饰  王力","群":"","用户问询":"你好，我们自己发货到墨西哥海外仓库的话需要什么东西吗？我们怎么报税呀？","AI响应":"你好！使用墨西哥海外仓需要申请并绑定墨西哥RFC税号。如果不绑定，平台将面临最高36%的代扣税。建议咨询专业税务代理机构办理税号并进行报税。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-13 11:35:36","用户":"刘文杰","群":"","用户问询":"你好请问美客多FULL 仓 墨西哥订单 扣税规则是什么样的","AI响应":"关于墨西哥RFC税务政策的解答\n\n根据墨西哥政府最新税务法规要求，自2026年1月1日起，所有电商平台须按新标准执行增值税及所得税的预扣缴义务。美客多墨西哥Full仓订单的扣税规则如下：\n\n1. 未上传任何RFC税号：平台将依法对您的墨西哥销售额按36%的税率实施强制预扣税。\n\n2. 已上传RFC税号：根据您登记的类型及收款账户性质，适用不同预扣税率：\na. 已上传墨西哥本地RFC税号 + 使用本地收款账户：总预扣税率为10.5%\nb. 已上传墨西哥本地RFC税号 + 使用海外收款账户：总预扣税率为18.5%\nc. 已上传海外RFC税号 + 使用本地或海外收款账户：总预扣税率为16%\n\n此规则适用于所有存储在墨西哥境内商品产生的销售，包括跨境店Full仓及三方仓履约模式。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-13 11:13:26","用户":"C-cj","群":"","用户问询":"@所有人 1. 【必填卖家登记表】只有登记过的店铺ID才能申请扶持！ 2. 【经理扶持表】填写登记表后，可申请墨西哥/智利海外仓扶持。未提交登记表的店铺ID，您的申请将不会生效。 填写： 表中有不同sheet记得切换填写 1.REBATE活动提报（每周一17点截止） 2.店铺扩容申请（每月23-30号提报下个月的） 3.品牌店申请（每周一17点截止） 4.ITEM修改标题（每周一17点截止） 5.Case升级（每周一17点截止） 6.开新店（随时，私戳我） 7.老店铺开通智利FULL仓（随时，私戳我） 8.超重超大件进FULL仓（每周一17点截止） 9.RFC验证反馈（随时，每天提交海外）","AI响应":"你好！很高兴为你解答。\n\n如果你已经更换了新的税号但一直没有收到新税号的授权邮件，请按照以下步骤操作：\n\n1. 确认变更状态：请确保你已经在卖家后台成功提交了新RFC的变更申请，并上传了对应的CSF文件。\n\n2. 检查CSF邮箱：授权邮件会发送至你新RFC对应的CSF登记邮箱中，请务必检查该邮箱的收件箱及垃圾邮件。\n\n3. 登记反馈：由于你目前面临授权截止日期且未收到邮件，请点击你提供的链接中的第9项“RFC验证反馈”进行登记。该表单会每天提交给海外团队处理，请准确填写你的店铺ID及相关问题描述，以便平台协助跟进。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"}]},{"业务模块":"海外仓","高频问题":"上架/链接/SKU/变体/寄样","Past 7 Days":8,"Previous":8,"WoW":0,"代表性问询":"FULL上传的变体链接 前台分开显示怎么处理","Past 7 Days代表性问询":"FULL上传的变体链接 前台分开显示怎么处理","Previous代表性问询":"我在Stock management Full 看到的SKU是英语的，为什么我下载出来的标签是西班牙语的？","__details":[{"时间":"2026-07-19 14:19:12","用户":"待续","群":"","用户问询":"你好 为什么我墨西哥FULL 后台不能上架和出标签 呢","AI响应":"你好！很高兴为你解答。\n\n关于你提到的墨西哥Full仓无法上架和出标签的问题，通常有以下几种原因：\n\n1. Full仓权限未激活：Full仓权限通常由系统根据店铺信誉等级（需处于绿色状态）、销售表现和运营合规性自动激活。如果你的店铺是新开的或者各项指标尚未达标，系统可能还没有在“库存管理”板块为你开放送仓入口。\n\n2. 店铺信誉等级：请检查你的店铺信誉（Reputation）是否为绿色。如果信誉等级下降，平台可能会限制你使用Full仓功能。\n\n3. 链接状态问题：请确认后台商品状态。如果Listing被手动设置为了 Paused（暂停），或者必填属性（如品牌、型号等）不完整，会导致无法激活或无法进行后续的送仓操作。\n\n4. 货件计划限制：如果你的店铺存在违规行为或投诉，平台可能会限制你创建新的货件计划。\n\n建议你先通过自发货模式积累数据，保持良好的运营指标。当各项指标达标后，系统会自动为你开启Full仓权限。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-18 17:01:31","用户":"95后一场梦","群":"","用户问询":"那我上架这里要填Full Managed","AI响应":"你好！很高兴为你解答。\n\n是的，既然你的账号已经开通了 Full Managed 权限，在上架商品时，物流模式必须选择并填写与 Full Managed 相关的信息。\n\n从你提供的批量上传表格截图来看，你需要准确填写包裹的毛重、长、宽、高以及计量单位。这些数据非常重要，因为全托管模式下，平台会根据你填写的包裹尺寸和重量来计算相关的物流费用和仓储费用。\n\n请确保填写的尺寸是商品打包好后的实际包裹尺寸，以免后续入库时因尺寸差异产生额外费用或入库异常。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-18 15:49:43","用户":"巴达通-巴西本土店铺注册-阿涛","群":"","用户问询":"们送进full仓的商品触发到平台的税务审查，现在链接被下架了，为什么会出现这种情况？ 会影响我们后续的产品送进full仓吗？","AI响应":"你好！很高兴为你解答。\n\n关于商品进入Full仓触发税务审查（Em revisão fiscal）导致链接下架的情况，这通常是平台为了确保商品符合当地税务法规而进行的例行合规性核实。\n\n这种情况通常不会影响你后续的产品送进Full仓。根据平台规则，这种税务审核是针对特定批次或特定商品的临时行为，审核期间产生的状态变化不会计入店铺质量指标（Reputación），也不会对你未来的入库申请产生负面限制。\n\n只要你的税务资料真实有效，且配合平台完成必要的核验，审核完成后商品会自动恢复销售。建议你近期密切关注卖家后台的通知，确保没有遗漏任何需要补充的税务证明文件。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-18 14:52:52","用户":"巴达通-巴西本土店铺注册-阿涛","群":"","用户问询":"你好 我们送进full仓的商品触发到平台的税务审查，现在链接被下架了，为什么会出现这种情况？","AI响应":"从你发的图片来看，商品状态显示为\"Em revisão fiscal pelo Mercado Livre\"，也就是美客多正在对这批商品进行税务审核。\n\n这种情况通常发生在商品进入Full仓后，平台需要核实该批次商品的税务合规性。在审核期间，相关库存会暂时处于不可售状态，所以你的链接会显示下架或无库存。\n\n根据系统提示，这只是暂时的审核流程，审核完成后商品会自动恢复销售，且在此期间产生的审核状态不会影响你的店铺质量指标。\n\n建议你耐心等待系统处理，同时留意后台是否有进一步要求提交税务证明文件的通知，如有需要请及时配合提交。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-18 14:36:07","用户":"初","群":"","用户问询":"FULL上传的变体链接 前台分开显示怎么处理","AI响应":"你好！同一商品的不同变体在上传表格中必须保持标题完全一致，系统才能识别并聚合。请核对表格，确保标题相同，且变体属性栏已正确填写。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-16 16:43:20","用户":"ayw.","群":"","用户问询":"帮我看一下这个链接的模式是全托还是半托或者FULL","AI响应":"你好！很高兴为你解答。\n\n关于你提供的链接，美客多托管店铺在前端展示时，你是没办法区分半托管还是全托管的。\n\n不过，无论是全托管还是半托管模式，产品上架后都会带有“Full”标，享受平台的流量倾斜和快速配送服务。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-16 10:22:15","用户":"TT","群":"","用户问询":"娜娜你哈 请问洗衣凝珠这类产品上架官方厂库需要资质吗？美客多有哪些禁售的产品？进官方full仓的","AI响应":"洗衣凝珠属于膏体或液体类产品，送仓时需用保鲜膜进行二次加固。美客多官方海外仓禁售产品包括：易燃易爆品（如酒精、香水）、受限化学品、武器、动植物、处方药及部分含电池或磁性超标产品。建议在卖家后台查看最新的禁售清单。","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-15 16:03:36","用户":"啊楼🍉","群":"","用户问询":"4.同一个外箱内不要混装超过 3 种不同的美客多 SKU。这样可以避免在拣货期间增加额外的人工处理流程，并防止延迟。 FULL美国转运仓，是这样吗，那衣服的S,M,L,XL，这算不同的SKU？","AI响应":"你好！是的，在美客多的系统里，**同一个产品的不同尺码（如 S、M、L、XL）都属于不同的 SKU**。\n\n针对你的疑问，具体操作建议如下：\n\n1. **混装限制**：虽然建议一个外箱内不混装超过 3 种 SKU，但如果你的衣服尺码较多，确实无法完全分开，也可以混装。\n2. **关键要求**：如果必须混装，请务必做好**物理隔离**。建议先将同款同色同码（同一个 SKU）的衣服用大袋子或捆扎方式装在一起，再放入外箱。\n3. **风险提示**：混装 SKU 种类过多会增加仓库人工核验的时间，可能导致上架变慢。如果货量大，建议尽量按 SKU 分箱装载。\n\n**服装类特别提醒**：\n每件衣服必须有独立透明包装袋，且包装袋上必须张贴对应的 SKU 标签。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"}]},{"业务模块":"海外仓","高频问题":"促销/活动/广告投放","Past 7 Days":7,"Previous":0,"WoW":null,"代表性问询":"full仓怎么设置单个优惠券","Past 7 Days代表性问询":"full仓怎么设置单个优惠券","Previous代表性问询":"","__details":[{"时间":"2026-07-18 20:21:34","用户":"杭州远景-誉江南张冬贤13592864225","群":"","用户问询":"你好，美国转运仓是不是只有墨西哥full才能开广告","AI响应":"你好！很高兴为你解答。\n\n不是的。美国转运仓模式同样支持开启广告。\n\n目前美国转运仓模式支持卖家在后台自主创建购物车链接（Catalog Listing），并且所有站点均支持 DOTD、LD、Rebate 等多种促销活动的自主提报。在广告方面，只要你的店铺和 Listing 状态正常，是可以正常使用广告功能来提升流量和转化率的。\n\n如果你在后台无法看到广告设置选项，建议检查店铺是否已通过相关审核，或者联系官方客服确认广告功能的开启权限。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-18 16:44:28","用户":"纳洛童","群":"","用户问询":"Marca:Generic Modelo:Nice Berg Recommended minimum age: 3 years Its a kit: No It is flammable: No IMPORTANT Product size: 6x6x9 cm This product is designed for sensory and anti-stress use, so its wear and tear over time is normal. Damage caused by use, excessive handling, or natural wear and tear is NOT covered by the warranty. W
