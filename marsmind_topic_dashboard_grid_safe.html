apps/query/q/WnmhYDGC","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-14 14:11:04","用户":"只想练背的鲤鱼","群":"","用户问询":"开通KYC审核绿色通道","AI响应":"提交邮箱后即为您开通KYC审核绿色通道，通常3-5个工作日给反馈，请留意卖家后台审核状态的变化。但是加速审核只有一次机会，请谨慎提交！","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-14 09:43:15","用户":"波悠悠","群":"","用户问询":"你好！麻烦你帮我加急KYC审核","AI响应":"你好！很高兴为你解答。提交邮箱后即为您开通KYC审核绿色通道，通常3-5个工作日给反馈，请留意卖家后台审核状态的变化。但是加速审核只有一次机会，请谨慎提交！","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-14 09:09:58","用户":"龙贰","群":"","用户问询":"Kyc审核要多久","AI响应":"你好！很高兴为你解答。\n\nKYC审核通常需要2-3周以上的时间。由于近期入驻量较大，审核处理量激增，建议你耐心等待。\n\n你可以随时登录店铺后台实时查询审核进度。如果已经完成了扫脸验证，建议静候24小时让数据同步，不要重复提交。\n\n提交邮箱后即为您开通KYC审核绿色通道，通常3-5个工作日给反馈，请留意卖家后台审核状态的变化。但是加速审核只有一次机会，请谨慎提交！\n\n网页参考资料：\nhttps://doc.weixin.qq.com/doc/d3_ARIAagYiAMICNNDLx0OZsSvaHbheC?scode=AI8A3wfvAAoKUrNMq6ARIAagYiAMI","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"}]},{"一级大类":"产品管理","二级子类":"产品上架","Past 7 Days":430,"Previous 2026-07-06 to 2026-07-12":484,"Change":-54,"WoW":-0.1115702479338843,"Past 7 Share":0.06241834809115982,"高频问题":"产品上架/变体/SKU","__details":[{"时间":"2026-07-15 16:03:36","用户":"啊楼🍉","群":"","用户问询":"4.同一个外箱内不要混装超过 3 种不同的美客多 SKU。这样可以避免在拣货期间增加额外的人工处理流程，并防止延迟。 FULL美国转运仓，是这样吗，那衣服的S,M,L,XL，这算不同的SKU？","AI响应":"你好！是的，在美客多的系统里，**同一个产品的不同尺码（如 S、M、L、XL）都属于不同的 SKU**。\n\n针对你的疑问，具体操作建议如下：\n\n1. **混装限制**：虽然建议一个外箱内不混装超过 3 种 SKU，但如果你的衣服尺码较多，确实无法完全分开，也可以混装。\n2. **关键要求**：如果必须混装，请务必做好**物理隔离**。建议先将同款同色同码（同一个 SKU）的衣服用大袋子或捆扎方式装在一起，再放入外箱。\n3. **风险提示**：混装 SKU 种类过多会增加仓库人工核验的时间，可能导致上架变慢。如果货量大，建议尽量按 SKU 分箱装载。\n\n**服装类特别提醒**：\n每件衣服必须有独立透明包装袋，且包装袋上必须张贴对应的 SKU 标签。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-14 10:44:53","用户":"啊楼🍉","群":"","用户问询":"1. [error] [51] user_products.attributes.number unit user-products The provided unit is not valid. You can use a number followed by one of these valid units: [hh, m,\", mm, nm, cm, m, km, in, mil, U, ft, pulgadas, yd, miles]. FEMALE_THREAD_DIAMETER 这是变体要加尺寸吗？","AI响应":"你好！是的，这个报错是因为你在填写 FEMALE_THREAD_DIAMETER（内螺纹直径）这个属性时，格式不符合系统要求。\n\n系统要求该属性必须是一个数字后面紧跟一个有效的单位。根据报错提示，你可以使用的合法单位包括：[hh, m, \", mm, nm, cm, m, km, in, mil, U, ft, pulgadas, yd, miles]。\n\n处理建议：\n1. 检查你填写的数值，确保数字和单位之间没有空格（或者按照模板要求的标准格式）。\n2. 确保使用的单位在上述括号内的列表里，例如：10mm 或 0.5in。\n3. 如果是在表格中填写，请检查该单元格的格式是否被误设为纯数字。\n\n修改正确后重新上传或保存即可。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-16 14:47:51","用户":"XNGc2","群":"","用户问询":"另外我想要询问 我有个产品是有Catalog显示的 但是系统抓取匹配到的是我同一条链接中的备用变体 这个是否可以进行修改呢？我想要绑定到我正在销售的产品上","AI响应":"你好！很高兴为你解答。\n\n你可以通过以下方式尝试更正：\n\n1. 前往“列表”，在对应列表的三点菜单中选择“更正商品目录详情”。\n2. 在“浏览我们的产品目录”搜索框中，输入你想要绑定的产品ID或代码，点击“查看和更正商品目录详情”。\n3. 在产品规格表页面，点击“更正该商品目录的详情”进行修改。\n\n此外，你也可以在Excel目录中通过“目录代码搜索”功能找到确切的代码，并粘贴到ML目录代码列中进行重新关联。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-18 12:33:14","用户":"纳洛童","群":"","用户问询":"配件这里包含1个玩偶和1只宠物或者一个兵器（根据所选择的变体不同配送的配件也不一样）这个用地道的墨西哥语言怎么表达","AI响应":"你好！很高兴为你解答。在墨西哥站点，你可以使用以下地道表达来描述变体配件的差异：\n\n**Incluye:** 1 muñeco y 1 accesorio (mascota o arma, según la variante seleccionada).\n\n**或者更详细的表达：**\n**Contenido:** Cada variante incluye un accesorio diferente. Recibirás 1 figura y, dependiendo de tu elección, una mascota o un arma. ¡Asegúrate de seleccionar tu favorito antes de comprar!\n\n**词汇解析：**\n- **Muñeco / Figura:** 玩偶/人偶\n- **Mascota:** 宠物\n- **Arma:** 兵器/武器\n- **Según la variante seleccionada:** 根据所选变体","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-18 20:15:06","用户":"Li","群":"","用户问询":"我现在遇到的问题是，想不明白，为什么都是自发货，价位也差不多的，别人的连接可以包邮，为什么我的不能包邮？？因为这样我就失优势？ 我看了下，就是因为包邮的问题，我想知道怎么解决此类问题？？？这个问题跟设置Settings > Selling Preferences > Dispatch Methods** 有关系吗？？","AI响应":"你好！这与 Dispatch Methods 的设置没有关系。\n\n从你提供的对比图看，原因非常明确：\n\n1. **定价模式差异**：对方（冠军）的 Listing 开启了**包邮服务**，而你的 Listing 目前是**买家付运费**模式。\n2. **系统自动判定**：美客多自发货采用“净收益”定价模式。系统会根据你填写的净收益，自动叠加佣金和运费生成前台售价。\n3. **如何解决**：\n   - 平台系统会根据 Listing 价格自动增加或移除运费。\n   - 建议你尝试**微调 Listing 的净收益金额**。当系统计算出的前台售价达到或超过该站点的免运费门槛时，系统会自动将其转为“包邮”状态，并将运费成本计入售价中。\n\n简单来说，你看到的“包邮”其实是系统把运费加进了售价里。你可以通过调整价格，让系统重新判定是否触发包邮。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-17 19:29:30","用户":"Michael-拾荒的小男孩","群":"","用户问询":"无法在Uruguay [目前无法在 Uruguay 通过 international dropshipping 发布商品。]发布 发布于：México 发布于：Brasil 发布于：Argentina 发布于：Chile 发布于：Colombia Uruguay 通过 international dropshipping 发布商品 是什么意思","AI响应":"你好！很高兴为你解答。\n\nInternational dropshipping 是指自发货模式。\n\n这句话的意思是，目前乌拉圭站点暂不支持自发货卖家直接发布商品。目前该站点的跨境业务主要面向海外仓（FBM）模式或特定受邀卖家开放。\n\n你可以正常在墨西哥、巴西、智利、哥伦比亚等已开通的站点发布商品。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-17 18:18:13","用户":"纳洛童","群":"","用户问询":"Produto original SANDA com garantia do vendedor de 30 dias Envio internacional prioritario com rastreamento completo Entrega segura para todo o Brasil via Mercado Livre Atendimento dedicado para suporte pos-venda Garanta ja o relogio digital mais viral do momento. Estoque original pronto para envio.给这个巴西站点9504型号手表打分，高频搜索词有没有埋词在前面？","AI响应":"你好！很高兴为你解答。针对你提供的 SANDA 9504 型号 Listing，评分及分析如下：\n\n**综合评分：8.5/10**\n\n**优点：**\n1. **埋词策略成功**：标题前段准确埋入了 **Relogio Digital Retro** 和 **Quadrado Y2K**。在巴西市场，\"Retro\"、\"Quadrado\"（方形）和 \"Y2K\" 是目前该类产品流量最高的搜索关键词，放在前面能有效提升曝光和点击。\n2. **人群定位精准**：描述中抓住了“Cyberpunk”、“Estudantes”和“Nostalgia”等关键词，符合巴西年轻受众的搜索习惯。\n3. **结构清晰**：卖点划分明确，包含了巴西买家最关心的防水（5 ATM）和 LED 功能。\n\n**扣分项与改进建议：**\n1. **标题品牌位置**：虽然你将 SANDA 放在了中间，但建议将 **Unissex**（中性）这个高频词再往前提，因为这类复古表男女通用是核心搜索属性。\n2. **属性缺失**：描述中未提及具体的表盘尺寸（如 35mm 或 40mm），巴西买家对方形表的实际佩戴尺寸非常敏感。\n3. **合规性检查**：请确保上传到后台时，描述中的横线（---）和特殊符号已转为纯文本换行，避免系统识别异常。\n\n**建议优化后的标题：**\nRelogio Digital Retro Quadrado Y2K Unissex Resistente Agua Sanda 9504","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-16 15:53:30","用户":"Michael-拾荒的小男孩","群":"","用户问询":"这样不合理呀，可不可以SKU区分不同即可呢，比如5支银色的吸管（只是款式不同），银色仍然全选一样的Silver","AI响应":"你好！很高兴为你解答。\n\n在美客多平台上，变体必须通过属性值（如颜色、尺寸）来区分，而不能仅靠 SKU 编码区分。\n\n如果 5 个变体都选择完全相同的“Silver”，系统会判定为重复变体而报错，导致上传失败。\n\n如果该类目没有其他可用的变体属性（如 Model 或 Design），建议你将不同款式的吸管作为独立链接分别刊登，或者将它们组合成不同规格的套装进行售卖。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-15 16:48:43","用户":"大大大明","群":"","用户问询":"Muchos fieles católicos buscan una pieza de la Sagrada Familia para adornar su hogar pero se topan con problemas comunes.Las imágenes de papel o plástico pierden color rápido por el sol y humedad,se ven desgastadas en poco tiempo.Las estatuas grandes solo se pueden poner en el suelo y ocupan mucho espacio,no sirven para paredes ni repisas pequeñas.Los artículos planos sin relieve no tienen profundidad,no transmiten solemnidad para el altar de oración.Las piezas de cerámica son frágiles y se rompen fácilmente al transportarlas o limpiarlas.Pocos modelos permiten colgar en pared y poner sobre mesa al mismo tiempo,limitando los espacios de exhibición.Los materiales de baja calidad se desgastan y pierden tonos en pocos meses. Características del producto Placa decorativa de la Sagrada Familia hecha de resina de alta calidad con técnica de relieve 3D,diametro de 21 centimetros.Es resistente a golpes,humedad y rayos solares,los colores no se desvanecen con el paso del tiempo.El relieve tridimensional muestra cada detalle de María,San José y el Niño Jesús,los bordes tienen ornamentos tallados con acabado dorado elegante,la pintura artesanal mantiene tonos vivos y naturales.Tiene orificio en la parte trasera para colgar en pared y viene con soporte transparente para colocar sobre mesa,repisa o altar sin accesorios extra.El tamaño de 21 cm es equilibrado,no es demasiado pequeño para pasar desapercibido ni muy grande para saturar espacios reducidos.El diseño representa fielmente a la Sagrada Familia,adecuado para todas las familias creyentes mexicanas. El modelo de placa circular de la Virgen María está fabricado en resina de poliéster, cuenta con un soporte compatible y un gancho para colgar integrado, permitiendo una exhibición estable sobre superficies planas o montaje en pared. Su diseño combina devoción, arte y elegancia, creando un punto focal llamativo lleno de armonía y valor ornamental. Es un adorno religioso católico clásico y el regalo devocional ideal para quienes buscan piezas delicadas, bien elaboradas y con significado para complementar sus espacios interiores. Escenarios de uso 1.Altar doméstico de oración.Coloca esta placa como pieza principal en tu altar para rezos diarios,trae paz y espiritualidad a tu momento de devoción católica. 2.Decoración de pared en sala,dormitorio o comedor.Cuélgala en paredes vacías para dar un toque clásico y religioso a tu hogar. 3.Exhibición sobre repisas,mesas auxiliares y mesas de noche.Utiliza el soporte incluido para ponerla en muebles pequeños,ideal para departamentos compactos. 4.Regalo espiritual para eventos religiosos.Es un obsequio perfecto para bautizos,primeras comuniones,confirmaciones,bodas,Navidad y cumpleaños de seres queridos fieles,lleno de bendiciones. 5.Decoración para capillas caseras,oficinas y tiendas de artículos católicos.Combina devoción y decoración elegante para espacios de culto o negocios religiosos. Servicio postventa y garantía Sabemos que los envíos pueden sufrir golpes en el trayecto por eso contamos con un servicio postventa completo.Cada placa viene empacada con espuma protectora y caja reforzada para reducir riesgos de rotura durante el transporte.Si tu pedido llega roto,rayado o con defectos de fabricación,envía fotos o videos del empaque y el producto dentro de las primeras 48 horas después de recibir el paquete.Nuestro equipo de atención contesta todos tus mensajes rápidamente para resolver dudas sobre tamaño,material y forma de exhibición.Cumplimos todas las reglas de Mercado Libre,tus compras están totalmente protegidas en la plataforma. Conclusión ﻿Esta placa de la Sagrada Familia combina artesanía de relieve 3D,material de resina resistente y doble forma de exhibición.Con nuestro soporte postventa confiable puedes comprar sin preocupaciones,es una pieza indispensable para cada hogar católico de México.帮我把这段描速弄成可以直接上架的，顺便帮我翻译一下","AI响应":"你好！很高兴为你解答。\n\n这段描述已经包含了非常完整的营销逻辑。为了确保能直接上架且不报错，我为你去除了所有特殊符号、中文，并优化了排版。以下是为你翻译并整理好的西班牙语描述：\n\nSoluciones para el hogar catolico\nMuchos fieles enfrentan problemas con imagenes que pierden color por el sol o piezas de ceramica muy fragiles. Nuestra placa resuelve esto con durabilidad y un diseño adaptable a cualquier espacio.\n\nCaracteristicas del producto\nPlaca decorativa de la Sagrada Familia hecha de resina de alta calidad con tecnica de relieve 3D y diametro de 21 centimetros. Es resistente a golpes y humedad, por lo que los colores no se desvanecen con el tiempo. El relieve tridimensional muestra cada detalle de Maria, San Jose y el Niño Jesus con acabados dorados elegantes. Incluye un orificio trasero para colgar en pared y un soporte transparente para colocar sobre mesas o altares.\n\nEscenarios de uso\n1. Altar domestico de oracion: Pieza principal para tus rezos diarios.\n2. Decoracion de interiores: Ideal para paredes de sala, dormitorio o comedor.\n3. Muebles y repisas: Perfecta para espacios compactos usando su soporte incluido.\n4. Regalo espiritual: Obsequio ideal para bautizos, bodas, comuniones y Navidad.\n5. Espacios religiosos: Apta para capillas, oficinas y tiendas catolicas.\n\nServicio postventa y garantia\nCada placa viaja protegida con espuma y caja reforzada. Si tu pedido llega con daños por el transporte, envia fotos dentro de las primeras 48 horas para brindarte una solucion rapida. Tu compra esta protegida por las normativas de la plataforma.\n\nConclusion\nEsta placa combina artesania 3D, resina resistente y doble forma de exhibicion. Es una pieza indispensable para el hogar catolico mexicano que busca belleza y fe en un solo producto.","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-15 16:39:43","用户":"窦红建","群":"","用户问询":"根据当地政策，发往墨西哥或智利海外仓的商品的初级包装上必须贴附西班牙语标签（标明原产地、成分、储存条件等信息）。 您可以自行编辑标签信息或向您的客户经理领取标签模板。 每个商品外包装上都要有贴完整的这个，还是说只做个简单的格式就可以？就像**Hecho en China**这样的？","AI响应":"你好！根据你提供的图片和描述，每个商品的外包装上必须贴附完整的西班牙语标签，不能只贴简单的“Hecho en China”。\n\n拉美各国（尤其是墨西哥和智利）的海关清关以及当 l detallado: Túnicas con pliegues naturales, bordes de encaje delicado, cayado de San José acabado a mano, representación fiel de la Sagrada Familia ideal para nacimientos católicos. • Tamaño equilibrado 211123.5cm: No es miniatura insignificante ni excesivamente voluminoso, se adapta perfectamente a mesas, repisas y altares domésticos sin ocupar mucho espacio. • Estilo versátil: Puede usarse tanto para el nacimiento navideño temporal como decoración permanente de tu altar de oración diario. • Base integrada estable: La pieza cuenta con base sólida anti-deslizante, no se cae ni inclina al colocarla sobre cualquier superficie plana. 三、Escenarios de uso 1. Nacimiento navideño familiar Pieza central imprescindible para armar tu nacimiento en diciembre, crea una atmósfera cálida y espiritual para las celebraciones navideñas con toda la familia. 2. Altar doméstico de oración permanente Coloca la Sagrada Familia en tu altar diario para tus rezos matutinos y nocturnos, aporta serenidad y fe a tu espacio de devoción católica todo el año. 3. Decoración de sala, comedor y repisas Exhibe la figura sobre mesas auxiliares, aparadores, repisas de sala o muebles del comedor; su estilo artesanal combina con decoración rústica y clásica de hogares mexicanos. 4. Regalo espiritual para eventos religiosos y navidad Obsequio ideal para bautizos, primeras comuniones, confirmaciones, bodas y regalos navideños para seres queridos fieles, un detalle lleno de bendiciones y artesanía única. 5. Decoración de capillas pequeñas, tiendas de artículos católicos Apto para capillas privadas en casa, pequeñas iglesias locales y tiendas de artículos religiosos, destaca entre otros adornos de devoción. 四、Garantía y Servicio Postventa Sabemos que los envíos pueden sufrir golpes y deformaciones en el trayecto, por eso contamos con un servicio postventa transparente y sin complicaciones: 1. Embalaje antiimpacto reforzado: Cada figura se empaca con espuma amortiguadora, bolsa protectora y caja rígida para  ser una pieza personalizada ni autoadhesiva, se orienta a quienes prefieren una decoración definida y estable para ubicar con criterio en el muro. Su diseño en relieve ofrece una lectura clara de la escena y una estética cuidada desde distintos ángulos. Es una opción adecuada para quienes buscan sumar un elemento religioso con presencia, detalle y terminación decorativa en casa. 结合图片和参考上面这段描述，帮我再整理一段描述，该商品既可以挂在墙上也能当作摆件","AI响应":"你好！很高兴为你解答。\n\n结合图片中的精美浮雕与多功能用途，为你整理了如下描述：\n\nEsta pieza decorativa de La Última Cena aporta una presencia serena y simbólica a cualquier hogar. Con un diseño en relieve 3D y acabados dorados, esta obra de resina destaca por su profundidad y detalle, creando un ambiente cálido y distinguido en salas o espacios de oración.\n\nSu formato versátil de 21 cm permite utilizarla tanto como un elegante摆件 sobre mesas y repisas, como una pieza de pared gracias a su gancho incorporado. Su perfil delgado y estética cuidada la convierten en el acento religioso perfecto para decoraciones clásicas o contemporáneas, siendo una opción ideal para quienes buscan sumar fe y arte con una terminación excepcional.","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-14 11:09:52","用户":"李玲娅","群":"","用户问询":"{\"subMsgDesc\":\"\",\"subMsgList\":[{\"subMsgSenderId\":\"0\",\"subMsgSenderCorpId\":0,\"subMsgId\":\"\",\"subMsgType\":14,\"subMsgSenderAvatar\":\"\",\"subMsgSenderName\":\"\",\"subMsgSenderCorpName\":\"\",\"subMsgFromId\":\"0\",\"subMsgData\":{\"filename\":\"企业微信截图_17839985732017.png\",\"fileAesKey\":\"e000289259b1e067fe0029ccf446a15e\",\"fileSize\":86506,\"width\":1592,\"fileMd5\":\"970a7aec34c21b6bef3531042492abf1\",\"fileId\":\"306b0201020464306202010002047953720602030f4df902048b752fb702046a55a87f042463363166343538652d363736612d343335642d396135352d333062343165653638663232020310380002030151f00410970a7aec34c21b6bef3531042492abf10201010201000400\",\"height\":716,\"imageHasHd\":true},\"subMsgTimestamp\":0},{\"subMsgSenderId\":\"0\",\"subMsgSenderCorpId\":0,\"subMsgId\":\"\",\"subMsgType\":2,\"subMsgSenderAvatar\":\"\",\"subMsgSenderName\":\"\",\"subMsgSenderCorpName\":\"\",\"subMsgFromId\":\"0\",\"subMsgData\":{\"reply\":{},\"atList\":[],\"moreDetail\":[{\"subtype\":0,\"text\":\"条码有尺寸要求吗\"}],\"content\":\"条码有尺寸要求吗\"},\"subMsgTimestamp\":0}],\"subMsgFlag\":0}","AI响应":"你好！很高兴为你解答。\n\n关于产品条码的尺寸，平台没有极其死板的固定要求，但为了确保仓库扫描枪能顺利识别，建议遵循以下标准：\n\n1. 建议尺寸：通常建议条码标签的尺寸为 40mm x 25mm 或 50mm x 30mm 左右。\n2. 打印要求：条码必须清晰、完整，不能有模糊、断线或重影。建议使用热敏打印机打印，避免使用喷墨打印机导致墨水晕染。\n3. 粘贴位置：条码应贴在产品外包装的平整表面，避免贴在封口处、转角处或凹凸不平的地方，以免影响扫描。\n4. 唯一性：确保产品包装上只露出这一个有效的条码。如果包装上原本有其他无关的条码，请务必将其遮盖或撕除，防止仓库扫错。\n\n只要条码清晰且大小适中，方便扫描枪对焦即可。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-13 17:56:22","用户":"纳洛童","群":"","用户问询":"747银壳浅蓝面，银蓝，银黑 6060全黑、白、黑金 2214 黑蓝、黑绿、黑红、全黑 3192金黑、银带全黑、银带浅蓝， 6330黑枚金、杏、全黑 6339黑蓝、黑、黑橙 这些颜色选的可以吗？","AI响应":"你好！很高兴为你解答。你选的颜色整体思路很对，大部分是拉美市场的热销色。\n\n**非常推荐：**\n1. **全黑、黑金、黑枚金、银黑、银带全黑**：这些是拉美男士表的核心爆款色，建议加大库存。\n2. **黑红、黑蓝**：运动款中的经典配色，当地接受度很高。\n\n**建议谨慎或少量：**\n1. **浅蓝面、银蓝、杏色、白**：这些颜色在拉美男士市场属于小众或季节性颜色，建议作为测款少量上架，观察数据后再补货。\n2. **黑绿、黑橙**：属于个性化配色，流量可能不如黑金系列稳定。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-15 15:52:40","用户":"戚","群":"","用户问询":"up模式之后 在erp上一条listing上不同变体会生成一个单独的listing吗？","AI响应":"在UP模式下，同一个Listing下的不同变体**不会**生成多个单独的Listing。\n\n它们依然归属于同一个商品链接（Parent ID），但每个变体拥有独立的SKU和属性。UP模式的核心优势就是允许您在同一个链接内，为不同变体设置独立的价格、图片和库存，从而实现更精细化的管理。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-13 12:56:57","用户":"牛奶","群":"","用户问询":"那产品标签呢？单箱能装多少个产品？规定一箱能装的SKU数量？装箱的重量不能大多少？","AI响应":"产品标签即SKU LABEL，尺寸为7*2.2cm，需贴在每个独立包装上。半托管模式下，单箱混装不得超过5种SKU。目前信息未提及具体的单箱重量上限，建议确保箱子状况良好，空隙需用填充物塞满以防损坏。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-15 23:08:18","用户":"伊恩","群":"","用户问询":"同一个链接，有一个sku滞销退货，对另外一个买的比较好的sku有影响吗","AI响应":"你好！同一个链接下，某个 SKU 滞销退货通常不会直接影响其他热销 SKU 的权重或销售。但如果滞销 SKU 产生大量负面评价，可能会影响整个 Listing 的转化率。建议及时处理滞销库存。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-14 15:34:44","用户":"TaU*","群":"","用户问询":"SKU：EEGK14180 为什么我在后台搜索不出来 @美客多跨境小助手小拉","AI响应":"你好！在后台搜索不到SKU可能是因为该SKU已被删除、处于非活跃状态，或者搜索时选择了错误的站点或筛选条件。建议你检查SKU状态，或尝试通过Listing ID进行搜索。若仍无法找到，请联系客户经理核实。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-19 16:52:40","用户":"波波波pewpewpew突突突","群":"","用户问询":"你好，变体产品添加短视频需要每个变体都添加同个短视频吗？","AI响应":"你好！很高兴为你解答。添加新变体后，你将自动看到新的变体显示在下面。由于每个变体对于产品都是不同的，你必须为每个变体添加库存和通用代码。关于视频，每个视频应仅包含一个产品。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-17 21:51:52","用户":"蓝七","群":"","用户问询":"你好 ，这个sku是怎么填的呀，我一款产品里面有4个颜色来着","AI响应":"你好！对于有4个颜色的产品，你需要为每个颜色分配一个独特的SKU。\n\n操作步骤：\n1. 在表格中创建4行相同的信息。\n2. 在Color列分别填写对应的颜色。\n3. 在SKU列为每个颜色设置唯一的编码（例如：ProductA-Red, ProductA-Blue等）。\n4. 为每个SKU单独上传对应的照片。\n\n这样系统就能识别它们是同一个商品下的不同变体。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-17 18:00:37","用户":"Dford","群":"","用户问询":"每个变体的首图都必须是同一个图的白底无文字的图片吗？","AI响应":"不是的。每个变体的主照片必须以该变体对应的单独产品为主体拍摄。例如不同颜色的产品，每个变体首图应展示对应颜色的产品，但都必须遵循纯白背景、无文字水印、正面朝向等合规要求。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-17 17:07:04","用户":"Morii","群":"","用户问询":"添加变体后 原产品不见了 只有这一个变体了 怎么回事","AI响应":"你好！很高兴为你解答。\n\n出现这种情况，通常是因为你在添加变体时，将原有的产品信息直接覆盖或修改为了新变体，而不是在原有基础上“新增”变体。\n\n在美客多的变体编辑器中，你需要确保原有的变体信息保留在列表中，并点击“添加（Add）”按钮来创建额外的选项。如果原产品不见了，说明它可能被系统识别为了新变体的一部分。\n\n建议你重新进入编辑器的“添加或更改变体”界面，检查变体列表。如果原产品确实丢失，你需要手动再次添加原产品的规格（如颜色、尺寸等），并重新关联其对应的图片、库存和通用代码。确认列表里同时包含原产品和新变体后，再保存发布。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-17 16:20:45","用户":"Morii","群":"","用户问询":"现在这个产品已经缺货下架了 我找不到可以添加变体的入口","AI响应":"你好！很高兴为你解答。\n\n如果产品因为缺货进入了“非活动（Inactive）”列表，你可以按照以下步骤操作：\n\n1. 前往我的账户，进入“刊登（Listings）”页面。\n2. 在筛选状态中选择“非活动（Inactive）”或“已结束（Ended）”，找到该产品。\n3. 在操作菜单中，点击“修改（Modify）”。\n4. 在产品特征部分，你依然可以看到“添加或更改变体”的选项，点击进入编辑器即可增加新的变体。\n\n添加完成后，只要你为新变体补充了库存，该链接就会重新变为活动状态。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-17 15:08:25","用户":"敏","群":"","用户问询":"订单中的汇率保护机制是什么意思？比如我这个订单售价是97.71，但是汇率差额是2.72.那我的实际销售额收入是977.71还是94.99，佣金是按哪个金额算的","AI响应":"你好！汇率保护工具（FX Tool）旨在汇率波动超过设定阈值时自动调整售价，保护您的利润。\n\n根据图片显示，您的原始刊登价为 94.99，因汇率波动触发了 2.72 的保护性调价，最终调整后的售价为 97.71。您的实际销售额收入按调整后的 97.71 计算，佣金也是基于最终售价 97.71 比例收取的。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-17 10:04:37","用户":"雪","群":"","用户问询":"你好为什么我创建篮球架listing的时候 没有办法弄两个变体","AI响应":"你好！并非所有类目都支持变体。请在后台编辑页面查看产品特征部分是否有添加或更改变体的选项。如果没有，说明该类目不支持变体，建议您为每个产品单独创建Listing。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-17 10:04:12","用户":"雪","群":"","用户问询":"你好为什么我创建listing的时候 没有办法弄两个标题 变体","AI响应":"你好！在美客多平台，同一商品的不同变体必须保持标题完全一致。系统通过相同的标题来识别这些行属于同一个Listing，变体的区别（如颜色、尺码）需要在专门的变体属性栏中填写。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-16 17:39:42","用户":"ㅤ","群":"","用户问询":"那现在要怎么去操作检查 已经添加完成了 要重新添加变体吗","AI响应":"不需要重新添加。请前往“我的账户”选择“活动列表”，在操作菜单点击“修改”，在“产品特征”部分点击“添加或更改变体”进入编辑器检查并完善信息。由于每个变体都是独立的，请确保为无法上架的变体添加了正确的库存、通用代码和图片。确认无误后，变体将自动更新到数据表中。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-16 17:38:30","用户":"笑","群":"","用户问询":"首图符合要求，变体也全部激活，并且都有库存，为什么看不到前台","AI响应":"你好！如果上述条件均满足但前台仍不可见，请核查以下两点：\n\n1. **通用代码（UPC/EAN）**：请检查每个变体是否都填写了有效的通用代码，缺失或重复的代码会导致链接无法在前台展示。\n2. **配送设置**：请确认该 Listing 是否已关联有效的运费模板或配送方式。\n\n若排除以上问题且超过 24 小时仍未显示，建议在后台开 Case 联系技术支持核查该 Item ID 的同步状态。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-16 17:08:43","用户":"Butter","群":"","用户问询":"没有对应的SKU我要怎么核对 平台扣除的费用是否合理呢","AI响应":"你好！这确实是很多卖家感到困扰的地方。要核对平台扣费是否合理，不能直接在账单表里找 SKU，而是需要通过 **Fee's ID** 进行“两表合一”的交叉比对：\n\n1. **获取业务明细表**：在卖家后台账单页面，除了你现在下载的这个总账单（Billing report），通常还有一个可以下载 **\"Advertising details\"（广告明细）** 的选项。那个表格里会记录每一个 Fee's ID 对应的具体广告活动或时间段。\n\n2. **利用 Fee's ID 匹配**：你截图中的第三列 **Fee's ID** 是唯一的扣款编号。你可以将广告后台导出的数据与账单数据通过这个 ID 进行关联。\n\n3. **总量核对法**：因为美客多广告是按照点击扣费的，最有效的核对方式是：\n   - 记录广告后台某一段周期（如一周）的总投资额。\n   - 等待 3-5 天结算期后，在账单表中筛选出对应周期的所有 `Product Ads` 扣款总和。\n   - 只要“后台总消耗 × 1.16（税）”与“账单总扣款”基本吻合，就说明扣费是准确的。\n\n**为什么不给 SKU 明细？**\n因为美客多的广告扣款是“资金池”模式。比如你开了 10 个产品的广告，平台并不是每个产品点一下就扣一笔钱，而是等这 10 个产品总共消耗到一定额度（或到固定结算点）时，统一从你账户里划走一笔钱。所以这笔钱是多个 SKU 共同产生的，账单上只显示这笔交易的 ID。\n\n如果你怀疑某笔扣费异常，可以记录下那个 **Fee's ID**，联系卖家支持查询该笔扣款包含的具体消耗明细。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-15 16:52:08","用户":"波波波pewpewpew突突突","群":"","用户问询":"你好，如果这个产品需要颜色和长度两种变体怎么操作","AI响应":"你好！很高兴为你解答。请按以下步骤操作：\n1. 在表格第一行填写主规格信息。\n2. 根据规格数量复制相应行数。\n3. 在颜色和长度对应的列中，为每行输入特定的组合（如：红色+1米）。\n4. 为每个变体单独设置图片、SKU和库存。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-14 14:36:01","用户":"厚德载物","群":"","用户问询":"我的美客多full平台，旧链接已被删除，但是我已经忘了，把货发过去了，我现在建立了一个新链接跟原来的产品标题一样，可以把发过去的库存同步到新链接上吗","AI响应":"你好！很高兴为你解答。\n\n如果旧链接已被删除，新创建的链接（Listing）与旧链接的 SKU 或系统 ID 是不一致的。由于 Full 仓的库存是绑定在具体的 Listing 上的，系统无法自动将已发往仓库的库存同步到新链接上。\n\n建议你尝试以下操作：\n1. 联系后台客服开 Case，提供旧链接的 SKU 和新链接的信息，询问仓库是否可以协助进行库存转移或重新贴标挂载。\n2. 如果仓库无法直接操作转移，你可能需要申请将这批货物退回或移除，重新贴标后再按新链接的流程发货入仓。\n\n为了避免损失，请尽快联系后台支持团队确认该批货物的当前状态。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-13 11:12:44","用户":"彭大力👩🏽😳","群":"","用户问询":"你好 半托管上了50个sku，曝光很低，该怎么办呢","AI响应":"你好！关于半托管店铺50个SKU曝光低的问题，建议从以下几个方面进行优化：\n\n1. 优化Listing质量：确保标题包含核心关键词，图片清晰且符合规范。半托管商品自带“Full”标，本身具有流量优势，如果曝光低，可能是关键词覆盖不够精准。\n\n2. 价格竞争力：检查您的定价。半托管模式采用收益价格模式，您可以参考平台建议价，确保在同类产品中具有竞争力。\n\n3. 参与平台活动：积极提报后台的促销活动。活动期间平台会有大量的流量倾斜，是提升曝光最快的方式。\n\n4. 广告引流：虽然不强制要求有销量才能开广告，但对于新上架的50个SKU，可以挑选其中潜力较大的款式开启广告，主动获取流量。\n\n5. 选品调整：参考官方选品专家提供的拉美热销大数据，检查目前的50个SKU是否符合当地市场需求。\n\n由于我无法直接查看您的店铺数据，建议您联系您的运营经理，请同事帮您分析具体的流量瓶颈并提供针对性建议。\n\n网页参考资料\n半托管模式全解析：https://mercadolibre.cn/news/info?id=215&type=live","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-19 13:53:11","用户":"骑着毛驴去拉萨","群":"","用户问询":"UP店多变体的，可以统一调价格吗","AI响应":"你好！UP模式支持更灵活地管理多变体商品。你可以通过批量上传更新模板的方式，在表格中统一调整不同变体的价格，也可以在同一个商品链接中为不同变体独立定价。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-18 20:57:05","用户":"啊楼🍉","群":"","用户问询":"Inyector Diésel Common Rail 0445110491 Md20a Pyz1 标题上不能写0445110491 吗？","AI响应":"你好！如果该编号是特定品牌的零件号，直接使用可能存在侵权风险。建议在标题中加上“适用于”或“兼容”字样，例如：Inyector Diésel 适用于 0445110491，以明确产品兼容性。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-18 14:36:07","用户":"初","群":"","用户问询":"FULL上传的变体链接 前台分开显示怎么处理","AI响应":"你好！同一商品的不同变体在上传表格中必须保持标题完全一致，系统才能识别并聚合。请核对表格，确保标题相同，且变体属性栏已正确填写。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-16 17:35:43","用户":"笑","群":"","用户问询":"所有变体都已经激活了，为什么看不了前台","AI响应":"你好！如果所有变体都已激活但前台仍无法查看，可能是以下原因：\n\n1. 属性缺失：请检查每个变体是否都已添加库存、价格和通用代码（UPC/EAN）。\n2. 图片规范：确保每个变体都有符合要求的首图。\n3. 系统延迟：新激活的链接通常需要 24 小时同步到前台。\n4. 配送区域：请确认收货地址是否在配送范围内，否则可能显示不可售。\n\n若 24 小时后仍无法查看，建议联系经理核查。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-16 16:36:08","用户":"好","群":"","用户问询":"你好，半托店铺sku上限，应该怎么处理","AI响应":"你好！很高兴为你解答。\n\n半托管模式下，每个店铺目前有100个listing的限制，每个listing下建议不超过5个sku。如果你的sku数量已经达到上限，可以参考以下处理方式：\n\n1. 优化现有库存：建议你定期清理动销差、库龄长的sku。你可以通过后台查看库存绩效，针对那些被标记为“积压”或“过剩”的产品，及时通过促销活动提升动销，或者申请退仓，腾出额度给更有潜力的爆款。\n\n2. 提升店铺表现：上架额度并非固定不变。如果你的店铺运营表现优秀、订单履约率高且销售业绩持续增长，系统会自动为你扩充上架额度。\n\n3. 联系买手申请：半托管模式的额度与入驻时沟通的寻品清单相关。如果你的账号表现良好且有优质的新品计划，可以主动联系对接的买手，向其申请人工扩容。\n\n建议采取“多款式、轻库存”的策略，优先上架高潜力的产品，以保证额度的利用率最大化。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-16 16:35:31","用户":"迷迷 苏","群":"","用户问询":"一个链接有多个SKU要怎么单独删除其中一个呢","AI响应":"你好！很高兴为你解答。\n\n在美客多后台，一个链接（Listing）下的多个SKU（变体）是无法直接“单独删除”其中某一个的，但你可以通过以下方式达到同样的效果：\n\n1. 暂停/下架单个变体：\n进入 Listings 管理页面，找到该条链接并点击进入详情。在变体列表中，找到你想要处理的那个 SKU，将其状态从“Active”改为“Paused”。这样买家在前台就看不到这个 SKU，也无法下单了。\n\n2. 彻底移除（仅限自发货/未入仓）：\n如果你是想彻底从列表中去掉这个 SKU，通常需要通过 Excel 批量更新模板。在模板中找到该 SKU，将其状态设置为“Closed”或根据模板指令进行删除操作后重新上传。\n\n3. 海外仓（Full）模式：\n如果该 SKU 在海外仓还有库存，你无法直接删除它。必须先完成退仓或销毁，待库存清零后，再进行下架处理。\n\n总结来说，最简单直接的方法就是在后台变体管理中，将不需要的那个 SKU 状态改为“暂停（Paused）”。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-16 15:52:44","用户":"葉","群":"","用户问询":"你好，有半托管产品上架的流程吗 有教程吗","AI响应":"你好！很高兴为你解答。半托管模式的产品上架流程如下：\n\n1. 发布产品：在卖家后台创建Listing。\n2. 商家发货：将货物发送至美客多国内东莞集货仓。\n3. 仓库接收：集货仓收到货物并进行核验。\n4. 仓库上架：仓库处理完成后，产品状态会更新。\n5. 发售（Active）：产品正式变为在售状态，买家可下单。\n\n关于上架操作，你可以参考以下步骤：\n\n单品上传：\n第一步：登录卖家后台，进入“Listings”页面，点击“Add listings”。\n第二步：选择类目。建议通过关键词搜索或逐级选择，确保类目精准。\n第三步：填写标题。使用英语填写，系统会自动转化为当地语言。\n第四步：完善属性。填写品牌、型号、规格等技术参数。\n第五步：上传图片。首图建议为纯白底，尺寸在1200像素以上。\n第六步：设置价格与库存。在收益价格模式下，录入你期望的美元净收益（商家供货价），平台会自动计算前端售价。\n\n批量上传：\n第一步：在“Listings”页面选择“Add listings in bulk”。\n第二步：下载对应类目的Excel模板。\n第三步：按模板要求填写产品信息、图片链接及价格。\n第四步：上传表格并检查是否有报错提示。\n\n注意事项：\n1. 半托管不需要等待核价，直接上架备货即可。\n2. 必须先将货物送入东莞集货仓，仓库处理完成后产品才会上架变为可售状态。\n3. 建议每个店铺Listing限制在100个以内，每个Listing下建议不超过5个SKU。\n4. 你需要至少有10个SKU处于发售（Active）状态。\n\n网页参考资料：\n建议观看视频《新店启动，Listing上架必修课》00:39:59时间点的内容。视频链接：https://mercadolibre.cn/news/info?id=64&type=live","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-16 13:58:39","用户":"纯属巧合","群":"","用户问询":"1.我们现在的扣费和表上的所有数值都对不上， 这个不是尺寸重量的问题。2. 现在多重以上计抛？3，账单详情怎么跟每个订单对应得上","AI响应":"你好！很高兴为你解答。\n\n针对你提出的三个疑问，具体说明如下：\n\n1. 扣费数值对不上的原因：\n在半托管模式下，你看到的账单扣费可能包含了平台佣金、配送费以及可能的税费代扣。如果你是对比前台售价与你的净收益，中间的差值除了运费还包含平台收取的销售佣金。另外，请确认你查看的是否为最新的 6 月份调整后的价卡，因为 300g 以下的产品运费已经调低，而 300g 以上的产品计费逻辑发生了变化。\n\n2. 计抛标准：\n目前平台的规则是：\n- 300g 以下的产品：通常按实重计费，运费比之前更便宜。\n- 300g 及以上的产品：按照体积重计费。体积重的计算公式通常为（长×宽×高/6000）。如果体积重大于实重，则按体积重计费。\n\n3. 账单详情与订单对应：\n你可以通过以下路径进行核对：\n- 进入卖家后台的“账单详情”或“Payments”模块。\n- 在账单明细列表中，每一笔扣费通常都会关联一个具体的 Order ID（订单号）。\n- 你可以下载账单报表（Excel格式），通过订单号进行筛选和匹配，这样就能清晰地看到每个订单对应的佣金、配送费等各项具体扣费。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-15 16:14:58","用户":"************金","群":"","用户问询":"是的，这个产品上架需要什么资质？","AI响应":"上架蓝牙耳机需要提供蓝牙技术联盟的BQB认证。此外，由于涉及无线电通讯，通常还需要通过目的国相应的强制性认证，例如墨西哥的NOM认证。建议提前准备好相关合规证明文件。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-15 10:52:06","用户":"业务部王姝洁17674066774","群":"","用户问询":"全托管模式下添加变体成功后，还需要核价吗？","AI响应":"你好！全托管模式下增加变体后是需要核价的。卖家提报变体及目标收益价后，需通过平台核价及买手选品，审核通过后方可备货上架售卖。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-15 09:29:51","用户":"业务部王姝洁17674066774","群":"","用户问询":"全托管模式添加变体进度条一直不动是为什么","AI响应":"你好！从截图看进度条卡住，通常是由于网络环境不稳定或浏览器插件冲突导致的。\n\n建议你尝试以下操作：\n1. **关闭网页翻译**：翻译插件会干扰后台脚本运行，请务必恢复英文原版界面。\n2. **更换浏览器**：建议使用 Chrome 浏览器的**无痕模式**重新操作。\n3. **检查图片大小**：确保上传的图片符合平台要求，单张图片过大可能会导致上传卡死。\n\n如果以上方法均无效，可能是系统临时波动，建议清除浏览器缓存后稍后再试。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-14 16:20:22","用户":"大山","群":"","用户问询":"同一个链接，不同的SKU可以定不同的价格吗","AI响应":"如果是全托管模式，核价时系统会直接拉齐价格，同一链接下不同SKU会按统一价格核价。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-13 16:58:32","用户":"😐","群":"","用户问询":"美客多墨西哥跨境店变体广告如何分别开启","AI响应":"你好！很高兴为你解答。在美客多广告系统中，广告是以Listing为单位进行投放的。如果你的变体已经合并在同一个Listing下，系统通常会对该Listing进行整体推广。若需要针对不同变体分别开启广告，建议在广告管理界面查看是否可以针对特定SKU进行出价或开关设置。\n\n网页参考资料\nhttps://global-selling.mercadolibre.com/ads","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-13 13:08:35","用户":"牛奶","群":"","用户问询":"70*20 SKU LABEL 这个可以吗","AI响应":"不可以。半托管模式要求 SKU LABEL 的尺寸必须为 7*2.2cm。为了确保仓库能正常扫描入库，请严格按照官方要求的尺寸进行打印和张贴。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-19 16:55:52","用户":"Aurora","群":"","用户问询":"3368036726-list_omnichannel-b1065221f51e (5257) 全托上链接跳这个代码是什么意思","AI响应":"你好！很高兴为你解答。\n\n这个代码通常是系统报错的内部标识符，代表你在全托管模式下上传链接时遇到了系统校验拦截。\n\n出现这种代码报错，通常有以下几种可能：\n1. 寻源ID不匹配：你上传的产品与买手发布的寻品清单中的寻源ID（Sourcing ID）没有正确关联，导致系统无法识别该链接。\n2. 属性缺失或冲突：Listing中的某些必填属性（如品牌、类目、规格等）填写不规范，或者与系统预设的参数产生了冲突。\n3. 系统网络波动：平台后台接口在处理大量数据时出现的临时性错误。\n\n建议你尝试以下操作：\n1. 检查寻源ID：确保你是通过买手提供的正确入口进行提报，并核对寻源ID是否一致。\n2. 简化信息：先尝试只填写必填项，不要添加过多的自定义描述，看是否能成功提交。\n3. 重新登录：清除浏览器缓存，重新登录全托管后台再次尝试。\n\n如果多次尝试依然跳出该代码，建议直接联系你的全托管对接买手或招商经理，并提供该完整代码截图，由后台技术人员进行排查。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-17 16:18:49","用户":"Morii","群":"","用户问询":"能为已经上架的产品添加变体吗","AI响应":"可以的。你可以通过以下步骤为已经上架的产品添加变体：\n\n1. 前往我的账户。\n2. 选择活动列表。\n3. 在操作菜单中，点击修改以访问你的列表的所有信息。\n4. 在产品特征部分，点击添加或更改变体进入编辑器，让你告诉买家你提供多少种变体。\n\n添加新变体后，你将自动看到新的变体显示在下面，你可以为每个变体添加图片、库存、通用代码以及独特的SKU。确认后，变体将添加到数据表中。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-16 21:42:09","用户":"波波波pewpewpew突突突","群":"","用户问询":"一个产品最多可以有多少个变体？","AI响应":"目前官方信息未明确限制变体的最大数量。建议根据实际规格合理设置，以保证买家选择体验和库存管理的便捷性。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-16 17:34:44","用户":"笑","群":"","用户问询":"带变体的链接看不到前台 为什么","AI响应":"你好！带变体的链接在前台搜不到，建议按以下步骤自查：\n\n1. 确认状态：检查后台所有变体是否都已设置为 Active。\n2. 完善属性：确保每个变体都添加了图片、库存和通用代码（UPC/EAN）。\n3. 系统同步：新上架或修改变体后，系统需要时间同步数据，请耐心等待。\n4. 检查类目：若类目选择不精准或属性填写不规范，会影响搜索曝光。\n\n若 Item ID 能搜到但关键词搜不到，请重点优化标题。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"}]},{"一级大类":"账号入驻与安全","二级子类":"入驻流程","Past 7 Days":388,"Previous 2026-07-06 to 2026-07-12":341,"Change":47,"WoW":0.1378299120234604,"Past 7 Share":0.056321672231093044,"高频问题":"入驻/注册/开店流程","__details":[{"时间":"2026-07-16 14:25:20","用户":"Holly","群":"","用户问询":"1. 首先业务模式自营和托全，我们暂时不没完全确认，是否可以通过什么方式，申请一个客户经理帮助我们做些具体问题的了解和平台介绍 2. 其次是，我们现在只有amazon，独立站平台，还没入驻过美客多平台，我们希望先申请一个客户经理，再进行注册店铺可以吗？毕竟我们考虑到体量在这，我们也希望有个好的开始，不然调整来调整去很麻烦","AI响应":"你好！很高兴为你解答。针对您的情况，建议如下：\n\n1. **申请路径**：您可以先填写“官方客户经理申请表”：https://doc.weixin.qq.com/forms/AI8A3wfvAAoAZAAaQazAKgCNI0iZoEFqf?page=1。该表单适用于希望入驻托管模式或具备优质供应链的卖家。若您的资质符合要求，专属经理会在5个工作日内通过电话或邮件联系您。\n\n2. **先对接后注册**：您可以先提交上述申请表，待经理联系并沟通确认最适合您的业务模式（自营或托管）后，再按照经理指引进行注册，这样可以避免后续调整的麻烦。\n\n3. **资料准备**：无论哪种模式，请先准备好营业执照、法人身份证及收款账户。\n\n网页参考资料：https://mercadolibre.cn/news/info?id=215&type=live","一级大类":"账号入驻与安全","二级子类":"入驻流程","问题主题":"入驻/注册/开店流程"},{"时间":"2026-07-17 16:15:54","用户":"小火鸡","群":"","用户问询":"入驻时需要填写企业名称，我可以使用别的名字不适用企业本名注册吗，注册完后我店铺名字是显示企业名字还是可以修改设置","AI响应":"你好！很高兴为你解答。\n\n在入驻填写企业名称（Business Name）时，必须填写您营业执照上的公司中文全称，不能使用其他名字。请务必确保填写的名称与营业执照上的文字完全一致，否则无法通过审核。\n\n关于店铺名字的显示：\n1. 店铺名与企业名不同：注册时填写的企业名称仅用于平台审核和合规，并不是您的前端店铺名。\n2. 可以修改设置：注册完成后，您可以自行设置和修改您的店铺名称（Shop Name/Nickname）。这个名字才是展示给买家看的。\n\n建议在设置店铺名时，选择与您经营类目相关的英文名称，并注意避免与美客多平台名称相似，以防侵权风险。\n\n普通自发货/海外仓也可选择自注册（PC端登入）：https://global-selling.mercadolibre.com/landing/about\n\n入驻准备材料：\n1. 中国内地或香港公司营业执照。\n2. 法人身份证及人脸识别。\n3. 第三方美金收款账户。\n4. 海外常用邮箱（如Gmail、Outlook）。","一级大类":"账号入驻与安全","二级子类":"入驻流程","问题主题":"入驻/注册/开店流程"},{"时间":"2026-07-19 11:43:07","用户":"待续","群":"","用户问询":"你好经理 我这里有个问题 是这样的，我现在是一家公司的运营嘛，然后老板的货款就是说有本土的提姆，还有国外的本土他的货都有嘛。然后现在就是说发墨西哥美克多的。然后如果涉及到商标的话，因为我只注册了一个CGN，但是是欧盟的证书，那这边客户的话会投诉吧，万一碰到然后 ，没有外包装标签的照片，你在跟客户沟通时需要**引导他拍下外包装上的标签（Label）**。那个标签上有仓库的分拣信息，是判定仓库责任最直接的证据。\n\n**1. 给客户的回复话术（英文）：**\n\"I am very sorry that you received the wrong product. This order was shipped by the Mercado Libre FULL warehouse, and it seems there was a mistake during their picking process. To help me solve this with the warehouse and get you a refund, **could you please take a photo of the shipping label on the outer package?** In the meantime, please select the 'Return' option in the system. I will fully cooperate to ensure you get your refund quickly.\"\n\n**中文含义：**\n非常抱歉你收到了错误的商品。这单是由美客多FULL仓库发货的，看起来是他们分拣出错了。为了帮我向仓库解决问题并为你办理退款，**能不能请你拍一张外包装上物流面单的照片？** 同时，请在系统选择“退货”，我会全力配合确保你尽快拿到退款。\n\n**2. 为什么要先跟客户要标签图：**\n*   **定责证据**：标签上有仓库的条码。如果标签上写的是相机，但里面装的是平板，那就是仓库贴错标或拿错货，平台必须赔偿你。\n*   **防止买家调包**：要求拍面单也是一种防范手段，确保这确实是从你这单发出去的包裹。\n\n**3. 如果客户不提供标签图怎么办？**\n如果客户不提供，或者已经把包装扔了，你依然可以拿着平板的图片去找客服。你可以跟客服说：“买家收到的货完全不是我卖的商品，且这是FULL仓发货，请核实仓库出库记录。”\n\n**总结操作顺序：**\n1. 先发上面的话术给客户，安抚并索要标签照片。\n2. 无论客户给不给照片，你都可以同步拿着现有的平板图片去给客服开Case（用我上一条给你的客服话术）。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 13:17:27","用户":"啊邝","群":"","用户问询":"多个包裹装入一个大袋子中，最外层包装需要贴箱唛吗","AI响应":"你好！很高兴为你解答。\n\n是的，最外层包装需要贴标，具体要求如下：\n\n1. **小包裹贴单**：每个独立的小包裹必须先粘贴好美客多的物流面单。\n2. **大包贴标**：将多个小包裹统一放入一个大袋子（或大箱子）后，最外层需要粘贴**大包标签**（也叫国内面单或袋标），以便菜鸟转运仓识别这袋货属于哪个卖家。\n3. **封口要求**：大包的封口处建议使用**紫色扎带**进行加固，这有助于仓库优先处理。\n4. **自寄情况**：如果你是采用“卖家自寄（Drop Off）”模式，通过顺丰等国内快递寄送，那么最外层贴的就是国内快递的面单。\n\n**特别提醒：**\n请确保大包内的每个小包裹面单平整、清晰，避免在运输过程中因挤压导致条码无法扫描。\n\n网页参考资料：\nhttps://doc.weixin.qq.com/pdf/d3_ARIAagYiAMICNwMaUzHcfT4G95q2a?scode=AI8A3wfvAAoFDTGehz","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 20:56:12","用户":"啊楼🍉","群":"","用户问询":"full美国转运仓包装袋是要半透明？","AI响应":"你好！是的，所有产品必须使用半透明包装，且包装需完全覆盖产品。此外，必须在包装外部标注通用代码或可见的产品标签。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 13:28:51","用户":"海盜","群":"","用户问询":"自发货 商品发货包装可以用纸箱包装吗","AI响应":"可以的。自发货模式下，您可以使用纸箱进行包装。请确保包装能够保护商品在运输过程中不受损坏，并符合菜鸟的尺寸和重量限制（如最长边≤60cm，重量≤15kg）。同时，请务必在平整面上粘贴好清晰的物流标签。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 09:42:38","用户":"Dford","群":"","用户问询":"另外，在发货时效方面有扶持吗？因为我的货源来自1688，它们交货时间很难控制，写着是第二天发货，但他却是第三天发货，导致我这边的发货时间晚了","AI响应":"自发货订单要求72小时（工作日）内上网，其中您需在48小时内送达仓库。目前发货时效无特殊扶持或豁免，建议您优先选择库存稳定、发货快的供应商，或适当备货至您的仓库以保证在规定时间内完成发货。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 13:52:20","用户":"纯属巧合","群":"","用户问询":"明白， 但是我想知道前台的挂牌价是加了配送费的吧， 我要知道我配送费多少才能知道我的价格有没有优势， 我的诉求就是现在具体配送费是怎么算的","AI响应":"你好！很高兴为你解答。\n\n在半托管模式下，国际段物流和尾程配送费是由平台直接进行前端售价藏价的。\n\n如果你想了解具体的配送费标准以评估价格竞争力，可以参考以下信息：\n\n1. 计费逻辑：配送成本主要受产品实重与体积重（长×宽×高/6000）中较大值的影响。\n\n2. 官方运费查询：你可以前往美客多卖家后台的运费查询页面查看详细的运费标准，包括不同重量区间的费用。\n墨西哥站点具体运费表参考：https://global-selling.mercadolibre.com/help/shipping-costs-envio-cainiao-mexico_41817\n\n3. 利润计算器：如果你需要计算具体订单的运费成本和前端售价的构成，建议使用官方的利润计算器进行测算，它可以帮助你模拟不同重量下的费用情况：https://global-selling.mercadolibre.com/listings/cost-calculator\n\n需要注意的是，半托管模式下平台会以仓库入库时的实际称重为准来计算最终成本并体现在前端售价中。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 11:04:46","用户":"窦红建","群":"","用户问询":"如果产品包装比较小，放不下这么多内容怎么办？","AI响应":"你好！如果产品包装较小，无法容纳完整信息的标签，可以参考以下处理方式：\n\n1. 缩减非核心信息：在保证合规的前提下，优先保留最关键的四项信息：\n- **Nombre del producto**（产品名称）\n- **País de origen: Hecho en China**（原产地，必须保留）\n- **Importador**（进口商信息，通常由货代提供）\n- **Advertencias**（安全警告语，如果有的话）\n像生产批次、日期、材质等信息可以适当缩小字号。\n\n2. 调整标签尺寸：标签并没有绝对的固定尺寸要求，你可以根据包装大小等比例缩小标签，只要确保肉眼清晰可见、扫描枪能避开条码即可。\n\n3. 附加说明书：如果包装实在太小（例如首饰、小配件），可以将详细的合规信息（如成分、使用说明、警告语）印在随附的西语说明书上放入包装内，但在外包装上仍必须保留 **Hecho en China** 和产品名称。\n\n4. 咨询货代：因为货物清关主要由货代负责，建议你将包装尺寸和缩减后的标签样稿发给你的货代确认，看是否符合他们清关的要求，避免因标签信息不足导致海关扣货。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 11:02:06","用户":"不被大风吹倒","群":"","用户问询":"你好 包裹包装外面必须要西班牙语吗？","AI响应":"你好！很高兴为你解答。\n\n关于包裹包装的文字要求如下：\n\n1. 商品描述：在上传产品时，商品描述建议用英文编辑，系统会自动按销售国家转化成西班牙语或葡萄牙语。\n2. 图片文字：如果图片中需要带有文字描述，建议使用英文。\n3. 店铺首页：需要注意的是，根据您销售的站点，店铺首页展现的所有文字（含图片中的文字）必须使用本地语言（西班牙语或葡萄牙语）。\n4. 服装类洗水票：如果是全托管模式下的服装类产品，洗水票上的文字建议包含西班牙语（针对墨西哥、智利等站点）或葡萄牙语（针对巴西站点）。\n\n总结来说，包裹外部包装本身没有强制要求必须全是西班牙语，但为了提升买家体验和降低退货率，建议核心信息参考上述规则进行配置。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 08:16:32","用户":"扣泥几蛙","群":"","用户问询":"我是每一个包裹都需要再贴一个面单吗","AI响应":"是的，每一个包裹都必须单独粘贴一张对应的物流面单。\n\n如果一个订单因为超重或超限被拆分成多个包裹，每个包裹都必须拥有自己独立的物流面单，以确保每个包裹都能被物流商正常扫描、追踪并计算运费。请勿在一个包裹上贴附多张面单，也不要重复使用同一张面单贴在不同的包裹上。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 09:35:40","用户":"Hehehaaa","群":"","用户问询":"请问我的快递已经到达广东省东莞市沙田镇进港南路周大福物流东莞物流中心205号库台，但由于没有贴箱麦，导致无法入库，请问怎么解决","AI响应":"关于无主件：到仓快递无箱唛和商品标签，请到无主件认领表格进行认领，没有表格的亲联系我。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 11:11:54","用户":"Z","群":"","用户问询":"你好，美客多全托的送到东莞仓的货件，因为供应商延期了，货无法再最后发货日期前送达，应该怎么办 可以取消这个货件吗","AI响应":"你好！很高兴为你解答。\n\n如果全托管货件无法在最后期限前送达，请按以下方式处理：\n\n1. **可以取消**：在卖家后台找到该货件，点击取消即可。\n2. **重新创建**：取消后，你可以根据供应商最新的交货时间，重新创建一个新的货件计划。\n3. **及时处理**：建议尽早取消，避免因货件过期导致系统记录异常或影响后续的入仓预约。\n\n请确保新货件的信息准确，并按照最新的预约时间送达东莞仓。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 10:32:51","用户":"窦红建","群":"","用户问询":"我要给产品建配送计划，比如一共发270件，分两批发，135通过海运发，135通过空运发。是建两个配送计划，还是建一个配送计划？","AI响应":"你好！建议你建立两个独立的配送计划。\n\n因为在美客多后台创建配送计划（Shipment）时，每个计划都会对应唯一的追踪信息和预期的入库时间。海运和空运的运输时效差异巨大，如果放在同一个计划中，会导致系统无法准确追踪物流状态，甚至可能因为部分货物长时间未到货而导致整个计划异常。\n\n通过建立两个计划，你可以分别为海运和空运的货物生成对应的箱标和面单，方便仓库分别进行收货和上架操作。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 10:12:01","用户":"李玲娅","群":"","用户问询":"我物流发货怎么没有产品标签了","AI响应":"你好！很高兴为你解答。\n\n如果发货时没有产品标签，请检查以下几点：\n1. 确认是否已在后台完成发货计划的创建，只有在创建过程中或完成后，系统才会生成对应的商品标签。\n2. 检查打印设置，确保选择了正确的标签尺寸。\n3. 如果是系统问题导致无法下载，建议刷新页面或更换浏览器尝试。\n\n如果依然无法获取，请确保您的Listing状态正常，且已正确录入商品信息。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 14:33:03","用户":"Felicity 103%","群":"","用户问询":"免胶假睫毛包装有什么需求","AI响应":"你好！很高兴为你解答。\n\n平台对产品包装的要求如下：\n1. 保护性：确保包装能保护产品在运输中不受损。\n2. 标签规范：需包含西班牙语/葡萄牙语的说明及使用指南。\n3. 环保安全：符合相关的安全和环保标准。\n\n网页参考资料：\n商品包装规范：https://global-selling.mercadolibre.com/help/18500","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-18 17:13:13","用户":"飞哥","群":"","用户问询":"订单发货延迟（我的订单已经通过货代发给了 东莞集运仓，但是集运仓未及时更新订单状态），这个该怎么处理？","AI响应":"你好！很高兴为你解答。若包裹派送至集运仓12-24小时后仍未更新，请联系美客多官方客服，提供交易订单号或货运单号，客服会协助联系菜鸟核实并催促扫描。请确保包裹尺寸和重量符合菜鸟限制，避免因不合规导致延迟。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 16:55:13","用户":"迷迷 苏","群":"","用户问询":"根据规定，你需要在退仓单打包完成后的【5天】内安排提货并拿回商品。是按邮件发送开始还是按申请提取商品开始算","AI响应":"你好！很高兴为你解答。\n\n退仓的【5天】期限是从**退仓单打包完成（即状态变为“Ready to pick up”）**开始计算的，而不是从你申请提取商品或发送邮件的时间开始算。\n\n具体流程逻辑如下：\n1. 你在后台提交申请后，仓库会进行下架和打包。\n2. 当仓库完成打包，系统状态更新为可提货时，这 5 天的倒计时就正式开始了。\n3. 你需要在看到状态更新后，尽快发送邮件预约，并确保在 5 天内完成提货。\n\n如果超过 5 天未提货，仓库将有权对商品进行销毁处理，请务必留意后台状态变化并及时安排。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 11:32:19","用户":"Li","群":"","用户问询":"哪不是后面全部派不了件，快递费都要商家承担，物流商不想派件都可以说无法派送，他们快递费也拿啦，还不用派送","AI响应":"非常理解你的顾虑。虽然规则上已产生的运费需卖家承担，但平台对官方物流商有严格的考核机制：\n\n1. **派送证据**：物流商必须提供多次派送失败或买家拒收的记录，不能随意标记。\n2. **信誉保护**：如截图所示，系统判定为买家原因，已为你免除信誉扣分，避免了二次伤害。\n3. **异常申诉**：如果你认为物流商存在恶意不派送的情况，可以保留物流轨迹截图，联系卖家支持进行申诉。\n\n建议在后台核实退货地址，确保货物能退回国内以减少损失。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 12:30:25","用户":"窦红建","群":"","用户问询":"如果一个客人在我们店铺里用同一个联系人信息和地址，下了10个订单，合并发货的话，算10个有效订单吗？","AI响应":"你好！在美客多平台，订单的计算是基于订单号的。\n\n如果你将这10个订单合并为一个包裹发货，虽然节省了物流成本，但由于你只能在一个订单下上传有效的物流单号，其他9个订单会因为没有物流轨迹更新而被系统判定为未发货或虚假发货。这不仅会导致那9个订单被系统自动取消，还会严重影响你的店铺信誉和发货延迟率。\n\n因此，为了确保10个订单都算作有效订单并计入销量，你必须针对每一个订单号分别打印面单并独立包装发货。只有每个订单都有对应的物流轨迹，才会被视为有效订单。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-18 21:02:48","用户":"灯火星星","群":"","用户问询":"就是自发货和海外仓模式都集中在了一个站点下，可以安排自发货也可以通过海外仓发货吗？","AI响应":"你好！很高兴为你解答。是的，美客多支持卖家从自发货模式转为海外仓（FULL）模式，或者两种模式同时运营。海外仓可以根据卖家需求在后台自动激活，申请下来不激活也不影响店铺只做自发货。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 19:02:30","用户":"杭州远景-誉江南张冬贤13592864225","群":"","用户问询":"之前可以下载的啊，现在找不到地方下载，创建发货计划的产品也没有出现可以下载标签的按键","AI响应":"你好！很高兴为你解答。\n\n发品界面或创建货件页面没有下载表单或标签按钮，可能是因为：\n1. 店铺还在审核中，权限未完全开放。\n2. 浏览器缓存问题，建议清除Chrome浏览器缓存重新登录，或者使用无痕模式尝试。\n3. 账户权限设置问题。\n\n此外，请务必关闭网页自动翻译功能，因为翻译插件有时会导致页面按钮显示异常或无法点击。建议你把具体的界面截图私信发给你的经理，让我们同事帮你查看店铺状态和权限设置，这样能更快定位问题。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 16:52:49","用户":"ㅤ  ㅤ","群":"","用户问询":"那我想问自发货模式除了物流时效和半托管不同还有平台佣金还有流量扶持不同还有其他不同的吗","AI响应":"你好！除了你提到的差异，主要区别还包括：\n1. 仓储费：自发货无仓储费；半托管目前也暂无仓储费。\n2. 运营标识：半托管产品带Full标，享有更高流量权重；自发货没有。\n3. 配送责任：自发货需卖家送货至国内集运仓；半托管需提前备货至东莞仓。\n4. 售后处理：半托管由平台负责尾程配送及相关售后，自发货需卖家更多参与。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 10:26:19","用户":"来一杯生活🍻","群":"","用户问询":"我们发了一批货过去，仓库说我们多发货了，核实沟通后又说已经关单了，无法入库是什么意思","AI响应":"你好！这通常是因为该补货计划已完成收货或超过了入库有效期，系统自动关闭了订单。此时多出的货物无法关联原单入库，被判定为异常件。你可以选择新建入库单将多出的货物入库，或者联系仓库预约提走。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-18 11:48:11","用户":"A.roc","群":"","用户问询":"就是我发货还有一个单号，是我创建发货后有的吗？在后台那个位置，备货运单号","AI响应":"是的，备货运单号是在你创建发货计划并点击确认发货后生成的。\n\n你可以在卖家后台的【发运单列表】中查看。如果是未入仓的异常件退仓，邮件预约和现场提货都需要提供这个商家订单号（即备货运单号）。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-18 09:45:27","用户":"邓欢","群":"","用户问询":"全托管认为没必要发那么多数量，系统又下了那么多数量，不能更改最低发货数量咋办","AI响应":"如需调整备货数量，在系统推送计划后先别创建发货单，将【带#号的sku代码 + 数量】发给对接的供应链人员申请调整。下午四点后提交的次日调整，周末无法调整。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-18 07:15:38","用户":"k","群":"","用户问询":"美客多自发货，现在开始计抛了吗，为什么店铺后台订单里面没有显示，","AI响应":"自发货计抛规则已在阿根廷站点生效，巴西、墨西哥等站点也将陆续执行。\n\n计抛仅影响生效后的新订单。如果您的订单是在生效日期前生成的，仍按实重计费。此外，只有包装后重量大于等于500g的包裹才计抛，500g以下仍按实重计费。\n\n如果符合计抛条件但未显示，可能是系统更新延迟，建议核对订单详情中的运费明细。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 19:21:08","用户":"cyc","群":"","用户问询":"经理，今天快递反馈，31 开头的快递都无法正常揽收 怎么办啊经理","AI响应":"你好！很高兴为你解答。目前无法直接判断具体原因，建议你先核查包裹是否严格按照要求包装，并系好彩色扎带或粘贴彩色胶带。若仍无法揽收，建议联系对应物流服务商或在后台提交工单由工作人员确认。后续有问题可以继续发问。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 16:13:11","用户":"************金","群":"","用户问询":"我之前入住的应该是个半托管。我先把这个发货模式能切换成自发货吗？","AI响应":"你好！半托管和自发货是两种独立的物流模式，目前无法直接切换。如果你想做自发货，需要使用不同的邮箱重新注册一个自发货账户，分开店铺进行运作。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 14:44:53","用户":"Freya","群":"","用户问询":"您好请问美客多自发货如果卖的无线电产品 上传商品的时候需要什么资质吗？","AI响应":"你好！很高兴为你解答。\n\n在美客多平台上传无线电产品时，通常需要注意以下资质和合规要求：\n\n1. 目的国准入认证：无线电产品（如对讲机、无线遥控设备等）通常需要符合目的国的电信法规。例如，销往墨西哥的无线电产品通常需要通过 NOM-121-SCT1-2009 或相关的 IFT 认证。\n\n2. 禁售与限制排查：请务必核实您的产品是否属于平台禁售范畴。例如，大功率无线电发射设备、信号干扰器或未经授权的通信设备在美客多是严格禁止销售的。\n\n3. 资料准备：虽然自发货模式在上传产品初期可能不会强制要求立即上传证书，但如果触发平台抽检或海关查验，您需要能够提供产品的合规性证明（如认证证书、技术参数说明等）。\n\n4. 描述合规：在刊登商品时，请如实填写产品的技术参数，不得含有夸大功能或误导消费者的描述。\n\n建议您在正式售卖前，先咨询您的物流承运商，确认该类无线电产品是否能够正常清关并派送至目的国，因为不同国家的物流政策对带电及无线电产品的限制各不相同。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-19 14:25:45","用户":"灯火星星","群":"","用户问询":"这个图片中带FULL字样的是不是都是海外仓发货的模式？","AI响应":"你好！很高兴为你解答。是的，在美客多买家前台，带有“FULL”标志的商品即代表该商品通过海外仓模式发货，由平台负责仓储和配送。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-19 14:22:38","用户":"灯火星星","群":"","用户问询":"自发货发到墨西哥一般要多久？我以一个2到4GK的包裹为例","AI响应":"你好！很高兴为你解答。自发货从国内集运仓发出到墨西哥买家签收，通常需要 15-25 个工作日左右。具体时效受清关速度及当地末端派送影响。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-19 13:53:02","用户":"萤火虫","群":"","用户问询":"如果我有自发货和一件代发，我后台物流揽收方式怎么填","AI响应":"美客多后台的物流揽收方式是**针对全店自发货订单统一设置**的，无法针对单个订单分别设置。\n\n如果你的货源既有自己的库存，又有一件代发，建议按以下逻辑设置：\n\n1. **设置路径**：Selling Preferences > Dispatch Methods > Select dispatch methods。\n2. **选择方式**：\n   - **若你的货源地和代发货源地都在菜鸟揽收范围内**：建议选择 **Pick Up（上门取货）**。\n   - **若地址不统一或不在范围内**：建议选择 **Drop Off（卖家自寄）**。\n3. **操作建议**：\n   - **自有货源**：你自己打包贴单后，通过国内快递寄往菜鸟仓。\n   - **一件代发**：让代发供应商帮你打印美客多面单并贴好，由供应商直接寄往菜鸟仓。\n\n**核心原则**：无论哪种方式，最终都必须使用美客多后台生成的菜鸟面单，并确保包裹在出单后 **72小时（工作日）** 内送达菜鸟仓并完成扫描上网。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-18 10:17:58","用户":"CH","群":"","用户问询":"你好 有个订单 b帮我看下 一个是被你们系统取消了 还能发货吗","AI响应":"你好！很高兴为你解答。\n\n从你提供的图片来看，订单 #2000014061209371 显示“Mercado Libre取消的包裹，因发现异常我们已将其作废”。\n\n这种情况是包裹检测出现异常，系统自动取消了订单。订单一旦被系统取消并标记为作废，就不能再发货了。\n\n如果买家在您发货前取消订单，货物自然不会发出，您也无需进行发货操作。如果货物已经发出但还未被物流商扫描上网，理论上可以联系物流商尝试拦截退回。一旦货物已被物流商扫描上网，就无法中途退回，需要正常完成配送流程。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-18 04:51:15","用户":"楠","群":"","用户问询":"明白，请问自发货在五个站点，美妆个护类，什么产品可以售卖","AI响应":"你好！美妆个护类目中，你可以售卖化妆工具（如刷具、美妆蛋）、美甲工具、个护电器（如卷发棒、剃须刀）以及不含液体、粉末、膏体的配饰。请注意，香水、液体、粉末、药品及保健品在自发货模式下均属于禁运品。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 14:24:49","用户":"TMR商学院运营-熙熙","群":"","用户问询":"我已经发货了两天 后台命令物流还是没有同步导致显示延迟是为什么","AI响应":"你好！很高兴为你解答。\n\n物流状态签收后未更新上线，很可能是包裹在物流商仓库的扫描环节出现了延迟。\n\n请核实以下情况：\n1. **发货确认**：发货后必须在后台点击“确认发货”，否则系统不会及时同步入库信息。\n2. **扫描时效**：物流商通常有24小时完成扫描入库。如果包裹送达仓库超过24小时仍未更新，请联系美客多官方客服提供运单号进行催促。\n3. **包裹规范**：请确保包裹尺寸和重量符合菜鸟限制，避免因不合规导致处理延迟。\n\n网页参考资料：https://seller.mercadolibre.com.mx/university/courses/vender-mercado-libre/costos-vender-mercado-libre/clase/costos-envio-mercado-envios","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 10:29:07","用户":"***柒","群":"","用户问询":"我不记得自己填的是全托管和自发货模式了，请问我要怎么查看","AI响应":"你好！很高兴为你解答。\n\n如果你不确定自己申请的是哪种模式，可以尝试通过以下方式确认：\n\n1. 检查入驻链接：\n全托管入驻通常需要填写特定的招商问卷，链接一般为：http://kks.ink/ss/vKx9ph/d12030\n自发货模式通常是通过官网自主注册：https://mercadolibre.cn/store/bu\n\n2. 通过进度查询链接核对：\n你可以点击半托管或全托管的专属查询链接：https://mercadolibre.cn/seller/info?id=478&type=consignment\n输入你当时填写的公司名称、手机号或邮箱。如果能查到结果，说明你申请的是托管模式；如果查询结果依然为空，可能你当时选择的是自发货自主注册模式，或者是信息录入尚需时间。\n\n3. 检查邮件内容：\n查看你登记的邮箱（包括垃圾箱），全托管模式的邮件通常会包含“托管”、“供货”或“东莞仓备货”等字样；自发货模式的邮件则更多涉及店铺开通和后台登录指引。\n\n自发货和托管模式可以一起做，但需分开店铺运作。如果你想同时经营，需要同步开两个账号。\n\n普通自发货/海外仓也可选择自注册（PC端登入）：https://global-selling.mercadolibre.com/landing/about\n\n入驻准备材料：\n1. 营业执照：中国大陆（法人身份证正反面）或中国香港（公司董事身份证正反面）。\n2. 注册邮箱：推荐使用Gmail、Outlook、Aliyun、Hotmail或Foxmail。\n3. 手机号：需为首次使用。\n4. 跨境店铺流水：FTI工贸一体和半托管/全托管模式仍需提供，普通自发货和海外仓模式不需要流水。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 08:50:30","用户":"Lisa","群":"","用户问询":"那如果合并一个快递寄出，2个箱唛贴在同一个箱子上吗","AI响应":"一个箱子一个箱唛。发货单创建的时候让填申报箱数，申报了几箱就会生成几个箱唛。\n\n如果你是将两个发货单的货物合并装入同一个物理箱子中寄出，请确保该箱子外部清晰粘贴这两个发货单对应的箱唛，以便仓库扫码入库。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 19:15:07","用户":"大大大明","群":"","用户问询":"在墨西哥站点上，如果没有达到299MXN，可以选择免费配送吗","AI响应":"你好！很高兴为你解答。\n\n如果商品售价低于299比索，你可以选择设置不包邮，此时运费由买家承担。如果你希望为买家提供更好的购物体验，也可以选择主动设置包邮，但此时运费将由你（卖家）承担。请确保在设置包邮时，你的净收益能够覆盖这部分运费成本。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 14:37:44","用户":"YOLO","群":"","用户问询":"顾客产生订单后，美客多平台是自己发货还是要卖家自己手动发货？","AI响应":"这取决于您的运营模式：\n\n1. **海外仓模式 (FULL)**：由美客多官方仓库自动完成拣货、打包和发货，卖家无需手动操作。\n2. **自发货模式**：卖家需手动处理。收到订单后，您需在3个工作日内打印面单、打包，并送至平台指定的国内集运仓。\n3. **全托管模式**：由卖家自己发货。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 11:31:19","用户":"Z","群":"","用户问询":"如果我确认发货了，但是18号才能真正发出去，这样会影响绩效吗","AI响应":"全托模式下，预约时间选择明天或后面的时间是不影响的，最重要是你要点确认发货完成流程。但全托有运单过期时间，请务必在运单过期前完成入库，否则会导致仓库无法正常收货。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 10:44:41","用户":"孫明山","群":"","用户问询":"美客多自发货，买家拒收后包裹退回，物流费由谁承担？","AI响应":"你好！很高兴为你解答。\n\n自发货模式下，如果买家拒收导致包裹退回，发去国内集运仓的费用以及官方物流尾程运费仍由卖家承担。自发货运费均按货件毛重计收，直接与平台结算。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 10:07:50","用户":"窦红建","群":"","用户问询":"店铺ID就是CNHANGZHOUPOLYGONPETPRO？","AI响应":"你好！根据你提供的截图，红框中的 **CNHANGZHOUPOLYGONPETPRO** 是你的店铺用户名（User），在很多场景下也可以作为店铺的唯一标识使用。\n\n不过需要说明的是，在美客多平台中：\n1. **User（用户名）**：就是你截图里显示的这一串大写字母，通常用于登录或在系统内部识别店铺。\n2. **Cust ID（数字ID）**：平台还有一个纯数字组成的客户ID。如果你在联系客服或填写某些官方表格时需要提供“店铺ID”，通常是指那一串数字。你可以在卖家后台点击右上角的头像，在弹出的菜单中通常能看到一串数字，那个就是 Cust ID。\n\n如果你现在是在填写发货资料或简单的店铺识别，使用这个用户名是没有问题的。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 17:45:49","用户":"Holly","群":"","用户问询":"托管服务也能自发货吗？还是需要先把货物备货去海外仓？","AI响应":"自发货和托管模式可以一起做，但需分开店铺运作。全托管模式下，商家需要将货物发送至平台指定的国内集货仓，无需提前备货到海外仓。\n\n国内集货仓地址：广东省东莞市沙田镇进港南路第一产业园205号库台\n联系人：叶宗虎 18025233509","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 12:00:07","用户":"蓝天白云","群":"时骏科技-美客多助手","用户问询":"这一点我们不在菜鸟揽收范围，但是我们可以自发货到菜鸟仓库","AI响应":"你好！很高兴为你解答。\n\n既然你不在菜鸟揽收范围内，需要采取“自寄”模式。请按照以下步骤操作：\n\n1. 设置物流方式：在后台 Selling Preferences > Dispatch Methods 中，将发货方式设置为 Drop Off（卖家自寄）。\n2. 填写发货地址：虽然是自寄，但后台仍需填写准确的发货地址。\n3. 寄送至仓库：你需要自行联系国内快递，将包裹寄送到菜鸟指定的自寄仓库。\n\n请务必确保订单在出单后 2天内 送达菜鸟仓库并被扫描上网。如果包裹已经寄出但仓库还未扫描，订单状态不会更新，可能会导致超时。\n\n你可以通过此链接查看最新的菜鸟自寄仓库地址列表：菜鸟自寄仓库地址。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 11:36:20","用户":"蓝天白云","群":"时骏科技-美客多助手","用户问询":"@美客多小助手萝拉 为什么买家说无法下单，无法配送到巴西呢？","AI响应":"你好！很高兴为你解答。\n\n买家反馈无法下单并寄送到巴西，通常有以下几种可能的原因：\n\n1. 配送区域限制：请检查该产品的配送设置，确认是否已开启巴西站点的配送服务，或者该买家所在的具体地区是否在物流覆盖范围内。\n2. 产品类目限制：某些特定类目或带电、液体等敏感货件可能受到跨境物流政策限制，导致无法下单。\n3. 买家账号问题：买家账号的收货地址信息不完整，或者账号存在异常，也会导致无法添加购物车。\n4. 平台系统波动：建议让买家尝试刷新页面、更换浏览器或稍后再试。\n\n如果确认设置无误但问题依旧，建议引导买家联系平台官方客服咨询具体原因。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 20:08:54","用户":"柯培鑫","群":"","用户问询":"全托管的流量是怎么样的，我现在做跨境自发货都没有流量啊","AI响应":"全托管模式的流量权重是平台顶级的，相比你目前正在做的跨境自发货，流量分配逻辑有本质的区别。\n\n**全托管模式的流量优势：**\n1. **官方FULL标加持**：全托管商品享有官方FULL标识，在搜索结果中排名更靠前。买家更倾向于购买带FULL标的产品，因为这意味着更快的物流和更好的售后。\n2. **专属活动入口**：全托管产品直通“MELI Selection”大促专场，并享有核心大促位和站外投放资源，这些流量是自发货模式很难触达的。\n3. **专业算法优化**：由平台专业团队负责链接优化和提报活动，通过官方算法提升转化率，流量利用率更高。\n\n**为什么你的跨境自发货没有流量：**\n1. **物流时效劣势**：自发货从中国发货，物流时间长，且买家往往需要支付额外的运费。在美客多，物流时效是影响排名的核心权重，自发货在搜索排名中天然处于劣势。\n2. **缺乏流量标签**：自发货产品没有FULL标，很难进入平台的各种促销频道。\n3. **购物车竞争**：正如你之前看到的，如果同款产品有海外仓（FULL）卖家在售，系统会优先把流量给到他们，导致你“正在丢失购物车”。\n\n**总结建议：**\n自发货模式目前在美客多主要用于测款，很难获得爆发式流量。如果你有优质货源但缺乏运营经验，全托管模式通过“0佣金、0广告费、官方推流”的政策，能极大解决你目前没有流量的困境。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 11:15:58","用户":"肖丽娟｜Sherilyn@大数跨境","群":"","用户问询":"美客多自发货可以自己安排国际物流直邮到买家手上吗","AI响应":"你好！美客多自发货模式不支持卖家自行安排国际物流直邮给买家。卖家必须将包裹发送至美客多指定的国内集运仓（如菜鸟仓），由平台指定的物流承运商负责跨境运输及最后一公里的派送。\n\n网页参考资料：\nhttps://global-selling.mercadolibre.com/landing/shipping","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 10:52:00","用户":"啊楼🍉","群":"","用户问询":"我必须购买什么产品才能免费送货？阿根廷的用户问，自发货","AI响应":"你好！针对阿根廷站点的自发货（Global Selling）模式，买家享受免运费的规则如下：\n\n如果买家购买的单件商品标价等于或高于 30,000 ARS，买家即可享受免费送货。\n\n如果商品价格低于这个门槛，买家则需要支付相应的运费。你可以直接告知买家，选购单价超过 30,000 ARS 的商品即可享受包邮服务。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 17:05:07","用户":"j、","群":"","用户问询":"现在就是已经发货的状态，销售详情中告知平台是怎么操作的","AI响应":"你好！很高兴为你解答。在订单详情页面中，你可以找到类似“Help with the sale”或“Need help”的选项，点击进入后选择对应的订单问题，向平台说明该订单已被系统判定异常且你已实际发货。平台核实后会处理后续的款项补偿。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 14:21:10","用户":"幸运🍀","群":"","用户问询":"订单提示7月15之前发货？请问7月15当天发货可以吗？","AI响应":"你好！很高兴为你解答。建议在截止日期前完成发货。目前平台要求自发货订单须在48个工作小时内送达物流商仓库，并在72个工作小时内完成扫描上网。为避免逾期影响信誉，请尽早处理。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"}]},{"一级大类":"财税合规","二级子类":"资金管理","Past 7 Days":155,"Previous 2026-07-06 to 2026-07-12":154,"Change":1,"WoW":0.006493506493506494,"Past 7 Share":0.022499637102627378,"高频问题":"提现/回款/资金结算","__details":[{"时间":"2026-07-16 09:23:41","用户":"🌈","群":"","用户问询":"这是不是提现回款了的意思？","AI响应":"是的，图片中红框显示的“Sale of Dólar Estadounidense”以及对应的负数金额（-US$1,071.91），代表平台已经将这笔美元资金从你的美客多账户中扣除并执行了转账操作。\n\n这说明提现流程已经启动，资金正在汇往你的收款账户。你可以留意收款服务商（如派安盈等）的到账通知。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-15 16:21:15","用户":"秋天","群":"","用户问询":"这个的回款和提现有门槛吗？","AI响应":"单站点可结算金额累计满 500 美元时，系统将按周自动触发回款。若不满该额度，资金会保留在账户直至达标。具体到账时间取决于您的收款服务商。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-16 12:21:17","用户":"王有毅","群":"","用户问询":"经理您好！现在有一个疑问，就是我并没有设置好包括收款账户，包括物流信息等等一些最基本的设置，但是现在我的产品链接已经上线了，那这种情况下我去哪里补充我的基本信息呢？ 有没有操作指引？","AI响应":"你好！很高兴为你解答。\n\n产品上线后，请务必尽快完善以下基础设置：\n\n1. 绑定收款方式\n需前往后台 Settings > Selling preferences > Collection method 操作绑定。\n注意：该设置入口仅在 KYC 审核通过后才会展示，且绑定过程中需要完成法人人脸识别。\n\n2. 设置发货地址及物流\n请前往卖家后台 Selling Preferences -> Dispatch Methods 检查物流设置。\n发货地址务必填写完整准确，并确认在菜鸟揽收范围内。\n\n3. 墨西哥RFC税号相关\n如果你在墨西哥站点销售，关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\n\n建议你优先完成收款绑定和物流地址设置，确保订单产生后能正常发货和结算。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-17 12:48:48","用户":"D~","群":"","用户问询":"就是不管前端怎么算，我设置的两美金我回款的只有两美金吧，这个意思？","AI响应":"你好！很高兴为你解答。\n\n是的，就是这个意思。\n\n无论前端买家支付了多少钱（包含多少运费和税费），平台在扣除掉它该收的佣金和国际运费后，结算给你的金额就是你设置的这 2 美金。\n\n这 2 美金就是你的“税前收入”，你需要用它来支付你的货款和国内运费，剩下的才是你的纯利润。\n\n需要注意的是，如果你的包裹实际称重或体积比你上传产品时填写的要大，导致国际运费增加，最终到账金额可能会因为运费校准而产生微小的偏差。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-17 10:06:20","用户":"七","群":"","用户问询":"你好，我现在是已经申请了美客多的店铺了，但我想问财务回款的话是怎么回款呢","AI响应":"你好！美客多支持通过第三方支付平台（如Payoneer、Pingpong、WorldFirst）或本地银行账户收款。当账户单个站点净余额达到500美金时，系统每周会自动结算并打款。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-16 21:03:05","用户":"爱悠雅服饰","群":"","用户问询":"全托管卖家绑定的可以收美金的国际银行账户。怎么样可以把美元变为人民币提现呢？","AI响应":"你好！很高兴为你解答。\n\n通常情况下，卖家会使用第三方跨境收款工具（如 Payoneer、PingPong、LianLian 等）来接收美客多的结算款项。\n\n当你将美客多后台的结算款项提取到这些第三方收款平台后，你可以在这些平台的后台操作“提现”。在提现时，你可以选择将美元按实时汇率兑换成人民币，并提取到你国内绑定的个人或企业银行卡中。\n\n平台提现币种通常与卖家选择的收款账户币种一致，或支持按当前汇率进行兑换。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-19 00:45:04","用户":".","群":"","用户问询":"如何达到提现要求 是每个站点达到500美金才可以提现吗","AI响应":"是的，此提现门槛针对单站点计算。单个站点的可结算收入累计达到 500 美元后，系统才会每周自动触发打款至您绑定的收款账户。若不满该额度，资金会保留在账户直至达标。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-17 01:08:22","用户":"A🚗","群":"","用户问询":"注销店铺之后 不管账户满足不满足500美金都可以提现么","AI响应":"是的，注销店铺后，剩余款项的提取不受500美金自动回款门槛的限制。\n\n如您需要注销美客多店铺账户并提取剩余款项，请登录卖家后台，进入\"帮助中心\"页面联系客服。注销申请通过审核后，客服将帮助发起最终结算对账，应结算款项将在店铺注销完成后7个工作日内，转至您站点的绑定回款账户。\n\n需要注意的是，注销操作以站点为单位独立进行，如您运营多个国际市场站点 (墨西哥/巴西/智利等），需分别提交各站点注销申请。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-14 11:03:05","用户":"十三","群":"","用户问询":"你好，我的订单已签收。但是已经一个多月没回款，是什么情况？","AI响应":"你好！很高兴为你解答。\n\n如果订单已妥投且超过一个月未回款，通常有以下几种可能：\n\n1. 结算门槛限制：美客多卖家账户的结算门槛为单个站点净余额达到500美金。如果您的账户余额不足500美金，系统不会自动触发打款。\n2. 结算周期：正常情况下，订单妥投后7个工作日会进行结算。\n3. 店铺状态异常：如果店铺被封或处于审核状态，回款会受到影响。具体的资金处理需要根据封店原因和平台政策来确定。\n4. 银行信息问题：请检查后台绑定的收款账户（如Payoneer等）是否状态正常。\n\n如果您的余额已超过500美金且店铺状态正常，建议您联系招商经理详细了解您的具体情况。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-13 11:47:34","用户":"lily","群":"","用户问询":"有订单之后什么时候会放款，资金提现在哪里能看到，请发我链接","AI响应":"你好！很高兴为你解答。\n\n账户中单个站点的可结算金额达到 500 美元可每周提现。具体的打款时间取决于第三方收款服务商的处理周期。\n\n你可以在卖家后台的 **Payments** 模块中查询账单和资金详情。\n\n卖家后台链接：https://global-selling.mercadolibre.com/","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-17 01:06:51","用户":"A🚗","群":"","用户问询":"店铺释放资金不足500美。关闭店铺可以提现么","AI响应":"如您需要注销美客多店铺账户并提取剩余款项，请登录卖家后台，进入\"帮助中心\"页面联系客服。\n\n注销申请通过审核后，客服将帮助发起最终结算对账，应结算款项将在店铺注销完成后7个工作日内，转至您站点的绑定回款账户。\n\n需要注意的是，注销操作以站点为单位独立进行，如您运营多个国际市场站点 (墨西哥/巴西/智利等），需分别提交各站点注销申请。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-16 15:39:36","用户":"XIAOMEI","群":"","用户问询":"那么如果是买家全额回款的就没有收取任何费用吗？","AI响应":"如果是买家全额退款，平台通常会退回该订单的佣金。但已经产生的物流费（如尾程运费）、广告费以及仓储费等服务性费用，平台通常是不予退还的。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-15 16:23:17","用户":"秋天","群":"","用户问询":"他是每周都回款吗？还是说嗯，一个月回几次？","AI响应":"美客多卖家账户的回款周期为一周。当您的账户单个站点净余额达到500美金时，系统会自动结算并触发回款。如果不满500美金，资金会保留在账户中，直到金额达标后再进行结算。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-15 15:02:55","用户":"🌈","群":"","用户问询":"可提现金额会在这周转到我的收款账户，对吗","AI响应":"是的。根据平台规则，单站点可结算金额累计满 500 美元时，系统将按周自动触发回款。\n\n你目前的可提现余额为 1,102.65 美元，已超过门槛，系统会在本周结算周期内自动发起打款。具体到账时间取决于你的第三方收款服务商。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-15 12:39:35","用户":"彬","群":"","用户问询":"你好，想问下如何体现 你好，想问下如何提现","AI响应":"你好！很高兴为你解答。账户中单个站点的可结算金额达到 500 美元可每周提现。系统会自动触发打款至你绑定的收款账户。\n\n需前往后台 Settings > Selling preferences > Collection method 绑定收款方式，该入口在 KYC 通过后展示。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-13 13:57:46","用户":"-Tatsu 🐶","群":"","用户问询":"自动打款对吗 不用自己按提现 全托呢","AI响应":"是的，半托管模式是系统自动触发打款，不需要手动操作。全托管模式同样也是自动回款，单站点金额满500美元即可自动结算。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-13 12:49:29","用户":"牛奶","群":"","用户问询":"为什么我的同一款产品 回款金额不一样呢","AI响应":"从您提供的图片对比来看，虽然两笔订单的销售价格和税费一致，但第二张图片中多出了一项 Mercado Libre Final Value Fee（销售佣金）2.17 美元，导致最终回款金额从 7.34 美元降至 5.17 美元。建议核查该订单是否触发了不同的类目佣金比例或参与了特定促销活动。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-13 11:48:34","用户":"lily","群":"","用户问询":"如果没有达到500美元，是不是没法提现？","AI响应":"是的。如果账户单个站点的余额未达到500美金，系统不会自动结算或扣款，资金会一直保留在平台账户中，直到满足金额要求后才会进行每周一次的自动回款。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-19 22:03:19","用户":"爱老虎呦🐯","群":"","用户问询":"提现是如何操作的","AI响应":"卖家可以在卖家中心申请提现。当单个站点的可结算金额达到 500 美元时，每周可提现一次，款项将转入您绑定的收款账户。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-19 18:26:01","用户":"林世远Ada","群":"","用户问询":"哪种主体可以回款美金","AI响应":"你好！无论使用大陆主体还是香港主体入驻，只要绑定能接收美金的第三方收款账户（如Payoneer、Pingpong、WorldFirst）或本地银行账户，均可实现美金回款。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-17 17:00:27","用户":"之后...","群":"","用户问询":"这个回款从哪里看","AI响应":"你好！很高兴为你解答。美客多回款周期为一周，当账户单个站点净余额达到500美金时会自动结算。您可以登录卖家后台，在Settings-Selling preferences中查看和绑定收款账号。\n\n网页参考资料：\nhttps://doc.weixin.qq.com/pdf/d3_AXkATwaVAPACN1jSo7QEPTua0X1Oj?scode=AI8A3wfvAAoct50548ARIAagYiAMI","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-16 17:52:31","用户":"Aurora","群":"","用户问询":"全托管模式提现分站点吗","AI响应":"你好！很高兴为你解答。\n\n全托管模式的提现也是分站点进行的。\n\n由于全托管模式涉及不同国家的市场，每个站点的货币结算、回款周期以及当地的税务政策（如墨西哥的RFC税号政策）均存在差异，因此各站点的资金会分别进行结算和提现。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-16 17:52:14","用户":"Aurora","群":"","用户问询":"美客多半托管模式提现也分站点吗","AI响应":"你好！很高兴为你解答。\n\n美客多半托管模式的提现是分站点进行的。\n\n半托管模式目前覆盖了墨西哥、巴西、智利、阿根廷、哥伦比亚等站点。由于每个站点的货币结算、回款周期以及当地的税务政策（如墨西哥的RFC税号政策）各不相同，因此资金会根据不同站点的订单分别结算到对应的账户余额中。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-16 17:15:46","用户":"月儿公主假睫毛厂家-杨","群":"","用户问询":"你好。全托管模式，我们报价是按照人民币报价吧？还是按照美元报价？平台给我们结算的话，是按照人民币结算，还是美元结算？","AI响应":"全托管模式下，您需要按照美元进行供货价提报。平台结算时同样支持美金结算，具体以平台规则为准。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-16 15:38:27","用户":"XIAOMEI","群":"","用户问询":"我还有一个问题想问问你，就是平台上买家买了东西想退款，后来跟买家协商退款了百分之三十，那么平台结算的时候会收我那些费用？","AI响应":"即使是部分退款，平台仍会扣除相关费用，包括：平台佣金、广告费、可能产生的仓储费等服务费用。这些是平台提供服务产生的费用，不因退款方式改变而免除。具体扣费明细您可以在后台账单中查看详情。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-15 15:04:36","用户":"🌈","群":"","用户问询":"我怎么查看我以前有没有提现过","AI响应":"你好！很高兴为你解答。\n\n你可以通过以下路径查看历史提现记录：\n1. 登录卖家中心，进入财务报表（Financial reports）页面。\n2. 查看“资金流动记录”或点击“查看所有”，筛选历史交易明细。\n3. 在记录中查找提现或打款相关的条目，即可确认以前的提现记录。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-15 14:45:09","用户":"🌈","群":"","用户问询":"怎么查看我回款了多少","AI响应":"你好！很高兴为你解答。\n\n你可以通过以下路径查看回款情况：\n1. 登录卖家后台，进入财务报表（Financial reports）页面。\n2. 在该页面可以查看并导出当期结算金额及历史交易明细。\n3. 也可以在交易记录中查询收款账户的具体到账明细。\n\n回款金额通常是销售额减去退款、广告费、佣金、物流费及仓储费后的净额。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-14 12:59:13","用户":"Go.","群":"","用户问询":"美客多，回款，怎么看的","AI响应":"美客多支持第三方支付平台（如Payoneer、Pingpong、WorldFirst）和本地银行账户收款。\n\n回款周期为一周，当账户单个站点净余额达到500美金时会自动结算。若余额不足500美金，则会留在账户中等待满足金额后再回款。\n\n您可以在卖家后台的结算或财务相关板块查看具体的账单和回款状态。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-13 11:54:07","用户":"⸝⸝'ᜊ'⸝⸝","群":"","用户问询":"请问下平台提现规则是什么样子的","AI响应":"你好！很高兴为你解答。\n\n关于平台提现操作，相关规定如下：\n\n1. 提现门槛：账户中单个站点的可结算金额达到 500 美元可每周提现。\n2. 结算逻辑：此提现门槛针对单站点计算，即单个站点的可结算收入累计达到 500 美元后，系统才会自动触发打款至您绑定的收款账户。\n3. 提现操作：卖家可以在卖家中心申请提现，平台会处理提现请求，并将款项转入卖家绑定的收款账户。\n4. 提现币种：平台提现币种通常与卖家选择的收款账户币种一致，或支持按当前汇率进行兑换。\n5. 手续费：平台提现操作可能收取少量手续费，具体费用请参考平台相关规定。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-13 13:56:58","用户":"-Tatsu 🐶","群":"","用户问询":"半托怎么提现","AI响应":"你好！很高兴为你解答。半托管模式提现需账户中单个站点的可结算金额达到500美元，系统会每周自动触发打款至您绑定的收款账户。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-19 00:48:20","用户":".","群":"","用户问询":"两个店铺可以绑定同一个pingpong 账号吗 两个店铺可以绑定同一个收款账户吗","AI响应":"不可以。为了避免关联风险，建议一个美客多店铺绑定一个独立的收款账号。如果需要绑定同一个支付服务商，请确保使用该服务商下的不同子账号进行绑定。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-16 11:50:39","用户":"陈伟","群":"","用户问询":"你好，我想问下平台收的0.16美金的汇率保证金这个计费逻辑是什么？能否换本地收款账号取消掉？","AI响应":"你好！很高兴为你解答。\n\n关于你提到的0.16美金汇率保证金，这是平台为了帮助卖家在汇率波动时保持价格竞争力而上线的FX Tool汇率保护工具相关费用。\n\n关于计费逻辑和取消方式：\n1. 计费逻辑：该工具主要应用于海外仓站点，旨在对冲拉美当地货币与美金之间的汇率波动风险。\n2. 更改收款账号：美客多目前支持第三方收款账户和本地银行账户收款。如果你设置墨西哥本地银行（比索）收款账户，需要注意该设置仅限在周四11:00am至周六11:00am期间操作，且一旦绑定比索收款后，就无法更换回其他收款方式。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-16 10:15:14","用户":"窦红建","群":"","用户问询":"绑定非大陆/香港的美金账号。这个可以是pingpong或者连连之类的第三方收款账号吗","AI响应":"你好！很高兴为你解答。\n\n可以的。你提到的 PingPong、万里汇（WorldFirst）或派安盈（Payoneer）等第三方收款机构提供的美金账号都是可以使用的。\n\n不过需要注意以下细节：\n1. 账号类型：必须是非美国的美金账号。例如，你可以使用连连或 PingPong 提供的香港、新加坡或英国等地的美金账号。\n2. 绑定流程：如果你要做海外仓，建议先绑定美金账号，再绑定墨西哥本土银行账号。\n3. 连连支付：目前连连（Lianlian）在美客多后台没有实现钱包直连，你需要手动绑定连连提供的非美国美金账号。\n4. 触发审核：更改收款方式时可能会触发二次 KYC 审核，请留意后台通知。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-15 10:39:37","用户":"🏀HQQ_Clara","群":"","用户问询":"你好，我设置 net proceeds为 6.22美金的东西，实际到手为什么只有2.62美金","AI响应":"你好！从你提供的图片来看，这属于自发货（CBT）模式下的订单。\n\n在自发货模式下，你的实际收益计算逻辑如下：\n实际收益 = Listing price（9.14美金）- Selling fee（1.42美金）- Shipping cost（国际运费）。\n\n根据第一张图片显示，该订单的销售佣金是1.42美金，而你最终到手是2.62美金。这意味着中间扣除了约5.1美金的费用。这部分差额主要是因为系统扣除了从中国发往拉美的国际运费。\n\n你在后台设置的 Net proceeds（6.22美金）是平台用来计算前端售价的基准，但实际结算时，系统会根据包裹的实际重量和体积计算最终运费，并从总价中扣除佣金和这笔运费。如果产品的实际重量或体积较大，导致国际运费较高，就会出现到手金额远低于预期的情况。\n\n建议你检查一下该产品的重量和尺寸设置是否准确，或者使用官方利润计算器重新核算成本：https://global-selling.mercadolibre.com/listings/cost-calculator","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-14 13:23:32","用户":"🌺Y.u","群":"","用户问询":"你好。我店铺都关闭了，也申请体现了，一直没有到账是怎么回事，我绑定的pingpang","AI响应":"你好！具体的打款时间取决于第三方收款服务商的处理周期。建议你联系PingPong客服核实资金的处理进度。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-14 09:37:40","用户":"壹号国际-Jason","群":"","用户问询":"店铺里面没有资金 是新站点 被买家投诉 想要退款给他 但是没资金退不了这种情况一般要怎么处理","AI响应":"目前退款需要您的Mercado Pago账户有足够余额才能操作。建议您尽快充值账户余额，或者先和客户沟通说明情况，承诺会尽快处理退款，避免客户投诉影响店铺信誉。暂时没有其他提前退款的方式。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-18 16:54:08","用户":"KIM","群":"","用户问询":"我注册pingpong收款账户关联店铺，是否个人pingpong账户即可？","AI响应":"目前美客多平台仅支持绑定公司账户，个人账户无法绑定。请确保使用公司名义开立的第三方收款账户进行关联。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-17 09:43:08","用户":"迷迷 苏","群":"","用户问询":"商品参与的活动价格是12.45，为什么参加成功后显示是11.9美金","AI响应":"你好！很高兴为你解答。\n\n根据你提供的截图，出现这种情况通常是因为 Rebate（平台补贴）活动的影响。\n\n1. 价格逻辑：你在截图中看到的 USD 12.45 是“你将收到”的金额，也就是你的供货价。而商品促销价显示为 USD 43。\n\n2. 补贴机制：如果你参加了 Rebate 活动，平台为了让产品更有竞争力，可能会在你的折扣基础上进一步降价。如果最终显示为 11.9 美金，这通常是平台根据市场竞争情况自动调整后的结果。\n\n3. 收入保障：虽然前端显示的活动价格变低了，但只要你后台显示的“你将收到”金额依然是 12.45 美金，那么你的实际结算收入就不会受到影响，差额部分由平台进行补贴。\n\n你可以核对一下该活动是否带有 Rebate 标签。如果“你将收到”的金额没有变动，就不需要担心利润受损。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-15 15:53:57","用户":"Hellen","群":"","用户问询":"娜娜，你好！我们刚入驻美客多。请问后台仓库和收款账户，怎么设置呢","AI响应":"你好！很高兴为你解答。绑定收款账户需前往后台Settings > Selling preferences > Collection method操作，该入口在KYC通过后展示，过程需法人配合人脸识别。关于仓库设置，请明确你是指海外仓发货计划还是自发货地址设置。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-13 16:24:54","用户":"lily","群":"","用户问询":"LISTING 销售文件上 的美元净收入是只写产品成本价吗？不用加上佣金和运费","AI响应":"你好！很高兴为你解答。\n\n是的，美元净收入（Net Proceeds）不需要加上佣金和运费。\n\n你只需要填写：产品采购成本 + 你的预期利润。\n\n平台系统会自动在这个金额基础上，叠加销售佣金、国际运费以及可能产生的相关税费，从而生成买家在前台看到的最终售价。这个净收入金额就是扣除平台费用后，最终结算给你的金额。\n\n网页参考资料：\n定价操作指南：https://doc.weixin.qq.com/pdf/d3_ARIAagYiAMICNXFSDGYOWRO6SJK0z?scode=AI8A3wfvAAo8y04nbHAXUA7AYZANA","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-19 18:18:12","用户":"👊💯文","群":"","用户问询":"这个货最终到哪里了？会再次出售吗？商家可以得到相应货款吗","AI响应":"根据图片显示，该订单状态为“未送达”，且在阿根廷清关后配送出现问题。\n\n1. 货物去向：由于货物已进入国际段物流并到达目的国，无法中途退回国内。\n2. 是否再次出售：该订单已被取消，货物通常无法再次上架销售。\n3. 货款结算：图片右侧显示“总净收益 USD 0,00”，说明该笔交易已取消扣款，商家无法获得货款。\n\n如果包裹在到达物流商仓库后发生丢件或非卖家原因导致的损失，您可以准备好订单号、运单号及物流截图，联系美客多官方客服申请赔付。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-19 16:58:43","用户":"FGW","群":"","用户问询":"咱们平台发布产品的时候净收款额，是产品的售价吗？","AI响应":"不是的。净收益（Net Proceeds）并不是产品的最终售价。\n\n净收益是指在销售后扣除所有平台适用费用（如销售佣金、运费、每单位额外费用等）后，您最终获得的金额。\n\n美客多平台会根据您设定的这个“净收益”金额，自动在前端加上平台佣金和运费，计算出最终展示给消费者的上市价格。因此，平台收取的费用不会再从这个金额中扣除，您填写的净收益金额会全额结算给您。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-19 16:58:29","用户":"FGW","群":"","用户问询":"陈昱平台发布产品的时候净收款额，是产品的售价吗？","AI响应":"不是的。净收益（Net Proceeds）并不是产品的最终售价。\n\n净收益是指在销售后扣除所有平台适用费用（如销售佣金、运费、每单位额外费用等）后，您最终获得的金额。\n\n美客多平台会根据您设定的这个“净收益”金额，自动在前端加上平台佣金和运费，计算出最终展示给消费者的上市价格。因此，平台收取的费用不会再从这个金额中扣除，设定的净收益会全额结算给您。\n\n简单来说，您在后台填写的金额是您的“采购成本+利润”，而买家在前台看到的售价会比这个数字高。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-17 23:25:34","用户":"骑着毛驴去拉萨","群":"","用户问询":"我日预算才1美金，怎么会投资显示 2.04 美元","AI响应":"你好！实际花费可能会在预算基础上略有波动，但平台会根据你设置的每日最高预算进行自动调整。此外，后台显示的投资金额可能包含未完成校验的费用或跨月结算差异，建议以最终账单为准。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-16 18:16:56","用户":"丶啊牛","群":"","用户问询":"收款方式也要绑定是吗？多少钱可以提取？使用pago吗？","AI响应":"是的，需在KYC通过后前往后台Settings > Selling preferences > Collection method绑定。用户签收后7天结算到Mercado Pago，单站点满500美金平台每周会自动打款到你绑定的收款账户。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-16 14:30:25","用户":"Butter","群":"","用户问询":"这是我5月份的 为什么差距这么大的 我并没有涨预算","AI响应":"你好！从你提供的 5 月份数据来看，广告后台显示的投资额为 2878 美元，而账单明细中筛选出的扣款总和为 1978.3 美元。\n\n这种“账单金额反而比后台少”的情况，更加印证了费用跨月结算的逻辑：\n\n1. 结算延迟：你在 5 月份账单里看到的这 1978.3 美元，实际上很大一部分是平台在结算你 4 月份产生的广告消耗。\n\n2. 5月消耗顺延：你在 5 月份实际跑出来的 2878 美元广告费，大部分并没有在 5 月份的账单里立即扣除，而是会顺延到 6 月份的账单中进行校验和结算。\n\n这就是为什么你之前看到的 6 月份账单金额会显得非常高，因为 6 月份的账单里集中清算了 5 月份那 2878 美元的大部分消耗。\n\n所以，单看某一个月的后台数据和账单对不上是正常的。建议你将 5 月和 6 月两个月的广告后台总投资额相加，再对比 5 月和 6 月两个月的账单实际扣款总额，这样整体看下来数据就会吻合了。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-16 14:20:59","用户":"壹号国际-Jason","群":"","用户问询":"如果我选择退全款 那已经扣除的物流费用还要从我的余额里面扣是吗","AI响应":"是的。即使您选择退全款，已经产生的物流运输费用仍需由您承担，并会从您的账户余额中扣除。具体扣费明细您可以参考截图中的账单详情。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-16 10:46:21","用户":"🐑","群":"","用户问询":"这两个定价是什么意思 上面是售价 下面是我提供的供货价吗","AI响应":"你好！根据你提供的截图，这是半托管模式下的定价界面。\n\n关于这两个定价框的含义如下：\n\n1. 批量编辑供货价（上方框）：这是一个快捷功能，方便你一次性为下方所有变体设置统一的价格。\n\n2. 净收入（下方框）：这就是你提供的供货价。在半托管模式下，定价采用收益价格模式。你在后台设置的这个供货价，就是你想要获得的实际收益。当商品卖出并妥投后，平台结算给你的金额就是你设置的这个价格。\n\n关于供货价的构成建议：\n你设置的供货价应包含：单件货物成本 + 你的目标利润 + 单件国内发货到东莞仓的物流成本。\n\n平台会在你设置的这个供货价基础上，自动加上佣金和国际运费，从而形成最终在前端展示给消费者的销售价。只要你提报的供货价没有变动，无论前端售价如何波动，你的结算收益依然是以你设置的这个供货价为准。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-15 12:41:38","用户":"彬","群":"","用户问询":"一定要绑定第三方收款账户吗，可以只提供公司银行账户吗","AI响应":"可以的。美客多支持第三方收款账户和本地银行账户收款。如果您选择 Bank Account 收款，请确保该账户能够接收美金。平台回款周期为每周一次，需单个站点净余额达到 500 美金时会自动结算。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-15 09:48:06","用户":"Later","群":"","用户问询":"如果已经有本土收款绑定的入口，还需要美元账户绑定吗","AI响应":"你好！很高兴为你解答。\n\n首次绑定墨西哥本土收款账户时，务必先在国际收款绑定入口完成美元账户绑定，然后再刷新后台通过弹出的本土收款绑定入口完成操作。\n\n直接在国际收款入口绑定墨西哥本土收款账户属于错误或无效操作。因此，即使你已经看到了本土收款绑定的入口，也建议先确保美元账户已正确绑定，以保证后续流程的正常进行。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"}]},{"一级大类":"物流仓储","二级子类":"物流费用","Past 7 Days":151,"Previous 2026-07-06 to 2026-07-12":149,"Change":2,"WoW":0.013422818791946308,"Past 7 Share":0.02191900130643054,"高频问题":"物流发货/面单/包装","__details":[{"时间":"2026-07-19 14:50:56","用户":"灯火星星","群":"","用户问询":"您刚才说“平台采用收益价格模式，你只需输入目标净收益，系统会自动叠加运费和佣金生成售价。”售价超过299后卖家承担运费，卖家怎么确定运费是多少，以包含在售价里呢？这个售价是否也包含了出口关税和进口关税？","AI响应":"你好！很高兴为你解答。在收益价格模式下，系统会根据你填写的商品重量自动计算并叠加运费生成售价，无需你手动计算。该售价已包含佣金、运费及可能产生的相关税费。最终到账金额即为你设定的净收益。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-18 08:45:57","用户":"迷迷 苏","群":"","用户问询":"您好，对于尺码问题我们深表歉意。 由于平台没有直接换货选项，建议您发起退货流程以获得退款并重新购买。商品必须保持原始状态。 或者，如果您希望保留产品作为礼物，我们可以为您提供订单的 10% 部分退款作为特别补偿。 若选择退货，退货运费需要由您自行承担。 请告知我们您更喜欢哪个选项。","AI响应":"你好！很高兴为你解答。\n\n买家在之前的对话中已经明确回复“我接受这个结果”，说明他已经同意了你提出的 **10% 补偿方案**。\n\n你现在不需要再发送这段包含“退货”和“运费自理”的文字了，因为买家已经做出了选择。如果你现在再发这段话，可能会让买家感到困惑，甚至因为看到“运费自理”而反悔。\n\n**建议操作：**\n直接点击页面上的**“选择退款选项”**，选择**“部分退款”**并输入金额。\n\n**建议回复（西语）：**\nMuchas gracias por su comprensión. Hecho, ahora mismo procesaremos el reembolso parcial del 10% a través de la plataforma. ¡Que tenga un excelente día!\n（非常感谢您的理解。好的，我们现在就通过平台为您处理 10% 的部分退款。祝您生活愉快！）\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-18 08:41:22","用户":"迷迷 苏","群":"","用户问询":"非常抱歉尺码问题给您带来不便。平台规则没有直 international shipping. To provide you with the best solution, I fully agree to a full refund. You do not need to return the product. I will request the Mercado Libre team to process the full refund for you immediately. Thank you for your understanding.”\n（我已阅读你的信息，对国际运输途中造成的损坏深表歉意。为了给你提供最好的解决方案，我完全同意全额退款。你不需要退回产品。我会请求美客多团队立即为你办理全额退款。谢谢你的理解。）\n\n**后续操作建议：**\n\n1. **联系平台客服**：由于右侧显示“Mediation completed”，钱已经放款给你了，你可能无法在后台直接点击退款按钮。你需要点击 **“Messages with Mercado Libre”** 或者找客服入口，告诉他们：“I have reached an agreement with the buyer. I agree to a full refund and the buyer does not need to return the item. Please help to deduct the money from my account and refund it to the buyer to resolve this complaint.”（我已经和买家达成一致。我同意全额退款且买家无需退货。请协助从我账户扣款并退给买家，以解决这次投诉。）\n\n2. **为什么这样做**：\n- **防止纠纷升级**：买家现在情绪很激动，如果你主动提出“全额退款且不要求退货”，买家会立即平息怒火。\n- **掌握主动权**：由你主动要求平台退款，比平台强制扣款对你店铺的信誉评价要好。\n- **省心省力**：既然货不要了，直接退款是结束这单纠纷最快的方式。\n\n**总结：**\n直接发这段话是可行的。发完后记得联系平台客服执行退款操作，因为钱现在在你手里，只有客服介入才能把这笔已经结算的交易撤回并退给买家。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-19 19:31:47","用户":"D~","群":"","用户问询":"就是平台给了我10件的数量，我把这10件从国内找货代发到国外的官方仓，然后出单了就是平台负责尾程派送吧 这个意思么？","AI响应":"你好！很高兴为你解答。\n\n是的，你的理解完全正确。\n\n具体的流程就是：\n1. **头程发货**：你按照系统给的 10 件额度，在国内找货代把这 10 件货运到墨西哥官方仓。\n2. **官方入库**：货物到了仓库并上架后，你的产品链接就会显示“FULL”标识。\n3. **自动派送**：一旦有买家下单，美客多仓库的工作人员会直接从架上取货、打包，并安排快递送到买家手里。\n\n这个过程中，出单后的所有打包和发货动作你都不需要参与，非常省心。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 17:21:30","用户":"ㅤ  ㅤ","群":"","用户问询":"菜鸟上门取件后，从我仓库到菜鸟国内集货仓的国内运费，是卖家自行支付，还是已经包含在Mercado Libre跨境物流费用里面？","AI响应":"你好！这部分费用不包含在跨境物流费中。若你的地址在菜鸟免费揽收范围内，则无需支付；若不在范围内，需自行寄送至揽收仓，运费由你承担。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 17:51:14","用户":"大大大明","群":"","用户问询":"但是免运费要达到299MXN，不包运费的时候是16.8USD，免运费的时候达到了20.2USD这样不是更贵了吗？","AI响应":"你好！很高兴为你解答。\n\n虽然总价变高，但买家更看重“免运费”标签。在美客多，免运费商品拥 :"2026-07-18 19:58:09","用户":"Li","群":"","用户问询":"你好，我是自发货，请问勾选了最下面后，是要提前把货备到官方仓是吗？","AI响应":"不是的。勾选最下方的 **Drop off | Cainiao**（卖家自寄）是指当您产生订单后，需要您**自行联系国内快递**或亲自将包裹送到菜鸟指定的国内扫码仓，而不是提前备货到海外仓。\n\n这两种选项的区别在于：\n1. **Pickup（上门揽收）**：菜鸟快递员到您填写的地址上门取件。\n2. **Drop off（卖家自寄）**：您自己找顺丰、中通等快递把包裹寄到菜鸟仓库，运费由您承担。\n\n无论选哪种，都是**出单后**再发货，不需要提前备货。\n\n网页参考资料：\nhttps://global-selling.mercadolibre.com/help/cainiao-warehouses-drop-off_36979","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 23:16:07","用户":"楠","群":"","用户问询":"你好500克以内不算计抛吗，比如实际重量350，计抛1700，运费按哪个计算","AI响应":"你好！目前 500g 以下的货件仍按实际重量计费。如果你的实际重量是 350g，即便计抛重量为 1700g，目前仍会按 350g 计算运费。但请务必确保后台申报尺寸准确，避免产生附加费。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 17:15:19","用户":"骑着毛驴去拉萨","群":"","用户问询":"自发货，到达目的地了 然后派送不了 运费是卖家出吗 售价20美金","AI响应":"你好！售价20美金（约合400比索）已超过墨西哥299比索的包邮门槛，因此发货运费由卖家承担。若因买家原因导致派送失败，运费不予退还。自发货运费按货件毛重计收，直接与平台结算。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 13:48:43","用户":"ricky","群":"","用户问询":"请问系统里这个自动调整价格的最低价格和最高价格是指收益还是前台售价？","AI响应":"你好！很高兴为你解答。\n\n根据你提供的图片显示，价格调整规则选择的是 Best net proceeds，因此这里填写的最低价格和最高价格是指你的净收益，而不是前台售价。\n\n系统会根据你设定的净收益范围，自动计算并加上佣金、税费及运费，从而生成最终的前台售价。你只需要定义你愿意接受的最低净收益，工具在自动调价时不会低于这个数值，确保你的利润空间受控。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 13:11:27","用户":"爱种地的老狗","群":"","用户问询":"经理你好，我想问下，从国内发货到墨西哥，运费的计算模版哪里可以看到","AI响应":"你好！关于自发货物流的运费表，你可以在美客多卖家后台的运费查询页面查看详细的运费标准，包括不同重量区间的费用。\n\n如果你需要查看墨西哥站点的具体菜鸟运费表，可以参考以下官方链接：\n墨西哥站点：菜鸟运费查询表（https://global-selling.mercadolibre.com/help/shipping-costs-envio-cainiao-mexico_41817）\n\n另外，如果你需要计算具体订单的运费成本，推荐使用官方的利润计算器进行测算（https://global-selling.mercadolibre.com/listings/cost-calculator）。\n\n建议你在上架商品前，先通过卖家后台查询好各站点的运费：https://global-selling.mercadolibre.com/help/37369","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 20:20:14","用户":"柯培鑫","群":"","用户问询":"我是不是只需要把货发到国内的转运仓就行了吗？物流费用要不要我支付呢","AI响应":"是的，在全托管模式下，你只需要负责将货物发送到平台指定的国内集货仓（位于广东省东莞市）。\n\n关于物流费用的支付规则如下：\n\n1. **国内段运费（商家承担）**：从你的仓库发货到美客多东莞集货仓的这一段物流费用，需要由你自行承担。你可以选择任意快递或物流公司，也可以自行送货到仓。\n\n2. **国际段及尾程运费（平台承担）**：货物到达东莞仓并签收后，后续从中国发往墨西哥的国际物流、清关、以及在墨西哥当地的尾程派送费用，全部由平台承担。\n\n**总结：** 你只需要支付“国内发货至官方仓”的这一小段运费，真正大头的国际运费和海外派送费都是0成本。\n\n**全托管国内集货仓信息：**\n寄送地址：广东省东莞市沙田镇进港南路第一产业园205号库台\n联系人：叶宗虎 18025233509\n可接受货物时间：周一至周日，9:00am-18:00pm\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 16:03:47","用户":"柯培鑫","群":"","用户问询":"在哪里设置的汇率和运费模板，图片语言会不会自动翻译成当地国家语言","AI响应":"关于设置汇率、运费以及图片翻译的问题，解答如下：\n\n**1. 汇率与定价设置**\n在美客多跨境店铺后台，你通常不需要手动设置实时汇率，系统会自动根据国际汇率进行换算。\n*   **设置路径**：在上传产品或编辑 Listing 时，进入 **Price** 模块。\n*   **操作逻辑**：你可以直接输入你期望收到的**美金金额（USD）**，系统会根据当前汇率自动计算并展示给当地买家对应的墨西哥比索或巴西雷亚尔。\n*   **差异化调整**：如果你想针对不同国家设置不同的利润率，可以在 **Global Selling** 页面针对特定站点调整价格百分比（例如：墨西哥站加价 10% 以覆盖 RFC 税费）。\n\n**2. 运费模板设置**\n跨境卖家的运费主要由系统根据产品的重量和体积自动计算。\n*   **设置路径**：在 Listing 的 **Shipping** 或 **Technical Specs** 部分，准确填写产品的**包装后重量和尺寸**。\n*   **运费承担**：你可以选择由买家支付运费，或者选择“免运费（Free Shipping）”由卖家承担。系统会根据你填写的尺寸，在后台显示该产品在不同站点的预估运费成本。\n\n**3. 图片语言会自动翻译吗？**\n**不会。**\n*   **系统局限性**：美客多的自动翻译系统只能处理**文本内容**（如标题、描述、属性表）。\n*   **图片文字**：如果你的图片中带有中文或英文描述（例如图片上写着“纯棉材质”或“Waterproof”），系统是**无法自动翻译**这些像素文字的。\n*   **合规要求**：根据平台规则，店铺首页展现的所有文字（含图片中的文字）必须使用本地语言（西班牙语或葡萄牙语）。\n\n**建议操作：**\n*   **图片去字**：为了通用性，建议主图和副图尽量使用简洁的视觉表达，减少文字堆砌。\n*   **手动汉化/西化**：如果必须在图片中加入文字说明（如尺码表或功能标注），建议针对墨西哥站制作西班牙语图片，针对巴西站制作葡萄牙语图片。如果想省事，使用**通用的英文**在某些类目也是被允许的，但体验不如本地语言好。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 11:40:26","用户":"啊楼🍉","群":"","用户问询":"自发货是不是500G以下按重量？售价运费不足的会从我的账户扣除对吧","AI响应":"你好！美客多各站点的自发货运费均按货件毛重计收。\n\n关于运费扣除规则如下：\n1. 平台结算确实是从您的总账户扣除的。\n2. 售价低于包邮门槛的商品运费由买家承担，卖家只需为售价高于包邮门槛的商品支付运费。\n3. 如果买家支付的运费不足以覆盖实际产生的运费，差额部分会从您的账户中扣除。\n\n您可以在卖家后台查看详细的运费账单明细。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-19 14:54:19","用户":"灯火星星","群":"","用户问询":"我还是没太懂，卖家承担运费的情况下，会不会牺牲净收益？","AI响应":"你好！很高兴为你解答。不会牺牲净收益。在收益价格模式下，系统会自动将运费和佣金加在你的净收益之上生成最终售价。即使运费发生变动，系统也会调整售价来保护你设定的净收益不变。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 17:49:06","用户":"Felicity 103%","群":"","用户问询":"那如果被海关扣留的包裹会退回发货地吗 退回会产生费用吗","AI响应":"你好！很高兴为你解答。被海关扣留的包裹处理方式取决于当地海关政策。若包裹被退回，通常会退回至您后台填写的退货地址，且会产生退回运费。若无法退回或选择弃置，则可能产生弃置费。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 16:40:17","用户":"大山","群":"","用户问询":"产生退货的话，运费、佣金和商品成本，都是卖家负责吗","AI响应":"退货产生的发货运费和广告费通常不退，佣金会退还。若商品损坏选择弃置会产生弃置费。商品成本由卖家承担，退回可能产生退回运费。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 12:00:49","用户":"纯属巧合","群":"","用户问询":"你好， 现在墨西哥半托管的尾程费用是按照哪个算的？","AI响应":"你好！很高兴为你解答。\n\n半托管模式下，商家的定价逻辑和运费承担方式与常规模式不同。\n\n在半托管模式下，商家不需要自己支付尾程费用，也不需要设置包邮或不包邮。\n\n半托管采用的是收益价格模式（Net Proceeds）：\n1. 商家定价：你只需要设置你想要获得的收益（即商家供货价）。这个价格建议包含：单件货物成本 + 你的目标利润 + 单件国内发货到东莞仓的物流成本（需转化成美元填写）。\n2. 平台处理：剩余的官方收费部分，包括平台佣金和尾程运费，平台会进行前端售价藏价。也就是说，平台会根据算法统一计算这些费用并展示给消费者，不需要商家手动计算尾程运费。\n\n简单来说，你只需要考虑你想拿回多少钱，剩下的运费和佣金由平台在前端价格中自动处理。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 10:48:03","用户":"孫明山","群":"","用户问询":"退回的包裹只是收取运费，还会收取中国海关关税嘛？","AI响应":"你好！很高兴为你解答。\n\n自发货模式下，卖家不需要考虑关税。目前自发货卖家不涉及墨西哥36%的增值税代扣，关税方面暂时没有额外影响。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-19 21:37:34","用户":"蓝色星空","群":"","用户问询":"请问自发货店铺产生退货时，进口费用谁承担？","AI响应":"你好！很高兴为你解答。自发货订单产生退货时，进口费用通常由卖家承担。建议你在后台设置好退货地址，并与买家协商处理。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-19 18:00:23","用户":"A～猴子","群":"","用户问询":"同意的净收益 为什么别人的售价比我低 同样","AI响应":"你好！根据图片显示，虽然你们的净收益（Net Proceeds）几乎相同，但对方的前台售价（商品标价）明显更低。\n\n这是因为前台售价是由“净收益 + 佣金 + 运费”组成的。对方售价更低，通常是因为其物流成本更低（例如包裹更轻小、计费权重更低）或享受到了平台的佣金补贴。系统会自动在您的净收益基础上叠加这些费用，从而导致最终展示给买家的价格出现差异。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-19 14:42:20","用户":"灯火星星","群":"","用户问询":"方便解释一下这几个按钮的意思吗？","AI响应":"你好！很高兴为你解答。图片中的筛选按钮含义如下：\n1. FULL：筛选由美客多海外仓发货且满299比索免运费的商品。\n2. Internacional：筛选跨境发货（自发货）且满299比索免运费的商品。\n3. Envío local：筛选墨西哥本地发货的商品。\n4. Envío gratis：筛选所有提供免运费服务的商品。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 17:14:30","用户":"骑着毛驴去拉萨","群":"","用户问询":"到达目的地了 然后派送不了 运费是卖家出吗","AI响应":"你好！如果是因为买家原因（如地址错误、拒收）导致派送失败，商品退回海外仓的运费通常由卖家承担。如果商品标价等于或高于299 MXN，初始发货运费也是由卖家支付的。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 14:03:03","用户":"啊邝","群":"","用户问询":"商品低于15美金，是由买家付运费吗","AI响应":"你好！很高兴为你解答。\n\n关于运费承担的规则如下：\n\n1. **包邮门槛**：美客多的包邮门槛是以当地货币计算的。以墨西哥站点为例，包邮门槛是 **299 墨西哥比索（MXN）**。\n2. **运费归属**：\n   - 如果商品标价**低于 299 MXN**，买家将承担运费。\n   - 如果商品标价**等于或高于 299 MXN**，卖家需要支付运费。\n\n你提到的 15 美金，建议你换算成当地货币进行对比。如果换算后的价格低于 299 MXN，则由买家承担运费，卖家无需支付该部分的物流费用。\n\n**网页参考资料**\nhttps://global-selling.mercadolibre.com/help/18500","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 11:45:08","用户":"kun","群":"","用户问询":"我的净收益是已经扣除了佣金和物流费用是吗？","AI响应":"是的，净收益（Net Proceeds）是您在销售后扣除所有适用费用后获得的金额。\n\n在美客多自发货模式下，您在后台录入的净收益金额，是已经扣除了平台佣金和跨境物流费用后的预计到账金额。平台系统会自动在您填写的净收益基础上，叠加佣金、运费以及相关税费，最终生成买家在前台看到的销售价格。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 14:08:42","用户":"wd","群":"","用户问询":"为什么两件产品 退一件是16美金","AI响应":"你好！很高兴为你解答。\n\n从你提供的图片来看，订单总计金额为 19.11 美金。退款金额显示为 16.63 美金，这通常是因为退款金额是基于买家实际支付的商品单价计算的。\n\n即使是退货退款，平台仍会扣除已产生的服务费用，包括：\n1. **平台佣金（销售费用）**\n2. **广告费**（如有）\n3. **物流运输费**\n\n这些费用是平台提供服务产生的，不因退款而免除。具体扣费明细建议你在后台账单中查看详情。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 11:27:40","用户":"Li","群":"","用户问询":"你好，这种未送达的快递费还是要商家承担吗？？","AI响应":"你好！对于自发货订单，如果因买家未取件导致“未送达”，已经产生的国际段运费通常仍需由卖家承担。\n\n从你的账单明细看，商品价格、销售费用、物流运输和取消记录相互抵消，最终总计为 0.00。这意味着平台退回了佣金，但你付出的物流成本和货值损失确实需要自行承担。\n\n建议及时联系物流商，看包裹是否能退回或转寄，以减少损失。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 16:05:47","用户":"kaykay子琪","群":"","用户问询":"请问全托和半托管分别的运费和佣金是？","AI响应":"全托管模式：0佣金、0国际运费。\n半托管模式：收取8%佣金（享最高50%佣金折扣），国际段运费由平台负责并进行前端售价藏价，商家无需计算运费。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 11:40:01","用户":"A辰龍跨境-苗苗","群":"","用户问询":"如果我的商品重量填少了，额外运费如何算","AI响应":"你好！很高兴为你解答。\n\n运费是根据商品的实际重量（包含商品及其包装）计算的。卖家必须申报准确的重量和尺寸。\n\n关于自发货物流实际超重的运费扣费查询，您可以前往卖家后台“账单详情”，了解系统二次测重后的最终扣费。如果卖家反复出现商品重量或尺寸与申报不符的情况，可能会导致额外收费或账户被暂停。\n\n建议您正确填写产品尺寸及重量，避免仓库信息同步滞后，导致运费计算不准。您可以前往卖家后台的运费查询页面查看详细的运费标准。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 18:53:49","用户":"大大大明","群":"","用户问询":"所以我这个价格是因为没有超过79才没有包邮吗","AI响应":"你好！很高兴为你解答。\n\n是的，从图片来看，该商品的折后价格为 70.45 雷亚尔，未达到巴西站 79 雷亚尔的免运费门槛，所以前端显示需要买家支付运费。只有当单笔购买金额超过 79 雷亚尔时，买家才能享受免运费。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 18:47:13","用户":"大大大明","群":"","用户问询":"为什么在前端显示不包邮，进去确实包邮的","AI响应":"你好！很高兴为你解答。\n\n从图片看，该商品属于巴西站点。巴西站点的免运费门槛是 79 雷亚尔。\n\n你的商品标价为 133.22 雷亚尔，已超过门槛，因此系统自动判定为“免费配送”，并由你支付 9.60 美金的运费。列表页显示的“不含免运费”可能是系统缓存或显示延迟，请以详情页和实际扣费为准。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 16:04:02","用户":"波波波pewpewpew突突突","群":"","用户问询":"你好，自发货的运费价格表哪里可查看","AI响应":"你好！很高兴为你解答。自发货运费按货件毛重计收，你可以在卖家后台查看。各站点具体菜鸟运费表请参考以下链接：\n\n墨西哥：https://global-selling.mercadolibre.com/help/shipping-costs-envio-cainiao-mexico_41817\n巴西：https://global-selling.mercadolibre.com/help/shipping-fee-cainiao-costos-brasil_41814\n智利：https://global-selling.mercadolibre.com/help/shipping-fees-chile-cainiao_38716\n哥伦比亚：https://global-selling.mercadolibre.com/help/shipping-fees-colombia-cainiao_37289\n阿根廷：https://global-selling.mercadolibre.com/help/costos-envio-argentina-cainiao_42837","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 11:14:27","用户":"若初见","群":"","用户问询":"等于他拒收运费也是我出的 他什么都不损失","AI响应":"你好！很高兴为你解答。\n\n确实如你所说，在自发货模式下，如果买家拒收，卖家需要承担发货时的跨境运费，这部分费用是不会退还的。\n\n对于买家而言，如果他们选择拒收，通常可以获得全额退款，确实没有直接的资金损失。\n\n为了降低这种风险，建议你在发货前通过后台私信与买家确认收货信息，并保证商品描述准确，以减少因买家主观原因导致的拒收情况。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 10:24:51","用户":"j、","群":"","用户问询":"图片中，折扣20%为什么促销后利润还有6.87","AI响应
