233509。请务必贴好外箱标和产品标，并在系统内预约送货。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 16:52:49","用户":"ㅤ  ㅤ","群":"","用户问询":"那我想问自发货模式除了物流时效和半托管不同还有平台佣金还有流量扶持不同还有其他不同的吗","AI响应":"你好！除了你提到的差异，主要区别还包括：\n1. 仓储费：自发货无仓储费；半托管目前也暂无仓储费。\n2. 运营标识：半托管产品带Full标，享有更高流量权重；自发货没有。\n3. 配送责任：自发货需卖家送货至国内集运仓；半托管需提前备货至东莞仓。\n4. 售后处理：半托管由平台负责尾程配送及相关售后，自发货需卖家更多参与。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 16:47:36","用户":"ㅤ  ㅤ","群":"","用户问询":"你好问一下跨境店半托模式的话退换货这段的物流成本是谁在承担以及从美客多官方仓发去买家那边的物流成本","AI响应":"你好！半托管模式下，买家发起退货的费用由商家承担。从美客多官方仓发往买家的尾程运费由平台负责，平台会进行前端售价藏价，商家不需要自己支付，也不需要设置包邮。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-17 10:00:47","用户":"悠","群":"","用户问询":"半托管，我的商品售价3美金，毛重35g，目前客户承担的运费太高了，有什么办法能解决","AI响应":"如果商品标价低于299 MXN，买家将承担运费。你可以尝试提高商品售价至299 MXN以上，此时运费将由你承担，买家享受免运费，这有助于提高转化。自发货运费按货件毛重计收，你可以通过优化包装减轻重量来降低成本。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 17:16:35","用户":"月儿公主假睫毛厂家-杨","群":"","用户问询":"全托管的运费 谁承担？","AI响应":"全托管模式下，你们负责将货物配送到美客多国内广东东莞仓，并承担这段国内物流成本。国际物流和尾程配送由美客多负责。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 16:41:07","用户":"圣斗土","群":"","用户问询":"半托管发货预约什么物流","AI响应":"你好！半托管模式下，国内段物流（发货至东莞仓）需要卖家自行联系物流商并支付运费。您可以根据货量选择快递或货拉拉等方式送货，只要确保在后台完成预约并按时送达即可。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 14:54:24","用户":"圣斗土","群":"","用户问询":"半托管发货无法输入箱数","AI响应":"你好！半托管发货时，请先在后台勾选需要发货的SKU并点击“Confirm shipment”，随后在弹出的页面中即可输入箱数。若仍无法输入，建议检查浏览器兼容性或刷新页面重试。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 14:28:49","用户":"爱悠雅服饰","群":"","用户问询":"全托管的发货地址和退货地址应该怎么填？","AI响应":"你好！很高兴为你解答。\n\n在全托管模式下，发货地址和退货地址的填写要求如下：\n\n1. 发货地址：请填写你实际发货的仓库或办公地址，必须使用英文填写。请确保地址信息准确，以便平台识别。\n\n2. 退货地址：全托管模式下，完好的退货会重新上架，损坏的则变为不可售库存。关于卖家后台退货地址的具体填写，建议使用英文填写你的国内联系地址，以便在特殊情况下接收平台退回的包裹。\n\n请注意，不要使用中文填写地址。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 14:23:47","用户":"小潘","群":"","用户问询":"美客多半托管发货流程","AI响应":"美客多半托管发货流程如下：\n1. 商家在后台完成产品上架。\n2. 提前备货并配送至美客多国内广东东莞仓。\n3. 商家负责国内段物流，国际物流和尾程派送由美客多负责。\n4. 订单产生后，由美客多承运物流商统一派送至海外消费者手中。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 14:01:59","用户":"圣斗土","群":"","用户问询":"半托管备仓的货，超过预约的发货时间，可以继续发送过去吗","AI响应":"你好！确认发货后时间不能修改。但半托管店铺完成发货流程后，提前或推迟到仓，仓库是可以收货的，前提是您必须在后台完成发货动作。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 12:00:49","用户":"纯属巧合","群":"","用户问询":"你好， 现在墨西哥半托管的尾程费用是按照哪个算的？","AI响应":"你好！很高兴为你解答。\n\n半托管模式下，商家的定价逻辑和运费承担方式与常规模式不同。\n\n在半托管模式下，商家不需要自己支付尾程费用，也不需要设置包邮或不包邮。\n\n半托管采用的是收益价格模式（Net Proceeds）：\n1. 商家定价：你只需要设置你想要获得的收益（即商家供货价）。这个价格建议包含：单件货物成本 + 你的目标利润 + 单件国内发货到东莞仓的物流成本（需转化成美元填写）。\n2. 平台处理：剩余的官方收费部分，包括平台佣金和尾程运费，平台会进行前端售价藏价。也就是说，平台会根据算法统一计算这些费用并展示给消费者，不需要商家手动计算尾程运费。\n\n简单来说，你只需要考虑你想拿回多少钱，剩下的运费和佣金由平台在前端价格中自动处理。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 11:15:44","用户":"Z","群":"","用户问询":"全托店铺可以自己创建发货计划吗？","AI响应":"全托模式下，你需要去发运单列表查看是否有系统推送的备货计划。\n\n如果有，你可以填入对应数量并创建备货单，但一定要点击确认发货。如果没有推送计划，则无法自行创建。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 10:11:37","用户":"悠","群":"","用户问询":"半托巴西运费表","AI响应":"你的问题我暂时无法回答，后续我会丰富我的知识库，敬请见谅。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 10:11:17","用户":"悠","群":"","用户问询":"半托巴西购买的运费是怎么计算的","AI响应":"你的问题我暂时无法回答，后续我会丰富我的知识库，敬请见谅。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 09:57:40","用户":"悠","群":"","用户问询":"半托不包邮客户出运费是不是比商家出运费贵","AI响应":"你好！很高兴为你解答。半托管模式下，运费由平台统一计算并展示给消费者。售价低于包邮门槛时，买家需承担运费；高于门槛时，卖家承担标准运费。运费金额由平台根据货件毛重等因素核定，不存在买家支付比卖家支付更贵的说法。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 16:13:11","用户":"************金","群":"","用户问询":"我之前入住的应该是个半托管。我先把这个发货模式能切换成自发货吗？","AI响应":"你好！半托管和自发货是两种独立的物流模式，目前无法直接切换。如果你想做自发货，需要使用不同的邮箱重新注册一个自发货账户，分开店铺进行运作。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 16:05:47","用户":"kaykay子琪","群":"","用户问询":"请问全托和半托管分别的运费和佣金是？","AI响应":"全托管模式：0佣金、0国际运费。\n半托管模式：收取8%佣金（享最高50%佣金折扣），国际段运费由平台负责并进行前端售价藏价，商家无需计算运费。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 14:17:06","用户":"番茄🍅","群":"","用户问询":"托管模式的运费谁承担呀，全托和半托","AI响应":"在全托管和半托管模式下，运费承担情况如下：\n\n1. 全托管模式：\n商家实现全链路0费用。国际运费和尾程派送费均由平台承担，商家仅需承担将货物从国内发往平台指定国内集货仓（东莞仓）的物流成本。\n\n2. 半托管模式：\n商家不需要自己支付国际段和尾程运费。半托管采用收益价格模式（Net Proceeds），商家在定价时只需设置想要获得的收益（即：单件货物成本 + 目标利润 + 发往东莞仓的国内运费）。\n平台会自动在前端售价中进行藏价，将佣金和运费计算在内并展示给消费者。\n\n总结来说，这两种模式下，商家主要承担的都是国内段发往东莞集货仓的物流费用。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 12:57:19","用户":"古💋月","群":"","用户问询":"半托管物流是商家自己找还是用菜鸟物流","AI响应":"半托管模式下，国内段（商家侧到美客多东莞仓库）的物流由商家自行负责，您可以选择任意物流公司或自行送货到仓。国际物流和尾程派送则由美客多负责。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 11:16:01","用户":"ℓοгen🐑🐑🐑","群":"","用户问询":"半托管和全托管可以发一个物流吗？","AI响应":"可以，全托管和半托管的备货可以合并在一个快递中寄出，但请务必贴好各自对应的箱唛。\n\n需要注意的是，请勿将半托管/全托管的货物与普通自发货或 FTI 账号的货物混装揽件，否则仓库将无法接收。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 23:19:53","用户":"Aurora","群":"","用户问询":"半托管运费价格表","AI响应":"你好！很高兴为你解答。\n\n在半托管模式下，商家不需要参考运费价格表来计算成本。\n\n半托管采用的是收益价格模式（Net Proceeds）。这意味着：\n1. 国际段物流由平台负责，运费由平台直接在前端售价中进行藏价。\n2. 商家在定价时，只需要设置您想要获得的收益（商家供货价）。\n3. 商家供货价 = 单件货物成本 + 您的目标利润 + 单件国内发货到东莞仓的物流成本。\n\n您不需要人工计算并加入国际运费和佣金，平台系统会自动叠加这些费用并生成最终展示给消费者的前端售价。您只需将您的期望收益价格提报给平台即可。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 18:26:27","用户":"菲菲菲","群":"","用户问询":"请问全托管订单也是走的菜鸟物流发到买家手上嘛","AI响应":"你好！很高兴为你解答。\n\n全托管模式下，卖家负责将货物发送至东莞集货仓。货物入库后，后续的国际运输和尾程派送由美客多官方负责，而不是走菜鸟物流。\n\n目前只有自发货模式是使用菜鸟物流进行配送的。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 15:43:26","用户":"不退转","群":"","用户问询":"半托管没有国际运费表吗？","AI响应":"你好！很高兴为你解答。\n\n半托管模式下是没有公开的国际运费表的。\n\n这是因为半托管模式采用的是收益价格模式（NetProceeds）。在这种模式下，国际段物流由平台负责，运费由平台直接进行前端售价藏价。\n\n商家在定价时，只需要设置想要获得的收益，即：商家供货价 = 单件货物成本 + 您的目标利润 + 单件国内发货到东莞仓的物流成本。\n\n您不需要人工计算并加入国际运费和佣金，平台系统会自动叠加这些费用生成最终的前端售价。因此，商家端不需要查询具体的国际运费标准，只需关注自己的期望收益即可。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 15:39:04","用户":"不退转","群":"","用户问询":"我指的是半托管、全托管的头程、尾程运费","AI响应":"你好！很高兴为你解答。\n\n在美客多半托管和全托管模式下，运费的承担方式和计算逻辑如下：\n\n1. 半托管模式：\n- 头程运费：商家需要负责将货物发送至美客多位于国内的东莞仓，这部分的物流成本由商家自行承担。\n- 国际段及尾程运费：由平台负责。在定价时，商家采用的是收益价格模式（Net Proceeds），你只需要设置想要获得的收益（即供货价 = 单件货物成本 + 目标利润 + 国内发货到东莞仓的物流成本）。平台会自动在前端售价中进行藏价，包含国际运费、尾程运费和佣金，无需商家人工计算。\n\n2. 全托管模式：\n- 头程运费：商家仅需负责将货物发往国内指定仓库。\n- 国际段及尾程运费：全托管模式下享有“0国际运费”的政策，后续全流程的物流配送由平台负责。\n\n总结来说，这两种模式下，商家都不需要直接支付国际段和海外尾程的运费，也不需要设置包邮或不包邮，平台会通过系统自动计算并展示给消费者。\n\n网页参考资料\n关于这两种模式的深度解析，您可以参考以下视频内容：\n视频名字：美客多半托管模式全解析\n知识点：半托管与全托管模式对比及优势\n视频时刻点：05:15\n视频链接：https://mercadolibre.cn/news/info?id=215&type=live","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 15:37:35","用户":"不退转","群":"","用户问询":"半托管、全托管的运费表你有吗","AI响应":"你好！很高兴为你解答。\n\n关于半托管和全托管模式的运费计算，建议你参考以下视频资料进行详细了解。\n\n网页参考资料\n关于“运费计算方法”的详尽内容与指导，请观看视频《自发货打包发货详操与运费计算》00:47:25时间点的内容。视频链接：https://mercadolibre.cn/news/info?id=4&type=live","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 15:00:41","用户":"Charlene-Fulinda mic","群":"","用户问询":"半托管平台只管厂库到买家的物流而已 . 我们要跟运营 （广告，客服。售后）定价是吗","AI响应":"你好！很高兴为你解答。\n\n你的理解基本正确，半托管模式下，商家的自主权确实比全托管更高。具体分工如下：\n\n1. **商家负责的部分：**\n- **运营：** 你需要负责产品上架、Listing优化、店铺日常维护。\n- **广告：** 商家拥有自主推广权，如果你想通过站内广告（Product Ads）引流，需要自己操作并承担广告费。\n- **定价：** 你拥有自主定价权。定价采用收益价格模式（Net Proceeds），你只需设置你想要的收益（供货价），平台会自动加上佣金和运费生成前端售价。\n- **售后：** 售后问题由商家自己负责处理。\n- **选品与备货：** 自己选品并备货至美客多国内东莞仓。\n\n2. **平台负责的部分：**\n- **物流：** 负责从国内东莞仓到拉美消费者手中的国际段物流、清关以及末端派送。\n- **客服：** 平台会提供基础的售前售后咨询支持，但核心售后责任仍归属于商家。\n\n**总结：**\n半托管模式下，你更像是一个“甩手物流”的精细化运营卖家。你掌控价格、利润和营销节奏，平台帮你解决最头疼的跨境物流和清关问题。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 12:53:53","用户":"牛奶","群":"","用户问询":"我想了解关于 美客多半托管的发货要求 ，我是做服装类目的，我想知道 半托管模式 对洗水唛 标签尺寸 西语标签 最后装箱打包的要求","AI响应":"半托管模式下，服装类目发货要求如下：\n\n1. 标签尺寸：BAG LABEL（IC单）为10*15cm，SKU LABEL（产品条码）为7*2.2cm。\n2. 贴标要求：标签必须贴在每个销售单位的最小包装上。服装每一件必须有独立透明包装袋，SKU标签张贴在包装袋上，确保平整清晰。\n3. 西语标签/洗水唛：现有信息未明确提及洗水唛的具体西语内容要求，建议遵循墨西哥当地法律对进口纺织品的要求，标注成分、产地及洗涤说明。\n4. 装箱打包：不同SKU不能混装，需做好物理隔离。外箱需贴IC单，并在箱内多放一张IC单备用。最外层若使用编织袋需确保结实并贴好外箱标签。\n\n网页参考资料：https://doc.weixin.qq.com/pdf/d3_AeUAKQZ0AE0CNw9Z7ruq1TvaWuUBI?scode=AI8A3wfvAAoXASq866AesAUQYKAOE","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-13 11:26:16","用户":"风儿掠过波西米亚的草原","群":"","用户问询":"我想做全托管 你好 我有稳定的供应链，做TEMU平台jit模式已经4年","AI响应":"你好！很高兴为你解答。你有4年TEMU JIT模式经验和稳定供应链，非常契合美客多全托管模式。\n\n全托管模式下，你只需负责供货至东莞集货仓，平台负责运营、定价、物流及售后。该模式0佣金、0仓储费、0国际运费，妥投后7个工作日回款。\n\n入驻要求：\n1. 主体资质：中国大陆或香港公司营业执照。\n2. 业绩要求：跨境电商单店年流水需超过30万美金。\n3. 产品画像：建议售价5-50美金，重量1.5kg以下，包装体积低于0.03立方米。\n\n申请路径：\n请统一提交此表单进行申请：http://kks.ink/ss/vKx9ph/d12030。提交后请耐心等待客户经理的进一步沟通。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"}]},{"业务模块":"托管","高频问题":"上架/链接/SKU/变体/寄样","Past 7 Days":24,"Previous":15,"WoW":0.6,"代表性问询":"这个链接是全托管的吗","Past 7 Days代表性问询":"这个链接是全托管的吗","Previous代表性问询":"服装全托上架需要寄样吗","__details":[{"时间":"2026-07-19 23:00:17","用户":"🍃᭄淡若清风💞࿐","群":"","用户问询":"这个链接是全托管的吗","AI响应":"是的，该链接是全托管和半托管入驻的统一申请表单。图片显示您已提交过，请耐心等待审核反馈。","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"入驻/注册/开店流程"},{"时间":"2026-07-19 18:13:19","用户":"Aurora","群":"","用户问询":"全托管会有违规产品上架吗","AI响应":"你好！很高兴为你解答。\n\n全托管模式下，虽然平台会参与商品的审核与上架流程，但并不能完全杜绝违规产品的出现。\n\n关于违规产品，你需要注意以下几点：\n1. 卖家初审责任：卖家作为货源的提供方，是产品合规的第一责任人。在向买手提报产品前，你必须确保产品不属于平台禁售品类（如易燃易爆、医疗器械、违禁化学品等）。\n2. 动态监管：有些产品在提报初期可能通过了初步审核，但在后续的深度复核、海关清关或当地政策变化时，可能会被重新判定为违规。\n3. 侵权风险：违规不仅指禁售品，也包括品牌侵权、外观专利侵权等。如果卖家提供的产品涉及侵权，即便上架了，一旦被权利人投诉或系统扫描发现，依然会被下架并追究责任。\n4. 平台处罚：如果卖家多次提报违规产品，会影响全托管账号的信用评分，甚至导致合作终止。\n\n建议你在提报前，务必对照官方的禁售清单进行自查，确保产品符合目标市场的法律法规。\n\n网页参考资料：\n官方自查入口：https://global-selling.mercadolibre.com/help/1078\n官方违禁产品详情：https://global-selling.mercadolibre.com/knowledge-hub/16621","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-19 18:12:53","用户":"Aurora","群":"","用户问询":"全托管会有侵权产品上架吗","AI响应":"你好！很高兴为你解答。\n\n全托管模式下，平台虽然会负责商品上架和优化，但并不代表上架的商品绝对没有侵权风险。\n\n关于侵权问题，你需要了解以下几点：\n1. 卖家责任制：卖家作为货源提供方，负有核实产品是否侵权的最终责任。平台在审核时主要关注产品的市场潜力和合规性，无法对全球所有品牌专利进行实时穷尽比对。\n2. 品牌授权要求：如果你的产品涉及知名品牌、动漫形象或外观专利，必须在提报时提供合法的品牌授权书。如果没有授权，即便上架了，后续被权利人投诉或被平台系统扫描到，依然会被下架。\n3. 侵权后果：一旦确认侵权，平台会下架相关链接。如果违规情节严重，会影响你的店铺信誉，甚至导致合作终止。\n\n建议你在向买手提报产品前，务必自行核实货源是否涉及品牌侵权或专利侵权，确保经营安全。\n\n网页参考资料：\n官方自查入口：https://global-selling.mercadolibre.com/help/1078\n官方违禁产品详情：https://global-selling.mercadolibre.com/knowledge-hub/16621","一级大类":"产品管理","二级子类":"侵权合规","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-19 16:55:52","用户":"Aurora","群":"","用户问询":"3368036726-list_omnichannel-b1065221f51e (5257) 全托上链接跳这个代码是什么意思","AI响应":"你好！很高兴为你解答。\n\n这个代码通常是系统报错的内部标识符，代表你在全托管模式下上传链接时遇到了系统校验拦截。\n\n出现这种代码报错，通常有以下几种可能：\n1. 寻源ID不匹配：你上传的产品与买手发布的寻品清单中的寻源ID（Sourcing ID）没有正确关联，导致系统无法识别该链接。\n2. 属性缺失或冲突：Listing中的某些必填属性（如品牌、类目、规格等）填写不规范，或者与系统预设的参数产生了冲突。\n3. 系统网络波动：平台后台接口在处理大量数据时出现的临时性错误。\n\n建议你尝试以下操作：\n1. 检查寻源ID：确保你是通过买手提供的正确入口进行提报，并核对寻源ID是否一致。\n2. 简化信息：先尝试只填写必填项，不要添加过多的自定义描述，看是否能成功提交。\n3. 重新登录：清除浏览器缓存，重新登录全托管后台再次尝试。\n\n如果多次尝试依然跳出该代码，建议直接联系你的全托管对接买手或招商经理，并提供该完整代码截图，由后台技术人员进行排查。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-18 10:51:14","用户":"圣斗土","群":"","用户问询":"美客多半托管参加促销活动，要一个个链接去点击吗，有没有快一点的方法","AI响应":"你好！半托管模式下，您可以登录卖家后台，在“促销”（Promotions）板块进行批量操作。此外，建议您参考托管寻品清单，通过批量导出清单查看并筛选需要参加活动的商品，以提高操作效率。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-17 18:47:31","用户":"吕亚举","群":"","用户问询":"自发货和半托管可以创建目录链接吗","AI响应":"你好！自发货和半托管模式都可以创建目录链接。系统会要求您将所销售的产品与目录中的某个产品关联，并确认保证和状态等信息。完成后，您的产品将参与目录竞争。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-17 17:48:00","用户":"业务部王姝洁17674066774","群":"","用户问询":"全托已经上架出售的商品的链接可以更改图片吗","AI响应":"你好！全托管模式下，listing上传成功后，如果图片已经关联到产品，建议不要轻易删除，否则可能影响展示效果。如果需要更换图片，建议先上传新图片再删除旧的。具体操作建议咨询客户经理确认。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-17 10:41:41","用户":"惠亚东","群":"","用户问询":"有没有半托管选品，上架，定价，运营，发货的一整套学习资料，分享一下，谢谢","AI响应":"你好！很高兴为你解答。半托管模式运营流程包括：发布产品、商家发货至东莞仓、仓库接收并上架、最后进入在售状态。\n\n关于半托管模式的深度解析、优势及定价模式，你可以参考以下网页资料：\n\n网页参考资料：\n美客多半托管模式全解析：https://mercadolibre.cn/news/info?id=215&type=live\n半托管模式核心优势与政策：https://university.mercadolibre.com/courses/half-managed-model-intro","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-16 16:43:20","用户":"ayw.","群":"","用户问询":"帮我看一下这个链接的模式是全托还是半托或者FULL","AI响应":"你好！很高兴为你解答。\n\n关于你提供的链接，美客多托管店铺在前端展示时，你是没办法区分半托管还是全托管的。\n\n不过，无论是全托管还是半托管模式，产品上架后都会带有“Full”标，享受平台的流量倾斜和快速配送服务。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-16 16:36:08","用户":"好","群":"","用户问询":"你好，半托店铺sku上限，应该怎么处理","AI响应":"你好！很高兴为你解答。\n\n半托管模式下，每个店铺目前有100个listing的限制，每个listing下建议不超过5个sku。如果你的sku数量已经达到上限，可以参考以下处理方式：\n\n1. 优化现有库存：建议你定期清理动销差、库龄长的sku。你可以通过后台查看库存绩效，针对那些被标记为“积压”或“过剩”的产品，及时通过促销活动提升动销，或者申请退仓，腾出额度给更有潜力的爆款。\n\n2. 提升店铺表现：上架额度并非固定不变。如果你的店铺运营表现优秀、订单履约率高且销售业绩持续增长，系统会自动为你扩充上架额度。\n\n3. 联系买手申请：半托管模式的额度与入驻时沟通的寻品清单相关。如果你的账号表现良好且有优质的新品计划，可以主动联系对接的买手，向其申请人工扩容。\n\n建议采取“多款式、轻库存”的策略，优先上架高潜力的产品，以保证额度的利用率最大化。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-16 15:52:44","用户":"葉","群":"","用户问询":"你好，有半托管产品上架的流程吗 有教程吗","AI响应":"你好！很高兴为你解答。半托管模式的产品上架流程如下：\n\n1. 发布产品：在卖家后台创建Listing。\n2. 商家发货：将货物发送至美客多国内东莞集货仓。\n3. 仓库接收：集货仓收到货物并进行核验。\n4. 仓库上架：仓库处理完成后，产品状态会更新。\n5. 发售（Active）：产品正式变为在售状态，买家可下单。\n\n关于上架操作，你可以参考以下步骤：\n\n单品上传：\n第一步：登录卖家后台，进入“Listings”页面，点击“Add listings”。\n第二步：选择类目。建议通过关键词搜索或逐级选择，确保类目精准。\n第三步：填写标题。使用英语填写，系统会自动转化为当地语言。\n第四步：完善属性。填写品牌、型号、规格等技术参数。\n第五步：上传图片。首图建议为纯白底，尺寸在1200像素以上。\n第六步：设置价格与库存。在收益价格模式下，录入你期望的美元净收益（商家供货价），平台会自动计算前端售价。\n\n批量上传：\n第一步：在“Listings”页面选择“Add listings in bulk”。\n第二步：下载对应类目的Excel模板。\n第三步：按模板要求填写产品信息、图片链接及价格。\n第四步：上传表格并检查是否有报错提示。\n\n注意事项：\n1. 半托管不需要等待核价，直接上架备货即可。\n2. 必须先将货物送入东莞集货仓，仓库处理完成后产品才会上架变为可售状态。\n3. 建议每个店铺Listing限制在100个以内，每个Listing下建议不超过5个SKU。\n4. 你需要至少有10个SKU处于发售（Active）状态。\n\n网页参考资料：\n建议观看视频《新店启动，Listing上架必修课》00:39:59时间点的内容。视频链接：https://mercadolibre.cn/news/info?id=64&type=live","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-15 22:02:11","用户":"ㅤㅤㅤ","群":"","用户问询":"半托管的添加商品链接是需要美客多前端的链接还是哪个链接","AI响应":"在上传短视频时，添加商品链接处需要填写的是该视频中展示的商品在美客多平台的前端展示链接。\n\n这样当买家观看视频时，可以直接通过链接跳转到对应的商品详情页进行购买。请确保链接与视频内容完全匹配，以提高转化效果。","一级大类":"其他","二级子类":"系统报错","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-15 17:46:03","用户":"业务部王姝洁17674066774","群":"","用户问询":"全托模式下sku出错了怎么修改","AI响应":"你好！全托管模式下，SKU一旦创建成功并审核通过，通常无法直接修改。\n\n如果SKU信息填写错误，建议你删除该错误链接，并使用正确的SKU信息重新创建。请务必在发货前完成修改，确保实物标签与系统SKU一致，否则仓库将无法识别收货。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-15 15:36:28","用户":"番茄🍅","群":"","用户问询":"全托管需要先提供授权，还是可以直接上架","AI响应":"你好！很高兴为你解答。\n\n在全托管模式下，品牌商品需要有授权才能上架，否则会判侵权。\n\n建议在发布产品前先准备好授权资料。如果没有备案或授权，建议先不要填写品牌信息。\n\n全托管的上架流程是：你在后台提交产品信息，核价通过并且买手选品后，商品才会激活销售。如果涉及品牌但没有授权，在审核阶段就可能无法通过。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-15 10:52:06","用户":"业务部王姝洁17674066774","群":"","用户问询":"全托管模式下添加变体成功后，还需要核价吗？","AI响应":"你好！全托管模式下增加变体后是需要核价的。卖家提报变体及目标收益价后，需通过平台核价及买手选品，审核通过后方可备货上架售卖。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-15 09:42:03","用户":"业务部王姝洁17674066774","群":"","用户问询":"全托管模式下，商品上架后可以手动改价格吗、","AI响应":"你好！在全托管模式下，卖家可以自主提报商品目标收益价（供货价），但平台拥有最终的市场定价权。如果需要调整价格，通常需要通过买手核价或在后台提交调价申请，审核通过后方可生效。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-15 09:39:26","用户":"业务部王姝洁17674066774","群":"","用户问询":"全托管模式下添加变体提示这个是为什么","AI响应":"你好！全托管模式下出现该提示，是因为平台要求卖家提供的供货价需具备市场竞争力。\n\n这通常是系统基于同类产品的市场价格进行的风险提示，提醒你核实供货价是否过高或过低。在全托管模式下，卖家负责提供货源并确保供货价优势，而平台拥有最终市场定价权。如果价格合理，你可以继续操作；若因价格问题无法提交，建议重新核算成本并调整供货价。","一级大类":"其他","二级子类":"系统报错","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-15 09:29:51","用户":"业务部王姝洁17674066774","群":"","用户问询":"全托管模式添加变体进度条一直不动是为什么","AI响应":"你好！从截图看进度条卡住，通常是由于网络环境不稳定或浏览器插件冲突导致的。\n\n建议你尝试以下操作：\n1. **关闭网页翻译**：翻译插件会干扰后台脚本运行，请务必恢复英文原版界面。\n2. **更换浏览器**：建议使用 Chrome 浏览器的**无痕模式**重新操作。\n3. **检查图片大小**：确保上传的图片符合平台要求，单张图片过大可能会导致上传卡死。\n\n如果以上方法均无效，可能是系统临时波动，建议清除浏览器缓存后稍后再试。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-14 18:04:28","用户":"业务部王姝洁17674066774","群":"","用户问询":"全托管已经创建成功的商品有没有什么办法可以批量上传图片","AI响应":"你好！全托管模式目前不支持通过表格批量上传或修改图片。\n\n如果需要修改或添加图片，只能在 **Listings** 页面点击进入单个商品的编辑界面进行手动上传。建议在创建商品初期就确保图片信息完整准确。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-14 15:11:59","用户":"Felicity 103%","群":"","用户问询":"半托管入住查询链接","AI响应":"你好！很高兴为你解答。半托管或全托管模式入驻进度可点击下述链接进行查询：https://mercadolibre.cn/seller/info?id=478&type=consignment 注意：请使用填写问卷的公司名称或手机号码或邮箱任意一项即可查询。如有多项审核结果，请以最新日期的处理结果为准。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-14 13:59:09","用户":"业务部王姝洁17674066774","群":"","用户问询":"全托管怎么删除已经停产的链接","AI响应":"你好！全托管模式下删除停产链接的操作如下：\n\n1. 登录卖家后台，进入 **Listings**（商品列表）页面。\n2. 找到该停产商品的链接。\n3. 点击商品右侧的三个点图标或操作选项，选择 **Delete**（删除）即可。\n\n请注意，删除前确保该商品没有正在处理中的发货单或在途库存。如果只是暂时缺货，建议选择 **Pause**（暂停）而非直接删除。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-14 12:09:27","用户":"浮生        朱鹏辉","群":"","用户问询":"你好，我在美客多的半托管上面有一款产品。我这个产品的重量的话是200g的重量。然后，别人有一款链接，和我的产品一模一样，但是她做的是100g的重量，我的成本是要比他高一倍的，那但是在平台上面的话，把我和他拉在一起竞争，这种情况下我怎么去申诉呢？因为本身的重量是不一样的，那么它肯定是占优势的","AI响应":"不好意思，该问题我没有答案，请点击以下链接咨询人工客服：\nhttps://work.weixin.qq.com/kfid/kfc7c47108dec2b0070?enc_scene=ENCGH59j4kB9XCrk4dX6Jt2BZeAhKD7ZBUNQhrF2CcGYyCW&scene_param=customer_id=7881299520915144","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-13 14:08:34","用户":"朝","群":"","用户问询":"美客多全托店铺后台链接核价能尽快吗？","AI响应":"全托店铺如果上架的是清单同款商品，填写在表格后，买手会在3-5个工作日给出核价结果，我们会同步在线表格到群里。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-13 11:12:44","用户":"彭大力👩🏽😳","群":"","用户问询":"你好 半托管上了50个sku，曝光很低，该怎么办呢","AI响应":"你好！关于半托管店铺50个SKU曝光低的问题，建议从以下几个方面进行优化：\n\n1. 优化Listing质量：确保标题包含核心关键词，图片清晰且符合规范。半托管商品自带“Full”标，本身具有流量优势，如果曝光低，可能是关键词覆盖不够精准。\n\n2. 价格竞争力：检查您的定价。半托管模式采用收益价格模式，您可以参考平台建议价，确保在同类产品中具有竞争力。\n\n3. 参与平台活动：积极提报后台的促销活动。活动期间平台会有大量的流量倾斜，是提升曝光最快的方式。\n\n4. 广告引流：虽然不强制要求有销量才能开广告，但对于新上架的50个SKU，可以挑选其中潜力较大的款式开启广告，主动获取流量。\n\n5. 选品调整：参考官方选品专家提供的拉美热销大数据，检查目前的50个SKU是否符合当地市场需求。\n\n由于我无法直接查看您的店铺数据，建议您联系您的运营经理，请同事帮您分析具体的流量瓶颈并提供针对性建议。\n\n网页参考资料\n半托管模式全解析：https://mercadolibre.cn/news/info?id=215&type=live","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"}]},{"业务模块":"托管","高频问题":"入仓/入库/库存/库容","Past 7 Days":19,"Previous":25,"WoW":-0.24,"代表性问询":"半托是把货发到你们东莞的仓库吗","Past 7 Days代表性问询":"半托是把货发到你们东莞的仓库吗","Previous代表性问询":"3. 审核状态：请确认你的商品是否已经成功上架。半托管模式下，你需要先完成商品上架，系统才会根据情况开放备货权限。 -不是要先备货过去才算上架成功吗","__details":[{"时间":"2026-07-19 17:14:14","用户":"纳洛童","群":"","用户问询":"Kpop 的 cos 备货到半托管店铺推荐哪些款，尺码 110，120，130，140，150，160 这些码数推荐先备哪些？","AI响应":"你好！很高兴为你解答。Kpop 风格的 COS 或演出服在拉美市场非常受欢迎。\n\n**款式推荐：**\n1. **经典打歌服**：推荐黑色、银色或粉色系的亮片、皮革材质套装，这类风格在巴西等站点极具人气。\n2. **学院风套装**：百褶裙配短款西装或背心，是 Kpop 风格的常青款。\n3. **高街工装风**：宽松工装裤配紧身短上衣，符合拉美买家的审美。\n\n**尺码备货建议：**\n针对 110-160 码数，建议优先备货 **130、140、150** 这三个码数。\n*   **原因**：这三个尺码覆盖了 8-12 岁左右的青少年群体，是 Kpop 粉丝最集中的年龄段，也是此类服装的需求核心区。\n*   **策略**：首批备货可以按 130-150 码作为主力，120 和 160 少量测款，110 码需求相对较小，可延后考虑。\n\n**特别提醒**：\n*   **尺码表**：务必在 Listing 中提供详细的厘米（cm）对照表，因为拉美孩子体型差异较大。\n*   **合规性**：确保服装上没有韩国知名团体的 Logo 或受版权保护的特定标志，以防侵权。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-19 17:11:56","用户":"纳洛童","群":"","用户问询":"这两张图片中的角色，哪些适合备货到东莞半托管","AI响应":"你好！很高兴为你解答。\n\n从图片来看，这些角色（如迈尔斯、毒液、PS4蜘蛛侠、格温等）全部属于**漫威（Marvel）的极高风险侵权IP**。\n\n**结论：在没有正式品牌授权的情况下，图片中所有角色都不建议备货到东莞半托管仓。**\n\n**原因如下：**\n1. **入仓即风险**：半托管模式要求货物先入东莞仓。一旦被平台系统或人工识别为侵权，货物将被拦截或下架，你还需承担退仓费用，甚至面临封号风险。\n2. **严禁仿牌**：美客多对蜘蛛侠这类全球知名IP的扫描非常严格，包括外形、Logo和特定配色。\n\n**建议：**\n如果你想做半托管的COS类目，建议寻找**无版权风险的通用形象**（如通用小丑、巫师、仙女、动物连体衣等）进行备货。这样既能享受半托管的流量红利，又能保证账号安全。","一级大类":"账号入驻与安全","二级子类":"账号异常","问题主题":"账号风控/限制/申诉"},{"时间":"2026-07-18 16:58:52","用户":"涛声依旧","群":"","用户问询":"那跟半托的区别就是半托入到东莞仓，出单了由东莞仓直接发货到买家手里，全托就是我们发到东莞仓，然后平台再发到目的国本土仓，出单了再由本土仓发送到买家手里","AI响应":"是的，你的理解非常准确。\n\n**半托管：**货在东莞仓，出单后从东莞直邮给海外买家。\n**全托管：**货先到东莞仓，平台统一海运/空运至目的国本土仓，出单后从本土仓发货。\n\n全托管时效更快，且商家无需承担国际运费和佣金。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-18 16:56:15","用户":"涛声依旧","群":"","用户问询":"你好，我想问下我们的账号做全托的模式是备货到本土仓的嘛？","AI响应":"全托管模式下，商家不需要直接备货到拉美本土仓。\n\n您只需将货物发送至美客多位于**中国东莞的国内集货仓**即可。后续从中国到拉美目的国的国际物流、清关以及当地派送，全部由平台负责。\n\n**国内集货仓信息：**\n地址：广东省东莞市沙田镇进港南路第一产业园205号库台\n联系人：叶宗虎 18025233509","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-17 16:54:37","用户":"ㅤ  ㅤ","群":"","用户问询":"自发货是不是可以理解为我需要自己赵物流商送到美客多的国内仓库再由美客多送到买家手中 但是半托管是直接把货可以放在美客多的国内仓库的而且没有费用","AI响应":"你好！你的理解基本正确。自发货是出单后48小时内送达集运仓；半托管是提前备货至东莞仓，目前免仓储费。两者国内段运费均由你承担，国际段及尾程由美客多负责。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-16 16:03:43","用户":"迷迷 苏","群":"","用户问询":"半托已经备货过去的商品还未入仓，不小心有重复上架了相同的商品，已经手动下架了，但是卖家的listing还是看得到这有影响吗","AI响应":"你好！很高兴为你解答。\n\n这种情况没有影响，请放心。\n\n1. 链接显示问题：你手动下架后，卖家后台可能存在数据同步延迟，导致你依然能看到该 Listing。只要状态显示为“Paused（暂停）”或“Inactive（非激活）”，买家端就无法搜索或购买该商品，不会产生重复订单。\n\n2. 备货入仓：你已经备货过去的商品，入仓时会根据你创建货件时关联的 SKU 进行识别。只要你下架的是重复多余的 Listing，而保留了与货件信息一致的那个 Listing，入仓和后续销售就不会受到影响。\n\n3. 规则影响：美客多半托管和全托管店铺上架相同的商品本身就不会产生冲突。你及时下架重复链接是为了方便库存管理，避免库存分散，这是正确的操作。\n\n建议你稍后刷新后台，或通过买家端搜索确认该重复链接是否已不可见。只要确保发货关联的那个 Listing 处于 Active 状态即可。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-16 15:12:29","用户":"D","群":"","用户问询":"好的，半托管的流程是上完品就可以发首单到仓库吗","AI响应":"是的，半托管流程为：发布产品、商家创建发货单、商家发货至国内东莞集货仓、仓库接收并处理、产品上架变为在售（active）状态。针对新品SKU，首单建议备货5-10件。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-16 11:16:39","用户":"Z","群":"","用户问询":"我现在就是全托模式下，无法按时发送系统推送的备货计划 能怎么处理？","AI响应":"如果无法按时发送系统推送的备货计划，请按以下方式处理：\n\n1. **去发运单列表查看**：看系统是否推送了新的备货计划。\n2. **如有新计划**：填入对应数量，重新创建新的备货单，并务必点击“确认发货”。\n3. **如无新计划**：为避免损失，建议邮件预约申请自提，先把货提回去。\n\n请注意，全托模式下必须基于系统推送的计划进行操作。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-16 11:11:54","用户":"Z","群":"","用户问询":"你好，美客多全托的送到东莞仓的货件，因为供应商延期了，货无法再最后发货日期前送达，应该怎么办 可以取消这个货件吗","AI响应":"你好！很高兴为你解答。\n\n如果全托管货件无法在最后期限前送达，请按以下方式处理：\n\n1. **可以取消**：在卖家后台找到该货件，点击取消即可。\n2. **重新创建**：取消后，你可以根据供应商最新的交货时间，重新创建一个新的货件计划。\n3. **及时处理**：建议尽早取消，避免因货件过期导致系统记录异常或影响后续的入仓预约。\n\n请确保新货件的信息准确，并按照最新的预约时间送达东莞仓。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-15 21:40:30","用户":"伊恩","群":"","用户问询":"美客多半托仓库收货时间","AI响应":"美客多托管备货仓可接受货物时间为：周一到周日，9:00am-18:00pm。目前需商家自寄到仓。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 15:12:24","用户":"l n n y","群":"","用户问询":"半托是把货发到你们东莞的仓库吗","AI响应":"是的，半托管模式需要您将货物发送至美客多位于广东省东莞市的国内集货仓。仓库在收到并处理完货物后，产品才会上架变为可售状态。","一级大类":"物流仓储","二级子类":"物流咨询","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 14:45:33","用户":"DD.","群":"","用户问询":"你好 我认为我的店铺模式适合半托管 可以邀请我开通吗 我在速卖通做的就是半托管 我的备货量充足","AI响应":"你好！很高兴为你解答。\n\n如果你想要申请入驻美客多托管模式，请您先登记入驻申请问卷，统一提交这个表单：http://kks.ink/ss/vKx9ph/d12030。\n\n目前半托管模式的入驻要求和流程如下：\n1. 资质要求：支持中国大陆或香港公司主体入驻，暂不支持个体户。具备跨境电商经验。\n2. 审核流程：已填写问卷且符合项目画像的商家，买手和客户经理都会通过微信或者电话联系您，请务必保持预留联系方式的通讯畅通。\n3. 审核时效：因目前商家登记数量较多，客户经理将逐一按批次联系，预计时效为20-30个工作日。\n\n入驻沟通进度可点击此链接查询：https://mercadolibre.cn/seller/info?id=478&type=consignment","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-14 20:48:50","用户":"cyc","群":"","用户问询":"经理，我半托的补货规则改了，现在我库存的货都不支持我卖 3 天 [破涕为笑] 经理我怎么办 现在买 20 只能补 20 了","AI响应":"你好！很高兴为你解答。\n\n美客多半托管模式的强制移除（清退）规则是基于单件商品（即单个SKU）在仓库内的存放时长和动销情况来计算的，而不是根据整个链接的总销量。\n\n针对你提到的补货受限和库存不足问题，建议采取以下策略：\n\n1. 监控维度：请务必关注后台库存绩效指标，针对每一个入库的SKU进行动销监控，而非仅看Listing的总数据。\n\n2. 库存策略：建议采取“多款式、轻库存”的策略，单个SKU首批入库建议准备10-20个Units，以降低因动销停滞导致被强制清货或弃置的风险。\n\n3. 关注清退条件：\n- 低销与长库龄触发（2026年3月9日执行）：如果单件商品连续7天无销售，或存储超过14天且属于低销产品，系统将强制执行打折清仓活动。\n- 逾期强制移除（2026年3月23日执行）：在仓存放超过30天的单件商品必须移除。如果卖家未在规定时间内取回，将导致系统自动弃置。\n\n4. 健康库存定义：若商品连续30个自然日无销售，或库龄超过60天，或超出分配库容，均会被界定为“不健康库存”，可能面临分批强制折扣清货。\n\n建议你先通过提升现有库存的动销率来改善账号的库存绩效，从而获得更多的补货额度。后续有问题可以继续发问。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 20:12:09","用户":"柯培鑫","群":"","用户问询":"全托管备货数量有没有要求","AI响应":"您好，很高兴为您解答全托管模式的备货要求。\n\n在全托管模式下，备货数量是有明确要求的，主要遵循以下原则：\n\n1. 首次备货：通常要求单个SKU的起备量在50-100件左右。这是为了确保产品上架后有足够的库存支撑初期的流量分配和测款需求。\n\n2. 补货逻辑：后续的备货数量将由平台系统根据您的销售速度、库存周转率以及未来的大促计划自动计算，并向您发出补货建议。\n\n3. 仓库接收限制：在实际操作中，您需要严格按照平台下发的入库单数量进行发货。如果单箱内有多个SKU，需要在箱内做好物理隔离。\n\n4. 混装禁忌：请勿将全托管或半托管的货物与普通自发货、FTI账号货物混装揽件送货，否则仓库无法接收。\n\n如果您准备开始备货，请务必注意标签规范：外箱标（BAG LABEL）为10*15cm，产品标（SKU LABEL）为7*2.2cm。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-14 18:36:38","用户":"Rosalía.H","群":"","用户问询":"CBT 半托管，发一批货，库存适用于所有站点吗","AI响应":"你好！很高兴为你解答。\n\n在CBT半托管模式下，你发往东莞集运仓的库存是适用于所有开通站点的。\n\n目前半托管模式支持墨西哥、智利、巴西、哥伦比亚等站点。你只需要将货物发送至国内集运仓，平台会根据各站点的订单情况，自动从该库存中调拨并完成国际段的配送。这意味着你不需要为每个站点分别准备库存，实现了一份库存卖向多个国家。","一级大类":"物流仓储","二级子类":"库容管理","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 18:31:17","用户":"Rosalía.H","群":"","用户问询":"CBT半托管货件里的“请预约时间将库存送至配送中心”， 这个时间是货到仓库CNGD01的时间吗","AI响应":"你好！很高兴为你解答。\n\n是的，这个预约时间是指货物预计到达美客多国内集货仓（CNGD01，即东莞仓）的时间。\n\n在创建货件计划时，你需要根据你选择的国内快递或物流的预计时效，预估一个送达仓库的时间进行预约。\n\n目前半托管和全托管模式的国内集货仓信息如下：\n寄送地址：广东省东莞市沙田镇进港南路第一产业园205号库台\n联系人：叶宗虎 18269399433\n可接受货物时间：周一至周日，9:00am-18:00pm\n\n请确保货物在预约的时间段内送达，以便仓库能够及时安排收货和入库处理。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 10:27:06","用户":"邓欢","群":"","用户问询":"全托管仓发备货单，预约了15号，但是17号才到，会怎样","AI响应":"预约的是到仓时间，提前一天送达仓库不会拒收。但全托管有运单过期时间，只要在运单过期前入库即可，建议尽量按预约时间送达以保证入库效率。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-13 14:26:43","用户":"迷迷 苏","群":"","用户问询":"半托备货东莞仓的退货也需要设置退货地址吗","AI响应":"你好！很高兴为你解答。\n\n必须填写退货地址。若退货地址空缺，Full仓退货在20天内未提取将被自动捐赠或销毁。如果你有本地退货地址，可以要求买家退货。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-13 13:33:35","用户":"要芒果吗.","群":"","用户问询":"我这个是半托管店铺，应该如何绑定我的微信或者我的邮箱随时更新补货动态呢？","AI响应":"商家您好，为保障您的商品在平台不断货、销量稳定，美客多在每周一和周四通过邮件发送补货数量通知。\n\n请您在商家调查问卷中如实填写相关信息，并确保预留的邮箱可正常接收补货通知，以便及时下单补货，避免库存不足影响销售。目前系统主要通过邮件方式进行提醒，建议您将常用邮箱设置为通知接收地址，并定期检查邮件动态。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"}]},{"业务模块":"托管","高频问题":"回款周期/提现/汇款渠道","Past 7 Days":9,"Previous":11,"WoW":-0.18181818181818182,"代表性问询":"全托管模式提现分站点吗","Past 7 Days代表性问询":"全托管模式提现分站点吗","Previous代表性问询":"美客多全托回款日期是多久 在哪里改汇款渠道","__details":[{"时间":"2026-07-16 21:03:05","用户":"爱悠雅服饰","群":"","用户问询":"全托管卖家绑定的可以收美金的国际银行账户。怎么样可以把美元变为人民币提现呢？","AI响应":"你好！很高兴为你解答。\n\n通常情况下，卖家会使用第三方跨境收款工具（如 Payoneer、PingPong、LianLian 等）来接收美客多的结算款项。\n\n当你将美客多后台的结算款项提取到这些第三方收款平台后，你可以在这些平台的后台操作“提现”。在提现时，你可以选择将美元按实时汇率兑换成人民币，并提取到你国内绑定的个人或企业银行卡中。\n\n平台提现币种通常与卖家选择的收款账户币种一致，或支持按当前汇率进行兑换。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-16 17:52:31","用户":"Aurora","群":"","用户问询":"全托管模式提现分站点吗","AI响应":"你好！很高兴为你解答。\n\n全托管模式的提现也是分站点进行的。\n\n由于全托管模式涉及不同国家的市场，每个站点的货币结算、回款周期以及当地的税务政策（如墨西哥的RFC税号政策）均存在差异，因此各站点的资金会分别进行结算和提现。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-16 17:52:14","用户":"Aurora","群":"","用户问询":"美客多半托管模式提现也分站点吗","AI响应":"你好！很高兴为你解答。\n\n美客多半托管模式的提现是分站点进行的。\n\n半托管模式目前覆盖了墨西哥、巴西、智利、阿根廷、哥伦比亚等站点。由于每个站点的货币结算、回款周期以及当地的税务政策（如墨西哥的RFC税号政策）各不相同，因此资金会根据不同站点的订单分别结算到对应的账户余额中。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-16 17:15:46","用户":"月儿公主假睫毛厂家-杨","群":"","用户问询":"你好。全托管模式，我们报价是按照人民币报价吧？还是按照美元报价？平台给我们结算的话，是按照人民币结算，还是美元结算？","AI响应":"全托管模式下，您需要按照美元进行供货价提报。平台结算时同样支持美金结算，具体以平台规则为准。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-15 11:27:29","用户":"悠","群":"","用户问询":"半托店铺是不是一开始就要绑定收款账户","AI响应":"绑定收款方式不影响出单，但会影响回款。在KYC审核通过后，建议尽快在Settings-Selling preferences中绑定Payoneer、Pingpong或Worldfirst等收款账号，以免影响后续资金结算。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-15 11:10:29","用户":"iee","群":"","用户问询":"半托管怎么看绑定了那个收款帐户","AI响应":"你好！请前往后台路径 **Settings > Selling preferences > Collection method** 查看。该页面会显示您当前站点绑定的收款账户信息。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-14 10:23:24","用户":"有莲","群":"","用户问询":"你好，请问一下美客多半托管店铺怎样绑定收款的呢","AI响应":"你好！请前往后台路径 Settings > Selling preferences > Collection method，选择对应站点绑定收款账户。绑定或更换操作均需完成法人人脸识别验证，且该入口仅在KYC通过后才会展示。只要是主体一致且能接收美金的账户即可绑定。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-13 13:57:46","用户":"-Tatsu 🐶","群":"","用户问询":"自动打款对吗 不用自己按提现 全托呢","AI响应":"是的，半托管模式是系统自动触发打款，不需要手动操作。全托管模式同样也是自动回款，单站点金额满500美元即可自动结算。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"},{"时间":"2026-07-13 13:56:58","用户":"-Tatsu 🐶","群":"","用户问询":"半托怎么提现","AI响应":"你好！很高兴为你解答。半托管模式提现需账户中单个站点的可结算金额达到500美元，系统会每周自动触发打款至您绑定的收款账户。","一级大类":"财税合规","二级子类":"资金管理","问题主题":"提现/回款/资金结算"}]},{"业务模块":"托管","高频问题":"定价/佣金/费用测算","Past 7 Days":7,"Previous":12,"WoW":-0.4166666666666667,"代表性问询":"半托管能开高佣金吗","Past 7 Days代表性问询":"半托管能开高佣金吗","Previous代表性问询":"美客多半托管如何定价","__details":[{"时间":"2026-07-17 11:35:14","用户":"悠","群":"","用户问询":"半托管能开高佣金吗","AI响应":"半托管模式目前不支持自主设置高佣金。该模式享受佣金减免福利，统一收取8%佣金，相比常规模式有50%的减免。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-15 15:29:54","用户":"iee","群":"","用户问询":"半托价格怎么算","AI响应":"半托管定价采用收益价格模式（Net Proceeds）。\n\n您只需设置想要获得的收益（商家供货价），公式为：\n收益价格 = 单件货物成本 + 您的目标利润 + 单件国内发货到东莞仓的物流成本（需转化成美元填写）。\n\n您无需计算销售佣金和国际运费，平台会自动在您的供货价基础上进行前端售价藏价。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-15 11:32:47","用户":"廖","群":"","用户问询":"全托管和半托管，企业所获得的利润差距有多大","AI响应":"你好！很高兴为您解答。\n\n全托管和半托管模式在利润构成和定价权上有明显区别，具体的利润差距取决于您的成本控制能力和运营策略：\n\n1. 全托管模式：\n定价权：由平台负责定价。\n利润构成：您提供的是“供货价”。由于该模式下您承担的是0佣金、0仓储费、0国际运费和0广告费，您的利润空间主要取决于您的生产成本与给平台供货价之间的差额。这种模式回款快（妥投后7个工作日），适合追求高周转、低运营成本的厂家。\n\n2. 半托管模式：\n定价权：商家自主定价。\n利润构成：您采用的是“收益价格模式（Net Proceeds）”。您需要设置一个想要获得的收益（供货价），平台会在前端自动加上佣金（8%）和运费进行藏价销售。\n利润差距点：在半托管模式下，虽然您需要支付8%的佣金，但因为拥有自主定价权，如果您具备较强的运营能力和品牌溢价能力，可以通过优化链接和自主调价来争取更高的利润空间。\n\n总结来说：\n全托管更像“大宗供货”，利润相对固定且透明，省去了所有运营开支。\n半托管更像“自主经营”，利润上限取决于您的定价策略和市场竞争力，但需要投入精力进行店铺运营。\n\n关于这两种模式的深度解析，您可以参考以下视频内容：\n视频名字：美客多半托管模式全解析\n知识点：半托管与全托管模式对比及优势\n视频时刻点：05:15\n视频链接：https://mercadolibre.cn/news/info?id=215&type=live","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-15 11:19:12","用户":"菲菲菲","群":"","用户问询":"那全托管业务我们提供的这个供货价需要包考虑到哪些费用？","AI响应":"你好！很高兴为你解答。\n\n全托管模式下，你提供的供货价需要包含以下成本：\n1. 商品本身的成本。\n2. 备货到东莞集货仓的国内物流费用。\n3. 你的预期利润。\n4. 潜在的退仓费用（由商家承担）。\n\n除此之外，平台的销售佣金、国际物流费、仓储费、末端配送费以及本地客服等费用，均由平台承担或通过前端加价覆盖，不需要计入你的供货价中。你只需要关注你的净收益，即供货价。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流费用综合咨询"},{"时间":"2026-07-15 11:05:21","用户":"菲菲菲","群":"","用户问询":"美客多全托管业务平台退库需要操作费吗？具体涉及哪些费用","AI响应":"你好！很高兴为你解答。\n\n全托管产品滞销后，仓库没有收取仓储费或退货运费。如果需要退仓，是由商家自行安排提货。\n\n关于退货产生的费用，通常发货运费不予退还。如果商品损坏选择弃置，会产生弃置费（Discard stock fee）。此外，广告费和已发生的固定处理费通常也不予退还。","一级大类":"物流仓储","二级子类":"物流费用","问题主题":"物流费用综合咨询"},{"时间":"2026-07-13 17:32:14","用户":"-Tatsu 🐶","群":"","用户问询":"半托管有佣金吗","AI响应":"半托管模式有佣金减免福利，享最高50%的佣金折扣，通常收取8%佣金。定价采用收益价格模式，平台会进行前端售价藏价。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-13 15:10:37","用户":"Eric Hsu","群":"","用户问询":"半托管的佣金类型这块只有经典的，不能设置成优质的吗","AI响应":"半托管模式目前仅支持经典（Classic）Listing类型，不支持设置或更改为优质（Premium）Listing。这意味着半托管卖家无法通过支付更高比例的佣金来换取免息分期（Installments without interest）等功能。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"}]},{"业务模块":"托管","高频问题":"广告/关键词投放","Past 7 Days":5,"Previous":3,"WoW":0.6666666666666666,"代表性问询":"全托管的流量是怎么样的，我现在做半托管都没有流量啊","Past 7 Days代表性问询":"全托管的流量是怎么样的，我现在做半托管都没有流量啊","Previous代表性问询":"半托产品0曝光一般是有什么问题","__details":[{"时间":"2026-07-17 15:25:36","用户":"江西 古天乐","群":"","用户问询":"美客多全托好不好做 有没有钱赚现在 全托现在流量怎么样","AI响应":"你好！全托管模式目前流量非常大，产品带有官方FULL标，并直通\"MELI Selection\"活动专场，享受顶级流量扶持。\n\n该模式下，商家享受0佣金、0仓储费、0国际运费和0广告费，仅需负责供货，妥投后7个工作日即可回款，非常适合有成本优势的工厂或贸易商。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-14 20:54:22","用户":"柯培鑫","群":"","用户问询":"全托管做多品类的店铺行不行的，有没有影响店铺流量权重","AI响应":"在全托管模式下，做多品类的店铺是完全可以的，并且**不会负面影响你的店铺流量权重**。\n\n原因如下：\n\n1. **单品权重逻辑**：美客多的流量分配逻辑主要是基于“单品（Listing）”的权重，而不是基于“店铺”的垂直度。只要你的单品价格有竞争力、转化率高，系统就会给该单品分配流量，不会因为你店铺里卖的东西杂而降低某个爆款的权重。\n\n2. **官方选品导向**：全托管模式下，平台更看重的是“货”而不是“店”。官方选品专家会根据拉美热销大数据给你发品建议。只要是符合市场需求的准爆款，无论属于哪个类目，平台都会给予流量扶持。\n\n3. **流量阵地优势**：全托管产品会进入专属的流量阵地（如MELI Selection），这些流量是针对具体产品类目进行分发的。\n\n**不过，虽然不影响权重，但建议你注意以下几点：**\n- **供应链深度**：虽然可以做多品类，但建议每个品类都要有稳定的供应链和价格优势，否则核价环节很难通过。\n- **备货压力**：多品类意味着更多的SKU，如果每个SKU都要满足起备量要求，会对你的资金和库存管理提出更高要求。\n\n总结：全托管鼓励卖家根据平台大数据提报优质产品，不限制品类，也不会因为品类杂而扣分。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-14 20:08:54","用户":"柯培鑫","群":"","用户问询":"全托管的流量是怎么样的，我现在做跨境自发货都没有流量啊","AI响应":"全托管模式的流量权重是平台顶级的，相比你目前正在做的跨境自发货，流量分配逻辑有本质的区别。\n\n**全托管模式的流量优势：**\n1. **官方FULL标加持**：全托管商品享有官方FULL标识，在搜索结果中排名更靠前。买家更倾向于购买带FULL标的产品，因为这意味着更快的物流和更好的售后。\n2. **专属活动入口**：全托管产品直通“MELI Selection”大促专场，并享有核心大促位和站外投放资源，这些流量是自发货模式很难触达的。\n3. **专业算法优化**：由平台专业团队负责链接优化和提报活动，通过官方算法提升转化率，流量利用率更高。\n\n**为什么你的跨境自发货没有流量：**\n1. **物流时效劣势**：自发货从中国发货，物流时间长，且买家往往需要支付额外的运费。在美客多，物流时效是影响排名的核心权重，自发货在搜索排名中天然处于劣势。\n2. **缺乏流量标签**：自发货产品没有FULL标，很难进入平台的各种促销频道。\n3. **购物车竞争**：正如你之前看到的，如果同款产品有海外仓（FULL）卖家在售，系统会优先把流量给到他们，导致你“正在丢失购物车”。\n\n**总结建议：**\n自发货模式目前在美客多主要用于测款，很难获得爆发式流量。如果你有优质货源但缺乏运营经验，全托管模式通过“0佣金、0广告费、官方推流”的政策，能极大解决你目前没有流量的困境。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"物流发货","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-14 20:08:36","用户":"柯培鑫","群":"","用户问询":"全托管的流量是怎么样的，我现在做半托管都没有流量啊","AI响应":"全托管模式的流量权重是非常高的，它拥有平台顶级的流量扶持。\n\n在全托管模式下，你的产品会获得以下专属流量资源：\n1. **专属流量阵地**：产品会带有官方“FULL”标，并直通“MELI Selection”活动专场，这是平台最高级别的流量入口。\n2. **官方运营优化**：美客多的专业团队会负责商品上架、翻译和链接优化，通过专业算法提升转化率，这比个人运营更精准。\n3. **营销资源倾斜**：全托管产品会优先获得核心大促位、站外投放位以及广告资源支持，且这些广告费用由平台承担。\n\n**针对你提到的半托管没有流量的问题，可能存在以下原因：**\n- **运营权归属**：半托管模式下，定价权和运营权（如上架、优化链接）依然在商家手中。如果你的Listing优化不到位、价格没有竞争力，或者没有主动提报活动，流量就会受限。\n- **信誉积累**：半托管需要商家自主运营来积累店铺信誉，如果还没有拿到“绿色信誉”，系统分配的自然流量会非常少。\n- **竞争环境**：半托管虽然有50%的佣金减免和流量扶持，但仍需与全托管及成熟的海外仓卖家竞争。\n\n**全托管与半托管最大的区别在于：**\n全托管是平台“包办”运营和推广，利用官方资源强力推流；而半托管更看重商家的自主运营能力。如果你目前没有专业的运营团队，全托管确实能帮你解决流量获取难的问题。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"},{"时间":"2026-07-13 11:14:08","用户":"彭大力👩🏽😳","群":"","用户问询":"半托管5个站点，主要流量是集中在哪个站点呢","AI响应":"你好！很高兴为你解答。\n\n在美客多跨境店的五大站点中，流量最集中、市场份额最大的站点是**墨西哥（Mexico）**和**巴西（Brazil）**。\n\n对于半托管模式而言，目前的核心流量和政策支持主要集中在**墨西哥站点**。墨西哥站的电商环境成熟，且半托管模式在墨西哥的物流履约效率极高，是大多数跨境卖家的首选站点。\n\n巴西站虽然流量也非常庞大，但由于物流和税务政策的特殊性，建议您优先稳固墨西哥站的运营。\n\n网页参考资料\n半托管模式全解析：https://mercadolibre.cn/news/info?id=215&type=live","一级大类":"营销活动","二级子类":"广告投放","问题主题":"广告/关键词投放"}]},{"业务模块":"托管","高频问题":"KYC/审核进度/资料提交","Past 7 Days":5,"Previous":5,"WoW":0,"代表性问询":"全托管的，需要从哪个链接提交资料？","Past 7 Days代表性问询":"全托管的，需要从哪个链接提交资料？","Previous代表性问询":"半托管也有KYC吗","__details":[{"时间":"2026-07-17 10:32:59","用户":"熊鹏程","群":"","用户问询":"全托管店铺已经注册了。目前在kyc审核。","AI响应":"你好！全托管店铺在提交KYC申请后，如果想要加快进度，可以点击后台右上角的Help联系人工客服，告知对方你是全托管店铺，KYC资料已经申请提交，请平台优先安排审核。\n\n通常KYC审核需要2-3周以上，你可以通过以下路径实时查看进度：Settings > Selling Preferences > Company’s legal information。如果状态显示为Under review（审核中），说明材料正在处理，请耐心等待。\n\n提交邮箱后即为您开通KYC审核绿色通道，通常3-5个工作日给反馈，请留意卖家后台审核状态的变化。但是加速审核只有一次机会，请谨慎提交！","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"入驻/注册/开店流程"},{"时间":"2026-07-16 11:48:16","用户":"十六","群":"","用户问询":"全托管KYC审核进度","AI响应":"你好！全托管入驻审核进度请通过以下链接查询：https://mercadolibre.cn/seller/info?id=478&type=consignment。请使用填写问卷的公司名、手机号或邮箱查询。","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-16 11:39:04","用户":"月儿公主假睫毛厂家-杨","群":"","用户问询":"全托管的，需要从哪个链接提交资料？","AI响应":"全托管和半托管请统一提交这个表单：http://kks.ink/ss/vKx9ph/d12030","一级大类":"产品管理","二级子类":"产品上架","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-15 08:51:44","用户":"ぅ Oath°3 jin","群":"","用户问询":"你好，美客多人脸识别总是通不过，是不是就不能开通美客多半托管了","AI响应":"你好！很高兴为你解答。\n\n人脸识别通不过并不代表无法开通半托管，这通常是由于系统识别环境、网络波动或浏览器插件干扰导致的。\n\n如果你已经尝试了更换设备（如使用苹果手机 Safari 浏览器）、更换网络（如使用手机热点）以及关闭网页翻译等操作依然无效，请务必通过之前提供的 KYC 反馈问卷提交报错信息。\n\n提交邮箱后即为您开通 KYC 审核绿色通道，通常 3-5 个工作日给反馈，请留意卖家后台审核状态的变化。但是加速审核只有一次机会，请谨慎提交！\n\n只要你的资质符合半托管的要求，在通过人工审核或系统修复后，依然可以继续入驻流程。\n\n入驻准备材料：\n- 营业执照（彩色扫描件/照片）\n- 法人身份证（正反面彩色扫描件/照片）\n- 准确的联系方式（邮箱、手机号）\n- 跨境电商平台店铺链接及流水（FTI工贸一体和半托管/全托管模式需要）","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-14 15:55:05","用户":"dwk .","群":"","用户问询":"想要用其他法人主体开通全托管和半托管","AI响应":"全托管和半托管请统一提交此表单申请：http://kks.ink/ss/vKx9ph/d12030\n\n入驻要求如下：\n1. 主体资质：中国大陆或香港公司营业执照。\n2. 流水要求：跨境电商单店年流水需大于30万美金。\n3. 关联关系：若流水主体与入驻主体不一致，需满足法人一致或存在控股关系。\n\n注意：全托管和半托管需分开店铺运作，且不同店铺商品不能重复。","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"}]},{"业务模块":"托管","高频问题":"平台政策/官方规则","Past 7 Days":4,"Previous":4,"WoW":0,"代表性问询":"全托管在税务方面有没有免税政策？","Past 7 Days代表性问询":"全托管在税务方面有没有免税政策？","Previous代表性问询":"半托管还需要什么要求","__details":[{"时间":"2026-07-18 18:38:54","用户":"阿柱","群":"","用户问询":"请问在美客多平台上能销售这类ip产品吗，全托或者半托 对授权有什么要求","AI响应":"你好！很高兴为你解答。\n\n关于在美客多全托管或半托管模式下销售IP品牌产品，有以下明确要求：\n\n1. 授权要求：没授权肯定不能卖。美客多平台对仿品和侵权产品采取零容忍政策，一旦发现会直接下架产品甚至关闭店铺。卖家必须确保拥有合法的品牌授权书，且授权链路完整合规。\n\n2. 模式政策：无论是全托管还是半托管，平台都会严格审核商品的品牌资质。如果无法提供官方授权证明，建议不要上架此类IP产品，以免影响店铺安全。\n\n请确保您的商品和品牌授权完全合规后再进行后续操作。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-18 15:51:30","用户":"A-偶像","群":"","用户问询":"美客多全托管流水新政策","AI响应":"你好！很高兴为你解答。全托管入驻新政策已放宽要求，不再强制提供30万美金托管平台年流水，调整为提供跨境电商30万美金年流水即可。但需注意，提供流水的店铺和主体必须是绑定关系。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-14 09:29:43","用户":"纯属巧合","群":"","用户问询":"我们是做 半托的， 客户要求开发票要怎么办","AI响应":"你好！很高兴为你解答。\n\n关于买家索要发票的问题，处理方式如下：\n\n1. 下载官方发票：一般情况下，如果买家没有特殊要求，你可以直接在卖家后台为买家下载平台开具的官方发票 Commercial Invoice。\n操作路径：登录卖家后台 -> 进入 Invoice（发票）相关模块 -> 选择对应订单 -> 使用导出功能下载电子发票。\n\n2. 通过ERP发送：你也可以通过ERP系统生成PDF电子版发票，随后通过后台的“订单聊天窗口（Message）”以附件形式发送给买家。\n\n3. 卖家的责任：由于美客多平台未与墨西哥税务局（SAT）集成，平台无法直接开具正式的电子发票。如果客户明确需要电子发票，作为卖家，你有义务在税务服务提供商的帮助下管理发票，并将其附加在发送给买家的消息中。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"发票开具","问题主题":"平台政策/官方规则"},{"时间":"2026-07-13 14:56:40","用户":"泽显Mike15372988892","群":"","用户问询":"全托管在税务方面有没有免税政策？","AI响应":"在全托管模式下，卖家不需要提供墨西哥RFC税号。因为该模式配送墨西哥属于跨境直邮，进口税费由买家承担，卖家无需办理属地化税务登记，平台也不会代扣36%的增值税和所得税。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"平台政策/官方规则"}]}]};

      "KYC & 审核": "KYC",
      "账号异常": "Account Issue",
      "店铺等级": "Store Reputation",
      "人工升级": "Escalation"
    };
    const i18n = {
      en: {
        save: "Save",
        saved: "Saved",
        reset: "Reset edits",
        overview: "Overview",
        overviewHint: "Light yellow cells are editable. WoW and charts update automatically and save in this browser.",
        topTopics: "Top 10 AI assistant query topics",
        topTopicsHint: "Other is excluded. Values are Past 7 Days absolute query counts.",
        topWow: "Top 10 WoW comparison",
        topWowHint: "Current period vs comparison period. High-frequency question cells are editable.",
        moduleIssues: "High-frequency questions by business model",
        moduleIssuesHint: "FBM / IDS / Consignment",
        source: "Data source",
        current: "Current",
        previous: "Previous",
        method: "Method",
        methodText: "Counts by primary and secondary category. High-frequency questions are generated from seller queries and AI responses.",
        currentFile: "Current file",
        previousFile: "Previous file",
        past7Query: "Past 7 days query number",
        queryWow: "Query number WoW",
        top10Share: "Top 10 topics share",
        top10AvgWow: "Top 10 Avg WoW",
        rank: "Rank",
        primary: "Primary category",
        secondary: "Secondary category",
        past7: "Past 7 Days",
        change: "Change",
        wow: "WoW",
        issue: "High-frequency question",
        module: "Business model",
        sample: "Representative query",
        viewAll: "View details",
        detailTitle: "Original records",
        detailCount: "records",
        close: "Close",
        noRecords: "No records available",
        detailCols: ["Time", "User", "Group", "User query", "AI response", "Primary category", "Secondary category", "Question topic"]
      },
      zh: {
        save: "保存",
        saved: "已保存",
        reset: "恢复原始数据",
        overview: "总览",
        overviewHint: "浅黄色单元格可直接编辑，相关 WoW 与图表会自动刷新并保存在本机浏览器。",
        topTopics: "Top 10 小助手问询话题",
        topTopicsHint: "已去除“其他”；Past 7 Days 为绝对问询数。",
        topWow: "Top 10 WoW 对比",
        topWowHint: "当前周期 vs 对比周期；高频问题列可编辑。",
        moduleIssues: "业务模块高频问题",
        moduleIssuesHint: "海外仓 / 自发货 / 托管",
        source: "数据来源",
        current: "当前周期",
        previous: "对比周期",
        method: "方法",
        methodText: "按一级大类/二级子类统计；高频问题基于用户问询和 AI 响应生成。",
        currentFile: "当前文件",
        previousFile: "对比文件",
        past7Query: "过去7天问询数",
        queryWow: "问询数 WoW",
        top10Share: "Top 10话题占总体问询数占比",
        top10AvgWow: "Top 10 Avg WoW",
        rank: "排名",
        primary: "一级大类",
        secondary: "二级子类",
        past7: "Past 7 Days",
        change: "变化",
        wow: "WoW",
        issue: "高频问题",
        module: "业务模块",
        sample: "代表性问询",
        viewAll: "查看明细",
        detailTitle: "原始明细",
        detailCount: "条记录",
        close: "关闭",
        noRecords: "暂无明细记录",
        detailCols: ["时间", "用户", "群", "用户问询", "AI响应", "一级大类", "二级子类", "问题主题"]
      }
    };
    const t = key => (i18n[lang] && i18n[lang][key]) || i18n.en[key] || key;
    const labelModule = value => moduleNames[value]?.[lang] || value;
    const labelCategory = value => lang === "en" ? (categoryTranslations[value] || value) : value;

    const keyPrimary = "一级大类";
    const keySecondary = "二级子类";
    const keyPrev = "Previous " + data.meta.previous_period;

    function fmtInt(value) {
      const n = Number(value || 0);
      return n.toLocaleString("en-US", { maximumFractionDigits: 0 });
    }
    function fmtPct(value) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) return "N/A";
      const n = Number(value);
      return (n > 0 ? "+" : "") + (n * 100).toFixed(1) + "%";
    }
    function recalcTopRow(row) {
      row["Past 7 Days"] = Number(row["Past 7 Days"] || 0);
      row[keyPrev] = Number(row[keyPrev] || 0);
      row.Change = row["Past 7 Days"] - row[keyPrev];
      row.WoW = row[keyPrev] === 0 ? null : row.Change / row[keyPrev];
      row["Past 7 Share"] = data.meta.current_rows ? row["Past 7 Days"] / data.meta.current_rows : null;
    }
    function topCompareRows() {
      return data.top100_wow || data.top10;
    }
    function removeOtherRows(rows) {
      return rows.filter(row => row[keySecondary] !== "其他" && row[keyPrimary] !== "其他");
    }
    function assistantTop10Rows() {
      return removeOtherRows(topCompareRows())
        .slice(0, 10);
    }
    function wowTop10Rows() {
      return removeOtherRows(topCompareRows())
        .slice(0, 10);
    }
    function recalcIssueRow(row) {
      row["Past 7 Days"] = Number(row["Past 7 Days"] || 0);
      row.Previous = Number(row.Previous || 0);
      row.WoW = row.Previous === 0 ? null : (row["Past 7 Days"] - row.Previous) / row.Previous;
    }
    function persist(showMessage = false) {
      try {
        localStorage.setItem(storageKey, JSON.stringify(data, (key, value) => key === "__details" ? undefined : value));
        if (showMessage) {
          const status = document.getElementById("saveStatus");
          status.textContent = t("saved");
          window.clearTimeout(Number(status.dataset.timerId || 0));
          const timerId = window.setTimeout(() => { status.textContent = ""; }, 1600);
          status.dataset.timerId = String(timerId);
        }
      } catch {}
    }
    function editableCell(text, onSave, cls = "") {
      const td = document.createElement("td");
      td.className = "editable " + cls;
      td.contentEditable = "true";
      td.textContent = text ?? "";
      td.addEventListener("blur", () => {
        onSave(td.textContent.trim());
        persist(true);
      });
      td.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          td.blur();
        }
      });
      return td;
    }
    function td(text, cls = "") {
      const cell = document.createElement("td");
      cell.className = cls;
      cell.textContent = text ?? "";
      return cell;
    }
    function detailButton(row) {
      const records = row.__details || [];
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "view-all";
      btn.textContent = t("viewAll");
      btn.disabled = records.length === 0;
      btn.addEventListener("click", event => {
        event.preventDefault();
        event.stopPropagation();
        openDetails(row);
      });
      return btn;
    }
    function issueCell(row, onSave) {
      const cell = document.createElement("td");
      cell.className = "issue-cell";
      const editor = document.createElement("div");
      editor.className = "issue-editor";
      editor.contentEditable = "true";
      editor.textContent = row["高频问题"] || "";
      editor.addEventListener("blur", () => {
        onSave(editor.textContent.trim());
        persist(true);
      });
      editor.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          editor.blur();
        }
      });
      cell.appendChild(editor);
      cell.appendChild(detailButton(row));
      return cell;
    }
    function openDetails(row) {
      const records = row.__details || [];
      const modal = document.getElementById("detailModal");
      document.getElementById("detailTitle").textContent = t("detailTitle") + " - " + (row["高频问题"] || labelCategory(row[keySecondary]) || "");
      document.getElementById("detailCount").textContent = fmtInt(records.length) + " " + t("detailCount");
      const body = document.getElementById("detailBody");
      if (!records.length) {
        body.textContent = t("noRecords");
        modal.hidden = false;
        return;
      }
      const columns = ["时间", "用户", "群", "用户问询", "AI响应", "一级大类", "二级子类", "问题主题"];
      const labels = t("detailCols");
      const table = document.createElement("table");
      const head = table.createTHead().insertRow();
      labels.forEach(label => {
        const th = document.createElement("th");
        th.textContent = label;
        head.appendChild(th);
      });
      const tbody = table.createTBody();
      records.forEach(record => {
        const tr = tbody.insertRow();
        columns.forEach(column => tr.appendChild(td(record[column] || "")));
      });
      body.innerHTML = "";
      body.appendChild(table);
      modal.hidden = false;
    }
    function closeDetails() {
      document.getElementById("detailModal").hidden = true;
    }
    function renderKpis() {
      const assistantTop10 = assistantTop10Rows();
      const top10Total = assistantTop10.reduce((sum, row) => sum + Number(row["Past 7 Days"] || 0), 0);
      const wowAvg = assistantTop10.reduce((sum, row) => sum + (Number(row.WoW) || 0), 0) / assistantTop10.length;
      const queryWow = data.meta.previous_rows ? (data.meta.current_rows - data.meta.previous_rows) / data.meta.previous_rows : null;
      const items = [
        [t("past7Query"), fmtInt(data.meta.current_rows)],
        [t("queryWow"), fmtPct(queryWow)],
        [t("top10Share"), fmtPct(top10Total / data.meta.current_rows)],
        [t("top10AvgWow"), fmtPct(wowAvg)]
      ];
      document.getElementById("kpis").innerHTML = items.map(([label, value]) =>
        '<div class="kpi"><div class="kpi-label">' + label + '</div><div class="kpi-value">' + value + '</div></div>'
      ).join("");
    }
    function renderBars() {
      const rows = assistantTop10Rows();
      const max = Math.max(...rows.map(row => Number(row["Past 7 Days"] || 0)), 1);
      document.getElementById("bars").innerHTML = rows.map(row => {
        const value = Number(row["Past 7 Days"] || 0);
        const width = Math.max(2, value / max * 100);
        const label = labelCategory(row[keySecondary]);
        return '<div class="bar-row"><div class="bar-label" title="' + label + '">' + label + '</div><div class="track"><div class="bar" style="width:' + width + '%"></div></div><div class="bar-num">' + fmtInt(value) + '</div></div>';
      }).join("");
    }
    function renderTopTable() {
      const table = document.getElementById("topTable");
      table.innerHTML = "";
      const head = table.createTHead().insertRow();
      [t("rank"), t("primary"), t("secondary"), t("past7"), t("previous"), t("change"), t("wow"), t("issue")].forEach(label => {
        const th = document.createElement("th");
        th.textContent = label;
        head.appendChild(th);
      });
      const body = table.createTBody();
      wowTop10Rows().forEach((row, i) => {
        recalcTopRow(row);
        const tr = body.insertRow();
        tr.appendChild(td(i + 1, "num"));
        tr.appendChild(td(labelCategory(row[keyPrimary])));
        tr.appendChild(td(labelCategory(row[keySecondary])));
        tr.appendChild(editableCell(row["Past 7 Days"], value => { row["Past 7 Days"] = Number(value.replace(/,/g, "")) || 0; renderAll(); }, "num"));
        tr.appendChild(editableCell(row[keyPrev], value => { row[keyPrev] = Number(value.replace(/,/g, "")) || 0; renderAll(); }, "num"));
        tr.appendChild(td(fmtInt(row.Change), "num " + (row.Change >= 0 ? "delta-up" : "delta-down")));
        tr.appendChild(td(fmtPct(row.WoW), "num " + (row.WoW >= 0 ? "delta-up" : "delta-down")));
        tr.appendChild(issueCell(row, value => { row["高频问题"] = value; }));
      });
    }
    function renderModuleTabs() {
      const wrap = document.getElementById("moduleTabs");
      wrap.innerHTML = "";
      ["海外仓", "自发货", "托管"].forEach(moduleName => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = labelModule(moduleName);
        btn.className = moduleName === activeModule ? "active" : "";
        btn.addEventListener("click", () => { activeModule = moduleName; renderModuleTabs(); renderModuleTable(); });
        wrap.appendChild(btn);
      });
    }
    function renderModuleTable() {
      const table = document.getElementById("moduleTable");
      table.innerHTML = "";
      const rows = data.module_issues.filter(row => row["业务模块"] === activeModule);
      const head = table.createTHead().insertRow();
      [t("module"), t("issue"), t("past7"), t("previous"), t("wow"), t("sample")].forEach(label => {
        const th = document.createElement("th");
        th.textContent = label;
        head.appendChild(th);
      });
      const body = table.createTBody();
      rows.forEach(row => {
        recalcIssueRow(row);
        const tr = body.insertRow();
        tr.appendChild(td(labelModule(row["业务模块"])));
        tr.appendChild(editableCell(row["高频问题"], value => { row["高频问题"] = value; }));
        tr.appendChild(editableCell(row["Past 7 Days"], value => { row["Past 7 Days"] = Number(value.replace(/,/g, "")) || 0; renderModuleTable(); }, "num"));
        tr.appendChild(editableCell(row.Previous, value => { row.Previous = Number(value.replace(/,/g, "")) || 0; renderModuleTable(); }, "num"));
        tr.appendChild(td(fmtPct(row.WoW), "num " + (row.WoW >= 0 ? "delta-up" : "delta-down")));
        const sampleText = [
          row["Past 7 Days代表性问询"] || row["代表性问询"] || "",
          row["Previous代表性问询"] || ""
        ].filter(Boolean).join("\n");
        tr.appendChild(editableCell(sampleText, value => {
          const parts = String(value).split(/\n/);
          row["Past 7 Days代表性问询"] = (parts[0] || "").trim();
          row["Previous代表性问询"] = (parts[1] || "").trim();
          row["代表性问询"] = row["Past 7 Days代表性问询"];
        }));
      });
    }
    function renderSource() {
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      document.getElementById("periodLine").textContent = t("current") + ": " + data.meta.current_period + " | " + t("previous") + ": " + data.meta.previous_period;
      document.getElementById("sourceInfo").innerHTML =
        "<strong>" + t("currentFile") + ":</strong> " + data.meta.current_file + "<br>" +
        "<strong>" + t("previousFile") + ":</strong> " + data.meta.previous_file + "<br>" +
        "<strong>" + t("method") + ":</strong> " + t("methodText");
    }
    function applyStaticText() {
      document.querySelectorAll("[data-i18n]").forEach(el => {
        el.textContent = t(el.dataset.i18n);
      });
      document.getElementById("langEnBtn").classList.toggle("active", lang === "en");
      document.getElementById("langZhBtn").classList.toggle("active", lang === "zh");
    }
    function renderAll() {
      topCompareRows().forEach(recalcTopRow);
      persist();
      applyStaticText();
      renderKpis();
      renderBars();
      renderTopTable();
      renderSource();
    }
    
    document.getElementById("saveBtn").addEventListener("click", () => {
      persist(true);
    });
    document.getElementById("detailCloseBtn").addEventListener("click", closeDetails);
    document.getElementById("detailModal").addEventListener("click", event => {
      if (event.target.id === "detailModal") closeDetails();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeDetails();
    });
    document.getElementById("langEnBtn").addEventListener("click", () => {
      lang = "en";
      try { localStorage.setItem("marsmind_topic_dashboard_lang", lang); } catch {}
      renderAll();
      renderModuleTabs();
      renderModuleTable();
    });
    document.getElementById("langZhBtn").addEventListener("click", () => {
      lang = "zh";
      try { localStorage.setItem("marsmind_topic_dashboard_lang", lang); } catch {}
      renderAll();
      renderModuleTabs();
      renderModuleTable();
    });
    document.getElementById("resetBtn").addEventListener("click", () => {
      data = structuredClone(originalData);
      localStorage.removeItem(storageKey);
      activeModule = "海外仓";
      renderAll();
      renderModuleTabs();
      renderModuleTable();
    });
    renderAll();
    renderModuleTabs();
    renderModuleTable();
  </script>
</body>
</html>
