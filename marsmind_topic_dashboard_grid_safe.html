"类目/产品能否售卖"},{"时间":"2026-07-18 10:39:02","用户":"菠萝蟑螂","群":"","用户问询":"已经在full仓的产品如何更换类目","AI响应":"已经在Full仓的产品，如果需要更换类目，通常在卖家后台的Listing编辑页面进行操作。当您在卖家后台开始编辑商品并输入产品标题或关键词时，系统会通过类目预测器推荐正确的类目。\n\n此外，在选择类目时，建议您同时参考平台在售的同类型产品所在的类目，以确保选择最为精准。\n\n网页参考资料：\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260125/166fca879b5844ddb33c70275e2ba08b.png","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-17 20:31:59","用户":"蓝七","群":"","用户问询":"我在哪里可以看到该类目或者该产品的销售情况呀","AI响应":"你好！您可以在卖家后台左侧菜单栏点击 Listings，进入页面后可以查看各产品的曝光情况。若需查看整体销量，请前往 Sales 模块查看。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-17 10:56:43","用户":"sincere","群":"","用户问询":"请问一下选的类目是 为什么平台会显示我选错类目","AI响应":"你好！从图片看，你选择的是“钓鱼装备”下的“衬衫”。如果你的产品是普通日常衬衫而非专业钓鱼服，平台会判定为类目错放。建议通过搜索标签导航分类树，重新选择更精准的服装类目。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-16 16:54:23","用户":"猜猜","群":"","用户问询":"就是不能随意上在健康类目没有资质都不可以","AI响应":"是的，您的理解非常准确。\n\n医疗与健康类目属于平台重点监管的范畴。如果没有获得特定的资质授权，随意上架药品、保健品或医疗器械类商品，不仅会导致产品被下架，还可能面临账号受限的风险。\n\n建议您在上传此类商品前，务必确认已获得相关站点的准入资质，并仔细核对官方禁售品清单。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-16 13:56:19","用户":"孫明山","群":"","用户问询":"店铺多类目状态下，是否影响店铺权重？","AI响应":"你好！很高兴为你解答。\n\n美客多店铺属于全类目经营模式，一个店铺可以同时售卖不同类目的产品。在多类目经营状态下，并不会直接影响店铺的整体权重。\n\n店铺权重的核心影响因素是您的店铺信誉（Reputation），这主要取决于您的订单投诉率、发货延迟率以及订单取消率。只要您能保证各个类目产品的服务质量和物流时效，多类目经营是不会对店铺产生负面影响的。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-15 16:14:30","用户":"敏","群":"","用户问询":"数码相机类目的佣金会一直维持在11%吗","AI响应":"你好。目前数码相机类目的佣金比例为11.5%。平台佣金政策可能会根据市场情况进行调整，建议定期关注卖家后台或官方公告以获取最新费率信息。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-15 10:29:11","用户":"陈平安","群":"","用户问询":"还有什么类目可以放这个小风扇的呢","AI响应":"除了之前提到的类目，你还可以尝试以下路径：\n\n**Home, Furniture & Garden > Home Appliances > Air Conditioning > Fans**\n\n或者在墨西哥站点搜索：\n**Hogar, Muebles y Jardín > Electrodomésticos > Climatización > Ventiladores**\n\n只要确保包含 **Ventiladores**（风扇）关键词即可。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-14 14:43:45","用户":"Rosa Chen（家居家具汽摩配full仓）","群":"","用户问询":"经理，我这边有个产品想更改类目，请问怎么操作","AI响应":"你好！很高兴为你解答。更改产品类目的操作步骤如下：\n\n1. 登录卖家后台，进入 Listing 管理页面。\n2. 找到需要修改类目的产品，点击编辑。\n3. 在类目选择部分，您可以重新搜索并选择更精准的类目。\n\n在选择类目时，请参考：平台在售的同类型产品所在的类目，或使用类目预测器，通过关键词检索正确类目。\n\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260125/166fca879b5844ddb33c70275e2ba08b.png","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-19 20:16:09","用户":"价值2","群":"","用户问询":"美客多哪个类目好做？","AI响应":"你好！美客多墨西哥站点的大件商品如家居、家具、健身器材和汽车配件等领域增长迅速。此外，轻小件、高利润的电子产品、服饰及生活用品也是热门类目。建议结合你的供应链优势，参考热搜词页面选择潜力品类。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-19 18:30:18","用户":"林世远Ada","群":"","用户问询":"木工铣刀有对应的类目主管联系吗","AI响应":"你好！目前无法直接提供类目主管的联系方式。建议你先通过全托管链接提交入驻申请，审核通过后，平台会根据你的品类分配对应的买手或经理与你联系。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-19 15:09:35","用户":"纳洛童","群":"","用户问询":"cos是在哪个类目？","AI响应":"你好！很高兴为你解答。COS服装建议选择以下类目路径：\n\n**Fashion, beauty, CPG (consumer packaged goods), others**\n\n节日COS服装是销量占比极高的细分类目，建议根据产品属性进一步细化至对应的服装或派对用品子类目中。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-18 12:18:52","用户":"纳洛童","群":"","用户问询":"在墨西哥是什么类目？","AI响应":"你好！很高兴为你解答。你提供的图片显示该产品为“迷你球形按摩器”，在墨西哥站点通常属于以下类目：\n\n**Salud y Equipamiento Médico > Masajeadores > Eléctricos**\n\n需要注意的是，按摩器在墨西哥属于敏感类目，建议在描述中强调“运动放松”或“美容”属性，避免使用医疗康复类词汇，以降低审核风险。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-17 14:39:44","用户":"Eiiiii","群":"","用户问询":"我要上女款皮夹克 用什么类目？","AI响应":"你好！很高兴为你解答。建议参考平台在售同类产品类目，或使用类目预测器通过关键词检索。精准类目能让Listing最大程度获取搜索流量。\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260125/166fca879b5844ddb33c70275e2ba08b.png","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-17 10:38:25","用户":"啊邝","群":"","用户问询":"有类目群或者官方的通知群吗","AI响应":"你好！很高兴为你解答。\n\n美客多官方针对不同类型的卖家和需求设有专门的交流群，你可以根据自己的情况选择加入：\n\n1. **入驻及开店咨询群**：\n如果你是准备入驻的卖家，可以扫描下方二维码或点击链接填写入驻表单，提交后在成功页面通常会有进群方式。\n活动专属入驻链接：https://28151754.beschannels-plus.com/forms/9SU4ZJW?wechat=9XU4ZET&utm_event=FZ0626\n\n2. **官方交流群**：\n你可以添加官方小助手，由小助手引导你进入对应的官方交流群，以便获取最新的运营资料和入驻进展查询。\n\n3. **官方资讯渠道**：\n建议关注美客多官方订阅号“美客多拉美销售”，平台的所有政策更新、类目指南和活动通知都会第一时间在公众号发布。\n\n请注意，为保证群内环境，建议在填写入驻表单或进群申请时，备注您的真实信息。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-16 22:31:09","用户":"Echo","群":"","用户问询":"键鼠类目有流水要求吗","AI响应":"目前平台政策已更新，普通自发货和海外仓模式入驻不需要流水。但如果您申请的是全托管或半托管模式，仍需满足流水要求。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-16 21:29:07","用户":"Vinson","群":"","用户问询":"为什么汽配类目可以200个字符","AI响应":"目前无法直接判断汽配类目字符数限制的具体原因。建议优先核查卖家后台发布产品时的实时提示，或咨询对应类目经理确认该类目的特殊规则。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-16 17:48:47","用户":"猜猜","群":"","用户问询":"脚垫上在什么类目","AI响应":"脚垫的类目选择取决于您的产品具体用途：\n\n1. 汽车脚垫：\nAccesorios para Vehículos > Accesorios de Interior > Alfombras\n\n2. 浴室脚垫：\nHogar, Muebles y Jardín > Baños > Alfombras para Baño\n\n3. 门口/居家装饰脚垫：\nHogar, Muebles y Jardín > Textiles de Hogar y Decoración > Alfombras\n\n建议您在上传时使用类目预测器，通过输入具体的关键词（如汽车脚垫或浴室脚垫）来检索最精准的类目。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-16 17:02:29","用户":"猜猜","群":"","用户问询":"药盒收纳盒可以放在哪个类目","AI响应":"药盒收纳盒建议放置在以下类目路径：\nHogar, Muebles y Jardín > Organización para el Hogar > Organizadores de Medicamentos\n\n或者：\nSalud y Equipamiento Médico > Movilidad > Pastilleros\n\n请注意，虽然是收纳类产品，但如果描述中涉及过多的医疗功效，可能会触发类目审核，建议以居家收纳属性为主进行描述。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-16 15:46:33","用户":"施夷光","群":"","用户问询":"后杠反光片上什么类目","AI响应":"建议上架至：Accessories for Vehicles > Spare Parts Cars and Trucks > Lighting > Reflectors。请确保产品不涉及品牌侵权。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-16 14:20:35","用户":"猜猜","群":"","用户问询":"舌苔刷选择什么类目","AI响应":"舌苔刷建议放置在以下类目路径：\nBelleza y Cuidado Personal > Higiene Personal > Higiene Bucal > Limpiadores de Lengua","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-16 14:03:47","用户":"施夷光","群":"","用户问询":"气门嘴上什么类目","AI响应":"建议上架至：Accessories for Vehicles > Spare Parts Cars and Trucks > Tires > Valves。请确保产品不涉及品牌侵权。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-16 13:55:35","用户":"孫明山","群":"","用户问询":"美客多店铺更换类目，如何操作？","AI响应":"你好！很高兴为你解答。\n\n美客多店铺不需要手动更换类目。店铺的类目是根据你发布的产品自动确定的。如果你想经营其他类目的产品，直接在发布新产品时选择对应的正确类目即可。\n\n如果你是指修改已发布产品的类目，可以在卖家后台的 Listing 页面找到对应产品，点击编辑并修改其分类。如果系统限制无法直接修改，建议删除该产品并使用正确的类目重新发布。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-16 13:22:18","用户":"勇往直前","群":"","用户问询":"图册书可以上到玩具类目吗","AI响应":"你好！很高兴为你解答。\n\n图册书通常建议放在书籍类目。如果该图册书具有明显的玩具属性（如立体书、洗澡书、拼图书等），可以尝试放在玩具类目下的相关子类目。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-15 16:38:26","用户":"秋天","群":"","用户问询":"就是他是不限类目的，对吧？","AI响应":"是的，美客多不限制经营类目。除了平台禁售品外，您可以在店铺内售卖不同类目的产品，上传产品时选择对应的正确类目即可。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-15 12:27:52","用户":"GETIWEI","群":"","用户问询":"这个的类目的没有对应的尺码表吗","AI响应":"你好！是的，在尺码表创建页面，如果找不到你选的那个长路径类目，请直接选择 **T-shirts** 即可。POLO衫的尺码表是通用的，创建完成后生成的代码填入表格即可正常使用。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-15 00:34:31","用户":"joker","群":"","用户问询":"足球鞋应该上在哪个类目？","AI响应":"足球鞋核心类目路径为：Apparel, Shoes & Accessories > Shoes > Sneakers。\n\n选择精准类目能最大程度获取搜索流量，若类目选择错误会触发曝光限制。Listing上架后无法修改类目，请在上传时通过类目预测器或参考同类在售产品确保选择准确。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-14 15:10:48","用户":"施夷光","群":"","用户问询":"车牌框上什么类目","AI响应":"建议上架至：Accessories for Vehicles > Spare Parts Cars and Trucks > Bodywork > License Plate Frames。请确保产品不涉及品牌侵权。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"},{"时间":"2026-07-14 13:52:58","用户":"对方正在输入...","群":"","用户问询":"马克杯上什么类目","AI响应":"上架马克杯时，请参考以下路径选择类目：\n\nHogar, Muebles y Jardín > Cocina > Vajilla y Artículos de Servir > Vajilla > Tazas\n\n选择类目时的注意事项：\n1. 描述细节：明确马克杯的容量（如 330ml）、材质（如陶瓷、骨瓷）、尺寸以及是否适用于微波炉或洗碗机。\n2. 包装保护：马克杯属于易碎品，请务必使用加厚的防震包装（如气泡膜、泡沫盒），以降低运输破损率。\n3. 属性填写：如果是套装，请在标题和属性中注明包含的数量。\n\n请注意，Listing上架后无法修改类目，请在发布前仔细核对。","一级大类":"产品管理","二级子类":"类目咨询","问题主题":"类目/产品能否售卖"}]},{"一级大类":"其他","二级子类":"买家纠纷","Past 7 Days":106,"Previous 2026-07-06 to 2026-07-12":101,"Change":5,"WoW":0.04950495049504951,"Past 7 Share":0.015386848599216142,"高频问题":"买家纠纷/客诉/售后","__details":[{"时间":"2026-07-18 16:21:37","用户":"邓欢","群":"","用户问询":"{\"subMsgDesc\":\"\",\"subMsgList\":[{\"subMsgSenderId\":\"0\",\"subMsgSenderCorpId\":0,\"subMsgId\":\"\",\"subMsgType\":14,\"subMsgSenderAvatar\":\"\",\"subMsgSenderName\":\"\",\"subMsgSenderCorpName\":\"\",\"subMsgFromId\":\"0\",\"subMsgData\":{\"filename\":\"企业微信截图_17843628709342.png\",\"fileAesKey\":\"339793956e862368b706a6c3b7123ad5\",\"fileSize\":123641,\"width\":734,\"fileMd5\":\"b347bb9d7d263ede85e41e1c0d436037\",\"fileId\":\"306b02010204643062020100020480c1323202030f424102049cd366b402046a5b378f042466376265363866352d326236342d346138642d393063652d3537646434356666363861340203102000020301e3000410b347bb9d7d263ede85e41e1c0d4360370201010201000400\",\"height\":860,\"imageHasHd\":true},\"subMsgTimestamp\":0},{\"subMsgSenderId\":\"0\",\"subMsgSenderCorpId\":0,\"subMsgId\":\"\",\"subMsgType\":2,\"subMsgSenderAvatar\":\"\",\"subMsgSenderName\":\"\",\"subMsgSenderCorpName\":\"\",\"subMsgFromId\":\"0\",\"subMsgData\":{\"reply\":{},\"atList\":[],\"moreDetail\":[{\"subtype\":0,\"text\":\"这些售后的订单的货物退到哪里了\"}],\"content\":\"这些售后的订单的货物退到哪里了\"},\"subMsgTimestamp\":0}],\"subMsgFlag\":0}","AI响应":"全托管售后退回的货物，若符合二次销售要求，会重新入库上架销售；若无法二次销售，则由平台统一处理，目前不支持退回给卖家。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-16 11:19:02","用户":"wd","群":"","用户问询":"在处理售后的时候可以给顾客发送我的邮箱吗？我需要他的视频","AI响应":"你好！很高兴为你解答。\n\n在售后处理中，**严禁**在对话框中发送个人邮箱、电话或社交账号等站外联系方式，这会被平台判定为引导线下交易，导致店铺违规甚至封号。\n\n如果需要买家提供视频，你可以告知买家直接在美客多后台的售后聊天界面上传。如果视频过大无法上传，建议引导买家将视频上传至云端硬盘（如Google Drive），并在此处分享链接。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-16 16:42:04","用户":"大山","群":"","用户问询":"跨境卖家，选择怎么样的退货和售后模式比较好","AI响应":"建议优先选择海外仓（Full）模式。该模式下，平台负责处理大部分售后和退货，能显著降低沟通成本。若发生退货，商品会退回官方仓，经质检合格后可重新上架销售，最大程度减少损失。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-18 18:27:42","用户":"其良_LYNN","群":"","用户问询":"那容易产生售后吗","AI响应":"自发货模式下，由于跨境运输链路长、时效慢且物流信息更新可能不及时，相比海外仓确实更容易产生因物流延迟、包裹丢失或破损导致的售后纠纷。建议选择优质物流承运商并及时回复买家咨询，以降低纠纷率。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-14 10:01:36","用户":"君","群":"","用户问询":"订单 #2000013507109553 这一个订单，买家是说因为包裹湿了导致商品无法使用，这种情况我们还能获得货款吗？","AI响应":"你好！很高兴为你解答。\n\n针对订单 #2000013507109553 的情况，是否能获得货款取决于平台的最终裁决：\n\n1. 如果买家发起了投诉并提供了包裹湿损的证据，且平台判定为物流运输过程中的责任（非包装不当），平台通常会退款给买家，并对卖家进行赔付，即你依然可以获得该笔货款。\n2. 如果买家无法提供证据，或者平台判定是因为你的包装过于简陋导致无法抵御常规运输环境中的潮气，那么损失可能需要由卖家承担，你将无法获得货款。\n\n目前买家未提供照片，建议你不要主动退款。如果买家开启纠纷，请在纠纷中申明包裹在发货时状态完好，并要求平台核实物流运输轨迹中的异常。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-15 18:30:39","用户":"。","群":"","用户问询":"售后怎么处理","AI响应":"平台处理退款退货的方式包括：全额退款、部分退款、换货等，具体取决于情况和平台政策。\n\n关于客户要求退款但不退货的情况，平台的处理方式如下：\n\n平台处理原则\n美客多平台在处理此类纠纷时，通常会遵循公平原则，既要保护买家权益，也要保障卖家的合法权益。平台不会轻易支持\"只退款不退货\"的要求。\n\n处理流程\n1. 协商解决：平台会首先建议买卖双方协商解决，比如部分退款或退货退款。\n2. 证据审核：如果协商不成，平台会要求双方提供相关证据（如聊天记录、商品照片等）。\n3. 公正裁决：基于证据和平台政策，客服会做出最终裁决。\n\n卖家应对建议\n· 及时与买家沟通，尝试协商解决方案。\n· 保留所有聊天记录和交易证据。\n· 如果买家无理要求，可以拒绝并申请平台介入。\n· 通过卖家后台的纠纷处理系统提交您的证据和说明。\n\n退货政策参考\n平台有明确的退货政策规定，正常情况下退款需要伴随退货流程。如果买家坚持不退货，您可以引用平台的退货政策来维护自身权益。\n\n建议您先与买家友好沟通，如果无法达成一致，及时通过官方纠纷处理渠道寻求平台客服的介入和裁决。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-17 16:53:05","用户":"纯属巧合","群":"","用户问询":"成交订单是客户下单就算吗， 还是说买家已确认收货的订单？怎么查看已经完成的订单？","AI响应":"你好！很高兴为你解答。\n\n成交订单并不是客户下单就算，而是指已经完成且没有被取消的订单。\n\n1. 成交订单的定义：\n通常是指买家已签收且未发生退款、取消的订单。如果订单在运输中或被买家中途取消，是不计入完成订单数的。\n\n2. 如何查看已经完成的订单：\n你可以通过以下步骤在卖家后台查看：\n- 进入后台的 Orders（订单）页面。\n- 在订单状态筛选栏中，选择 Finalized（已完结）。这个状态下的订单即为已经完成的订单。\n- 你也可以点击 Download Orders Excel File 下载订单报表，在表格中筛选状态为已签收或已完结的订单进行统计。\n\n需要注意的是，在计算 MercadoLeader 晋升要求时，系统会自动剔除那些因为纠纷退款或卖家原因取消的订单。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-16 10:57:38","用户":"爱喝咖啡的懒人","群":"","用户问询":"我之所以说我可以为你申请，是因为这单是有退货选择的，我可以点，在这种情况还是需要客户操作吗","AI响应":"你好！很高兴为你解答。\n\n这是一个非常关键的操作细节，说明如下：\n\n**1. 必须由客户操作的情况：**\n即便你后台有“Offer return”按钮，最好的流程依然是**引导客户在订单界面点击“Return”**。因为只有客户主动发起退货，系统才会判定为“买家意愿退货”，这有助于你在后续申诉中主张“非卖家过错”，从而保护信誉分。\n\n**2. 你点击“Offer return”的效果：**\n如果你直接点击，系统会立即向买家发送退货标签。这确实省去了客户申请的步骤，但**在系统逻辑里，这等同于你“承认了产品有问题”并主动接受退货**。\n\n**3. 为什么建议引导客户操作：**\n*   **拦截白嫖**：很多想白嫖的客户看到要自己操作退货、打包、去邮局，可能因为嫌麻烦就撤销投诉了。\n*   **保护信誉**：客户操作退货时选择的原因（如：我不想要了/尺码不对）如果不是质量问题，对你更有利。\n\n**总结建议：**\n你可以回复客户说：“我已经准备好为您处理退货了，请您在系统点击退货申请，我会立即通过。”如果客户回复说不会操作，你再手动点击 **“Offer return”**。这样既体现了服务态度，又留了回旋余地。\n\n网页参考资料：https://global-selling.mercadolibre.com/help/21258","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-13 11:57:59","用户":"周政翔","群":"","用户问询":"如果不是歧视，那为什么说用买家账号登入就可以？凭什么卖家就不能看。 是平台有猫腻吗？","AI响应":"你好！这并非平台有猫腻或歧视，而是因为卖家后台与前台买家页面属于不同的系统逻辑。\n\n卖家账号主要用于店铺管理，受限于网络环境或系统安全校验，有时直接访问前台会触发报错。建议你使用 Chrome 浏览器无痕模式，在不登录卖家账号的情况下直接访问前台页面查看市场。目前人工咨询量巨大，请见谅。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-17 17:59:24","用户":"蟹黄堡","群":"","用户问询":"重新刷新了，退货的可以填写，但是这个取货的一直没发填，是什么原因呀？","AI响应":"目前无法直接判断具体原因。建议您核查该地址是否在菜鸟揽收范围内，或尝试更换浏览器、清除缓存后重试。若仍无法填写，需联系后台确认。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-16 11:17:50","用户":"悠","群":"","用户问询":"因为产品质量产生退货，但是已退货退款，但没有标识影响声誉呢，会影响吗","AI响应":"如果后台没有标识该订单影响声誉，则不会计入信誉等级考核。但频繁的质量退款仍可能影响链接的购物体验分，建议持续关注后台指标变化。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-16 10:16:16","用户":"壹号国际-Jason","群":"","用户问询":"没有影响我的声誉投诉 如果申请要平台介入调解会有声誉影响吗@美客多-客服","AI响应":"从截图看，该投诉目前标记为“未影响您的声誉”。如果申请平台介入，平台会根据双方证据裁定。若最终判定卖家无责，则不会影响声誉；若判定卖家有责，则可能产生影响。建议优先与买家协商解决。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-15 11:46:34","用户":" John","群":"时骏科技-美客多助手","用户问询":"@美客多小助手萝拉 这个CPF是不是要买家自己提供的信息？不关我们卖家的事","AI响应":"你好！很高兴为你解答。\n\n是的，CPF是巴西买家的个人税号，类似于身份证号。在巴西购买跨境商品时，买家必须提供有效的CPF信息，以便进行海关申报和缴纳相关税费。\n\n如果买家的CPF状态异常或者没有在平台正确填写，就会导致无法下单或无法配送。这属于买家个人信息的合规性问题，确实不需要卖家操作，您可以引导买家检查其账号中的CPF信息是否处于正常注册状态。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-14 17:37:07","用户":"岑浩特","群":"","用户问询":"订单是5月份完成的，买家昨天给的差评，这么长时间了 买家还可以删除或修改差评吗","AI响应":"买家可以修改或删除评价。建议您积极回复评论并尝试联系买家解决问题，通过良好的售后服务引导买家主动调整评价。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-14 11:39:07","用户":"Michael-拾荒的小男孩","群":"","用户问询":"收到货后的免费退货有效期在表格里没有提及，是不是平台默认有设置好多少天的？","AI响应":"你好！很高兴为你解答。\n\n是的，收到货后的免费退货有效期不需要卖家在表格中自行设置，这是由平台统一规定的。\n\n根据美客多的买家保障政策（Compra Protegida），买家在收到商品后通常拥有 30 天的免费退货期。只要商品保持原样，买家就可以在此期限内申请退货。这部分规则是平台默认执行的，旨在提升买家的购物信心。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-14 11:31:12","用户":"Michael-拾荒的小男孩","群":"","用户问询":"上传表格里的Warranty time 批是的收到货后退货有效期吗","AI响应":"你好！很高兴为你解答。\n\nWarranty time 并不是指收到货后的退货有效期，而是指产品的保修时间。\n\n这是你作为卖家向买家承诺的，在产品出现非人为质量问题时提供维修或退换服务的期限。在填写时，请根据你产品的实际质量保证情况来设定。\n\n网页参考资料：\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260125/166fca879b5844ddb33c70275e2ba08b.png","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-19 11:13:33","用户":"勇往直前","群":"","用户问询":"由于买家未回应退款提议，我们关闭投诉并退款给您 这个是什么意思","AI响应":"你好！很高兴为你解答。这意味着在纠纷处理过程中，买家未在规定时间内对退款提议做出回应，平台已介入并主动关闭投诉，将款项退还给买家。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-17 14:44:20","用户":"iee","群":"","用户问询":"退款通常作为单独的扣款项在明细中列出。是什么意思","AI响应":"你好！意思是在结算明细表中，退款不会直接从原始销售额里减去，而是会作为一笔独立的负数金额记录在扣款项中。最终的回款金额是总销售额减去退款、佣金、运费等各项扣款后的净值。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-16 11:16:52","用户":"悠","群":"","用户问询":"因为产品质量产生退货，但是已退货退款呢，会影响吗","AI响应":"这种情况虽然已退款，但该投诉仍会被计入购物体验分的考核中。卖家需重视完善Listing描述并加强质检，避免因信息不准或质量问题引发此类投诉。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-13 17:12:13","用户":"晨夕","群":"","用户问询":"fti卖家，有什么标识？ 买家怎么知道是不是fti","AI响应":"你好！很高兴为你解答。\n\n在美客多前台页面，买家并不会直接看到“FTI”这三个字母，因为这是平台内部的项目名称。但是，FTI店铺的商品会通过以下方式向买家展示其“与众不同”的身份和官方背书：\n\n1. **官方店铺背书（Official Store）**：\nFTI卖家作为平台的VIP合作伙伴，通常会获得“Official Store”（官方旗舰店）的标识。在搜索结果页和产品详情页，买家能看到醒目的官方店标签，这代表了平台对你产品质量和供应链能力的最高认可。\n\n2. **绿色信誉等级（Green Shield）**：\nFTI店铺通常直接拥有最高等级的绿色信誉标识。在拉美市场，买家非常看重卖家的信誉等级，绿色盾牌意味着极高的发货可靠性和售后保障。\n\n3. **专属流量入口与活动标识**：\nFTI商品会优先进入平台的大促活动频道（如Hot Sale、Black Friday），并带有专属的折扣标签或活动角标。买家在浏览这些官方推荐位时，自然会感知到这些商品是经过平台筛选的优质货源。\n\n4. **更具竞争力的价格展示**：\n由于FTI享有8%的超低佣金和20%的运费补贴，你在前台展示的价格通常会比同类跨境商品更具吸引力。买家虽然不知道你是FTI，但他们能直观地看到你的产品“大牌、官方、且价格更优”。\n\n**总结：**\n买家是通过**“官方店标签+绿色高信誉+更优的价格”**这三点来识别并信任你的。这种官方背书对于你销售79美金的高客单价吉他效果器非常有帮助，能显著降低买家的下单顾虑。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-19 21:40:11","用户":"蓝色星空","群":"","用户问询":"可以选择不用退货仅退一部分款吗？","AI响应":"你好！很高兴为你解答。美客多并非强制仅退款。如果你有本地退货地址，可以要求买家退货；若未填地址，在纠纷中可能被迫仅退款。具体协商方案建议通过后台纠纷工单与买家沟通。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-19 15:58:05","用户":"灯火星星","群":"","用户问询":"平台有没有地方可以查看到买家搜索词热度？","AI响应":"你好！很高兴为你解答。平台提供美客多各站点热搜词工具，你可以通过以下链接查看：\nhttps://tendencias.mercadolibre.com.mx/\n此外，你也可以参考 Google Keyword Planner 进行调研。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-18 19:14:57","用户":"Dford","群":"","用户问询":"另外，请问买家12号就签收了，但钱在哪里？","AI响应":"你好！很高兴为你解答。买家签收后，货款通常会先进入“待结算”状态。对于跨境卖家，平台一般在订单签收后的 28 天左右将款项结算至您的美客多账户。您可以登录卖家后台，在“Payments”或“Money”板块查看具体的账期和预计入账时间。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-18 10:30:57","用户":"一花一草","群":"","用户问询":"美客多后台是否可以设置给客户部分退款了","AI响应":"你好！很高兴为你解答。美客多后台支持自动部分退款功能。你可以参考以下文档了解具体的操作流程和设置方法：\n\n网页参考资料\nhttps://doc.weixin.qq.com/pdf/d3_ARIAagYiAMICN5QzxCVQdTRmdC6gC?scode=AI8A3wfvAAotfooSbE","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-17 17:38:36","用户":"j、","群":"","用户问询":"那为什么客服老是要我提供退货地址","AI响应":"你好！很高兴为你解答。设置退货地址是平台要求。若不填写，自发货纠纷中你将无法要求买家退货，只能被迫仅退款；海外仓退货若无地址，20天后商品会被销毁。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-17 12:08:37","用户":"A   大华","群":"","用户问询":"客服这样回复，怎么回复他 ，让他收到货后给好评","AI响应":"你好！很高兴为你解答。\n\n看到买家这么满意，确实是索要好评的好机会。你可以参考以下回复话术（建议使用当地语言，这里以西班牙语为例）：\n\n¡Muchas gracias por tu comentario! Nos alegra mucho saber que es exactamente lo que buscabas. Si estás satisfecho con el producto al recibirlo, te agradeceríamos mucho si pudieras dedicarnos un minuto para dejarnos una reseña positiva de 5 estrellas. Tu apoyo es muy importante para nosotros. ¡Que disfrutes tu compra!\n\n中文大意：非常感谢你的反馈！很高兴知道这就是你想要的。如果你收到货后对产品满意，如果你能花一分钟给我们一个五星好评，我们将不胜感激。你的支持对我们非常重要。祝你购物愉快！\n\n提醒一下，索评要委婉，不要使用物质奖励（如返现、送礼）来诱导好评，以免违反平台规则。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-16 01:34:37","用户":"飞哥","群":"","用户问询":"为什么会有一个30天 免费退货期","AI响应":"你好！很高兴为你解答。这是美客多平台的买家保障政策，所有买家在收到商品后均享有30天的免费退货期。这有助于提升买家购物信心和转化率。关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-15 18:14:24","用户":"o泡果奶","群":"","用户问询":"如果买家主动向我发起对话有通知吗","AI响应":"当买家向你发起对话时，卖家后台会有消息提醒。建议你定期登录后台查看 Sales 下的 Orders 页面，及时处理 Messages 中的未读消息，以免错过买家的咨询或售后需求。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-15 18:13:35","用户":"o泡果奶","群":"","用户问询":"在哪里可以看到买家对我发起的对话","AI响应":"你可以登录卖家后台，在左侧菜单栏点击「Sales」-「Orders」，找到对应的订单后，点击订单右侧的「Messages」即可查看并回复买家发起的对话。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-15 13:02:17","用户":"sunny","群":"","用户问询":"娜娜，那个深圳沙田菜鸟退货的联系方式是什么？","AI响应":"美客多托管备货仓（位于东莞沙田）的退仓提货联系方式如下：\n\n仓库地址：广东省东莞市沙田镇进港南路周大福物流东莞物流中心205号库台\n联系人：叶宗虎\n联系电话：18269399433（白班 袁杰：18018715994；晚班 李达红：18825215759）\n可接受货物时间：周一到周日，9:00am-18:00pm\n\n提货注意事项：\n请务必与提货人沟通好，到仓后需向工作人员说明清楚【提货类型+提货单号】，例如：\n1. 到仓异常件自提 + IC单号或商家订单号\n2. 退仓提货 + 报OC提货码\n3. 无主件 + 物流单号","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-14 19:33:56","用户":"岑浩特","群":"","用户问询":"买家初次评价后有几天时间内可以再次修改评价？","AI响应":"买家在初次评价后的 60 天内可以对评价进行修改或删除。建议您在此期间积极与买家沟通协商。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-14 11:38:56","用户":"95后一场梦","群":"","用户问询":"您好，各站点的退货地址可以 以什么方式获取呢？","AI响应":"你好！很高兴为你解答。\n\n关于退货地址的获取方式，建议如下：\n\n1. 如果你在墨西哥或其他站点有合作的第三方海外仓，可以直接联系服务商获取他们在当地的仓库地址信息。\n2. 如果你目前没有当地的退货仓库，建议联系第三方物流商获取本土退货地址。\n\n设置退货地址的步骤如下：\n1. 登录您的 Global Selling 账户。\n2. 进入 Settings（设置） > Selling Preferences（销售偏好设置）。\n3. 选择对应的站点及物流模式。\n4. 点击 “Add return address（添加退货地址）”。\n5. 在此处填写您从服务商处获得的当地地址信息并保存。\n\n强烈建议你尽快填写退货地址。对于自发货模式，未填地址将导致你在纠纷中无法要求退货，只能被迫“仅退款”；对于海外仓卖家，若退货地址留空，退货商品将被送至 Mercado Libre 仓库，你必须在20天内自行提取，否则商品将被捐赠或销毁。\n\n网页参考资料：\nhttps://global-selling.mercadolibre.com/learning-center/news/how-do-i-set-my-local-return-address","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-14 10:49:02","用户":"゛大梦三生゛","群":"","用户问询":"怎么引导买家正确说明可以部分退款","AI响应":"你好！你可以通过后台纠纷系统或聊天工具与买家友好协商，说明由于缺少配件，愿意补偿部分金额作为补偿，买家无需退货即可继续使用。若达成一致，可在纠纷处理页面选择部分退款选项。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-13 14:26:43","用户":"迷迷 苏","群":"","用户问询":"半托备货东莞仓的退货也需要设置退货地址吗","AI响应":"你好！很高兴为你解答。\n\n必须填写退货地址。若退货地址空缺，Full仓退货在20天内未提取将被自动捐赠或销毁。如果你有本地退货地址，可以要求买家退货。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-13 14:25:21","用户":"迷迷 苏","群":"","用户问询":"美客多支持全新没用过的商品客户退货吗？","AI响应":"你好！很高兴为你解答。\n\n美客多支持客户退货。根据平台的退货政策，买家在收到商品后的规定时间内（通常为30天）可以发起退货申请。\n\n当买家发起退货后，商品会退回到美客多官方仓库。仓库工作人员会对退回的商品进行质检。如果商品品相完好、包装完整且不影响二次销售，系统会自动将其重新计入您的可售库存中，并再次上架销售。\n\n如果商品在质检过程中被判定为损坏、包装破损或已使用，该商品将被标记为不可售库存。对于不可售库存，平台不会自动进行二次销售，你需要通过后台的库存管理页面选择将这些商品提取。若不可售商品在仓库停留超过规定时间且未被提取，平台将会对商品进行捐赠或销毁处理。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-13 10:50:56","用户":"幸运🍀","群":"","用户问询":"买家收到货30天内可以无理由退款对吗","AI响应":"你好！很高兴为你解答。是的，买家在收到商品后的30天内享有无理由退货的权利，这是平台保障买家权益的政策。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-13 10:20:49","用户":"j、","群":"","用户问询":"在个案中与客户协商退款30%后如何操作退款","AI响应":"你好！很高兴为你解答。平台处理退款退货的方式包括全额退款和部分退款。在纠纷处理界面，你可以选择部分退款选项并输入协商好的金额。如果后台没有直接显示部分退款按钮，建议通过“Contact Mercado Libre”联系客服介入，协助按协商金额完成操作。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-13 10:18:51","用户":"j、","群":"","用户问询":"如图，如何在纠纷中按与客户协商的退款30%","AI响应":"你的问题我暂时无法回答，后续我会丰富我的知识库，敬请见谅。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-18 17:26:04","用户":"ㅤ","群":"","用户问询":"这种怎么同意退款","AI响应":"你的问题我暂时无法回答，后续我会丰富我的知识库，敬请见谅。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-18 10:28:08","用户":"一花一草","群":"","用户问询":"是否可以让客户自己取消投诉了","AI响应":"你好！可以引导客户在解决问题后手动关闭投诉。如果客户在投诉开启后的48小时内撤销或关闭投诉，则不会影响您的店铺声誉。若已超过48小时，即使客户取消，该记录通常仍会计入负面指标。建议您尽快与客户协商达成一致。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-17 22:15:54","用户":"蓝七","群":"","用户问询":"这个目录搜索不出来怎么处理呀","AI响应":"你好！如果通过通用代码在搜索引擎中找不到您的产品，说明该产品不在目录中。您需要在电子表格中手动填写所有标记为“Required”的必填细节。建议填写所有字段，以便买家更清晰地了解产品。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-17 20:03:14","用户":"蓝七","群":"","用户问询":"这两个的差别是？","AI响应":"你好！Units per pack 是指一个销售单位（Pack）里包含的产品数量；Units per package 是指买家收到的一个包裹里包含的产品数量。对于六个装的产品，两处通常都填写 6。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-17 18:49:14","用户":"桥梁道路防撞 不锈钢 铝合金护栏","群":"","用户问询":"美客多的客户投诉电话有吗？","AI响应":"你好！很高兴为你解答。\n\n目前美客多官方没有面向卖家的公开投诉电话。\n\n如果你在入驻或运营过程中遇到问题，可以通过以下渠道寻求帮助：\n\n1. 卖家后台帮助中心：在后台点击 Help 按钮，根据问题分类提交 Case，这是最官方且有效的沟通方式。\n2. 官方公众号：关注“美客多拉美电商”官方公众号，获取最新的政策指引和官方资讯。\n3. 邮件沟通：如果你在入驻过程中收到官方邮件，可以直接回复该邮件进行咨询。\n\n非常抱歉，目前无法为你提供电话联系方式。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-17 15:13:33","用户":"👾","群":"","用户问询":"UP店，如何拉黑买家","AI响应":"你好！很高兴为你解答。\n\n在美客多平台，你拥有自主拉黑恶意用户的权限。你可以通过以下步骤操作：\n\n1. 登录卖家后台，进入订单管理或问答管理页面。\n2. 找到该买家的提问或订单信息。\n3. 在买家信息旁边通常会有选项或图标，点击后选择“屏蔽”或“拉黑”该买家。\n\n平台实行买卖双向评分，系统也会自动识别并屏蔽退货率异常的买家账号，双管齐下保障您的店铺权益。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-17 11:59:00","用户":"Lynn","群":"","用户问询":"遇到恶意买家怎么办","AI响应":"平台实行买卖双向评分，系统会自动识别并屏蔽退货率异常的买家。您也可以自主拉黑恶意用户，具体操作可参考：https://doc.weixin.qq.com/pdf/d3_ARIAagYiAMICN61EPDaOfQiOH8t00?scode=AI8A3wfvAAoZgzJdiWARIAagYiAMI","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-17 10:45:46","用户":"Felicity 103%","群":"","用户问询":"买家端怎么进入啊","AI响应":"你好！很高兴为你解答。各站点前端买家号注册是买家个人行为，我们平台不提供代注册服务。建议你可以自行注册买家账号来体验平台购物流程，了解买家视角，这样对运营店铺会更有帮助。","一级大类":"其他","二级子类":"买家纠纷","问题主题":"买家纠纷/客诉/售后"},{"时间":"2026-07-17 09:15:07","用户":"爱喝咖啡的懒人","群":"","用户问询":"我能否引导他去找客服退货？","AI响应":"你好！很高兴为你解答。\n\n可以引导买家联系客服，但请注意，如果后台没有退货选 ":"你好！很高兴为你解答。\n\n关于你提到的在申请FULL仓（海外仓）时提示“There was an error trying to activate user in FBM”的问题，这通常是由于RFC税号状态或主体一致性验证未完成导致的。\n\n根据平台要求，美客多近期针对墨西哥跨境店铺开展RFC税号主体授权及一致性验证工作。如果你的店铺注册主体与卖家后台绑定的RFC税号主体不一致，或者RFC验证流程尚未完成，可能会导致无法正常激活海外仓权限。\n\n建议你按照以下步骤处理：\n1. 立即自查：登录卖家后台，核实当前绑定的RFC税号主体是否与店铺注册主体一致。\n2. 检查CSF邮箱：确保RFC对应的CSF（纳税状况登记证明）登记邮箱有效，并检查是否收到了平台发送的官方通告邮件。\n3. 完成授权签署：如果收到验证邮件，请务必通过CSF登记邮箱登录并签署《RFC知情授权书》，以确认RFC所有人已正式授权该税号用于你的跨境店铺。\n4. 变更申请：如果需要更换RFC，请及时在后台提交变更申请，并提供新的RFC及对应的CSF文件。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 13:55:52","用户":"Eason丶","群":"","用户问询":"你好这边地址填一个美国第三方海外仓可以吗？还是要填一个墨西哥海外仓","AI响应":"你好！墨西哥站点的退货地址必须填写美国或墨西哥当地的第三方仓地址。若填写美国地址，请确保地址准确且有人签收，否则默认弃置。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 09:59:21","用户":"永胜","群":"","用户问询":"你好，咨询下我现在做巴西本土店，如果要申请FULL仓的话找哪位啊？","AI响应":"你好，表里留下注册邮箱后，就可以咨询我入驻、选品以及运营相关的问题啦。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-13 10:49:13","用户":"彬","群":"","用户问询":"货物已到，可以再重新预约时间吗，箱唛是一样的，仓库可以正常入仓吗？","AI响应":"预约的是到仓时间，一定要记得点确认发货，确认了才是完成发货单。提前一天送达仓库不会拒收。如果没点确认，请尽快在后台尝试操作或新建备货单关联，否则仓库无法识别入库。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 12:00:50","用户":"古💋月","群":"","用户问询":"预约到仓日期是7月16日 实际到仓7月17日 货物会正常入仓吗","AI响应":"一旦预约确定，您最多可以在预约日期前1个工作日内添加或移除最多20%的单位。若实际到仓时间晚于预约日期，建议您提前在后台重新安排预约，以免影响正常入仓。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-19 19:00:27","用户":"cc","群":"","用户问询":"跨店卖家申请FULL仓需要什么条件","AI响应":"你好！很高兴为你解答。\n\nFull仓权限通常由系统根据店铺信誉等级、销售表现和运营合规性自动激活。具体要求如下：\n\n1. 店铺信誉等级：需要处于绿色状态。\n2. 销售表现：建议先通过自发货模式积累销售数据。\n3. 运营合规性：各项运营指标需达到平台标准。\n\n当各项指标达标后，系统会自动在“库存管理”板块开放送仓入口。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-19 18:58:56","用户":"cc","群":"","用户问询":"请问跨境店可以申请full仓码？","AI响应":"你好！很高兴为你解答。\n\n跨境卖家是可以申请Full仓权限的。Full仓权限通常由系统根据店铺信誉等级（需处于绿色状态）、销售表现和运营合规性自动激活。\n\n建议你先通过自发货模式积累数据，当各项指标达标后，系统会自动在“库存管理”板块开放送仓入口。\n\n若你已经获得了权限并准备发货，操作流程如下：\n1. 在卖家后台完成备货计划的创建。\n2. 找到可发货到墨西哥的第三方物流商，先将货物从国内运输到墨西哥本地第三方仓。\n3. 让物流商在物流系统线上预约送仓时间，系统会将货件分配到具体的某个Full仓。\n4. 物流商根据预约的时间和地点按时送仓即可。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-18 15:49:11","用户":"巴达通-巴西本土店铺注册-阿涛","群":"","用户问询":"这会影响我们后续的产品送进full仓吗？","AI响应":"你的问题我暂时无法回答，后续我会丰富我的知识库，敬请见谅。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-18 05:01:13","用户":"楠","群":"","用户问询":"full仓可以售卖的美妆个护产品有哪些呢","AI响应":"你好！Full仓可售卖美妆工具、个护电器、美甲产品等。膏体类产品需用保鲜膜二次加固。但请注意，香水、液体、粉末及医疗器械即便在Full仓模式下，跨境卖家也无法售卖。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-16 17:58:40","用户":"Elvis  Cheung","群":"","用户问询":"墨西哥full仓模式下，卖家的收益如何计算","AI响应":"你好！很高兴为你解答。\n\n在墨西哥Full仓模式下，你的实际收益计算公式为：\n实际收益 = 商品售价 - 平台销售佣金 - 税费 - 配送费用。\n\n需要注意的是，目前的收益计算中不扣除仓储费。建议你使用官方利润计算器进行精准测算：https://global-selling.mercadolibre.com/listings/cost-calculator","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-16 17:56:31","用户":"Elvis  Cheung","群":"","用户问询":"墨西哥full仓模式下，卖家的成本是什么","AI响应":"你好！很高兴为你解答。\n\n在墨西哥Full仓模式下，卖家的主要成本包括：\n1. **商品采购成本**。\n2. **头程运费**：将货物从中国运送至墨西哥仓库的费用。\n3. **平台销售佣金**：根据商品类目收取。\n4. **配送费**：根据商品的重量和尺寸收取的尾程派送费。\n5. **仓储费**：包含存储服务费，若存放超过4个月还需支付长期存储费。\n6. **墨西哥税费**：若未绑定RFC税号，将面临最高36%的代扣税。\n\n网页参考资料：\n海外仓费用说明：https://global-selling.mercadolibre.com/help/15373\n墨西哥RFC税号相关信息：https://mp.weixin.qq.com/s/gLZ3iC9XLqFE4j075JaNSg?from=industrynews&version=4.1.22.6009&platform=win","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-16 13:47:36","用户":"B.","群":"","用户问询":"墨西哥full仓，开广告的模式流程是怎样的？","AI响应":"你好！很高兴为你解答。\n\n墨西哥Full仓开启广告的流程如下：\n\n1. 确认资格：店铺需注册满15天，账户健康状态良好，且有Full仓库存。\n2. 进入后台：登录卖家后台，找到“Advertising”（广告）模块。\n3. 创建计划：点击创建新的广告计划（Campaign），选择您想要推广的Full仓产品。\n4. 设置预算：为计划设置每日最高预算限额。\n5. 设定策略：根据您的目标选择广告策略，例如“增长（Growth）”或“盈利（Profit）”。\n6. 启动监控：系统会自动根据算法在搜索结果页等位置展示您的产品，您可以根据后台数据实时调整预算和策略。\n\n网页参考资料：\nhttps://file.marsmind.cc/boot-admin/mercado/20260508/2052675802303561729.png","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 23:03:54","用户":"Manda","群":"","用户问询":"你好，美客多full仓模式开通需要什么条件？","AI响应":"卖家您好，Full仓权限通常由系统根据店铺信誉等级（需处于绿色状态）、销售表现和运营合规性自动激活。建议先通过自发货模式积累数据，各项指标达标后系统会自动在“库存管理”板块开放送仓入口。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 13:49:37","用户":"猜猜","群":"","用户问询":"你好，你们平台昨天在我下班之后发了一个急单。要求在15号之前发出，我今天预约时间已经预约不到了，请问这个问题怎么解决@美客多托管业务助理","AI响应":"你好！很高兴为你解答。\n\n针对您遇到的预约不到送货时间的问题，建议您尝试以下操作：\n\n1. 持续关注预约系统：预约位会实时更新，建议您多次刷新页面查看是否有其他卖家取消预约而释放出的空位。\n2. 尝试更换承运商：如果您合作的物流商无法约到时间，可以咨询其他有资质的物流商是否还有剩余的预约额度。\n3. 及时反馈：若确实无法在规定时间内完成预约，请通过卖家后台的帮助中心或联系您的客户经理说明情况，避免因延迟发货影响店铺绩效。\n\n非常抱歉，由于我无法直接操作后台系统，建议您尽快通过官方渠道进行报备。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 10:30:25","用户":"Vangogh","群":"","用户问询":"不懂呀，不是可以做full仓的么","AI响应":"你好！很高兴为你解答。\n\n国内营业执照完全可以申请海外仓店铺模式，也就是你提到的Full仓。\n\n在美客多跨境店中，你可以根据自己的业务需求选择不同的发货模式：\n1. 海外仓模式（Full）：你将货物批量运送到美客多位于墨西哥等站点的官方仓库，由平台负责仓储、打包和配送。这种模式物流时效快，能显著提升买家购物体验和转化率。\n2. 自发货模式：由你自行负责从国内发货给买家。\n\n如果你使用国内营业执照申请跨境店并选择墨西哥Full仓模式，通常会涉及墨西哥RFC税号。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-19 23:51:13","用户":"TL","群":"","用户问询":"full仓怎么申请","AI响应":"Full仓权限通常由系统根据店铺信誉等级（需处于绿色状态）、销售表现和运营合规性自动激活。建议先通过自发货模式积累数据，各项指标达标后系统会自动在“库存管理”板块开放送仓入口。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 10:32:20","用户":"Tao Zhu","群":"","用户问询":"full仓有哪些费用？","AI响应":"Full仓费用主要包括：\n1. 销售佣金：根据商品类目收取。\n2. 尾程配送费：根据商品重量和尺寸计算。\n3. 仓储费：包含日常存储服务费。\n4. 长期存储费：针对存放超过120天的库存收取。\n5. 墨西哥税费：涉及RFC相关的代扣税。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-16 20:33:43","用户":"-X","群":"","用户问询":"怎么申请full仓","AI响应":"Full仓权限通常由系统根据店铺信誉等级（需处于绿色状态）、销售表现和运营合规性自动激活。建议先通过自发货模式积累数据，各项指标达标后系统会自动在“库存管理”板块开放送仓入口。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-16 17:16:16","用户":"Elvis  Cheung","群":"","用户问询":"如何拿到full仓资格","AI响应":"你好！Full仓权限通常由系统根据店铺信誉等级（需处于绿色状态）、销售表现和运营合规性自动激活。建议先通过自发货模式积累数据，各项指标达标后系统会自动在“库存管理”板块开放送仓入口。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 17:03:49","用户":"iee","群":"","用户问询":"full仓怎么设置单个优惠券","AI响应":"卖家您好，Full仓设置单个优惠券的操作路径如下：\n\n1. 登录卖家后台，进入 **Advertising**（广告/促销）模块，选择 **Promotions**（促销）。\n2. 点击 **Create new promotion**（创建新促销），选择 **Coupon**（优惠券）。\n3. 在设置页面，您可以选择针对单个 SKU 进行设置。\n4. 填写优惠券的折扣比例、有效期、预算等信息。\n5. 确认并发布。\n\n请注意，优惠券的折扣金额是由卖家承担的，建议您在设置前核算好利润空间。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 09:20:55","用户":"焱七","群":"","用户问询":"full仓的费用是怎么算的呢","AI响应":"你好！很高兴为你解答。\n\n美客多Full仓储服务的费用主要由以下几部分构成：\n\n1. 仓储服务费：\n适用于仓库内所有商品，按月收取。费用根据商品的尺寸（小型、中型、大型、超大/重型）和每日仓储时间计算，月底汇总每日费用生成总金额。\n- 小型产品（12x15x25cm且≤18kg）：每日约 0.0006 美元。\n- 中型产品（28x36x51cm且≤18kg）：每日约 0.0022 美元。\n- 大型产品（50x60x60cm且≤18kg）：每日约 0.0050 美元。\n- 超大或重型（大于50x60x60cm或>18kg）：每日约 0.0276 美元。\n\n2. 长期存储费：\n为了优先考虑畅销商品的库存空间，存放满 4 个月（120天）或以上的商品将产生每月一次的长期仓储费。费用根据库存时长和产品尺寸变化。例如，小型产品存放 4-6 个月费用为 0.77 美元；超大重型产品存放超过 12 个月费用为 25.32 美元。\n\n3. 销售费用和运费：\n在美客多上列出产品是免费的，但每次销售时，你需要支付相应的销售佣金和尾程运费。\n\n4. 其他费用：\n还包括弃置费或撤仓费（如果你需要销毁库存或将库存退回）。\n\n目前智利仓库的仓储费已获折扣，通知前均不收取。\n\n网页参考资料：\n仓储费详情：https://global-selling.mercadolibre.com/help/15373\n运费详情：https://global-selling.mercadolibre.com/help/23223\n弃置或撤仓费：https://global-selling.mercadolibre.com/knowledge-hub/18226","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-13 10:09:45","用户":"a","群":"","用户问询":"我备货到full仓需要什么费用","AI响应":"备货到Full仓的费用主要包括：\n1. 仓储费：包含存储服务费和长期存储费。\n2. 运费：即尾程配送费。\n3. 弃置或撤仓费：若需处理库存时产生。\n\n网页参考资料：\n仓储费：https://global-selling.mercadolibre.com/help/15373\n运费：https://global-selling.mercadolibre.com/help/23223\n弃置或撤仓费：https://global-selling.mercadolibre.com/knowledge-hub/18226\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-13 10:51:48","用户":"彬","群":"","用户问询":"现在情况是这样，货物已到仓库，但忘记点确认，现在重新预约了时间，可以正常入库吗？","AI响应":"如果发货后未点击确认发货，货物会被列为异常件，异常件不会及时安排入库。请尝试在后台新建一个备货单重新关联入库。只要完成了系统发货确认，仓库即可正常收货上架。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 13:45:58","用户":"啊邝","群":"","用户问询":"联系了揽收司机，司机说是需要平台预约的 怎么预约","AI响应":"你好！很高兴为你解答。\n\n司机的意思是你需要在后台完成发货设置并生成订单指令。美客多自发货的上门揽收预约并不是像打车那样实时预约，而是通过以下步骤完成：\n\n1. **后台设置模式**：\n请确保你已经在卖家后台将发货方式设置为上门揽收。\n路径：`Selling Preferences` > `Dispatch Methods` > `Select dispatch methods`。\n只有这里设置正确，系统才会将你的订单信息同步给菜鸟揽收系统。\n\n2. **打印面单（关键步骤）**：\n当你有新订单时，必须在后台点击 **Print label** 打印出物流面单。\n当你打印了面单，系统后台就会产生一条揽收指令推送给菜鸟。司机在他的系统里就能看到你的地址有包裹需要揽收。\n\n3. **电话沟通确认**：\n在后台打印完面单并打包好后，你直接拨打司机的电话，告知他你已经有美客多的包裹准备好了，请他顺路过来取件即可。\n\n**特别提醒：**\n如果司机反馈在他的系统里看不到你的预约信息，请检查你的发货地址是否填写完整准确（包含省、市），且确认该地址确实在菜鸟的揽收范围内。\n\n如果还是无法预约成功，建议你先通过“卖家自寄（Drop Off）”方式将包裹寄往仓库，以免订单超时。\n\n网页参考资料：\nhttps://cainiao.4px.com/site/helpDetailsLs","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 11:56:44","用户":"古💋月","群":"","用户问询":"预约到货时间已到 但是货物还未到仓图如何处理","AI响应":"如果货物无法在预约时间准时到达，请及时在后台取消或重新安排预约。全托管模式下，提前一天送达仓库不会拒收，但若严重迟到可能影响入仓效率。建议您在后台货件管理中核实状态，并联系对接买手报备。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-13 09:19:53","用户":"Y.","群":"","用户问询":"我需要预约上门取件吗？还是司机会自己来","AI响应":"在美客多平台设置好上门揽收服务后，操作流程如下：\n\n1. 首次取件：建议您至少提前6小时通过拨打上门揽收电话联系司机，确认您的地址并预约首次取件时间。\n2. 日常发货：一旦订单生成且包裹准备就绪，您可以直接联系为您指派的司机安排取件。建议与司机协调确定一个固定的每日取件时间，方便长期合作。\n3. 准备工作：请务必在上午准备好包裹，因为取件通常发生在下午（周一至周六 13:30至22:00）。司机到达后最多可等待30分钟，若超时则需重新预约。\n\n如果需要查询您所在地区的揽收司机联系电话，请访问：https://cainiao.4px.com/site/helpDetails?code=195405T814026158&titicode=STW_0_1_4_3","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-18 14:01:09","用户":"大角牛","群":"","用户问询":"这样是不是就可以了","AI响应":"从您提供的截图来看，邮件内容已经包含了OC提货码和预约提货时间，但还需要完善以下两点：\n\n1. 收件人漏了一个：请务必同时发送给两个收件人，您现在只写了 MKDCF2026168@365fanyi.com，请把 gpncustomerservice-latinamerica@service.cainiao.com 也加上。\n\n2. 提货时间确认：请确保您的提货时间至少是在发送邮件后的T+1天，给仓库留出24-48小时的准备时间。\n\n补齐收件人并确认时间符合要求后，就可以发送了。提货时记得让提货人向仓库出示这个OC提货码。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 14:07:21","用户":"Lisa","群":"","用户问询":"系统可以预约当天的","AI响应":"你好！很高兴为你解答。\n\n如果系统允许选择当天的日期，那么是可以预约当天的。\n\n预约的是到仓时间，请确保你能在预约的时间段内将货物送达仓库。一定要记得点击确认发货，只有点击了确认，才算完成整个发货单的流程。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-16 10:20:16","用户":"酷乐达科技","群":"","用户问询":"转运仓只有 3个站点，对吗？","AI响应":"从您提供的图片来看，目前显示有墨西哥、哥伦比亚和智利三个站点的Full仓选项。美客多支持的核心站点包括巴西、墨西哥、智利、哥伦比亚和阿根廷。关于巴西海外仓的相关内容，我暂时无法回答，后续我会丰富我的知识库，敬请见谅。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-13 16:06:08","用户":"是小张呀","群":"","用户问询":"这个是系统出问题了吗","AI响应":"这不是系统问题。图片显示的是 Boost Your Sales 促销活动，状态为“已预约”，有效期从6月3日至8月24日。商品价格折扣为 -0.11 美金（-4%），“你将收到”一栏显示的是扣除折扣及相关费用后预计入账的金额。这属于正常的活动提报展示，系统正在按设定的折扣比例计算您的预计收益。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 10:50:00","用户":"Zaxxxay","群":"","用户问询":"？ 不是啊","AI响应":"从图片看，您的Full仓绩效得分为100分，表现非常优秀，且剩余库容充足。\n\n如果智利Full仓仍无法补货，可能是因为该站点目前需要联系您的海外仓客户经理进行人工激活。建议您直接联系对接经理确认后台权限状态。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 17:36:31","用户":"来一杯生活🍻","群":"","用户问询":"这样写可以么","AI响应":"可以的，邮件内容清晰。收件人、抄送人、提货单号、预约时间及件数都已包含。发送后请给仓库24-48小时准备时间，凭单号准时前往即可。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-18 15:51:42","用户":"🐟711bu7","群":"","用户问询":"我的店铺是没有智利full仓 只有墨西哥full仓","AI响应":"你好！智利海外仓（Full）需要联系你的海外仓客户经理申请人工激活。目前智利站点自发货是默认开启的，但海外仓权限需要单独申请。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-19 20:01:59","用户":"D~","群":"","用户问询":"是我货到了在去预约入仓的时间吧 这个意思吧","AI响应":"你好！很高兴为你解答。\n\n是的，就是这个意思。\n\n通常的操作流程是：货物在海上运输期间，你不需要去预约具体的入仓日期。等到货物已经到达目的地国家，并且货代完成了清关、把货拉到了他们当地的转运仓库后，货代会根据美客多后台的空档，去预约一个具体的送货时间。\n\n只要在预约好的那个时间点把货送到官方仓就可以了。所以，海运的长途运输时间完全不会影响你的入仓预约。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 08:30:05","用户":"三横一竖","群":"","用户问询":"发full仓产品是否需要贴产地标签，是否有模板","AI响应":"目前知识中未提及发往Full仓的产品是否需要贴产地标签及相关模板。\n\n关于发往Full仓的产品标识，请遵循以下核心要求：\n1. 必须使用Mercado Libre提供的唯一且不可转让的标签。\n2. 标签需贴在产品最小包装最大的一侧，保持平整，严禁折叠或贴在封口处。\n3. 必须移除或覆盖包装上原有的旧条形码。\n4. 即使是原厂箱内的单品，也必须逐一贴标。\n\n若涉及墨西哥RFC税号相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-16 11:40:39","用户":"Rosa Chen（家居家具汽摩配full仓）","群":"","用户问询":"进墨西哥full仓","AI响应":"若跨境海外仓卖家需要发货至平台full仓，首先应找到可发货到墨西哥的第三方物流商，先将货物从国内运至墨西哥本地第三方仓。随后由物流商在系统预约送仓时间，系统分配具体full仓后，按时送仓即可。建议操作前先在后台创建备货计划。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 15:04:36","用户":"Yvonne Wang","群":"","用户问询":"Full仓现在有那几个国家","AI响应":"目前跨境店官方海外仓（Full）开放了墨西哥和智利两个站点。此外，美客多还提供美国转运仓服务，可覆盖墨西哥、智利、哥伦比亚、巴西等站点。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 13:43:15","用户":"张丽-深圳市雅乐电子有限公司","群":"","用户问询":"我卖的是的墨西哥full仓","AI响应":"如果你选择的是墨西哥Full仓（海外仓）模式，建议你办理RFC税号。\n\n在墨西哥海外仓模式下，如果你没有提供RFC税号，平台将面临约36%的代扣税（16%增值税 + 20%所得税）。对于跨境卖家，强烈建议选择办理离岸税号，这样可以有效降低税负，提高账户的合规性与安全性。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-15 12:18:25","用户":"张学琴","群":"","用户问询":"full仓应该不需要广告投入吧","AI响应":"Full仓权限由系统根据店铺信誉等级、销售表现和合规性自动激活。虽然Full仓能提升转化，但仍需配合广告投入来增加产品曝光和竞争力。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 10:59:24","用户":"iee","群":"","用户问询":"full仓的","AI响应":"你好！Full仓订单收入导出路径如下：\n1. 进入卖家后台，点击 **Reports**（报表）下的 **Financial reports**（财务报表）。\n2. 在 **Settlement report**（结算报表）中选择对应周期。\n3. 点击 **Download** 导出 Excel，即可查看包含销售额、佣金、配送费及净收入的明细。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 10:49:31","用户":"Zaxxxay","群":"","用户问询":"智利full仓","AI响应":"智利Full仓需联系您的海外仓客户经理申请人工激活。目前智利仓库的仓储费已获折扣，通知前均不收取。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 14:06:12","用户":"Lisa","群":"","用户问询":"但是我其他产品预约成功后会显示在途库存/运输中库存","AI响应":"你好！很高兴为你解答。\n\n有库存才会显示上架。\n\n在全托管模式下，库存状态通常分为以下几种：\n1. 无库存 (Out of stock)：没有储存或在途库存。\n2. 临界 (Critical)：库存即将耗尽。\n3. 适中 (Moderate)：库存处于中间点。\n4. 最优 (Optimal)：状态最佳，有足够件数满足需求。\n5. 积压、过剩(surplus)：库存过多。\n\n如果你的其他产品显示在途，而这个单号没有显示，可能是因为系统同步存在延迟。只要你的发货单状态显示为“待接收”且预约成功，就不会影响后续的入库流程。建议你先按照预约时间正常发货，待仓库签收后，库存状态会自动更新。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 10:27:06","用户":"邓欢","群":"","用户问询":"全托管仓发备货单，预约了15号，但是17号才到，会怎样","AI响应":"预约的是到仓时间，提前一天送达仓库不会拒收。但全托管有运单过期时间，只要在运单过期前入库即可，建议尽量按预约时间送达以保证入库效率。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-18 19:53:33","用户":"cyc","群":"","用户问询":"就是说我的打印单打印出来以后没有预约","AI响应":"你好！很高兴为你解答。\n\n在卖家后台处理订单并打印面单后，系统通常会自动通知物流商。如果出现打印后未生成预约的情况，请务必核实你的发货地址是否已在后台正确设置为“上门揽收”。\n\n若地址在范围内且设置无误，建议直接联系负责该区域的菜鸟司机（电话：0532-66202077）尝试线下预约，或通过卖家后台提交 Case 反馈系统同步问题。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-18 17:44:34","用户":"cyc","群":"","用户问询":"我致电cainiao和我说需要预约","AI响应":"你好！很高兴为你解答。\n\nFULL仓模式下，在卖家后台处理订单并打印面单后，系统会根据发货设置通知物流商。\n\n如果你在揽收范围内，建议通过菜鸟揽收服务点查询页面（https://cainiao.4px.com/site/helpDetailsLs）获取负责你区域的司机电话，直接联系司机预约上门揽货。\n\n若地址不在范围内或司机无法及时到达，为避免影响时效，你可以选择“卖家自寄（Drop Off）”模式，自行通过快递寄送至菜鸟指定的国内扫码仓。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-18 17:44:46","用户":"cyc","群":"","用户问询":"他们那边还是没有我的预约单","AI响应":"你好！很高兴为你解答。\n\n如果菜鸟反馈没有你的预约单，请先在卖家后台确认是否已点击“确认发货”并完成所有发货流程。\n\n全托管模式下，预约时间选择明天或之后不影响发货，但必须在运单过期前完成入库。若系统已确认发货但物流商仍查不到，建议你直接联系负责该区域的菜鸟司机核实，或通过卖家后台的帮助中心联系平台客服确认订单同步状态。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-17 14:06:35","用户":"Lisa","群":"","用户问询":"是不是不能预约当天的日期","AI响应":"你好！很高兴为你解答。\n\n是的，通常情况下无法预约当天的日期。系统一般要求至少提前一天进行预约，以便仓库提前规划收货人力。如果你的发货单今天到期，建议你尝试预约明天或之后最近的可选时间，只要在系统允许的范围内完成预约并点击确认发货，通常不会影响入库。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"海外仓/FULL/入仓"},{"时间":"2026-07-14 15:42:12","用户":"南笙","群":"","用户问询":"请问下送往墨西哥full仓的货，有部分说是包装问题或者其他问题 不可售 这个可以查到具体的原因吗","AI响应":"你好！很高兴为你解答。\n\n当商品被标记为不可售库存时，仓库会对退回商品进行质检。如果判定为损坏、包装破损或已使用，商品就会变为不可售状态。\n\n关于查询具体原因，你可以通过卖家后台的库存管理页面查看这些不可售商品的状态。通常情况下，仓库会根据质检结果将商品分类，你可以看到是因为商品损坏还是包装问题导致的不可售。\n\n对于这些不可售库存，你需要注意以下处理方式：\n1. 你需要通过后台预约提取（Pick Up）到当地第三方仓。\n2. 如果不可售商品在仓库停留超过规定时间（通常为20天）且未被提取，平台将会对商品进行捐赠或销毁处理。\n\n建议你定期检查后台库存状态，及时处理不可售商品，以免造成不必要的损失。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"物流发货/面单/包装"},{"时间":"2026-07-13 11:47:59","用户":"秒速五厘米","群":"","用户问询":"怎么跟我发的不一样 既然你已经设置好了，请按照以下步骤将货发往集运仓： 1. **确认目的仓地址**： 根据你之前的截图，你选择的是“东莞沙田3号枢纽分拨”。 具体地址：广东省东莞市沙田镇进港南路周大福物流东莞物流中心205号库台 联系人：叶宗虎 电话：18025233509 可接受货物时间：周一至周日，9:00am-18:00pm 2. **打印并粘贴面单**： 在卖家后台下载并打印该订单的菜鸟物流面单，务必牢固粘贴在包裹外箱上。 3. **自寄发货**： 你可以通过顺丰、中通等国内快递，将包裹寄往上述东莞沙田的地址。运费需要你自行承担。 4. **注意事项**： 请确保包裹在规定时间内送达仓库并完成扫码上网。如果你人在义乌，且该订单支持义乌扫码仓，你也可以选择自送到菜鸟义乌扫码仓以节省国内运费。 网页参考资料： 跟这个不一样","AI响应":"你好！很高兴为你解答。\n\n如果你发现后台显示的仓库名称或地址与我提供的信息不一致，请务必以**你卖家后台实时显示的地址**为准。\n\n因为菜鸟的集运仓地址可能会有更新或变动，后台显示的“东莞沙田3号枢纽分拨”对应的具体库位或联系方式，最准确的获取方式是：\n1. 在你图片显示的页面点击“确认”。\n2. 确认后，系统通常会提供该仓库的详细收货地址和联系人信息。\n3. 如果后台没有直接显示文字地址，你可以查看下载下来的物流面单，面单上通常也会标注目的仓的详细信息。\n\n如果你人在义乌，想寄往义乌仓以节省运费，你可以在“交付仓库”的选项里找找看有没有义乌相关的仓库选项。如果没有，那就必须按照系统指定的东莞仓库进行寄送。\n\n请以你后台确认后的最终指引为准进行发货。","一级大类":"物流仓储","二级子类":"仓储预约","问题主题":"物流发货/面单/包装"}]},{"一级大类":"营销活动","二级子类":"佣金定价","Past 7 Days":68,"Previous 2026-07-06 to 2026-07-12":85,"Change":-17,"WoW":-0.2,"Past 7 Share":0.009870808535346205,"高频问题":"佣金/定价/利润","__details":[{"时间":"2026-07-17 13:49:17","用户":"房东","群":"","用户问询":"我还是不是很理解这个平台是怎么定价，我自己换算了一遍，按照他的售价所得利润和我填写的净利润不一样","AI响应":"你好！巴西站采用净收益模式，系统会自动根据你填写的净收益（成本+利润）叠加佣金和运费生成售价。\n\n最终到账金额即为你设定的净收益，但可能因物流实测尺寸重量校准产生微小偏差。\n\n网页参考资料：https://global-selling.mercadolibre.com/help/shipping-fee-cainiao-costos-brasil_41814","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-17 15:25:59","用户":"曼茵","群":"","用户问询":"销售佣金 Classic-12.5% Premium-16.5%这个佣金是什么区别","AI响应":"你好！这是两种不同销售佣金的Listing模式，您可以根据业务需求自行选择。\n\nClassic模式：\n佣金费率比Premium低4%。它的流量相对稍微少一些，且买家无法享受免息分期付款，适合常规中低客单价的产品。\n\nPremium模式：\n佣金费率较高。它的曝光量最高，最大的优势是支持买家免息分期付款，这对于提升转化率非常有帮助，通常用于冲击销量或销售高客单价产品时使用。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-17 11:49:18","用户":"kun","群":"","用户问询":"高级下面的那个佣金，需要我支付2.9和运输下面的4.76。我还需要扣除吗？","AI响应":"不需要再扣除了。\n\n在美客多自发货的定价逻辑中，系统展示的“您支付 USD 2.90”和“您支付 USD 4.76”是为了让你清楚费用的明细。\n\n这些费用已经由系统自动加在“商品标价”里了。也就是说，买家支付的 21.65 美金中，已经包含了这笔佣金和运费。当订单成交后，平台会自动扣掉这些费用，剩下的 13.99 美金就是全额结算给你的净收益。\n\n你只需要确保你填写的“净收入”能够覆盖你的产品采购成本和你想赚取的利润即可。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-13 15:10:37","用户":"Eric Hsu","群":"","用户问询":"半托管的佣金类型这块只有经典的，不能设置成优质的吗","AI响应":"半托管模式目前仅支持经典（Classic）Listing类型，不支持设置或更改为优质（Premium）Listing。这意味着半托管卖家无法通过支付更高比例的佣金来换取免息分期（Installments without interest）等功能。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-17 13:36:39","用户":"蓝七","群":"","用户问询":"你好 我想问一下绕线器的佣金是多少？","AI响应":"你好！您可以点击下方链接下载最新的佣金明细表，在表格中找到您对应的类目即可查看具体的佣金比例：\nhttps://file.marsmind.cc/boot-admin/mercado/20260421/2046433071080206337.xlsx","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-17 09:16:27","用户":"窦红建","群":"","用户问询":"IVA 只对佣金征收，不是对售价？","AI响应":"你好！很高兴为你解答。\n\n这是一个非常关键的误区，请务必区分清楚：\n\n1. **针对佣金的 IVA**：\n平台确实会对你支付给美客多的**销售佣金（Selling Fees）**征收 16% 的增值税（IVA）。这部分税费是针对平台提供的“服务”征收的。\n\n2. **针对销售额（售价）的 IVA**：\n如果你使用的是**墨西哥海外仓（Full）模式**，根据墨西哥税法，平台必须对你的**产品销售额（即买家支付的售价）**代扣代缴增值税。\n- **如果你没有 RFC 税号**：平台会从你的每笔订单售价中直接扣除 **16% 的增值税**。\n- **如果你有有效 RFC 税号**：平台将不再代扣这 16% 的销售增值税，而是由你自行申报。\n\n**总结：**\n对于海外仓卖家，IVA 既会出现在佣金上（由平台收），也会出现在售价上（由政府收，平台代扣）。如果你没有税号，除了 16% 的销售增值税，还会被额外扣除 **20% 的所得税（ISR）**，总计扣除额约为售价的 36%。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-15 16:44:49","用户":"秋天","群":"","用户问询":"美客多保证金和平台佣金是多少啊？","AI响应":"美客多不需要缴纳保证金和押金，也没有罚款。平台佣金根据站点和品类不同有所差异，通常在 10% 到 20% 左右。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-15 16:33:56","用户":"秋天","群":"","用户问询":"这个定价表呢 就是我们如何定价在这上面？","AI响应":"美客多自发货采用收益价格模式（Net Proceeds）。您只需在后台录入目标净收益（采购成本+利润），系统会自动叠加国际运费与佣金生成最终售价，无需您人工计算运费。\n\n网页参考资料：\nhttps://doc.weixin.qq.com/pdf/d3_ARIAagYiAMICNXFSDGYOWRO6SJK0z?scode=AI8A3wfvAAo8y04nbHAXUA7AYZANA","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-13 10:29:14","用户":"观云","群":"","用户问询":"你好，多少美刀以上，可以设置高佣金","AI响应":"你好！很高兴为你解答。\n\n在美客多平台，只有售价在 299 墨西哥比索（约 17 美金）及以上的商品，才可以设置高佣金（Premium）模式。\n\n如果商品售价低于 299 墨西哥比索，系统将默认仅支持经典（Classic）模式。\n\n网页参考资料：\nhttps://global-selling.mercadolibre.com/help/18884","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-19 12:09:04","用户":"灿烂阳光","群":"","用户问询":"请问一下新店铺定价如何来定啊","AI响应":"美客多自发货目前采用的是收益价格模式（NetProceeds）。\n\n在这种定价模式下，你不需要人工计算并加入运费和佣金。你只需要在系统后台录入你的目标净收益，即：采购成本 + 你的利润。\n\n平台系统会自动根据你填写的净收益，叠加该站点的销售佣金以及根据产品重量计算出的运费，最终生成展示给消费者的前端售价。\n\n这种模式的好处是，你的到账金额就是你设定的净收益，不会因为运费的波动而导致利润缩减。\n\n网页参考资料：\nhttps://doc.weixin.qq.com/pdf/d3_ARIAagYiAMICNXFSDGYOWRO6SJK0z?scode=AI8A3wfvAAo8y04nbHAXUA7AYZANA","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-19 11:12:42","用户":"若初见","群":"","用户问询":"为什么我那都是百分之22的佣金","AI响应":"你好！很高兴为你解答。\n\n哥伦比亚站点的佣金比例确实会根据类目有所不同，最高可达 22% 左右。\n\n这通常是因为你所销售的类目属于高佣金范畴。此外，如果你参加了平台的促销活动（如 Deals），或者使用了特定的列表类型（如 Premium 列表以提供分期付款功能），平台可能会在基础佣金之上额外收取一定的比例。\n\n你可以点击下方链接下载最新的佣金明细表，在表格中找到您对应的类目即可查看具体的佣金比例：\nhttps://file.marsmind.cc/boot-admin/mercado/20260421/2046433071080206337.xlsx\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-17 22:01:09","用户":"蓝七","群":"","用户问询":"佣金是指平台收取的佣金是吗","AI响应":"你好！是的，佣金是平台根据不同商品品类收取的销售费用，一般在 8%-15% 之间。具体金额取决于您销售的国家和列表类型。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-17 11:35:14","用户":"悠","群":"","用户问询":"半托管能开高佣金吗","AI响应":"半托管模式目前不支持自主设置高佣金。该模式享受佣金减免福利，统一收取8%佣金，相比常规模式有50%的减免。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-17 11:27:48","用户":"Sam","群":"","用户问询":"自动化定价工具在哪里设置呢？","AI响应":"价格自动化工具可以在列表中的价格管理部分找到。您可以选择要自动定价的列表，设定竞争策略和价格限制，完成后价格将在设定范围内自动调整。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-16 16:03:34","用户":"ʚɞ许财愿","群":"","用户问询":"你好美客多核算利润表有吗","AI响应":"你好！很高兴为你解答。\n\n美客多自发货定价模式为收益价格模式（NetProceeds）。在此定价模式下，你只需录入目标净收益（即：采购成本 + 利润）。\n\n系统会自动叠加运费与佣金，生成前端展示给买家的最终售价，无需你人工计算并加入运费。最终到账金额即为你设定的净收益（可能因物流实测尺寸重量校准产生微小偏差）。\n\n店铺审核通过后，每个新卖家都会分配运营经理，邮件里会有卖家交流群的二维码。另外建议关注我们官方微信公众号\"美客多拉美电商\"，里面的\"卖家大学\"有详细的运营教程，包括利润核算、费用结构等内容，非常适合新手学习。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-15 21:34:47","用户":"陈雷","群":"","用户问询":"有产品利润表格吗","AI响应":"美客多采用收益价格模式。你只需在后台录入目标净收益，即采购成本加利润。系统会自动叠加运费与佣金生成最终售价，无需人工计算利润表。最终到账金额即为你设定的净收益。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-15 17:52:30","用户":"","群":"","用户问询":"销售佣金是怎么算的","AI响应":"平台佣金是根据不同商品品类收取的，一般在 8%-15% 之间。具体类目佣金比例您可以点击下方链接下载最新的佣金明细表进行查询：\nhttps://file.marsmind.cc/boot-admin/mercado/20260421/2046433071080206337.xlsx","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-13 20:50:17","用户":"Pluto.","群":"","用户问询":"平台佣金费率是17.2%么","AI响应":"你好！美客多墨西哥站点的佣金费率并不是统一的17.2%。\n\n具体的佣金比例取决于你选择的刊登类型以及商品的品类：\n\n1. Classic（经典刊登）：佣金费率通常在 10% - 15% 之间，大部分品类为 14.5%。\n2. Premium（高级刊登）：佣金费率通常在 13% - 18% 之间，大部分品类为 17.5%。\n\nPremium模式虽然费率较高，但可以为买家提供免息分期付款功能，有助于提升转化率并获得更多流量支持。\n\n建议你在卖家后台上传产品时，根据具体的类目查看系统显示的准确费率。\n\n网页参考资料\n美客多销售佣金详解：https://global-selling.mercadolibre.com/help/40023","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-13 15:56:52","用户":"lxy","群":"","用户问询":"平台佣金的话经典的是多少？","AI响应":"你好！很高兴为你解答。\n\n平台佣金是根据不同商品品类收取的，一般在 8%-15% 之间。\n\n经典版（Classic）的费率比高级版（Premium）低 4% 左右。经典版流量稍微少一些，且买家无法享受分期付款，适合常规中低客单价的产品。\n\n具体的佣金比例会根据类目有所不同，例如服饰类目通常为 15%，电子类目为 12%。建议你在后台刊登商品时，根据系统显示的具体费率进行成本核算。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-19 10:04:56","用户":"问道","群":"","用户问询":"男装怎么定价？","AI响应":"你好！很高兴为你解答。\n\n美客多自发货定价模式为收益价格模式（NetProceeds）。在此定价模式下，你只需录入目标净收益（即：采购成本 + 利润）。\n\n系统会自动叠加运费与佣金，生成前端展示给买家的最终售价，无需你人工计算并加入运费。最终到账金额即为你设定的净收益，但可能因物流实测尺寸重量校准产生微小偏差。\n\n设定价格限制时需要注意：\n1. 需要定义一个最低价格，这是你愿意出售的最低价格，工具不会低于此价格。\n2. 还可以设定一个可选的最高价格。\n\n如果你使用ERP系统进行商品管理，请务必及时确认并更新API接口，以确保与新定价模式顺利对接。\n\n网页参考资料：\nhttps://doc.weixin.qq.com/pdf/d3_ARIAagYiAMICNXFSDGYOWRO6SJK0z?scode=AI8A3wfvAAo8y04nbHAXUA7AYZANA","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-16 16:29:28","用户":"PEIING","群":"","用户问询":"佣金什么时候退","AI响应":"平台对卖家退款申请的处理时效通常在 3-5 个工作日内。一旦退款处理完成，相应的销售佣金会退回至您的账户。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-15 09:10:55","用户":"琪","群":"","用户问询":"有佣金？","AI响应":"半托管模式有佣金减免福利，收取8%佣金。\n\n半托管定价模式为收益价格模式（Net Proceeds），即商家设置商品价格时不再需要计算销售佣金和运费，只需设置想要获得的收益（商家供货价），剩余的官方收费部分（佣金+运费）平台将进行前端售价藏价。\n\n目前半托管模式享受佣金减免福利，最高享受50%的佣金减免。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-13 17:32:14","用户":"-Tatsu 🐶","群":"","用户问询":"半托管有佣金吗","AI响应":"半托管模式有佣金减免福利，享最高50%的佣金折扣，通常收取8%佣金。定价采用收益价格模式，平台会进行前端售价藏价。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-14 19:32:19","用户":"7655","群":"","用户问询":"你好，我修改价格，怎么方便，只修改一次，不需要每个站点都去修改","AI响应":"你好！美客多支持各站点差异化定价，因此在批量修改商品信息时，必须按不同站点分别单独操作，无法通过一次修改同步到所有站点。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-18 14:38:01","用户":"波","群":"","用户问询":"全托管的价格填写（净收入）应该是怎么填合适","AI响应":"全托管定价采用供货价模式。建议供货价 = 产品成本 + 目标利润 + 国内发往东莞仓的物流成本。供货价建议比市场价低15%以上。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-18 12:06:32","用户":"纳洛童","群":"","用户问询":"筋膜枪在墨西哥巴西一半售价是多少？","AI响应":"你好！很高兴为你解答。筋膜枪在墨西哥和巴西站点的售价受品牌、规格及发货模式影响较大，以下是市场大致价格区间供参考：\n\n1. **墨西哥站点 (MXN)**：\n普通款售价通常在 300 - 700 MXN 之间；专业款或知名品牌可达 1,000 - 2,000 MXN。\n\n2. **巴西站点 (BRL)**：\n普通款售价通常在 80 - 180 BRL 之间；高性能或多头配置款通常在 250 - 500 BRL。\n\n**定价建议：**\n建议你在卖家后台使用利润计算器，输入你的成本和期望利润（美金），系统会自动生成包含运费和佣金后的当地币售价。\n\n网页参考资料：\n利润计算器：https://global-selling.mercadolibre.com/listings/cost-calculator","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-17 11:30:21","用户":"Sam","群":"","用户问询":"价格管理那里好像也没有可以设置的模块呢","AI响应":"从您提供的图片来看，系统提示“由于未找到竞争对手参考，无法启用自动定价”。这意味着该产品目前没有可对比的同类竞争列表，因此无法触发自动调价机制。您可以先尝试手动微调价格，或等待系统匹配到竞争对手后再进行设置。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-17 10:21:16","用户":"刘霞","群":"","用户问询":"为什么就是不能改价格呢，之前都是能改的？","AI响应":"你好！很高兴为你解答。\n\n目前无法直接判断具体原因，建议优先核查以下方向：\n1. 检查是否开启了网页自动翻译，请务必关闭后再试。\n2. 确认该商品是否正在参加平台大促活动，活动期间价格通常会被锁定无法直接修改。\n3. 检查商品是否有未处理的投诉或审核，这可能导致编辑功能受限。\n\n如果排除以上情况仍无法修改，建议通过后台 Case 催促客服跟进你之前的反馈。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-16 17:18:54","用户":"小火鸡","群":"","用户问询":"六个站点关税是多少，我该怎么计算我的产品总成本","AI响应":"你好！很高兴为你解答。\n\n在美客多自发货模式下，你不需要手动计算关税。美客多采用收益价格模式（Net Proceeds），你只需在后台录入你的目标净收益（即：采购成本+利润），系统会自动叠加运费、佣金以及可能产生的相关税费生成最终售价。\n\n关于各站点的税费情况如下：\n1. 墨西哥站点：目前自发货卖家不涉及墨西哥 36% 的增值税代扣。\n2. 其他站点：平台提供直邮解决方案，系统在定价时会自动考虑站点当地的汇率转换及相关税费因素。\n\n如何计算产品总成本：\n你的总成本主要由以下部分构成：\n1. 产品采购成本：你进货的实际价格。\n2. 国内头程运费：将货物发往平台指定中国集运仓的费用。\n3. 营销费用：广告推广等支出。\n\n在定价时，你只需使用官方提供的利润计算器，输入你想要的“净收益”，系统会帮你算出买家看到的前台售价。\n官方利润计算器：https://global-selling.mercadolibre.com/help/41742\n\n网页参考资料：\n墨西哥RFC税号相关信息：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-16 14:58:14","用户":"D","群":"","用户问询":"你好，想问下美客多半托管的成本是怎么计算的呢","AI响应":"你好！半托管采用收益价格模式。供货价=单件货物成本+目标利润+国内发货到东莞仓的运费。你只需设置期望收益，无需计算佣金和国际运费。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-13 14:42:06","用户":"😶 ＇","群":"","用户问询":"美客多价格竞争 以什么价格 为准","AI响应":"在美客多的价格竞争机制中，系统主要以买家最终看到的“前台展示价格”为准。\n\n具体逻辑如下：\n\n1. 最终售价优先：如果您的商品同时参加了多种活动（如大促活动和自建日常活动），系统通常会执行对买家更优惠的价格作为生效价格。\n\n2. 综合得分机制：在竞争黄金购物车（Buy Box）或广告排名时，价格是核心因素之一，但不是唯一标准。系统会以您的“最终销售价格”结合“配送时效（海外仓优于自发货）”、“店铺信誉（绿色等级优先）”以及“链接转化率”进行综合判定。\n\n3. 净收益影响：对于卖家后台的竞价系统，它会参考您的净收益设置。但在前台分流逻辑中，系统更看重该价格带来的转化效率。\n\n简而言之，系统会以您设置的所有活动价中最低的那个作为竞争基准。如果您的价格在同类产品中不具备优势，或者店铺信誉不是绿色，即便参与了活动，也可能在流量分配中处于劣势。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-19 14:15:33","用户":"灯火星星","群":"","用户问询":"为什么购物网站显示的是美元呢","AI响应":"你好！很高兴为你解答。图片中显示的“$”符号在拉美地区（如墨西哥）代表当地货币比索（MXN），并不是美元。墨西哥站点的所有商品价格均以比索为单位展示。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-19 14:14:09","用户":"灯火星星","群":"","用户问询":"墨西哥站点用什么货币显示价格？","AI响应":"你好！很高兴为你解答。墨西哥站点的商品价格是用墨西哥比索（MXN）显示的。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-18 18:57:54","用户":"Dford","群":"","用户问询":"那我把价格调低一点 有用吗？","AI响应":"你好！调低价格是有用的。在销售条件相似的情况下，更具竞争力的价格是赢得黄金铺位（Catalog）的关键因素。\n\n不过请注意，系统对降价的流量加持通常有反应期，一般在降价后的第4天开始才会有明显的流量增长和出单。建议你小幅调整尝试。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-17 19:44:52","用户":"蓝七","群":"","用户问询":"美元挂牌价就是销售价对吗","AI响应":"是的，美元挂牌价就是买家在平台上看到的价格。在墨西哥和智利站点，您直接设置最终销售价；在巴西、哥伦比亚和阿根廷，您设置的是净收益。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-17 16:56:11","用户":"#","群":"","用户问询":"调整这里而不是调整销售价格是吗","AI响应":"是的，您只需要在“净收益价”字段输入您想获得的金额（成本+利润），系统会自动计算并更新前台销售价格。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-17 16:44:21","用户":"啊楼🍉","群":"","用户问询":"智利最高售价是1000美金吗","AI响应":"你好！在智利站点，直销模式（Direct Selling）的列表允许价格上限确实是1000美元。如果是海外仓模式（Full），则没有最高价格限制。此外，自发货产品的价格上限通常为300美金。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-17 15:50:10","用户":"**2","群":"","用户问询":"我分析价格很卷，怎么办","AI响应":"建议参考平台选品方向，优化成本结构。关注产品差异化、提升品牌知名度并优化服务。墨西哥消费者对价格极敏感，建议在保证质量前提下，通过优化供应链提供更具性价比的产品。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-17 14:50:43","用户":"蓝七","群":"","用户问询":"售卖价是比索价格吗","AI响应":"你好！前台显示的货币单位是各站点的当地官方货币（如墨西哥站显示比索），但卖家上架Listing时填写的售价是美金，系统会根据实时汇率自动转换。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-15 17:14:38","用户":"kun","群":"","用户问询":"请问下，这个是比索，还是美金？","AI响应":"从你提供的图片来看，输入框内明确显示了「USD」字样，所以这里填写的是美金。下方括号内显示的「CNY 2,030.51」是系统根据当前汇率为你换算出的等值人民币金额，方便你参考成本。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-13 17:22:18","用户":"晨夕","群":"","用户问询":"比本土更低，我怎么算价格","AI响应":"你好！很高兴为你解答。\n\n作为FTI卖家，要算出比阿根廷本土店更具竞争力的价格，你需要使用“逆推法”。\n\n**第一步：确定竞争目标价**\n观察阿根廷本土店同款产品的售价（例如你提到的124美金）。为了让买家愿意等待10-15天的跨境物流，你的**买家最终到手价**建议比本土店低 **15%-20%**。\n*   目标到手价 = 124美金 × 85% ≈ **105美金**。\n\n**第二步：剔除买家需缴纳的关税（逆推你的前台标价）**\n阿根廷买家在结账时，超过50美金的部分会产生约50%的关税。\n公式：目标到手价 = 前台标价 + 跨境运费 + (前台标价 + 跨境运费 - 50) × 50%\n*   假设跨境运费为10美金，代入公式：\n*   105 = 标价 + 10 + (标价 + 10 - 50) × 0.5\n*   105 = 1.5 × 标价 + 10 + 5 - 25\n*   115 = 1.5 × 标价\n*   **前台标价 ≈ 76.6美金**。\n\n**第三步：核算你的成本与利润（确保不亏本）**\n现在你得到了76.6美金的标价，回过头看你的成本：\n*   **FTI佣金**：76.6 × 8% = 6.1美金。\n*   **美仓仓储/处理费**：根据体积估算（假设2美金）。\n*   **头程运费**：你从中国发往美国德州仓的平摊费用。\n*   **产品采购成本**。\n\n**计算公式：**\n**你的净利润 = 76.6（标价） - 6.1（佣金） - 仓储费 - 头程费 - 采购成本。**\n\n**核心策略：**\n1. 如果算出来的净利润符合你的预期，那么 **76-79美金** 就是一个非常完美的标价，能确保买家最终支付额（约105-108美金）明显低于本土店的124美金。\n2. 充分利用FTI **8%的低佣金** 优势，这省下的10%左右的佣金空间，就是你打败本土店的“价格子弹”。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-13 14:41:15","用户":"😶 ＇","群":"","用户问询":"美客多价格竞争 以什么为准","AI响应":"在美客多的竞价机制中，竞价成功与否并非仅由价格最低获胜决定，而是一个综合权衡的过程。系统分流和胜出的逻辑如下：\n\n1. 竞价系统的核心逻辑\n竞价系统是一个自动竞争机制，它综合考量商家的出价（基于目标ACOS换算或净收益）和商品的广告质量分。排名最高的商品将赢得最靠前的展示位。\n\n2. 链接优化的直接作用\n链接质量（图片、描述、属性完善度）和视频上传（如Clips短视频）会直接提升链接的点击率和转化率。系统会监测这些指标，转化率越高的链接，其质量分就越高。在同等价格甚至价格略高的情况下，高质量分的链接往往能击败低质量链接获得曝光。\n\n3. 视频工具的加持\n使用Clips短视频工具是目前最推荐的手段。它能直接增加曝光入口，直观展示产品功能。从热销链接数据看，Clips能帮助销量提升25%到30%左右。这种转化率的提升会反哺给竞价系统，让系统认为该链接更具吸引力。\n\n4. 信用等级的门槛\n店铺信誉等级至关重要。非绿色信誉的店铺会被系统削减流量。如果您的店铺不是绿色信誉，即便价格再低，在竞价分流中也会处于劣势。\n\n5. 系统如何分流\n系统会优先将流量分配给综合得分最高的链接。综合得分 = 价格竞争力 + 链接质量分（转化率、点击率）+ 店铺信誉。失败的链接几乎没有曝光，是因为其综合得分未能进入该类目的第一梯队，导致系统算法减少了对其的流量倾斜。\n\n总结来说，链接优化是提升竞价成功率的必要手段。单纯靠低价而不优化链接，会导致转化率低下，进而被系统判定为低效链接而减少曝光。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-18 13:23:56","用户":"星期天","群":"","用户问询":"价格已经管控？","AI响应":"你好！很高兴为你解答。FTI模式下商家拥有自主定价权，但平台会进行核价。若价格过高，可能会影响流量或审核通过。此外，列表价格有最低和最高限制，具体取决于操作国家和物流。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-17 12:04:29","用户":"D~","群":"","用户问询":"成本怎么计算","AI响应":"你好！很高兴为你解答。美客多自发货的开店成本主要由以下几部分构成：\n\n1. 产品销售成本：您采购产品的进货成本。\n\n2. 平台佣金：根据不同产品类目和销售站点，佣金比例通常在 16% - 22% 之间。\n\n3. 物流费用：\n- 国内头程转运费：将货物从您的仓库运至跨境物流商揽收仓的费用。\n- 跨境运费：从中国运往目的国买家的全程物流费用。自2025年9月1日起，自发货官方物流模式主要由菜鸟承运。\n\n4. 营销费用：您为推广产品而投入的广告等营销活动产生的费用。\n\n特别提醒：\n- 自发货定价模式为收益价格模式（Net Proceeds），您只需录入目标净收益（采购成本+利润），平台系统会自动叠加运费与佣金生成最终售价，无需您人工计算并加入运费。\n- 如果您的产品售价低于免邮门槛，平台可能会收取一笔额外的低价产品操作费。\n\n您可以使用官方提供的利润计算器来更精确地估算最终收益。\n\n网页参考资料：\n主要成本构成：https://global-selling.mercadolibre.com/help/31800\n利润计算器：https://global-selling.mercadolibre.com/help/41742","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-15 15:29:54","用户":"iee","群":"","用户问询":"半托价格怎么算","AI响应":"半托管定价采用收益价格模式（Net Proceeds）。\n\n您只需设置想要获得的收益（商家供货价），公式为：\n收益价格 = 单件货物成本 + 您的目标利润 + 单件国内发货到东莞仓的物流成本（需转化成美元填写）。\n\n您无需计算销售佣金和国际运费，平台会自动在您的供货价基础上进行前端售价藏价。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-13 10:30:13","用户":"观云","群":"","用户问询":"就是低于17美金，我设置高佣金，也是无法启动的是吧","AI响应":"是的，如果商品售价低于299墨西哥比索（约17美金），系统不支持设置高佣金模式。即使您在后台尝试操作，该选项也无法生效或无法选择，系统会默认仅支持经典模式。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-15 11:32:47","用户":"廖","群":"","用户问询":"全托管和半托管，企业所获得的利润差距有多大","AI响应":"你好！很高兴为您解答。\n\n全托管和半托管模式在利润构成和定价权上有明显区别，具体的利润差距取决于您的成本控制能力和运营策略：\n\n1. 全托管模式：\n定价权：由平台负责定价。\n利润构成：您提供的是“供货价”。由于该模式下您承担的是0佣金、0仓储费、0国际运费和0广告费，您的利润空间主要取决于您的生产成本与给平台供货价之间的差额。这种模式回款快（妥投后7个工作日），适合追求高周转、低运营成本的厂家。\n\n2. 半托管模式：\n定价权：商家自主定价。\n利润构成：您采用的是“收益价格模式（Net Proceeds）”。您需要设置一个想要获得的收益（供货价），平台会在前端自动加上佣金（8%）和运费进行藏价销售。\n利润差距点：在半托管模式下，虽然您需要支付8%的佣金，但因为拥有自主定价权，如果您具备较强的运营能力和品牌溢价能力，可以通过优化链接和自主调价来争取更高的利润空间。\n\n总结来说：\n全托管更像“大宗供货”，利润相对固定且透明，省去了所有运营开支。\n半托管更像“自主经营”，利润上限取决于您的定价策略和市场竞争力，但需要投入精力进行店铺运营。\n\n关于这两种模式的深度解析，您可以参考以下视频内容：\n视频名字：美客多半托管模式全解析\n知识点：半托管与全托管模式对比及优势\n视频时刻点：05:15\n视频链接：https://mercadolibre.cn/news/info?id=215&type=live","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-13 20:43:36","用户":"Pluto.","群":"","用户问询":"墨西哥站点的销售佣金和订单处理费是多少","AI响应":"你好！墨西哥站点的相关费用如下：\n\n1. 销售佣金：\n根据您选择的刊登模式不同，佣金比例也有所区别：\nClassic（经典刊登）：佣金通常为14.5%（不同类目略有差异）。\nPremium（高级刊登）：佣金通常为17.5%（不同类目略有差异），此模式支持买家分期付款，能获得更多流量。\n\n2. 低价操作费（固定处理费）：\n当商品单价低于599 MXN时，除了正常的销售佣金外，平台会按件加收20 MXN的固定处理费。\n\n3. 尾程配送费：\n如果商品售价达到或超过299 MXN，卖家必须承担尾程运费。具体费用取决于货物的重量和尺寸。\n\n关于墨西哥站点Classic和Premium两种销售佣金模式的详细解读，可以参考：https://mp.weixin.qq.com/s?__biz=MzI5NDU3NzE0NQ==&mid=2247508070&idx=1&sn=fc7f23c8a5d293f352a49534c76906c8&chksm=ec6256f0db15dfe6a14989a9c27bc3c720270ceafb4a31cf280ecf28b12987d1282ecde83807&mpshare=1&scene=1&srcid=0715LiXuoFWdz07ZwdGUGRDM&sharer_shareinfo=cff4c87ea180ca90fa4efdc04c22b2e5&sharer_shareinfo_first=cff4c87ea180ca90fa4efdc04c22b2e5&from=industrynews&version=4.1.26.6024&platform=win&nwr_flag=1#wechat_redirect","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-18 17:22:25","用户":"价值2","群":"","用户问询":"朋友我想请教一下你的选品思路 我是在智赢上面的热销品的，我每个去核对一下成本，我想赚5元的售价，但是别人的售价基本上比我很多","AI响应":"你好！很高兴为你解答。建议你尝试以下思路：\n\n1. 切换定价模式：在后台使用“净收益”模式定价，直接输入你想赚的利润，系统会自动核算运费和佣金生成前台售价，确保你的利润不被运费侵蚀。\n2. 优化产品差异化：如果同质化严重且价格竞争激烈，建议寻找具有差异化的产品，或通过优化Listing图片和描述来提升溢价能力。\n3. 关注选品精准度：与其盲目对比热销品价格，不如精选符合当地需求且有供应链优势的潜力品。\n4. 降价反馈期：商品降价后，系统通常在第4天左右才会有明显的流量加持。\n\n如果别人售价远低于你，可能是因为其物流成本更低或拥有厂家货源优势。建议先精细化运营少量优质Listing，配合广告策略提升竞争力。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"},{"时间":"2026-07-16 16:54:01","用户":"Tao Zhu","群":"","用户问询":"普通和高级佣金模式的区别","AI响应":"Premium和Classic是两种不同的Listing模式：\n1. 佣金费率：Premium较高，Classic比其低4%。\n2. 曝光：Premium最高，Classic较高。\n3. 分期付款：Premium支持免息分期，Classic不支持。\n您可以根据业务需求自行选择。","一级大类":"营销活动","二级子类":"佣金定价","问题主题":"佣金/定价/利润"}]},{"一级大类":"其他","二级子类":"政策咨询","Past 7 Days":59,"Previous 2026-07-06 to 2026-07-12":49,"Change":10,"WoW":0.20408163265306123,"Past 7 Share":0.008564377993903324,"高频问题":"平台政策/官方规则","__details":[{"时间":"2026-07-15 09:10:36","用户":"Star Chow","群":"","用户问询":"明明平台要求48+24，但是7.11的单子肯定已经发出去了，现在平台取消是什么意思？能退回骂？","AI响应":"从图片看，该订单因“发现异常”被平台作废。这通常指包裹在物流中转或清关时被判定为违禁品、超材或包装破损，导致无法继续派送。\n\n关于包裹退回：\n1. 若包裹已在海外物流环节被作废，通常无法退回国内。\n2. 建议您通过后台“帮助”中心联系客服，核实具体的异常原因及包裹去向。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-18 19:18:24","用户":"YYY","群":"","用户问询":"被系统识别为目录商品（Catalog）并要求加入购物车竞争可以拒绝吗","AI响应":"你好！很高兴为你解答。\n\n目前美客多平台的目录商品（Catalog）机制主要是由系统根据 Universal Code（如UPC/EAN）自动识别并提示加入的。\n\n1. **控制权**：虽然系统会自动提示您加入目录竞争，但您对自己的列表拥有完全的控制权。\n2. **竞争策略**：如果您不想在目录页面中竞争，可以通过调整销售条件（如价格、免息分期等）来影响您的展示。\n3. **展示逻辑**：相同产品的列表会聚集在一起，提供最佳条件的列表将被作为最显眼的选项展示，其他卖家的列表将显示为“查看更多选项”。\n\n通常情况下，目录商品在搜索结果中拥有极高的权重和优先展示位，能够带来巨大的流量，因此建议通过优化价格和信誉来争取赢得购物车。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-18 18:38:54","用户":"阿柱","群":"","用户问询":"请问在美客多平台上能销售这类ip产品吗，全托或者半托 对授权有什么要求","AI响应":"你好！很高兴为你解答。\n\n关于在美客多全托管或半托管模式下销售IP品牌产品，有以下明确要求：\n\n1. 授权要求：没授权肯定不能卖。美客多平台对仿品和侵权产品采取零容忍政策，一旦发现会直接下架产品甚至关闭店铺。卖家必须确保拥有合法的品牌授权书，且授权链路完整合规。\n\n2. 模式政策：无论是全托管还是半托管，平台都会严格审核商品的品牌资质。如果无法提供官方授权证明，建议不要上架此类IP产品，以免影响店铺安全。\n\n请确保您的商品和品牌授权完全合规后再进行后续操作。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-16 14:22:52","用户":"海  濤 ·","群":"","用户问询":"我上周填写了问卷，但是现在还没有官方的通知，能否通过你这边入住呢","AI响应":"你好！很高兴为你解答。半托管入驻审核预计时效为20-30个工作日，目前商家登记较多，请耐心等待并保持通讯畅通。普通自发货或海外仓也可选择自注册：https://global-selling.mercadolibre.com/landing/about","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-16 14:22:08","用户":"海  濤 ·","群":"","用户问询":"你好，我上周填写了问卷，但是现在还没有官方的通知，能否通过你这边入住呢","AI响应":"你好，表里留下注册邮箱后，就可以咨询我入驻、选品以及运营相关的问题啦。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-19 19:01:15","用户":"cc","群":"","用户问询":"销售表现 的要求是急什么 销售表现 的要求是什么","AI响应":"你好！很高兴为你解答。\n\n关于销售表现的具体要求，平台并没有给出一个绝对的数值门槛，但通常会从以下几个维度进行评估：\n\n1. 订单量：店铺需要有稳定的出单记录，证明产品在市场上有需求。\n2. 销售额：达到一定的销售规模，体现店铺的经营能力。\n3. 转化率：Listing的点击与成交比例表现良好。\n4. 评价指标：买家反馈积极，没有过多的纠纷或投诉。\n\n建议你先通过自发货模式（ME2）努力提升店铺信誉至绿色等级，并保持稳定的出单节奏。当系统判定你的店铺具备处理海外仓业务的能力时，会自动为你开通Full仓权限。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-19 17:38:03","用户":"爱老虎呦🐯","群":"","用户问询":"对营业执照要求的范围必须包含什么","AI响应":"营业执照需为最新版本，正面清晰完整，正副本均可。必须是有限责任公司或股份有限公司，不接受个体工商户。经营范围需包含“贸易、零售、批发、进出口”等相关项，且执照不能有缺角或截屏。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-18 12:36:34","用户":"蓝七","群":"","用户问询":"为什么会有净收入要高于6美金的要求呀","AI响应":"你好！很高兴为你解答。平台对不同站点和类目设有最低售价限制，以确保覆盖基础的跨境物流和操作成本。若净收入过低，生成的最终售价将无法满足上架要求。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-17 10:49:34","用户":"星星","群":"","用户问询":"您好平台上线上品对公司的基本户有强制要求嘛？","AI响应":"美客多对公司的基本户没有强制要求。目前平台支持使用第三方收款工具（如派安盈、PingPong、连连等）进行收款，无需绑定国内银行基本户。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-16 13:43:47","用户":"，","群":"","用户问询":"我申请的是全托店铺 没通过也要通知一下比较好吧","AI响应":"全托管模式审核时效通常为20-30个工作日，客户经理会按批次联系。若审核未通过，平台通常会发送邮件通知，请务必检查注册邮箱及垃圾邮件箱。若超过30个工作日仍无任何反馈，建议联系对接的招商经理核实。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-13 17:15:35","用户":"sleepingsleep","群":"","用户问询":"为什么这里一直被退回来 已经拍的很清楚了","AI响应":"你好！营业执照被退回通常有以下核查方向：请确保提供的是正面、清晰完整的实拍图或扫描件（正副本均可），必须是最新版本，不能有缺角，且平台不接受截屏。建议您对照这些要求重新上传。","一级大类":"其他","二级子类":"政策咨询","问题主题":"平台政策/官方规则"},{"时间":"2026-07-18 16:02:50","用户":"無念","群":"","用户问询":"邮箱有什么要求吗","AI响应":"你好！很高兴为你解答。\n\n关于美客多注册邮箱的要求如下：\n\n1. 邮箱后缀要求：目前平台仅支持 Gmail、Outlook、Aliyun（必须是 @aliyun.com 格式）、Hotmail 和 Foxmail。请务必避开使用 QQ、163、126 以及新浪等国内邮箱，否则会因为无法收到邀请链接或审核通知导致递交失败。\n\n2. 唯
