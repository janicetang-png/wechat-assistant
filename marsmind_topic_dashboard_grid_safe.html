  <style>

      --blue: #1d4ed8;
      --teal: #0f766e;

      --shadow: 0 12px 30px rgba(22, 34, 53, 0.08);

    * { box-sizing: border-box; }
    body {
      margin: 0;

      font-size: 14px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 72px;
      padding: 14px 24px;
      background: #17324d;
      color: #fff;
      box-shadow: var(--shadow);

    h1 { margin: 0; font-size: 21px; line-height: 1.25; letter-spacing: 0; }

    .lang-switch { display: inline-flex; gap: 4px; padding: 3px; border: 1px solid rgba(255,255,255,0.26); border-radius: 7px; background: rgba(255,255,255,0.08); }
    button {
      border: 1px solid rgba(255,255,255,0.28);
      color: #fff;
      background: rgba(255,255,255,0.10);
      height: 34px;
      padding: 0 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: rgba(255,255,255,0.18); }
    .lang-btn { height: 28px; padding: 0 9px; border-color: transparent; font-size: 12px; }
    .lang-btn.active { background: #fff; color: #17324d; }
    .save-status { min-width: 54px; font-size: 12px; color: #dbeafe; }
    main {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      padding: 18px 22px 28px;
      max-width: 1420px;
      margin: 0 auto;
    }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;
    }
    h2 { margin: 0; font-size: 16px; line-height: 1.3; letter-spacing: 0; }
    .hint { color: var(--muted); font-size: 12px; }
    .kpis {
      display: grid;
      grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 12px;
      padding: 14px;
    }
    .kpi {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: var(--wash);
      min-height: 86px;

    .kpi-label { color: var(--muted); font-size: 12px; }
    .kpi-value { margin-top: 8px; font-size: 25px; font-weight: 750; }
    .grid-two {
      display: grid;
      grid-template-columns: minmax(460px, 1.1fr) minmax(460px, 1fr);
      gap: 16px;
    }
    .chart-wrap { padding: 14px; }
    .bars { display: grid; gap: 9px; }
    .bar-row { display: grid; grid-template-columns: minmax(220px, 28%) 1fr 62px; gap: 10px; align-items: center; }

    .bar { height: 100%; min-width: 2px; background: #166987; }
    .bar-num { text-align: right; font-variant-numeric: tabular-nums; }
    .table-wrap { overflow: auto; max-height: 620px; }
    table { border-collapse: collapse; width: 100%; }
    th, td {
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      padding: 7px 8px;
      vertical-align: top;
      line-height: 1.35;

    th {

      top: 0;
      z-index: 2;
      background: #17324d;
      color: #fff;
      text-align: left;
      font-weight: 700;
      white-space: nowrap;

    td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    td.editable {
      background: #fffdf6;
      outline: none;
      min-width: 82px;
    }
    td.editable:focus {
      box-shadow: inset 0 0 0 2px #f59e0b;
      background: #fff7d6;
    }

      background: #fffdf6;
    }
    .issue-editor {

      outline: none;
      white-space: pre-wrap;
    }
    .issue-editor:focus {
      box-shadow: inset 0 0 0 2px #f59e0b;
      background: #fff7d6;
    }

      height: auto;
      margin-top: 5px;
      padding: 0;
      border: 0;
      border-radius: 0;
      color: #006c85;
      background: transparent;
      font-weight: 750;
      line-height: 1.3;
      text-align: left;

    button.view-all:hover {
      color: #004d61;
      background: transparent;
      text-decoration: underline;
    }

    .detail-modal {

      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(15, 23, 42, 0.48);

    .detail-panel {
      width: min(1180px, 96vw);
      max-height: 88vh;
      display: grid;
      grid-template-rows: auto 1fr;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.25);

    .detail-head {

      align-items: center;

      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;

    .detail-count { margin-top: 3px; color: var(--muted); font-size: 12px; }
    button.detail-close {

      background: #fff;
      border: 1px solid var(--line);
    }
    .detail-body {
      overflow: auto;
      max-height: calc(88vh - 58px);

    .detail-body table {
      min-width: 1100px;
    }
    .detail-body td {
      max-width: 360px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;

    .delta-up { color: var(--green); font-weight: 700; }
    .delta-down { color: var(--red); font-weight: 700; }
    .module-tabs {
      display: flex;
      gap: 8px;
      padding: 12px 14px 0;
    }
    .module-tabs button {
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .module-tabs button.active {
      background: #17324d;
      color: #fff;
    }
    .source {
      padding: 12px 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    @media (max-width: 980px) {

      .kpis { grid-template-columns: repeat(2, minmax(150px, 1fr)); }
      .grid-two { grid-template-columns: 1fr; }
      main { padding: 12px; }
      .bar-row { grid-template-columns: minmax(150px, 42%) 1fr 56px; }
    }

,{"时间":"2026-07-14 10:40:26","用户":"Sally","群":"","用户问询":"你好，现在有很多全托管和半托管的业务，我想问下这种模式对我们做美国转运仓的卖家冲击大吗？我该如何构建自己的竞争力而不被瓜分市场","AI响应":"全托管和半托管主要针对工厂和品牌方，由平台统一运营或深度控价。美国转运仓卖家的核心竞争力在于：\n\n1. 选品灵活性：利用“一仓发五国”优势，快速测试多站点爆款，降低单站点库存风险。\n2. 自主定价权：相比全托管，您能根据利润目标灵活调价，自主掌控营销节奏。\n3. 差异化选品：避开全托管集中的高频标品，深挖长尾、个性化或需精细化运营的类目。\n\n建议采取多款式、轻库存策略，利用美国转运仓无需RFC税号的合规优势，快速覆盖拉美多国流量。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-13 10:16:56","用户":"纯属巧合","群":"","用户问询":"你好， 半托管国内需要缴税吗？ 具体是要怎么缴？ 税局是根据哪些数据核算税费， 这些数据是通过什么形式发给税局？","AI响应":"你好！很高兴为你解答。\n\n关于墨西哥RFC税务政策，根据墨西哥政府最新税务法规要求，自2026年1月1日起，所有电商平台须按新标准执行增值税及所得税的预扣缴义务。\n\n1. RFC税号缺失的影响\n未提供RFC税号不影响您在美客多平台的现有销售权限。但依据新规，若未能按时上传有效RFC税号，平台将依法对您的墨西哥销售额按36%的税率实施强制预扣税。\n\n2. 适用范围\n本政策目前适用于通过墨西哥海外仓进行销售的订单，即所有存储于墨西哥境内的商品所产生的销售额（自发货不适用，自发货不需要税号）。自2026年1月1日起，上述范围商家如未上传有效RFC税号，平台将按上述税率执行预扣。\n\n3. RFC税务制度与预扣税率对应关系\n根据您登记的RFC类型及收款账户性质，平台将适用不同预扣税率，具体如下：\na. 已上传墨西哥本地RFC税号 + 使用本地收款账户：总预扣税率为10.5%\nb. 已上传墨西哥本地RFC税号 + 使用海外收款账户：总预扣税率为18.5%\nc. 已上传海外RFC税号 + 使用本地或海外收款账户：总预扣税率为16%\nd. 未上传任何RFC税号：总预扣税率为36%\n\n4. 税费核算与申报\n平台会根据您在墨西哥境内的实际销售额数据进行税费预扣。如您尚未注册RFC税号或需进一步了解相关税务细节，建议及时咨询专业税务代理服务机构，以确保合规经营。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-19 18:34:37","用户":"爱老虎呦🐯","群":"","用户问询":"仅有贸易零售和批发可以吗。进出口我们这边没有海关，办理进出口手续慢，难。等着之后做起来了再添加可以吗","AI响应":"可以的。只要经营范围中包含“贸易”、“零售”或“批发”等具备货物贸易属性的字样即可，不强制要求必须包含“进出口”。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-18 11:15:55","用户":"几木晴天","群":"","用户问询":"那就先不用管 等后面需要在去提交 感谢 对了 产品我只需要上到一个站点 他就会同步到其他站点对吧","AI响应":"是的。美客多跨境店支持一个账号开通所有站点，开店做自发货时，其他站点都是自动开通的，你可以同时在巴西、墨西哥、智利等五大站点销售。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-17 17:32:27","用户":"企业微信团队","群":"","用户问询":"你的账号进行了网站登录操作 登录网站：微盛·企微管家 登录时间：2026年07月17日17:32","AI响应":"收到。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-17 09:13:33","用户":"泽创-刘奕鸿 18922412549","群":"","用户问询":"洗水标是 polyamide+elastane，详情成分我们写的是 nylon+spandex 有影响吗","AI响应":"建议保持一致。虽然含义相同，但为避免买家因“产品和描述不一致”发起投诉影响购 "其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-15 09:13:52","用户":"Star Chow","群":"","用户问询":"为什么这种订单会超过48h后，平台还会取消？这样卖家的货如果发出，退不回，不就是损失吗？","AI响应":"自发货48小时时效是指物流商揽收并扫描的时效。即便已揽收，若包裹在后续运输中被检测出违禁、超材或清关异常，平台为保障买家体验会强制取消订单并作废包裹。若包裹已被作废，通常无法退回，建议联系客服核实异常详情以减少后续损失。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-13 13:59:11","用户":"Felicity 103%","群":"","用户问询":"我的公司名为：莆田市艾迈逊贸易有限公司 已申请了半托店与FTI店，有43天了还未收到消息","AI响应":"你好！很高兴为你解答。\n\n已填写问卷且符合项目画像的商家，买手和客户经理会通过微信或电话联系，请保持通讯畅通。目前登记数量较多，客户经理正按批次联系，预计时效20-30个工作日。\n\n由于你已等待超过40天，建议私聊将公司名和登记邮箱发给你的对接经理帮忙跟进进度。感谢你的理解与等待！","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"},{"时间":"2026-07-18 17:00:06","用户":"KIM","群":"","用户问询":"A电脑登陆店铺后台 B电脑开VPN用于看美客多官网选品 网络固定同一个。","AI响应":"只要不使用VPN登录店铺后台，通常不会产生影响。平台主要风控的是登录后台的IP环境，建议操作后台的电脑保持网络环境纯净。","一级大类":"其他","二级子类":"其他","问题主题":"其他具体问题"}]},{"一级大类":"财税合规","二级子类":"税务合规","Past 7 Days":688,"Previous 2026-07-06 to 2026-07-12":480,"Change":208,"WoW":0.43333333333333335,"Past 7 Share":0.0998693569458557,"高频问题":"RFC/税号/扣税政策","__details":[{"时间":"2026-07-17 15:30:50","用户":"张志明","群":"","用户问询":"你好 想咨询一下RFC问题，在跨境店的RFC是本土店的税号，第一次签署的时候，有邮件发来：您账户中登记的RFC信息与您所代表的法人实体信息不符。 后续第二次签署的时候，我们更换了另外一个本土店的税号，可以找得到人，但是更换税号后，一直没有签署文件发过来。这该怎么办？","AI响应":"你好！很高兴为你解答。\n\n针对你提到的RFC税号主体不一致以及更换税号后未收到签署文件的问题，处理流程如下：\n\n关于税号主体不一致的解决方式：\n美客多近期针对“店铺注册主体”与“卖家后台所绑定RFC税号主体”不一致的海外仓卖家开展一致性验证工作。你需要使用此前提交CSF文件时登记的邮箱，登录并签署官方通告邮件中的《RFC知情授权书》，确认RFC所有人已充分知晓并正式授权该税号用于您的跨境店铺。\n\n关于更换税号后未收到签署文件：\n如果你在后台提交了RFC变更申请，请确保新RFC对应的CSF邮箱是有效的。平台会通过邮件向需验证卖家发出通告。签署流程通常是：签署完成后，你的卖家注册邮箱会即刻收到第二封邮件，用于核实并确认你的CSF邮箱信息。在确认CSF邮箱信息成功后，你的CSF邮箱才会收到对应的授权信，请登录该CSF邮箱点击并完成签署。\n\n建议你立即自查：\n1. 登录卖家后台，核实当前绑定的RFC税号主体是否已更新。\n2. 检查新RFC对应的CSF登记邮箱，确认是否漏掉了平台发送的验证邮件。\n3. 如果需要变更RFC，请确保在后台提交变更申请并提供新的RFC及对应的CSF。\n\n请务必在规定时间内完成验证。若未能完成，自7月20日之后，店铺的预扣税率将被依法上调至36%。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-13 09:52:42","用户":"Cecelia","群":"","用户问询":"经理， Cust ID: 1541200487 邮箱： ，垃圾箱已经找过了，只有通知RFC等待验证的邮件，我们没有更新税号，税代可以配合处理，","AI响应":"你好！很高兴为你解答。平台会通过CSF登记邮箱发送相关邮件，请卖家按照邮件指引完成签署。请确保该邮箱有效并检查垃圾箱。若确实未收到，请准确填写【CSF邮箱查询信息登记表】查询。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-15 11:25:31","用户":"广告衫·服装定制 17620681808 周","群":"","用户问询":"您好 跨境店 自发货 需要准备 墨西哥 RFC 税号么？ 净收益定价 成本需要把税算进去么？ 除了墨西哥 其他站点需要扣税么？","AI响应":"你好！很高兴为你解答。\n\n关于你咨询的墨西哥跨境店自发货及税费问题，回复如下：\n\n1. 是否需要准备RFC税号\n自发货模式目前不需要绑定墨西哥RFC税号。RFC税号主要针对海外仓模式，自发货卖家目前不涉及墨西哥36%的增值税代扣。\n\n2. 净收益定价是否需要包含税费\n不需要。美客多自发货采用收益价格模式。你只需要在后台录入目标净收益（即：采购成本+利润），平台系统会自动叠加运费、佣金以及可能产生的相关税费生成最终售价，无需你人工计算并加入税费。\n\n3. 其他站点是否需要扣税\n在自发货模式下，其他站点的税费同样由平台系统处理。美客多为跨境卖家提供直邮解决方案，你只需将商品送达至平台指定的中国境内集运仓，后续的国际运输、清关及目的地派送由官方负责。相关进口税费通常由买家在下单时承担。\n\n网页参考资料\n墨西哥RFC税号相关信息：https://mp.weixin.qq.com/s/gLZ3iC9XLqFE4j075JaNSg?from=industrynews&version=4.1.22.6009&platform=win\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-13 10:20:50","用户":"哎嘿","群":"","用户问询":"如果这次美客多税号审核不通过坐等平台移除RFC税号，我能等自己税号下来之后再重新更新税号吗，还是需要自己主动解绑税号","AI响应":"如果您的RFC税号验证未通过，平台将遵从墨西哥税务法规要求，将相关账户的预扣税率上调至 36%。\n\n如果您需要变更RFC，请及时在后台提交变更申请，提供新的RFC及对应的CSF文件。请确保该新RFC对应的CSF邮箱有效性，以便能够接受并配合后续的验证信息。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-18 16:10:51","用户":"ㅤ  ㅤ","群":"","用户问询":"我的货要是在墨西哥别人的仓库呢是否需要RFC税号 是从墨西哥境内发货的跨境卖家都需要提供RFC税号吗","AI响应":"你好！只要货物存储在墨西哥境内并从当地发货，无论是在美客多官方仓还是第三方仓库，都需要绑定RFC税号。若未绑定，平台将面临36%的强制预扣税。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-17 15:49:50","用户":"Lyla 想小鱼🐟","群":"","用户问询":"这个邮箱，貌似是我们找的代理帮我们注册RFC的会计师邮箱，本来他们不提供这个邮箱，就算我们填了这个找到邮箱的话，是不是也需要那边配合才行？ 但是我有个疑问， 不配合的话，我店铺是不是也RFC审核不通过？","AI响应":"是的，必须确保CSF登记邮箱能收信并配合操作。如果未能通过该邮箱完成授权书签署，将导致RFC验证无法通过，届时店铺税率将上调至36%。若该邮箱无法使用，RFC所有者可通过登录墨西哥SAT官网更改关联的电子邮箱，具体操作建议咨询您的财税服务商。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-16 16:57:22","用户":"窦红建","群":"","用户问询":"这里的先绑定美金账号，再绑定墨西哥本土银行账号，是说在RFC没注册下来之前，先绑连连或pingpong的美金账号，RFC注册下来以后再换成墨西哥本土银行账号？还有一个问题，这里本土银行账号，对应的是我用来开店的公司主体，而不是要到墨西哥再注册一个公司？","AI响应":"你好！很高兴为你解答。\n\n关于你的两个疑问，详细说明如下：\n\n1. **绑定顺序与RFC的关系**：\n你的理解基本正确。在没有RFC税号的情况下，为了能正常回款并尝试规避高额代扣税，目前的实操方案是：先在后台绑定连连或PingPong提供的**非美国美金账号**，然后再绑定一个**墨西哥本土银行账号**（通常也是由第三方收款机构如PingPong、派安盈等提供的墨西哥比索收款账户）。\n当你的RFC税号正式注册下来并上传至后台验证通过后，你就不再需要通过这种“美金+本土”的组合来规避税收，而是直接进入合规纳税流程。\n\n2. **本土银行账号的主体问题**：\n不需要在墨西哥注册公司。这里提到的“墨西哥本土银行账号”，是指由第三方收款机构（如PingPong、连连、派安盈等）为你开店的**中国公司主体**代开的墨西哥比索（MXN）收款账户。\n这个账号的收款人信息依然是你用来开店的中国公司，它只是一个具备墨西哥本地清算能力的银行账号，用于接收美客多拨付的比索。\n\n**特别提醒：**\n首次绑定墨西哥本土收款账户的正确步骤是：务必先在国际收款绑定入口完成美元账户绑定，刷新后台弹出本土收款绑定的入口后，再进行本土收款账号的绑定。直接在国际收款入口绑定墨西哥本土账号是无效操作。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-15 23:18:34","用户":"TT","群":"","用户问询":"不好意思打扰了，就是 CBT 换绑这个 RFC 税号进行验证授权，然后姓名那里是填公司名称还是填法人的名字？","AI响应":"你好！很高兴为你解答。关于RFC知情授权书的签署，现有信息未明确提及姓名处应填写公司名称还是法人姓名。请按照平台发送至CSF登记邮箱的邮件指引完成签署。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-15 09:51:15","用户":"💚","群":"","用户问询":"新店铺上传了RFC税号已通过，但是一直没有收到税号主体不一致的邮件，20号后会被强制交税36%吗","AI响应":"你好！平台将于未来一周通过邮件向主体不一致的卖家发出通告。请务必关注提交CSF文件时登记的邮箱，并于7月20日前完成验证。若未按时完成，预扣税率将上调至36%。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-13 21:16:20","用户":"游济远","群":"","用户问询":"你好，又要打扰一下，还有三个问题，1. 中国大陆营业执照入驻德州转运仓，不需要办墨西哥税号？不办墨西哥税号的情况下，税费是多少呢？2. 注册入驻审核时间大概是几个工作日？3. 首批入住德州仓第一票货物是不是店铺激活后30天必须入仓，10SKU以上，并且总商品数量不少于600件。","AI响应":"你好！很高兴能为你服务，一点也不打扰。针对你的三个问题，解答如下：\n\n1. 税号与税费问题\n使用美国转运仓配送墨西哥不需要提供RFC税号。该模式属于跨境直邮，而非本土发货，因此不需要办理墨西哥属地化税务登记。关于税费，相应的进口税费由买家在下单时承担并支付，卖家可以有效避免复杂的税务预扣风险。\n\n2. 审核时间\n美客多的注册审核周期通常为20-30天。如果提交资料后等待时间超过20个工作日仍未更新，可以联系官方客服进一步查询。\n\n3. 首批入仓要求\n关于德州仓的首批入仓规则，目前官方资料中并未强制要求必须在30天内入仓或必须达到10个SKU及600件商品。不过，为了保证店铺的活跃度和经营效果，建议在账号激活后尽快安排发货上架。\n\n普通自发货/海外仓也可选择自注册（PC端登入）：https://global-selling.mercadolibre.com/landing/about\n\n入驻准备材料：\n1. 企业资质：中国内地或香港公司营业执照（不接受个体户，须是“有限公司”）。\n2. 法人信息：法人身份证，且法人需配合进行人脸识别认证。\n3. 收款账户：提供一个非美国境内的美元（USD）银行账户用以接收结算款项（如第三方收款账户）。\n4. 联系方式：准备谷歌邮箱、Outlook邮箱或阿里云邮箱（不接受163、QQ、新浪等国内邮箱），以及联系人电话。\n5. 品牌要求：如果是品牌店，还需提供R标或TM标。\n6. 唯一性：一套资料只能注册一个店铺，之前注册过美客多的信息不可重复使用。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-13 14:01:25","用户":"［ PuPu ]","群":"","用户问询":"您好，我想知道店铺的RFC税号如何更换呢，我将新的RFC税号文件上传后，总是会出现第二天再次让我上传的情况。","AI响应":"你好！很高兴为你解答。\n\n关于更换RFC税号的操作，请你登录美客多商户后台，点击“设置”（Settings）中的“销售偏好”（Selling Preferences），或通过下方链接直接提交：https://global-selling.mercadolibre.com/kyc/?initiative=cbt-fiscal-upgrade&amp;congrats=true&amp;landing=true 即可进行 RFC 的更换。\n\n针对你提到的上传后第二天又提示上传的情况，请务必注意以下几点：\n1. 收到验证邮件后，请先确认你当前准备绑定的RFC信息能通过一致性验证。若确认无法通过，请切勿开启验证流程，应先前往卖家后台更新RFC信息，并等待系统触发新的验证邮件。\n2. 请确保新RFC对应的CSF邮箱有效，能够正常接收并配合验证信息。\n3. 平台会针对主体不一致的卖家开展验证工作，请确保你使用的是此前提交CSF文件时登记的邮箱，登录并签署官方通告邮件中的《RFC知情授权书》。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-19 22:55:24","用户":"王雪云","群":"","用户问询":"你好， Editar shen zhen shi he feng wan li shi ye you xian gong si RFC更新，但我已经更新了，后台为什么不能解决。","AI响应":"你好！很高兴为你解答。目前无法直接判断后台未更新的具体原因。建议你先核实当前绑定的RFC信息是否能通过一致性验证。若确认信息无误但后台未解决，请前往卖家后台更新RFC信息，并等待系统触发新的验证邮件。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-15 17:05:28","用户":"TT","群":"","用户问询":"就是7月20号之前不是需要rcf邮箱认证吗 我已经提交了自己墨西哥本土公司的rfc 现在处于审核状态 邮箱也接收到了签名文件 也签名了 之后收到了另外的文件需要填写法人名称和邮箱","AI响应":"这是RFC验证的第二步。在签署第一封授权信后，您的卖家注册邮箱会收到此邮件，用于核实并确认您的CSF邮箱信息。请在此处填写您提交CSF文件时登记的邮箱及对应负责人姓名。确认成功后，该CSF邮箱将收到最终的授权信进行签署。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-14 23:13:36","用户":"春天的熊","群":"","用户问询":"你好，税号邮箱签署RFC知情授权书之后，店铺邮箱一直没有收到完成邮件，这是为什么呢","AI响应":"你好！很高兴为你解答。\n\n关于RFC知情授权书的签署，在您完成签署后，您的卖家注册邮箱会即刻收到第二封邮件，用于向您核实并确认您的CSF邮箱信息。\n\n如果您一直没有收到完成邮件，建议您先检查一下卖家注册邮箱的垃圾邮件箱，确认是否被拦截。同时，请确保您是使用此前提交CSF文件时登记的邮箱进行的签署操作。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-13 10:37:30","用户":"熊小能","群":"","用户问询":"我们的店铺Cust ID: 2378237096 收到平台确认CSF邮箱： 。 但是我们通过扫描CSF上的二维码，可以看出我们RFC（AGX250516S69） 。请帮忙核实！！！","AI响应":"目前无法直接判断具体原因。建议您优先核查此前提交CSF文件时登记的邮箱，并以平台邮件通知的验证要求为准。若需进一步核实，建议联系平台后台确认。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-19 17:41:21","用户":"爱老虎呦🐯","群":"","用户问询":"现在要求的RFC税号是否还需要法人邮箱验证，之后如果税号出问题可以申请换绑吗？","AI响应":"你好！很高兴为你解答。\n\n关于RFC验证，平台会通过CSF登记邮箱发送邮件，卖家需按照指引完成签署。\n\n如果需要变更RFC，请及时在后台提交变更申请，提供新的RFC及对应的CSF，并确保新RFC对应的CSF邮箱有效，能配合完成后续验证。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-18 15:32:56","用户":"野海","群":"","用户问询":"目前只是需要注册店铺，不销售，注册海外仓可以不提交墨西哥RFC税号吗","AI响应":"你好！很高兴为你解答。\n\n注册美客多墨西哥站海外仓模式时，目前不强制要求在注册阶段就提交RFC税号。\n\n您可以先完成店铺注册并激活，在没有税号的情况下，您可以先绑定非大陆/香港的美金账号，再绑定墨西哥银行账号，这样可以暂时避免代扣代缴。\n\n但请注意，如果您后续开始使用海外仓发货销售，且在2026年1月1日后仍未上传有效RFC税号，平台将依法对您的销售额按36%的税率实施强制预扣。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-18 14:39:38","用户":"ㅤ  ㅤ","群":"","用户问询":"你好货物备到美客多官方仓需要RFC税号对吧那备货道第三方海外仓库呢也需要吗","AI响应":"你好！只要货物存储在墨西哥境内（无论是美客多官方仓还是第三方海外仓）并进行销售，根据墨西哥税法，都需要绑定RFC税号。若未绑定，平台将按36%的税率进行代扣代缴。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-14 20:08:49","用户":"Chen","群":"","用户问询":"经理晚上好，我想请教个问题：就是我们RFC文件更新了对应的邮箱，签署授权的时候是填更新过后的邮箱吗，我看很多卖家也说更新过邮箱，签授权的时候填新邮箱直接说不一致不通过[發抖]","AI响应":"你好！很高兴为你解答。\n\n在进行RFC税号主体授权及一致性验证时，请务必使用此前提交CSF（Constancia de Situación Fiscal 纳税状况登记证明）文件时登记的邮箱，登录并签署官方通告邮件中的《RFC知情授权书》。\n\n如果您已经更新了RFC信息，请确保该新RFC对应的CSF邮箱有效性，以便接受并配合验证信息。收到验证邮件后，请务必先确认您当前绑定的RFC信息能通过一致性验证。若确认无法通过，请切勿开启验证流程，应先前往卖家后台更新RFC信息，并等待系统触发新的验证邮件。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-13 16:18:15","用户":"MGG","群":"","用户问询":"3162626272 3161702353 我想知道这两个店铺本次RFC审核是否闭环，是否完成全部内容了 我这边目前只收到了三方签署的邮件，但是还没收到最终平台确认的邮件，","AI响应":"你好！很高兴为你解答。\n\n非常抱歉，我无法通过你提供的店铺编号直接查询后台的实时审核进度或审核状态。\n\n关于你提到的RFC验证流程，根据你提供的图片内容和目前的进展，可以参考以下信息：\n\n1. 审核闭环标志\n图片中显示的“Your RFC has been validated”以及“There is nothing you need to do right now”是平台确认RFC验证成功的标准提示。如果你在邮件中收到了类似内容，说明该店铺的RFC知情授权书签署及主体一致性核验已完成。\n\n2. 邮件确认\n通常流程是：卖家完成三方电子签署 -> 平台进行内部核验 -> 平台发送最终验证成功的确认邮件。如果你目前只完成了签署，但尚未收到如图片所示的最终确认邮件，说明平台仍在核验过程中。\n\n3. 建议操作\n请持续关注CSF登记邮箱以及卖家后台的通知。如果核验通过，你会收到正式的确认邮件；如果资料有误或需要补充，平台也会通过邮件指引你下一步操作。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-13 12:41:29","用户":"牛奶","群":"","用户问询":"这些被多扣的税务，在我最后提交了RFC税号后，会不会可以申诉回来","AI响应":"现有信息未提及多扣税费是否可以申诉退回。建议您在成功绑定有效RFC税号后，联系平台后台或咨询专业税务代理确认相关政策。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-18 16:24:29","用户":"ㅤ  ㅤ","群":"","用户问询":"没有RFC税号的话这个扣36%从什么时候开始执行","AI响应":"你好！根据墨西哥政府最新税务法规要求，自2026年1月1日起，若未能按时上传有效RFC税号，平台将依法对您的墨西哥销售额按36%的税率实施强制预扣税。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-18 15:16:27","用户":"野海","群":"","用户问询":"美客多墨西哥站点注册海外仓，必须要提交墨西哥RFC税号资料吗","AI响应":"你好！很高兴为你解答。\n\n做美客多墨西哥官方海外仓模式是需要绑定境外RFC税号的。\n\n如果您暂时还没有RFC税号，可以先绑定美金账号，再绑定墨西哥本土银行账号，平台暂时不会代扣代缴，等申请到税号后再绑定即可。\n\n但需要注意的是，根据墨西哥政府最新税务法规要求，自2026年1月1日起，所有电商平台须按新标准执行预扣缴义务。如果您在2026年1月1日后仍未上传有效RFC税号，平台将依法对您的墨西哥海外仓销售额按36%的税率（16%增值税 + 20%所得税）实施强制预扣税。\n\n如果您选择的是自发货模式，则不需要提供RFC税号。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-18 09:47:56","用户":"Morii","群":"","用户问询":"我们的店铺是跨境店现在还挂着本土RFC税号有事吗","AI响应":"你好！很高兴为你解答。\n\n关于跨境店挂着本土RFC税号的情况，建议如下：\n\n对于跨境卖家，强烈建议选择离岸税号，其合规性与账户安全性最高。本土税号虽在部分环节税务成本较低，但面临极高的税务稽查与账号关联风险，极易导致店铺封禁及资金冻结。\n\n如果您的RFC税号主体与账号主体不一致，则需要完成一致性验证。7月20日之后，对于未能完成验证的店铺，平台将遵从墨西哥税务法规要求，将相关账户预扣税率上调至 36%，协助实现依法合规纳税。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-15 13:09:38","用户":"Jungle King    Jackie","群":"","用户问询":"不在墨西哥官方海外仓模式运营就可以不用RFC税号吧？","AI响应":"是的，自发货模式和美国转运仓模式不需要RFC税号。只有选择墨西哥官方海外仓（Full仓）模式才必须办理并绑定。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-14 18:49:31","用户":"hui","群":"","用户问询":"我已经上传新的RFC税号，目前还在审核中，请问需要几天审核","AI响应":"从您提供的图片来看，您的公司法律信息已批准，目前处于“全墨西哥RFC号正在验证中”的状态。\n\n关于RFC税号的审核时效，现有信息未明确提及具体的审核天数。建议您每日检查后台系统状态更新以及注册邮箱（包括垃圾邮件箱）的通知邮件。如果审核时间过长，您可以联系对应的招商经理或官方客服进一步查询进度。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-19 06:36:22","用户":"楊","群":"","用户问询":"你好 我后台上传RFC税号入口没了","AI响应":"你好，表里留下注册邮箱后，就可以咨询我入驻、选品以及运营相关的问题啦。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-18 19:04:28","用户":"十月","群":"","用户问询":"您好，这个可以帮我看下是什么问题吗，我不是很理解，说是数据不一致，是指哪个呢，和店铺不一致的话不是签署RFC知情授权书就可以了吗","AI响应":"你好！根据图片提示，数据不一致是指你提交的CSF文件信息与后台填写的RFC信息（如姓名、公司名称、税号、地址等）存在差异。请核实后台填写的每一项数据是否与CSF文件完全对应。若确认数据一致但仍被拒，建议联系对应工作人员核实。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-18 11:25:27","用户":"hui","群":"","用户问询":"我先开店，后期RFC税号下来了，再添加可以吗？","AI响应":"你好！可以的。\n\nRFC税号的添加不需要等产品上架出单，也不强制在开店初期就拥有。你可以在店铺开通后先正常经营，等后期申请到RFC税号了，再在后台提交相关信息进行绑定。\n\n如果你做的是美客多墨西哥官方海外仓模式，建议尽早准备。如果暂时还没有RFC税号，可以先绑定美金账号，再绑定墨西哥本土银行账号，平台暂时不会代扣代缴，等申请到税号后再补充上去即可。自发货模式则不需要税号。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-16 11:26:53","用户":"yea","群":"","用户问询":"RFC税号变更，需要提交什么文件到平台呢","AI响应":"如果需要变更RFC，请及时在后台提交变更申请，提供新的RFC及对应的CSF文件。请确保该新RFC对应的CSF邮箱有效，以便接收并配合验证信息。\n\n您可以通过以下链接直接提交或更新您的RFC信息（建议电脑端打开）：https://global-selling.mercadolibre.com/kyc/?initiative=cbt-fiscal-upgrade&congrats=true&landing=true","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-14 16:58:23","用户":"Mr.J","群":"","用户问询":"之前提交过RFC税号，现在是更新，可以吗","AI响应":"可以的。请通过链接 https://global-selling.mercadolibre.com/kyc/?initiative=cbt-fiscal-upgrade&congrats=true&landing=true 直接提交或更新您的RFC信息（复制链接在电脑端打开）。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-13 11:48:59","用户":"刘文杰","群":"","用户问询":"那本土RFC绑定的税号的法人也是本土的吗","AI响应":"是的，墨西哥本土RFC税号的法人必须是墨西哥公民或持有合法居留许可（如居留证）的外国公民。\n\n如果是以墨西哥公司（Persona Moral）名义申请，该公司必须在墨西哥当地注册，且其法定代表人（Representante Legal）必须拥有墨西哥当地的身份证明和有效的RFC税号。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-18 09:51:22","用户":"Morii","群":"","用户问询":"那我们的跨境店铺7月20日之后还挂着本土税号，也没验证，会不会封店，还是只会扣36%的税，会不会被税务局查到，查到会怎么样","AI响应":"你好！很高兴为你解答。\n\n1. 关于封店与扣税：\n7月20日之后，若未完成RFC主体一致性验证，店铺不会被封，但预扣税率将依法上调至36%。\n\n2. 关于税务风险：\n本土税号虽在部分环节税务成本较低，但面临极高的税务稽查与账号关联风险。如果被税务机关查实主体不一致或存在违规，极易导致店铺封禁及资金冻结。\n\n3. 建议：\n对于跨境卖家，强烈建议选择与注册主体一致的离岸税号，其合规性与账户安全性最高。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-18 09:50:20","用户":"Morii","群":"","用户问询":"那我们的跨境店铺7月20日之后还挂着本土税号，也没验证，会不会封店，还是只会扣36%的税，会不会被税务局查到，查到会怎么样","AI响应":"你好！很高兴为你解答。\n\n根据目前的信息，如果你的跨境店铺在7月20日之后未能完成RFC主体一致性验证，平台将遵从墨西哥税务法规要求，将相关账户的预扣税率上调至36%，以协助实现依法合规纳税。\n\n关于你担心的其他风险：\n1. 封店风险：虽然目前政策明确的影响是税率上调，但使用与账号主体不一致的本土税号面临极高的税务稽查与账号关联风险，这极易导致店铺封禁及资金冻结。\n2. 税务稽查：本土税号如果被税务局查到主体不符或存在违规授权，可能会面临高额罚款及业务关停风险。\n\n对于跨境卖家，强烈建议选择与注册主体一致的离岸税号，这是合规性与账户安全性最高的做法。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-17 09:38:47","用户":"黄少敏","群":"","用户问询":"需要更新RFC税号，可以吗","AI响应":"你好！很高兴为你解答。\n\n关于墨西哥RFC税号的更新，请参考以下信息：\n\n1. 验证要求：墨西哥跨境店铺需要进行RFC税号有效性验证。如果您的RFC税号与账号主体不一致，则需要完成一致性验证。\n2. 预扣税影响：对于未能完成验证的店铺，平台将遵从墨西哥税务法规要求，将相关账户预扣税率上调至36%。\n3. 操作建议：建议您按照平台指引及时更新并验证。对于跨境卖家，强烈建议选择与注册主体一致的离岸税号，其合规性与账户安全性最高。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-15 23:20:05","用户":"TT","群":"","用户问询":"这个指引有两个选项，有一个姓名跟邮箱 那我姓名这一栏不知道怎么填 因为这是一家 SA 公司的税号，也是我们自己的","AI响应":"从您提供的图片来看，这是 DocuSign 的签署界面。在 RFC 知情授权书的签署场景下，姓名一栏应填写 RFC 税号对应的主体名称。既然是 SA 公司的税号，建议填写该公司的官方登记名称，并确保与 CSF 文件上的主体名称一致。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-15 11:41:55","用户":"ㅤ  ㅤ","群":"","用户问询":"跨境店也需要RFC税号吗上传","AI响应":"你好！跨境店是否需要RFC取决于业务模式：自发货不需要；海外仓模式需要。若做海外仓未上传RFC，平台将按36%税率强制预扣。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-15 10:10:54","用户":"Bruce","群":"","用户问询":"怎么注册rfc税号","AI响应":"你好，很高兴为您解答。关于墨西哥RFC税号的办理，您可以联系专业的税务服务商进行办理。RFC是由墨西哥税务机关 SAT分配的唯一12位字母数字识别码。\n\n对于跨境卖家，强烈建议选择与注册主体一致的离岸税号，其合规性与账户安全性最高。如果您是自发货卖家，暂时不做墨西哥RFC税号的强制要求。但如果您使用墨西哥海外仓，建议您提前评估并准备。\n\n网页参考资料：\nRFC提交指引：https://doc.weixin.qq.com/pdf/d3_AfYAYgZCAGgKWsXU04xQce3N7RC12?scode=AI8A3wfvAAouqPnVrtAfYAYgZCAGg&isFromNewImportWithExcel=1\n税务合规渠道SPN：https://mercadolibre.cn/melispn\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-14 18:14:09","用户":"H","群":"","用户问询":"rfc税号需要怎么办理","AI响应":"你好！办理墨西哥RFC税号，你可以联系专业的税务服务商进行办理。RFC是由墨西哥税务机关分配的唯一识别码，建议选择与注册主体一致的离岸税号。\n\n网页参考资料\nRFC提交指引：https://doc.weixin.qq.com/pdf/d3_AfYAYgZCAGgKWsXU04xQce3N7RC12?scode=AI8A3wfvAAouqPnVrtAfYAYgZCAGg&isFromNewImportWithExcel=1\n税务合规渠道SPN：https://mercadolibre.cn/melispn\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-14 15:55:09","用户":"+k","群":"","用户问询":"自发货需要办理RFC税号吗","AI响应":"自发货不需要提供税号。\n\n关于墨西哥RFC税号的要求，主要取决于您选择的业务模式：\n如果您选择的是自发货模式，目前不涉及墨西哥36%的增值税代扣，您可以先激活店铺跑自发货。\n如果您选择的是海外仓模式，建议您办理RFC税号。如果没有税号，平台将面临约36%的代扣税（16%增值税 + 20%所得税）。\n如果您使用美国转运仓配送墨西哥，则不需要提供RFC。因为这种模式属于跨境直邮而非本土发货，相应的进口税费由买家在下单时承担。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-13 10:18:29","用户":"纯属巧合","群":"","用户问询":"半托管不是不需要RFC税号的吗","AI响应":"你好！很高兴为你解答。\n\n你的理解是正确的。在美客多半托管模式下，墨西哥站点的税费是代扣代缴的，卖家确实不需要RFC税号。\n\n在半托管模式下，卖家在定价时不包含税费，最终前端显示给消费者的价格是包含税费的，这部分税费由买家承担。同时，平台也不会对半托管卖家进行36%的增值税和所得税代扣。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-19 23:22:01","用户":"2号线","群":"","用户问询":"方案一税率要达到10.5%的话，回款到对方公户，然后会计月度税务申报，对方公户再回款给我，是只能打到PINGPONG吗，或其他什么方式回款才能到我手上，这些环节中哪些环节是需要回款费或税率转化费等其他费用，分别多少 方案二平台回款我要自己掌控只能回款到PINGPONG，这个费用要多少呢","AI响应":"你好！很高兴为你解答。针对你提到的两种RFC税务及回款方案，详细费用拆解如下：\n\n**方案一：使用第三方服务商（如离岸RFC代办/挂靠）**\n1. **回款路径**：平台结算 -> 绑定在后台的第三方收款工具（如PingPong/Payoneer） -> 提现至你的国内银行卡。\n2. **费用环节**：\n   - **平台扣税**：绑定离岸RFC后，平台仅代扣16%增值税（IVA），所得税（ISR）为0%。\n   - **平台提现费**：平台提现操作可能收取少量手续费。\n   - **收款工具手续费**：PingPong等工具提现至国内银行卡，通常收取 **0.3% - 1.2%** 的手续费（根据你的流水量可谈）。\n   - **汇损/转化费**：美金转人民币时，收款工具会按实时汇率扣除约 **0.5% - 1%** 的汇损。\n   - **会计申报费**：需支付给税务代理月度申报费（通常为固定月费）。\n\n**方案二：自行掌控回款（绑定自己的PingPong）**\n1. **回款路径**：平台结算 -> 你的PingPong账户 -> 你的国内个人或公司卡。\n2. **费用环节**：\n   - **税务成本**：同上，绑定RFC后平台代扣16% IVA。\n   - **PingPong提现费**：标准费率通常在 **1%** 左右。如果你的店铺流水大，可以申请更低的费率（如0.5%甚至更低）。\n   - **汇率损失**：同上，约 **0.5% - 1%**。\n\n**总结建议：**\n无论哪种方案，平台回款都是先到你绑定的第三方收款账户（如PingPong）。\n- **主要成本**：16%增值税（IVA）+ 约1%的提现手续费 + 约1%的汇损。\n- **回款方式**：除了PingPong，美客多还支持Payoneer（派安盈）和WorldFirst（万里汇）。\n\n建议你直接绑定自己的PingPong账户，这样资金流向最清晰，费用也最透明。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-18 16:22:05","用户":"ㅤ  ㅤ","群":"","用户问询":"请问36%的预扣税是否为最终税负？如果中国主体后续办理RFC并依法申报，已预扣的税款是否可以抵扣或退还？","AI响应":"你好！根据墨西哥税务法规，平台执行的强制预扣通常作为最终税款缴纳给税务局。目前现有信息未提及已预扣的税款可以在后续办理RFC后进行抵扣或退还。建议咨询专业税务代理了解具体的税务申报及抵扣规则。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-16 16:06:14","用户":"纳洛童","群":"","用户问询":"RELOJ DEPORTIVO SANDA 6200 - 5ATM, LED, ALARMA, CRONOMETROELEVA TU ESTILO ACTIVO TODOS LOS DIASDescubre el Reloj SANDA 6200, un reloj doble pantalla analogica-digital disenado para acompanarte en cada momento.Necesitas un re 你。\n\n4. **为什么这是最佳结果**：\n- **防止白嫖**：你成功保住了 80% 的货款，而不是被全额退款。\n- **保住信誉**：双方达成一致并结案，对店铺信誉没有负面影响。\n- **解决地址问题**：你不需要再为没有阿根廷本地退货地址而发愁了。\n\n**总结：**\n买家已经点头了，**请立即点击“Choose refund option”去提交 20% 的部分退款申请**。操作完后，这单麻烦就彻底解决了。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-13 17:03:40","用户":"飞翔的小鱼","群":"","用户问询":"你好，我的店铺RFC已经上传完成，签署完成，目前审核验证通过了吗？店铺id：2655485037","AI响应":"CSF邮箱签署授权完成后，您的卖家注册邮箱会即刻收到一封提示邮件，确认所有相关文件已成功签署完成。请留意您的注册邮箱收信情况，并以卖家后台显示的审核状态为准。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-18 15:55:46","用户":"十月","群":"","用户问询":"您好，我想问下我RFC邮件已经验证过了，怎么后台审核RFC显示这样，这种是还在审核中吗","AI响应":"你好！从你提供的图片来看，状态显示为 PENDING，说明 RFC 税号目前确实处于审核中。请耐心等待平台审核结果，并留意卖家后台状态的变化。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"},{"时间":"2026-07-18 13:07:38","用户":"Easton","群":"","用户问询":"嗨，经理，我有问题箱咨询一下，一个店铺是只有2次RFC更新机会吗，还是一个月只有2次呢","AI响应":"你好！很高兴为你解答。目前现有信息未提及RFC更新次数的具体限制。建议你登录卖家后台核实当前绑定的RFC税号状态，如需变更请及时提交申请并确保CSF邮箱有效。","一级大类":"财税合规","二级子类":"税务合规","问题主题":"RFC/税号/扣税政策"}]},{"一级大类":"其他","二级子类":"系统报错","Past 7 Days":568,"Previous 2026-07-06 to 2026-07-12":444,"Change":124,"WoW":0.27927927927927926,"Past 7 Share":0.08245028305995064,"高频问题":"后台系统报错/页面问题","__details":[{"时间":"2026-07-18 15:32:43","用户":"肖晓满","群":"","用户问询":"{\"subMsgDesc\":\"\",\"subMsgList\":[{\"subMsgSenderId\":\"0\",\"subMsgSenderCorpId\":0,\"subMsgId\":\"\",\"subMsgType\":14,\"subMsgSenderAvatar\":\"\",\"subMsgSenderName\":\"\",\"subMsgSenderCorpName\":\"\",\"subMsgFromId\":\"0\",\"subMsgData\":{\"filename\":\"企业微信截图_17843596742242.png\",\"fileAesKey\":\"f8f1b4ad33ea307b0a432599812f18cd\",\"fileSize\":60826,\"width\":1724,\"fileMd5\":\"f0c601fbd2d9a104f452f9859d9ad321\",\"fileId\":\"306b020102046430620201000204f3efc7dc02030f4df90204b6e63cb702046a5b2c19042434316639663332632d636339392d346361322d396138312d3163373063316439333831630203102800020300eda00410f0c601fb "AI响应":"你好！很高兴为你解答。\n\n从你提供的文字内容来看，并没有明显的 Emoji 表情符号。\n\n但平台报错通常是因为文本中包含了不可见的特殊字符或格式，建议你核查并删除以下内容：\n1. 列表前的实心圆点符号（•）。\n2. 序号后的空格或特殊的换行符。\n3. 文本中可能存在的 HTML 标签（如隐藏的代码）。\n\n建议你将文字先复制到手机备忘录或电脑记事本中，清除所有格式后再重新粘贴到后台。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-13 16:38:16","用户":"Hynamm","群":"","用户问询":"失败原因： 发布成功0个变种（请到在线产品查看），失败3个变种；失败详情：站点MX:报错:The submitted dimensions and/or weights do not correspond to real measurements of the package. You must use the correct dimensions of the package that you'll use to dispatch your product, as well as the net weight of the item. 站点MX:报错:The submitted dimensions and/or weights do not correspond to real measurements of the package. You must use the correct dimensions of the package that you'll use to dispatch your product, as well as the net weight of the item. 站点MX:报错:The submitted dimensions and/or weights do not correspond to real measurements of the package. You must use the correct dimensions of the package that you'll use to dispatch your product, as well as the net weight of the item. 这个发布失败的原因是？","AI响应":"发布失败的原因是您填写的商品尺寸或重量不符合实际逻辑或超出了平台限制。\n\n系统判定您提交的数据不是真实的包裹测量值。请检查并确保：\n1. 填写的重量包含商品及包装的总重量。\n2. 自发货尺寸限制：长≤60cm，宽≤40cm，高≤35cm，三边之和≤135cm，重量≤15kg。\n3. 避免填写过于夸张或不合理的数值，否则会导致发布失败或账户风险。\n\n请在Listing编辑板块修改为准确的数值后重新提交。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-13 16:47:01","用户":"Rosa Chen（家居家具汽摩配full仓）","群":"","用户问询":"Detail of the retrieval #7416873 Hello 我们有个退仓订单11件货，显示投递失败了在退回官方中，能帮我们查到货在哪里吗？还能再次退仓不","AI响应":"不好意思，该问题我没有答案，请点击以下链接咨询人工客服：\nhttps://work.weixin.qq.com/kfid/kfc7c47108dec2b0070?enc_scene=ENCGH59j4kB9XCrk4dX6Jt2BZeAhKD7ZBUNQhrF2CcGYyCW&scene_param=customer_id=1688858097688347","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-13 10:30:05","用户":"Fearless Dare Devote","群":"","用户问询":"我在信息提交页面选择的是半托和全托，但是信息登记的页面显示的是全托的。这个不影响我开半托的店铺的吧","AI响应":"你好，很高兴为您解答。\n\n这个是不影响的。您在上架全托产品的同时也可以同时上架半托产品。半托管模式和全托管模式在前端展示时，买家是无法区分的。\n\n半托管模式下，您拥有自主定价权，不需要核价，直接上架就可以销售。而全托管模式则由平台负责定价和运营。\n\n网页参考资料\nhttps://mercadolibre.cn/news/info?id=215&type=live","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-18 18:00:09","用户":"迷迷 苏","群":"","用户问询":"东莞仓申请提取商品的 VAS NO后面号码错误，但是提取货物的OC码没错会影响提货吗","AI响应":"你好！很高兴为你解答。\n\n只要你的**OC提货码**是正确的，通常不会影响最终提货。\n\n在退仓提货流程中，**OC提货码**是仓库核验货件最关键的凭证。VAS NO（增值服务单号）虽然是关联单号，但仓库现场主要通过OC码来定位和交付包裹。\n\n**建议操作：**\n1. 在发送预约邮件时，请务必在邮件正文再次清晰写明正确的**OC提货码**。\n2. 提货人到达东莞仓库现场时，直接出示**OC提货码**进行核对。\n3. 务必提醒提货人员在现场当面核对退货实物数量，如有差异需当场反馈，货品离仓后将无法处理。\n\n**退仓预约邮件提醒：**\n收件人：MKDCF2026168@365fanyi.com 和 gpncustomerservice-latinamerica@service.cainiao.com\n邮件标题：Mercado Libre Withdrawal Order + 正确的OC单号\n邮件正文：写明OC提货码 + 提货时间\n\n请注意，库内停滞时长超过5天未提货的货件将会被销毁，请尽快安排。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-17 02:54:25","用户":"楠","群":"","用户问询":"您好，商品实际重量300克，订单显示1400克，还没发，邮费多了，这个订单的重量已经改不了吗","AI响应":"你好！订单生成后，该笔订单的计费重量无法修改。建议你尽快在后台检查并修正该商品的包装后重量和尺寸，确保与实际一致，避免后续订单继续产生运费差异或附加费。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-18 17:35:01","用户":"Michael-拾荒的小男孩","群":"","用户问询":"为什么我上传的马黛茶罐只能在墨西哥显示，其他国家都不能显示呢","AI响应":"你好！很高兴为你解答。\n\n马黛茶罐属于食品接触类产品或可能涉及海关限制。不同国家对进口产品的法律规定不同，建议你优先检查海关限制产品列表。\n\n此外，请确认你在上传时是否勾选了其他国家，并检查其他站点的 Listing 状态是否因为类目审核、禁售限制或物流尺寸超标而被系统自动拦截。\n\n网页参考资料：\nhttps://global-selling.mercadolibre.com/help/16621?&utm_source=vendedores&utm_medium=referral&utm_campaign=Core_ListMyProducts&utm_content=customrestrictedproducts","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-18 17:27:40","用户":"十月","群":"","用户问询":"那我之前绑定特签署过授权书了，怎么还显示不通过呀","AI响应":"目前无法直接判断具体原因。建议您优先核查CSF文件中的RFC主体信息是否与您签署授权书时的主体完全一致。若确认无误但仍未通过，建议联系对应工作人员或通过后台Case进一步核实。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-18 11:52:04","用户":"泫林","群":"","用户问询":"问下，我站点后台，产品 显示 共享，这情况，是怎么定义的，","AI响应":"不好意思，该问题我没有答案","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-18 10:43:23","用户":"鸽子","群":"","用户问询":"为什么美客多后台账单管理显示已支付，但是没有收到钱是什么原因","AI响应":"请优先登录后台 Mercado Pago 板块，核实该笔款项状态是否显示为 Transferred。确认平台放款成功后，请持记录联系您的第三方支付服务商查询入账进度。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-17 17:10:49","用户":"sincere","群":"","用户问询":"请问一下，我为什么上传会出现S/L/XL一传 失败","AI响应":"你好！尺码上传失败通常是因为变体信息填写不完整。请核查：\n1. 每个尺码是否都填写了唯一的通用代码（EAN/UPC）。\n2. 变体属性（如Size/Color）是否与模板要求一致。\n3. 必填项是否有遗漏。\n建议检查报错提示的具体原因。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-17 12:45:18","用户":"兵道伐谋","群":"","用户问询":"我们是全托管和半托管 在提交页面扫码进群 怎么进群呢","AI响应":"添加Abby Wang，备注好公司名称+拉半托群/全托群。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-14 12:03:51","用户":"朵儿","群":"","用户问询":"我绑定万里汇的时候提示上传信息失败是什么原因呢，要怎么解决呢","AI响应":"你好！绑定收款账户时提示上传失败，通常有以下几种原因及解决方法：\n\n1. **网络或浏览器问题**：这是最常见的原因。建议清除浏览器缓存，或更换为 Chrome 浏览器（建议使用无痕模式）重试。\n2. **系统环境波动**：如果更换网络和浏览器后依然无效，说明可能存在系统对接错误。\n\n**解决方法：**\n请填写【KYC问题反馈问卷】：https://www.wjx.cn/vm/tUk4i1V.aspx# \n该问卷专门处理绑定失败、上传错误等系统问题。请详细填写报错页面截图及操作信息，技术团队核查后会通过邮件答复。\n\n**温馨提示：**\n绑定或更换收款账户均需完成**法人人脸识别验证**，请确保操作环境光线充足。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-13 15:43:33","用户":"Deven","群":"","用户问询":"你好 怎么我登录他是空白的，信息刷新不出来 需要翻墙么","AI响应":"你好！从你提供的图片来看，后台界面无法正常加载显示内容。\n\n这通常属于网络波动或浏览器缓存问题。建议你优先使用 Chrome 浏览器并清除缓存，或者直接开启无痕模式重试。\n\n如果界面出现乱码，请务必关闭网页自动翻译功能。若依然无法加载，通常需要切换网络节点或等待系统恢复。如果是新开站点，也可能存在权限同步延迟的情况。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-13 00:46:58","用户":"MGG","群":"","用户问询":"可是为什么我现在看到的后天实际显示每天5.36美金呢","AI响应":"你好！很高兴为你解答。\n\n后台显示的数值与理论计算值存在差异，通常是由以下几个原因造成的：\n\n1. 实际超量件数是动态的\n超量罚款是根据每天仓库实时的库存快照来计算的。虽然你提到的超量总数是 690 个，但如果其中有部分订单正在处理、买家退货尚未入库，或者有部分库存处于不可售状态，系统计算罚款的“实际超量件数”会以每天结算时的实时数据为准。\n\n2. 库容类型的占比\n如果你同时拥有标准件和大件库存，系统会分别计算。如果你的超量部分中，体积较小的标准件占绝大多数，或者部分商品被系统判定为不计入超量罚款的特殊状态，每天的罚款总额就会比预估的要低。\n\n3. 汇率或计费延迟\n后台显示的金额有时会存在一定的汇率换算或数据同步延迟。\n\n4. 具体的计算逻辑\n建议你以卖家后台“购买历史记录（Purchase History）”或“库存绩效”面板中显示的每日明细为准，那是系统根据你店铺实时库存状态得出的最终扣费金额。\n\n既然目前每天产生 5.36 美金的罚款，说明你目前的超量情况确实在产生额外成本。购买库容后，这笔每日扣费将会停止。\n\n网页参考资料\nhttps://global-selling.mercadolibre.com/help/21423","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-19 09:16:50","用户":"Bran","群":"","用户问询":"为什么商品已经在运输中，为何显示影响我得声誉","AI响应":"你好！很高兴为你解答。\n\n如果商品已在运输中仍影响声誉，通常有以下原因：\n1. 延迟发货：虽然已在途中，但实际交给货运公司的时间超过了平台要求的处理时效。\n2. 跟踪号上传延迟：货件已发出但未及时在后台填写跟踪号，导致系统判定为延迟。\n3. 缺货取消：若之前因缺货取消过订单，也会持续影响声誉。\n\n建议在卖家后台“Reputation”板块查看具体的扣分指标。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-18 14:39:43","用户":"骑着毛驴去拉萨","群":"","用户问询":"这种界面的时候退出，自动调价会关闭吗","AI响应":"你好！图片显示系统“正在更新商品”，此时如果直接退出，可能会导致正在处理的更新中断，从而无法成功关闭自动调价。建议等待下方进度条显示更新完成后再退出，以确保设置生效。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-17 15:12:54","用户":"我叫不知道","群":"","用户问询":"没有错误页面，就是点提交之后跳回原页面","AI响应":"你好！很高兴为你解答。在尝试过换浏览器、换网络等手段依然无效的话，可以填写以下问卷进行反馈：https://www.wjx.cn/vm/tUk4i1V.aspx# \n这是专门为了解决KYC阶段问题准备的【KYC问题反馈问卷】。请您花费几分钟时间，详细填写您遇到的具体问题、报错页面截图及相关操作信息。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-17 14:07:02","用户":"iee","群":"","用户问询":"是还在处理吗 但是里面数据都是00","AI响应":"是的，根据截图顶部的橙色提示，系统正在处理您的数据，这可能需要几个小时。由于报表尚未生成完毕，目前下载的文件数据会显示为0。请耐心等待处理完成，待橙色提示消失后再重新下载即可。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-16 12:30:59","用户":"白月光","群":"","用户问询":"请问这里是全部的国家站点都默认开通的吗","AI响应":"你好！美客多跨境账户通常默认开通巴西、墨西哥、智利、哥伦比亚等主要站点。具体以你后台显示的“活跃”状态为准。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-15 15:58:07","用户":"敏","群":"","用户问询":"后台中显示的旗舰产品是什么意思？","AI响应":"你好。旗舰产品是指在特定品类中具有高销量、高转化潜力的核心产品。平台会通过该标识提醒卖家重点关注，并建议通过优化库存、参与促销或开启广告来进一步提升其表现。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-15 15:53:07","用户":"叶子","群":"","用户问询":"我填写邮箱后，为什么一直是灰的，点不了下一步呢","AI响应":"这种情况通常由网络环境或浏览器兼容性引起。建议优先使用Chrome浏览器并关闭网页自动翻译功能，尝试更换设备、切换网络环境或连接VPN后多次刷新重试。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-15 09:50:06","用户":"Later","群":"","用户问询":"为什么没有看到Payments页面","AI响应":"不好意思，该问题我没有答案","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-14 20:40:45","用户":"柯培鑫","群":"","用户问询":"全托管店铺和半托管店铺页面有什么不同吗","AI响应":"在美客多买家前台页面，普通消费者是无法直接区分半托管和全托管店铺的。\n\n两者的前端展示特征非常相似：\n1. **标识一致**：全托管和半托管的产品都会带有“小飞机”图标和“FULL”绿色闪电标识。\n2. **流量权重**：两者都属于托管模式，在搜索排名中都享有极高的流量倾斜。\n\n**虽然买家看不出区别，但对你（卖家）来说，后台操作和核心逻辑有很大不同：**\n\n1. **定价权**：\n- **半托管**：你拥有自主定价权，可以根据成本和利润随时调整前端售价。\n- **全托管**：你只有供货权，最终的前端销售价格由平台根据市场情况统一制定。\n\n2. **费用结构**：\n- **半托管**：你需要支付佣金（目前有50%减免，约为8%），且需要承担广告费。\n- **全托管**：0佣金、0广告费、0仓储费，你只管供货，剩下的费用全由平台承担。\n\n3. **运营深度**：\n- **半托管**：你需要自己上架、优化Listing、提报活动。\n- **全托管**：平台负责上架、翻译、优化和所有营销推广。\n\n总结来说，前端展示上它们都是平台的“亲儿子”，都带FULL标，但全托管更省心，半托管更灵活。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-14 16:37:11","用户":"一个真正的man🏀🐔","群":"","用户问询":"你们出现bug我还要在审核5天？","AI响应":"建议您按照系统提示重新提交数据，此问题通常由系统升级维护引起。提交后我们会尽快为您处理。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-14 16:36:59","用户":"一个真正的man🏀🐔","群":"","用户问询":"系统升级bug？ 那我都等5天了","AI响应":"非常抱歉，目前无法直接判断具体原因。建议您先核查后台是否有报错提示，若无提示且状态回退，请尝试重新提交资料。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-14 15:16:13","用户":"戚","群":"","用户问询":"新绑定到erp的店铺 显示UP字样是什么意思","AI响应":"UP字样代表您的店铺已经升级到了全新的UP（User Product）模式。\n\n目前UP模式无需卖家手动申请开通，平台系统会自动为您进行升级。由于全平台的商品数量非常庞大，为了保障大家店铺和商品的稳定性，目前系统正在分批次平稳迁移中。在迁移过程中，技术团队也会严谨地进行系统调优，因此会有部分店铺先体验到新功能。\n\n预计将在七月底完成全量迁移，还请暂未升级的卖家朋友们耐心等待一下，迁移完成后您即可无缝体验新功能！\n\n如果您是通过自研API发品的商家，需尽快重新开发对接UP新版API。未及时迁移，后续将无法通过API发品，只能后台手动上新，影响正常运营上架。请大家尽快完成UP API迁移，早对接早用新功能，避免后续发品受限。\n\n网页参考资料\nAPI接入文档直达：https://global-selling.mercadolibre.com/devsite/en_us/user-products-cbt","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-14 11:34:01","用户":"Michael-拾荒的小男孩","群":"","用户问询":"保质期这个在终端显示在哪里，是否有截图","AI响应":"你好！很高兴为你解答。\n\n保修时间（Warranty time）通常显示在商品详情页右侧的购买区块下方，或者在页面下方的“Garantía”（保修）板块中。买家可以清晰地看到卖家提供的保修期限和保修类型。\n\n非常抱歉，目前我无法为你提供该位置的具体展示截图。你可以尝试在美客多前台搜索同类产品，查看页面右侧或底部的“Garantía”部分作为参考。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-14 09:56:36","用户":"扣泥几蛙","群":"","用户问询":"我包裹拆分，为什么其中一个包裹一直不显示出来","AI响应":"如果您在后台操作了订单拆分，但其中一个包裹的物流信息一直没有更新或显示，通常是因为物流商的扫描环节出现了延迟。\n\n针对这种情况，请参考以下说明：\n\n1. 扫描时效：包裹派送至中转仓/集运仓后，物流商通常需要12-24小时完成扫描上网。如果超过24小时仍未显示，请联系美客多官方客服，提供交易订单号或货物运单号，客服会协助联系菜鸟核实包裹状态并催促扫描。\n\n2. 检查面单：请确认该包裹是否粘贴了正确的、独立的物流面单。如果面单模糊、损坏或重复使用，会导致仓库无法正常扫描入库。\n\n3. 包裹规范：请确保该包裹符合菜鸟的尺寸和重量限制（长度≤60cm，宽度≤40cm，高度≤35cm，三边之和≤135cm，重量≤15kg）。若包裹超材，可能会被拦截处理而无法正常更新状态。\n\n网页参考资料\n订单拆分具体操作指引：https://doc.weixin.qq.com/pdf/d3_ARIAagYiAMICNcAuVTohoQeSPkKV8?scode=AI8A3wfvAAo0s11m9uAXUA7AYZANA","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-13 16:54:11","用户":"纯属巧合","群":"","用户问询":"你好， 为什么美客多前台打不开？","AI响应":"你好！很高兴为你解答。美客多前台打不开通常有以下几种原因：\n\n1. 网络环境限制：由于美客多是拉美地区的平台，国内网络环境有时无法直接访问前台页面，建议尝试切换网络节点或使用海外代理环境访问。\n\n2. 浏览器缓存：建议优先使用 Chrome 浏览器，并尝试清除浏览器缓存，或者使用无痕模式（Incognito window）重新打开。\n\n3. 网页自动翻译：如果浏览器开启了网页自动翻译功能，可能会导致页面加载异常或乱码，请务必关闭自动翻译功能。\n\n4. 站点维护：有时平台会进行系统维护或更新，可能会出现短暂的无法访问情况，可以稍后再试。\n\n网页参考资料：https://mp.weixin.qq.com/s?__biz=MzI5NDU3NzE0NQ==&mid=2247509458&idx=1&sn=097489beab779671868e146f1e458cb4&scene=21#wechat_redirect","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-19 21:46:11","用户":"Ivan","群":"","用户问询":"网站打不开 要用VPN吗","AI响应":"你好！很高兴为你解答。建议在连接VPN的情况下访问，并清除浏览器缓存或换用最新版本的谷歌浏览器。如果界面加载异常，请务必关闭网页自动翻译功能。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-19 16:39:53","用户":".","群":"","用户问询":"为什么还显示重新上传要","AI响应":"你好！很高兴为你解答。\n\n从你提供的图片来看，页面依然显示需要提供RFC编号，这通常是因为验证流程尚未完全闭环。\n\n如果你已经多次提交，请检查以下环节：\n1. 邮件签署：请检查您的卖家注册邮箱以及CSF登记邮箱，是否收到了平台发送的RFC知情授权书邮件。只有完成所有邮件中的签署指引，系统状态才会更新。\n2. 网络同步：这可能属于网络波动或浏览器缓存问题，建议更换浏览器重试或开启无痕模式查看。\n\n如果确认邮件已全部签署且网络环境正常，但页面依然提示重新上传，请耐心等待系统同步。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-19 15:11:24","用户":"sty","群":"","用户问询":"这里目录指的什么意思","AI响应":"目录是指平台已有的产品库。如果您发布的产品在目录中已存在，需复制产品代码并粘贴到“ML目录代码”列，此时部分字段会显示为灰色且无需重复填写。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-19 14:41:48","用户":"价值2","群":"","用户问询":"热搜词页面在哪里","AI响应":"你好！你可以通过以下链接查看美客多各站点的热搜词：\nhttps://tendencias.mercadolibre.com.mx/\n\n网页参考资料\nhttps://tendencias.mercadolibre.com.mx/","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-18 17:02:01","用户":"小火鸡","群":"","用户问询":"在哪里我可以装修我店铺页面","AI响应":"你好！很高兴为你解答。\n\n首先，您需进入卖家后台 >> Listings Management >> My page 页面，在Design editor的导航栏中选择对【移动端】或【电脑端】进行装修。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-17 22:26:54","用户":"蓝七","群":"","用户问询":"你好 这是什么意思呀","AI响应":"你好！图片中的报错意思是你在 catalog_product_id 这一列输入的数据无效。请不要手动粘贴或输入单元格选项之外的内容。如果搜索不到对应的目录代码，请将该列留空，直接填写其他必填项即可。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-17 19:13:05","用户":"Ti","群":"","用户问询":"上产品报错怎么处理？","AI响应":"上产品报错通常有以下几种处理方式：\n\n1. 检查标题规范：\n如果报错提示 [title] 属性丢失，请检查标题是否包含特殊符号、营销词汇（如 Hot Sale、Best Price）或超过 60 个字符。建议修正后删除原 SKU 重新手动上传。\n\n2. 完善类目与属性：\n确保类目选择精准，并填全品牌、型号、规格等技术参数。信息越完整，系统校验通过率越高。\n\n3. 检查图片要求：\n首图必须为纯白底，不能带有水印或文字，尺寸建议在 1200 像素以上。\n\n4. 批量上传报错：\n如果是批量上传，请检查下载的 Excel 模板是否为对应类目的最新模板，并查看表格上传后的报错提示进行针对性修改。\n\n如果修改后问题依然存在，建议您：\n1. 参考官方公众号【美客多拉美电商】中关于 Listing 优化的文章。\n2. 在卖家后台联系美客多官方客服，并提供具体的报错截图，以便客服团队提供精准帮助。\n\n网页参考资料：\nhttps://mercadolibre.cn/news/info?id=64&type=live","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-17 18:22:29","用户":"准备去","群":"","用户问询":"这个下载标签为什么点不了","AI响应":"你好！这种情况通常由网络环境或浏览器兼容性引起。建议优先使用Chrome浏览器并清除缓存或使用无痕模式，并务必关闭网页自动翻译功能。若仍失败请更换设备或切换网络环境重试。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-17 14:38:12","用户":"ㅤㅤㅤㅤㅤㅤㅤㅤ玉米柒柒","群":"","用户问询":"上面为什么显示的是深圳广东？","AI响应":"这是因为面单上方显示的是**发货人（卖家）信息**。\n\n由于你注册店铺时填写的发货地址或在后台设置的默认发货地址位于深圳沙井，系统生成面单时会自动抓取该地址作为退货或发货来源地。\n\n这不影响你从河南寄往郑州集运仓。仓库扫描的是中间的条形码，只要条码正确，包裹就能正常发往墨西哥。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-17 09:35:00","用户":"Star Chow","群":"","用户问询":"那为什么ROAS显示是0","AI响应":"从截图看，ROAS显示为横杠，是因为你的Income（广告带来的收入）目前显示为US$ 0。由于ROAS的计算方式是收入除以投资，当收入为0时，系统无法计算出具体数值。","一级大类":"其他","二级子类":"系统报错","问题主题":"后台系统报错/页面问题"},{"时间":"2026-07-17 06:48:06","用户":"QINGZHOU","群":"","用户问询":"你好，我应该该怎么样截图给他？","AI响应":"请使用电脑登录卖家后台，打开显示“审核中”或报错的完整页面。截图时务必包含浏览器顶部的URL地址栏，确保图片清晰且小于10MB，格式为JPG或PNG，然后回复该邮件即可。", 尝试切换网络（如从 Wi-Fi 切换至手机热点）。\n4. 若仍无法解决，请使用新版本 Google Chrome 浏览器的无痕模式尝试。","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-17 11:34:39","用户":"hui","群":"","用户问询":"一般是多久审核下来，之前流程里面已经提交过法人KYC审核资料","AI响应":"你好！很高兴为你解答。\n\nKYC审核通常需要2-3周以上的时间。从你图片显示的记录来看，验证正在等待中。\n\n近期KYC处理量激增，请你耐心等待。如果你之前已经完成了扫脸和资料提交，建议静候24小时让数据同步，不要重复提交。你可以随时登录店铺后台，通过路径 Settings > Selling Preferences > Company’s legal information > 查看进度，成功提交的状态应显示为：Under review（审核中）。","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-17 10:19:24","用户":"雪","群":"","用户问询":"为什么我kyc审核的时候 没有让我提交股东说明书","AI响应":"你好！美客多已更新政策，自2025年10月13日起，中国大陆企业实行股东信息电子化填报。您只需在后台在线录入真实股东信息即可完成KYC认证，无需再上传纸质版股东证明材料。","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-16 09:13:06","用户":"Richard","群":"","用户问询":"，泉州市话仙电子商务有限公司，请帮我加速审核KYC","AI响应":"提交邮箱后即为您开通KYC审核绿色通道，通常3-5个工作日给反馈，请留意卖家后台审核状态的变化。但是加速审核只有一次机会，请谨慎提交！","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-15 15:22:24","用户":"波波波pewpewpew突突突","群":"","用户问询":"你好，我通过kyc了，店铺的名字好像没设置过，请问哪里设置","AI响应":"你好！很高兴为你解答。你可以登录卖家后台，进入 Settings - My data 页面，在 Account data 模块中修改店铺名称。","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-15 08:54:34","用户":"ぅ Oath°3 jin","群":"","用户问询":"你好，如果开通KYC审核绿色通道，后续还需要人脸识别吗","AI响应":"你好！很高兴为你解答。\n\n是的，必须由法定代表人本人完成人脸识别验证。\n\nKYC审核绿色通道是协助您解决在识别过程中遇到的系统报错或异常情况，但出于平台安全合规要求，人脸识别这一环节本身是无法跳过的。在绿色通道处理完毕后，您仍需按照指引由法人本人配合完成扫脸操作。\n\n提交邮箱后即为您开通KYC审核绿色通道，通常3-5个工作日给反馈，请留意卖家后台审核状态的变化。但是加速审核只有一次机会，请谨慎提交！","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-19 15:24:03","用户":"KIM","群":"","用户问询":"请问我换一台电脑登陆美客多，会触发KYC认证吗","AI响应":"更换电脑登录通常不会直接触发KYC审核。KYC审核一般在注册阶段、达到特定销售额阈值或更改关键账户信息时触发。但建议保持登录环境稳定。","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-19 12:14:56","用户":"maxgtrs-Cindy","群":"","用户问询":"你好，我想获取KYC极速审核通道","AI响应":"你好！很高兴为你解答。提交邮箱后即为您开通KYC审核绿色通道，通常3-5个工作日给反馈，请留意卖家后台审核状态的变化。但是加速审核只有一次机会，请谨慎提交！","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-18 20:50:44","用户":"东","群":"","用户问询":"KYC 人脸没通过怎么办？法人现在不在。","AI响应":"你好！很高兴为你服务。\n\n如果法人人脸识别未通过，请按照以下建议操作：\n\n1. 必须由法人本人配合：修改密码或进行KYC验证属于平台定义的高危敏感操作，系统会强制触发人脸识别，且必须由注册时的法人本人进行，无法通过邮件或客服渠道绕过，也不能由他人代签或代扫。\n\n2. 报错处理：如果是因为报错导致没通过，建议关闭网页翻译，推荐使用Chrome无痕模式或手机热点尝试。\n\n3. 注意事项：请法人在光线明亮的环境下进行，摘掉帽子、眼镜等饰品，确保五官（包括耳朵）清晰无遮挡，眼睛平视摄像头并保持头部静止。\n\n4. 绿色通道：提交邮箱后即为您开通KYC审核绿色通道，通常3-5个工作日给反馈，请留意卖家后台审核状态的变化。但是加速审核只有一次机会，请谨慎提交！\n\n若尝试三次仍然失败，需填写KYC反馈问卷。","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-17 10:40:06","用户":"惠亚东","群":"","用户问询":"您好，KYC审核可以加急下吗，谢谢","AI响应":"提交邮箱后即为您开通KYC审核绿色通道，通常3-5个工作日给反馈，请留意卖家后台审核状态的变化。但是加速审核只有一次机会，请谨慎提交！","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-16 17:48:53","用户":"Sergio","群":"","用户问询":"你好 我的KYC审核还没有通过吗","AI响应":"你好！你可以通过 Settings > Selling Preferences > Company’s legal information 查看进度。若显示 Under review 则需耐心等待，审核通常需要 2-3 周。","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-16 16:34:03","用户":"George He","群":"","用户问询":"KYC是不是都需要上传这个股东证明书？","AI响应":"你好！很高兴为你解答。\n\n关于是否需要上传股东证明书，取决于你公司的注册地：\n\n1. 中国大陆公司：\n自2025年10月13日起，中国大陆注册的企业已全面推行电子化股东信息填报。你无需再提交纸质版股东证明材料，只需在入驻过程中的KYC认证环节，在线填写完整、真实、准确的股东信息即可。\n\n2. 香港公司：\n目前香港公司入驻仍需自行填写并上传股东证明书。你可以直接在KYC审核界面下载官方提供的香港版本股东证明书模板，并附上公司注册证书、商业登记证和 NAR1-年度申报表或 NNC1-公司注册表格。\n\n提交邮箱后即为您开通KYC审核绿色通道，通常3-5个工作日给反馈，请留意卖家后台审核状态的变化。但是加速审核只有一次机会，请谨慎提交！","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-16 14:23:55","用户":"电解质","群":"","用户问询":"我填写了资料，我想看一下我现在的审核进度","AI响应":"你好！你可以在卖家后台的“我的资料”页面查看KYC审核进度。\n\n具体路径如下：\n1. 进入 Settings（设置） > Selling Preferences（销售偏好） > Company’s legal information（企业法律信息）。\n2. 或者在首页 Summary 点击 Review Status 查看。\n\n如果状态显示为 Under review，说明材料正在审核中，请耐心等待。","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-16 11:50:56","用户":"十六","群":"","用户问询":"你这边可以走KYC审核绿色通过吗","AI响应":"提交邮箱后即为您开通KYC审核绿色通道，通常3-5个工作日给反馈，请留意卖家后台审核状态的变化。但是加速审核只有一次机会，请谨慎提交！","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-15 16:00:07","用户":"*T","群":"","用户问询":"我已经在KYC阶段请问是否还能去申请快速审核","AI响应":"提交邮箱后即为您开通KYC审核绿色通道，通常3-5个工作日给反馈，请留意卖家后台审核状态的变化。但是加速审核只有一次机会，请谨慎提交！","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-15 15:53:41","用户":"*T","群":"","用户问询":"👌 已经在 kyc 阶段 审核时间需要多久","AI响应":"KYC审核通常需要2-3周以上。提交邮箱后即为您开通KYC审核绿色通道，通常3-5个工作日给反馈，请留意卖家后台审核状态的变化。但是加速审核只有一次机会，请谨慎提交！","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-15 14:36:39","用户":"C.J","群":"","用户问询":"你好，kyc一直验证不过是什么原因","AI响应":"你好！很高兴为你解答。\n\nKYC验证未通过通常有以下几种常见原因及对应的解决办法：\n\n1. 资料不符合要求：如果系统显示“Upload document”，说明上传的营业执照等材料不清晰或无效。请确保上传原件的彩色扫描件或照片，文字清晰可见。\n2. 信息填写有误：如果显示“Complete information”，说明填写的文字信息与证件不符。请仔细核对并重新填写准确的企业或个人信息。\n3. 人脸核验问题：这是最常见的报错环节。请确保由法定代表人本人在光线明亮、背景清晰的环境下操作，摘掉帽子、眼镜，确保五官（包括耳朵）无遮挡，眼睛平视摄像头并保持头部静止。\n4. 网络或设备故障：如果验证页面打不开或报错，建议使用最新版本的 Google Chrome 浏览器，或尝试切换至稳定的网络环境（如使用VPN）。\n5. 最终受益人（UBO）信息：请核对填写的受益人信息格式是否正确，建议直接从系统后台（Settings > Selling preference > Company's Legal Information）进入提交，避开邮件链接。\n\n若电脑端人脸识别持续失败，推荐使用苹果手机，将下方链接复制至 Safari 浏览器中打开尝试：\nhttps://global-selling.mercadolibre.com/kyc?initiative=cbt&landing=true&congrats=true\n\n提交邮箱后即为您开通KYC审核绿色通道，通常3-5个工作日给反馈，请留意卖家后台审核状态的变化。但是加速审核只有一次机会，请谨慎提交！","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-14 19:04:28","用户":"ぅ Oath°3 jin","群":"","用户问询":"您好，提交填写 KYC 反馈问卷吧","AI响应":"你好！很高兴为你解答。\n\n在尝试过换浏览器、换网络等手段依然无效的话，可以填写以下问卷进行反馈：https://www.wjx.cn/vm/tUk4i1V.aspx# \n\n这是专门为了解决KYC阶段问题准备的【KYC问题反馈问卷】。请您花费几分钟时间，详细填写您遇到的具体问题、报错页面截图及相关操作信息。\n\n我们的审核与技术团队在收到您提交的详细报告后，会第一时间进行核查与处理，并尽快通过邮件或平台通知给您答复。\n\n提交邮箱后即为您开通KYC审核绿色通道，通常3-5个工作日给反馈，请留意卖家后台审核状态的变化。但是加速审核只有一次机会，请谨慎提交！","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-14 16:06:05","用户":"自由如龙","群":"","用户问询":"跨境自发货店铺Kyc审核通道发一个","AI响应":"提交邮箱后即为您开通KYC审核绿色通道，通常3-5个工作日给反馈，请留意卖家后台审核状态的变化。但是加速审核只有一次机会，请谨慎提交！","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-13 16:41:08","用户":"吕工","群":"","用户问询":"KYC已经通过并且可以上架了，但是前端没有看到","AI响应":"卖家您好，很高兴听到您的 KYC 已经通过并可以开始运营了。\n\n关于前端没有看到“已验证”相关标识，为您说明如下：\n\n1. **数据同步延迟**：KYC 审核通过后，系统数据同步到前端页面通常需要一定的缓冲时间，建议您在审核通过后的 **24-48 小时**后再观察。\n\n2. **展示逻辑限制**：美客多前端页面的标签展示（如 Empresa Verificada）往往与店铺的**信誉等级（Reputation）**挂钩。新店铺在没有产生足够的初始订单（通常是前 10 单）并计算出信誉颜色（绿色）之前，很多高级标识和卖家信息是不会完整展示给消费者的。\n\n3. **站点与终端差异**：不同站点（如墨西哥、巴西）以及不同终端（APP端与网页端）的展示界面存在差异。有些标识可能仅在特定的页面深度或特定的终端下才会显示。\n\n4. **跨境账号特性**：对于跨境（CBT）账号，平台更核心的信任背书是 **MercadoLíder**（大商）勋章。建议您优先通过稳定发货和优质服务积累订单，一旦获得绿色信誉条或大商勋章，店铺的专业标识会更加显著。\n\n目前既然已经可以上架，建议您先专注于产品运营和出单，标识问题通常会随着店铺权重的提升而自然显现。","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-19 12:16:27","用户":"maxgtrs-Cindy","群":"","用户问询":"kyc审核需要提交股东证明书吗","AI响应":"你好！很高兴为你解答。\n\n关于股东证明书的提交要求，美客多平台已经更新了政策。自2025年10月13日起，对中国大陆公司注册的跨境店铺实行股东信息电子化填报。\n\n您无需再提交纸质版股东证明材料，也无需上传扫描件，仅需在入驻过程中的KYC认证环节，在线填写完整、真实、准确的股东信息即可完成认证。\n\n如果是香港公司入驻，仍需在KYC审核界面下载官方提供的股东证明书模板进行填写，并附上公司注册证书、商业登记证和NAR1-年度申报表或NNC1-公司注册表格。","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-19 12:07:00","用户":"Boby","群":"","用户问询":"我KYC 审核好了吗","AI响应":"你好！KYC审核通常需要2-3周以上。你可以登录卖家后台，通过Settings中的Company legal information实时查询审核进度。","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-19 09:55:40","用户":"西格玛","群":"","用户问询":"KYC极速审核绿通","AI响应":"你好！很高兴为你解答。\n\n提交邮箱后即为您开通KYC审核绿色通道，通常3-5个工作日给反馈，请留意卖家后台审核状态的变化。但是加速审核只有一次机会，请谨慎提交！\n\n参考图片：\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260618/69555cc95b3e4793a417208bfb9921de.jpeg\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260618/c2dd106092304f6383cc9c52ad647a5a.png\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260618/0d4da780ff8e4f7fa3332062b8fe7fdb.png\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260618/ae366904c52648f6b2ec7ecd8c3e23f6.png\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260618/1db5a5eb4683453d8e2c7a01ace3ab12.jpeg\nhttps://file.marsmind.cc/kgmultimodal/kno 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-16 18:41:08","用户":"余树洪","群":"","用户问询":"你好 我想查看我的审核进度","AI响应":"你好！很高兴为你解答。\n\n可在注册后台直接查看审核进度，审核状态会显示为“审查中”。若已提交材料，请等待系统更新结果，无需重复操作。\n\n托管类卖家（包括半托管和全托管）的入驻审核进度，可通过 https://www.kdocs.cn/etapps/query/q/WnmhYDGC 进行查询。","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-16 16:02:34","用户":"风华","群":"","用户问询":"KYC审核绿色通道","AI响应":"你好！很高兴为你解答。提交邮箱后即为您开通KYC审核绿色通道，通常3-5个工作日给反馈，请留意卖家后台审核状态的变化。但是加速审核只有一次机会，请谨慎提交！","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-16 15:46:01","用户":"CJW","群":"","用户问询":"怎么看我kyc 通过了没","AI响应":"你可以通过以下路径查看：Settings > Selling Preferences > Company’s legal information。若状态显示为 Approved，则表示已通过审核。\n\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260618/69555cc95b3e4793a417208bfb9921de.jpeg","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-16 11:59:54","用户":"寂静岭","群":"","用户问询":"已提交KYC，加急","AI响应":"提交邮箱后即为您开通KYC审核绿色通道，通常3-5个工作日给反馈，请留意卖家后台审核状态的变化。但是加速审核只有一次机会，请谨慎提交！","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-16 09:08:29","用户":"FaA -","群":"","用户问询":"你好，KYC审核绿通","AI响应":"提交邮箱后即为您开通KYC审核绿色通道，通常3-5个工作日给反馈，请留意卖家后台审核状态的变化。但是加速审核只有一次机会，请谨慎提交！","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-15 15:45:24","用户":"只想练背的鲤鱼","群":"","用户问询":"为啥我的kyc还在审核[流泪]","AI响应":"你好！我非常理解你的焦虑。\n\n从你之前的截图来看，你的法律信息验证确实处于“审核中”状态。目前KYC审核通常需要2-3周以上的时间。近期由于处理量激增，审核耗时比平时更长属于普遍现象。\n\n如果你已经完成了扫脸等操作，建议静候24小时让数据同步，千万不要重复提交资料，以免影响审核进度。你可以每天登录后台“设置-销售偏好（Setting-selling preference）”查看，如果状态变为“approve”，就代表通过审核可以开始运营了。\n\n若等待时间已经超过20个工作日仍未更新，建议你联系官方客服进一步查询。\n\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-15 11:37:41","用户":"XTW","群":"","用户问询":"快速审核kyc通道","AI响应":"提交邮箱后即为您开通KYC审核绿色通道，通常3-5个工作日给反馈，请留意卖家后台审核状态的变化。但是加速审核只有一次机会，请谨慎提交。","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"},{"时间":"2026-07-15 11:35:17","用户 /d3_ARIAagYiAMICNNDLx0OZsSvaHbheC?scode=AI8A3wfvAAoKUrNMq6ARIAagYiAMI","一级大类":"账号入驻与安全","二级子类":"KYC & 审核","问题主题":"KYC/审核进度/资料提交"}]},{"一级大类":"产品管理","二级子类":"产品上架","Past 7 Days":430,"Previous 2026-07-06 to 2026-07-12":484,"Change":-54,"WoW":-0.1115702479338843,"Past 7 Share":0.06241834809115982,"高频问题":"产品上架/变体/SKU","__details":[{"时间":"2026-07-15 16:03:36","用户":"啊楼🍉","群":"","用户问询":"4.同一个外箱内不要混装超过 3 种不同的美客多 SKU。这样可以避免在拣货期间增加额外的人工处理流程，并防止延迟。 FULL美国转运仓，是这样吗，那衣服的S,M,L,XL，这算不同的SKU？","AI响应":"你好！是的，在美客多的系统里，**同一个产品的不同尺码（如 S、M、L、XL）都属于不同的 SKU**。\n\n针对你的疑问，具体操作建议如下：\n\n1. **混装限制**：虽然建议一个外箱内不混装超过 3 种 SKU，但如果你的衣服尺码较多，确实无法完全分开，也可以混装。\n2. **关键要求**：如果必须混装，请务必做好**物理隔离**。建议先将同款同色同码（同一个 SKU）的衣服用大袋子或捆扎方式装在一起，再放入外箱。\n3. **风险提示**：混装 SKU 种类过多会增加仓库人工核验的时间，可能导致上架变慢。如果货量大，建议尽量按 SKU 分箱装载。\n\n**服装类特别提醒**：\n每件衣服必须有独立透明包装袋，且包装袋上必须张贴对应的 SKU 标签。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-14 10:44:53","用户":"啊楼🍉","群":"","用户问询":"1. [error] [51] user_products.attributes.number unit user-products The provided unit is not valid. You can use a number followed by one of these valid units: [hh, m,\", mm, nm, cm, m, km, in, mil, U, ft, pulgadas, yd, miles]. FEMALE_THREAD_DIAMETER 这是变体要加尺寸吗？","AI响应":"你好！是的，这个报错是因为你在填写 FEMALE_THREAD_DIAMETER（内螺纹直径）这个属性时，格式不符合系统要求。\n\n系统要求该属性必须是一个数字后面紧跟一个有效的单位。根据报错提示，你可以使用的合法单位包括：[hh, m, \", mm, nm, cm, m, km, in, mil, U, ft, pulgadas, yd, miles]。\n\n处理建议：\n1. 检查你填写的数值，确保数字和单位之间没有空格（或者按照模板要求的标准格式）。\n2. 确保使用的单位在上述括号内的列表里，例如：10mm 或 0.5in。\n3. 如果是在表格中填写，请检查该单元格的格式是否被误设为纯数字。\n\n修改正确后重新上传或保存即可。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-16 14:47:51","用户":"XNGc2","群":"","用户问询":"另外我想要询问 我有个产品是有Catalog显示的 但是系统抓取匹配到的是我同一条链接中的备用变体 这个是否可以进行修改呢？我想要绑定到我正在销售的产品上","AI响应":"你好！很高兴为你解答。\n\n你可以通过以下方式尝试更正：\n\n1. 前往“列表”，在对应列表的三点菜单中选择“更正商品目录详情”。\n2. 在“浏览我们的产品目录”搜索框中，输入你想要绑定的产品ID或代码，点击“查看和更正商品目录详情”。\n3. 在产品规格表页面，点击“更正该商品目录的详情”进行修改。\n\n此外，你也可以在Excel目录中通过“目录代码搜索”功能找到确切的代码，并粘贴到ML目录代码列中进行重新关联。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-18 12:33:14","用户":"纳洛童","群":"","用户问询":"配件这里包含1个玩偶和1只宠物或者一个兵器（根据所选择的变体不同配送的配件也不一样）这个用地道的墨西哥语言怎么表达","AI响应":"你好！很高兴为你解答。在墨西哥站点，你可以使用以下地道表达来描述变体配件的差异：\n\n**Incluye:** 1 muñeco y 1 accesorio (mascota o arma, según la variante seleccionada).\n\n**或者更详细的表达：**\n**Contenido:** Cada variante incluye un accesorio diferente. Recibirás 1 figura y, dependiendo de tu elección, una mascota o un arma. ¡Asegúrate de seleccionar tu favorito antes de comprar!\n\n**词汇解析：**\n- **Muñeco / Figura:** 玩偶/人偶\n- **Mascota:** 宠物\n- **Arma:** 兵器/武器\n- **Según la variante seleccionada:** 根据所选变体","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-18 20:15:06","用户":"Li","群":"","用户问询":"我现在遇到的问题是，想不明白，为什么都是自发货，价位也差不多的，别人的连接可以包邮，为什么我的不能包邮？？因为这样我就失优势？ 我看了下，就是因为包邮的问题，我想知道怎么解决此类问题？？？这个问题跟设置Settings > Selling Preferences > Dispatch Methods** 有关系吗？？","AI响应":"你好！这与 Dispatch Methods 的设置没有关系。\n\n从你提供的对比图看，原因非常明确：\n\n1. **定价模式差异**：对方（冠军）的 Listing 开启了**包邮服务**，而你的 Listing 目前是**买家付运费**模式。\n2. **系统自动判定**：美客多自发货采用“净收益”定价模式。系统会根据你填写的净收益，自动叠加佣金和运费生成前台售价。\n3. **如何解决**：\n   - 平台系统会根据 Listing 价格自动增加或移除运费。\n   - 建议你尝试**微调 Listing 的净收益金额**。当系统计算出的前台售价达到或超过该站点的免运费门槛时，系统会自动将其转为“包邮”状态，并将运费成本计入售价中。\n\n简单来说，你看到的“包邮”其实是系统把运费加进了售价里。你可以通过调整价格，让系统重新判定是否触发包邮。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-17 19:29:30","用户":"Michael-拾荒的小男孩","群":"","用户问询":"无法在Uruguay [目前无法在 Uruguay 通过 international dropshipping 发布商品。]发布 发布于：México 发布于：Brasil 发布于：Argentina 发布于：Chile 发布于：Colombia Uruguay 通过 international dropshipping 发布商品 是什么意思","AI响应":"你好！很高兴为你解答。\n\nInternational dropshipping 是指自发货模式。\n\n这句话的意思是，目前乌拉圭站点暂不支持自发货卖家直接发布商品。目前该站点的跨境业务主要面向海外仓（FBM）模式或特定受邀卖家开放。\n\n你可以正常在墨西哥、巴西、智利、哥伦比亚等已开通的站点发布商品。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-17 18:18:13","用户":"纳洛童","群":"","用户问询":"Produto original SANDA com garantia do vendedor de 30 dias Envio internacional prioritario com rastreamento completo Entrega segura para todo o Brasil via Mercado Livre Atendimento dedicado para suporte pos-venda Garanta ja o relogio digital mais viral do momento. Estoque original pronto para envio.给这个巴西站点9504型号手表打分，高频搜索词有没有埋词在前面？","AI响应":"你好！很高兴为你解答。针对你提供的 SANDA 9504 型号 Listing，评分及分析如下：\n\n**综合评分：8.5/10**\n\n**优点：**\n1. **埋词策略成功**：标题前段准确埋入了 **Relogio Digital Retro** 和 **Quadrado Y2K**。在巴西市场，\"Retro\"、\"Quadrado\"（方形）和 \"Y2K\" 是目前该类产品流量最高的搜索关键词，放在前面能有效提升曝光和点击。\n2. **人群定位精准**：描述中抓住了“Cyberpunk”、“Estudantes”和“Nostalgia”等关键词，符合巴西年轻受众的搜索习惯。\n3. **结构清晰**：卖点划分明确，包含了巴西买家最关心的防水（5 ATM）和 LED 功能。\n\n**扣分项与改进建议：**\n1. **标题品牌位置**：虽然你将 SANDA 放在了中间，但建议将 **Unissex**（中性）这个高频词再往前提，因为这类复古表男女通用是核心搜索属性。\n2. **属性缺失**：描述中未提及具体的表盘尺寸（如 35mm 或 40mm），巴西买家对方形表的实际佩戴尺寸非常敏感。\n3. **合规性检查**：请确保上传到后台时，描述中的横线（---）和特殊符号已转为纯文本换行，避免系统识别异常。\n\n**建议优化后的标题：**\nRelogio Digital Retro Quadrado Y2K Unissex Resistente Agua Sanda 9504","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-16 15:53:30","用户":"Michael-拾荒的小男孩","群":"","用户问询":"这样不合理呀，可不可以SKU区分不同即可呢，比如5支银色的吸管（只是款式不同），银色仍然全选一样的Silver","AI响应":"你好！很高兴为你解答。\n\n在美客多平台上，变体必须通过属性值（如颜色、尺寸）来区分，而不能仅靠 SKU 编码区分。\n\n如果 5 个变体都选择完全相同的“Silver”，系统会判定为重复变体而报错，导致上传失败。\n\n如果该类目没有其他可用的变体属性（如 Model 或 Design），建议你将不同款式的吸管作为独立链接分别刊登，或者将它们组合成不同规格的套装进行售卖。","一级大类":"产品管理","二级子类":"产品上架","问题主题":"产品上架/变体/SKU"},{"时间":"2026-07-15 16:48:43","用户":"大大大明","群":"","用户问询":"Muchos fieles católicos buscan una pieza de la Sagrada Familia para adornar su hogar pero se topan con problemas comunes.Las imágenes de papel o plástico pierden color rápido por el sol y humedad,se ven desgastadas en poco tiempo.Las estatuas grandes solo se pueden poner en el suelo y ocupan mucho espacio,no sirven para paredes ni repisas pequeñas.Los artículos planos sin relieve no tienen profundidad,no transmiten solemnidad para el altar de oración.Las piezas de cerámica son frágiles y se rompen fácilmente al transportarlas o limpiarlas.Pocos modelos permiten colgar en pared y poner sobre mesa al mismo tiempo,limitando los espacios de exhibición.Los materiales de baja calidad se desgastan y pierden tonos en pocos meses. Características del producto Placa decorativa de la Sagrada Familia hecha de resina de alta calidad con técnica de relieve 3D,diametro de 21 centimetros.Es resistente a golpes,humedad y rayos solares,los colores no se desvanecen con el paso del tiempo.El relieve tridimensional muestra cada detalle de María,San José y el Niño Jesús,los bordes tienen ornamentos tallados con acabado dorado elegante,la pintura artesanal mantiene tonos vivos y naturales.Tiene orificio en la parte trasera para colgar en pared y viene con soporte transparente para colocar sobre mesa,repisa o altar sin accesorios extra.El tamaño de 21 cm es equilibrado,no es demasiado pequeño para pasar desapercibido ni muy grande para saturar espacios reducidos.El diseño representa fielmente a la Sagrada Familia,adecuado para todas las familias creyentes mexicanas. El modelo de placa circular de la Virgen María está fabricado en resina de poliéster, cuenta con un soporte compatible y un gancho para colgar integrado, permitiendo una exhibición estable sobre superficies planas o montaje en pared. Su diseño combina devoción, arte y elegancia, creando un punto focal llamativo lleno de armonía y valor ornamental. Es un adorno religioso católico clásico y el regalo devocional ideal para quienes buscan piezas delicadas, bien elaboradas y con significado para complementar sus espacios interiores. Escenarios de uso 1.Altar doméstico de oración.Coloca esta placa como pieza principal en tu altar para rezos diarios,trae paz y espiritualidad a tu momento de devoción católica. 2.Decoración de pared en sala,dormitorio o comedor.Cuélgala en paredes vacías para dar un toque clásico y religioso a tu hogar. 3.Exhibición sobre repisas,mesas auxiliares y mesas de noche.Utiliza el soporte incluido para ponerla en muebles pequeños,ideal para departamentos compactos. 4.Regalo espiritual para eventos religiosos.Es un obsequio perfecto para bautizos,primeras comuniones,confirmaciones,bodas,Navidad y cumpleaños de seres queridos fieles,lleno de bendiciones. 5.Decoración para capillas caseras,oficinas y tiendas de artículos católicos.Combina devoción y decoración elegante para espacios de culto o negocios religiosos. Servicio postventa y garantía Sabemos que los envíos pueden sufrir golpes en el trayecto por eso contamos con un servicio postventa completo.Cada placa viene empacada con espuma protectora y caja reforzada para reducir riesgos de rotura durante el transporte.Si tu pedido llega roto,rayado o con defectos de fabricación,envía fotos o videos del empaque y el producto dentro de las primeras 48 horas después de recibir el paquete.Nuestro equipo de atención contesta todos tus mensajes rápidamente para resolver dudas sobre tamaño,material y forma de exhibición.Cumplimos todas las reglas de Mercado Libre,tus compras están totalmente protegidas en la plataforma. Conclusión ﻿Esta placa de la Sagrada Familia combina artesanía de relieve 3D,material de resina resistente y doble forma de exhibición.Con nuestro soporte postventa confiable puedes comprar sin preocupaciones,es una pieza indispensable para cada hogar católico de México.帮我把这段描速弄成可以直接上架的，顺便帮我翻译一下","AI响应":"你好！很高兴为你解答。\n\n这段描述已经包含了非常完整的营销逻辑。为了确保能直接上架且不报错，我为你去除了所有特殊符号、中文，并优化了排版。以下是为你翻译并整理好的西班牙语描述：\n\nSoluciones para el hogar catolico\nMuchos fieles enfrentan problemas con imagenes que pierden color por el sol o piezas de ceramica muy fragiles. Nuestra placa resuelve esto con durabilidad y un diseño adaptable a cualquier espacio.\n\nCaracteristicas del producto\nPlaca decorativa de la Sagrada Familia hecha de resina de alta calidad con tecnica de relieve 3D y diametro de 21 centimetros. Es resistente a golpes y humedad, por lo que los colores no se desvanecen con el tiempo. El relieve tridimensional muestra cada detalle de Maria, San Jose y el Niño Jesus con acabados dorados elegantes. Incluye un orificio trasero para colgar en pared y un soporte transparente para colocar sobre mesas o altares.\n\nEscenarios de uso\n1. Altar domestico de o
