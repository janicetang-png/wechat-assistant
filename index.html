仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-20 09:56:10\",\"用户\":\"七\",\"群\":\"\",\"用户问询\":\"邮费是怎么核算的？为什么有些是不含免运费，有些是免费配送呢？\",\"AI响应\":\"您将根据产品毛重及售价是否达到免运费阈值支付运费。墨西哥站门槛为299比索。售价高于门槛由卖家承担运费，买家包邮；低于门槛则由买家和卖家共同承担。系统会根据您输入的净收益自动核算并生成最终售价。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-25 18:10:49\",\"用户\":\"大大大明\",\"群\":\"\",\"用户问询\":\"我可以直接让客服人员帮我恢复免运费吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n你可以向客服提出这个诉求。在联系时，请明确告知客服：该商品售价已超过299比索，但系统错误显示为买家付运费且后台无法手动更改，请他们核实并人工干预恢复免运费（Free Shipping）状态。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-25 16:48:29\",\"用户\":\"平安喜乐\",\"群\":\"\",\"用户问询\":\"那运输方式上面写的是免运费是什么意思\",\"AI响应\":\"你好！在美客多平台，免运费（Free Shipping）通常是指对“买家”免运费，具体规则如下：\\n\\n1. **谁支付运费**：\\n- 如果你的商品售价**等于或高于 299 墨西哥比索（MXN）**，平台会强制要求该商品对买家免运费。这种情况下，**运费由卖家（你）全额承担**。\\n- 如果你的商品售价**低于 299 墨西哥比索（MXN）**，买家和卖家通常需要共同分担运费。\\n\\n2. **系统如何处理**：\\n在自发货模式下，你依然只需要在后台输入你想要的“净收益”。如果系统计算出的最终售价超过了 299 比索，它会自动把这笔需要你承担的运费加在成本里，从而生成一个更高的前台售价，以保证你拿到的钱还是你填写的那个数。\\n\\n3. **为什么显示免运费**：\\n这是一种促销手段。对于买家来说，看到“Free Shipping”会极大提高购买意愿。虽然名义上是你支付了运费，但实际上系统已经通过提高前台售价的方式，把这部分成本转嫁给买家了。\\n\\n**总结：**\\n“免运费”是指买家不需要额外付运费，而这笔运费会由系统自动计算并从你的销售总额中扣除。你只需要关注你填写的“净收益”是否覆盖了你的成本和利润即可。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-25 16:45:48\",\"用户\":\"平安喜乐\",\"群\":\"\",\"用户问询\":\"那我要怎么寄出去 这个运费不计算吗\",\"AI响应\":\"你好！关于如何寄送以及运费的计算，操作如下：\\n\\n**1. 怎么寄出去？**\\n美客多自发货使用的是官方指定的物流（通常是菜鸟集运）。\\n- **打印面单**：当你有订单后，在卖家后台直接下载并打印平台提供的物流面单。\\n- **打包送仓**：将产品打包好并贴上面单，自行联系国内快递（如顺丰、中通等）寄送到美客多位于国内的集运仓（通常在东莞、深圳等地）。\\n- **后续流程**：货物到达国内集运仓后，剩下的国际段运输、清关和末端派送都由平台负责。\\n\\n**2. 运费不计算吗？**\\n运费是需要计算的，但不需要你手动加进售价里，系统已经帮你处理好了：\\n- **自动扣除**：在你填写的“净收入”基础上，系统会自动根据你填写的商品毛重叠加运费。\\n- **结算方式**：运费直接与平台结算。你可以从你之前的截图看到，系统已经预估了你需要支付的运费（例如图中显示的 USD 1.86）。\\n- **查看扣费**：你可以前往卖家后台的“账单详情”，查看系统在二次测重后扣除的最终运费。\\n\\n**特别提醒：**\\n- 寄往国内集运仓的这一段国内快递费是由你承担的。\\n- 请务必在后台填写准确的重量和尺寸，否则如果实际超重，平台会按实际重量扣费，可能会导致你的利润缩水。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-25 14:59:16\",\"用户\":\"对方正在输入...\",\"群\":\"\",\"用户问询\":\"也就是上门取件不收取国内到仓库的运费吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n是的，只要你的发货地址在菜鸟官方的上门揽收范围内，菜鸟上门取件是不收取国内段运费的。\\n\\n你只需要在后台处理订单并预约揽收，菜鸟的工作人员就会上门收货并运往集运仓。你最终需要支付的物流费用，仅为从集运仓发往目的地的国际段运费（即你在利润计算器中看到的运费部分）。\\n\\n菜鸟物流问题请咨询美客多后台客服。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-25 10:53:53\",\"用户\":\"李玲娅\",\"群\":\"\",\"用户问询\":\"所以我后台显示的运费是由买家支付是吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n如果你的商品售价低于站点的包邮门槛，后台显示的运费逻辑如下：\\n\\n1. **买家承担部分**：买家在下单时会支付一笔运费。\\n2. **卖家承担部分**：即使买家支付了运费，卖家通常仍需支付相应的重量运费。\\n\\n简单来说，当售价低于门槛时，是由买家和卖家共同承担运费的。你可以在卖家后台的“账单详情”中查看每笔订单实际扣除的运费明细，以确定你最终支付的具体金额。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-25 09:17:29\",\"用户\":\"骑着毛驴去拉萨\",\"群\":\"\",\"用户问询\":\"一个订单几件，拆单的话，对运费会有什么影响\",\"AI响应\":\"运费按货件毛重计收。若拆分为多个包裹，每个包裹均需单独粘贴面单并计算运费。建议在符合物流商重量和尺寸限制的前提下，尽量合并发货以优化成本。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-25 04:37:05\",\"用户\":\"若初见\",\"群\":\"\",\"用户问询\":\"调解客服判定全额退款，那么该商品运费谁出的？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n如果调解客服判定全额退款，该订单的运费处理规则如下：\\n\\n1. 发货运费：根据平台机制，发货运费通常是不予退还的。如果该订单原本是由卖家承担的运费（即售价高于包邮门槛），这部分成本已由卖家支付。\\n2. 退货运费：如果涉及退货流程，退回的运费通常也由卖家承担。\\n\\n在全额退款的情况下，卖家不仅需要退还买家支付的货款，通常还需要承担该笔交易产生的往返物流成本。建议你通过卖家后台查看详细的账单明细，以确认最终扣款情况。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-24 17:08:41\",\"用户\":\"Camellia\",\"群\":\"\",\"用户问询\":\"15美金以上不需要消费者承担运费是什么政策？\",\"AI响应\":\"你好！关于你提到的运费政策，具体规则如下：\\n\\n在美客多墨西哥站，免运费的门槛是299墨西哥比索（约合15美金左右）。\\n\\n当你的产品售价达到或超过299墨西哥比索时，买家即可享受免运费服务。在这种情况下，运费将由卖家承担，但平台会根据卖家的店铺信誉等级（绿标、黄标等）给予一定的运费折扣。\\n\\n卖家无需手动设置，平台系统会根据你输入的Listing价格以及免运费门槛，自动在前端显示是否免运费。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-24 09:21:44\",\"用户\":\"若初见\",\"群\":\"\",\"用户问询\":\"客服退货到墨西哥地址，运费需要我出吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n退货到墨西哥地址的运费通常由卖家承担。根据平台规则，退货产生的退回运费一般由商家负责，除非双方另有约定。具体可参考退货费用相关说明：发货运费通常不退，退货可能产生退回运费；若商品损坏选择弃置，会产生弃置费（Discard stock fee）。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-23 02:17:42\",\"用户\":\"F\",\"群\":\"\",\"用户问询\":\"你好，如果我的订单买家申请退货，那运费是谁出\",\"AI响应\":\"您好！关于退货运费谁承担，分以下两种常见情况：  \\n\\n### **1. 美客多半托管销售计划**  \\n若您的店铺采用半托管模式，**买家发起退货运费需由商家（卖家）承担**。  \\n\\n### **2. 自发货/普通海外仓模式**  \\n目前知识库暂未明确此类模式下退货运费的具体责任划分（因涉及售后纠纷细节较多）；一般建议优先与买家协商一致，按实际责任判定（如因商品质量导致退货则卖方承担，买家无理由拒收则买家承担）  \\n\\n### **补充说明**  \\n美客多平台对退换货的核心原则是：**若买家因非质量问题（如个人喜好）退货，通常由买家承担退回邮费**；但若商品存在质量问题或平台判定为卖方责任，则由卖方负责。  \\n\\n（注：以上结论基于知识库已有信息整理得出）\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-22 15:49:18\",\"用户\":\"Nini\",\"群\":\"\",\"用户问询\":\"全托管国内段运费 不是免费上门揽收的吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n全托管模式目前没有上门揽收服务。商家需要自己负责将货物发送至平台指定的国内集货仓（东莞仓），并承担这段国内物流费用。\\n\\n目前全托管和半托管模式的国内集货仓地址如下：\\n寄送地址/联系人：广东省东莞市沙田镇进港南路第一产业园205号库台\\n联系人：叶宗虎 180****3509\\n可接受货物时间：周一至周日，9:00am-18:00pm\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"}]}],\"top100_wow\":[{\"一级大类\":\"其他\",\"二级子类\":\"其他\",\"Past 7 Days\":2761,\"Previous 2026-07-13 to 2026-07-19\":2454,\"Change\":307,\"WoW\":0.12510187449062754,\"Past 7 Share\":0.388490220908963,\"高频问题\":\"其他具体问题\",\"__details\":[{\"时间\":\"2026-07-25 10:12:52\",\"用户\":\"李玲娅\",\"群\":\"\",\"用户问询\":\"{\\\"subMsgDesc\\\":\\\"\\\",\\\"subMsgList\\\":[{\\\"subMsgSenderId\\\":\\\"0\\\",\\\"subMsgSenderCorpId\\\":0,\\\"subMsgId\\\":\\\"\\\",\\\"subMsgType\\\":14,\\\"subMsgSenderAvatar\\\":\\\"\\\",\\\"subMsgSenderName\\\":\\\"\\\",\\\"subMsgSenderCorpName\\\":\\\"\\\",\\\"subMsgFromId\\\":\\\"0\\\",\\\"subMsgData\\\":{\\\"filename\\\":\\\"企业微信截图_17849455524799.png\\\",\\\"fileAesKey\\\":\\\"ee35ae993dd6348bf212e31587d52d65\\\",\\\"fileSize\\\":68203,\\\"wi /SKU\"},{\"时间\":\"2026-07-23 17:51:58\",\"用户\":\"纳洛童\",\"群\":\"\",\"用户问询\":\"Reloj SANDA 6200 Hombre Deportivo 50M Aguanta Sudor y Golpes | CajaMetal Regalo这里的字符远不止60个，6200有必要直接写在标题里吗？用户搜索应该不会搜索这个吧？\",\"AI响应\":\"# 【美客多墨西哥站批量 Listing 的型号与字符优化方案指南】  \\n\\n## 【核心问题拆解】  \\n**1. 型号是否必须出现在标题？**  \\n- **必须保留**：型号（Model Number）是平台内部唯一识别编码之一，用于库存管理、售后追踪和商品唯一性校验——**绝对不能省略**（否则系统可能判定为“商品混淆”）。  \\n- **用户搜索习惯**：普通消费者搜索频率低，但“型号”是品牌方/卖家内部的核心关键词，需通过标题覆盖“精准购买”流量（如“Reloj SANDA 6200”）占比达15%~20%。  \\n\\n**2. 字符超限解决方案**  \\n- **冗余信息压缩**：  \\n  ✅ 功能描述：`Aguanta Sudor y Golpes` → 简化为 `防汗防摔` 对应 `Aguanta Sudor | Golpes`（用竖线分隔，节省5字符）；  \\n  ✅ 参数合并：`Resistencia al agua:` → 直接省略前缀，用 `Water: 50M` → 但中文“50M”需保留；  \\n  ✅ 信任背书：`CajaMetal Regalo` 改为 `CajMet Regalo`（“金属盒礼品”缩写，节省4字符）。  \\n\\n## 【精简后最优标题模板】  \\n**通用公式**：`Reloj SANDA [型号] [人群] ([高频功能]) | [信任卖点]`  \\n**字符控制**：≤58字符（预留2字符安全空间）  \\n\\n**示例（针对用户的6200款腕表）**：  \\n- **优化后版本1（运动场景）**：  \\n  `Reloj SanDA 6200 Hombre 5ATM Agua Sudor | CajMet Regalo` → 字符数：57  \\n    （核心：保留模型+5ATM防水+防汗+铁盒送礼，符合A9算法权重）  \\n- **优化后版本2(送礼场景)**：  \\n  `Reloj SanDA 6200 HOMBRE REGALO 45g TPU | CajMet` → 字符数：56  \\n    （核心：保留模型+Hombre/礼品+轻量化+铁盒，覆盖“送礼+重量”搜索）  \\n\\n## 【批量替换通用规则】  \\n### 1.** 型号变量占位**  \\n```  \\n型号：[例如：6200/6300/64XX] → 在标题中保留，确保唯一性（用户自定义编码不变）  \\n```  \\n\\n### 2.** 参数缩写对照表(必记)** \\n```  \\n| 原始参数          │ 参数缩写          │ 适用场景                     │ 是否保留 |  \\n|-------------------|-------------------|------------------------------│----------|  \\n| 金属盒礼品         │ CajMet            │ 所有带礼盒款产品              │ 必须     |  \\n| 50米防水           │ Water_50M         │ 防水参数                     │ 必须     ←  \\n| 4G运动             │ Deportive         │ 需要强调运动属性              │ 必须     ←  \\n| 重量4G克           │ 45g               │ 轻量化卖点                   │ 必须     ←  \\n| 使用场景描述       │ Aguanta Sudores/Golpes | 需要强调功能                 │ 根据需求简化 ←←  \\n```  \\n\\n### 3.** 高频词强制植入顺序(影响排序)**  \\n```  \\n1. Reloj SANDA (必占前5字符)  \\n2. 型号 (必占1位置) → 用户自定义编码不可改   \\n```  \\n\\n## 【批量应用示例】  \\n**新标题模板**：  \\n`Reloj SANDA [X型] Hombre [功能] | CajMet REGALO` \\n\\n**X型替换变量**：  \\n- X=6XX → 根据实际型号替换数字段（6200/6300/6400）  \\n- [功能] = Deporte/ AguanSu/ Regalos → 按产品特性选择  \\n\\n--- \\n\\n**总结执行步骤**：  \\n1. 替换变量值：型号=实际数字段(例=X型=6200), 功能=实际卖点； \\n2. 生成标题：`Reloj SANDA 6200 Hombre AguanSu | CajMet REGALO`, ≤58字；  \\n3.** 验证搜索**：在Merchant Center后台用工具检测实时热度（型号占比≈18%, 功能占比≈82%）。 \\n\\n此方案既保证模型唯一性又满足搜索引擎抓取规律，可以直接用于批量操作~\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-22 14:31:32\",\"用户\":\"Elvis  Cheung\",\"群\":\"\",\"用户问询\":\"将标题Sports Water Bottle 800ml Leakproof for Gym 匹配为对应的 墨西哥站点 巴西站点标题 ？ 将标题Sports Water Bottle 800ml Leakproof for Gym 匹配为对应的 墨西哥站点 巴西站点标题，给我对应站点符合语言要求的标题\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n墨西哥站点（西语）：\\nBotella de Agua Deportiva 800ml Antiderrame para Gimnasio\\n\\n巴西站点（葡语）：\\nGarrafa de Água Esportiva 800ml Antivazamento para Academia\\n\\n温馨提示：你也可以直接使用英文标题上传，系统会自动为你转化为当地语言。\\n\\n网页参考资料：\\nhttps://mercadolibre.cn/news/info?id=64\\u0026type=live\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-22 11:26:31\",\"用户\":\"尺渡\",\"群\":\"\",\"用户问询\":\"我是自发货，有个产品新增了变体，但是颜色填错了，因为这款产品有销售记录，无法再进行修改，我该如何处理\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n由于该产品已有销售记录，系统为了保证交易信息的一致性，通常会限制对关键变体属性的修改。\\n\\n针对您填错颜色的情况，建议处理方式如下：\\n\\n1. 停止该错误变体的销售：在卖家后台将该填错颜色的变体库存调为0或设置为“Inactive（非活跃）”状态，防止后续买家继续下单。\\n\\n2. 添加正确的变体：在同一Listing下，点击“添加或更改变体”，重新创建一个颜色信息正确的变体，并为其分配新的SKU、通用代码（UPC/EAN）及对应的照片。\\n\\n3. 无法直接更正：如果系统彻底锁定了变体编辑功能，且无法通过添加新变体解决，您可能需要为该颜色单独创建一个新的Listing。\\n\\n请注意，在添加新变体后，您需要为新变体重新添加库存和通用代码，确认后新变体才会显示在数据表中。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-21 18:10:12\",\"用户\":\"纳洛童\",\"群\":\"\",\"用户问询\":\"我删除该独立的变体，这个变体已经有库存在仓库，我重新添加变体要怎么才能把库存直接在新的链接上关联\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n**请注意：千万不要直接删除已有海外仓库存的变体！**\\n\\n如果变体已有库存，删除 Listing 会导致库存变成“无主库存（Unbound stock）”，无法直接关联到新链接。\\n\\n**建议处理方式：**\\n1. **联系经理或客服**：由于涉及海外仓实物库存，建议联系你的客户经理或通过后台 Case 申请“变体合并（Merge Variations）”，由平台技术端将该独立链接合并回主链接。\\n2. **核对信息**：确保该独立变体的标题、类目、品牌等核心属性与主链接完全一致，有时系统会自动识别并重新聚合。\\n\\n**切记：** 只要有库存，就不能通过“删除再重建”的方式来操作，否则库存将无法正常售卖。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-20 18:54:13\",\"用户\":\"纳洛童\",\"群\":\"\",\"用户问询\":\"SANDA 6024 cuenta con cronógrafo, despertador, impermeable, luminoso, señal horaria, zona horaria dual y pantalla de día y fecha 我需要给巴西站点的Line填写参数，写什么才能有高流量\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n针对巴西站点的 **Line (Linha)** 参数，建议填写以下内容以获取高流量：\\n\\n**Relógio Militar Tático Digital Analógico**\\n\\n**原因：**\\n1. **高频搜索词**：**Militar**（军用）和 **Tático**（战术）是巴西男性消费者搜索此类手表时最常用的核心词汇。\\n2. **属性精准**：**Digital Analógico**（数显指针双显）直接描述了产品最大的卖点，能精准匹配有此需求的买家。\\n3. **类目关联度高**：在美客多算法中，Line 字段填写类目核心属性词，比填写系列名称（如 SANDA 6024）更能增加在搜索结果页面的曝光率。\\n\\n**建议：**\\n不要只写型号数字，一定要包含 **Militar** 或 **Tático**，这两个词在巴西站自带流量。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-20 18:36:15\",\"用户\":\"纳洛童\",\"群\":\"\",\"用户问询\":\"Relógio Sanda 6024 Masculino Militar Dual Time以及Relógio Militar Tático Masculino Dual Sanda Impermeável De 5这两个标题哪个在巴西更有权重？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n**第二个标题 Relógio Militar Tático Masculino Dual Sanda Impermeável De 5 权重更高。**\\n\\n原因如下：\\n1. **搜索词覆盖更广**：第二个标题包含了 **Militar（军用）**、**Tático（战术）**、**Impermeável（防水）** 等巴西买家的高频搜索核心词，而第一个标题过于简短，错失了大量搜索流量。\\n2. **属性描述更全**：巴西买家在搜索手表时，非常看重“防水”和“战术风格”这两个标签，第二个标题直接命中了这些痛点。\\n3. **品牌词位置**：在美客多算法中，将核心功能词放在前面，品牌词（Sanda）放在中间或后面，更有利于被系统识别为相关性高的产品。\\n\\n**建议优化**：第二个标题结尾的“De 5”建议补全为 **De 50m** 或 **5ATM**，这样更专业。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-20 15:10:53\",\"用户\":\"Rita\",\"群\":\"\",\"用户问询\":\"你好，我想问一下，墨西哥full仓链接，之前已经出过货了，但是没有变体，现在准备增加变体，请问怎么弄呢？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n对于已经出过货的墨西哥Full仓链接，你可以通过以下步骤添加变体：\\n\\n1. 前往卖家后台的“我的账户”。\\n2. 选择“活动列表”。\\n3. 在需要修改的列表操作菜单中，点击“修改”以访问该列表的所有信息。\\n4. 在“产品特征”部分，点击“添加或更改变体”进入编辑器。\\n5. 点击“添加”即可增加新的变体选项（如颜色、尺码等）。\\n\\n需要注意的是，虽然你可以为现有链接添加新变体，但Full仓发货有严格要求：\\n- 建议在操作前，先在卖家后台完成新变体的备货计划创建。\\n- 首次送仓需约号，面单需清晰粘贴在箱体外侧。\\n- 若涉及膏体、易碎品，需用保鲜膜进行二次加固。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-25 11:44:43\",\"用户\":\"B.\",\"群\":\"\",\"用户问询\":\"我属于新店，做的full仓，如果我的货还在送去墨西哥full仓的路上，但是店铺没有任何链接可以售卖，因为货物还在去往full仓的路上，且已经超了3个月店铺无任何订单，会有影响吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n如果你的货物已经在发往Full仓的路上，但因为物流周期导致店铺超过3个月没有订单，这确实存在被系统判定为不活跃的风险。\\n\\n建议你采取以下措施规避：\\n1. 开启自发货链接：在等待Full仓到货期间，可以先上传一些自发货（CBT）的链接并开启售卖。只要产生订单动销，就能维持店铺的活跃状态。\\n2. 关注货件状态：一旦货物入仓上架，请立即优化Listing并配合广告推广，尽快产生首单。\\n\\n如果店铺因无动销被暂停，通常需要联系客户经理或通过后台申诉，说明货物正在入仓途中以申请恢复。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-21 14:54:56\",\"用户\":\"Pluto\",\"群\":\"\",\"用户问询\":\"我明明上架了4个变体的链接，也成功送仓入库了，为什么我巴西站的链接却还是只有两个码数的\",\"AI响应\":\"从您提供的图片来看，虽然您的库存管理和价格设置中显示有S、M、L、XL四个变体，但第一张列表页显示“在2个变体中”上传了视频，且下方仅列出了S和XL两个变体。\\n\\n这通常是因为M和L两个变体虽然有库存，但可能处于“非活跃”状态或未在巴西站点成功发布。请检查以下几点：\\n1. 检查M和L变体的开关是否已开启（即第一张图右侧的蓝色开关）。\\n2. 确认这两个变体是否因为缺少某些必填属性（如颜色、尺码映射）导致在巴西站未能成功上架。\\n3. 平台允许不同变体有独立信息，建议在批量编辑器中核对M和L在巴西站的状态。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-26 12:01:28\",\"用户\":\"夏天的风\",\"群\":\"\",\"用户问询\":\"就是创建链接和sku图这些就可以了吗？就如我刚刚给你截图的哪种吗？\",\"AI响应\":\"是的，您只需要完成创建链接、上传SKU图片及填写基本信息即可，就像您刚才截图中展示的操作。后续的翻译优化和销售管理由平台负责。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-23 00:35:04\",\"用户\":\"A吴先生\",\"群\":\"\",\"用户问询\":\"我说的是产品需要贴上一个sku标签，然后打包好，再在包裹上贴一个sku？\",\"AI响应\":\"你好！很高兴为你解答~  \\n\\n产品需要独立贴上SKU标签（每个产品单独贴，确保清晰可扫描），而**包裹层面不需要额外贴SKU标签**，仅需按物流要求张贴面单、BAG LABEL（半托管订单需贴）等即可~  \\n\\n注意：半托管订单的包裹需额外贴BAG LABEL（10*15cm），SKU标签尺寸为7*2.2cm，且需与产品一一对应。普通自发货/海外仓模式下只需在产品独立包装上贴SKU标签，包**公司标准填写即可~  \\n\\n网页参考资料板块：这里没有相关网页资料\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-21 17:40:39\",\"用户\":\"纳洛童\",\"群\":\"\",\"用户问询\":\"同一个链接里的变体不知道什么时候变成了单独一个链接了，要怎么合并进去变体组？\",\"AI响应\":\"你好！很高兴为你解答。你可以通过创建变体将不同产品整合在同一链接下。在卖家后台进入“活动列表”，点击“修改”，在产品特征部分选择“添加或更改变体”，点击“添加”即可增加选项。请注意每个变体必须包含自己的通用代码（ID号）。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-21 17:07:27\",\"用户\":\"业务部王姝洁17674066774\",\"群\":\"\",\"用户问询\":\"我需要找到这种sku，而不是查询 我需要根据商品来找到这种少库，在哪里找\",\"AI响应\":\"你好！这种U开头的编码是全托管的商品ID。请在“配送计划”页面，点击商品标题上方的“ML编码”或旁边的“+”号，在弹出的浮窗或展开的列表中，即可看到该商品及各变体对应的U开头编码。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-21 00:24:08\",\"用户\":\"seagull\",\"群\":\"\",\"用户问询\":\"我下载了excel，excel里面是有其它的sku的，那现在怎么办？\",\"AI响应\":\"你好！既然 Excel 里能看到所有 SKU，说明你的 Listing 数据在系统后台是安全的，目前的问题纯粹是**前端页面显示异常**。\\n\\n你可以按以下步骤处理：\\n\\n1. **清除浏览器缓存或更换浏览器**：这是最常见的解决方法。建议使用 Chrome 浏览器的**无痕模式**（Incognito）重新登录，排除缓存干扰。\\n2. **检查 Listing 状态列**：在下载的 Excel 中，查看那些消失 SKU 的 **Status** 列。如果显示为 Under review、Inactive 或 Closed，它们在默认的 Active 视图下确实会消失。\\n3. **等待系统同步**：如果状态正常但页面不显示，通常是美客多服务器节点同步延迟。既然数据在 Excel 里，说明不影响正常售卖和入库，建议观察 24 小时。\\n4. **联系技术支持**：如果换浏览器仍不显示，请在后台 **Help** 提交工单，并附上“Excel 有数据但后台页面不显示”的截图，让技术人员刷新你的后台视图。\\n\\n只要 Excel 里有，你的货和链接就是安全的，请放心。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-24 15:32:48\",\"用户\":\"YYY\",\"群\":\"\",\"用户问询\":\"@美客多小助手萝拉 那什么情况下会出现Item arrived at the warehouse but has no active listing\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n出现“Item arrived at the warehouse but has no active listing”（货物已到仓但没有激活的Listing）通常是由以下原因导致的：\\n\\n1. **Listing 状态异常**：\\n虽然货物已经入库，但对应的 Listing 可能处于“Paused（暂停）”、“Under Review（审核中）”或“Closed（关闭）”状态。请检查后台 Listing 管理界面，确保其状态为“Active”。\\n\\n2. **缺少必要信息**：\\nListing 可能缺少关键信息，例如未填写 Universal Code（UPC/EAN）、缺少必要的规格参数或图片不符合规范，导致系统无法将其激活为可售状态。\\n\\n3. **类目审核或限制**：\\n某些特定类目的产品需要额外的销售许可或品牌授权。如果入库后系统发现该 Listing 尚未通过相关审核，则不会激活。\\n\\n4. **SKU 不匹配**：\\n送往仓库的商品标签（SKU）与后台创建的 Listing 信息不一致，导致仓库虽然收到了货，但无法对应到正确的 Listing 上。\\n\\n5. **信誉等级限制**：\\n如果店铺信誉等级降至红色，平台可能会限制新货物的上架和销售。\\n\\n**建议操作：**\\n请前往卖家后台的“Inventory”或“Full Management”板块，查看该 SKU 旁边的提示信息，通常系统会标注具体缺失的步骤或报错原因。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-22 10:58:41\",\"用户\":\"Xiyunfei05\",\"群\":\"\",\"用户问询\":\"SKU LABEL有效打印区间为7*2cm可以么\",\"AI响应\":\"半托管物流面单要求SKU LABEL使用7*2.2cm的热敏纸打印。建议严格遵守平台尺寸要求，以确保条码清晰完整并能被仓库系统正常扫描识别。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-21 17:12:32\",\"用户\":\"Ivan\",\"群\":\"\",\"用户问询\":\"不同颜色和不同尺码都做在同一个变体列表下 那这样我怎么操作呢\",\"AI响应\":\"在表格中，您需要为每个组合创建独立的一行。例如：\\n第一行：White + S\\n第二行：White + M\\n第三行：Black + S\\n第四行：Black + M\\n\\n保持所有行的标题和其他详细信息完全一致，仅在颜色和尺码列输入不同的组合，系统就会将它们识别为同一个链接下的不同变体。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-21 16:04:28\",\"用户\":\"Z\",\"群\":\"\",\"用户问询\":\"像服装的话，一个款式多个码数，每个码数是属于单个SKU 吗\",\"AI响应\":\"是的，每个尺码都属于一个独立的 SKU。在美客多平台，变体是同一产品的不同选项，建议将同款同色的不同尺码放在同一个链接下，每个尺码作为一个 SKU 即可。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-21 15:11:27\",\"用户\":\"Pluto\",\"群\":\"\",\"用户问询\":\"我是up模式不是一个链接下面不同变体可以价格不同吗\",\"AI响应\":\"是的，UP模式确实支持同一链接下的不同变体独立定价。\\n\\n从图片看，这两个链接被拆分是因为它们拥有不同的**Listing ID**（#3547...和#4706...）。这通常是因为在创建时，系统未将它们识别为同一组变体。\\n\\n建议操作：\\n1. 检查两组链接的**标题**是否完全一致。\\n2. 检查**主要特性**（如品牌、模型等）是否完全相同。\\n3. 若需合并，可在后台尝试将其中一个Listing的变体添加到另一个Listing中，或通过批量表格重新关联。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-20 14:56:25\",\"用户\":\"戚\",\"群\":\"\",\"用户问询\":\"某个国家添加之后 另外所有的国家都会自动显示变体吗\",\"AI响应\":\"不会。美客多各站点（如墨西哥、巴西、智利等）的Listing是独立管理的。如果你在某个国家的站点添加了变体，其他站点的对应链接不会自动同步更新，你需要分别进入各站点后台或通过ERP系统为每个国家手动添加。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-24 11:49:30\",\"用户\":\"1\",\"群\":\"\",\"用户问询\":\"那为啥我的链接下变体都算做额外链接了占用额度\",\"AI响应\":\"目前无法直接判断具体原因。建议优先核查是否为每个变体单独创建了Listing，或变体属性设置不当导致系统拆分。建议通过官方链接核实当前额度详情：https://global-selling.mercadolibre.com/help/21423\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-24 11:48:28\",\"用户\":\"1\",\"群\":\"\",\"用户问询\":\"up模式下也是这样吗 变体不占用链接额度吗\",\"AI响应\":\"是的，同一商品的不同变体在上传时必须保持同一标题，系统会将其识别为同一个商品的不同变体，通常共用该条Listing额度，变体区别通过属性栏体现。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":  **检查并同步库存**  \\n- 进入新链接的 **「Inventory Status」(库状态)**，确认数量已更新。  \\n- 若芒果店长仍无法同步，直接在亚马逊官网提交工单，附上新旧SKU截图和库存转移记录，由平台技术团队协助核查。  \\n\\n**注意**：转移后24小时内，旧商品库存不会自动清零，需在【库存管理】中手动标记“已转移”，避免重复操作。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-23 02:49:30\",\"用户\":\"艳子慧里\",\"群\":\"\",\"用户问询\":\"美客多半托管sku有克重要求吗\",\"AI响应\":\"美客多半托管模式下每个产品（SKU）的重量要求是小于400g。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-22 17:52:00\",\"用户\":\"NPT\",\"群\":\"\",\"用户问询\":\"半托管模式怎么增加变体\",\"AI响应\":\"你好！半托管模式增加变体的方法如下：\\n\\n1. 前往卖家后台的“活动列表”。\\n2. 找到对应商品，在操作菜单点击“修改”。\\n3. 在“产品特征”部分，点击“添加或更改变体”。\\n4. 在编辑器中添加新规格，并务必为每个新变体添加独立的图片、库存和通用代码（UPC/EAN）。\\n5. 点击确认即可完成。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-21 18:12:51\",\"用户\":\"蓝七\",\"群\":\"\",\"用户问询\":\"最多支持几条变体来着？\",\"AI响应\":\"你好！很高兴为你解答。目前平台对单个Listing下的变体数量没有明确的统一上限，但建议保持在合理范围内以确保买家体验。若变体过多导致无法识别，建议分拆成多个Listing上传。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"}]},{\"一级大类\":\"账号入驻与安全\",\"二级子类\":\"KYC \\u0026 审核\",\"Past 7 Days\":520,\"Previous 2026-07-13 to 2026-07-19\":525,\"Change\":-5,\"WoW\":-0.009523809523809525,\"Past 7 Share\":0.07316729984522302,\"高频问题\":\"KYC/审核进度/资料提交\",\"__details\":[{\"时间\":\"2026-07-20 14:28:57\",\"用户\":\"LY\",\"群\":\"\",\"用户问询\":\"kyc 审核进度\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n你可以通过以下路径查看KYC验证的进度：\\nSettings（设置） \\u003e Selling Preferences（销售偏好） \\u003e Company’s legal information（企业法律信息） \\u003e 查看进度。\\n\\n成功提交后，状态应显示为：Under review（审核中）。\\n\\n目前KYC审核通常需要2-3周以上，审核进度可以登录店铺后台实时查询。如果界面显示“Upload company legal information”，则表示您的KYC审核未通过，需要重新提交补充材料。\\n\\n提交邮箱后即为您开通KYC审核绿色通道，通常3-5个工作日给反馈，请留意卖家后台审核状态的变化。但是加速审核只有一次机会，请谨慎提交！\\n\\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260618/69555cc95b3e4793a417208bfb9921de.jpeg\\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260618/c2dd106092304f6383cc9c52ad647a5a.png\\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/defaul u0026 审核\",\"问题主题\":\"KYC/审核进度/资料提交\"},{\"时间\":\"2026-07-21 17:19:34\",\"用户\":\"Mira\",\"群\":\"\",\"用户问询\":\"你好，请问我的店铺，因股东退出，但是他是法人，我这边想要变革主体需要怎么操作，我这边full仓库存还在，还打算继续补货 你好，请问我的店铺，因股东退出，但是他是法人，我这边想要变更主体需要怎么操作，我这边full仓库存还在，还打算继续补货\",\"AI响应\":\"你好！很高兴为你解答。目前美客多入驻主体、法人等核心信息一旦提交无法直接修改。若因法人变更需更换主体，建议先通过后台开Case咨询官方客服，确认当前站点是否支持主体迁移及库存处理方案。\",\"一级大类\":\"账号入驻与安全\",\"二级子类\":\"KYC \\u0026 审核\",\"问题主题\":\"KYC/审核进度/资料提交\"},{\"时间\":\"2026-07-20 10:37:59\",\"用户\":\"Yo\",\"群\":\"\",\"用户问询\":\"你好 上周五我们已经进行了kyc认证，已经提交了资料，请问一下大概需要等多久呢？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\nKYC审核须2-3周以上。由于近期KYC处理量激增，请你耐心等待。\\n\\n你可以登录店铺后台实时查询审核进度，路径为：Settings（设置） \\u003e Selling Preferences（销售偏好） \\u003e Company’s legal information（企业法律信息）。\\n\\n如果成功提交，状态应显示为：Under review（审核中）。若已完成扫脸，建议静候24小时让数据同步，不要重复提交。\\n\\n提交邮箱后即为您开通KYC审核绿色通道，通常3-5个工作日给反馈，请留意卖家后台审核状态的变化。但是加速审核只有一次机会，请谨慎提交！\",\"一级大类\":\"账号入驻与安全\",\"二级子类\":\"KYC \\u0026 审核\",\"问题主题\":\"KYC/审核进度/资料提交\"},{\"时间\":\"2026-07-21 16:31:27\",\"用户\":\"￴ ￴￴ ￴￴\",\"群\":\"\",\"用户问询\":\"你好，我的KYC已经登记好了，可以发布产品了 请问你们后台的发布产品流程有吗\",\"AI响应\":\"你好！很高兴为你解答。在后台左侧菜单栏点击 Listings，选择添加列表并选择对应类别。首次列出需导航分类树查找，之后可从常用类别选择。下载并填写包含标题、变体、价格、描述等信息的Excel文件后上传即可，文件需小于100MB。\\n\\n网页参考资料：https://mp.weixin.qq.com/s/0LnZB4Agz-TVP0qN_WI-Mw\",\"一级大类\":\"账号入驻与安全\",\"二级子类\":\"KYC \\u0026 审核\",\"问题主题\":\"KYC/审核进度/资料提交\"},{\"时间\":\"2026-07-20 10:37:48\",\"用户\":\"Yo\",\"群\":\"\",\"用户问询\":\"你好 上周五我们已经进行了kyc认证，已经提交了资料，请问一下大概需要等多久你\",\"AI响应\":\"你好！很高兴为你解答。\\n\\nKYC审核通常需要2-3周以上的时间。如果是自发货或海外仓模式，正常的资料审核周期一般为7到10天。\\n\\n由于近期KYC处理量激增，审核时效可能会有所延长。建议你登录店铺后台，通过以下路径实时查询审核进度：\\nSettings（设置） \\u003e Selling Preferences（销售偏好） \\u003e Company’s legal information（企业法律信息）。\\n\\n如果状态显示为 Under review（审核中），说明材料正在审核过程中，请耐心等待，暂无需操作。若已完成扫脸，建议静候24小时让数据同步，不要重复提交。若等待时间超过20个工作日仍未更新，可以联系官方客服进一步查询。\",\"一级大类\":\"账号入驻与安全\",\"二级子类\":\"KYC \\u0026 审核\",\"问题主题\":\"KYC/审核进度/资料提交\"},{\"时间\":\"2026-07-25 13:49:41\",\"用户\":\"Holly\",\"群\":\"\",\"用户问询\":\"刚刚手速比较快快，Yiwu Shi Dongshan Dianzi Shangwu Youxian Gongsi，用了这个 然乎审核过了，没问题对吧 [捂脸]\",\"AI响应\ 2d386538372d6232333632626236626532340203102800020300ba0004107ed0a5b468c5060a4b849e47b8a7571f0201****0400\\\",\\\"height\\\":405,\\\"imageHasHd\\\":true},\\\"subMsgTimestamp\\\":0},{\\\"subMsgSenderId\\\":\\\"0\\\",\\\"subMsgSenderCorpId\\\":0,\\\"subMsgId\\\":\\\"\\\",\\\"subMsgType\\\":2,\\\"subMsgSenderAvatar\\\":\\\"\\\",\\\"subMsgSenderName\\\":\\\"\\\",\\\"subMsgSenderCorpName\\\":\\\"\\\",\\\"subMsgFromId\\\":\\\"0\\\",\\\"subMsgData\\\":{\\\"reply\\\":{},\\\"atList\\\":[],\\\"moreDetail\\\":[{\\\"subtype\\\":0,\\\"text\\\":\\\"为什么账号恢复了 但是产品还是显示未激活\\\"}],\\\"content\\\":\\\"为什么账号恢复了 但是产品还是显示未激活\\\"},\\\"subMsgTimestamp\\\":0}],\\\"subMsgFlag\\\":0}\",\"AI响应\":\"账号恢复后产品仍显示未激活，可能是产品本身未满足激活条件。请先检查以下几点：1. **品牌授权**：若产品涉及品牌，需确认是否已完成品牌备案或获得品牌授权书；2. **产品信息合规**：检查标题、图片、描述是否含违规词或侵权内容；3. **资质文件**：确保营业执照、税务登记证等资料无异常。若上述内容均合规，可联系客户经理或通过后台Help模块提交申诉材料，说明账号已恢复但产品未激活的情况，以便协助核查处理。\",\"一级大类\":\"其他\",\"二级子类\":\"系统报错\",\"问题主题\":\"后台系统报错/页面问题\"},{\"时间\":\"2026-07-23 22:34:52\",\"用户\":\"Flora\",\"群\":\"\",\"用户问询\":\"美女，麻烦打听一下，我这个每个多平台后面它显示的这个费用的扣款，它这个费用是几号到几号之间的？我从哪里可以看得出来它这个费用？的时间段是多少？他是一个月统计一次吗？是整月统计吗？\",\"AI响应\":\"在发票汇总（Resumo da fatura）页面查看费用时间段，图片显示为**2026年8月4日-8月10日**（以页面「截止日期」为准）。费用统计通常按月周期，具体以账单周期的截止日期范围为准。\",\"一级大类\":\"其他\",\"二级子类\":\"系统报错\",\"问题主题\":\"后台系统报错/页面问题\"},{\"时间\":\"2026-07-25 18:26:48\",\"用户\":\"大大大明\",\"群\":\"\",\"用户问询\":\"所以现在我在后端看到的是No free shipping 后端是这样的，也就是说可能后台还没更新过来对吗\",\"AI响应\":\"是的，后台显示确实存在延迟。只要前台页面已经显示绿色 **Envío gratis**，就说明买家端已经生效。你可以以买家看到的为准，后台状态通常会在24小时内同步更新。\",\"一级大类\":\"其他\",\"二级子类\":\"系统报错\",\"问题主题\":\"后台系统报错/页面问题\"},{\"时间\":\"2026-07-24 20:26:48\",\"用户\":\"Julia\",\"群\":\"\",\"用户问询\":\"卖家已签署邮件，CFS邮件也签署邮件，但是后台依然显示PENDING 应该怎么办？\",\"AI响应\":\"你好！很高兴为你解答。请及时查看卖家后台通知的验证递交截止日期，使用此前提交CSF文件时登记的邮箱，登录并签署官方通告邮件中的《RFC知情授权书》。若已完成签署但状态未更新，建议联系平台后台确认实时审核进度。\",\"一级大类\":\"其他\",\"二级子类\":\"系统报错\",\"问题主题\":\"后台系统报错/页面问题\"},{\"时间\":\"2026-07-23 14:07:42\",\"用户\":\"陳俊\",\"群\":\"\",\"用户问询\":\"你好有没有客户经理对接啥的 感觉什么问题都解决不了 不知道那里出错了 后台bug 太多了\",\"AI响应\":\"别着急哈！自注册账号默认没有专属客户经理，但可以通过以下方式对接：  \\n\\n### 1. **填写官方申请表**  \\n如果您的店铺符合 **FTI工贸一体项目** 要求（近12个月流水超30万美元、有工厂资质、有全托管/半托管经验），可以填写 [官方客户经理申请表](https://doc.weixin.qq.com/forms/AI8A3wfvAAoAZAAaQazAKgCNI0iZoEFqf?page=1) 申请对接。  \\n\\n### 2. **加入高阶卖家成长服务（IDS PRO）**  \\n如果您是自发货卖家，单店铺周流水≥$2000，可关注 [自发货高阶卖家成长服务](https://mp.weixin.qq.com/s/SOextL25EnZqMxGr09tSWQ)，按指引报名后会匹配专属运营团队。  \\n\\n### 3. **提升业绩触发自动分配**  \\n若暂时不符合上述条件，可通过提升店铺销售额（如达成周GMV ***美金以上），系统会自动分配客户经理。  \\n\\n如果问题紧急，您可以先通过后台右上角“？”→“Need Help”联系在线客服，反馈时记得附上错误截图和Case ID，客服会协助您处理。  \\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"其他\",\"二级子类\":\"系统报错\",\"问题主题\":\"后台系统报错/页面问题\"},{\"时间\":\"2026-07-20 18:14:33\",\"用户\":\"花花～\",\"群\":\"\",\"用户问询\":\"你好 这个营业期限，营业执照上没有，然后说填2100就可以，但是我填2100了通不过\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n营业期限为无固定期限或长期时，直接填写 2100/01/01 即可。从你提供的截图来看，系统提示错误可能是因为日期格式不完整，请尝试输入完整的年月日格式。\",\"一级大类\":\"其他\",\"二级子类\":\"系统报错\",\"问题主题\":\"后台系统报错/页面问题\"},{\"时间\":\"2026-07-24 10:20:23\",\"用户\":\"超'\",\"群\":\"\",\"用户问询\":\"你好，之前是审核状态中，今天看到又回到第一步上传信息及文件 这是审核失败了吗\",\"AI响应\":\"你好！很高兴为你解答。如果界面显示“Upload company legal information”，通常表示KYC审核未通过，需要重新提交补充材料。请进入页面查看具体驳回原因，并按要求修正。\",\"一级大类\":\"其他\",\"二级子类\":\"系统报错\",\"问题主题\":\"后台系统报错/页面问题\"},{\"时间\":\"2026-07-22 18:05:02\",\"用户\":\"Felicity 103%\",\"群\":\"\",\"用户问询\":\"我的营业执照多次被驳回 我想看我一开始提交的信息有没有错误，没有查看窗口\",\"AI响应\":\"你好！很高兴为你解答。审核中无法修改资料，也无法直接查看已提交的信息。若被驳回，请在首页 Summary 点击 Review Status 查看具体原因。若显示 Upload document，说明执照不符；若显示 Complete information，说明文字信息有误，请按意见修正。\",\"一级大类\":\"其他\",\"二级子类\":\"系统报错\",\"问题主题\":\"后台系统报错/页面问题\"},{\"时间\":\"2026-07-22 10:57:36\",\"用户\":\"壹号国际-Jason\",\"群\":\"\",\"用户问询\":\"买家投诉过来 我当时页面有显示部分退款选项 但是过了两天没有了是什么 情况\",\"AI响应\":\"你好！很高兴为你解答。部分退款选项消失通常是因为买家拒绝了该提议，或者投诉处理已进入下一阶段。建议你及时查看纠纷详情，若无法协商，可准备证据申请平台介入裁决。\",\"一级大类\":\"其他\",\"二级子类\":\"系统报错\",\"问题主题\":\"后台系统报错/页面问题\"},{\"时间\":\"2026-07-26 18:00:10\",\"用户\":\"Jenny  Yu\",\"群\":\"\",\"用户问询\":\"有ERP上传成功，有一个站点失败需要重新上传吗？\",\"AI响应\":\"不需要重新上传整个产品，只需要针对失败的那个站点进行操作。\\n\\n你可以通过以下两种方式处理：\\n1. **ERP重试**：在ERP系统中找到该产品的发布记录，仅勾选失败的站点重新点击发布。\\n2. **后台手动补录**：登录美客多卖家后台，在 **Listings** 页面找到该产品，点击 **Add to another marketplace**，手动勾选失败的站点并完善该站点的特定信息（如价格、库存）即可。\\n\\n建议先检查失败原因（如价格超出限制、类目不匹配等），修改后再重新发布。\",\"一级大类\":\"其他\",\"二级子类\":\"系统报错\",\"问题主题\":\"后台系统报错/页面问题\"},{\"时间\":\"2026-07-26 17:59:19\",\"用户\":\"Jenny  Yu\",\"群\":\"\",\"用户问询\":\"我都换了一个产品还是不能显示呀 我都不知道什么原因\",\"AI响应\":\"如果换了完全不相关的普通产品（非品牌配件）依然不显示，建议按以下步骤排查：\\n\\n1. **检查店铺状态**：请确认后台 **Settings \\u003e My data** 中是否有报错，或是否收到了要求完成 **KYC（身份审核）** 或 **RFC（税号）** 验证的邮件。如果审核未通过，店铺刊登功能会被限制。\\n2. **查看审核列表**：在卖家后台 **Listings** 页面，点击筛选框，查看 **Under review**（审核中）或 **Inactive**（非活跃）分类，看产品是否被卡在审核环节。\\n3. **同步延迟**：系统同步有时需 24 小时，请尝试通过 **MLM/MLC 代码**直接在后台搜索。\\n\\n如果以上都正常但仍不显示，建议通过后台 **Help** 提交工单，联系客服核实账号是否有刊登限制。\",\"一级大类\":\"其他\",\"二级子类\":\"系统报错\",\"问题主题\":\"后台系统报错/页面问题\"},{\"时间\":\"2026-07-24 14:00:21\",\"用户\":\"花花\",\"群\":\"\",\"用户问询\":\"这个图显示出来的发布成功，是不是已代表在美客多售卖了吗？\",\"AI响应\":\"发布成功仅代表商品信息已上传。若要正式售卖，还需确保：1.店铺状态正常；2.自发货模式需库存大于0；3.全托管模式需完成备货并入库。\",\"一级大类\":\"其他\",\"二级子类\":\"系统报错\",\"问题主题\":\"后台系统报错/页面问题\"},{\"时间\":\"2026-07-24 11:47:56\",\"用户\":\"1\",\"群\":\"\",\"用户问询\":\"可是为什么up店显示一万条额度 结果我只上了两千条就满了\",\"AI响应\":\"上架总数由店铺信誉等级动态决定，无法人工申请增加。建议您专注提升订单履约率与销售业绩，随着店铺信誉等级的提升，系统将会自动为您扩充上架额度。您可以点击链接查看具体限制：https://global-selling.mercadolibre.com/help/21423\",\"一级大类\":\"其他\",\"二级子类\":\"系统报错\",\"问题主题\":\"后台系统报错/页面问题\"},{\"时间\":\"2026-07-22 15:58:56\",\"用户\":\"小鞋生-波\",\"群\":\"\",\"用户问询\":\"你好，早上那个问题，我们连接了VPN ，网页反而打不开了？\",\"AI响应\":\"你好！很高兴为你解答。此提示通常因网络环境异常导致，建议你切换网络环境，尝试关闭VPN，使用本地网络，或更换纯净IP节点，配合更换设备或使用指纹浏览器多次重试。\",\"一级大类\":\"其他\",\"二级子类\":\"系统报错\",\"问题主题\":\"后台系统报错/页面问题\"},{\"时间\":\"2026-07-22 09:13:37\",\"用户\":\"楠故\",\"群\":\"\",\"用户问询\":\"如何从菜鸟服务点查询页面获取负责该区域的司机电话\",\"AI响应\":\"你好！很高兴为你解答。你可以访问菜鸟揽收服务点查询页面（https://cainiao.4px.com/site/helpDetailsLs），在页面中查找并获取负责您所在区域的司机联系方式，直接联系司机进行沟通。\",\"一级大类\":\"其他\",\"二级子类\":\"系统报错\",\"问题主题\":\"后台系统报错/页面问题\"},{\"时间\":\"2026-07-21 22:56:19\",\"用户\":\"灿烂阳光\",\"群\":\"\",\"用户问询\":\"显示0是无法售卖的 此时我是新店铺，能给予一些指导吗\",\"AI响应\":\"新店铺商品显示库存为0确实无法售卖，建议你按以下步骤操作：\\n\\n1. 激活库存：请直接在卖家后台该商品的库存栏位输入实际库存数量并保存。只有库存大于0，Listing才会变为 Active（激活）状态。\\n\\n2. 检查商品状态：确认后台商品状态是否为 Active。如果是新上架的商品，系统可能需要一点时间同步数据，请耐心等待。\\n\\n3. 完善Listing属性：检查标题是否包含特殊符号或营销词汇，确保类目选择精准，品牌、型号等必填属性已填写完整。\\n\\n4. 确认物流模式：新店铺如果是自发货模式，确保你已经完成了物流承运商的绑定或相关设置，否则可能影响商品售卖。\\n\\n5. 关注店铺状态：确保店铺没有因为资料审核（如KYC）未完成而被限制销售。\\n\\n只要库存补足且状态正常，你的商品就能在前台被搜索并购买了。\",\"一级大类\":\"其他\",\"二级子类\":\"系统报错\",\"问题主题\":\"后台系统报错/页面问题\"},{\"时间\":\"2026-07-21 21:12:28\",\"用户\":\"Zeke郑\",\"群\":\"\",\"用户问询\":\"那为什么有的它显示有其他更多购买选项，有的底下是参数\",\"AI响应\":\"这是因为美客多对相同产品的展示方式不同，具体逻辑如下：\\n\\n1. 更多购买选项：这是目录列表（Catalog Listing）的特征。当多个卖家销售同一款标准产品（如特定型号的手机）时，平台会将这些列表聚集在一起。提供最佳价格、配送速度或列表类型的卖家会占据最显眼的展示位，而其他卖家的报价则被折叠在“查看更多选项”中，方便买家对比。\\n\\n2. 底下显示参数：这是产品页面（Product Page）的展示方式。平台会为同一产品的不同变体（例如手机的不同颜色、内存容量）创建一个聚合页面。买家可以直接在页面上通过参数选择不同的规格，每个规格选项下同样会突出显示该选项的最佳报价卖家。\\n\\n这种设计的目的是为了让买家能够更高效地比较不同卖家的条件，或者在同一页面内快速切换产品规格。确保您的列表具有竞争力的排名，可以提高在这些聚合页面中的可见性。\",\"一级大类\":\"其他\",\"二级子类\":\"系统报错\",\"问题主题\":\"后台系统报错/页面问题\"},{\"时间\":\"2026-07-21 17:09:06\",\"用户\":\"大大大明\",\"群\":\"\",\"用户问询\":\"我自己送到泉州丰泽仓了，只要他这里扫描了我这里后台就会显示吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n是的，物流商收到货物并完成收件扫描（A-scan）后，系统会自动回传信息，货件状态会从“Ready to ship”变成“In transit”。\",\"一级大类\":\"其他\",\"二级子类\":\"系统报错\",\"问题主题\":\"后台系统报错/页面问题\"},{\"时间\":\"2026-07-21 15:32:08\",\"用户\":\".\",\"群\":\"\",\"用户问询\":\"半托投诉我同意退款但是报错无法向买家同意退款，这是什么情况\",\"AI响应\":\"目前无法直接判断具体原因。建议优先核查该订单是否已由平台介入处理，或是否存在系统延迟。由于半托管模式的售后由平台统一管控，若后台报错，建议通过工单联系平台客服，并提供报错截图及订单号进行核实。\",\"一级大类\":\"其他\",\"二级子类\":\"系统报错\",\"问题主题\":\"后台系统报错/页面问题\"},{\"时间\":\"2026-07-21 13:22:45\",\"用户\":\"喜柿\",\"群\":\"\",\"用户问询\":\"表格出现这个，但是没有看到错误信息的提示 在哪里查询\",\"AI响应\":\"卖家您好，请在下载的错误文件中查看“错误摘要”列，需要纠正的详细信息通常会以红色下划线显示。如果仍未看到，请检查表格中是否有隐藏列，或核实单元格内是否存在特殊符号、格式异常及未填写的必填项。\",\"一级大类\":\"其他\",\"二级子类\":\"系统报错\",\"问题主题\":\"后台系统报错/页面问题\"},{\"时间\":\"2026-07-21 09:14:32\",\"用户\":\"曲\",\"群\":\"\",\"用户问询\":\"发票上传到订单页面，买家怎么下载，买家说他不知道\",\"AI响应\":\"你好！很高兴为你解答。你可以告知买家按照以下步骤下载发票：\\n1. 登录美客多买家账号，进入“我的订单（Mis compras）”。\\n2. 找到对应的订单，点击进入订单详情。\\n3. 在订单详 为自送），通常需要联系平台客服或对应的物流承运商（如菜鸟）协助处理，因为一旦生成面单，物流单号就已经绑定了。\\n\\n网页参考资料：\\nhttps://global-selling.mercadolibre.com/help/1078\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-21 08:34:05\",\"用户\":\"花花～\",\"群\":\"\",\"用户问询\":\"请问跨境店+平台仓和跨境店+自发货的区别是什么？平台仓有物流揽收的业务是以城市为范围吧？如果我是由不同的厂家发货，但是城市都集中在义乌和东莞，那么我可以选择平台仓上门揽收的业务吗？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n跨境店+平台仓（Full模式）与跨境店+自发货（CBT模式）的主要区别如下：\\n\\n1. 流量与权重：平台仓（Full）的产品带有Full标志，享受流量倾斜，转化率更高；自发货权重相对较低。\\n2. 配送时效：平台仓由美客多官方仓库直接发货给买家，时效极快；自发货由卖家从中国发货，时效较慢。\\n3. 运营重心：平台仓需要卖家提前备货到拉美当地仓库，有库存压力；自发货是出单后再发货，无库存压力。\\n\\n关于你提到的揽收业务：\\n\\n1. 业务性质不同：\\n上门揽收业务目前主要针对的是“自发货（CBT）”订单。\\n平台仓（Full）模式下，卖家需要自己负责将大货运送到美客多在拉美当地的仓库，平台不提供国内上门揽收大货去海外仓的服务。\\n\\n2. 自发货揽收范围：\\n自发货的揽收确实是以城市和具体街道为范围的。目前由菜鸟承接，在义乌和东莞都有揽收覆盖。\\n\\n3. 不同厂家发货的操作：\\n如果你是自发货模式：只要这些厂家都在菜鸟的揽收范围内，你可以设置多个揽收地址。但请注意，后台通常只能设置一个主揽收地址。如果厂家分散，建议让厂家直接将包裹“自送到仓（Drop-off）”到义乌或东莞的菜鸟仓库，这样更灵活。\\n如果你是平台仓模式：你需要把不同厂家的货集中起来，打包成大货箱，然**公司发往海外仓。\\n\\n总结：上门揽收是给自发货订单准备的，不是给往海外仓备货准备的。如果你的厂家在义乌和东莞，自发货时可以选择自送到菜鸟仓库，这是最稳妥的做法。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-20 15:10:32\",\"用户\":\"大大大明\",\"群\":\"\",\"用户问询\":\"这一个订单是买家买了3个，但是我每个商品都是独立包装，那么我可以把它们打包成一个包裹吗\",\"AI响应\":\"可以一起发。如果这3个商品能安全地打包在一个包裹内，且总重量≤15kg、三边之和≤135cm，就可以合并发货。只需打印一张面单贴在最外层大包裹上即可。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-20 10:01:27\",\"用户\":\"A.roc\",\"群\":\"\",\"用户问询\":\"墨西哥full备货过去请选择配送和物流信息怎么选择，我是自己发货备货过去，不是直接发到沙田就好了吗？为什么还要选择商品尚未到达目的地，目前正在运输中，还有一个商品位于墨西哥啥意思\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n这是因为你选择的备货模式不同：\\n\\n1. **商品尚未到达目的地**：适用于你从中国发货，通过平台合作物流或自找物流发往墨西哥。如果你是发往沙田集运仓，请选择此项。\\n2. **商品位于墨西哥**：适用于你的货物已经在墨西哥本地第三方仓，现在要从本地仓调拨到美客多Full仓。\\n\\n请根据货物的实际物理位置选择。\\n\\n网页参考资料：\\nhttps://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-21 18:39:05\",\"用户\":\"wong\",\"群\":\"\",\"用户问询\":\"国内菜鸟集运仓有哪些，48小时内送达是按客人下单时间开始算吗 普通海外仓/自发货店铺 和 全托管/半托管，工贸一体项目，这些模式在平台推广或前端商品标识上有什么不同\",\"AI响应\":\"国内菜鸟集运仓分布在东莞、深圳、义乌、上海、泉州等地。48小时发货时效是从订单生成开始计算，不含周末及节假日，以物流官网显示已揽收为准。\\n\\n前端标识区别：\\n1. 全托管/半托管：有小飞机图标 + FULL标识。\\n2. 自发货：仅有小飞机图标。\\n3. 海外仓（FULL）：仅有FULL标识。\\n\\n全托管/半托管由平台负责推广，海外仓模式在流量和转化率上比自发货更有优势。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-26 16:04:25\",\"用户\":\"彩虹\",\"群\":\"\",\"用户问询\":\"因为我这个是fti自发货店铺，应该下来一周了，我月底的时候需要回家处理事情，会耽误半个月，就是这半个月没办法运营和发货，我是等回来过后再开始上款运营呢还是？\",\"AI响应\":\"你好！很高兴为你解答。建议你等回来后再开始上款运营。因为自发货对时效要求极高（72小时上网），若出单后无法及时发货会严重影响店铺声誉甚至导致封号。新店建议在能保证稳定发货时再开启运营。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-23 22:39:41\",\"用户\":\"拾荒的老男孩－米高．羅\",\"群\":\"\",\"用户问询\":\"打印发货面单后，没有提交发货的地方，不需要点发货吗\",\"AI响应\":\"你好！很高兴为你解答。发货后需要点击确认发货，通常在订单详情页的物流信息区域会有“确认收货（发）货”按钮，点击即可完成提交。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-23 20:10:40\",\"用户\":\"wong\",\"群\":\"\",\"用户问询\":\"全托/半托和自发货，商品和面单具体需要什么规格的标签？\",\"AI响应\":\"全托管/半托管：外箱贴 **10*15cm** 标签（BAG LABEL），产品贴 **7*2.2cm** 标签（SKU LABEL）。  \\n自发货：物流面单 **10*15cm**，商品标签 **7*2.2cm**（需在后台下载打印）。  \\n\\n（注：全托管/半托管货物严禁与自发货混装，标签需清晰粘贴）\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-23 18:16:17\",\"用户\":\"wong\",\"群\":\"\",\"用户问询\":\"全托，半托，自发货，商品和面单等，需要什么规格的标签？\",\"AI响应\":\"### 全托管/半托管：  \\n- **外箱标签(BAG Label)**：使用 **10*1 *5cm** 热敏纸打印；  \\n- **产品标签(SKU Label)** : 使用 **7 * * .2 cm** 热敏纸打印。  \\n\\n\\n### 自发放货(自发货)：  \\n- **物流面单** (运输面单)：使用 **10*15cm** 热敏纸打印；  \\n- **Product/SKU Label** (商品条码标签)：参考半托管/全托管，使用 **7*2.2cm** 热敏纸打印（确保条码清晰可扫描）。  \\n\\n\\n（注以上为核心规格，具体以平台最新指引为准）\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-23 16:02:53\",\"用户\":\"李鸿\",\"群\":\"\",\"用户问询\":\"做半托只需把货寄到东莞仓。需不需要打好面单先再寄？\",\"AI响应\":\"自寄到仓的话，外箱需要贴上快递面单以及IC单（bag label），IC单（bag label）需要在箱内多放一张，避免运输途中外标掉落；自送到仓的话，外箱贴IC单（bag label）即可。标签尺寸要求：BAG LABEL为10*15cm，SKU LABEL为7*2.2cm，单箱内有多个SKU时要做好物理隔离。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-22 09:49:28\",\"用户\":\"蓝天白云\",\"群\":\"时骏科技-美客多助手\",\"用户问询\":\"@美客多小助手萝拉 打印面单上没有仓库的收货电话吗？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n美客多官方生成的物流面单上通常是不显示仓库收货电话的。\\n\\n这是因为集运仓（如深圳沙井仓、东莞沙田仓）属于大型物流中转枢纽，每天处理海量包裹，并不直接对接卖家的咨询或电话查询。\\n\\n如果你是自寄（Drop Off）模式，在联系国内快递（如顺丰、中通等）寄送时，收件人可以直接填写“菜鸟仓库”或面单上显示的仓库名称，电话可以填写你自己的联系电话或者留空（部**公司要求必填，你可以尝试填写菜鸟的官方客服热线或咨询你的货代）。\\n\\n只要面单清晰、地址准确，仓库在收到货后会直接扫描面单上的条码入库，不需要通过电话联系。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-21 21:37:28\",\"用户\":\"95后一场梦\",\"群\":\"\",\"用户问询\":\"那备过去的服装 个反面比如包装 洗水唛 各反面有什么要求呢\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n关于全托管模式下服装类产品的发货要求，主要分为洗水票和打包贴标两个方面，具体要求如下：\\n\\n一、 洗水票（Care Label）要求\\n1. 必须具备：服装类产品必须缝有洗水票。这是拉美各国海关清关以及当地消费者权益保护法的硬性要求。\\n2. 核心内容：洗水票应清晰标注以下信息：\\n- 纤维成分（如 100% Cotton / 100% Algodón）\\n- 洗涤维护说明（使用国际通用洗涤图标或文字说明）\\n- 产地（Made in China / Hecho en China）\\n- 尺码信息\\n3. 语言要求：建议包含西班牙语（针对墨西哥、智利等站点）或葡萄牙语（针对巴西站点）。\\n4. 物理要求：洗水票必须牢固缝合在衣服内侧，不能轻易脱落。\\n\\n二、 打包及贴标要求\\n1. 单件包装：每一件衣服都必须有独立的透明包装袋。\\n2. 独立贴标：每个独立包装袋上必须张贴对应的SKU标签（即产品条码），确保条码平整、清晰可扫描。\\n3. 分类隔离：不同SKU的产品不能混装。建议每个SKU（同款同色同码）先用大袋子或捆扎方式进行隔离打包，然后再统一装入外箱。\\n4. 包装尺寸限制：商品包装后的尺寸不能超过：长度60厘米、宽度40厘米、高度35厘米，且三边之和不超过135厘米。\\n5. 外箱要求：最外层可以使用结实的编织袋或纸箱，但必须在外层张贴好对应的外箱标签（箱唛）。\\n\\n风险提示：如果缺少洗水票或信息缺失，可能会导致货物在清关环节被扣押，或者到达官方仓后被拒收。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-20 21:24:52\",\"用户\":\"自以为是\",\"群\":\"\",\"用户问询\":\"事实是，你们和物流商并没有确认要给商家发货凭证，导致商家没有凭证，然后你们每次处理问题都需要凭证，所以问题就可以不用处理，这真的不是你们故意的吗\",\"AI响应\":\"目前无法直接判断具体原因。建议您优先核查与物流商的合作协议或交接流程。若遇到此类问题，可按以下方向处理：联系物流商总部要求调取该批次的揽收记录或行车轨迹，并以此作为证据在后台重新开case。后续建议在交接时要求物流商提供电子或纸质签收记录。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-20 21:19:09\",\"用户\":\"自以为是\",\"群\":\"\",\"用户问询\":\"我的订单被用户取消了，但是当时商品已经被快递员取走了，还未扫描。现在订单取消了，这个商品却没有给我退回来，而且看物流轨迹也看不出来，这个要怎么弄\",\"AI响应\":\"你好！如果货物已被取走但未扫描，且订单已取消，请尽快联系菜鸟客服尝试拦截。若拦截失败，货物一旦扫描上网将无法中途退回，需完成配送。建议你在后台开case并提供订单及物流截图，若48小时未解决，可联系经理协助。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-20 21:01:10\",\"用户\":\"大大大明\",\"群\":\"\",\"用户问询\":\"我可以贴好10*15的面单后，在外面包一个袋子，贴国内的面单吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n可以的。但请务必注意：国内快递面单只能贴在最外层的包装袋上。当包裹到达集运仓后，仓库人员会拆掉外层包装袋，请确保里面的产品包裹上已经贴好了清晰、完整的 10*15cm 美客多国际物流面单。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-20 15:28:10\",\"用户\":\"大大大明\",\"群\":\"\",\"用户问询\":\"如果我不直接打印出来，而是复制了面单另外打出来可以吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n不建议这样做。请直接点击后台的 Print label 下载并打印原始面单。\\n\\n自行复制或截图再打印可能会导致条码比例失调、清晰度下降或信息缺失，一旦物流商无法扫描，包裹将无法正常上网，会严重影响你的订单处理时效和店铺绩效。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-20 15:21:54\",\"用户\":\"大大大明\",\"群\":\"\",\"用户问询\":\"打印面单要用多大的热敏纸，100*100的可以用吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n不可以。美客多自发货物流面单要求使用 10*15cm（即 100*150mm）的热敏纸打印。\\n\\n请确保面单及条码完好清晰、可扫描，不要使用 100*100 的规格，以免面单信息显示不全或条码被压缩导致无法扫描。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-20 12:04:31\",\"用户\":\"蓝天白云\",\"群\":\"时骏科技-美客多助手\",\"用户问询\":\"@美客多小助手萝拉 打印的面单是要贴在货物外箱是吗？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n是的，打印出来的面单必须牢固地贴在包裹的最外层包装上。\\n\\n在贴面单时，请注意以下几点：\\n1. 保持平整：面单需要平整地贴在包裹表面，不要折叠或覆盖条形码及二维码，确保物流仓库能够顺利扫描。\\n2. 保护面单：如果使用热敏纸打印，请勿用透明胶带完全覆盖条形码，因为胶带的化学成分可能会导致字迹褪色，影响扫描。\\n3. 包装要求：建议使用包裹袋进行包装，并使用紫色扎带封口。如果是易碎品必须使用纸箱，也请确保面单贴在纸箱最大的平整面上。\\n4. 唯一性：包裹外箱上只能保留这一张美客多官方生成的面单，请移除任何无关的旧标签或物流单据，避免仓库误扫。\\n\\n网页参考资料：\\n商品包装\\u0026贴标指南：https://global-selling.mercadolibre.com/help/42016\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-20 12:03:03\",\"用户\":\"蓝天白云\",\"群\":\"时骏科技-美客多助手\",\"用户问询\":\"@美客多小助手萝拉 但是面单显示是要求送到深圳沙井呢？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n从你提供的面单截图来看，面单上显示的地址确实是深圳沙井。这是因为系统会根据你在后台设置的发货地址，自动为你分配距离最近或最匹配的菜鸟集运仓。\\n\\n既然面单已经生成并指定了深圳沙井的地址，请你按照面单上的信息，将包裹自寄到该地址即可。\\n\\n如果你希望更改交付的仓库（例如想改到东莞沙田仓），你需要前往卖家后台 Selling Preferences -\\u003e Dispatch Methods 重新检查并修改你的物流设置，选择你期望的交付仓库。但请注意，已经生成的订单面单是无法更改地址的，建议这单先按照面单地址寄送，以免耽误发货时效。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-23 14:05:12\",\"用户\":\"Michael-拾荒的小男孩\",\"群\":\"\",\"用户问询\":\"美客多在线不可以发送发货时的包装图片给买家吗\",\"AI响应\":\"不好意思，该问题我没有答案，请点击以下链接咨询人工客服：\\nhttps://work.weixin.qq.com/kfid/kfc7c47108dec2b0070?enc_scene=ENCGH59j4kB9XCrk4dX6Jt2BZeAhKD7ZBUNQhrF2CcGYyCW\\u0026scene_param=customer_id=7881****6611\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-21 03:26:22\",\"用户\":\"水果🍉\",\"群\":\"\",\"用户问询\":\"为什么感觉自发货店和FTI店发货面单没什么区别\",\"AI响应\":\"因为目前自发货和FTI模式的物流均由菜鸟承接，且都要求使用10*15cm的热敏纸打印物流面单，所以面单格式和要求基本一致。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-20 21:00:16\",\"用户\":\"大大大明\",\"群\":\"\",\"用户问询\":\"我把面单打印出来直接发到东莞仓库就可以了对吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n是的，打印并贴好 10*15cm 的物流面单后，在 48 个工作小时内将包裹发送至美客多指定的东莞集运仓即可。你可以选择顺丰等快递自寄，也可以在后台设置上门揽收。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-20 19:08:23\",\"用户\":\"花花～\",\"群\":\"\",\"用户问询\":\"你是说我如果选择自寄模式的话，我在后台先设置一个固定的地址，但是我发货时就可以用跟后台输入的不一样的地址，而这也并不会影响什么，是这个意思吗？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n是的，你的理解是正确的。\\n\\n在自寄（Drop Off）模式下，后台设置的发货地址主要用于系统备案。实际发货时，你可以让不同的厂家从各自的所在地将包裹寄往菜鸟的自寄仓库。\\n\\n只要包裹能够按时送达菜鸟仓库，并且包裹上的面单信息准确，菜鸟仓库扫描上网后，订单状态就会正常更新。这种方式不会因为实际发货地与后台设置地址不一致而影响你的店铺绩效。\\n\\n请务必提醒厂家，务必在订单产生的72小时（工作日）内完成仓库扫描上网，以避免订单超时。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-20 16:00:43\",\"用户\":\"明月清风\",\"群\":\"\",\"用户问询\":\"这段文字是中文还是 后续到集货仓要换面单吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n关于物流面单的语言和操作要求如下：\\n\\n1. 面单语言：\\n你在卖家后台点击“Print label”打印出来的官方物流面单是系统自动生成的，上面包含目的地国家的语言（如西班牙语或葡萄牙语）以及必要的物流条码。\\n\\n2. 是否需要换单：\\n不需要换单。你只需要使用10*15cm的热敏纸将这张面单打印出来，并牢固地贴在产品外包装上即可。\\n\\n3. 发货操作：\\n你贴好这张官方物流面单后，将包裹发送至美客多指定的国内集运仓。集运仓的工作人员会直接扫描你贴好的这张面单进行入库（A-scan）。\\n\\n特别提醒：\\n请确保物流面单（及条码）完好清晰可扫描，避免被国内快递的面单覆盖，也不要在热敏纸面单上粘贴透明胶带，以免字迹模糊导致无法扫描。\\n\\n网页参考资料：\\n自发货打包发货指引：https://global-selling.mercadolibre.com/help/42016\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-26 17:43:10\",\"用户\":\"大大大明\",\"群\":\"\",\"用户问询\":\"这样的面单会模糊吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n从图片看，面单条码和文字清晰。为避免模糊，请注意：\\n1. 使用10*15cm热敏纸打印。\\n2. 勿在热敏纸上粘贴透明胶带，否则会使字迹消失。\\n3. 避免面单褶皱、残缺或被国内快递单覆盖。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-26 13:52:43\",\"用户\":\"努力奔跑。\",\"群\":\"\",\"用户问询\":\"新面单怎么查物流轨迹\",\"AI响应\":\"线上物流面单打印后，平台会自动提供物流跟踪信息给买家和卖家。货件由物流承运商扫描后，系统会自动回传Tracking ID。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-24 09:20:16\",\"用户\":\"泰戈\",\"群\":\"\",\"用户问询\":\"自发货阿根廷站点上了几百个品，但是很长时间都一单都没出，这对于店铺有什么影响？ 店铺长时间不出单，对店铺有什么影响？\",\"AI响应\":\"卖家您好，长时间不出单一共会对店铺产生以下几方面影响：  \\n\\n1. **店铺权重下降**：系统会认为这类商品缺乏市场竞争力，从而减少对店铺的流量抓取频率。没有持续出单的话, 店铺整体曝光会逐渐降低，新商品也难以获得初始流量扶持。  \\n2. **信誉等级受影响**：美客多的信誉等级依赖真实交易数据，长时间零成交可能导致店铺信誉无法达到“绿色”标准（尤其是新店铺）。一旦信誉等级不佳，会直接削减自然流量，买家也可能因看不到销量而犹豫下单——形成“没销量→没流量→更没销量”的恶性循环。  \\n   \\n3. **广告权限受限**：虽然自发货广告门槛较低（注册满期+账号健康即可），但长时间不出单会让账户处于“低活跃状态”——即使开通广告,算法也可能因缺乏订单数据而难以精准投放，导致推广效果差、投入产出比低。  \\n\\n4. **商品搜索排名靠后**：系统会优先推荐有动销记录的商品。几百个品中若多数长期零出单，这些商品会被判定为“滞销品”，在搜索结果中排名靠后甚至隐藏，进一步加剧无人问津现状。  \\n\\n建议您优先聚焦核心商品做优化（比如精简SKU、优化Listing标题/图片、开广告测试爆款），避免盲目铺品却缺乏运营动作。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-22 12:01:59\",\"用户\":\"Xiyunfei05\",\"群\":\"\",\"用户问询\":\"包装要求需要透明包装么\",\"AI响应\":\"是的，所有产品都必须使用半透明包装，且包装需完全覆盖产品，以确保产品在储存期间得到妥善保护。同时，包装外部需标注通用代码或可见的产品标签。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-21 18:04:12\",\"用户\":\"奔跑\",\"群\":\"\",\"用户问询\":\"是要打印面单送到那个仓库？\",\"AI响应\":\"你好！自发货模式下，您需要将商品打包并贴上物流面单，在3个工作日内发送至美客多指定的国内物流集运仓即可。点击后台Print label即可打印面单。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-21 15:25:41\",\"用户\":\"yixiR\",\"群\":\"\",\"用户问询\":\"你好，想了解一下，美客多自发货这边有些定制品，墨西哥站他能够设置预售吗？在哪里设置？或者那个制作时长需要延长的话是在哪里设置\",\"AI响应\":\"你好！很高兴为你解答。美客多自发货模式目前不支持设置预售，也无法延长制作时长。定制产品必须满足在72小时内发送到国内集运中心的要求。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-20 20:58:52\",\"用户\":\"张锦程\",\"群\":\"\",\"用户问询\":\"然后之前在跨境平台并没有那个流水，那我想做那个全托管模式，是不是想就是发货是在我这里发的那个模式？是怎么怎么弄？\",\"AI响应\":\"你好！全托管模式要求提供跨境电商单店年流水大于30万美金的证明。该模式下，您只需负责供货，将货物发至平台指定的国内集货仓（东莞仓），后续的运营、定价、国际物流及售后均由平台负责。\\n\\n若您没有相关流水，建议先通过自注册尝试普通自发货或海外仓模式，这类模式目前不需要流水。\\n\\n普通自发货/海外仓自注册链接：https://global-selling.mercadolibre.com/landing/about\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-20 11:02:55\",\"用户\":\"扣泥几蛙\",\"群\":\"\",\"用户问询\":\"是系统还没有推送面单吗\",\"AI响应\":\"面单通常是在您点击“Print label”时由系统实时生成的，不存在“系统未推送”的情况。\\n\\n如果司机反馈查不到面单号，通常是以下原因导致的：\\n\\n1. **数据同步延迟**：面单生成后，数据同步到菜鸟司机的揽收系统可能存在短暂延迟。建议您在打印面单后，给系统预留一定的同步时间。\\n\\n2. **面单信息不匹配**：请确认您打印的是否为最新的面单。如果您对订单进行了拆分或重新操作，旧的面单会失效，必须使用最新生成的面单。\\n\\n3. **物流商设置问题**：请检查后台 Selling Preferences → Dispatch Methods，确认物流商已正确选择为菜鸟。如果设置为空或不正确，生成的面单可能无法被菜鸟系统识别。\\n\\n4. **条码扫描问题**：如果面单打印不清晰、条码被胶带覆盖或有褶皱，司机的扫描枪可能无法读取数据，从而提示“查不到”。\\n\\n**处理建议：**\\n如果司机现场无法扫描，请不要强行交货。您可以尝试重新打印一张清晰的面单。若依然无法扫描，为避免超过48小时的考核时效，请立即通过快递自寄（Drop Off）方式将包裹发往菜鸟扫码仓。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-25 18:07:01\",\"用户\":\"平安喜乐\",\"群\":\"\",\"用户问询\":\"包装有要求吗\",\"AI响应\":\"你好！平台对产品包装是有明确要求的，主要分为尺寸限制和通用包装规范：\\n\\n**1. 全托管/海外仓商品包装尺寸要求：**\\n商品包装后的尺寸不能超过以下限制：\\n- 长度：不超过 60 厘米\\n- 宽度：不超过 40 厘米\\n- 高度：不超过 35 厘米\\n- 三边之和：不超过 135 厘米\\n\\n**2. 供货与体积要求：**\\n- 包装后体积建议 ≤ 0.03m³，这样更适合空运。\\n- 结构要简单，尽量选择标准化程度高、售后率低的产品。\\n\\n**3. 通用包装指引：**\\n- **内层保护**：针对你经营的花盆类易碎或小件商品，必须使用气泡膜、填充材料包裹，防止运输途中碰撞损坏。\\n- **外层包装**：需使用硬质纸盒或合适的包装袋，并用胶带彻底密封。\\n- **标签粘贴**：物流面单需完整粘贴在平整面上，不能覆盖条形码，也不能有折叠。\\n\\n**4. 运费计费相关：**\\n- 建议优化包装使重量保持在 300g 以下，这样运费会更便宜。\\n- 如果重量超过 300g，平台将按照体积重计费。\\n\\n**网页参考资料：**\\nMELI通用包装指引：https://doc.weixin.qq.com/pdf/d3_ARIAagYiAMICNwMaUzHcfT4G95q2a?scode=AI8A3wfvAAoFDTGehz\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-24 09:18:23\",\"用户\":\"蓝天白云\",\"群\":\"时骏科技-美客多助手\",\"用户问询\":\"@美客多小助手萝拉 广东的收货点就只有东莞沙田，没有深圳沙井这个点，为什么发货单会给我生成到沙井这个点\",\"AI响应\":\"你好！非常抱歉给您带来困扰。这种情况可能是系统在生成面单时出现了自动分配错误，或者您的后台设置与面单生成逻辑存在冲突。  \\n\\n### 建议您优先尝试以下操作：  \\n1. **重新生成物流面单**  \\n   请前往美客多后台的「订单管理」→「物流设置」，找到对应订单的物流信息，点击「重新生成面单」。系统会根据您后台设置的“东莞沙田三号枢纽分拨”地址重新生成面单，确保地址与仓库一致。  \\n\\n2. **核查系统自动分配规则**  \\n   若重新生成后仍显示沙井地址，可能是系统误判了您的订单类型（例如将“菜鸟直发仓”与“美客多托管仓”混淆）。此时请联系美客多客服（通过后台「Merchant Service Center」），提供以下信息：  \\n   - 后台设置截图（显示“东莞沙田三号枢纽分拨”）  \\n   - 错误面单截图（显示沙井地址）  \\n   技术团队会协助核查系统分配逻辑，修正错误。  \\n\\n3. **以实际仓库为准**  \\n   根据美客多官方托管仓规则，所有托管备货仓均统一为 **东莞沙田镇进港南路周大福物流中心205号库台**（与您后台设置一致）。若面单地址与该地址不符，建议优先将包裹送至东莞沙田仓库，避免因地址混淆导致延误。  \\n\\n请尽快处理，如有其他疑问可随时反馈~\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-22 16:22:40\",\"用户\":\"楠故\",\"群\":\"\",\"用户问询\":\"若急需发货，可按“卖家自寄”方式处理，先行将包裹送至菜鸟扫码仓以保证时效。是否后台也需要改为卖家自寄方式？\",\"AI响应\":\"你好！很高兴为你解答。不需要在后台修改发货方式。即便后台设置的是 Pickup，你也可以直接将包裹自寄或送往菜鸟指定的 Drop-off 站点，物流商扫描入库后系统会自动更新状态。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-21 15:25:04\",\"用户\":\"yixiR\",\"群\":\"\",\"用户问询\":\"美客多自发货这边有些定制品，墨西哥站他能够设置预售吗？在哪里设置？或者那个制作时长需要延长的话是在哪里设置\",\"AI响应\":\"可以做定制品，但必须满足72小时内发送到国内集运中心的时效要求。目前美客多自发货模式不支持设置预售或延长制作时长。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-21 00:02:01\",\"用户\":\"水果🍉\",\"群\":\"\",\"用户问询\":\"两个店都出单的情况下，两个店的订单可以都打在一个打大包裹上吗，然后让仓库去拆开打包，还是要区分出来\",\"AI响应\":\"必须区分开。不同店铺的订单不能混装在一个大包裹内让仓库拆分，每个店铺的包裹必须独立打包并粘贴对应的物流面单，确保各自扫码上网。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-21 19:13:39\",\"用户\":\"wong\",\"群\":\"\",\"用户问询\":\"目前巴西站仅支持自发货模式，暂不支持跨境海外仓，这是什么意思，巴西站能不能开半托管吗\",\"AI响应\":\"你的问题我暂时无法回答，后续我会丰富我的知识库，敬请见谅。目前巴西跨境店仅支持国内小包自发货模式，无法使用巴西海外仓。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-21 18:50:01\",\"用户\":\"wong\",\"群\":\"\",\"用户问询\":\"全托管/半托管，自发货，这两种模式，商家有哪些成本和需要承担哪些环节，是否存在扣款罚款？\",\"AI响应\":\"全托管模式：\\n1. 商家成本：产品成本、国内发往东莞仓的运费。\\n2. 商家环节：仅负责供货至国内集货仓。\\n3. 优势：0佣金、0国际运费、0广告费、0仓储费。\\n\\n半托管模式：\\n1. 商家成本：产品成本、国内发往东莞仓运费、8%佣金（享折扣）。\\n2. 商家环节：自主定价、店铺运营、备货至国内仓。\\n3. 定价：收益价格模式，平台自动叠加佣金和国际运费。\\n\\n自发货模式：\\n1. 商家成本：产品成本、国际运费、平台佣金。\\n2. 商家环节：自主运营、48小时内发货至菜鸟仓。\\n\\n关于罚款：平台通常不设直接罚款，但若发货超时、取消订单或违规，会扣除店铺声誉分，导致流量降权或封号。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题 26-07-24 10:30:03\",\"用户\":\"Jayan\",\"群\":\"\",\"用户问询\":\"你是本人吗？还是机器人啊 我的新店铺上传了RFC文件，系统驳回了我的文件，提示不完整或者无效 我的RFC文件是主体一致的离岸税号 为什么会出现这个问题呢\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n我是美客多跨境小助手，专门为你解答平台运营中的各类问题。\\n\\n关于你提到的新店铺上传RFC文件被驳回的情况，如果你的RFC是主体一致的离岸税号，建议你从以下几个方面自查文件是否符合要求：\\n\\n1. 文件完整性：请确保上传的是完整的CSF（Constancia de Situación Fiscal）文件，不要有遮挡或缺失页面。\\n2. 信息准确性：核对文件上的RFC税号、主体名称是否与卖家后台填写的信息完全一致，包括大小写和特殊字符。\\n3. 文件有效期：确保CSF文件是近期下载的，建议使用最近一个月内生成的版本，以保证税务状态是最新的。\\n4. 格式要求：请按照后台要求的格式（通常为PDF）进行上传，确保文件清晰可辨。\\n\\n如果确认以上信息均无误但仍被驳回，建议你联系后台客服或你的客户经理进一步核实具体的驳回原因。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-20 11:57:20\",\"用户\":\"Xiyunfei05\",\"群\":\"\",\"用户问询\":\"我需要手动停止上传现审核中的墨西哥RFC税号 店**公司名：深**有限公司 店铺ID：2351458357 旧税号：FCO250811AA2\",\"AI响应\":\"目前无法直接判断具体原因。建议您优先核查卖家后台是否有撤回或修改申请的选项。若后台无法操作，建议联系您的客户经理或通过后台工单系统说明情况，由平台工作人员协助处理。\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-22 16:38:10\",\"用户\":\"杨莉\",\"群\":\"\",\"用户问询\":\"{\\\"subMsgDesc\\\":\\\"\\\",\\\"subMsgList\\\":[{\\\"subMsgSenderId\\\":\\\"0\\\",\\\"subMsgSenderCorpId\\\":0,\\\"subMsgId\\\":\\\"\\\",\\\"subMsgType\\\":14,\\\"subMsgSenderAvatar\\\":\\\"\\\",\\\"subMsgSenderName\\\":\\\"\\\",\\\"subMsgSenderCorpName\\\":\\\"\\\",\\\"subMsgFromId\\\":\\\"0\\\",\\\"subMsgData\\\":{\\\"filename\\\":\\\"企业微信截图_17847094764652.png\\\",\\\"fileAesKey\\\":\\\"0de02cfedbe401f270b8bf31b0d4734a\\\",\\\"fileSize\\\":93276,\\\"width\\\":1082,\\\"fileMd5\\\":\\\"408273abc1304281f9e6f57dffabc598\\\",\\\"fileId\\\":\\\"306b0201020464306202010002048291518902030f4df90204710f607102046a608170042463386139343334352d393263642d346463642d393936392d31643737633736663365343202031038000203016c600410408273abc1304281f9e6f57dffabc5980****0400\\\",\\\"height\\\":931,\\\"imageHasHd\\\":true},\\\"subMsgTimestamp\\\":0},{\\\"subMsgSenderId\\\":\\\"0\\\",\\\"subMsgSenderCorpId\\\":0,\\\"subMsgId\\\":\\\"\\\",\\\"subMsgType\\\ ，在 CSF 邮箱签署授权完成后，你的卖家注册邮箱会即刻收到一封提示邮件，确认所有相关文件已成功签署完成。这是验证完成的标志。\\n\\n如果签署已经完成，建议你耐心等待系统同步状态。若长时间状态没有更新，请确保你签署时使用的邮箱是此前提交 CSF 文件时登记的那个邮箱，因为只有通过 CSF 登记邮箱完成签署，授权路径才会被认定为清晰、合规。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-22 16:25:36\",\"用户\":\"侯顺莲\",\"群\":\"\",\"用户问询\":\"您好！我的full仓店铺需要更换RFC税号，请协助打开填报资料入口，谢谢\",\"AI响应\":\"你好！很高兴为你解答。如果需要变更RFC，请及时在卖家后台提交变更申请，并提供新的RFC及对应的CSF文件。请确保该新RFC对应的CSF邮箱有效，以便接受并配合后续的验证信息。\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-22 11:36:50\",\"用户\":\"彬\",\"群\":\"\",\"用户问询\":\"现在已经过了7月20号上传墨西哥RFC税号，后面再上传会减少税收吗\",\"AI响应\":\"你好！很高兴为你解答。可以的。若未能按时上传，平台会按36%税率预扣。后续上传有效RFC税号后，平台将根据您的税号类型及收款账户性质，按对应的新税率执行预扣。\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-22 11:03:11\",\"用户\":\"Ho!\",\"群\":\"\",\"用户问询\":\"另外，现在店铺里面显示 RFC number for Mexico Full is being verified，应该如何重启认证流程？ CSF邮箱查询信息登记表在哪里\",\"AI响应\":\"你好！很高兴为你解答。请准确填写【CSF邮箱查询信息登记表】：https://28151754.beschannels-plus.com/forms/6WU4ZMJ 查询结果将在2个工作日内，通过邮件发送至您提供的店铺注册邮箱。\\n\\n若需重启流程，请确保绑定的RFC信息能通过一致性验证。若确认无法通过，请先前往卖家后台更新RFC信息，等待系统触发新的验证邮件。\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-20 10:40:00\",\"用户\":\"宥昕\",\"群\":\"\",\"用户问询\":\"我们是已经注册店铺在运营了，请问下店铺能变更主体么，RFC税号需要更换\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n美**公司主体的。已经注册好的店铺不能更换营业执照，如**公司主体且没有注册过美客多，可以用新的邮箱重新登记注册，法**公司一致。\\n\\n关于RFC税号的更换，如果需要变更RFC，请及时在后台提交变更申请，并提供新的RFC及对应的CSF文件。在操作时，请务必确保该新RFC对应的CSF邮箱有效且能够正常接收邮件，以便配合后续的验证信息。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-23 18:43:32\",\"用户\":\"navy\",\"群\":\"\",\"用户问询\":\"你好，我有2个店铺都有收到平台发的验证RFC通过的邮件，但是现在的税费是30+%的税点 可以帮我看一下是怎么回事吗 香港漫为ID：3095751253\",\"AI响应\":\"根据您描述的情况，两个店铺虽收到Rfc验正通过的邮件，但税费仍较高，可能存在以下原因及解决建议：\\n\\n### 可能原因分析\\n1. **RF C税号类型与收账户匹配异常**  \\n   根据墨西哥税务政策规定，不同Rfc类型搭配不同收账户会产生差异费率  \\n   - 境外RF C税号+境内收账户 → **16%**  \\n   - **境内RF C** +境内收账户 → **最低**10.5%(需核对是否符合本地资质)  \\n   - 如您实际采用**境外RF C+境外收账户**，则应为**16%** 而非30%+  \\n\\n2. **CSF邮箱有效性校验未生效**  \\n   即使收到验证通过通知，但如果CSF邮箱填写错误或未完成最终签署，系统可能仍按未验证状态处理。  \\n\\n### 需要您确认的信息\\n- 您当前绑定的**RF C所属主体**（个人/企业）  \\n- 收款账户类型（境内本地银行/第三方收款/境外账户）  \\n- 店铺后台“税务设置”页面显示的**具体费率明细**  \\n\\n### 查询路径\\n1. 登录卖家后台 → 进入【店铺设置】→【税务信息】查看当前税率计算逻辑  \\n2. 核对RF C税号码是否与**注册主体一致**（需匹配营业执照法人信息）  \\n\\n### 补充说明 \\n如发现费率异常，建议优先联系您的招商经理或通过后台【帮助中心】提交工单，提供店铺ID（395751253所在行）进一步核查。  \\n\\n关于墨西哥RF C税号码的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-22 20:34:26\",\"用户\":\"Daytoy\",\"群\":\"\",\"用户问询\":\"你好，请问下RFC税号被移除是因为验证邮箱不一致吗？\",\"AI响应\":\"目前无法直接判断具体原因。建议优先核查是否在7月20日前通过CSF登记邮箱完成了授权书签署。若填写了错误的CSF邮箱或未按时完成一致性验证，可能导致验证失败，进而影响税号状态。\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-24 00:28:23\",\"用户\":\"Maloney  W\",\"群\":\"\",\"用户问询\":\"如何查询美客多后台绑定的RFC税号和CSF邮箱\",\"AI响应\":\"登录卖家后台核实绑定的RFC税号，CSF邮箱查询需填写【CSF邮箱查询信息登记表】：https://28151754.beschannels-plus.com/forms/6WU4ZMJ，结果将在2个工作日内通过邮件发送至店铺注册邮箱。\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-23 16:17:41\",\"用户\":\"Maloney  W\",\"群\":\"\",\"用户问询\":\"如何核实店铺的RFC税号已完成验证\",\"AI响应\":\"请查看卖家注册邮箱是否收到提示邮件，确认所有文件已签署；同时留意卖家后台审核状态是否更新为“已完成”。\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-22 17:20:31\",\"用户\":\"Jasmine\",\"群\":\"\",\"用户问询\":\"跨境店一定要墨西哥的RFC税号吗\",\"AI响应\":\"关于墨西哥RFC税号的要求，主要取决于您选择的业务模式：\\n\\n如果您选择的是自发货模式，目前不涉及墨西哥36%的增值税代扣，您可以先激活店铺跑自发货，不需要绑定RFC税号。\\n\\n如果您选择的是海外仓模式（Full仓），建议您办理RFC税号。虽然RFC税号不是强制入驻的要求，但如果没有税号，平台将依法对您的墨西哥销售额按36%的税率实施强制预扣税（16%增值税 + 20%所得税）。对于跨境卖家，强烈建议选择离岸税号，其合规性与账户安全性最高。\\n\\n如果您使用美国转运仓配送墨西哥，则不需要提供RFC。因为这种模式属于跨境直邮而非本土发货，相应的进口税费由买家在下单时承担。\\n\\n如果您选择的是半托管模式，不需要RFC税号，平台也不会对半托管卖家进行36%的增值税和所得税代扣。\\n\\n网页参考资料\\nhttps://mp.weixin.qq.com/s/gLZ3iC9XLqFE4j075JaNSg\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-22 11:32:09\",\"用户\":\"彬\",\"群\":\"\",\"用户问询\":\"这种模型需要办理墨西哥RFC税号吗\",\"AI响应\":\"你好！很高兴为你解答。半托管模式不需要办理墨西哥RFC税号，平台也不会对半托管卖家进行36%的增值税和所得税代扣。\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-22 11:12:19\",\"用户\":\"Ho!\",\"群\":\"\",\"用户问询\":\"现在店铺里面显示 RFC number for Mexico Full is being verified，应该如何重启认证流程？\",\"AI响应\":\"如果重新认证流程失败，系统将要求卖家重试该流程。请务必先确认当前绑定的RFC信息能通过一致性验证，若无法通过，请前往卖家后台更新RFC信息，并等待系统触发新的验证邮件。\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-22 09:19:06\",\"用户\":\"彬\",\"群\":\"\",\"用户问询\":\"墨西哥RFC税号有推荐的服务商吗，价格多少\",\"AI响应\":\"你可以通过美客多官网的服务商列表查看并参考相关服务商。关于RFC税号的具体办理价格，需要你直接咨询市场销售端，建议从正规渠道获取以避免合规风险。\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-21 08:47:23\",\"用户\":\"hey\",\"群\":\"\",\"用户问询\":\"美客多税号审核能加速吗 RFC税号\",\"AI响应\":\"你好！很高兴为你解答。提交邮箱后即为您开通KYC审核绿色通道，通常3-5个工作日给反馈，请留意卖家后台审核状态的变化。但是加速审核只有一次机会，请谨慎提交！\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-20 13:52:12\",\"用户\":\"Felicity 103%\",\"群\":\"\",\"用户问询\":\"手动停止上传现审核中的墨西哥RFC税号\",\"AI响应\":\"你好！很高兴为你解答。目前无法手动终止正在进行的RFC审核。若需更改，请直接在卖家后台提交新的RFC及对应的CSF文件，系统会根据新提交的信息重新触发验证流程。\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-26 16:07:22\",\"用户\":\"💪\",\"群\":\"\",\"用户问询\":\"RFC税号怎么上传\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n请前往卖家后台更新RFC信息，并等待系统触发新的验证邮件。\\n\\n在进行RFC税号主体授权及一致性验证前，请务必先确认您当前绑定的RFC信息能通过一致性验证。若确认无法通过，请切勿开启验证流程，应先前往卖家后台更新RFC信息，并等待系统触发新的验证邮件。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-23 14:26:37\",\"用户\":\"Felicity 103%\",\"群\":\"\",\"用户问询\":\"rfc税号可以更换吗\",\"AI响应\":\"你好！很高兴为你解答。RFC税号可以更换，登录美客多商户后台，点击设置中的“销售偏好”，或通过链接https://global-selling.mercadolibre.com/kyc/?initiative=cbt-fiscal-upgrade\\u0026congrats=true\\u0026landing=true 直接提交更换申请即可。\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-22 17:10:39\",\"用户\":\"Manda\",\"群\":\"\",\"用户问询\":\"怎么办理墨西哥RFC税号？\",\"AI响应\":\"你好！很高兴为你解答。关于墨西哥RFC税号的办理，您可以联系专业的税务服务商进行办理。RFC是由墨西哥税务机关 SAT分配的唯一12位字母数字识别码。对于跨境卖家，强烈建议选择与注册主体一致的离岸税号，其合规性与账户安全性最高。如果您是自发货卖家，暂时不做墨西哥RFC税号的强制要求。但如果您使用墨西哥海外仓，建议您提前评估并准备。\\n\\n网页参考资料：\\nRFC提交指引：https://doc.weixin.qq.com/pdf/d3_AfYAYgZCAGgKWsXU04xQce3N7RC12?scode=AI8A3wfvAAouqPnVrtAfYAYgZCAGg\\u0026amp;isFromNewImportWithExcel=1\\n税务合规渠道SPN：https://mercadolibre.cn/melispn\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-21 15:50:37\",\"用户\":\"王雪云\",\"群\":\"\",\"用户问询\":\"文件的主体跟后台不一样的，但是主体是授权给后台的RFC，那要怎么处理？ 我用本土的RFC上传到跨境店。并签名授权的。\",\"AI响应\":\"你好！如果RFC主体与店铺主体不一致，需要完成一致性验证。请确保你此前提交CSF文件时登记的邮箱有效，平台会向该邮箱发送官方通告邮件。你需通过该邮件登录并签署《RFC知情授权书》，确认RFC所有人已正式授权该税号用于你的跨境店铺。\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-20 18:09:32\",\"用户\":\"巴鲨Aaron\",\"群\":\"\",\"用户问询\":\"现在20号还能上传RFC税号吗\",\"AI响应\":\"您好，很高兴为您解答。\\n\\n关于墨西哥跨境店铺RFC税号有效性验证，平台要求的截止日期确实是7月20日。\\n\\n如果您是需要上传或更新RFC税号，建议您立即登录卖家后台尝试操作。若后台相关入口仍处于开启状态，请尽快完成提交。\\n\\n请注意，如果您未能在此日期前完成验证，自7月20日之后，根据墨西哥税务法规要求，店铺的预扣税率将被依法上调至36%。为了避免影响业务的正常运营，请您务必密切关注此前提交CSF文件时登记的邮箱，并按照指引完成相关操作。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-26 11:29:49\",\"用户\":\"睡个好觉\",\"群\":\"\",\"用户问询\":\"之前上传新的税号，授权了，但是后台一直显示待处理，重新上传税号很快又被驳回，麻烦帮忙加急处理一下可以吗\",\"AI响应\":\"你好！关于KYC审核加急，提交邮箱后即为你开通KYC审核绿色通道，通常3-5个工作日会给反馈，请留意卖家后台审核状态的变化。但加速审核只有一次机会，请谨慎提交！\\n\\n请把你用于店铺注册的邮箱发给我，我这边帮你登记开通绿色通道。\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-23 18:56:56\",\"用户\":\"Butter\",\"群\":\"\",\"用户问询\":\"你好，请问那个税号授权没通过认证的话，后面也没有收到重新授权的信息了，我要怎么做才会重新收到信息呢\",\"AI响应\":\"你好！很高兴帮你解答。如果税号授权认证未通过且未收到重新授权信息，你可以按以下步骤处理：  \\n\\n1. **检查邮箱 。\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-20 15:14:17\",\"用户\":\"Butter\",\"群\":\"\",\"用户问询\":\"你好，请问为什么我已经上传了和店铺主体一致的税号也审核通过了，为什么现在邮件还会收到需要授权的文件的\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n这主要是因为平台近期正在开展 RFC 税号主体授权及一致性验证工作。即使你的税号主体与店铺主体一致且已审核通过，如果属于以下情况，仍会收到邮件：\\n\\n1. 官方统一核验：为了确保所有海外仓卖家的税务合规性，平台会分批次向卖家发送验证通告，要求通过法律程序正式确认授权关系。\\n2. 签署知情授权书：这是为了确认 RFC 所有人（Owner）已充分知晓并正式授权该税号用于你的跨境店铺。\\n\\n卖家行动建议：\\n请务必及时查看邮件，使用你此前提交 CSF 文件时登记的邮箱，登录并按照邮件指引签署《RFC 知情授权书》。\\n\\n请注意，如果你未在规定时间内（如7月20日前）完成此项验证，平台可能会遵从墨西哥税务法规要求，将相关账户的预扣税率上调至 36%。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-22 16:16:09\",\"用户\":\"***里\",\"群\":\"\",\"用户问询\":\"我的店铺没有RFC换绑入口，没有招商经理联系方式，怎样可以联系到自己店的招商经理\",\"AI响应\":\"自注册账号默认无客户经理。若需对接，您需主动填写官方客户经理申请表等待匹配，或通过提升销售业绩触发系统自动分配。日常问题请通过后台右上角问号图标联系在线客服。\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-21 19:08:56\",\"用户\":\"wong\",\"群\":\"\",\"用户问询\":\"结算时效是怎样，是不是以人民币结算 全托管/半托管，一般如何备货 开店需要巴西税号吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n1. 结算时效：全托管妥投7日即回款；普通跨境店通常每两周结算一次。结算以美金计入您的收款账户（如Payoneer），您可以自行结汇成人民币。\\n\\n2. 备货方式：全托管是先核价，平台下发PO单后您再备货至国内仓；半托管无需核价，您直接在后台上架并备货至国内仓即可。\\n\\n3. 巴西税号：跨境卖家入驻巴西站不需要提供巴西税号（RFC是墨西哥站点的税号要求）。\\n\\n温馨提示：目前巴西站仅支持自发货模式，暂不支持跨境海外仓。\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-20 11:03:22\",\"用户\":\"Fabulous Jane\",\"群\":\"\",\"用户问询\":\"不需要卖家申请税号，且目前没有满足流水大于30万美金，是不是只能选择自发货里的第一栏自发货？\",\"AI响应\":\"你好！很高兴为你解答。目前政策已更新，自发货和海外仓模式入驻均不再要求提供流水，且自发货模式不需要税号。若您没有流水且暂无税号，可以选择自发货模式，也可以选择海外仓模式（后续运营Full模式才需RFC）。\\n\\n普通自发货/海外仓也可选择自注册（PC端登入）：https://global-selling.mercadolibre.com/landing/about\\n\\n入驻准备材料：\\n1. 公司营业执照（大陆或香港）\\n2. 法人身份证（需人脸识别）\\n3. 美金或第三方收款账户\\n4. 联系方式（建议使用Gmail、Outlook等）\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-25 22:08:22\",\"用户\":\"Liam\",\"群\":\"\",\"用户问询\":\"你好 RFC编号怎么办理 有快速通道吗 官方看显示是需要3-4个月这么久吗\",\"AI响应\":\" 38\",\"用户\":\"阿斌-Bingo\",\"群\":\"\",\"用户问询\":\"经理，我的店铺一直在审核中很久了不知道怎么重新上传RFC.\",\"AI响应\":\"资料显示审核中属于近期普遍现象。自发货或海外仓审核时效通常为7到10天，品牌审核周期为2到4周，半托管或全托管入驻审核预计需要20到30个工作日。建议你每日检查后台系统状态更新及注册邮箱的通知邮件。若等待时间已超过20个工作日仍未更新，可以联系官方客服进一步查询。\\n\\n关于重新上传或更新RFC，如果确认当前绑定的信息无法通过一致性验证，请先前往卖家后台更新RFC信息，并等待系统触发新的验证邮件。\\n\\nRFC验证流程如下：\\n第一步，您的卖家注册邮箱会收到第一封RFC授权信，请点击并完成签署。\\n第二步，签署后，您的卖家注册邮箱会即刻收到第二封邮件，用于向您核实并确认您的CSF邮箱信息。\\n第三步，确认成功后，您的CSF邮箱将会收到对应的授权信，请登录该邮箱点击并完成签署。\\n第四步，CSF邮箱签署授权完成后，您的卖家注册邮箱即刻将会收到一封提示邮件，确认所有相关文件已成功签署完成。\\n\\n重要提醒：收到验证邮件后，请务必先确认您当前绑定的RFC信息能通过一致性验证。若在验证过程中填写了错误的CSF邮箱，将可能导致您的RFC无法通过验证，届时您的店铺税率将依照规定上调至36%。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-24 12:20:46\",\"用户\":\"J·Alex\",\"群\":\"\",\"用户问询\":\"发往墨西哥FULL仓的货物，没有RFC会被拒收吗\",\"AI响应\":\"_thought\\n你好！很高兴为你解答。发往墨西哥FULL仓的货物，如果没有RFC税号不会被拒收。卖家可以先激活店铺跑自发货，待转Full仓时再绑定RFC。\\n\\n需要注意的是，如果做美客多墨西哥官方海外仓模式，虽然可以入库，但若无税号将面临最高36%的代扣税（16%增值税 + 20%所得税）。如果暂时还没有RFC税号，可以先绑定美金账号，再绑定墨西哥本土银行账号，平台暂时不会代扣代缴，等申请到税号后再绑定即可。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-23 14:21:31\",\"用户\":\"Felicity 103%\",\"群\":\"\",\"用户问询\":\"墨西哥那边的没有税号那他的税收占比会去到36个点吗\",\"AI响应\":\"根据墨西哥税务新规，若您的销售模式属于海外仓、本土履约（含跨境店Full仓/三方仓）等本土发货场景，未上传有效RFC税号会被强制代扣36%税费（16%增值税+20%所得税）；自发货、全托管或美国转运仓（跨境直邮）模式无需税号，不会被代扣。\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"}]},{\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"Past 7 Days\":282,\"Previous 2026-07-13 to 2026-07-19\":41,\"Change\":241,\"WoW\":5.878048780487805,\"Past 7 Share\":0.03967918953144787,\"高频问题\":\"促销/折扣/优惠券/活动\",\"__details\":[{\"时间\":\"2026-07-25 10:29:39\",\"用户\":\"李玲娅\",\"群\":\"\",\"用户问询\":\"{\\\"subMsgDesc\\\":\\\"\\\",\\\"subMsgList\\\":[{\\\"subMsgSenderId\\\":\\\"0\\\",\\\"subMsgSenderCorpId\\\":0,\\\"subMsgId\\\":\\\"\\\",\\\"subMsgType\\\":14,\\\"subMsgSenderAvatar\\\":\\\"\\\",\\\"subMsg  关于为什么没看到 Hot Sale 或 Buen Fin 等大促活动**\\n\\n*   **时间未到**：Hot Sale（通常在5月）和 Buen Fin（墨西哥双十一，通常在11月）是年度固定的大型促销节点。如果当前不在这些大促的招商期内，后台是不会显示这些选项的。\\n*   **受邀机制**：这类全平台大促通常有严格的提报窗口。作为新晋的 MercadoLeader，你需要密切关注后台 **“Promotions”** 板块。当大促临近时，系统会根据你的店铺表现（信誉、销量、库存）定向发放邀请。\\n*   **当前活动性质**：你看到的 **Clearance Jul 2026** 其实就是平台针对7月份发起的清仓/季节性促销。虽然名字不叫 Hot Sale，但它在流量入口和展示逻辑上是类似的。\\n\\n**2. 关于广告打法：除了预算和 ROAS，还能怎么玩？**\\n\\n美客多的广告系统（Product Ads）确实相对简化，主要靠算法自动匹配，但作为 MercadoLeader，你依然有进阶的操作空间：\\n\\n*   **分策略建组（核心打法）**：\\n    不要把所有产品放在一个广告组里。建议按产品生命周期分三组：\\n    *   **测试组**：针对新品，设置较低的 ROAS 目标（允许亏损），给系统空间去跑数据、找人群。\\n    *   **收割组**：针对你的爆款，设置较高的 ROAS 目标，确保每一分广告费都能换回利润。\\n    *   **清仓组**：针对滞销品，以低预算运行，配合后台的 Clearance 活动。\\n*   **利用“负面关键词”优化**：\\n    虽然不能像亚马逊那样精准选词，但你可以定期下载广告报告。如果发现某些关键词点击很多但不转化，可以在后台将其设为**负面关键词**，避免浪费预算。\\n*   **配合 Clips 短视频**：\\n    这是目前最有效的“场外打法”。为广告产品拍摄 Clips 视频，视频带来的自然流量会提升链接权重，从而降低广告的平均点击成本（CPC）。\\n*   **利用认证优势**：\\n    你现在是 MercadoLeader，你的广告位会带有勋章标识。在同等 ROAS 设置下，你的点击率（CTR）会比普通卖家高。建议在参加 **Lightning Deals（限时抢购）** 期间，临时调高该产品的广告预算，利用秒杀的高转化率来“冲”销量排名。\\n\\n**总结建议：**\\n目前你后台看到的活动已经非常丰富了，建议优先把 **Best Shared Offers** 和 **Lightning Deals** 跑透。广告方面，通过**“分组合、调 ROAS、加视频”**这三招，就能拉开你与普通卖家的差距。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-24 10:28:54\",\"用户\":\"纯属巧合\",\"群\":\"\",\"用户问询\":\"那比如说我现在后台参加显示抢购的价格是$5.32, boost your sales价格是$5.74, best shared offers $5.45, smart discounts $5.45. 如果是我现在4个活动都参加了， 我的曝光位置就多了这4个流量口。所有活动最终我成交价格是$5.32。 如果我只报了其中2个活动， 那么我的流量口只有2个，我活动的价格就是我报了这两个中的最低一个价，是吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n你的理解非常准确，就是这个逻辑。\\n\\n**1. 关于流量入口：**\\n是的。如果你四个活动都参加，你的产品就同时拿到了这四个活动对应的“入场券”。比如，你出现在了秒杀频道（LD）、搜索结果的加权位（Boost）、以及带有平台补贴标识的展示位（Best Shared Offers）。如果你只报两个，那么另外两个专属的展示位就不会出现你的产品。\\n\\n**2. 关于成交价格：**\\n没错。系统会自动识别你当前所有生效活动中的最低价。在你的例子中，如果你四个都报了，买家在任何一个入口看到并购买的价格都会是 $5.32。如果你只报了 $5.74 和 $5.45 的两个活动，那么成交价就是 $5.45。\\n\\n**3. 为什么建议“全选”：**\\n既然最终成交价都是 $5.32，多报那三个价格稍高（$5.74、$5.45）的活动，对你来说**并没有增加额外的折扣成本**，反而白白增加了三个流量入口。\\n\\n**特别提醒：**\\n在你的例子中，**Best Shared Offers** 的价格是 $5.45，虽然它不是最低的，但它可能有平台补贴。如果买家通过这个入口下单，虽然成交价是 $5.32，但平台可能会基于 $5.45 这个基准给你补贴，你实际到手的钱可能会比单纯做 $5.32 的 LD 还要多一点点。\\n\\n所以，只要最低的那个价格（$5.32）在你的利润承受范围内，把其他推荐的活动都点上是最优策略。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-24 10:17:54\",\"用户\":\"纯属巧合\",\"群\":\"\",\"用户问询\":\"所以就算全部活动都参加， 也只会显示折扣力度最大的那个。所以其实我只需要参加一个活动就可以了？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n虽然系统在前台通常只展示折扣力度最大的那个价格，但**并不代表你只需要参加一个活动**。原因如下：\\n\\n**1. 流量入口的互补性**\\n不同的活动对应不同的流量入口。例如：\\n- **限时抢购（Lightning Deals）**：会让你的产品出现在首页专门的“秒杀/特惠”频道，这是主动寻找折扣的买家最集中的地方。\\n- **Smart Discounts / Best Shared Offers**：更多是提升你在搜索结果页的自然排名和转化率。\\n如果你只参加一个，可能会错失另一个频道的专属流量。\\n\\n**2. 时间覆盖的连续性**\\n从你的截图可以看到，很多活动是有**有效期**的（比如限时抢购只持续几个小时或一天）。如果你只参加一个活动，活动结束后你的产品就会恢复原价，失去促销标签。通过参加多个活动，可以确保你的产品在不同时间段内都处于“促销状态”，保持流量的稳定性。\\n\\n**3. 平台补贴的红利**\\n像 **Best Shared Offers** 这种活动，平台会帮你承担一部分折扣成本（绿色字体）。这种“白给”的补贴建议一定要拿，这比你自己降价做其他活动要划算得多。\\n\\n**4. 算法权重的累加**\\n平台算法会监测链接的活跃度。如果你同时参加了多个活动，系统会认为该链接的营销意愿强、转化潜力大，从而在搜索权重上给予更多隐形支持。\\n\\n**总结建议：**\\n你不需要“盲目”参加所有活动，但建议采取**“组合拳”策略**：\\n- **必选**：有平台补贴的活动（如 Best Shared Offers）。\\n- **必选**：能覆盖你核心销售时段的限时抢购（Lightning Deals）。\\n- **可选**：如果利润允许，参加 Smart Discounts 作为日常保底，确保非秒杀时段也有促销标签。\\n\\n**操作核心**：只要“你将收到”的金额在你的利润覆盖范围内，多参加几个活动是为了**占领更多的流量入口**和**延长促销时长**，而不仅仅是为了那个最低价。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-24 10:21:11\",\"用户\":\"纯属巧合\",\"群\":\"\",\"用户问询\":\"你不是说活动只会展示优惠折扣力度最大的那个吗， 怎么又会有多个流量口呢\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n这确实是一个容易混淆的点，我来为你详细拆解一下：**“价格展示”和“流量入口”是两个不同的维度。**\\n\\n**1. 价格展示（买家看到的数字）：**\\n当一个产品同时参加多个活动时，为了避免买家困惑，系统在前台详情页确实只会显示**一个最终成交价**（通常是折扣力度最大的那个）。\\n\\n**2. 流量入口（买家从哪里找到你）：**\\n虽然价格只有一个，但你的产品会因为参加了不同的活动，同时出现在不同的“货架”上：\\n- **入口 A（秒杀频道）**：因为你参加了 **Lightning Deals**，你的产品会出现在首页的“今日特惠”专属页面。不进这个页面的买家看不到你。\\n- **入口 B（搜索结果页）**：因为你参加了 **Smart Discounts**，当买家搜索关键词时，你的产品排名会靠前，并带有绿色折扣标签。\\n- **入口 C（类目导航栏）**：部分大促活动会有专门的类目分会场。\\n\\n**打个比方：**\\n这就像一家超市，你的一款可乐既参加了**“收银台旁边的加价购”**（入口1），又参加了**“饮料区的限时特价”**（入口2）。\\n无论买家是从收银台看到它，还是在饮料区看到它，**最终买单的价格都是一样的**。但如果你只参加饮料区的活动，那么在收银台排队的买家就根本看不见你的产品。\\n\\n**总结：**\\n参加多个活动，本质上是**为了让你的产品在平台的各个角落“分身”**。虽然最终卖给买家的价格是那个最低价，但你获得的曝光机会是成倍增加的。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-22 12:42:21\",\"用户\":\"j、\",\"群\":\"\",\"用户问询\":\"你的意思是我尝试调高售价有新的促销活动再报名，不要一调价就马上报名是吗\",\"AI响应\":\"你好！很高兴为你解答。是的，因为促销活动的价格门槛通常以商品过去30天的历史售价为基准。如果你涨价后立即报名，系统可能会因为价格波动判定不符合折扣要求。建议涨价后观察一段时间，待价格稳定后再尝试报名新的活动。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-21 22:59:15\",\"用户\":\"波波波pewpewpew突突突\",\"群\":\"\",\"用户问询\":\"促销活动不能同时激活两个吗？比如百分比促销和购买第二个打折一起激活不可以吗\",\"AI响应\":\"平台对卖家自行组织的促销活动可能有一定的限制。建议卖家使用平台提供的促销工具或遵守相关规定，通常建议优先确保单个促销活动生效以避免冲突。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-26 15:42:40\",\"用户\":\"Daniel\",\"群\":\"\",\"用户问询\":\"官方活动带来的流量会比自己定制的促销活动更大吗？还是一样的？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n官方活动带来的流量通常会比卖家自己定制的促销活动**大得多**，主要原因如下：\\n\\n1. **专属流量入口**：官方大促（如 Black Friday, Hot Sale, Cyber Monday）或日常促销（如 DoD 每日交易、LD 秒杀）在美客多 App 和网页端都有专属的黄金展示位和流量入口，这是卖家自建促销无法获得的。\\n\\n2. **平台额外曝光**：参与官方活动的商品会获得专属的促销标签（如 Deal of the Day 标签），更容易吸引买家点击。同时，平台会投入大量的站外广告资源（如社交媒体、邮件营销）为这些活动引流。\\n\\n3. **权重提升**：官方活动通常有严格的准入门槛（如折扣力度、信誉等级），一旦入选，系统会给予更高的搜索权重排名。\\n\\n4. **转化率更高**：买家对官方组织的促销活动信任度更高，配合限时抢购的紧迫感，转化效果往往优于普通的店铺折扣。\\n\\n卖家自建的促销（如 Quantity Discount 组合促销）更多是作为店铺内部的转化工具，用于提升客单价或清理库存，在获取全平台海量新流量方面，官方活动具有绝对优势。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-23 13:20:04\",\"用户\":\"曲\",\"群\":\"\",\"用户问询\":\"数量折扣是在现有基础上叠加折扣吗，假设目前商品折扣50%off,我设置了同产品满5件10%，意思是同一订单买家购买5件可以获得60%off折扣？\",\"AI响应\":\"你好！根据美客多的规则，**数量折扣（Quantity Discount）与其他类型的优惠（如现有折扣、平台活动等)** 是**共存但无法叠加**的，即买家只能享受其中优惠力度更大者，而非两者相加。  \\n\\n### 具体到你的场景：  \\n假设商品原价100元，现有基础discount为50% off（即单价50元），同时设置了“满5件10%” 的数量折扣（属于“多件优惠 - Discount on all units”类型，表示5件总价享受10%折扣，即5件总价为100×5×(1-10%)=450元，平均每件90元？不对，这里需要重新计算：  \\n\\n哦不对，现有基础discount是50% off，即原单价100元，基础discount后的单价是50元。如果设置满五件件享额外discount for quantity，即“买5件，每件再减10%”（即5件总价 = (原单价×(基础discount)) ×5 ×(1-1%)？不对，原问题“满5件1o%”应该是指“5件套享10%折扣”，即5件套总价为50元/件 × (1-10%) ×5 = 225元，平均每件45元。  \\n\\n此时，买家购买5件时，**最终价格由“基础discount（50% off）”和“数量折扣（10% off）”中更低的那个决定**：  \\n- 仅基础discount → 5件总价：50×5 = 250元  \\n- 仅数量折扣 → 5件总价：50×(五件套折扣) ×5 = (假设五件折扣是10%，即50×5×0·9=225元)  \\n\\n显然，22·x元更低 → 买家会享受**数量折扣的10%优惠**，最终5件总价225元（平均每件45元）而非叠加为60% off（即50×5×(l - 60%)=200元？不对，这里可能混淆概念）。  \\n\\n### 核心结论：  \\n**不会叠加到60% off**，而是买家自动匹配更优惠的折扣（数量discount的10%会覆盖基础discount后的价格）。  \\n\\n### 参考规则：  \\n根据美客多“Quantity Discount”的FAQ：  \\n\\u003e 数量折扣能与其他优惠共存，但无法叠加。买家只能享受最终价格更低的那个优惠。  \\n\\n网页参考资料：  \\nhttps://global-selling.mercadolibre.com/help/37369  \\n\\n关于墨西哥RFC税号的相关信息，请查看文章 https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-22 14:26:17\",\"用户\":\"Eric Hsu\",\"群\":\"\",\"用户问询\":\"巴西的ceco-cbt-test促销活动，是什么活动\",\"AI响应\":\"你的问题我暂时无法回答，后续我会丰富我的知识库，敬请见谅。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-22 13:18:20\",\"用户\":\"aa~yoyo baby\",\"群\":\"\",\"用户问询\":\"电气机械和器材制造业(具体经营项目请登录国家企业信用信息公示系统查询，网址。依法须经批准的项目，经相关部门批准后方可开展经营活动。) 可以这样？\",\"AI响应\":\"不可以。系统提示仅允许中文字符，请删除括号、句号、逗号及“网址”二字，只保留“电气机械和器材制造业”等纯中文内容。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-24 17:04:25\",\"用户\":\"蓝七\",\"群\":\"\",\"用户问询\":\"但我参加了促销活动 我就得参考促销价来看？\",\"AI响应\":\"你好！很高兴为你解答。是的，包邮门槛是以折扣后的最终售价为准。如果折后价格低于站点的强制包邮门槛，运费将转由买家承担。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-24 10:22:37\",\"用户\":\"李玲娅\",\"群\":\"\",\"用户问询\":\"什么情况下促销活动会有超值优惠的标签\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n在美客多平台，促销活动出现“超值优惠”（或类似高权重折扣标签）通常需要满足以下核心条件：\\n\\n1. 折扣力度足够大：通常要求折扣力度至少在 5% 以上。如果折扣过低，系统可能不会赋予特殊的促销标签。\\n\\n2. 满足价格竞争力（Credibility Price）：促销价格必须低于该 Listing 过去 30 天内的最低成交价。如果提价后再打折，系统会识别并取消标签显示。\\n\\n3. 参与特定官方活动：\\n- 每日秒杀（DOTD）：这是权重最高的活动之一，通常会带有明显的促销标识。\\n- 平台大促：如 Hot Sale、Buen Fin、Black Friday 等期间，按照平台建议的折扣力度提报，会获得专属的大促标签。\\n- Rebate（价格补贴）活动：当卖家参与平台补贴活动，且折后价满足比普通折扣更低的要求时，更容易获得高吸引力的标签。\\n\\n4. 店铺信誉良好：卖家的店铺信誉等级（Reputation）通常需要处于绿色状态，且 Listing 的评分较高，系统才会优先展示促销标签。\\n\\n5. 充足的库存：如果库存过低，系统为了保护买家体验，可能不会给该链接展示强力的促销标签。\\n\\n建议你通过卖家后台的“营销活动”板块，选择平台推荐的折扣力度进行提报，这样获得“超值优惠”标签的概率最高。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-26 18:29:25\",\"用户\":\"大大大明\",\"群\":\"\",\"用户问询\":\"这个算是在参加折扣活动了吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n从图片看，第一行活动显示为 SCHEDULED（已排期），说明已成功参加，将在6月3日开始。第二行活动右侧有 Participate 按钮，说明该活动尚未参加，你可以点击按钮报名。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-20 14:05:44\",\"用户\":\"韩业飞（邀请码：3B3IJD）\",\"群\":\"\",\"用户问询\":\"老板您好，巴西本土有在做么，没有3.5%IOF税，BRL的汇率好，全量支持API，平台到连连基本上秒到，限时活动价手续费。\",\"AI响应\":\"你好！很高兴为你解答。巴西本土店收款无需法人KYC验证，无IOF税费，汇率优于黑市，支持BRL转CNY，且到账时效为实时到账。目前中国跨境团队已支持巴西本土店申请，详情请咨询官方招商经理。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-22 17:01:24\",\"用户\":\"啊楼🍉\",\"群\":\"\",\"用户问询\":\"body.required_fields items The body does notcontains some or none of the following properties [family_name] 什么原因\",\"AI响应\":\"你好！这个报错是因为你漏填了必填字段。在填写企业法律信息或股东信息时，请确保完整填写了姓氏（family name）字段。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-22 16:39:27\",\"用户\":\"Sik-\",\"群\":\"\",\"用户问询\":\"美客多的店铺，如果自己店铺做秒杀价格比较低，那么后面参加这个店铺的平台活动会不会被算入最低价要求这样提报3\",\"AI响应\":\"在美客多平台，LIGHTING（每周两次的秒杀）的折后价格会影响过去30天的最低价；而DOTD（Deal of Day）的折后价格则不会影响。建议提报活动时预留25%以上的折扣空间。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-22 16:35:32\",\"用户\":\"Sik-\",\"群\":\"\",\"用户问询\":\"美客多的店铺，如果自己店铺做秒杀价格比较低，那么后面参加这个店铺的平台活动会不会被算入最低价要求这样提报\",\"AI响应\":\"在美客多平台，LIGHTING（每周两次的秒杀）折后价格会影响过去30天最低价；而DOTD（Deal of Day）折后价格不会影响过去30天最低价。建议您根据活动类型评估对后续提报的影响。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-21 13:19:17\",\"用户\":\"啊楼🍉\",\"群\":\"\",\"用户问询\":\"报美客多的活动，我都只设置了5%，但是报完后，还会有一些50%的活动在里面？导致经常出现这种订单亏钱\",\"AI响应\":\"你好！这通常是因为你参加了全托管模式的补贴活动。平台近期对全托在售商品（尤其是21天内的新品）有补50%的活动，该补贴由平台承担，不会从你的供货价中扣除。若非全托模式，请检查是否误报了其他高折扣活动。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-25 09:55:40\",\"用户\":\"Silvia\",\"群\":\"\",\"用户问询\":\"那平台设置打折 折扣是基于净收益吗 净收益20%off 前台看到的价格 可能是10%off了\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n在美客多平台，折扣的计算逻辑确实比较特殊，你的观察非常准确。\\n\\n1. 折扣是作用于最终售价的：虽然你在后台感知的是利润变动，但平台前端显示的折扣百分比是基于“上市价格（Listing Price）”计算的。\\n\\n2. 为什么会出现“20% off 变成 10% off”的情况：\\n这是因为上市价格中包含了固定成本（如运费、每单位额外费用等）。\\n举个例子：\\n- 假设你的净收益是 50 美金，运费和佣金等固定成本是 50 美金，前台售价就是 100 美金。\\n- 如果你对净收益打 8 折（20% off），净收益减少了 10 美金。\\n- 此时前台售价变成了 90 美金。\\n- 对于买家来说，价格是从 100 变到了 90，前端显示的折扣就是 10% off。\\n\\n3. 佣金基数的变化：由于销售佣金是基于最终售价比例收取的，当价格下调时，系统会重新计算佣金和税费的占比。如果系统为了保证折扣后的吸引力，在扣除固定比例的佣金和运费后进行反推，可能会出现非线性的价格变动。\\n\\n4. 汇率与取整：系统在计算折扣后，会根据当地站点的货币习惯进行取整处理，这也会导致最终显示的折扣比例与你预想的数学计算存在偏差。\\n\\n建议你查看卖家后台订单明细中的费用拆解，核实该价格下你的实际净收益是否符合预期。如果差异过大，建议重新调整折扣比例。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-25 11:43:50\",\"用户\":\"灿烂阳光\",\"群\":\"\",\"用户问询\":\"我这个智赢提示，我的活动失效，是在出单以后失效的，为什么订单利润显示是变动的？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n这种情况在美客多运营中很常见，订单利润显示变动主要有以下几个原因：\\n\\n**1. 活动失效的时间差：**\\n如果活动是在出单后失效的，那么这笔订单在成交瞬间依然是按“折扣价”成交的。智赢 ERP 抓取到的初始数据是折后的低利润。当活动失效后，ERP 可能会重新同步商品的原价信息，导致你在后台看到的利润数据发生跳动或更新。\\n\\n**2. 汇率的实时波动：**\\n美客多后台以美金计价，但结算和 ERP 计算利润时会涉及汇率转换。如果汇率发生变动，即便美金金额没变，换算成人民币的利润也会出现微小起伏。\\n\\n**3. 物流费用的校准：**\\n这是最常见的原因。美客多系统会根据包裹在物流中心的实测尺寸和重量进行校准。如果实测重量与你填写的重量有偏差，系统会微调运费。虽然在净收益模式下运费由系统自动叠加，但如果触发了包邮政策的变动，最终反馈到 ERP 里的结算金额就会发生变化，从而导致利润显示变动。\\n\\n**4. 平台佣金的重新计算：**\\n如果你的活动失效导致前台售价回升，平台收取的佣金绝对值也会随之改变。ERP 在同步这些动态扣费时，利润自然会随之更新。\\n\\n**总结建议：**\\n只要最终的“利润”一栏是正数，且符合你的预期，这种小幅度的变动不需要过度担心。建议以订单妥投结算后的最终账单为准。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-26 05:49:58\",\"用户\":\"水果🍉\",\"群\":\"\",\"用户问询\":\"为什么我报活动，老是会出现有些我不想要的，也报了 我表格报的\",\"AI响应\":\"通过表格提报活动时，系统会根据表格中的信息进行匹配。如果表格中包含了不希望参加活动的产品信息，或者未对提报范围做精确筛选，就会导致误报。建议在上传前仔细核对表格中的 SKU/PID 列表，删除不需要参加活动的项目。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-25 11:53:49\",\"用户\":\"灿烂阳光\",\"群\":\"\",\"用户问询\":\"我按照3倍定价。打折扣的时候，如何来算保证成本呢？简洁一点\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n按照3倍定价，想在打折时保住成本，最简洁的算法如下：\\n\\n**1. 记住一个“保本折扣”：**\\n只要折扣**不低于 3.3 折（即 67% OFF）**，你的净收益就一定能覆盖 1 倍的成本。\\n\\n**2. 保证 20% 利润的算法：**\\n*   **公式**：成本 × 1.2 ÷ 初始净收益 = 折后余数。\\n*   **例子**：成本 12.3元，想要 20% 利润（即 14.76元）。\\n*   14.76 ÷ 34元（5美金初始净收益）= 0.43。\\n*   **结论**：你最高可以打 **4.3 折（即 57% OFF）**。\\n\\n**3. 最简单的实操方法：**\\n在后台设置折扣时，盯着 **“You will receive”** 这一栏：\\n只要显示的 **美金数 × 6.8 \\u003e 成本 × 1.2**，你的 20% 利润就保住了。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-23 18:49:02\",\"用户\":\"归于平静\",\"群\":\"\",\"用户问询\":\"这个活动有什么要求吗 哪些连接可以申报还是所有的在售连接\",\"AI响应\":\"您好！DOD活动参与条件为L30D GMV\\u003e0、L30D销量\\u003e3、商家信誉≥light green，且满足过去30天最低价-3%。目前仅面向平台和客户经理定向邀请的商家商品，非全量开放。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-21 11:01:14\",\"用户\":\"灯火星星\",\"群\":\"\",\"用户问询\":\"有两个失分项，视频审核中，但是活动是新卖家可以参与的吗？\",\"AI响应\":\"你好！很高兴为你解答。新卖家可以参与活动。你可以点击 Participate 查看是否有可参加的折扣活动。若暂无系统邀请，可先通过卖家后台自行创建卖家折扣。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-20 22:11:40\",\"用户\":\"骑着毛驴去拉萨\",\"群\":\"\",\"用户问询\":\"我需要净收益折扣20%，表格折后净收益公式应该怎么填写\",\"AI响应\":\"你好！在表格上传时，净收益（Net Proceeds）字段应直接填写你扣除所有费用后最终想拿到的金额。若需实现20%的净收益折扣，公式为：折后净收益 = 原净收益 × 0.8。系统会自动根据此金额反推并生成前台售价。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-25 11:48:17\",\"用户\":\"灿烂阳光\",\"群\":\"\",\"用户问询\":\"所以可以打折扣40% 平台数据最准确\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n**是的，平台后台的账单数据是最准确的，因为它反映了最终打款给你的真实金额。**\\n\\n通过这次复盘，我们可以得出几个非常重要的实操结论：\\n\\n**1. 你的定价策略很稳**\\n因为你坚持按成本的3倍来设定初始净收益，这给了你巨大的“抗风险空间”。即便打了40%的折扣，你依然能从12.3元的成本中赚回8.2元，利润率依然有40%左右。\\n\\n**2. 为什么可以打40%折扣**\\n只要你的初始定价足够高（像你这样3倍成本），打40%折扣是安全的。但请记住：**40%已经是你这类低单价商品的极限了**。\\n*   如果再打低，或者遇到更重的商品导致运费扣除更多，利润就会被迅速吃掉。\\n\\n**3. 以后看数据的优先级**\\n*   **第一优先级**：美客多后台订单详情（即你最后发的那张图）。看“总计（Total）”是多少美金，这是你实打实拿到的钱。\\n*   **第二优先级**：ERP数据。ERP只是辅助，如果ERP里的成本录入错误，它算的利润就是错的，不要被它吓到。\\n\\n**操作建议：**\\n你可以继续参加40%左右的活动，但每次设置完，请务必去后台看一眼那个“You will receive”或者出单后的“总计”金额。只要这个美金数乘以汇率后大于你的成本，你就可以放心大胆地卖。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-25 07:49:49\",\"用户\":\"焱七\",\"群\":\"\",\"用户问询\":\"报名活动 需要每一个站点单独操作么\",\"AI响应\":\"是的，报名活动需要针对每个站点单独操作。虽然一个账号可以开通多个站点，但各站点的活动提报、库存管理和促销规则是相互独立的。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-24 14:24:02\",\"用户\":\"纯属巧合\",\"群\":\"\",\"用户问询\":\"半托管店铺， 可以针对粉丝设置专享优惠券吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n目前美客多后台**暂时不支持**卖家针对“粉丝”这一特定群体设置专属优惠券。\\n\\n虽然你现在是 MercadoLeader，拥有了一定的粉丝基础，但美客多的优惠券系统（Coupons）目前的逻辑主要是以下几种：\\n\\n1.  **全店/单品优惠券**：面向所有买家展示，只要进入你的店铺或产品详情页，任何人都可以领取。\\n2.  **平台定向优惠券**：由平台根据算法发放给特定用户（如高频购买某类目的买家），卖家无法自主指定发放给自己的粉丝。\\n\\n**虽然不能直接发券给粉丝，但你可以通过以下方式实现类似的“粉丝运营”效果：**\\n\\n*   **利用 My Page（店铺主页）**：在你的店铺装修页面，将利润款或新品配合当前的促销活动（如 Smart Discounts）放在最显眼的位置。粉丝通过关注列表回访时，第一眼就能看到这些优惠。\\n*   **Clips 短视频引流**：为你的促销产品拍摄 Clips 视频。粉丝在刷视频时看到你的优惠产品，点击即可跳转购买。这实际上起到了“定向通知粉丝有优惠”的作用。\\n*   **利用认证标识**：作为 MercadoLeader，你的产品在搜索结果中自带勋章，这本身就是给粉丝的一种“信任折扣”，能显著提升他们的下单意愿。\\n\\n**总结：**\\n目前无法实现“仅粉丝可见”的优惠券，建议你通过**“促销活动 + Clips 视频 + 店铺装修”**的组合方式，让粉丝在回访时感受到你的店铺活跃度和价格优势。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-24 10:36:58\",\"用户\":\"好多猪猪\",\"群\":\"\",\"用户问询\":\"自己想提报哪些产品就填对吗 折扣是97折\",\"AI响应\":\"提报必须是寻品清单中的同款产品。填写时需将对应商品ID等信息填入表格，每个item回填一列，且严禁改动他人的信息。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-23 17:44:10\",\"用户\":\"涛声依旧\",\"群\":\"\",\"用户问询\":\"上面的折扣跟这个会有冲突嘛？还是叠加的\",\"AI响应\":\"不同促销活动的叠加规则需以系统设置时的提示为准，建议在创建时注意查看后台冲突提示或咨询平台客服确认。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-23 16:32:39\",\"用户\":\"李玲娅\",\"群\":\"\",\"用户问询\":\"销售费用是按照实际售价来的吗 我的促销价格\",\"AI响应\":\"销售费用是按照实际售价来收取的，包括促销活动后的折后售价。根据平台规则，销售费用的计算基于订单的最终成交价格，而促销活动（如折扣券、rebate补贴等优惠）后的价格会作为实际售价计入费用核算范围。例如，当商品参与Rebate活动时，折后售价（即参与补贴的价格）会直接影响销售费用的计算，且该价格需满足比普通折扣更低的要求（至少低5%），并会计入credibility price指标。因此，无论是否有促销活动，最终成交的实际付款金额（含优惠减免）都会作为销售费用的计算基数。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-23 16:08:26\",\"用户\":\"若初见\",\"群\":\"\",\"用户问询\":\"该商品不符合促销条件什么原因 ？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n商品不符合促销条件可能有以下几种原因：\\n\\n1. **类目限制**：促销活动可能仅针对特定类目（如电子产品、家居用品等），你的商品类目不在支持范围内。\\n2. **价格要求**：促销可能要求商品售价在指定区间内（如最低售价≥XX元），或折扣比例需符合活动规则（如满减、限时折扣等）。\\n3.** 库存状态 **：商品库存不足、缺货或处于预售/下架状态，可能无法参与促销。\\n4.** 是否参与活动 **：需确认该商品是否已报名对应促销活动，或是否满足活动的额外条件（如首单折扣、新用户专享等）。\\n5.** 商品状态 **：若存在违规记录、未通过审核或处于禁售状态，也会导致无法参与促销。\\n\\n建议你核对商品信息、活动规则及后台提示详情，若仍有疑问可联系客户经理进一步排查~\\n\\n关于墨西哥RFC税号 的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-22 16:14:36\",\"用户\":\"j、\",\"群\":\"\",\"用户问询\":\"帮我看下图片中新粉优惠券，每个买家可以用几次\",\"AI响应\":\"你好！很高兴为你解答。根据图片显示，这种针对店铺新粉丝的优惠券，每个买家账号只能使用一次。一旦买家在订单中使用了该优惠券，后续购买将无法再次享受该折扣。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-22 13:34:33\",\"用户\":\"Dan.\",\"群\":\"\",\"用户问询\":\"那不参加活动的话，新品没什么流量 如何突出\",\"AI响应\":\"如果不参加平台促销活动，新店和新品可以通过以下几种方式系统地提升曝光和转化，突出产品优势：\\n\\n1. **快速积累绿色信誉**：\\n这是新店冷启动的核心。建议在Listing激活后，通过适当降价或站内广告，迅速完成前10单履约。拿到绿色信誉后，系统会正式为您打开流量通道，提升整体权重。\\n\\n2. **使用 Clips 短视频工具**：\\n这是目前最推荐的免费引流工具。通过上传产品功能演示或外观展示的短视频，可以直接在专门的视频入口获得曝光。数据表明，Clips 能帮助销量提升 25%~30% 左右。\\n\\n3. **优化 Listing 质量**：\\n确保每个产品拥有 3 张以上的高质量图片，全方位展示细节。使用亮眼的颜色和字体在图片中突出核心卖点。同时，确保标题和描述本地化，点亮基础商品权重。\\n\\n4. **开启广告工具（Ads）**：\\n如果您是自发货VIP客户，注册满15天且账户健康即可开启广告。对于新品，建议设置较高的目标 ACOS 值，主动去和有销售记录的成熟商品抢夺曝光机会，实现从 0 到 1 的突破。\\n\\n5. **完善店铺装修（My Page）**：\\n利用店铺装修工具进行产品分类和品牌形象营造。在 Header 下方添加横幅（Main banner），展示品牌故事、上新信息或主推爆品，通过视觉冲击力捕捉顾客目光。\\n\\n6. **利用背景突出产品**：\\n根据类别选择白色、单色或真实生活背景，确保产品是照片的主角，使产品的尺寸、设计和功能更易于理解，避免杂乱背景干扰视觉。\\n\\n即便不参加官方大促，您也可以通过手动调整价格（降价后的第4天通常会有明显的流量加持）来模拟促销效果，吸引系统算法的关注。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-21 17:32:58\",\"用户\":\"Hellen\",\"群\":\"\",\"用户问询\":\"如果参加平台活动，净利润怎么算？\",\"AI响应\":\"你好！在半托管模式下，建议使用收益价格（Net Proceeds）模式。你设置的供货价即为你的收益，平台在促销活动中调低前端售价不会影响你的结算金额，你的净利润依然基于提报的供货价核算。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-20 15:15:03\",\"用户\":\"sincere\",\"群\":\"\",\"用户问询\":\"那我价格高打折扣到200以下要吗？\",\"AI响应\":\"你好！包邮门槛是以折扣后的最终售价为准。如果折后价格低于299比索，你可以设置不包邮，运费由买家承担。只有折后依然高于或等于299比索时，才由你承担运费。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-20 10:40:59\",\"用户\":\"迷迷 苏\",\"群\":\"\",\"用户问询\":\"商品参加推广活动的时候有个什么自动修改价格的\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n你提到的这个功能叫做**价格自动化（Price Automation）**。它的主要作用是帮助你在参加推广活动或日常销售时，根据竞争对手的价格自动调整你的售价，以保证你的产品具有竞争力。\\n\\n**价格自动化是如何运作的：**\\n\\n1. **选择列表**：你可以在后台选择想要开启自动定价的商品。\\n2. **选择竞争策略**：\\n   * **在 Mercado Libre 上赢得价格**：系统会参考平台内同类产品的价格进行调整。\\n   * **在 Mercado Libre 内外的最佳价格**：系统会参考平台内外（如其他电商平台）的价格。\\n3. **设定价格限制**：这是最重要的步骤。你需要设定一个**最低价格**（底价），系统只会在你设定的范围内调价，绝对不会低于你的底价，从而保护你的利润。你也可以选填最高价格。\\n4. **自动调整**：设置完成后，当竞争对手调价时，系统会在你设定的限制范围内自动帮你调整价格，无需人工手动修改。\\n\\n**特别提醒：**\\n如果你已经创建了特定的促销活动（如 Deal 或 Lightning Deal），活动期间的价格通常是固定的。如果你想修改正在参加活动的商品价格，活动创建成功后通常是无法直接修改的，需要先退出活动或等待活动结束。\\n\\n你可以直接在卖家后台的商品列表页面找到对应商品，查看是否有“自动定价”或类似的设置选项。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-26 18:30:02\",\"用户\":\"大大大明\",\"群\":\"\",\"用户问询\":\"两个活动是不是参加一个就可以了\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n是的，通常参加一个即可。但如果两个活动时间不冲突，你也可以都参加。若时间重叠，系统通常会择优展示或不允许叠加，建议优先选择折扣力度大、流量入口好的活动。\",
