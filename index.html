业登记证）。\\n2. 注册邮箱：建议使用Gmail、Outlook、Hotmail等海外邮箱。\\n3. 店铺名称：英文名称，不可包含Mercado或品牌敏感词。\\n4. 手机号：中国大陆手机号。\\n5. 收款账户：支持派安盈（Payoneer）、连连（LianLian Pay）或PingPong。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-25 19:30:49\",\"用户\":\"困告羊\",\"群\":\"\",\"用户问询\":\"新店没有full仓是正常的吗\",\"AI响应\":\"是的，这是正常的。Full仓权限通常由系统根据店铺信誉等级（需处于绿色状态）、销售表现和运营合规性自动激活。建议先通过自发货模式积累数据，达标后系统会自动开通。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-25 11:20:14\",\"用户\":\"彬\",\"群\":\"\",\"用户问询\":\"我们是半托管模式的，带有带FULL标\",\"AI响应\":\"你好！很高兴为你解答。半托管模式不需要RFC税号，平台也不会对半托管卖家进行36%的增值税和所得税代扣。虽然商品带有Full标，但税费政策与海外仓模式不同。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-25 04:06:03\",\"用户\":\"水果🍉\",\"群\":\"\",\"用户问询\":\"不是full就是普通\",\"AI响应\":\"是的，图片显示你的智利和巴西站点自发货模式已活跃。在美客多前台，只有小飞机标识的是自发货店铺，有Full标识的才是海外仓店铺。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-24 22:25:52\",\"用户\":\"王秀地\",\"群\":\"\",\"用户问询\":\"但是我看到其他卖家可以full出售\",\"AI响应\":\"你好。目前无法直接判断其他卖家可以入仓的具体原因。建议优先核查产品属性是否完全一致，或通过后台客服确认该类目最新的入仓政策。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-24 22:25:08\",\"用户\":\"王秀地\",\"群\":\"\",\"用户问询\":\"那可以加白入full仓吗\",\"AI响应\":\"你好。目前危险品无法申请加白入Full仓。建议通过自发货模式进行销售，或联系后台客服确认具体产品的限制详情。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-24 22:21:57\",\"用户\":\"王秀地\",\"群\":\"\",\"用户问询\":\"产品被禁入full仓\",\"AI响应\":\"你好。产品被禁入FULL仓通常是因为违反了禁售政策或属于危险品。建议在卖家后台通过Need Help联系邮件或在线客服，提供Case ID和相关佐证向客户经理反馈。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-24 17:05:28\",\"用户\":\"David Xu\",\"群\":\"莉娅测试群\",\"用户问询\":\"@美客多本土小助手莉娅(美客多本土小助手莉娅) 我怎么才能开full\",\"AI响应\":\"关于美客多平台的开通full仓事宜，请添加我们的美客多本土小助手。\\n\\n添加成功后，请直接私聊发送“开full”，小助手将为您提供详细指引，协助您快速完成账号登记与开通full仓流程。\\n\\n请扫描该二维码：https://img02.ma.scrmtech.com/cms/org782f560bf2d00828b759c694d30149c5/1784625891857/群聊库存管理转小助手二维码.png\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-24 16:59:33\",\"用户\":\"🌉\",\"群\":\"\",\"用户问询\":\"自发货模式和海外仓（FULL）模式有买手对接吗？\",\"AI响应\":\"自发货和海外仓模式通常由客户经理对接。建议您先在邮箱收集表登记信息，符合条件的优质卖家将有机会获得经理的流量扶持和运营指导。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-24 16:52:33\",\"用户\":\"liang\",\"群\":\"\",\"用户问询\":\"海外仓没有巴西站吗\",\"AI响应\":\"你的问题我暂时无法回答，后续我会丰富我的知识库，敬请见谅。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-24 16:45:30\",\"用户\":\"🌉\",\"群\":\"\",\"用户问询\":\"full是海外仓的模式吗？\",\"AI响应\":\"是的，Full模式就是美客多的官方海外仓模式。它类似于亚马逊的FBA，您需要提前备货到墨西哥等当地仓库，出单后由平台直接发货，通常3-5日即可送达。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-24 14:40:58\",\"用户\":\"YYY\",\"群\":\"\",\"用户问询\":\"我主要是想了解墨西哥海外仓的，海外仓的产品会被清退吗？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n墨西哥海外仓的产品是会被清退的。平台为了保证仓库的周转效率，会定期清理冗余和无动销的库存。\\n\\n**1. 动销清退规则**\\n如果某个SKU在海外仓内表现不佳，例如在7天内销量为0，或者在14天内销量极低，该SKU可能会被系统判定为不符合海外仓存储要求，从而面临清退。\\n\\n**2. 不健康库存处理**\\n若商品满足以下任一条件，会被界定为不健康库存：\\n- 连续30个自然日无销售记录。\\n- 库龄超过60天。\\n- 实际库存量超出了平台分配给您的可用库容。\\n对于这类库存，平台可能会采取分批强制折扣清货的措施。\\n\\n**3. 弃置与销毁风险**\\n在设置退货地址时，必须填写有效的当地退货地址。如果您的Full仓退货在20天内未被提取，且没有有效的退货地址，这些商品将被自动捐赠或销毁。\\n\\n建议您定期通过后台监控库存动销，及时通过降价或广告手段清理库龄较长的商品，避免产生高额仓储费或被强制清退。\\n\\n**网页参考资料**\\n仓储费说明：https://global-selling.mercadolibre.com/help/15373\\n弃置或撤仓费说明：https://global-selling.mercadolibre.com/knowledge-hub/18226\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-24 14:37:47\",\"用户\":\"YYY\",\"群\":\"\",\"用户问询\":\"@美客多小助手萝拉 海外仓的产品会被清退吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n海外仓的产品是存在清退机制的。平台会根据库存的动销情况和存放时长进行处理，具体规则如下：\\n\\n1. 库存退出机制：\\n如果某个SKU在7天内销量为0，或者在14天内销量极低，该SKU可能会被系统清退。\\n\\n2. 无动销处理：\\n如果商品入库超过30天仍然没有动销（即没有销售记录），可能面临退仓或清货处理。\\n\\n3. 不健康库存定义：\\n若商品连续30个自然日无销售，或库龄超过60天，或超出分配库容，均会被界定为“不健康库存”，可能面临分批强制折扣清货。\\n\\n建议您采取“多款式、轻库存”的策略，并定期通过后台的库存管理板块监控每个SKU的动销情况，及时通过调整价格或开启促销活动来提升销量，避免因库存积压导致被强制清退或产生额外的长期仓储费。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-24 12:38:07\",\"用户\":\"J·Alex\",\"群\":\"\",\"用户问询\":\"发往墨西哥FULL仓的货物被拒收\",\"AI响应\":\"你好！很高兴为你解答。发往墨西哥FULL仓的货物被拒收，通常是因为不符合入库规范。请检查以下几点：\\n\\n1. 标签问题：是否漏贴了产品标签或外箱标签，或者标签被折叠、覆盖了关键信息。\\n2. 包装问题：包装是否破损，或者不符合平台要求的尺寸和重量限制。\\n3. 预约问题：是否按照系统生成的预约时间准时送达。\\n4. 违禁品或限制品：产品是否属于禁售品，或者玩具类产品是否缺少必要的NOM认证标签。\\n\\n未提供RFC税号目前不影响您在美客多平台的现有销售权限，也不会导致货物因此被拒收。但建议您尽快完善，以避免高额的代扣税。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-24 10:39:52\",\"用户\":\"简简单单普罗达商贸\",\"群\":\"\",\"用户问询\":\"可以直接用第三方海外仓吗？\",\"AI响应\":\"可以。跨境海外仓卖家需要先将货物从国内运输到墨西哥本地第三方仓，随后由物流商在系统线上预约送仓时间，再根据系统分配的具体FULL仓地址按时送达。建议操作前先在卖家后台完成备货计划的创建。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-23 22:12:42\",\"用户\":\"LiSONG\",\"群\":\"\",\"用户问询\":\"你这边是负责FULL仓店铺的吗\",\"AI响应\":\"不好意思，该问题我没有答案\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-23 19:04:45\",\"用户\":\"David Xu\",\"群\":\"莉娅测试群\",\"用户问询\":\"@美客多本土小助手莉娅(美客多本土小助手莉娅) 开full\",\"AI响应\":\"关于美客多平台的开通full仓事宜，请添加我们的美客多本土小助手。\\n添加成功后，请直接私聊发送“开full”，小助手将为您提供详细指引，协助您快速完成账号登记与开通full仓流程。\\n请扫描该二维码：https://img02.ma.scrmtech.com/cms/org782f560bf2d00828b759c694d30149c5/1784625891857/群聊库存管理转小助手二维码.png\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-23 00:43:10\",\"用户\":\"A吴先生\",\"群\":\"\",\"用户问询\":\"Full仓是全托管吗？\",\"AI响应\":\"Full仓是全托管模式下的仓储服务，商家仅需负责供货，平台负责运营、物流、仓储等全流程。在全托管模式中，商家无需自行管理海外仓，货物会被统一存储在平台指定的海外仓（如墨西哥仓），由平台完成配送、售后等环节。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-22 21:50:31\",\"用户\":\"Candy Bai\",\"群\":\"\",\"用户问询\":\"什么情况下海外仓会弃置我的产品\",\"AI响应\":\"以下情况会导致海外仓产品被弃置：\\n1. 退货地址空缺，Full仓退货在20天内未提取。\\n2. 墨西哥站点未填写美国或墨西哥当地三方仓地址。\\n3. 平台使用UPS配送退货，配送三次不成功。\\n4. 4-5月到仓异常件未在规定时间内（如6月23号）取件。\\n5. 商品损坏且卖家选择弃置。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-22 21:49:41\",\"用户\":\"Candy Bai\",\"群\":\"\",\"用户问询\":\"什么情况海外仓会弃置我的货物\",\"AI响应\":\"若商品被判定为不可售且您在20天内未提取，或未填写当地退货地址，商品将被捐赠或销毁。此外，平台使用UPS配送退货，若配送三次不成功也将视为弃货。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-22 21:49:06\",\"用户\":\"Candy Bai\",\"群\":\"\",\"用户问询\":\"什么情况会弃置海外仓 怎么提仓\",\"AI响应\":\"若配送三次不成功将视为弃货。墨西哥站点若未填写美国或墨西哥当地三方仓地址，也将默认弃置。提仓需进入后台Full库存管理部分，预约上门取货，跨境卖家通常需委托当地货代或第三方海外仓代取。目前平台不支持上门自提。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-22 17:02:13\",\"用户\":\"Manda\",\"群\":\"\",\"用户问询\":\"墨西哥美国转运仓模式是墨西哥full模式吗？\",\"AI响应\":\"你好！很高兴能为你解答。\\n\\n墨西哥美国转运仓模式（美仓）和墨西哥Full海外仓模式是两种不同的履约模式，它们的主要区别如下：\\n\\n1. 仓库位置与配送方式：\\n- 墨西哥Full模式：货物存储在美客多位于墨西哥境内的官方仓库，属于本土发货。\\n- 美国转运仓模式：货物存储在美客多位于美国德克萨斯州的官方仓库，属于跨境直邮模式。\\n\\n2. RFC税号要求：\\n- 墨西哥Full模式：必须提供墨西哥RFC税号，否则平台会面临约36%的代扣税（16%增值税 + 20%所得税）。\\n- 美国转运仓模式：不需要提供RFC税号。因为该模式属于跨境直邮，进口税费由买家在下单时支付，卖家可以有效避免复杂的税务预扣风险。\\n\\n3. 覆盖范围：\\n- 墨西哥Full模式：主要针对墨西哥本土市场。\\n- 美国转运仓模式：支持“一仓发拉美”，卖家只需备货至美国德州仓，即可同时销售至墨西哥、阿根廷、智利、巴西、哥伦比亚5个国家。\\n\\n总结来说，美国转运仓模式并不是墨西哥Full模式，它是为了方便卖家无需办理当地税号即可合规起步而推出的远程配送模式。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-22 16:06:36\",\"用户\":\"灿烂阳光\",\"群\":\"\",\"用户问询\":\"我这个是平台的前端，不是我的店铺，我在前端选品，是不是要把这FULL免费送货服务打开。\",\"AI响应\":\"是的，在前端选品时，**强烈建议你把这个 FULL 开关打开**。\\n\\n原因如下：\\n\\n1. **锁定核心竞争对手**：美客多超过 80% 的流量都集中在带 FULL 标志的产品上。打开开关后，你看到的才是市场上真正有销量、有竞争力的“尖子生”。\\n\\n2. **过滤无效信息**：如果不打开，搜索结果里会混杂大量配送时间长、转化率低的自发货产品，这些产品的参考价值远不如海外仓产品。\\n\\n3. **对标真实市场需求**：拉美买家非常看重物流时效。打开 FULL 开关后，你能看到当地消费者愿意花钱买、且卖家愿意备货到海外仓的爆款。如果你选的品在 FULL 筛选下有很多高销量的同类品，说明这个类目在当地是有真实且庞大需求的。\\n\\n4. **观察价格体系**：打开 FULL 后，你可以看到这些爆款在包含海外仓各项费用后的最终售价。你可以根据这个价格反推自己的成本，看看如果自己也发海外仓，是否还有利润空间。\\n\\n**选品小建议：**\\n打开开关后，重点看那些**销量高（如 500+、1000+）**且**评价好**的产品。如果某个产品带 FULL 标识但销量显示为“-”，说明它是刚入仓的新品，你可以观察它的款式，看是否是当下的流行趋势。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-22 13:53:24\",\"用户\":\"Butter\",\"群\":\"\",\"用户问询\":\"就是退FULL和送FULL的授权码\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n关于退仓和送仓的授权码，具体查看方式如下：\\n\\n**1. 退仓（退FULL）的授权码：**\\n这就是我们前面提到的 **OC提货码**。\\n查看路径：登录卖家后台 -\\u003e 进入 **Listings management** -\\u003e 点击 **Created pickup full**。\\n在这里你可以找到对应退仓单的 OC 单号，这就是你提供给货代或司机的提货授权码。\\n\\n**2. 送仓（送FULL）的授权码：**\\n送仓通常不需要像退仓那样的“授权码”，而是需要 **预约单（Shipment ID）** 和 **箱唛/货件标签**。\\n查看路径：登录卖家后台 -\\u003e 进入 **Shipments**（货件管理） -\\u003e 找到你创建的备货计划。\\n你需要下载并打印货件标签（包含二维码和货件编号），货代在送货预约和现场入库时，凭借的是这个货件编号和预约信息。\\n\\n总结一下：退货看 **OC码**，送货看 **Shipment ID（货件编号）**。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-22 13:41:16\",\"用户\":\"小张向前进\",\"群\":\"\",\"用户问询\":\"平台是如何收取税费 我们做的是发到美客多full仓的如何收费\",\"AI响应\":\"如果你使用墨西哥Full仓且没有RFC税号，平台会依法对你的销售额进行36%的税费预扣（16%增值税+20%所得税）。\\n\\n在定价时，你不需要人工计算税费，系统会根据你录入的目标净收益自动叠加税费、佣金和运费生成最终售价，税费由买家承担。\\n\\n此外，Full仓费用还包括：\\n1. 销售佣金。\\n2. 仓储费（按商品体积和存放时间计收）。\\n3. 订单处理费（尾程配送费，根据重量和尺寸计收）。\\n4. 广告费（若开启）。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-22 13:20:47\",\"用户\":\"灿烂阳光\",\"群\":\"\",\"用户问询\":\"亲这个带FULL的代表有销量，可以直接选的对吗？\",\"AI响应\":\"带 FULL 标识的产品确实是选品的重要风向标，但不能简单地理解为“直接选了就能卖好”。结合你这张截图，我给你分析一下其中的门道：\\n\\n1. **FULL 代表流量和转化保障**：\\n带 FULL 标志意味着产品已经进入了美客多的官方海外仓。这类产品享有平台的流量倾斜、更快的物流时效（通常次日达）以及更高的搜索权重。买家看到 FULL 标志会更愿意下单，所以这类产品的销量通常比自发货（Internacional）要稳得多。\\n\\n2. **看销量数据**：\\n你看截图里第一个香水，销量显示 10000，第四个灯串销量 100，这些都是已经跑通了市场、有真实需求的产品，参考价值很高。而第三个虽然带 FULL，但销量显示为“-”，说明它可能刚进仓不久，还在测款阶段。\\n\\n3. **选品的逻辑建议**：\\n*   **可以跟卖/借鉴**：如果你能找到同款且成本有优势，或者能做差异化（比如组合装、不同颜色），这些带 FULL 的品就是你的目标。\\n*   **避开恶性竞争**：如果一个品已经有几万销量，且卖家是“官方专卖店”或“铂金卖家”，新手直接硬碰硬很难抢到流量。建议找那些销量在几百到一千左右、评价还有提升空间的品去切入。\\n*   **注意季节性**：你搜的是“万圣节”，这类节日产品时效性极强。现在是 7 月，准备万圣节的货发海外仓时间刚好。但一定要算好入仓时间，错过了节日就变成积压库存了。\\n\\n4. **特别提醒**：\\n截图里第三个产品标了“Internacional 中国 FULL”，这通常是**跨境海外仓**模式。如果你目前做的是自发货，看到这种品要小心，因为你的物流时效拼不过人家，价格如果还没优势，就很难抢到单。\\n\\n**总结：**\\n带 FULL 且销量高的品，证明了市场需求，是很好的选品参考。你可以根据这些品的规格、价格去 1688 找货，算好利润后再决定是否上架。\",\"一级大类\":\"产品管理\",\"二级子类\":\"类目咨询\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-22 11:30:46\",\"用户\":\"彬\",\"群\":\"\",\"用户问询\":\"半托管是有两种模式吗？半托管和半托管海外仓（Full）模式，\",\"AI响应\":\"你好！很高兴为你解答。半托管模式只有一种，即商家备货至国内东莞仓，出单后由平台派送。半托管商品上架后会自动带上Full标，享受流量扶持，但这与传统的海外仓（Full）模式是不同的。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-22 10:14:02\",\"用户\":\"Lucky\",\"群\":\"\",\"用户问询\":\"您好 我们的货到达full仓了 麻烦开一下信誉吧\",\"AI响应\":\"你好！新店铺初始信誉为灰色。需完成履约10个订单后，系统会根据订单处理的综合表现自动评定信誉等级，目前无法人工开启。\",\"一级大类\":\"账号入驻与安全\",\"二级子类\":\"店铺等级\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-21 19:51:19\",\"用户\":\"蓝七\",\"群\":\"\",\"用户问询\":\"你好 跨境店铺可以上品到墨西哥full？\",\"AI响应\":\"你好！很高兴为你解答。可以的，国内营业执照申请的就是跨境店，支持海外仓（Full）模式。你需要先在后台创建备货计划，然后通过第三方物流商将货物送往墨西哥本地仓，最后由物流商预约送入平台Full仓。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-21 19:32:47\",\"用户\":\"平凡\",\"群\":\"\",\"用户问询\":\"这个是中转仓跨境直邮模式，为什么都带有绿色full标\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n图中显示的绿色 FULL 标志是因为美国转运仓模式（美仓）也属于美客多官方仓储物流服务。\\n\\n只要货物存储在美客多官方指定的仓库（无论是墨西哥本地仓还是美国德州转运仓），并由平台负责发货，前台产品页面都会展示绿色 FULL 标志。这代表了官方物流保障，能显著提升买家的信任度和转化率。\",\"一级大类\":\"其他\",\"二级子类\":\"系统报错\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-21 19:18:08\",\"用户\":\"平凡\",\"群\":\"\",\"用户问询\":\"海外仓店铺的所有的货物是必须要先集中到各个站点的官方仓，然后再从官方仓送收到客户手中吗，其实想问的是客人下单后，包裹的轨迹是从哪里发到哪里\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n是的，海外仓（FULL）模式下，包裹轨迹是从美客多官方仓直接发往客户手中。\\n\\n具体流程是：你先将货物批量运送至对应站点的官方仓库（如墨西哥FULL仓）进行预备货。当客户下单后，由美客多仓库负责拣货、打包并完成尾程派送。这种模式物流时效最快，能获得更多流量支持。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-21 19:13:39\",\"用户\":\"wong\",\"群\":\"\",\"用户问询\":\"目前巴西站仅支持自发货模式，暂不支持跨境海外仓，这是什么意思，巴西站能不能开半托管吗\",\"AI响应\":\"你的问题我暂时无法回答，后续我会丰富我的知识库，敬请见谅。目前巴西跨境店仅支持国内小包自发货模式，无法使用巴西海外仓。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-21 18:39:05\",\"用户\":\"wong\",\"群\":\"\",\"用户问询\":\"国内菜鸟集运仓有哪些，48小时内送达是按客人下单时间开始算吗 普通海外仓/自发货店铺 和 全托管/半托管，工贸一体项目，这些模式在平台推广或前端商品标识上有什么不同\",\"AI响应\":\"国内菜鸟集运仓分布在东莞、深圳、义乌、上海、泉州等地。48小时发货时效是从订单生成开始计算，不含周末及节假日，以物流官网显示已揽收为准。\\n\\n前端标识区别：\\n1. 全托管/半托管：有小飞机图标 + FULL标识。\\n2. 自发货：仅有小飞机图标。\\n3. 海外仓（FULL）：仅有FULL标识。\\n\\n全托管/半托管由平台负责推广，海外仓模式在流量和转化率上比自发货更有优势。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-21 18:32:04\",\"用户\":\"wong\",\"群\":\"\",\"用户问询\":\"一个主体能不能同时开普通海外仓/自发货店铺 和 全托管/半托管，工贸一体项目？\",\"AI响应\":\"可以的。全托管和普通跨境店铺需要使用不同的店铺进行操作。普通跨境店铺由您自主运营、定价和管理物流；全托管模式则由您负责供货。您可以根据自身的供应链优势和运营团队配置来合理分配产品。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-21 17:26:22\",\"用户\":\"太平洋\",\"群\":\"\",\"用户问询\":\"你好，请问中国的营业执照可以做海外仓吗\",\"AI响应\":\"可以的。国内营业执照完全可以申请海外仓店铺模式。您用国内营业执照申请的就是跨境店，可以选择海外仓或自发货模式。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-21 16:10:24\",\"用户\":\"Alien\",\"群\":\"\",\"用户问询\":\"已经出单的海外仓店铺怎么更换邮箱？\",\"AI响应\":\"亲爱的卖家，对于已经出单的海外仓店铺，更换邮箱的操作需要非常谨慎。\\n\\n1. 提交邮箱后尽量不要修改。如果必须修改，审核时效将在原基础上再增加一个月，这可能会影响您店铺的正常运营。\\n\\n2. 新邮箱必须从未注册过美客多的任何账号。请确保使用谷歌邮箱（Gmail）、Outlook邮箱或阿里云邮箱，不要使用163、QQ、新浪等国内邮箱，以免无法收到系统邮件。\\n\\n3. 修改邮箱可能会触发平台的安全审核或重新验证流程。如果您的店铺正在进行KYC审核，建议等审核完成后再操作，否则会导致审核进度进一步延迟。\\n\\n4. 具体的修改路径通常在后台 Settings 模块的账户信息设置中。\\n\\n由于修改邮箱涉及账号安全和审核周期，建议您在操作前确保新邮箱状态活跃且安全。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-21 16:08:12\",\"用户\":\"A.roc\",\"群\":\"\",\"用户问询\":\"美客多墨西哥full货运代理名称天不上去咋回事，一直在转，还有这里是填中文还是英文的啊\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n建议优先使用 Chrome 浏览器并清除缓存，或尝试开启无痕模式。若界面一直转圈，通常是网络环境不稳定，建议切换网络节点或稍后再试。\\n\\n关于填写语言，建议使用英文或拼音填写，避免系统因无法识别中文字符导致报错或加载失败。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-21 15:54:30\",\"用户\":\"野海\",\"群\":\"\",\"用户问询\":\"没有海外仓相关设置 只有自发货\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n从你提供的截图来看，目前墨西哥站点确实只显示了自发货（IDS）模式。这是因为海外仓（FULL）权限通常需要根据卖家的经营情况或特定流程来激活。\\n\\n如果你想开启墨西哥海外仓模式，可以参考以下信息：\\n\\n1. 激活机制：海外仓权限可以根据卖家需求在后台自动激活。如果当前页面没有显示激活按钮，通常是因为账号刚注册完成，系统尚未同步或需要你先完善其他必要信息。\\n\\n2. RFC税号要求：做美客多墨西哥官方海外仓模式是必须绑定境外RFC税号的。如果你计划转为海外仓模式，建议提前准备RFC税号相关事宜。\\n\\n3. 模式转换：美客多支持卖家从自发货模式转为海外仓模式，或者两种模式同时运营。\\n\\n4. 建议操作：你可以先通过自发货模式进行运营和测款。当店铺有了一定的销售表现后，后台通常会出现激活海外仓的选项，或者你可以联系对应的招商经理申请开通。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"其他\",\"二级子类\":\"系统报错\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-21 11:57:51\",\"用户\":\"晨夕\",\"群\":\"\",\"用户问询\":\"fti，产品有full标？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\nFTI模式的产品**没有Full标**。\\n\\nFTI（工贸一体）属于自发货/直邮模式的一种，产品从中国发货。只有将货物提前备货至美客多位于拉美当地的官方仓库（海外仓模式），产品才会带 **Full** 标志并享受对应的流量倾斜。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-21 10:06:10\",\"用户\":\"L^\",\"群\":\"\",\"用户问询\":\"海外仓模式算半托？\",\"AI响应\":\"不是的。海外仓模式（Full模式）属于跨境店的一种，卖家需提前备货至拉美当地仓库。而半托管模式是商家自主定价运营，备货至国内东莞仓，由平台负责跨境派送。两者在备货地点和物流流程上是不同的。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-21 09:49:45\",\"用户\":\"AA依然指间砂\",\"群\":\"\",\"用户问询\":\"FTI自行送到国内集运中心是任意一个揽收仓都可以？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n在FTI模式下，如果您选择自送到仓，目前全国范围内共有25个与菜鸟合作的可接受卖家自送的仓库。\\n\\n对于符合打包要求的包裹，您可以直接在这些指定的drop off仓库进行A-scan。建议您在送货前确认具体的仓库地址及接收要求，以确保货物能够顺利入仓。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"仓储预约综合咨询\"},{\"时间\":\"2026-07-20 21:13:09\",\"用户\":\"花花～\",\"群\":\"\",\"用户问询\":\"那这么说每个国家都要寻找一个海外仓吗？我弃货还不行吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n你的心情我非常理解，但从平台规则和系统操作层面来看，确实有以下限制：\\n\\n1. 系统强制要求：在后台设置中，退货地址通常是激活物流服务的必填项。如果不填写，系统可能无法让你完成物流配置，导致店铺无法正常开售。\\n\\n2. 弃货的代价：如果你不提供退货地址，当买家发起纠纷要求退货时，平台系统会因为没有退货去向而默认判卖家输，你只能选择“仅退款”，这会导致你钱货两空。\\n\\n3. 必须是本地地址：每个国家都需要填写对应国家的本地退货地址，不能统一填写同一个国家的地址。\\n\\n4. 解决方案：如果你确实打算弃货，不想寻找复杂的海外仓合作，建议你联系一些提供“退货代收”服务的第三方物流商，仅挂靠一个他们的仓库地址用于系统激活。这样即使产生退货，你可以指令他们直接销毁，但至少保证了你店铺的正常运营权限。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-20 19:42:54\",\"用户\":\"凝眸\",\"群\":\"\",\"用户问询\":\"跨境店墨西哥站开Full仓需要店铺满足什么条件\",\"AI响应\":\"你好！很高兴为你解答。跨境店墨西哥站开通Full仓通常需要满足以下条件：\\n1. 店铺信誉等级达到绿色。\\n2. 过去30天内有稳定的销售记录。\\n3. 账户无违规记录且各项指标正常。\\n4. 需完成RFC税号合规。\\n具体开通权限以后台系统邀请或客户经理通知为准。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-20 18:57:20\",\"用户\":\"凝眸\",\"群\":\"\",\"用户问询\":\"想问下您开Full仓需要什么条件\",\"AI响应\":\"你好！很高兴为你解答。海外仓模式适合具备以下条件的卖家：\\n1. 拥有稳定且较大销售量的企业卖家。\\n2. 具备一定的资金实力和运营能力，能承担备货和物流成本。\\n3. 品牌店铺，尤其是拥有R标或TM标的卖家。\\n4. 希望提升物流时效和买家体验。\\n国内营业执照可申请跨境店海外仓模式。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-20 16:59:52\",\"用户\":\"自己\",\"群\":\"\",\"用户问询\":\"美客多FTI和海外仓店铺是否要交保证金\",\"AI响应\":\"您好！我们美客多平台是不需要缴纳押金的。平台没有所谓的罚款和保证金要求，您可以直接注册开店，无需担心押金问题。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-20 16:34:59\",\"用户\":\"是酥鱼吖\",\"群\":\"\",\"用户问询\":\"美客多full有客服助手吗\",\"AI响应\":\"你好！美客多有智能卖家助手（Seller Assistant）。你可以点击页面上方或下方的 Help 进入帮助中心，点击 Contact Us，右下角将弹出该助手。它支持中、英、西语，可处理货件表现、信誉管理、入仓成本及物流等问题。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-20 16:10:17\",\"用户\":\"A.roc\",\"群\":\"\",\"用户问询\":\"美客多CBT墨西哥Full的墨西哥收件地址在哪？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n若跨境海外仓卖家需要发货至平台Full仓，系统会在你创建备货计划后，将货件分配到具体的仓库。\\n\\n常见的墨西哥Full仓地址包括 **Danhos Cuautitlán** 等。物流商在物流系统线上预约送仓时间后，系统会显示具体的分配地址，物流商再按预约的时间和地点送仓即可。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-20 15:26:44\",\"用户\":\"三十一\",\"群\":\"\",\"用户问询\":\"我墨西哥海外仓的\",\"AI响应\":\"从图片看，你目前展示的是处于“活跃”状态的3条商品信息。如果还有其他商品没显示，请点击“筛选和排序”，检查是否勾选了“已结束”或“已暂停”等状态。此外，请确认是否在其他站点或通过自发货模式上传了商品，不同模式和站点的商品管理界面是分开的。\",\"一级大类\":\"账号入驻与安全\",\"二级子类\":\"账号异常\",\"问题主题\":\"账号风控/限制/申诉\"}]},{\"业务模块\":\"海外仓\",\"高频问题\":\"发货/物流/运费/尾程\",\"Past 7 Days\":30,\"Previous\":28,\"WoW\":0.07142857142857142,\"代表性问询\":\"什么模式要负责头程尾程\",\"Past 7 Days代表性问询\":\"什么模式要负责头程尾程\",\"Previous代表性问询\":\"海外仓物流是什么样的呢\",\"__details\":[{\"时间\":\"2026-07-26 18:11:46\",\"用户\":\"守一\",\"群\":\"\",\"用户问询\":\"自发货的话，对**公司，还是你们官方在中国境内的头程还有墨西哥境内的尾程都有配送\",\"AI响应\":\"自发货模式下，您只需在中国境内将商品打包并贴上物流面单，在3个工作日内发送至美客多指定的国内集运仓即可。后续的国际运输、清关及目的地派送均由官方指定的物流承运商全程负责。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-25 16:00:21\",\"用户\":\"B.\",\"群\":\"\",\"用户问询\":\"货物发到墨西哥full仓，不需要巴西ANATEL认证标签吧\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n不需要。ANATEL认证是巴西国家电信局针对电信产品（如手机、蓝牙设备、Wi-Fi设备等）进入巴西市场制定的强制性认证要求。\\n\\n由于你的货物是发往墨西哥Full仓，你只需要遵守墨西哥的相关法规和准入要求（如NOM认证等），不需要办理巴西的ANATEL认证标签。\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-24 12:22:35\",\"用户\":\"Felicity 103%\",\"群\":\"\",\"用户问询\":\"您好，我想问问普通CBT和CBT pro 以及本土店的一些相关事情，尾程操作费用是怎么算的，还有其他额外的收费吗，售出一件商品后不同店铺会产生的费用分别有哪些\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n**1. 跨境店（CBT）费用构成：**\\n*   **佣金：** 不同类目比例不同（如服饰15%，电子12%）。\\n*   **配送费：** 包含尾程运费，按货件毛重计收。\\n*   **税费：** 若未注册墨西哥RFC税号，会预扣20%所得税。\\n*   **其他：** 广告费（按点击收费）、仓储费（海外仓模式）。\\n\\n**2. 本土店费用构成：**\\n*   **佣金：** 约14% + 2%税。\\n*   **税费：** 需当地营业执照注册RFC，可减免部分税费。\\n*   **其他：** 同样包含配送费、广告费及仓储费。\\n\\n**3. 尾程操作费：**\\n如果产品售价低于免邮门槛，平台可能会收取一笔额外的操作费（低价产品附加费）。\\n\\n**4. 收益计算公式：**\\n您的实际收益 = 商品售价 - 平台销售佣金 - 税费 - 配送费用。\\n\\n建议使用官方利润计算器进行精准测算：https://global-selling.mercadolibre.com/listings/cost-calculator\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-24 11:26:31\",\"用户\":\"三毛\",\"群\":\"\",\"用户问询\":\"我现在在考虑产品定价 不知道有哪些费用 比如说 平台扣点，物流 海外仓 什么价格呢 我才能算出来 怎么定价 具体有哪些费用 框架\",\"AI响应\":\"美客多海外仓（Full）卖家的定价框架非常清晰，你可以参考以下公式和费用明细进行测算：\\n\\n**1. 定价计算公式：**\\n您的实际收益 = 商品售价 - 平台销售佣金 - 税费 - 配送费用\\n\\n**2. 具体费用框架：**\\n\\n*   **平台销售佣金：**\\n    根据产品类目不同，佣金比例通常在 11.5% - 22.5% 之间。\\n    查询链接：https://global-selling.mercadolibre.com/landing/selling-fee\\n\\n*   **税费（以墨西哥为例）：**\\n    如果你没有墨西哥RFC税号，平台会代扣代缴增值税（16%）和所得税（20%）。如果你有RFC税号并完成绑定，税费成本会大幅降低。\\n\\n*   **配送费用（尾程派送费）：**\\n    这是指从美客多仓库送到买家手中的费用，根据货物的重量和尺寸计算。店铺信誉等级越高，折扣越大（绿色等级最高可享60%折扣）。\\n    查询链接：https://global-selling.mercadolibre.com/help/23223\\n\\n*   **仓储服务费：**\\n    按月收取，根据商品尺寸每日计费。\\n    - 小型产品：约 0.0006 美元/日\\n    - 中型产品：约 0.0022 美元/日\\n    - 大型产品：约 0.0050 美元/日\\n    - 超大/重型：约 0.0276 美元/日\\n\\n*   **其他潜在成本：**\\n    - 头程运费：从中国工厂运到墨西哥/智利仓库的物流费。\\n    - 广告费用：如果开启Product Ads，需预留推广成本。\\n 44:43\",\"用户\":\"B.\",\"群\":\"\",\"用户问询\":\"我属于新店，做的full仓，如果我的货还在送去墨西哥full仓的路上，但是店铺没有任何链接可以售卖，因为货物还在去往full仓的路上，且已经超了3个月店铺无任何订单，会有影响吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n如果你的货物已经在发往Full仓的路上，但因为物流周期导致店铺超过3个月没有订单，这确实存在被系统判定为不活跃的风险。\\n\\n建议你采取以下措施规避：\\n1. 开启自发货链接：在等待Full仓到货期间，可以先上传一些自发货（CBT）的链接并开启售卖。只要产生订单动销，就能维持店铺的活跃状态。\\n2. 关注货件状态：一旦货物入仓上架，请立即优化Listing并配合广告推广，尽快产生首单。\\n\\n如果店铺因无动销被暂停，通常需要联系客户经理或通过后台申诉，说明货物正在入仓途中以申请恢复。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-24 13:58:24\",\"用户\":\"MGG\",\"群\":\"\",\"用户问询\":\"这种从中国发货，带full标记的是不是就是全托链接？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n从你提供的图片来看，这个链接确实具备全托管模式的典型特征。\\n\\n具体判断依据如下：\\n\\n1. 配送标识：图片中明确显示了“Envío desde China”（从中国发货）以及中国国旗图标，这说明货物是从中国境内发出的。\\n\\n2. 物流服务：下方标注了“Almacenado y enviado por FULL”（由 FULL 仓储和发送）。在美客多模式中，如果商品从中国发货却带有 FULL 闪电标识，这通常代表该商品属于全托管模式。\\n\\n3. 运作逻辑：全托管模式下，卖家将货物发往美客多位于中国的集运仓（如东莞仓），后续的国际物流、清关以及目的国配送均由平台负责，因此在前端页面会显示 FULL 标识以代表平台提供的物流保障。\\n\\n全托管模式下，商家享受 0 国际物流费，且无需承担平台佣金、仓储费和广告费，只需向平台提报供货价即可。\",\"一级大类\":\"其他\",\"二级子类\":\"系统报错\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-24 12:01:58\",\"用户\":\"A吴先生\",\"群\":\"\",\"用户问询\":\"那你们的海外仓发货流程指南的图片里面显示SKU的标签是直接贴在产品上的，而且放在箱子里面不用泡沫包装的？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n根据你提供的官方指南图片，确实要求将标签贴在产品的初始包装（即原厂彩盒）最大的一侧。\\n\\n关于你的疑问，建议如下操作：\\n\\n1. 贴标位置：标签必须贴在产品初始包装（如盒子）最大的一侧，且要保持平整，严禁折叠或贴在封口处。\\n2. 保护要求：虽然指南图片中展示的是直接装箱，但对于钢化膜这类易碎品，建议你使用气泡袋进行二次加固，以防止运输途中破损。\\n3. 贴标逻辑：如果你使用了气泡袋等外部包装，SKU标签必须贴在最外层的包装上，确保仓库人员无需拆包即可直接扫描条码。\\n\\n总结来说，如果你的产品彩盒足够坚固且不是易碎品，可以直接贴在彩盒上；但如果是钢化膜，为了安全起见，建议套袋后将标签贴在袋子外面。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"账号风控/限制/申诉\"},{\"时间\":\"2026-07-24 11:36:05\",\"用户\":\"Cora Huang\",\"群\":\"\",\"用户问询\":\"如果海外仓一条链接自生成起都没有客诉，但是分数只有30分是为什么\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n海外仓链接的分数主要由销量、转化率、价格竞争力、配送速度以及评价等多维度构成。即使没有客诉，如果该链接长期没有销量或者销量极低，系统会认为该产品的市场吸引力不足，从而给出较低的基础分数。\\n\\n此外，如果你的产品价格明显高于市场同类竞品，或者Listing的图片、描述等信息不够完善导致转化率低下，也会直接影响分数。建议你检查产品的价格竞争力，并尝试通过促销活动或广告投放来积累初始销量，提升链接活跃度。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\ 境店，海外仓发货这么操作\",\"AI响应\":\"你好！跨境店海外仓（FULL）操作流程如下：\\n1. 申请权限：在后台申请开通对应站点的海外仓权限。\\n2. 创建货件：在后台创建发货计划，选择要入仓的商品及数量。\\n3. 打印标签：下载并打印商品标签和外箱标签。\\n4. 物流送仓：联系物流商将货物送至美客多官方仓库。\\n5. 仓库上架：仓库签收并核对无误后，商品将自动上架销售。\",\"一级大类\":\"账号入驻与安全\",\"二级子类\":\"入驻流程\",\"问题主题\":\"入驻/注册/开店流程\"},{\"时间\":\"2026-07-24 14:11:50\",\"用户\":\"kanl\",\"群\":\"\",\"用户问询\":\"可以开通full模式吗\",\"AI响应\":\"从图片看，你目前处于“商品 Remoto”界面，这通常对应美国转运仓（美仓）模式。该模式属于远程配送，不支持开通墨西哥等目的国的官方仓（Full）模式。如果你想使用 Full 模式，需要入驻专门的海外仓（CBT）账号。\",\"一级大类\":\"账号入驻与安全\",\"二级子类\":\"入驻流程\",\"问题主题\":\"入驻/注册/开店流程\"},{\"时间\":\"2026-07-24 10:29:52\",\"用户\":\"David Xu\",\"群\":\"莉娅测试群\",\"用户问询\":\"@美客多本土小助手莉娅(美客多本土小助手莉娅) 怎么开full\",\"AI响应\":\"你好！很高兴能为你解答。提交申请前，请务必仔细阅读《FULL仓申请指南》，按照指南完成后台的“退货仓库地址设置”及“税务设置”。完成前置准备后，请进行以下 3步登记操作：\\n\\nStep 1: 请确保扫码添加小助手。\\nStep 2: 完整填写“本土号卖家入驻信息收集表”：https://28151754.beschannels-plus.com/forms/6WU4ZMA；\\nStep 3: 完成“巴西本土FULL仓申请表”：https://28151754.beschannels-plus.com/forms/6XU4ZNB。\\n\\n目前 FULL 仓申请每周审批 1 次，通过后 7-10 个工作日内生效，请耐心等待。\\n\\n网页参考资料：\\nFULL仓申请指南：https://doc.weixin.qq.com/pdf/d3_AQIAAQbOAJoCN52Q7ezFTSeqcDUDW?scode=AI8A3wfvAAovXGjhqUAQIAAQbOAJo\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-24 10:20:14\",\"用户\":\"David Xu\",\"群\":\"莉娅测试群\",\"用户问询\":\"@美客多本土小助手莉娅(美客多本土小助手莉娅) 怎么开full\",\"AI响应\":\"你好！很高兴能为你解答。提交申请前，请务必仔细阅读《FULL仓申请指南》，按照指南完成后台的“退货仓库地址设置”及“税务设置”。完成前置准备后，请进行以下 3步登记操作：\\n\\nStep 1: 请确保扫码添加小助手。\\nStep 2: 完整填写“本土号卖家入驻信息收集表”：https://28151754.beschannels-plus.com/forms/6WU4ZMA；\\nStep 3: 完成“巴西本土FULL仓申请表”：https://28151754.beschannels-plus.com/forms/6XU4ZNB。\\n\\n目前 FULL 仓申请每周审批 1 次，通过后 7-10 个工作日内生效，请耐心等待。\\n\\n网页参考资料：\\nFULL仓申请指南：https://doc.weixin.qq.com/pdf/d3_AQIAAQbOAJoCN52Q7ezFTSeqcDUDW?scode=AI8A3wfvAAovXGjhqUAQIAAQbOAJo\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-24 10:13:50\",\"用户\":\"David Xu\",\"群\":\"莉娅测试群\",\"用户问询\":\"@美客多本土小助手莉娅(美客多本土小助手莉娅) 怎么开full仓\",\"AI响应\":\"你好！很高兴能为你解答。提交申请前，请务必仔细阅读《FULL仓申请指南》，按照指南完成后台的“退货仓库地址设置”及“税务设置”。完成前置准备后，请进行以下 3步登记操作：\\n\\nStep 1: 请确保扫码添加小助手。\\nStep 2: 完整填写“本土号卖家入驻信息收集表”：https://28151754.beschannels-plus.com/forms/6WU4ZMA；\\nStep 3: 完成“巴西本土FULL仓申请表”：https://28151754.beschannels-plus.com/forms/6XU4ZNB。\\n\\n目前 FULL 仓申请每周审批 1 次，通过后 7-10 个工作日内生效，请耐心等待。\\n\\n网页参考资料：\\nFULL仓申请指南：https://doc.weixin.qq.com/pdf/d3_AQIAAQbOAJoCN52Q7ezFTSeqcDUDW?scode=AI8A3wfvAAovXGjhqUAQIAAQbOAJo\\n\\n小助手二维码：\\nhttps://file.marsmind.cc/boot-admin/mercado_local/20260716/2077****8034.png\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-23 16:04:15\",\"用户\":\"冯鹏程\",\"群\":\"\",\"用户问询\":\"为什么我这边FTI店铺显示有FULL仓，但是却还需要海外仓单独申请呢\",\"AI响应\":\"你好！根据平台规则，FTI店铺目前仅开放5个自发货站点，无法直接发FULL仓。海外仓需单独申请，可联系客户经理或填写问卷等待海外仓经理对接哦。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-23 13:50:59\",\"用户\":\"Rosa Chen（家居家具汽摩配full仓）\",\"群\":\"\",\"用户问询\":\"@Rosa Chen（家居家具汽摩配full仓） 你好，我们申请品牌保护需要海牙认证过的品牌授权书。商**公司的，可以在香港和新加坡做吗？平台会承认不\",\"AI响应\":\"你好！很高兴为你解答。品牌授权书若需海牙认证，香港及新加坡均为海牙公约成员国，可在两地完成海牙认证。只要授权书内容合规、认证流程符合当地法律要求，平台会承认经海牙认证的文件。\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-22 03:22:56\",\"用户\":\"爱老虎呦🐯\",\"群\":\"\",\"用户问询\":\"新店刚刚开通full仓，到仓后上架的产品可以直接开通广告吗？\",\"AI响应\":\"普通店铺开通广告须符合：有绿色信誉、活跃15天以上、出10单、且账户余额充足没有逾期欠款。因此新店到货后不能立即开广告，需先通过自然流量或促销积累10单并达到绿色信誉。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-21 19:24:48\",\"用户\":\"平凡\",\"群\":\"\",\"用户问询\":\"这种模式是可以你开通每个站点的full模式 从美国可以发往6个站点的买家吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n美国转运仓模式（美仓）支持“一仓发拉美”，目前已开放墨西哥、阿根廷、智利、巴西、哥伦比亚5个站点。\\n\\n但请注意，这属于跨境直邮模式，并非各站点的本地Full仓模式。货物储存在美国德州官方仓，由平台负责跨境尾程配送。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-21 18:29:44\",\"用户\":\"wong\",\"群\":\"\",\"用户问询\":\"这些入驻开店有什么区别：普通海外仓/自发货店铺 和 全托管/半托管，工贸一体项目\",\"AI响应\":\"你好！很高兴为你解答。这几种模式的主要区别如下：\\n\\n1. 普通海外仓/自发货：自主运营、定价及管理物流。自发货由国内直邮，海外仓需备货至墨西哥FULL仓。\\n2. 全托管：商家仅负责供货至国内仓，平台负责运营、定价、物流及售后，0佣金0仓储费。\\n3. 半托管：商家自主定价和运营，备货至国内仓，平台负责跨境物流，享受50%佣金减免。\\n4. 工贸一体FTI：非托管模式，需自有或深度合作工厂，卖家自主定价运营，类似JIT模式，需48小时内发货至集运中心。\\n\\n全托管/半托管/FTI入驻链接：http://kks.ink/ss/vKx9ph/d12030\\n普通自发货/海外仓入驻链接：https://global-selling.mercadolibre.com/landing/about\",\"一级大类\":\"账号入驻与安全\",\"二级子类\":\"入驻流程\",\"问题主题\":\"入驻/注册/开店流程\"},{\"时间\":\"2026-07-21 17:29:54\",\"用户\":\"Yzian\",\"群\":\"\",\"用户问询\":\"开通美国转运仓有什么费用收取吗？除开基本的仓储费以及尾程、佣金这些费用\",\"AI响应\":\"除了佣金、尾程运费和仓储费，若商品单价低于门槛，还会产生低价操作费。墨西哥站点单价低于 599 MXN 时，每件加收 20 MXN。此外，若库存存放超过 4 个月，还会产生长期仓储费。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-21 16:07:20\",\"用户\":\"价值2\",\"群\":\"\",\"用户问询\":\"海外仓模式店铺入驻条件是什么？\",\"AI响应\":\"你好！入驻要求如下：\\n1. 中**公司营业执照（有**公司，不接受个体户）。\\n2. 法人身份证及人脸识别。\\n3. 第三方收款账户（如美元账户）。\\n4. Gmail/Outlook/Aliyun等海外邮箱。\\n5. 品牌店需R标或TM标。\\n目前无需流水。\",\"一级大类\":\"账号入驻与安全\",\"二级子类\":\"入驻流程\",\"问题主题\":\"入驻/注册/开店流程\"},{\"时间\":\"2026-07-21 10:15:16\",\"用户\":\"一二三四五\",\"群\":\"\",\"用户问询\":\"你好，超大件入FULL怎么申请白名单\",\"AI响应\":\"你好！很高兴为你解答。新卖家的大件商品初始库容配额为1000件，在后台创建大件商品即刻生效。若现有库容无法满足需求，且IPI分数大于70分，可以向您的客户经理申请额外库容。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-20 18:46:54\",\"用户\":\"Mark\",\"群\":\"\",\"用户问询\":\"请问跨境卖家能不能申请海外仓\",\"AI响应\":\"跨境卖家可以申请海外仓。\\n\\n海外仓模式非常适合希望提升物流效率、缩短配送时间以及提升买家购物体验的卖家。通常，具备以下特点的卖家更适合申请：\\n1. 拥有稳定且较大销售量的企业卖家，能够提前备货到海外仓。\\n2. 具备一定的资金实力和运营能力，能承担备货和物流成本。\\n3. 品牌店铺，尤其是拥有R标或TM标的品牌卖家。\\n\\n如果你已经申请了自发货店铺，想要发海外仓是需要另外申请的。你可以直接联系自己的客户经理申请，或者填写问卷等待海外仓经理联系。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-20 16:51:31\",\"用户\":\"花花～\",\"群\":\"\",\"用户问询\":\"您好 我注册成功了 就是这个商业模式的话，我要做自发货该选IDS吗?因为我也不是墨西哥和智利本地仓储\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n是的，如果你要做自发货模式，请选择“IDS（拉美直邮）”。\\n\\nIDS模式就是从中国直接发货给拉美消费者的直邮模式。而“履约”选项是指将货物备货到美客多位于墨西哥或智利的官方海外仓。既然你目前没有本地仓储计划，选择IDS即可。\",\"一级大类\":\"账号入驻与安全\",\"二级子类\":\"入驻流程\",\"问题主题\":\"入驻/注册/开店流程\"}]},{\"业务模块\":\"海外仓\",\"高频问题\":\"RFC/税号是否必需/扣税影响\",\"Past 7 Days\":12,\"Previous\":19,\"WoW\":-0.3684210526315789,\"代表性问询\":\"海外仓一定要RFC文件才可以销售吗？\",\"Past 7 Days代表性问询\":\"海外仓一定要RFC文件才可以销售吗？\",\"Previous代表性问询\":\"美客多跨境full店rfc过了验证要求的时间还可以上传吗\",\"__details\":[{\"时间\":\"2026-07-26 18:09:15\",\"用户\":\"守一\",\"群\":\"\",\"用户问询\":\"full仓需要支付36%的税号；自发货的话对应的税是多少啊\",\"AI响应\":\"目前自发货卖家不涉及墨西哥 36% 的增值税代扣。自发货采用收益价格模式，系统会自动叠加运费、佣金及相关税费生成售价，无需人工计算。\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-24 12:20:46\",\"用户\":\"J·Alex\",\"群\":\"\",\"用户问询\":\"发往墨西哥FULL仓的货物，没有RFC会被拒收吗\",\"AI响应\":\"_thought\\n你好！很高兴为你解答。发往墨西哥FULL仓的货物，如果没有RFC税号不会被拒收。卖家可以先激活店铺跑自发货，待转Full仓时再绑定RFC。\\n\\n需要注意的是，如果做美客多墨西哥官方海外仓模式，虽然可以入库，但若无税号将面临最高36%的代扣税（16%增值税 + 20%所得税）。如果暂时还没有RFC税号，可以先绑定美金账号，再绑定墨西哥本土银行账号，平台暂时不会代扣代缴，等申请到税号后再绑定即可。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-24 09:27:04\",\"用户\":\"简简单单普罗达商贸\",\"群\":\"\",\"用户问询\":\"海外仓一定要RFC文件才可以销售吗？\",\"AI响应\":\"是的，墨西哥官方海外仓模式必须提供RFC文件（税务登记证），否则平台将按36%税率预扣税费。若未上传，需尽快完成RFC税号绑定或提交相关文件。\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-23 14:25:29\",\"用户\":\"Felicity 103%\",\"群\":\"\",\"用户问询\":\"经理：您好！我的两个full店需要更换RFC税号，现后台无法录入信息，请帮忙协助开通 登记移除现有税号，然后重新换绑\",\"AI响应\":\"由于当前人工激增，人工客服会在1-2小时内给您回复。请点击以下链接联系人工客服协助处理RFC税号更换事宜：[转人工链接]\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-22 16:25:36\",\"用户\":\"侯顺莲\",\"群\":\"\",\"用户问询\":\"您好！我的full仓店铺需要更换RFC税号，请协助打开填报资料入口，谢谢\",\"AI响应\":\"你好！很高兴为你解答。如果需要变更RFC，请及时在卖家后台提交变更申请，并提供新的RFC及对应的CSF文件。请确保该新RFC对应的CSF邮箱有效，以便接受并配合后续的验证信息。\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"RFC/税号/扣税政策\"},{\"时间\":\"2026-07-22 13:29:32\",\"用户\":\"极个别同志\",\"群\":\"\",\"用户问询\":\"你好，我想先问下，墨西哥站做full仓是需要rfc号吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n做墨西哥海外仓（Full仓）模式是需要绑定境外RFC税号的。\\n\\n根据墨西哥政府的税务法规，如果你选择海外仓模式但没有提供RFC税号，平台将面临约36%的代扣税（16%增值税 + 20%所得税）。\\n\\n如果你暂时还没有申请到RFC税号，可以先绑定非大陆/香港的美金账号，再绑定墨西哥本土银行账号，这样可以暂时避免代扣代缴，等申请到税号后再进行绑定完善。\\n\\n需要注意的是，如果你选择的是自发货模式或美国转运仓模式，则不需要提供RFC税号。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\ ,\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-21 13:49:04\",\"用户\":\"Elaine \",\"群\":\"\",\"用户问询\":\"自发货发货时效规定\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n自发货发货时效要求（2025年9月更新）\\n\\n平台对自发货订单的处理时效要求已从之前的 96小时 缩短为 72小时（均为工作日，不包含周末）。\\n\\n具体分解如下：\\n· 卖家段处理时效：您需要在订单产生后的 48小时（2个工作日） 内，将货物送达至指定的物流商仓库（目前主要为菜鸟仓库）。\\n· 物流商段处理时效：物流商在货物到仓后，有 24小时 完成扫描入库操作（即“上网”）。\\n\\n只有当物流商完成扫描，订单状态显示为“已录入系统”后，才算您完成了发货时效的考核。否则买家有权开启纠纷或取消订单。\\n\\n提升发货时效的小技巧\\n1. 保障库存：确保热销商品库存稳定，避免缺货导致无法及时发货。\\n2. 优化发货方式：\\n· 自寄：如果选择自行寄送到物流仓，使用紫色的轧带可以提升包裹的优先上网资格。\\n· 上门揽收：如果订单量较大且选择上门揽收，可以及时与揽收司机沟通，增加派车频率，确保当天货物能及时发出上网。\\n\\n请注意，在重要节假日期间，平台可能会发布时效豁免通知，请及时关注官方公告以合理安排发货。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-21 10:51:29\",\"用户\":\"ㅤ  ㅤ\",\"群\":\"\",\"用户问询\":\"不超过299比索的话墨西哥站点自发货模式的国际运费和本地配送费都是由买家承担吗\",\"AI响应\":\"你好！是的，在自发货模式下，如果折后售价低于299比索，国际运费和本地配送费均由买家承担。只有当折后售价达到或超过299比索时，运费才由卖家承担。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-21 10:24:00\",\"用户\":\"L^\",\"群\":\"\",\"用户问询\":\"这边物流怎么显示的都是自发货呀\",\"AI响应\":\"你好！这是因为新店铺默认都会开启自发货（IDS）模式。\\n\\n图中显示智利站点的 Fulfillment（海外仓）状态为“根据要求”，说明该站点的海外仓权限需要满足一定条件或申请后才能激活。\\n\\n如果您想做海外仓，通常需要先在自发货模式下积累一定销量和信誉，或联系客户经理申请开通对应站点的海外仓权限。\",\"一级大类\":\"账号入驻与安全\",\"二级子类\":\"店铺等级\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-21 08:34:05\",\"用户\":\"花花～\",\"群\":\"\",\"用户问询\":\"请问跨境店+平台仓和跨境店+自发货的区别是什么？平台仓有物流揽收的业务是以城市为范围吧？如果我是由不同的厂家发货，但是城市都集中在义乌和东莞，那么我可以选择平台仓上门揽收的业务吗？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n跨境店+平台仓（Full模式）与跨境店+自发货（CBT模式）的主要区别如下：\\n\\n1. 流量与权重：平台仓（Full）的产品带有Full标志，享受流量倾斜，转化率更高；自发货权重相对较低。\\n2. 配送时效：平台仓由美客多官方仓库直接发货给买家，时效极快；自发货由卖家从中国发货，时效较慢。\\n3. 运营重心：平台仓需要卖家提前备货到拉美当地仓库，有库存压力；自发货是出单后再发货，无库存压力。\\n\\n关于你提到的揽收业务：\\n\\n1. 业务性质不同：\\n上门揽收业务目前主要针对的是“自发货（CBT）”订单。\\n平台仓（Full）模式下，卖家需要自己负责将大货运送到美客多在拉美当地的仓库，平台不提供国内上门揽收大货去海外仓的服务。\\n\\n2. 自发货揽收范围：\\n自发货的揽收确实是以城市和具体街道为范围的。目前由菜鸟承接，在义乌和东莞都有揽收覆盖。\\n\\n3. 不同厂家发货的操作：\\n如果你是自发货模式：只要这些厂家都在菜鸟的揽收范围内，你可以设置多个揽收地址。但请注意，后台通常只能设置一个主揽收地址。如果厂家分散，建议让厂家直接将包裹“自送到仓（Drop-off）”到义乌或东莞的菜鸟仓库，这样更灵活。\\n如果你是平台仓模式：你需要把不同厂家的货集中起来，打包成大货箱，然**公司发往海外仓。\\n\\n总结：上门揽收是给自发货订单准备的，不是给往海外仓备货准备的。如果你的厂家在义乌和东莞，自发货时可以选择自送到菜鸟仓库，这是最稳妥的做法。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-21 03:26:22\",\"用户\":\"水果🍉\",\"群\":\"\",\"用户问询\":\"为什么感觉自发货店和FTI店发货面单没什么区别\",\"AI响应\":\"因为目前自发货和FTI模式的物流均由菜鸟承接，且都要求使用10*15cm的热敏纸打印物流面单，所以面单格式和要求基本一致。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-21 01:41:00\",\"用户\":\".\",\"群\":\"\",\"用户问询\":\"自发货需符合菜鸟物流对膏体/固体的运输要求是什么\",\"AI响应\":\"自发货要求膏体或液体体积不得超过100毫升。此外，产品必须是非易燃、非腐蚀性、无毒且不含酒精（酒精含量需小于24%）。任何种类的白色粉末均不能运往墨西哥。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-20 23:55:04\",\"用户\":\"水果🍉\",\"群\":\"\",\"用户问询\":\"自发货普通店，发货是发到哪里 海外吗\",\"AI响应\":\"自发货模式不需要发往海外。您收到订单后，需在中国境内将商品打包并贴好面单，在3个工作日内发送至美客多指定的国内菜鸟集运仓即可。您可以选择菜鸟上门揽收或自行寄送到国内指定仓库。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-20 15:58:14\",\"用户\":\"明月清风\",\"群\":\"\",\"用户问询\":\"自发货是必须要走美客多指定的物流吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n是的，美客多自发货模式必须使用平台指定的官方物流承运商。\\n\\n在该模式下，您的操作流程如下：\\n1. 订单产生后，您需要在卖家后台打印平台提供的官方物流面单。\\n2. 您需要自行将包裹发送至美客多指定的国内集运仓（目前主要由菜鸟等合作伙伴运营）。\\n3. 货物送达集运仓并完成扫描（A-scan）后，后续的国际运输、清关及目的地派送等环节，均由美客多官方指定的物流承运商全程负责。\\n\\n这种模式的优势在于，您不需要自己寻找国际货代，且物流时效和轨迹由平台监控，能更好地保障您的店铺绩效。\\n\\n请注意，您必须在收到订单后的3个工作日内，确保货物送达集运仓并完成扫描，否则会影响您的订单处理时效指标。\\n\\n网页参考资料：\\n自发货模式详解：https://mercadolibre.cn/news/info?id=152\\u0026type=live\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-20 11:58:51\",\"用户\":\"龙贰\",\"群\":\"\",\"用户问询\":\"美客多自发货物流和时效\",\"AI响应\":\"美客多自发货物流模式是跨境卖家从中国境内打包商品并送达平台指定的国内集运仓后，由**公司（菜鸟）负责后续的国际运输、清关及尾程派送的直邮解决方案，卖家无法在后台自行更换物流渠道哦。\\n\\n时效要求方面，自发货订单需在 **72小时（工作日）** 内处理完毕才算合规：  \\n - 卖家需 **48小时内** 将货物送达物流商仓库（工作日计算范围，不含周末及法定节假日）；  \\n - **物**公司需** 在收到货物后的 **24小时内完成扫描入库** (即“上网”状态更新)。  \\n\\n简单来说，从订单生成开始，4天内（含48小时送达仓库+物**公司24小时扫描入库），且仅计算工作日，超时未完成会影响店铺声誉，可能导致流量降权。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"}]},{\"业务模块\":\"自发货\",\"高频问题\":\"入仓/入库/库存/库容\" 07-24 17:40:20\",\"用户\":\"ぅ Oath°3 jin\",\"群\":\"\",\"用户问询\":\"您好，美客多半托管如何授权妙手erp\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n关于美客多半托管店铺授权妙手ERP的操作，你可以按照以下通用流程进行：\\n\\n1. 登录妙手ERP系统，在店铺授权或平台管理菜单中选择“Mercado Libre”或“美客多”。\\n2. 在授权页面选择对应的站点，并点击“添加授权”或“开始授权”。\\n3. 系统会跳转至美客多官方登录页面，请使用你的半托管店铺账号和密码进行登录。\\n4. 登录成功后，点击“允许”或“Authorize”授予妙手ERP访问店铺API的权限。\\n5. 授权完成后，回到妙手ERP界面确认店铺状态显示为“已授权”或“正常”，即可开始进行产品的采集、编辑和上架操作。\\n\\n目前美客多半托管店铺已全面支持ERP发品，妙手ERP也是官方支持的服务商之一。如果在授权过程中遇到具体的接口报错，建议你联系妙手ERP的官方客服或在美客多卖家后台咨询技术支持。\\n\\n网页参考资料\\n官方推荐服务商列表：https://mercadolibre.cn/melispn/operation\",\"一级大类\":\"其他\",\"二级子类\":\"其他\",\"问题主题\":\"其他具体问题\"},{\"时间\":\"2026-07-24 16:13:37\",\"用户\":\"邓欢\",\"群\":\"\",\"用户问询\":\"美客多全托管，包裹取消，退回的包裹在哪里\",\"AI响应\":\"全托管派送失败或取消的包裹会退回到美客多国内东莞仓。仓库质检后，符合二次销售要求的商品会重新上架，不符合要求的由平台统一处理。\",\"一级大类\":\"其他\",\"二级子类\":\"其他\",\"问题主题\":\"其他具体问题\"},{\"时间\":\"2026-07-24 15:04:02\",\"用户\":\"Q贫下下农\",\"群\":\"\",\"用户问询\":\"我是全托。要单站点达到500美金。不是全站点加起来吗？\",\"AI响应\":\"是的，全托管业务同样遵循单站点结算规则。虽然全托管目前主要在墨西哥站点，但系统仍是按单站点计算，余额满 500 美元后每周自动结算。\",\"一级大类\":\"其他\",\"二级子类\":\"其他\",\"问题主题\":\"其他具体问题\"},{\"时间\":\"2026-07-24 14:11:24\",\"用户\":\"林仲权\",\"群\":\"\",\"用户问询\":\"全托管\",\"AI响应\":\"美客多全托管模式是一种商家仅负责供货，而将店铺运营、物流配送、营销推广、售后服务等所有环节全部交由平台负责的商业模式。\\n\\n入驻要求如下：\\n1. 主体资质：需**公司营业执照（不接受个体户）。\\n2. 业绩要求：过往有托管平台经验，单平台单店年均流水超30w美金。\\n3. 商家画像：优先招募工厂型卖家、品类贸易商/托盘商以及品牌型供应商。\\n4. 产品画像：售价5-50美金，单件1.5kg以下，包装体积低于0.03立方米，标品优先。\\n5. 供货要求：提前备货至东莞仓，首单建议5-10件/SKU，补货周期15天以内。\\n\\n模式亮点：\\n1. 全链路0费用：0平台佣金、0店铺年费、0仓储费、0国际物流费、0广告费。\\n2. 快速回款：订单妥投后7个工作日回款。\\n3. 顶级流量：官方FULL标引流，专属全托管流量阵地。\\n4. 专业运营：无需组建运营团队，由平台负责商品上架、优化及活动提报。\\n\\n物流与定价：\\n商家负责将货物发往美客多东莞集运仓（国内运费商家承担），国际段物流由平台承担。商家只需提供期望的供货价（建议比市场价低15%以上），平台拥有最终市场定价权。\\n\\n入驻绿通链接：http://kks.ink/ss/vKx9ph/d12055\\n\\n网页参考资料：\\n全托管模式详情：https://file.marsmind.cc/boot-admin/mercado/20260306/2029****5153.png\\n全托管入驻条件：https://file.marsmind.cc/boot-admin/mercado/20260306/2029****6050.png\",\"一级大类\":\"其他\",\"二级子类\":\"其他\",\"问题主题\":\"其他具体问题\"},{\"时间\":\"2026-07-24 11:47:11\",\"用户\":\"1\",\"群\":\"\",\"用户问询\":\"我不是问  {\\\"realName\\\":\\\"陈清宏\\\",\\\"corpId\\\":1970****2899,\\\"avatarUrl\\\":\\\"\",\"AI响应\":\"你好，表里留下注册邮箱后，就可以咨询我入驻、选品以及运营相关的问题啦。\",\"一级大类\":\"其他\",\"二级子类\":\"其他\",\"问题主题\":\"其他具体问题\"},{\"时间\":\"2026-07-23 16:17:43\",\"用户\":\"尚美\",\"群\":\"\",\"用户问询\":\"我的是全托管店铺 不是自发货店铺\",\"AI响应\":\"全托管模式下，商家仅需提供供货价（产品成本+目标利润+国内物流成本），无需自行发布产品，平台会统一处理定价与上架。供货价计算公式：供货价=产品成本+目标利润+单件国内发货到东莞仓的物流成本（建议比市场价低≥15%）。  \\n\\n【网页参考资料】  \\n全托管理论实操可参考《美客多半托管模式解析》中“全托管核心流程”部分（05:15开始）：https://mercadolibre.cn/news/info?id=215\\u0026type=live\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-23 15:17:37\",\"用户\":\"A～猴子\",\"群\":\"\",\"用户问询\":\"我想入住半托管\",\"AI响应\":\"半托管目前是邀请制，需符合主流跨境平台经验、单店近一年流水超30万美金、产品重量＜1.5kg、备东莞仓库存（时尚100款、非时尚300款）等条件，登记问卷后等客户经理联系，预计20 - 30个工作日。\",\"一级大类\":\"其他\",\"二级子类\":\"其他\",\"问题主题\":\"其他具体问题\"},{\"时间\":\"2026-07-23 13:56:28\",\"用户\":\"林世远Ada\",\"群\":\"\",\"用户问询\":\"跨境店铺和半托店铺是同一种店铺吗？\",\"AI响应\":\"不是同一种。跨境店铺是店铺类型，支持自发货、海外仓和半托管等模式；半托管是跨境店铺的一种运营模式，目前为邀请制，需满足一定运营经验和流水等条件。\",\"一级大类\":\"其他\",\"二级子类\":\"其他\",\"问题主题\":\"其他具体问题\"},{\"时间\":\"2026-07-23 13:36:41\",\"用户\":\"林世远Ada\",\"群\":\"\",\"用户问询\":\"之前开了跨境店铺，可以在这个主体上开全托店铺吗？\",\"AI响应\":\"可以的，全托管和普通跨境店铺需使用不同店铺操作，同**公司主体可同时拥有两种店铺，按自身供应链优势分配运营。\",\"一级大类\":\"其他\",\"二级子类\":\"其他\",\"问题主题\":\"其他具体问题\"},{\"时间\":\"2026-07-23 13:21:33\",\"用户\":\"花花\",\"群\":\"\",\"用户问询\":\"自发货属于全托还是半托呢\",\"AI响应\":\"自发货是独立的物流模式，不属于全托或半托。自发货需48小时内发货到菜鸟仓库，半托管需备货到东莞仓由平台派送，全托管由平台负责运营、物流等全流程。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-23 13:04:35\",\"用户\":\"花花\",\"群\":\"\",\"用户问询\":\"现在我的店铺，目前是属于半托还是全托\",\"AI响应\":\"根据你提供的商品信息（显示“MX(Full)(Up)”），当前店铺的商品模式属于**墨西哥全托管模式（Full）**。若需切换至半托管，需满足邀请制条件并联系平台经理申请。\",\"一级大类\":\"其他\",\"二级子类\":\"其他\",\"问题主题\":\"其他具体问题\"},{\"时间\":\"2026-07-23 11:55:06\",\"用户\":\"廖\",\"群\":\"\",\"用户问询\":\"半托管模式下，海外税务这一块需要自己解决吗\",\"AI响应\":\"在美客多半托管模式下，海外税务相关事务由平台统一处理，卖家无需自行解决。具体说明如下：  \\n- **税费承担方**：半托管模式下，墨西哥站点的进口税费由买家在下单时承担，卖家无需办理属地化税务登记。  \\n- **RFC税号**：半托管模式不需要提供墨西哥RFC税号，平台也不会对半托管卖家进行36%的增值税和所得税代扣。  \\n- **定价逻辑**：卖家只需设置“收益价格”（即供货价），平台会在前端售价中自动叠加佣金和运费，最终显示给消费者的价格已包含税费，无需额外操作税务相关事宜。  \\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ\",\"一级大类\":\"财税合规\",\"二级子类\":\"税务合规\",\"问题主题\":\"税务合规综合咨询\"},{\"时间\":\"2026-07-23 10:54:51\",\"用户\":\"花花\",\"群\":\"\",\"用户问询\":\"全托流程发下\",\"AI响应\":\"全托管流程：创建链接→系统审核合规→核价+买手选品→创建发货单→货物入仓→链接生效。商家仅需负责供货，平台负责后续全流程运营。\",\"一级大类\":\"其他\",\"二级子类\":\"其他\",\"问题主题\":\"其他具体问题\"},{\"时间\":\"2026-07-23 10:50:47\",\"用户\":\"爱喝咖啡的懒人\",\"群\":\"\",\"用户问询\":\"我是半托，这个换货操作做得了吗\",\"AI响应\":\"可以的。半托模式下商家可自主创建发货计划，换货操作流程和普通卖家一致：  \\n1. 点击后台「Offer return」生成退货地址，告知买家退回损坏产品；  \\n2. 买家退回后，您自行创建新的备货单（按半托流程），填写物流单号完成发货即可。  \\n\\n记得在7月25日前完成整个流程，避免影响账户信誉。\",\"一级大类\":\"其他\",\"二级子类\":\"其他\",\"问题主题\":\"其他具体问题\"},{\"时间\":\"2026-07-23 10:28:23\",\"用户\":\"花花\",\"群\":\"\",\"用户问询\":\"我要半托\",\"AI响应\":\"半托管模式目前是邀请制，需满足一定运营经验和流水等条件，具体可联系您的经理了解详情或按平台指引申请。\",\"一级大类\":\"其他\",\"二级子类\":\"其他\",\"问题主题\":\"其他具体问题\"},{\"时间\":\"2026-07-23 02:41:13\",\"用户\":\"艳子慧里\",\"群\":\"\",\"用户问询\":\"半托店铺是否时尚类和非时尚类的产品都可以上在同一个店铺里\",\"AI响应\":\"半托店铺可以同时上架时尚类和非时尚类产品，只要总listing数量不超过100个即可~\",\"一级大类\":\"其他\",\"二级子类\":\"其他\",\"问题主题\":\"其他具体问题\"},{\"时间\":\"2026-07-23 00:43:10\",\"用户\":\"A吴先生\",\"群\":\"\",\"用户问询\":\"Full仓是全托管吗？\",\"AI响应\":\"Full仓是全托管模式下的仓储服务，商家仅需负责供货，平台负责运营、物流、仓储等全流程。在全托管模式中，商家无需自行管理海外仓，货物会被统一存储在平台指定的海外仓（如墨西哥仓），由平台完成配送、售后等环节。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-23 00:41:54\",\"用户\":\"A吴先生\",\"群\":\"\",\"用户问询\":\"我这个店铺是全托管还是半托管\",\"AI响应\":\"要确定店铺是全托管还是半托管，可查看店铺后台的运营设置。全托管模式下商家仅需负责供货，包括提交资质选品并备货至官方仓；半托管模式下商家仍需自主处理订单履约、物流对接等环节。若不确定，可联系招商经理或查看入驻时选择的模式类型。\",\"一级大类\":\"其他\",\"二级子类\":\"其他\",\"问题主题\":\"其他具体问题\"},{\"时间\":\"2026-07-22 23:11:40\",\"用户\":\"Aurora\",\"群\":\"\",\"用户问询\":\"全托管模式开始售卖后可以增加供货价吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n在全托管模式下，如果你想在开始售卖后增加供货价，需要通过核价申诉流程来处理。\\n\\n具体操作要求如下：\\n1. 提交申诉：你需要向平台发起核价申诉，并说明调价的原因。\\n2. 后台修改：无论是哪一种申诉原因，如果你的新报价不等于初始供货报价，你必须在申诉表内填写新供货价，并且在后台同步修改价格。\\n3. 操作路径：在 listing management 页面，点击需要修改的商品标题，进入详情页面修改价格即可。\\n4. 审核机制：核价团队会根据你提供的新供货价进行重新评估。如果新价格超出了平台的接受范围，申诉可能不会通过。\\n\\n请注意，核价团队只有在看到你在后台已经完成了价格修改后，才会开始处理你的申诉。建议在调整价格前充分考虑成本和市场竞争力。\",\"一级大类\":\"其他\",\"二级子类\":\"其他\",\"问题主题\":\"其他具体问题\"},{\"时间\":\"2026-07-22 21:14:22\",\"用户\":\"荣\",\"群\":\"\",\"用户问询\":\"全托管对我们工厂很友好 不需要我们运营店铺\",\"AI响应\":\"是的，全托管模式非常适合工厂型卖家。您只需负责供货，平台会全权负责店铺运营、翻译上架、物流配送、营销推广及售后服务，实现真正的“拎包出海”。\\n\\n该模式亮点包括：\\n1. 0佣金、0仓储费、0国际运费、0广告费。\\n2. 妥投后7个工作日回款。\\n3. 官方流量扶持及专属选品建议。\\n\\n入驻详情可参考：\\nhttps://file.marsmind.cc/boot-admin/mercado/20260306/2029****0594.png\\nhttps://file.marsmind.cc/boot-admin/mercado/20260306/2029****4562.png\",\"一级大类\":\"其他\",\"二级子类\":\"其他\",\"问题主题\":\"其他具体问题\"},{\"时间\":\"2026-07-22 19:42:19\",\"用户\":\"肖丽娟｜Sherilyn@大数跨境\",\"群\":\"\",\"用户问询\":\"半托管模式和FTI模式有什么区别\",\"AI响应\":\"你好！很高兴为您解答。半托管模式和FTI模式虽然都涉及国内集运，但在备货逻辑和运营细节上存在区别：\\n\\n1. 备货逻辑：\\n- 半托管模式：属于“先备货后出单”。商家需要提前将货物备货至美客多国内东莞仓，出单后由平台直接从东莞仓发货。\\n- FTI模式：属于“先出单后发货”。产品先上架销售，产生订单后，商家需在48小时内将货物发往国内集运中心。\\n\\n2. 定价模式：\\n- 半托管模式：采用收益价格模式（Net Proceeds）。商家只需设置想要获得的收益（供货价），平台在前端自动计算并展示包含佣金和运费后的售价。\\n- FTI模式：商家拥有完全的自主定价权，自行设置前端销售价格。\\n\\n3. 流量与标识：\\n- 半托管模式：产品上架即自带“Full”标，享受顶级的流量扶持和搜索权重。\\n- FTI模式：作为平台VIP项目，享受佣金补贴和流量扶持，但物流标识与半托管有所不同。\\n\\n4. 适合对象：\\n- 半托管模式：适合希望通过预备货模式获得Full标流量，且希望简化运费计算的卖家。\\n- FTI模式：适合具备强大供应链响应能力，能在出单后快速发货的工贸一体卖家。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"其他\",\"二级子类\":\"其他\",\"问题主题\":\"其他具体问题\"},{\"时间\":\"2026-07-22 19:24:06\",\"用户\":\"荣\",\"群\":\"\",\"用户问询\":\"全托管怎么操作\",\"AI响应\":\"你好！全托管模式申请请统一提交此表单：http://kks.ink/ss/vKx9ph/d12030。\\n\\n全托管模式下，商家仅需负责供货，平台负责运营、定价、物流及售后。要求单店年均流水大于30万美金，具备中国大陆或香港营业执照。\\n\\n入驻详情及资质要求可参考：\\nhttps://file.marsmind.cc/boot-admin/mercado/20260306/2029****5153.png\\nhttps://file.marsmind.cc/boot-admin/mercado/20260306/2029****6050.png\",\"一级大类\":\"账号入驻与安全\",\"二级子类\":\"入驻流程\",\"问题主题\":\"入驻/注册/开店流程\"},{\"时间\":\"2026-07-22 17:51:19\",\"用户\":\"NPT\",\"群\":\"\",\"用户问询\":\"半托管模式哦\",\"AI响应\":\"你好！半托管模式下，商家只需负责选品、上架和备货至国内东莞仓。后续的国际物流、清关及海外末端派送均由美客多官方负责。\\n\\n半托管操作手册：\\nhttps://doc.weixin.qq.com/pdf/d3_AeUAKQZ0AE0CNw9Z7ruq1TvaWuUBI?scode=AI8A3wfvAAoXASq866AesAUQYKAOE\",\"一级大类\":\"其他\",\"二级子类\":\"其他\",\"问题主题\":\"其他具体问题\"},{\"时间\":\"2026-07-22 17:00:34\",\"用户\":\"95后一场梦\",\"群\":\"\",\"用户问询\":\"怎么看目前处于半托管模式 还是全托管模式\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n要区分全托管和半托管模式，最直接的方法是看你的**定价权**和**佣金政策**：\\n\\n1. **看定价权**：\\n- **全托管**：你只需要提供供货价，最终在平台上卖多少钱是由美客多官方决定的，你无法在后台直接修改前台售价。\\n- **半托管**：你可以像普通卖家一样，在后台自主设置和修改产品的销售价格。\\n\\n2. **看佣金和费用**：\\n- **全托管**：享受“四零”政策，即 0 佣金、0 仓储费、0 国际运费、0 广告费。\\n- **半托管**：需要缴纳佣金（但通常有 50% 的佣金减免），且需要承担国内段物流费用。\\n\\n3. **看后台操作**：\\n- **全托管**：商家主要负责“供货”，操作核心在确认系统推送的补货计划。\\n- **半托管**：商家需要负责“运营”，包括上架、优化链接、自主参与促销活动等。\\n\\n从你之前的截图来看，你的收货地址是东莞集运仓，且系统在自动为你推送补货建议（配送计划），这非常符合**全托管**或**半托管**的特征。如果你完全不需要管定价和广告，那就是全托管；如果你还在自己调价，那就是半托管。\",\"一级大类\":\"其他\",\"二级子类\":\"其他\",\"问题主题\":\"其他具体问题\"},{\"时间\":\"2026-07-22 16:26:52\",\"用户\":\"🍿\",\"群\":\"\",\"用户问询\":\"全托管模式介绍\",\"AI响应\":\"美客多全托管模式是一种零门槛、零运营、零广告的出海合作方式，专为中国制造企业打造，帮助卖家轻松进入拉美市场。\\n\\n【核心逻辑】\\n商家只需负责供货，平台负责运营、定价、物流、营销、售后等全流程。\\n\\n【模式亮点】\\n1. 全链路0费用：0平台佣金、0店铺年费、0仓储费、0国际物流费、0广告费、0保证金。\\n2. 快速回款：订单妥投后7个工作日回款。\\n3. 顶级流量：专属全托管流量阵地，官方Full标引流，直通MELI Selection活动专场。\\n4. 专业运营：无需组建运营团队，由平台负责商品上架、链接优化及活动提报。\\n\\n【资质要求】\\n1. 主体资质：拥有中国大陆/香**公司营业执照。\\n2. 业绩要求：跨境电商单店年均流水 ＞30万美金。\\n3. 供货能力：具备绝对价格竞争力，首单建议≥5-10件/SKU，补货周期≤15天。\\n\\n【适合商家】\\n1. 工厂型卖家（优先）：自有生产线，具备研发能力，成本优势明显。\\n2. 品类贸易商/托盘商：产业带资源丰富，现货产品多，具备库存深度。\\n3. 品牌型供应商：国内或跨境知名品牌，愿意以供货模式拓展拉美市场。\\n\\n【站点覆盖】\\n墨西哥、巴西、智利、哥伦比亚、阿根廷。\\n\\n入驻方法及详情可参考以下图片：\\nhttps://file.marsmind.cc/boot-admin/mercado/20260306/2029****5153.png\\nhttps://file.marsmind.cc/boot-admin/mercado/20260306/2029****6050.png\",\"一级大类\":\"其他\",\"二级子类\":\"其他\",\"问题主题\":\"其他具体问题\"},{\"时间\":\"2026-07-22 15:37:39\",\"用户\":\"門僧.\",\"群\":\"\",\"用户问询\":\"怎么看自己的店铺是不是全托\",\"AI响应\":\"从你提供的图片内容来看，这显示的是普通跨境店铺（自发货/海外仓模式）的开通成功提示。\\n\\n图片中明确提到了“上传至少10件商品”、“准备好您的备货/入仓”、“使用卖家中心的库存管理模块”以及“优化您的商品”，这些都是普通跨境店铺自主运营的 量。\\n2. 按照平台要求打印并粘贴商品标签及外箱标签。\\n3. 卖家自费将货物发送至美客多指定的中国国内集运仓。\\n4. 仓库签收并核对货物，后续的国际物流、清关及末端派送由平台负责。\\n\\n请确保发货信息与系统申报一致，避免因差异导致拒收。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-22 19:21:32\",\"用户\":\"🍿\",\"群\":\"\",\"用户问询\":\"全托管有jit模式吗？\",\"AI响应\":\"这边托管没有JIT\",\"一级大类\":\"其他\",\"二级子类\":\"其他\",\"问题主题\":\"其他具体问题\"},{\"时间\":\"2026-07-22 16:37:40\",\"用户\":\"ぅ Oath°3 jin\",\"群\":\"\",\"用户问询\":\"你好，问下，美客多半托管，囤货需要贴标签吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n在美客多半托管模式下，囤货入仓是必须贴标签的。具体的贴标要求如下：\\n\\n1. 商品标签（SKU LABEL）：每个最小销售单位的产品包装上都需要粘贴对应的商品标签，以便仓库识别单品。\\n\\n2. 箱子标签（Mercado Libre 箱子标签）：在发货时，你需要根据系统中填写的准确箱数，打印并粘贴唯一的箱子标签。请注意，箱子标签不同于产品标签，它是用于识别整个货件的，每个标签代码都是唯一的。\\n\\n3. 粘贴要求：标签必须贴在包装平整的一面，严禁折叠、弯曲或贴在封口处，确保条形码清晰可扫描。\\n\\n目前平台没有提供代贴标签的增值服务，如果入仓件出现未贴标签等异常情况，可能会导致拒收或无法上架，请务必在发货前检查完毕。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-22 15:49:18\",\"用户\":\"Nini\",\"群\":\"\",\"用户问询\":\"全托管国内段运费 不是免费上门揽收的吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n全托管模式目前没有上门揽收服务。商家需要自己负责将货物发送至平台指定的国内集货仓（东莞仓），并承担这段国内物流费用。\\n\\n目前全托管和半托管模式的国内集货仓地址如下：\\n寄送地址/联系人：广东省东莞市沙田镇进港南路第一产业园205号库台\\n联系人：叶宗虎 180****3509\\n可接受货物时间：周一至周日，9:00am-18:00pm\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-22 13:31:05\",\"用户\":\"Xiyunfei05\",\"群\":\"\",\"用户问询\":\"半托包装\",\"AI响应\":\"半托管包装要求如下：\\n1. 必须使用半透明包装完全覆盖产品。\\n2. 标签尺寸：SKU LABEL为7*2.2cm，BAG LABEL为10*15cm。\\n3. 单箱内有多个SKU时，需在箱内做好物理隔离。\\n4. 外箱需贴IC单（bag label），箱内建议多放一张以防掉落。\\n5. 包装外部需标注通用代码或可见的产品标签。\\n\\n网页参考资料：\\nhttps://doc.weixin.qq.com/pdf/d3_AeUAKQZ0AE0CNw9Z7ruq1TvaWuUBI?scode=AI8A3wfvAAoXASq866AesAUQYKAOE\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-22 11:58:49\",\"用户\":\"Xiyunfei05\",\"群\":\"\",\"用户问询\":\"半托发往东莞集中仓的数量和包装要求\",\"AI响应\":\"半托管发货包装要求如下：\\n\\n1. 标签尺寸：BAG LABEL为10*15cm，SKU LABEL为7*2.2cm。\\n2. 装箱要求：中小型产品建议装箱，箱内混装不得超过5种产品，空隙需填充。单箱内有多个SKU时需做好物理隔离。\\n3. 粘贴要求：外箱需贴快递面单及IC单（bag label），箱内需多放一张IC单。标签需贴在平整表面，避开开口和折叠处。\\n4. 尺寸限制：单件重量小于15kg，任一边长小于60cm，三边总和小于或等于135cm。\\n\\n网页参考资料：\\nhttps://doc.weixin.qq.com/pdf/d3_AeUAKQZ0AE0CNw9Z7ruq1TvaWuUBI?scode=AI8A3wfvAAoXASq866AesAUQYKAOE\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-22 11:54:58\",\"用户\":\"Xiyunfei05\",\"群\":\"\",\"用户问询\":\"半托运费\",\"AI响应\":\"半托管模式下，国际段物流由平台负责，运费由平台直接进行前端售价藏价。商家采用收益价格模式（NetProceeds）定价，只需设置想要获得的收益（商家供货价），无需人工计算国际运费。\\n\\n网页参考资料：\\nhttps://global-selling.mercadolibre.com/help/17557\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-21 23:55:47\",\"用户\":\"😶 ＇\",\"群\":\"\",\"用户问询\":\"美客多半托管退货 需要退运费嘛\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n在美客多半托管模式下，买家是可以发起退货的。关于退货费用的承担规则如下：\\n\\n1. 退货运费：退货产生的费用由商家承担。\\n2. 发货运费：原订单发货时产生的运费通常是不予退还的。\\n3. 其他费用：如果商品因为损坏等原因选择弃置，会产生弃置费。此外，已经发生的广告费和固定处理费通常也不会退还。\\n\\n售后环节由平台统一处理，商家无需介入。退回的商品会由平台评估是退仓还是销毁。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-21 19:29:59\",\"用户\":\"wong\",\"群\":\"\",\"用户问询\":\"半托管和自发货的国际段运费，平台自动叠加运费生成前端售价，不另外收取是吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n是的，半托管和自发货都采用收益价格模式（NetProceeds）。您只需设置想要获得的收益（成本+利润），平台系统会自动叠加国际运费和佣金生成前端售价。\\n\\n这意味着国际运费已包含在买家支付的价格中，由平台直接在前端藏价，不需要您在结算后再额外支付。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-21 18:58:42\",\"用户\":\"wong\",\"群\":\"\",\"用户问询\":\"自发货是48小时发至国内菜鸟仓，后面不用管了吗，那为什么还有国家运费？ 全托管/半托管是否核价，半托管模式的自主定价，是定前端价格吗 这些模式，如果产生售后问题怎么处理，例如刚发货出来客人取消订单，谁来承担\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n1. 自发货：您只需负责发货至国内菜鸟仓，后续国际段由平台承运，但国际运费由您承担。系统会自动在您的收益价上叠加运费生成前端售价。\\n\\n2. 全托管/半托管：\\n- 全托管：需要核价，您提报供货价，平台拥有最终定价权。\\n- 半托管：不核价，您自主设置“收益价格”（即您想拿到的钱），平台自动叠加佣金和运费生成前端售价，您不直接定前端价。\\n\\n3. 售后处理：\\n- 自发货：若货物未出境，可联系物流拦截，运费损失通常由卖家承担。\\n- 全托管/半托管：由平台负责本地售前售后。若因非质量问题产生的退换货，由平台承担相关责任和费用。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-21 16:54:01\",\"用户\":\"😶 ＇\",\"群\":\"\",\"用户问询\":\"半托管有些listing没发货 放在那里 有影响吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n针对半托管模式，如果Listing没有发货且一直放在那里，会有以下影响：\\n\\n1. 权重下降：拥有稳定的初始库存能显著提升店铺权重。如果Listing长期无库存，系统会将其标记为“无库存”，这会降低链接的曝光优先级。\\n\\n2. 算法失效：广告算法和动销测试需要库存支持。如果一直不发货，Listing的权重会迅速下降，后续补货后广告算法也需要重新累计，直接影响单量。\\n\\n3. 系统推单提醒：如果这些Listing已经产生了待发货订单或系统补货建议，您需要及时处理。如果确定原链接不会发货，请删除，否则系统会一直推单。\\n\\n建议针对半托管新品，首批入库不少于10-15个SKU，单个SKU准备10-20件，以满足系统初步的动销测试需求。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-21 14:57:55\",\"用户\":\"悠\",\"群\":\"\",\"用户问询\":\"为什么半托不同类目的运费同体积重量会有很大的差异\",\"AI响应\":\"你好！很高兴为你解答。运费是根据商品的实际重量（含包装）或体积重计算的。每次运费价格可能不同，具体取决于商品的尺寸和配送时效。此外，6月份起300g以上产品按体积重计费，建议优化包装以降低成本。\",\"一级大类\":\"产品管理\",\"二级子类\":\"类目咨询\",\"问题主题\":\"类目/产品能否售卖\"},{\"时间\":\"2026-07-21 11:48:03\",\"用户\":\"爱吃狗子的喵\",\"群\":\"\",\"用户问询\":\"我是半托管商家，为啥有有尾程的付款账单明细\",\"AI响应\":\"你好，很高兴为你解答。\\n\\n在半托管模式下，定价采用的是收益价格模式（NetProceeds）。商家设置的是想要获得的收益（商家供货价），而平台会将佣金和尾程运费进行前端售价藏价，由平台统一计算并展示给消费者。\\n\\n账单中出现 shipping 明细，通常是由于系统的展示逻辑，为了对应前端售价中的组成部分。对于半托管商家，这些费用并不会从你提报的期望收益价格中扣除。\\n\\n建议你核对账单中的最终结算金额，是否与你提报的收益价格一致。如果产生退仓，商家才需要额外承担退仓费用。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-20 20:58:52\",\"用户\":\"张锦程\",\"群\":\"\",\"用户问询\":\"然后之前在跨境平台并没有那个流水，那我想做那个全托管模式，是不是想就是发货是在我这里发的那个模式？是怎么怎么弄？\",\"AI响应\":\"你好！全托管模式要求提供跨境电商单店年流水大于30万美金的证明。该模式下，您只需负责供货，将货物发至平台指定的国内集货仓（东莞仓），后续的运营、定价、国际物流及售后均由平台负责。\\n\\n若您没有相关流水，建议先通过自注册尝试普通自发货或海外仓模式，这类模式目前不需要流水。\\n\\n普通自发货/海外仓自注册链接：https://global-selling.mercadolibre.com/landing/about\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-20 16:03:48\",\"用户\":\"Ryan\",\"群\":\"\",\"用户问询\":\"美客多全托和半托的运费是一致的啊\",\"AI响应\":\"半托管和全托管模式下，商家均无需承担国际段和尾程运费。定价时仅需设置期望的净收益，即供货价，平台会自动在前端售价中叠加佣金和运费。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-20 15:42:13\",\"用户\":\"大关关\",\"群\":\"\",\"用户问询\":\"半托管物流清关怎么收费\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n在美客多半托管模式下，国际段物流（包含清关及海外末端派送）由平台负责，运费由平台直接进行前端售价藏价，不需要商家额外支付。\\n\\n商家在定价时，采用的是收益价格模式（Net Proceeds）。你只需要设置想要获得的收益，即：\\n收益价格 = 单件货物成本 + 您的目标利润 + 单件国内发货到东莞仓的物流成本（需转化成美元填写）。\\n\\n你不需要人工计算并加入国际运费、清关费和佣金，平台系统会自动叠加这些费用生成最终的前端售价展示给消费者。\\n\\n此外，关于墨西哥站点的税费，半托管模式下是代扣代缴的。卖家在定价时不包含税费，最终前端显示给消费者的价格是包含税费的，税费由买家承担。平台不会对半托管卖家进行36%的增值税和所得税代扣，且该模式不需要RFC税号。\\n\\n网页参考资料：\\n美客多半托管模式全解析：https://university.mercadolibre.com/courses/half-managed-model-intro\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-20 14:36:31\",\"用户\":\"奶黄包💰\",\"群\":\"\",\"用户问询\":\"全托平台仓发货错误该怎么弄\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n针对全托管平台仓发货错误（如买家反馈收到错误商品），请按以下方式处理：\\n\\n1. **及时响应纠纷**：点击截图中的 **Respond to complaint**，在回复中说明该订单由平台仓库（FULL）负责拣货与发货，并非卖家发货错误。\\n2. **申请平台介入**：在回复选项中，选择与“平台配送问题”相关的申诉理由，请求平台客服介入核实仓库发货记录。\\n3. **核查库存**：建议同步核查该 SKU 在仓库的库存是否存在贴错标或混装情况，避免后续订单再次出现同样问题。\\n\\n由于全托管订单的物流和发货由平台全权负责，此类纠纷通常不会计入您的店铺信誉指标，但仍需在规定时间内完成系统响应。\",\"一级大类\":\"其他\",\"二级子类\":\"系统报错\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-20 13:40:06\",\"用户\":\"Aurora\",\"群\":\"\",\"用户问询\":\"半托管发货最外层包装能不能用麻袋\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n在半托管模式下，发货是可以接受使用袋子（如麻袋、快递袋）发货的。\\n\\n但请务必遵循以下要求：\\n1. 标签粘贴：同样需要粘贴好对应的商品标签（SKU LABEL）和箱唛/袋标（BAG LABEL）。\\n2. 保护性：虽然可以使用袋子，但需确保袋内的商品在运输过程中不会受损。\\n3. 标签清晰：确保标签平整、清晰，能够被仓库正常扫描。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-20 11:35:56\",\"用户\":\"栩\",\"群\":\"\",\"用户问询\":\"半托运费是高于多少g记抛重\",\"AI响应\":\"半托管模式下，商品重量在300g及以上按照体积重计费，300g以下产品运费通常更便宜。建议您优化件重尺，更改后需登记并通知仓库重新称重。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"}]},{\"业务模块\":\"托管\",\"高频问题\":\"入仓/入库/库存/库容\",\"Past 7 Days\":26,\"Previous\":19,\"WoW\":0.3684210526315789,\"代表性问询\":\"半托管是出单再备货吗\",\"Past 7 Days代表性问询\":\"半托管是出单再备货吗\",\"Previous代表性问询\":\"半托是把货发到你们东莞的仓库吗\",\"__details\":[{\"时间\":\"2026-07-26 13:33:05\",\"用户\":\"时倾\",\"群\":\"\",\"用户问询\":\"可以不用备货走JIT模式吗 全托\",\"AI响应\":\"美客多全托管模式目前不支持JIT发货。全托管是先核价完成，系统下发PO单后，您再根据订单要求备货至国内集货仓。\",\"一级大类\":\"其他\",\"二级子类\":\"其他\",\"问题主题\":\"其他具体问题\"},{\"时间\":\"2026-07-26 11:58:22\",\"用户\":\"夏天的风\",\"群\":\"\",\"用户问询\":\"全托上品库存上架都填0吧\",\"AI响应\":\"全托管模式下，商家不需要自己上架商品，平台会负责商品上架及全流程操作。关于库存，全托管模式是由平台根据算法和销售情况进行管理，无需卖家自行填写。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-25 15:50:23\",\"用户\":\"夏天的风\",\"群\":\"\",\"用户问询\":\"哦 我就是没地方填 我需要去找第三方对应的仓库的地址和收货人啊 全托管的也是必须的哇\",\"AI响应\":\"是的，全托管也是必须填写的。如果退货地址留空，退货商品在仓库保留20天后若无人提取，将被自动捐赠或销毁。建议联系第三方服务商获取当地地址。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-25 11:21:16\",\"用户\":\"彬\",\"群\":\"\",\"用户问询\":\"我们是把货发到东莞仓的半托管模式\",\"AI响应\":\"你好！很高兴为你解答。发货到东莞仓的半托管模式不需要办理墨西哥RFC税号，平台也不会对半托管卖家进行36%的增值税和所得税代扣。\",\"一级大类\":\"其他\",\"二级子类\":\"其他\",\"问题主题\":\"其他具体问题\"},{\"时间\":\"2026-07-24 11:28:40\",\"用户\":\"鱼\",\"群\":\"\",\"用户问询\":\"全托滞销剩下的库存怎么处理\",\"AI响应\":\"你好！很高兴为你解答。库存退出机制如下：入库30天无动销可能面临退仓或清货处理。7天销量为0或14天销量低的SKU也可能被清退。退仓费用由商家承担。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-24 11:11:58\",\"用户\":\"鱼\",\"群\":\"\",\"用户问询\":\"全托滞销剩下的库存谁承担费用\",\"AI响应\":\"你好！很高兴为你解答。全托管模式下，滞销商品的退仓费用由商家承担。若选择退货，目前只能销毁或退回海外，无法退回国内。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-24 10:36:30\",\"用户\":\"阿ken\",\"群\":\"\",\"用户问询\":\"半托管是出单再备货吗\",\"AI响应\":\"不是的。半托管需要提前备货到美客多东莞仓库。您可以自行决定发货日期并创建发货单，出单后由平台承运商统一派送。针对新品，建议每个SKU首单备货5-10件。\",\"一级大类\":\"其他\",\"二级子类\":\"其他\",\"问题主题\":\"其他具体问题\"},{\"时间\":\"2026-07-24 07:55:43\",\"用户\":\"Aurora\",\"群\":\"\",\"用户问询\":\"全托管模式下，没有派发备货单，商家可以自己申请发送库存吗\",\"AI响应\":\"你好！很高兴为你解答。  \\n\\n根据全托管模式的发货规则：**如果系统未推送备货计划，商家无法手动申请发货单**，因此不能自行发送库存。  \\n\\n只有在收到平台推送的备货计划后，商家才能按照计划将货物发送至指定的国内集货仓（广东省东莞市沙田镇进港南路第一产业园205号库台）。若未收到备货计划，建议先检查后台“商品管理-海外仓库存管理-配送计划”是否有更新，或联系招商经理确认是否需要补充备货信息。  \\n\\n全托管模式的库存发送需严格遵循平台推送的备货计划，不可擅自发货。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-23 17:43:56\",\"用户\":\"Susan\",\"群\":\"\",\"用户问询\":\"香**公司主体申请全托管或者是半托管，是不是也和国内主体申请的托管店铺一样，把货发到国内的仓库，还是会要求发到香港托管仓库？\",\"AI响应\":\"是的，香**公司主体申请全托管或半托管，货物同样需发送至国内东莞集货仓（广东省东莞市沙田镇进港南路第一产业园205号库台），流程与国内主体一致。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-23 16:02:53\",\"用户\":\"李鸿\",\"群\":\"\",\"用户问询\":\"做半托只需把货寄到东莞仓。需不需要打好面单先再寄？\",\"AI响应\":\"自寄到仓的话，外箱需要贴上快递面单以及IC单（bag label），IC单（bag label）需要在箱内多放一张，避免运输途中外标掉落；自送到仓的话，外箱贴IC单（bag label）即可。标签尺寸要求：BAG LABEL为10*15cm，SKU LABEL为7*2.2cm，单箱内有多个SKU时要做好物理隔离。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-23 13:17:29\",\"用户\":\"vjh\",\"群\":\"\",\"用户问询\":\"自发货仓库和半托仓库地址一致吗\",\"AI响应\":\"自发货仓库和半托管仓库地址不一致。  \\n自发货物流由菜鸟承接，自寄仓库地址需以菜鸟官方最新地址列表为准（可通过卖家后台查看或访问：https://global-selling.mercadolibre.com/help/cainiao-warehouses-drop-off_36979）；  \\n半托管仓库地址为：广东省东莞市沙田镇进港南路第一产业园**[或周大福物流东莞物流中心]** 205号库台（需以官方最新通知为准，但核心地址一致区域为东莞沙田镇）。  \\n\\n两者仓库独立，请勿混装揽收（半托管不可与普通自发货货物混装）。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-23 12:06:24\",\"用户\":\"ricky\",\"群\":\"\",\"用户问询\":\"你好，请问下，半托管模式下，单个商品有3~5台库存的情况下，自然流量会不会变少？如果此时补库存到10台以上，流量会不会更好？\",\"AI响应\":\"你好！半托管模式下，单个商品库存3-5台可能会影响自然流量。因为库存不足时，系统会将商品标记为“临界”或“无库存”状态，降低链接的曝光优先级，导致自然流量减少。  \\n\\n如果补库存到10台以上，商品库存状态更稳定，能满足系统初步动销测试的需求，帮助提升自然流量。不过具体流量变化还和商品本身的动销数据、类目竞争等因素有关，建议结合后台库存绩效指标持续优化库存策略。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-23 11:29:36\",\"用户\":\"治酉\",\"群\":\"深圳市百舸争流网络技术有限公司\",\"用户问询\":\"那这个半托和TEMU 全托有点像 那我们墨西哥本地有库存的产品，是可以做什么呢？能上半托吗？\",\"AI响应\":\"墨西哥本地有库存的产品，若要参与半托管，需按要求将货物发至美客多指定海外仓（如东莞仓），具体以平台最新指引为准。也可结合库存位置及平台规则选择其他运营模式。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-23 11:01:40\",\"用户\":\"Eason\",\"群\":\"\",\"用户问询\":\"美客多半托管仓库上班时间\",\"AI响应\":\"美客多半托管仓库的上班时间为周一至周日，上午9:00至下午18:00。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-23 09:27:10\",\"用户\":\"圣斗土\",\"群\":\"\",\"用户问询\":\"半托管库存卖完了，系统会自动下单过来吗\",\"AI响应\":\"你好！半托管模式下库存卖完后，系统不会自动下单补货，需您在后台手动补货上架，确保库存充足。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-22 16:37:53\",\"用户\":\"Zeke郑\",\"群\":\"\",\"用户问询\":\"那我半托如何提升库容\",\"AI响应\":\"半托管模式提升库容主要通过以下方式：\\n\\n1. 提升账号表现：半托管的上品额度与您的账号表现密切相关。建议您专注提升订单履约率、销售业绩以及保持良好的店铺信誉等级。\\n\\n2. 联系买手申请：如果您的账号表现良好，且现有的上品额度已无法满足发货需求，可以主动联系对接的买手申请扩容。\\n\\n3. 优化寻品清单：半托管的额度主要与入驻时沟通的寻品清单相关，确保您的产品符合平台需求，有助于获得更多额度支持。\\n\\n4. 关注IPI分数：虽然半托管有其特定的额度限制，但保持IPI分数在绿色状态（通常建议大于70分）是所有模式下申请额外支持的重要参考指标。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-22 16:34:53\",\"用户\":\"Zeke郑\",\"群\":\"\",\"用户问询\":\"半托管的库容问题 可以购买吗 新手多少 受到ipi3.0影响吗\",\"AI响应\":\"关于半托管模式的库容问题，解答如下：\\n\\n1. 库容限制：半托管模式下有上品额度限制，每个店铺初始通常为100个listing限制，每个listing下建议不超过5个sku。这主要与您入驻时与买手沟通的寻品清单相关。\\n\\n2. 库容申请与购买：目前半托管模式的库容主要通过联系对接的买手申请扩容，前提是账号表现良好。关于“购买库容”功能，目前主要针对墨西哥海外仓中IPI处于红色或黄色状态且库容不足的卖家，半托管模式是否适用请以您的后台显示或买手通知为准。\\n\\n3. 新手库容：新卖家的大件商品初始库容配额通常为1,000件。\\n\\n4. IPI影响：半托管模式的库容和上品额度受账号表现影响。虽然IPI 3.0主要针对海外仓（FULL）模式的库存健康度进行考核，但良好的店铺信誉和动销表现始终是申请扩容的基础。\\n\\n网页参考资料\\nWhat are the listing limits?（https://global-selling.mercadolibre.com/help/21423）\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-21 22:27:48\",\"用户\":\"￴ ￴￴ ￴￴\",\"群\":\"\",\"用户问询\":\"半托管不同站点备货计划是要分别点击吗，还是说我点击一个备货计划，其它站点也会同步库存\",\"AI响应\":\"你好！很高兴为你解答。备货到仓的库存是各站点共享的，你不需要为不同站点分别创建备货计划。库存入库后，系统会自动同步到各站点。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-21 21:52:12\",\"用户\":\"门\",\"群\":\"\",\"用户问询\":\"美客多是可以备货到美国仓做半托嘛 有要求什么吗\",\"AI响应\":\"你好！很高兴能为你解答。\\n\\n美客多确实有美国转运仓（美仓）模式，但它与半托管模式是两种不同的业务类型，目前并不存在“备货到美国仓做半托”的组合模式。\\n\\n关于美国转运仓（美仓）模式的核心要求如下：\\n1. 模式逻辑：卖家备货至美客多位于美国德克萨斯州的官方仓库。出单后由平台负责跨境配送至墨西哥、巴西、智利、阿根廷、哥伦比亚等站点。\\n2. 核心优势：不需要提供销售国的RFC税号，进口税费由买家承担，有效规避税务风险。\\n3. 入驻要求：\\n- 必**有限公司营业执照（不接受个体户）。\\n- 法人需配合人脸识别。\\n- 需提供非美国境内的美元（USD）收款账户。\\n- 建议使用Gmail、Outlook等海外邮箱。\\n4. 备货建议：首批入库建议不少于10-15个SKU，单个SKU准备10-20个单位。\\n\\n而半托管模式目前是要求卖家将货物备货至中国国内的东莞仓，由美客多承运物流商统一派送。\\n\\n如果你想通过美国转运仓模式起步，建议采取多款式、轻库存的策略来快速测款。\",\"一级大类\":\"其他\",\"二级子类\":\"政策咨询\",\"问题主题\":\"平台政策/官方规则\"},{\"时间\":\"2026-07-21 21:17:04\",\"用户\":\"Y.D\",\"群\":\"\",\"用户问询\":\"您好，我已提交申请，但是我们的银行流水都是线下的，基本上每年都会有100多万美金的流水，我们是纯出口贸易商，有自己的工厂和仓库，也是广交会的特约企业，每年都会免费给我们2个展位。我们的履约和供货能力肯定没问题，目前唯一缺乏的就是线上经验，不知道能否与美客多合作，我们已经注册一个美客多的自发货店铺，但是其实我们企业最适合的就是全托管或者半托管，只有这两个业务才能把我们的优势发挥出来，随时欢迎贵司的招商经理莅临考察。\",\"AI响应\":\"你好！非常欢迎像您这样有实力的工贸一体企业。\\n\\n针对您的情况，建议如下：\\n\\n1. **关于流水要求**：全托管和半托管模式目前有硬性的线上平台流水门槛（单店年均超30万美金）。由于您目前缺乏线上经验，建议先通过已注册的自发货或海外仓模式积累线上运营数据。\\n\\n2. **合作路径**：您可以先利用现有的自发货店铺进行测款，积累一定的线上销售记录。当店铺表现优异或您在其他跨境平台积累了达标流水后，可申请转入托管模式。\\n\\n3. **经理对接**：若您的海外仓店铺周GMV达到***美金，可以通过以下链接申请专属经理扶持，届时可进一步沟通考察事宜：https://mp.weixin.qq.com/s/SOextL25EnZqMxGr09tSWQ\",\"一级大类\":\"账号入驻与安全\",\"二级子类\":\"入驻流程\",\"问题主题\":\"入驻/注册/开店流程\"},{\"时间\":\"2026-07-21 19:21:35\",\"用户\":\"wong\",\"群\":\"\",\"用户问询\":\"全托管/半托管备货至国内仓商品是否要贴标签，自发货到国内仓的商品是否贴标签\",\"AI响应\":\"全托管/半托管：必须贴标。外箱贴BAG LABEL（10*15cm），产品贴SKU LABEL（7*2.2cm）。自寄需在箱内多放一张IC单。\\n\\n自发货：必须贴标。您需在后台下载并打印物流面单，粘贴在包裹外层后发送至菜鸟集运仓。\\n\\n注意：全托管/半托管货物严禁与自发货货物混装，否则仓库无法接收。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-21 19:16:34\",\"用户\":\"wong\",\"群\":\"\",\"用户问询\":\"全托管/半托管，一般备货多少数量，是否有备货时效考核\",\"AI响应\":\"全托管/半托管备货要求如下：\\n\\n1. 备货数量：新品首单建议每个SKU备货5-10件。产生动销后，系统会根据销量预估给出补货建议范围。\\n2. 时效考核：半托管模式下，创建发货单后需在3天内送达国内仓。平台会考核履约时效和到货满足率。\\n\\n全托管目前只能按系统推送的计划备货，半托管可直接上架备货。\",\"一级大类\":\"其他\",\"二级子类\":\"其他\",\"问题主题\":\"其他具体问题\"},{\"时间\":\"2026-07-20 16:21:52\",\"用户\":\"ㅤㅤㅤ\",\"群\":\"\",\"用户问询\":\"全托管订单投诉，客户退货后是到官方仓库还是自己的仓库\",\"AI响应\":\"当买家发起退货后，商品会退回到美客多官方仓库。\\n\\n仓库会对退回商品进行质检：\\n- 若品相完好、包装完整：系统会自动将其重新计入可售库存并再次上架销售。\\n- 若判定损坏或已使用：商品将被标记为“不可售库存”。您需要通过后台预约提取（Pick Up）到当地第三方仓，或者在规定时间内未提取则由平台捐赠或销毁。\\n\\n目前全托管模式下，仓库不收取仓储费或退货运费，但若涉及退仓操作，需要商家自行安排提货。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-20 16:05:35\",\"用户\":\"Ryan\",\"群\":\"\",\"用户问询\":\"我的意思是全托和半托从菜鸟仓库寄送到顾客手中的运费\",\"AI响应\":\"全托管和半托管模式下，商家仅需负责将货物发往美客多国内东莞集运仓，国内段运费由商家承担。从集运仓寄送到海外顾客手中的国际物流及尾程运费均由平台承担。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-20 14:36:29\",\"用户\":\"梁海波\",\"群\":\"\",\"用户问询\":\"半托管和全托管怎么定价，备货，发货，退货 有教程吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n**1. 定价模式**\\n*   **半托管：** 收益价格模式（Net Proceeds）。你只需设置期望获得的收益（供货价），平台会自动计算并加上佣金和运费进行前端藏价。\\n*   **全托管：** 供货价模式。你提报期望收益价格，建议比市场价低15%以上。\\n\\n**2. 备货与发货**\\n*   **备货：** 半托管由商家自主下单备货；全托管由系统推单，核价完成后发PO单再备货。\\n*   **发货：** 两者均需发货至美客多国内东莞集运仓。你负责国内段物流，国际物流和尾程派送由平台负责。\\n\\n**3. 费用**\\n*   **半托管：** 收取8%佣金（享50%减免），目前免仓储费。\\n*   **全托管：** 0佣金、0仓储费、0国际运费、0广告费。\\n\\n**网页参考资料**\\n美客多半托管模式全解析：https://mercadolibre.cn/news/info?id=215\\u0026type=live\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流发货\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-20 09:57:24\",\"用户\":\"呢呢\",\"群\":\"\",\"用户问询\":\"半托管店铺首单申请备货后需要多久之内到达仓库\",\"AI响应\":\"半托管发货后，仓库接收并上架通常需要2-3天。建议您在创建发货单后尽快发货，以确保商品及时入仓上架。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"}]},{\"业务模块\":\"托管\",\"高频问题\":\"上架/链接/SKU/变体/寄样\",\"Past 7 Days\":23,\"Previous\":24,\"WoW\":-0.041666666666666664,\"代表性问询\":\"全托管需要上架产品吗\",\"Past 7 Days代表性问询\":\"全托管需要上架产品吗\",\"Previous代表性问询\":\"这个链接是全托管的吗\",\"__details\":[{\"时间\":\"2026-07-26 11:34:11\",\"用户\":\"子辉\",\"群\":\"\",\"用户问询\":\"我刚看邮件，打开链接还是本土和直邮的资料，我暂时还没打算做这两种模式，我目前想做的是全托和半托\",\"AI响应\":\"你好！全托管和半托管模式目前无法通过该链接自主注册。请耐心等待客户经理与你联系，届时经理会引导你完成对应模式的入驻流程。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-24 18:51:58\",\"用户\":\"Fighting\",\"群\":\"\",\"用户问询\":\"全托管想上架女童泳衣，如何创建尺码表\",\"AI响应\":\"创建尺码表有两种方式：\\n\\n1. 自动生成：上传包含尺寸的图片（JPG/PNG等，最小80x80像素），系统会自动数字化，你核对调整即可。\\n2. 手动创建：\\n- 分配图表名称。\\n- 尺码标签：仅填写数字或字母（如L或46）。\\n- 等价尺码：选择对应的尺码范围。\\n- 测量属性：选择填写身体测量（如腰围）或服装测量（如袖长）。\\n\\n建议在创建Listing时直接添加，或在“编辑”选项中链接尺码表。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-24 15:39:59\",\"用户\":\"ぅ Oath°3 jin\",\"群\":\"\",\"用户问询\":\"您好，推荐下美客多半托管对接的上架erp\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n目前美客多半托管店铺已全面支持 ERP 发品。关于 ERP 的选择，你可以参考以下信息：\\n\\n1. 官方推荐及已对接的 ERP 列表：\\n数说琴弦 String AI、妙手 ERP、马帮科技、芒果店长、店小秘、易仓科技、紫鸟浏览器、四方出海、青虎 AI、HiCUSTOM 指纹科技、MarsMind、Drakon。\\n\\n2. 如何选择：\\n你可以根据自身的使用习惯选择上述列表中的 ERP。在 ERP 系统中授权你的美客多半托管店铺账号后，即可进行产品的采集、编辑和上架操作。\\n\\n3. 对接自研 ERP 系统：\\n如果你有技术团队，希望对接自研系统，请按以下步骤操作：\\n- 开发者平台登录：使用你的店铺账号登录美客多开发者站点：https://global-selling.mercadolibre.com/devsite。\\n- 技术文档参考：查阅详细的接口说明和技术文档：https://global-selling.mercadolibre.com/devsite/getting-started。\\n- 技术支持：对接过程中如遇技术问题，可在卖家后台联系客服。\\n\\n建议你优先参考美客多官方推荐的服务商，点击查看官方推荐列表：https://mercadolibre.cn/melispn/operation。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-24 14:05:36\",\"用户\":\"MGG\",\"群\":\"\",\"用户问询\":\"如何从前台链接区分是半托链接还是全托链接\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n从前端展示来看，你其实是没办法区分半托管还是全托管的。\\n\\n半托管和全托管在前端页面上呈现的特征非常相似，它们通常都会显示从中国发货（Envío desde China）并带有 FULL 闪电标识。这是因为这两种模式的货物都是先发往美客多位于中国的集运仓，后续的跨境物流和末端配送均由平台负责。\\n\\n两者的核心区别在于后台的运营逻辑和成本结构，而非前端的展示形式：\\n1. 全托管：商家仅负责供货，提报供货价，无需承担佣金、国际物流费和广告费。\\n2. 半托管：商家自主定价、自主运营 listing 和广告，需承担佣金和国际物流费用。\\n\\n所以，仅通过前台链接的显示内容，是无法准确判断该链接属于哪种托管模式的。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-24 13:58:24\",\"用户\":\"MGG\",\"群\":\"\",\"用户问询\":\"这种从中国发货，带full标记的是不是就是全托链接？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n从你提供的图片来看，这个链接确实具备全托管模式的典型特征。\\n\\n具体判断依据如下：\\n\\n1. 配送标识：图片中明确显示了“Envío desde China”（从中国发货）以及中国国旗图标，这说明货物是从中国境内发出的。\\n\\n2. 物流服务：下方标注了“Almacenado y enviado por FULL”（由 FULL 仓储和发送）。在美客多模式中，如果商品从中国发货却带有 FULL 闪电标识，这通常代表该商品属于全托管模式。\\n\\n3. 运作逻辑：全托管模式下，卖家将货物发往美客多位于中国的集运仓（如东莞仓），后续的国际物流、清关以及目的国配送均由平台负责，因此在前端页面会显示 FULL 标识以代表平台提供的物流保障。\\n\\n全托管模式下，商家享受 0 国际物流费，且无需承担平台佣金、仓储费和广告费，只需向平台提报供货价即可。\",\"一级大类\":\"其他\",\"二级子类\":\"系统报错\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-24 11:51:53\",\"用户\":\"ぅ Oath°3 jin\",\"群\":\"\",\"用户问询\":\"您好，问一下有没有关于美客多半托管上架的视频\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n关于 Listing 上架的操作，你可以参考以下视频教程：\\n\\n建议观看视频《新店启动，Listing上架必修课》00:39:59时间点的内容。\\n视频链接：https://mercadolibre.cn/news/info?id=64\\u0026type=live\\n\\n虽然半托管在定价模式上（收益价格模式）与普通模式略有不同，但基础的上架步骤、类目选择、标题填写和图片规范是通用的。你可以通过该视频快速掌握后台操作流程。\\n\\n网页参考资料\\n美客多卖家帮助中心：https://global-selling.mercadolibre.com/help\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-24 11:49:35\",\"用户\":\"ぅ Oath°3 jin\",\"群\":\"\",\"用户问询\":\"您好，我问一下，美客多半托管模式和美客多自运营模式，他们的上架逻辑是一样的吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n美客多半托管模式和自运营模式（自发货/海外仓）在上架逻辑上存在核心差异，主要体现在定价权和操作流程上：\\n\\n1. 定价权与收益模式：\\n- 自运营模式：商家自主定价，直接设置最终销售价格，并自行承担佣金和运费。\\n- 半托管模式：采用收益价格模式（Net Proceeds）。商家只需设置自己想要获得的收益（即供货价），平台会在前端根据佣金、运费等因素自动计算并展示给消费者的最终售价。\\n\\n2. 运营权归属：\\n- 自运营模式：商家完全自主运营，包括上架、优化链接、自主选择物流方式等。\\n- 半托管模式：虽然商家也负责上架和优化链接，但必须将货物提前备货至国内东莞仓，且出单后由美客多指定的承运商统一派送。\\n\\n3. 流量与标识：\\n- 自运营模式：自发货产品通常没有 Full 标，海外仓产品有 Full 标。\\n- 半托管模式：产品上架即带 Full 标，享受平台流量倾斜，且目前享受 50% 的佣金减免。\\n\\n4. 站点操作：\\n- 无论哪种模式，针对不同国家站点（如墨西哥、智利等）都需要单独进行商品上架和语言适配。\\n\\n总结来说，半托管模式更倾向于“简化定价”和“集中物流”，而自运营模式则给予卖家更高的定价灵活性和物流自主性。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-23 22:47:18\",\"用户\":\"ぅ Oath°3 jin\",\"群\":\"\",\"用户问询\":\"您好，美客多半托管，每个国家都需要上架一遍吗？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n美客多半托管模式下，如果要在多个国家站点（如墨西哥、巴西、阿根廷等）运营，**每个站点都需要单独上架商品**。因为不同站点属于独立的运营体系——商品信息（标题、描述、价格、类目等）需适配当地语言和市场规则，且选品清单会按站点细分。  \\n\\n例如，在阿根廷站点上架的商品，无法直接同步到墨西哥站点；需为每个目标国家分别创建Listing，并确保商品信息符合当地语言（西班牙语/葡萄牙语）和类目要求。  \\n\\n建议优先从平台推荐的【拉美热销品】或【国家专属选品表】入手，针对性上架对应站点需求的商品。\",\"一级大类\":\"产品管理\",\"二级子类\":\"类目咨询\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-23 22:32:37\",\"用户\":\"ぅ Oath°3 jin\",\"群\":\"\",\"用户问询\":\"你好，我问一下，美客多半托管上架产品的时候，需要用英语或者是葡萄牙语或者是西语吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n美客多半托管模式下，产品标题、描述等核心信息必须使用**本地语言**（西班牙语或葡萄牙语），具体取决于目标站点：  \\n- **墨西哥、智利、阿根廷、哥伦比亚**等站点使用西班牙语；  \\n- **巴西**站点使用葡萄牙语。  \\n\\n英语仅可作为辅助语言（如部分技术参数说明），但核心信息（标题、详情描述等）必须用当地语言，否则可能导致Listing审核不通过或无法激活。  \\n\\n建议优先参考平台提供的【美客多Listing语言规范】模板，确保内容符合当地语言习惯和搜索规则。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-23 02:49:30\",\"用户\":\"艳子慧里\",\"群\":\"\",\"用户问询\":\"美客多半托管sku有克重要求吗\",\"AI响应\":\"美客多半托管模式下每个产品（SKU）的重量要求是小于400g。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-23 02:36:26\",\"用户\":\"艳子慧里\",\"群\":\"\",\"用户问询\":\"你好，半托的sku数量有要求吗？\",\"AI响应\":\"半托管模式下每个店铺有100个listing限制哦，每个listing下建议不超过5个sku。另外，新店铺KYC审核通过后，要在30天内至少保持10个sku处于active（在售）状态，不然会被闭店的~\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-22 17:52:00\",\"用户\":\"NPT\",\"群\":\"\",\"用户问询\":\"半托管模式怎么增加变体\",\"AI响应\":\"你好！半托管模式增加变体的方法如下：\\n\\n1. 前往卖家后台的“活动列表”。\\n2. 找到对应商品，在操作菜单点击“修改”。\\n3. 在“产品特征”部分，点击“添加或更改变体”。\\n4. 在编辑器中添加新规格，并务必为每个新变体添加独立的图片、库存和通用代码（UPC/EAN）。\\n5. 点击确认即可完成。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-22 16:51:19\",\"用户\":\"Ivan\",\"群\":\"\",\"用户问询\":\"我这个不是海外仓啊 是托管店铺 半托管 而且上个链接还上传成功了啊\",\"AI响应\":\"半托管模式在系统识别中也属于官方承运。阿根廷站点目前不支持半托管/海外仓模式发货，所以会报错。上个链接能成功可能是因为您当时未勾选阿根廷站点，或者该类目在阿根廷有不同限制。建议您在表格中取消勾选阿根廷，只发布其他支持的站点。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-22 11:58:48\",\"用户\":\"Dan.\",\"群\":\"\",\"用户问询\":\"半托管的促销价格是在产品上架的时候定价的那个价格就已经开始给你锁定最低价了吗\",\"AI响应\":\"半托管模式下，促销活动的价格门槛（最低价要求）并不是在产品上架定价的那一刻就锁定的。\\n\\n关于半托管定价与促销的关系，规则如下：\\n\\n1. 价格门槛基准：促销活动的价格门槛仍然是以商品过去30天的历史售价为基准。这意味着系统会参考过去一个月内该商品在前端展示的实际销售价格来判定促销折扣是否达标。\\n\\n2. 定价模式不影响门槛：半托管采用的是收益价格模式（Net Proceeds），您设置的是供货价。虽然您提报的是供货价，但促销活动的准入逻辑依然是基于前端最终售价的历史记录，与您设置Net proceeds的动作本身无关。\\n\\n3. 平台定价权：在半托管模式下，平台拥有最终的市场定价权。如果平台为了促销调低了前端售价，只要您提报的供货价没有变动，您的结算收益依然是以您提报的供货价为准。\\n\\n简而言之，锁定最低价的逻辑是基于“过去30天历史售价”的动态计算，而不是上架时的初始定价。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-22 11:51:23\",\"用户\":\"Xiyunfei05\",\"群\":\"\",\"用户问询\":\"半托链接需不需要UPC编码\",\"AI响应\":\"半托管模式在刊登产品时需要填写UPC编码。如果您的Listing编辑界面没有“我没有UPC”选项，则必须使用唯一的正版UPC码进行上传。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-22 09:49:18\",\"用户\":\"wong\",\"群\":\"\",\"用户问询\":\"全托管/半托管：必须贴标。外箱贴BAG LABEL（10*15cm），产品贴SKU LABEL（7*2.2cm）。自寄需在箱内多放一张IC单。 IC单是什么，规格要求如何\",\"AI响应\":\"IC单即BAG LABEL（物流面单）。\\n\\n规格要求：使用10*15cm的热敏纸打印。\\n\\n操作要求：自寄到仓的货物，外箱需贴快递面单和IC单，且箱内必须额外多放一张IC单，以防运输途中外标掉落导致无法入库。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-21 17:17:48\",\"用户\":\"Ivan\",\"群\":\"\",\"用户问询\":\"半托店铺你建议上多少变体SKU 比如这款护士服有12个颜色，每个颜色又有5个尺码，按你说的方式放在一个变体里就有60个SKU了\",\"AI响应\":\"半托管模式下，一个listing建议不超过5个SKU。针对您的情况，建议按颜色拆分链接，一个链接放一种颜色及其对应的5个尺码，这样更利于转化且避免链接被拆分。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-21 16:00:26\",\"用户\":\"Z\",\"群\":\"\",\"用户问询\":\"你好，请问半托管店铺有新品期吗？是指上架成功的那一刻开始还是产品到货可售卖的那一刻开始\",\"AI响应\":\"你好！很高兴为你解答。半托管店铺新品有21天保护期。它是从产品到货、仓库上架变为可售（active）状态的那一刻开始计算的。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-21 15:29:06\",\"用户\":\"邓欢\",\"群\":\"\",\"用户问询\":\"全托管上架多久不出单算滞销\",\"AI响应\":\"全托管模式下，若商品上架后 30 天内无销量，通常会被视为滞销。平台可能会根据动销情况建议降价或进行清仓处理。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-21 05:00:40\",\"用户\":\"水果🍉\",\"群\":\"\",\"用户问询\":\"全托管需要上架产品吗\",\"AI响应\":\"全托管模式下，商家不需要自己上架商品。平台会负责商品上架、翻译、优化链接、提报活动以及通过专业算法提升转化率等全流程。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-20 15:56:46\",\"用户\":\"XiaoChen\",\"群\":\"\",\"用户问询\":\"半托管商品上架资质要求\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n半托管上架商品有以下限制和建议：\\n建议商品克重不要超过400克，客单价不可高于40美金，一个listing建议控制在5个SKU以内。\\n\\n此外，半托管模式要求必须先将货物送入国内东莞集货仓，仓库在收到产品并处理完成后，产品才会上架变为可售状态。你需要先至少有10个SKU是发售（active）状态。\",\"一级大类\":\"产品管理\",\"二级子类\":\"产品上架\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-20 13:59:11\",\"用户\":\"业务部王姝洁17674066774\",\"群\":\"\",\"用户问询\":\"全托模式下，上架套装尺码表应该选择哪个类目\",\"AI响应\":\"你好！选择类目时，请参考平台在售的同类型产品所在的类目，或使用类目预测器通过关键词检索正确类目。\\n\\n网页参考资料：\\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260125/166fca879b5844ddb33c70275e2ba08b.png\",\"一级大类\":\"产品管理\",\"二级子类\":\"类目咨询\",\"问题主题\":\"产品上架/变体/SKU\"},{\"时间\":\"2026-07-20 09:48:01\",\"用户\":\"呢呢\",\"群\":\"\",\"用户问询\":\"刚下来的半托店铺可以上架其他的类目吗\",\"AI响应\":\"可以的。美客多店铺不限制经营类目，开店后您可以根据业务需求上架其他类目的产品。但请注意，半托管模式仍需满足该模式的准入要求和流水门槛。\",\"一级大类\":\"产品管理\",\"二级子类\":\"类目咨询\",\"问题主题\":\"产品上架/变体/SKU\"}]},{\"业务模块\":\"托管\",\"高频问题\":\"定价/佣金/费用测算\",\"Past 7 Days\":11,\"Previous\":7,\"WoW\":0.5714285714285714,\"代表性问询\":\"全托店铺的定价是怎么计算的\",\"Past 7 Days代表性问询\":\"全托店铺的定价是怎么计算的\",\"Previous代表性问询\":\"半托管能开高佣金吗\",\"__details\":[{\"时间\":\"2026-07-25 04:01:47\",\"用户\":\"Aurora\",\"群\":\"\",\"用户问询\":\"全托管定价是根据什么来的，为什么我的供货价那么低，他售价高那么多，导致无浏览\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n在全托管模式下，定价和流量的逻辑如下：\\n\\n1. 价格构成：你设置的供货价是你最终的回款金额。平台会在你供货价的基础上，自动加上佣金、国际运费、仓储费、配送费以及平台的运营成本，从而形成最终的前端销售价。\\n\\n2. 平台定价权：全托管模式下，平台拥有最终的市场定价权。如果前端售价看起来比供货价高出很多，通常是因为系统将上述各项跨境运营成本都计算在了售价中。\\n\\n3. 浏览量低的原因：\\n- 价格竞争力：如果前端售价远高于当地市场同类产品，确实会影响点击和转化。建议你的供货价尽量比市场价低15%以上，给平台留出定价空间，以确保前端价格有竞争力。\\n- 权重与流量：全托管商品需要通过核价和买手选品。如果核价时供货价过高，可能导致审核不通过或流量扶持力度减弱。\\n- 运营成本：平台会根据算法推荐和流量扶持来推广商品，但如果前端价格脱离市场水平，算法推荐的效果也会打折扣。\\n\\n建议你参考寻品清单中的建议供货价进行调整。如果觉得目前供货价无法支撑盈利，可以通过后台的 Listing Management 页面尝试修改价格或发起核价申诉。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-24 09:39:39\",\"用户\":\"笑\",\"群\":\"\",\"用户问询\":\"全托前台平台是怎么定价的，我怎么算收益或者毛利\",\"AI响应\":\"全托管模式下，前台定价由平台根据市场供需、竞品价格等因素，在商家提报的**供货价**基础上确定（需确保供货价低于市场价15%以上，预留平台定价空间）。  \\n\\n商家的收益=最终确认的供货价（妥投后7个工作日回款），毛利=供货价-产品成本-国内发货到仓物流成本。  \\n\\n**核心逻辑**：平台承担所有费用（佣金、运费、仓储费等），商家只需专注成本控制与利润目标。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-24 09:36:21\",\"用户\":\"笑\",\"群\":\"\",\"用户问询\":\"全托店铺的定价是怎么计算的\",\"AI响应\":\"全托管定价采用供货价模式，商家只需提报期望收益价格（供货价），公式为：供货价 = 产品成本 + 目标利润 + 单件国内发货到东莞仓的物流成本。建议比市场价低15%以上，平台承担佣金、运费等。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-24 07:18:13\",\"用户\":\"wong\",\"群\":\"\",\"用户问询\":\"如果是全托店，商品核价是参考哪些价格\",\"AI响应\":\"全托店商品核价主要参考寻品池内的建议供货价（美金），仅作参考，实际核价以上品后为准。若没有同款1688链接，可找跨境平台同款托管店铺链接作为参考。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-24 06:08:25\",\"用户\":\"maxgtrs-Cindy\",\"群\":\"\",\"用户问询\":\"半托管定价要考虑原价和促销价吗\",\"AI响应\":\"你好！半托管定价采用收益价格模式（NetProceeds），商家只需设置期望的收益价格（即供货价），包含单件货物成本、目标利润及国内物流成本，无需考虑原价和促销价。平台会自动在供货价基础上叠加佣金和国际运费形成前端销售价，促销活动价格门槛则以商品过去30天历史售价为基准，与NetProceeds设置无关。\",\"一级大类\":\"营销活动\",\"二级子类\":\"促销活动\",\"问题主题\":\"促销/折扣/优惠券/活动\"},{\"时间\":\"2026-07-23 10:51:51\",\"用户\":\"治酉\",\"群\":\"深圳市百舸争流网络技术有限公司\",\"用户问询\":\"半托管的平台佣金是收取多少个点？\",\"AI响应\":\"半托管模式收取8%佣金，且佣金对比常规模式有50%的减免。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-22 16:21:45\",\"用户\":\"RxL\",\"群\":\"\",\"用户问询\":\"半托店是否有仓储费用\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n半托管模式目前没有仓储费。商家仅需承担发货到东莞仓的物流费用，以及退仓时产生的退仓费用。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-21 18:30:47\",\"用户\":\"Ivan\",\"群\":\"\",\"用户问询\":\"你帮我算一下 在半托管的店铺下 如果买家实际成交价是40美金 那扣除平台各项费用我到手大概是多少费用\",\"AI响应\":\"在半托管模式下，平台采用收益价格模式。您到手的金额就是您在后台填写的“收益价格（Net Proceeds）”。\\n\\n平台会根据您填写的收益价格，自动叠加8%的佣金和国际段运费来生成前端40美金的售价。因此，只要订单成交，结算给您的金额就是您最初填写的那个数值，平台收取的费用不会再从该金额中扣除。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"买家纠纷/客诉/售后\"},{\"时间\":\"2026-07-21 16:27:01\",\"用户\":\"桑子\",\"群\":\"\",\"用户问询\":\"半托管核价定价准则请发我\",\"AI响应\":\"半托管采用收益价格模式，无需核价。收益价格=单件货物成本+目标利润+单件国内发货到东莞仓的物流成本（需转为美元）。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-21 11:14:45\",\"用户\":\"Nini\",\"群\":\"\",\"用户问询\":\"全托管怎么定价\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n全托管模式采用供货价模式，定价逻辑如下：\\n\\n1. 定价权归属：平台拥有最终市场定价权，商家仅需提报供货价（期望收益价格）。\\n2. 计算公式：供货价 = 产品成本 + 目标利润 + 单件国内发货到东莞仓的物流成本。\\n3. 建议策略：供货价建议比市场价低15%以上，以确保平台有足够的定价空间来获取流量。\\n4. 费用承担：商家无需承担平台佣金、店铺年费、仓储费、广告费及国际段运费。\\n\\n商家提报供货价后，平台会根据市场情况进行核价并最终定价销售。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-21 10:57:40\",\"用户\":\"梁海波\",\"群\":\"\",\"用户问询\":\"半托管的订单如果产生退款所有的费用都是卖家承担，全托管的订单如果产生退款所有的费用都是平台承担，是这样吗\",\"AI响应\":\"半托管模式下，退货费用由商家承担。全托管模式下，平台在前端售价中已包含佣金和运费，退款由平台自动处理，不会从您约定的供货价中扣除，但退仓费用需由商家承担。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"买家纠纷/客诉/售后\"}]},{\"业务模块\":\"托管\",\"高频问题\":\"买家纠纷/客诉/售后\",\"Past 7 Days\":7,\"Previous\":0,\"WoW\":null,\"代表性问询\":\"美客多全托客诉在哪里查询与处理\",\"Past 7 Days代表性问询\":\"美客多全托客诉在哪里查询与处理\",\"Previous代表性问询\":\"半托的哪里查看退货地址\",\"__details\":[{\"时间\":\"2026-07-25 10:41:35\",\"用户\":\"Aurora\",\"群\":\"\",\"用户问询\":\"这是全托管店铺买家端，放在第一个的品是因为什么\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n在买家端页面中，排在第一个的商品被标记为“Producto destacado”（精选商品），这通常是由以下几个因素决定的：\\n\\n1. 销量与转化：该商品在近期内拥有较高的销量和转化率，被系统算法判定为店铺内的爆款。\\n2. 评分与口碑：该商品拥有较好的买家评价（如截图中显示的4.3分及11条评价），高评分会增加系统的推荐权重。\\n3. 流量扶持：全托管模式下，平台会针对表现优异或符合市场趋势的商品进行流量倾斜，将其放在店铺首页最显眼的位置。\\n4. 履约优势：该商品带有“FULL”标识，意味着它存储在海外仓且支持快速配送，这是提升排名的重要加分项。\\n5. 价格竞争力：该商品目前有较大的折扣力度（如蓝字显示的优惠券价格），价格优势也是系统优先展示的重要原因。\\n\\n简单来说，系统会自动选择店铺里表现最好、最能吸引买家下单的产品作为“精选商品”进
