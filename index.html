      editor.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          editor.blur();
        }
      });
      cell.appendChild(editor);
      cell.appendChild(detailButton(row));
      return cell;
    }
    function openDetails(row) {
      const records = row.__details || [];
      const modal = document.getElementById("detailModal");
      document.getElementById("detailTitle").textContent = t("detailTitle") + " - " + (row["高频问题"] || labelCategory(row[keySecondary]) || "");
      document.getElementById("detailCount").textContent = fmtInt(records.length) + " " + t("detailCount");
      const body = document.getElementById("detailBody");
      if (!records.length) {
        body.textContent = t("noRecords");
        modal.hidden = false;
        return;
      }
      const columns = ["时间", "用户", "群", "用户问询", "AI响应", "一级大类", "二级子类", "问题主题"];
      const labels = t("detailCols");
      const table = document.createElement("table");
      const head = table.createTHead().insertRow();
      labels.forEach(label => {
        const th = document.createElement("th");
        th.textContent = label;
        head.appendChild(th);
      });
      const tbody = table.createTBody();
      records.forEach(record => {
        const tr = tbody.insertRow();
        columns.forEach(column => tr.appendChild(td(record[column] || "")));
      });
      body.innerHTML = "";
      body.appendChild(table);
      modal.hidden = false;
    }
    function closeDetails() {
      document.getElementById("detailModal").hidden = true;
    }
    function renderKpis() {
      const assistantTop10 = assistantTop10Rows();
      const top10Total = assistantTop10.reduce((sum, row) => sum + Number(row["Past 7 Days"] || 0), 0);
      const wowAvg = assistantTop10.reduce((sum, row) => sum + (Number(row.WoW) || 0), 0) / assistantTop10.length;
      const queryWow = data.meta.previous_rows ? (data.meta.current_rows - data.meta.previous_rows) / data.meta.previous_rows : null;
      const items = [
        [t("past7Query"), fmtInt(data.meta.current_rows), ""],
        [t("queryWow"), fmtPct(queryWow), trendClass(queryWow)],
        [t("top10Share"), fmtPctPlain(top10Total / data.meta.current_rows), ""],
        [t("top10AvgWow"), fmtPct(wowAvg), trendClass(wowAvg)]
      ];
      document.getElementById("kpis").innerHTML = items.map(([label, value, cls]) =>
        '<div class="kpi"><div class="kpi-label">' + label + '</div><div class="kpi-value' + cls + '">' + value + '</div></div>'
      ).join("");
    }
    function renderBars() {
      const rows = assistantTop10Rows();
      const max = Math.max(...rows.map(row => Number(row["Past 7 Days"] || 0)), 1);
      document.getElementById("bars").innerHTML = rows.map(row => {
        const value = Number(row["Past 7 Days"] || 0);
        const width = Math.max(2, value / max * 100);
        const label = labelCategory(row[keySecondary]);
        return '<div class="bar-row"><div class="bar-label" title="' + label + '">' + label + '</div><div class="track"><div class="bar" style="width:' + width + '%"></div></div><div class="bar-num">' + fmtInt(value) + '</div></div>';
      }).join("");
    }
    function renderTopTable() {
      const table = document.getElementById("topTable");
      table.innerHTML = "";
      const head = table.createTHead().insertRow();
      [t("rank"), t("primary"), t("secondary"), t("past7"), t("previous"), t("change"), t("wow"), t("issue")].forEach(label => {
        const th = document.createElement("th");
        th.textContent = label;
        head.appendChild(th);
      });
      const body = table.createTBody();
      wowTop10Rows().forEach((row, i) => {
        recalcTopRow(row);
        const tr = body.insertRow();
        tr.appendChild(td(i + 1, "num"));
        tr.appendChild(td(labelCategory(row[keyPrimary])));
        tr.appendChild(td(labelCategory(row[keySecondary])));
        tr.appendChild(editableCell(row["Past 7 Days"], value => { row["Past 7 Days"] = Number(value.replace(/,/g, "")) || 0; renderAll(); }, "num"));
        tr.appendChild(editableCell(row[keyPrev], value => { row[keyPrev] = Number(value.replace(/,/g, "")) || 0; renderAll(); }, "num"));
        tr.appendChild(td(fmtInt(row.Change), "num " + (row.Change >= 0 ? "delta-up" : "delta-down")));
        tr.appendChild(td(fmtPct(row.WoW), "num " + (row.WoW >= 0 ? "delta-up" : "delta-down")));
        tr.appendChild(issueCell(row, value => { row["高频问题"] = value; }));
      });
    }
    function renderModuleTabs() {
      const wrap = document.getElementById("moduleTabs");
      wrap.innerHTML = "";
      ["海外仓", "自发货", "托管"].forEach(moduleName => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = labelModule(moduleName);
        btn.className = moduleName === activeModule ? "active" : "";
        btn.addEventListener("click", () => { activeModule = moduleName; renderModuleTabs(); renderModuleTable(); });
        wrap.appendChild(btn);
      });
    }
    function renderModuleTable() {
      const table = document.getElementById("moduleTable");
      table.innerHTML = "";
      const rows = data.module_issues.filter(row => row["业务模块"] === activeModule);
      const head = table.createTHead().insertRow();
      [t("module"), t("issue"), t("past7"), t("previous"), t("wow"), t("sample")].forEach(label => {
        const th = document.createElement("th");
        th.textContent = label;
        head.appendChild(th);
      });
      const body = table.createTBody();
      rows.forEach(row => {
        recalcIssueRow(row);
        const tr = body.insertRow();
        tr.appendChild(td(labelModule(row["业务模块"])));
        tr.appendChild(editableCell(row["高频问题"], value => { row["高频问题"] = value; }));
        tr.appendChild(editableCell(row["Past 7 Days"], value => { row["Past 7 Days"] = Number(value.replace(/,/g, "")) || 0; renderModuleTable(); }, "num"));
        tr.appendChild(editableCell(row.Previous, value => { row.Previous = Number(value.replace(/,/g, "")) || 0; renderModuleTable(); }, "num"));
        tr.appendChild(td(fmtPct(row.WoW), "num " + (row.WoW >= 0 ? "delta-up" : "delta-down")));
        const sampleText = [
          row["Past 7 Days代表性问询"] || row["代表性问询"] || "",
          row["Previous代表性问询"] || ""
        ].filter(Boolean).join("\n");
        tr.appendChild(editableCell(sampleText, value => {
          const parts = String(value).split(/\n/);
          row["Past 7 Days代表性问询"] = (parts[0] || "").trim();
          row["Previous代表性问询"] = (parts[1] || "").trim();
          row["代表性问询"] = row["Past 7 Days代表性问询"];
        }));
      });
    }
    function renderSource() {
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      document.getElementById("periodLine").textContent = t("current") + ": " + data.meta.current_period + " | " + t("previous") + ": " + data.meta.previous_period;
      document.getElementById("sourceInfo").innerHTML =
        "<strong>" + t("currentFile") + ":</strong> " + data.meta.current_file + "<br>" +
        "<strong>" + t("previousFile") + ":</strong> " + data.meta.previous_file + "<br>" +
        "<strong>" + t("method") + ":</strong> " + t("methodText");
    }
    function applyStaticText() {
      document.querySelectorAll("[data-i18n]").forEach(el => {
        el.textContent = t(el.dataset.i18n);
      });
      document.getElementById("langEnBtn").classList.toggle("active", lang === "en");
      document.getElementById("langZhBtn").classList.toggle("active", lang === "zh");
    }
    function renderAll() {
      topCompareRows().forEach(recalcTopRow);
      persist();
      applyStaticText();
      renderKpis();
      renderBars();
      renderTopTable();
      renderSource();
    }
    
    document.getElementById("saveBtn").addEventListener("click", () => {
      persist(true);
    });
    document.getElementById("detailCloseBtn").addEventListener("click", closeDetails);
    document.getElementById("detailModal").addEventListener("click", event => {
      if (event.target.id === "detailModal") closeDetails();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeDetails();
    });
    document.getElementById("langEnBtn").addEventListener("click", () => {
      lang = "en";
      try { localStorage.setItem("marsmind_topic_dashboard_lang", lang); } catch {}
      renderAll();
      renderModuleTabs();
      renderModuleTable();
    });
    document.getElementById("langZhBtn").addEventListener("click", () => {
      lang = "zh";
      try { localStorage.setItem("marsmind_topic_dashboard_lang", lang); } catch {}
      renderAll();
      renderModuleTabs();
      renderModuleTable();
    });
    document.getElementById("resetBtn").addEventListener("click", () => {
      data = structuredClone(originalData);
      localStorage.removeItem(storageKey);
      activeModule = "海外仓";
      renderAll();
      renderModuleTabs();
      renderModuleTable();
    });
    renderAll();
    renderModuleTabs();
    renderModuleTable();
  </script>
</body>
</html>
