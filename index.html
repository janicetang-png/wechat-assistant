家支付相应的重量运费。 2. 商品售价 ≥ 79 BRL：买家享受包邮，卖家承担标准运费。 是说明 ≤79BRL那么卖家负责国内运费 国外阶段由买家负责是这个意思吧‘’\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n你的理解基本正确，但需要更精准地划分一下：\\n\\n1. 商品售价 \\u003c 79 BRL（低于包邮门槛）：\\n- 买家承担：买家在下单时会额外支付一笔运费给平台，这部分费用覆盖了国际段的大部分成本。\\n- 卖家承担：卖家需要负责将货物发往国内集运仓的费用（国内快递费），同时平台会根据货件毛重从卖家账户扣除一小部分相应的重量运费。\\n\\n2. 商品售价 ≥ 79 BRL（达到包邮门槛）：\\n- 买家承担：0元（享受包邮）。\\n- 卖家承担：卖家需要负责发往国内集运仓的费用，并且需要承担完整的国际段标准运费。\\n\\n总结一下：无论是否包邮，卖家都要负责“发去国内集运仓的费用”。区别在于，当售价低于门槛时，买家会替你分担绝大部分的国际运费；而高于门槛时，国际运费则由你全额承担。\\n\\n由于美客多采用“净收益定价模式”，你只需要在后台输入你想要的利润，系统会自动把这些复杂的运费计算进去并生成最终售价，所以你不需要担心算错。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-22 09:26:52\",\"用户\":\"爱喝咖啡的懒人\",\"群\":\"\",\"用户问询\":\"商品下单货值为 34.15 美元。扣除平台佣金与物流费用后，我实际到手仅有 9.92 美元。即便不算利润，您索要的金额也远高于该数额，我无法满足 这么回复可以吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n不建议这样回复。在美客多平台，**向买家透露你的成本、佣金、物流费以及实际利润是非常不专业的行为**，甚至可能引起买家的反感或进一步投诉。\\n\\n**建议回复思路：**\\n直接以“金额超过订单总额”和“平台已结案”为由拒绝，更加合规且专业。\\n\\n**建议回复内容（西班牙语）：**\\n\\\"Lamentamos el inconveniente. Sin embargo, el monto que solicita ($50.000 ARS) supera el valor total pagado por el producto en el pedido. Además, la mediación de esta venta ya ha sido finalizada por la plataforma. Le sugerimos contactar directamente al servicio de atención al cliente de Mercado Libre para cualquier consulta adicional.\\\"\\n\\n**中文大意：**\\n很抱歉给您带来不便。但是，您要求的金额（$50.000 ARS）超过了您为该订单支付的总金额。此外，平台已完成此订单的调解。建议您直接联系美客多客服进行咨询。\\n\\n网页参考资料：https://global-selling.mercadolibre.com/help/21258\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-20 15:35:45\",\"用户\":\"Rita\",\"群\":\"\",\"用户问询\":\"？那为啥会扣我运费？我这票货实际出货金额***美金，不包邮，实际扣费应是税费+附加费+佣金=毛利润，为啥会被扣2.31运费，之前这笔2.31美金的运费是否会有平台补回给我？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n买家出，你只需要明确净收益这里是你最后结算得到的收入。\\n\\n在美客多平台的账单逻辑中，如果你的商品不包邮，买家在下单时会支付一笔运费。这笔钱会先计入订单总额中，然后平台再以“配送费”的名义将其扣除。\\n\\n从你提供的截图来看，US$ 10.40 是包含买家支付运费后的总金额。平台扣除的 US$ 2.31 运费实际上就是买家支付的那部分，或者是该订单对应的配送成本。最终你收到的 US$ 5.43 已经是扣除所有费用后的净收益，这部分就是你最后结算得到的收入。\\n\\n平台不会再额外补回这笔 2.31 美元的运费，因为它在账单中已经完成了对冲。你可以理解为：这笔钱只是在你的账单里“过了一下手”，最终由买家承担并支付给了物流系统。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-25 11:22:36\",\"用户\":\"灿烂阳光\",\"群\":\"\",\"用户问询\":\"商品成本33.45为什么这么多，我的商品成本是10.3加2元运费，是12.3元。你此时算的是33.45，为什么这么成本包含又包含了平台的费用呢？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n请注意，**33.45元这个数字不是我算的，而是出现在你提供的第一张ERP截图里的“成本”那一栏。**\\n\\n之所以会出现这个偏差，通常是因为ERP系统的计算逻辑和你的理解不同，建议你检查以下几点：\\n\\n**1. ERP成本录入错误**\\n请去你的ERP后台查看该商品的“采购成本”或“主商品信息”。很有可能在录入时，系统自动把某些费用（如头程、贴标费、甚至之前的运费）叠加进去了，或者干脆是人工录入错误。\\n\\n**2. ERP自动抓取了“前台售价”作为参考**\\n有些ERP在没有录入采购价时，会胡乱抓取数据。如果你的商品成本确实是12.3元，那么ERP显示的33.45元就是错误的，这会导致它计算出的“利润”也是错的。\\n\\n**3. 平台费用不会包含在“商品成本”里**\\n在美客多的定价逻辑中，商品成本（12.3元）是你自己的账；平台佣金和国际运费是系统在你的“净收益”之外额外加的。**正常的ERP不应该把平台收取的佣金和运费算进你的“商品成本”里**，除非你在ERP里设置了特殊的计算公式。\\n\\n**总结建议：**\\n如果你的真实成本是 **12.3元**，而你收到的净收益是 **2.35美金（约16元）**，那么你这单其实**赚了约3.7元**，并没有亏损。\\n\\n**ERP显示亏损是因为它认为你的成本是33.45元。** 请务必去ERP的商品列表里，把这个SKU的成本价手动修正为12.3元，这样以后它算的利润就准了。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-24 12:22:35\",\"用户\":\"Felicity 103%\",\"群\":\"\",\"用户问询\":\"您好，我想问问普通CBT和CBT pro 以及本土店的一些相关事情，尾程操作费用是怎么算的，还有其他额外的收费吗，售出一件商品后不同店铺会产生的费用分别有哪些\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n**1. 跨境店（CBT）费用构成：**\\n*   **佣金：** 不同类目比例不同（如服饰15%，电子12%）。\\n*   **配送费：** 包含尾程运费，按货件毛重计收。\\n*   **税费：** 若未注册墨西哥RFC税号，会预扣20%所得税。\\n*   **其他：** 广告费（按点击收费）、仓储费（海外仓模式）。\\n\\n**2. 本土店费用构成：**\\n*   **佣金：** 约14% + 2%税。\\n*   **税费：** 需当地营业执照注册RFC，可减免部分税费。\\n*   **其他：** 同样包含配送费、广告费及仓储费。\\n\\n**3. 尾程操作费：**\\n如果产品售价低于免邮门槛，平台可能会收取一笔额外的操作费（低价产品附加费）。\\n\\n**4. 收益计算公式：**\\n您的实际收益 = 商品售价 - 平台销售佣金 - 税费 - 配送费用。\\n\\n建议使用官方利润计算器进行精准测算：https://global-selling.mercadolibre.com/listings/cost-calculator\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-24 11:26:31\",\"用户\":\"三毛\",\"群\":\"\",\"用户问询\":\"我现在在考虑产品定价 不知道有哪些费用 比如说 平台扣点，物流 海外仓 什么价格呢 我才能算出来 怎么定价 具体有哪些费用 框架\",\"AI响应\":\"美客多海外仓（Full）卖家的定价框架非常清晰，你可以参考以下公式和费用明细进行测算：\\n\\n**1. 定价计算公式：**\\n您的实际收益 = 商品售价 - 平台销售佣金 - 税费 - 配送费用\\n\\n**2. 具体费用框架：**\\n\\n*   **平台销售佣金：**\\n    根据产品类目不同，佣金比例通常在 11.5% - 22.5% 之间。\\n    查询链接：https://global-selling.mercadolibre.com/landing/selling-fee\\n\\n*   **税费（以墨西哥为例）：**\\n    如果你没有墨西哥RFC税号，平台会代扣代缴增值税（16%）和所得税（20%）。如果你有RFC税号并完成绑定，税费成本会大幅降低。\\n\\n*   **配送费用（尾程派送费）：**\\n    这是指从美客多仓库送到买家手中的费用，根据货物的重量和尺寸计算。店铺信誉等级越高，折扣越大（绿色等级最高可享60%折扣）。\\n    查询链接：https://global-selling.mercadolibre.com/help/23223\\n\\n*   **仓储服务费：**\\n    按月收取，根据商品尺寸每日计费。\\n    - 小型产品：约 0.0006 美元/日\\n    - 中型产品：约 0.0022 美元/日\\n    - 大型产品：约 0.0050 美元/日\\n    - 超大/重型：约 0.0276 美元/日\\n\\n*   **其他潜在成本：**\\n    - 头程运费：从中国工厂运到墨西哥/智利仓库的物流费。\\n    - 广告费用：如果开启Product Ads，需预留推广成本。\\n    - 长期仓储费：存放超过120天的商品会产生额外费用。\\n\\n**3. 实用工具推荐：**\\n建议你直接使用官方提供的利润计算器，输入你的成本和预期售价，系统会自动帮你算出各项扣费和最终利润：\\nhttps://global-selling.mercadolibre.com/listings/cost-calculator\\n\\n**网页参考资料：**\\n海外仓费用详情：https://global-selling.mercadolibre.com/help/15373\\n自发货开店成本：https://global-selling.mercadolibre.com/help/31800\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-21 16:35:58\",\"用户\":\"桑子\",\"群\":\"\",\"用户问询\":\"我可以理解为，买家购买的价格=包含了尾程运费、佣金的价格，我作为卖家到手的金额是我设置的收益价格，不会在我的收益价格上*8%进行抽佣\",\"AI响应\":\"是的，您的理解完全正确。买家支付的价格已包含尾程运费和佣金。您到手的金额就是您设置的收益价格，平台不会在您的收益价格上再扣除8%的佣金。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-20 15:38:33\",\"用户\":\"Rita\",\"群\":\"\",\"用户问询\":\"不对，10.4是我售价，不含运费，那么如果这2.31美元是运费，那么客户实际应支付10.4美金+2.31美金才对\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n在美客多的账单逻辑中，如果你设置的是不包邮，买家支付的运费确实会体现在账单明细里。\\n\\n通常情况下，账单显示的逻辑是：买家支付的总额（包含产品售价+买家支付的运费）会作为初始金额，然后平台再扣除相应的佣金、税费以及这笔由买家支付的运费。\\n\\n如果你确认 10.40 美元仅为你设置的产品售价，而账单中又出现了 2.31 美元的扣费，这通常是因为平台在展示账单明细时，将买家支付的运费和产品售价合并计算了总额，随后又将运费部分扣除以结算给物流方。\\n\\n你可以核对一下该订单的原始付款明细，看买家实际支付的总金额是否为 12.71 美元（10.40 + 2.31）。如果买家实际支付了 12.71 美元，那么扣除 2.31 美元运费后，你的结算基数依然是 10.40 美元，这是符合逻辑的。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\ 本（如体积重、物流波动）超预期，或净收益设置未考虑这些变量。例如体积重导致运费增加，或平台调整运费规则（如6月后300g以上按体积重），若净收益未覆盖这些变动，就可能出现亏损。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-23 17:04:42\",\"用户\":\"小佛爷\",\"群\":\"\",\"用户问询\":\"您好 我想问问普通CBT和CBT pro 以及本土店的一些相关事情，尾程费用是怎么算的\",\"AI响应\":\"不好意思，该问题我没有答案，请点击以下链接咨询人工客服：\\nhttps://work.weixin.qq.com/kfid/kfc7c47108dec2b0070?enc_scene=ENCGH59j4kB9XCrk4dX6Jt2BZeAhKD7ZBUNQhrF2CcGYyCW\\u0026scene_param=customer_id=7881****7773\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-23 12:56:09\",\"用户\":\"烟雨任平生\",\"群\":\"\",\"用户问询\":\"在吗？那个价格计算器中对国际物流的费用有疑问，平台上的到巴西的物流费用表是准确的吗？\",\"AI响应\":\"你的问题我暂时无法回答，后续我会丰富我的知识库，敬请见谅。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-22 19:05:19\",\"用户\":\"TMR商学院运营-萍萍\",\"群\":\"\",\"用户问询\":\"美客多订单计泡了，很重，我的卖价都不够运费，最后扣费会是什么样子啊，平台会先垫付运费吗？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n平台结算确实是从您的总账户扣除的。如果订单运费高于您的卖价，系统会直接从您的账户余额中扣除。若余额不足，账户会显示负数，后续订单的收益将优先用于抵扣该欠款。\\n\\n建议您尽快核实商品重量和尺寸，避免持续亏损。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-21 11:24:17\",\"用户\":\"Nini\",\"群\":\"\",\"用户问询\":\"产品成本 + 目标利润 + 单件国内发货到东莞仓的物流成本，只需要承担这些费用吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n是的，在全托管模式下，你只需要承担这三部分费用。\\n\\n商家无需承担平台佣金、店铺年费、仓储费、广告费以及跨境段的国际运费。但需要注意，如果产生退仓，退仓费用由商家承担。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-25 09:50:00\",\"用户\":\"Silvia\",\"群\":\"\",\"用户问询\":\"参加平台打折后 价格打折了 那运费呢 会打折吗 还是说打折是继续净收益的部分？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n在美客多平台，参加折扣活动时，运费和净收益的处理逻辑如下：\\n\\n1. 运费不会打折：运费是物流承运商收取的硬性成本，不会因为你设置了商品折扣而减少。\\n\\n2. 折扣扣除的是你的净收益：当你设置折扣时，减免的那部分金额实际上是从你的净收益（利润）中扣除的。\\n\\n3. 包邮门槛的变动风险：这是最需要注意的一点。美客多的包邮门槛是以折扣后的最终售价为准的。\\n- 如果折后价格低于门槛（如墨西哥站299比索）：你可以设置不包邮，运费转由买家承担。\\n- 如果折后价格依然高于门槛：你仍需承担全额运费。\\n\\n举个例子：如果你的产品原价310比索（你包邮），打折后变成280比索。此时因为低于299比索，运费会变更为买家承担。虽然你降价了，但因为运费成本转嫁给了买家，你的实际净收益可能反而变动不大。\\n\\n总结：在设置高额折扣时，请务必考虑包邮门槛的临界点，确保折后的净收益依然符合你的预期。建议在操作前使用后台的模拟器测算一下。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\" *：卖家必须申报准确的重量和尺寸。如果申报信息与仓库实际测量结果存在偏差，重复的差异可能导致额外收费或账户被暂停。\\n\\n3. **查看扣费**：您可以前往卖家后台的“账单详情”查看系统二次测重后的最终扣费。对于海外仓货件，入仓后平台会进行测量，最终收费和判定大小件以仓库实际测量数据为准。\\n\\n4. **修改方式**：如果您发现尺寸或重量填错，可以在卖家后台的 Listing 编辑板块进行修改，以避免被持续分错大小件。\\n\\n建议您正确填写产品尺寸及重量，避免因仓库信息同步滞后导致运费计算不准。\\n\\n网页参考资料：\\n墨西哥站点菜鸟运费查询表：https://global-selling.mercadolibre.com/help/shipping-costs-envio-cainiao-mexico_41817\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-20 09:56:10\",\"用户\":\"七\",\"群\":\"\",\"用户问询\":\"邮费是怎么核算的？为什么有些是不含免运费，有些是免费配送呢？\",\"AI响应\":\"您将根据产品毛重及售价是否达到免运费阈值支付运费。墨西哥站门槛为299比索。售价高于门槛由卖家承担运费，买家包邮；低于门槛则由买家和卖家共同承担。系统会根据您输入的净收益自动核算并生成最终售价。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-25 18:10:49\",\"用户\":\"大大大明\",\"群\":\"\",\"用户问询\":\"我可以直接让客服人员帮我恢复免运费吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n你可以向客服提出这个诉求。在联系时，请明确告知客服：该商品售价已超过299比索，但系统错误显示为买家付运费且后台无法手动更改，请他们核实并人工干预恢复免运费（Free Shipping）状态。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-25 16:48:29\",\"用户\":\"平安喜乐\",\"群\":\"\",\"用户问询\":\"那运输方式上面写的是免运费是什么意思\",\"AI响应\":\"你好！在美客多平台，免运费（Free Shipping）通常是指对“买家”免运费，具体规则如下：\\n\\n1. **谁支付运费**：\\n- 如果你的商品售价**等于或高于 299 墨西哥比索（MXN）**，平台会强制要求该商品对买家免运费。这种情况下，**运费由卖家（你）全额承担**。\\n- 如果你的商品售价**低于 299 墨西哥比索（MXN）**，买家和卖家通常需要共同分担运费。\\n\\n2. **系统如何处理**：\\n在自发货模式下，你依然只需要在后台输入你想要的“净收益”。如果系统计算出的最终售价超过了 299 比索，它会自动把这笔需要你承担的运费加在成本里，从而生成一个更高的前台售价，以保证你拿到的钱还是你填写的那个数。\\n\\n3. **为什么显示免运费**：\\n这是一种促销手段。对于买家来说，看到“Free Shipping”会极大提高购买意愿。虽然名义上是你支付了运费，但实际上系统已经通过提高前台售价的方式，把这部分成本转嫁给买家了。\\n\\n**总结：**\\n“免运费”是指买家不需要额外付运费，而这笔运费会由系统自动计算并从你的销售总额中扣除。你只需要关注你填写的“净收益”是否覆盖了你的成本和利润即可。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-25 16:45:48\",\"用户\":\"平安喜乐\",\"群\":\"\",\"用户问询\":\"那我要怎么寄出去 这个运费不计算吗\",\"AI响应\":\"你好！关于如何寄送以及运费的计算，操作如下：\\n\\n**1. 怎么寄出去？**\\n美客多自发货使用的是官方指定的物流（通常是菜鸟集运）。\\n- **打印面单**：当你有订单后，在卖家后台直接下载并打印平台提供的物流面单。\\n- **打包送仓**：将产品打包好并贴上面单，自行联系国内快递（如顺丰、中通等）寄送到美客多位于国内的集运仓（通常在东莞、深圳等地）。\\n- **后续流程**：货物到达国内集运仓后，剩下的国际段运输、清关和末端派送都由平台负责。\\n\\n**2. 运费不计算吗？**\\n运费是需要计算的，但不需要你手动加进售价里，系统已经帮你处理好了：\\n- **自动扣除**：在你填写的“净收入”基础上，系统会自动根据你填写的商品毛重叠加运费。\\n- **结算方式**：运费直接与平台结算。你可以从你之前的截图看到，系统已经预估了你需要支付的运费（例如图中显示的 USD 1.86）。\\n- **查看扣费**：你可以前往卖家后台的“账单详情”，查看系统在二次测重后扣除的最终运费。\\n\\n**特别提醒：**\\n- 寄往国内集运仓的这一段国内快递费是由你承担的。\\n- 请务必在后台填写准确的重量和尺寸，否则如果实际超重，平台会按实际重量扣费，可能会导致你的利润缩水。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-25 14:59:16\",\"用户\":\"对方正在输入...\",\"群\":\"\",\"用户问询\":\"也就是上门取件不收取国内到仓库的运费吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n是的，只要你的发货地址在菜鸟官方的上门揽收范围内，菜鸟上门取件是不收取国内段运费的。\\n\\n你只需要在后台处理订单并预约揽收，菜鸟的工作人员就会上门收货并运往集运仓。你最终需要支付的物流费用，仅为从集运仓发往目的地的国际段运费（即你在利润计算器中看到的运费部分）。\\n\\n菜鸟物流问题请咨询美客多后台客服。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-25 10:53:53\",\"用户\":\"李玲娅\",\"群\":\"\",\"用户问询\":\"所以我后台显示的运费是由买家支付是吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n如果你的商品售价低于站点的包邮门槛，后台显示的运费逻辑如下：\\n\\n1. **买家承担部分**：买家在下单时会支付一笔运费。\\n2. **卖家承担部分**：即使买家支付了运费，卖家通常仍需支付相应的重量运费。\\n\\n简单来说，当售价低于门槛时，是由买家和卖家共同承担运费的。你可以在卖家后台的“账单详情”中查看每笔订单实际扣除的运费明细，以确定你最终支付的具体金额。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-25 09:17:29\",\"用户\":\"骑着毛驴去拉萨\",\"群\":\"\",\"用户问询\":\"一个订单几件，拆单的话，对运费会有什么影响\",\"AI响应\":\"运费按货件毛重计收。若拆分为多个包裹，每个包裹均需单独粘贴面单并计算运费。建议在符合物流商重量和尺寸限制的前提下，尽量合并发货以优化成本。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-25 04:37:05\",\"用户\":\"若初见\",\"群\":\"\",\"用户问询\":\"调解客服判定全额退款，那么该商品运费谁出的？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n如果调解客服判定全额退款，该订单的运费处理规则如下：\\n\\n1. 发货运费：根据平台机制，发货运费通常是不予退还的。如果该订单原本是由卖家承担的运费（即售价高于包邮门槛），这部分成本已由卖家支付。\\n2. 退货运费：如果涉及退货流程，退回的运费通常也由卖家承担。\\n\\n在全额退款的情况下，卖家不仅需要退还买家支付的货款，通常还需要承担该笔交易产生的往返物流成本。建议你通过卖家后台查看详细的账单明细，以确认最终扣款情况。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流费用\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\ ps://mp.weixin.qq.com/s/SOextL25EnZqMxGr09tSWQ 专属团队将在10个工作日内联系你。\",\"一级大类\":\"产品管理\",\"二级子类\":\"类目咨询\",\"问题主题\":\"类目/产品能否售卖\"},{\"时间\":\"2026-07-26 17:06:14\",\"用户\":\"价值2\",\"群\":\"\",\"用户问询\":\"中国自发货精铺卖灯具，氛围灯这个类目，怎么样，市场和\",\"AI响应\":\"你好！氛围灯类目在美客多市场潜力巨大，尤其是万圣节期间，LED南瓜灯、骷髅串灯等家居装饰氛围灯最受欢迎。该类目产品通常轻便、体积小，非常符合自发货的物流规格要求。建议结合节日节点提前布局，利用自发货模式灵活测款。\",\"一级大类\":\"产品管理\",\"二级子类\":\"类目咨询\",\"问题主题\":\"类目/产品能否售卖\"},{\"时间\":\"2026-07-24 09:55:03\",\"用户\":\"Miles\",\"群\":\"\",\"用户问询\":\"我们3c类目是上了一些无线耳机 发货对电功率有什么要求吗\",\"AI响应\":\"你的问题我暂时无法回答，后续我会丰富我的知识库，敬请见谅。你可以咨询美客多后台客服获取更准确的信息。\",\"一级大类\":\"产品管理\",\"二级子类\":\"类目咨询\",\"问题主题\":\"类目/产品能否售卖\"},{\"时间\":\"2026-07-22 16:07:05\",\"用户\":\"A-\",\"群\":\"\",\"用户问询\":\"Laundry wash bags 这是什么类目\",\"AI响应\":\"你好！很高兴为你解答。Laundry wash bags（洗衣袋）通常属于以下类目：\\nHome, Furniture \\u0026 Garden \\u003e Home Storage \\u0026 Organization \\u003e Laundry \\u003e Laundry Bags\\n建议你通过类目预测器输入关键词，或参考平台在售同款产品的类目路径进行确认。\",\"一级大类\":\"产品管理\",\"二级子类\":\"类目咨询\",\"问题主题\":\"类目/产品能否售卖\"},{\"时间\":\"2026-07-22 16:06:13\",\"用户\":\"A-\",\"群\":\"\",\"用户问询\":\"Laundry wash bags 这是什么类目\",\"AI响应\":\"你好！很高兴为你解答。选择类目时，请参考平台在售的同类型产品所在的类目，或使用类目预测器通过关键词检索正确类目。\\n\\n网页参考资料：\\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260125/166fca879b5844ddb33c70275e2ba08b.png\",\"一级大类\":\"产品管理\",\"二级子类\":\"类目咨询\",\"问题主题\":\"类目/产品能否售卖\"},{\"时间\":\"2026-07-21 14:57:55\",\"用户\":\"悠\",\"群\":\"\",\"用户问询\":\"为什么半托不同类目的运费同体积重量会有很大的差异\",\"AI响应\":\"你好！很高兴为你解答。运费是根据商品的实际重量（含包装）或体积重计算的。每次运费价格可能不同，具体取决于商品的尺寸和配送时效。此外，6月份起300g以上产品按体积重计费，建议优化包装以降低成本。\",\"一级大类\":\"产品管理\",\"二级子类\":\"类目咨询\",\"问题主题\":\"类目/产品能否售卖\"},{\"时间\":\"2026-07-24 09:55:53\",\"用户\":\"Miles\",\"群\":\"\",\"用户问询\":\"美客多对3c类目 无线耳机有什么要求吗\",\"AI响应\":\"美客多3C类目无线耳机需符合禁售品规定，自发货需遵守尺寸（≤60×40×35cm，三边和≤135cm，重量≤15kg）、UPC标签建议（非强制但建议贴），核价需补充1688链接。\",\"一级大类\":\"产品管理\",\"二级子类\":\"类目咨询\",\"问题主题\":\"类目/产品能否售卖\"},{\"时间\":\"2026-07-23 15:23:03\",\"用户\":\"A～猴子\",\"群\":\"\",\"用户问询\":\"请问半托管模式是只能做一个类目吗\",\"AI响应\":\"半托管模式没有限制只能做一个类目，商家可根据自身优势选择多个类目 会被系统判定为不符合海外仓存储要求，从而面临清退。\\n\\n**2. 不健康库存处理**\\n若商品满足以下任一条件，会被界定为不健康库存：\\n- 连续30个自然日无销售记录。\\n- 库龄超过60天。\\n- 实际库存量超出了平台分配给您的可用库容。\\n对于这类库存，平台可能会采取分批强制折扣清货的措施。\\n\\n**3. 弃置与销毁风险**\\n在设置退货地址时，必须填写有效的当地退货地址。如果您的Full仓退货在20天内未被提取，且没有有效的退货地址，这些商品将被自动捐赠或销毁。\\n\\n建议您定期通过后台监控库存动销，及时通过降价或广告手段清理库龄较长的商品，避免产生高额仓储费或被强制清退。\\n\\n**网页参考资料**\\n仓储费说明：https://global-selling.mercadolibre.com/help/15373\\n弃置或撤仓费说明：https://global-selling.mercadolibre.com/knowledge-hub/18226\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-24 10:29:52\",\"用户\":\"David Xu\",\"群\":\"莉娅测试群\",\"用户问询\":\"@美客多本土小助手莉娅(美客多本土小助手莉娅) 怎么开full\",\"AI响应\":\"你好！很高兴能为你解答。提交申请前，请务必仔细阅读《FULL仓申请指南》，按照指南完成后台的“退货仓库地址设置”及“税务设置”。完成前置准备后，请进行以下 3步登记操作：\\n\\nStep 1: 请确保扫码添加小助手。\\nStep 2: 完整填写“本土号卖家入驻信息收集表”：https://28151754.beschannels-plus.com/forms/6WU4ZMA；\\nStep 3: 完成“巴西本土FULL仓申请表”：https://28151754.beschannels-plus.com/forms/6XU4ZNB。\\n\\n目前 FULL 仓申请每周审批 1 次，通过后 7-10 个工作日内生效，请耐心等待。\\n\\n网页参考资料：\\nFULL仓申请指南：https://doc.weixin.qq.com/pdf/d3_AQIAAQbOAJoCN52Q7ezFTSeqcDUDW?scode=AI8A3wfvAAovXGjhqUAQIAAQbOAJo\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-24 10:20:14\",\"用户\":\"David Xu\",\"群\":\"莉娅测试群\",\"用户问询\":\"@美客多本土小助手莉娅(美客多本土小助手莉娅) 怎么开full\",\"AI响应\":\"你好！很高兴能为你解答。提交申请前，请务必仔细阅读《FULL仓申请指南》，按照指南完成后台的“退货仓库地址设置”及“税务设置”。完成前置准备后，请进行以下 3步登记操作：\\n\\nStep 1: 请确保扫码添加小助手。\\nStep 2: 完整填写“本土号卖家入驻信息收集表”：https://28151754.beschannels-plus.com/forms/6WU4ZMA；\\nStep 3: 完成“巴西本土FULL仓申请表”：https://28151754.beschannels-plus.com/forms/6XU4ZNB。\\n\\n目前 FULL 仓申请每周审批 1 次，通过后 7-10 个工作日内生效，请耐心等待。\\n\\n网页参考资料：\\nFULL仓申请指南：https://doc.weixin.qq.com/pdf/d3_AQIAAQbOAJoCN52Q7ezFTSeqcDUDW?scode=AI8A3wfvAAovXGjhqUAQIAAQbOAJo\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-20 21:13:09\",\"用户\":\"花花～\",\"群\":\"\",\"用户问询\":\"那这么说每个国家都要寻找一个海外仓吗？我弃货还不行吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n你的心情我非常理解，但从平台规则和系统操作层面来看，确实有以下限制：\\n\\n1. 系统强制要求：在后台设置中，退货地址通常是激活物流服务的必填项。如果不填写，系统可能无法让你完成物流配置，导致店铺无法正常开售。\\n\\n2. 弃货的代价：如果你不提供退货地址，当买家发起纠纷要求退货时，平台系统会因为没有退货去向而默认判卖家输，你只能选择“仅退款”，这会导致你钱货两空。\\n\\n3. 必须是本地地址：每个国家都需要填写对应国家的本地退货地址，不能统一填写同一个国家的地址。\\n\\n4. 解决方案：如果你确实打算弃货，不想寻找复杂的海外仓合作，建议你联系一些提供“退货代收”服务的第三方物流商，仅挂靠一个他们的仓库地址用于系统激活。这样即使产生退货，你可以指令他们直接销毁，但至少保证了你店铺的正常运营权限。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-20 16:10:17\",\"用户\":\"A.roc\",\"群\":\"\",\"用户问询\":\"美客多CBT墨西哥Full的墨西哥收件地址在哪？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n若跨境海外仓卖家需要发货至平台Full仓，系统会在你创建备货计划后，将货件分配到具体的仓库。\\n\\n常见的墨西哥Full仓地址包括 **Danhos Cuautitlán** 等。物流商在物流系统线上预约送仓时间后，系统会显示具体的分配地址，物流商再按预约的时间和地点送仓即可。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-26 17:37:28\",\"用户\":\"朵儿\",\"群\":\"\",\"用户问询\":\"问一下，备货海外仓的话可以两个店铺卖同样的货吗\",\"AI响应\":\"你好！很高兴为你解答。可以的，国内营业执照申请的跨境店支持海外仓模式，不同店铺可以售卖相同的产品。但请注意，每个店铺的库存和运营需独立管理。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-24 22:25:52\",\"用户\":\"王秀地\",\"群\":\"\",\"用户问询\":\"但是我看到其他卖家可以full出售\",\"AI响应\":\"你好。目前无法直接判断其他卖家可以入仓的具体原因。建议优先核查产品属性是否完全一致，或通过后台客服确认该类目最新的入仓政策。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-24 14:37:47\",\"用户\":\"YYY\",\"群\":\"\",\"用户问询\":\"@美客多小助手萝拉 海外仓的产品会被清退吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n海外仓的产品是存在清退机制的。平台会根据库存的动销情况和存放时长进行处理，具体规则如下：\\n\\n1. 库存退出机制：\\n如果某个SKU在7天内销量为0，或者在14天内销量极低，该SKU可能会被系统清退。\\n\\n2. 无动销处理：\\n如果商品入库超过30天仍然没有动销（即没有销售记录），可能面临退仓或清货处理。\\n\\n3. 不健康库存定义：\\n若商品连续30个自然日无销售，或库龄超过60天，或超出分配库容，均会被界定为“不健康库存”，可能面临分批强制折扣清货。\\n\\n建议您采取“多款式、轻库存”的策略，并定期通过后台的库存管理板块监控每个SKU的动销情况，及时通过调整价格或开启促销活动来提升销量，避免因库存积压导致被强制清退或产生额外的长期仓储费。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-22 17:02:13\",\"用户\":\"Manda\",\"群\":\"\",\"用户问询\":\"墨西哥美国转运仓模式是墨西哥full模式吗？\",\"AI响应\":\"你好！很高兴能为你解答。\\n\\n墨西哥美国转运仓模式（美仓）和墨西哥Full海外仓模式是两种不同的履约模式，它们的主要区别如下：\\n\\n1. 仓库位置与配送方式：\\n- 墨西哥Full模式：货物存储在美客多位于墨西哥境内的官方仓库，属于本土发货。\\n- 美国转运仓模式：货物存储在美客多位于美国德克萨斯州的官方仓库，属于跨境直邮模式。\\n\\n2. RFC税号要求：\\n- 墨西哥Full模式：必须提供墨西哥RFC税号，否则平台会面临约36%的代扣税（16%增值税 + 20%所得税）。\\n- 美国转运仓模式：不需要提供RFC税号。因为该模式属于跨境直邮，进口税费由买家在下单时支付，卖家可以有效避免复杂的税务预扣风险。\\n\\n3. 覆盖范围：\\n- 墨西哥Full模式：主要针对墨西哥本土市场。\\n- 美国转运仓模式：支持“一仓发拉美”，卖家只需备货至美国德州仓，即可同时销售至墨西哥、阿根廷、智利、巴西、哥伦比亚5个国家。\\n\\n总结来说，美国转运仓模式并不是墨西哥Full模式，它是为了方便卖家无需办理当地税号即可合规起步而推出的远程配送模式。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-21 19:51:19\",\"用户\":\"蓝七\",\"群\":\"\",\"用户问询\":\"你好 跨境店铺可以上品到墨西哥full？\",\"AI响应\":\"你好！很高兴为你解答。可以的，国内营业执照申请的就是跨境店，支持海外仓（Full）模式。你需要先在后台创建备货计划，然后通过第三方物流商将货物送往墨西哥本地仓，最后由物流商预约送入平台Full仓。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-21 19:28:24\",\"用户\":\"平凡\",\"群\":\"\",\"用户问询\":\"货物从第三方仓进入美国德州中转仓要收入仓费吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n货物进入美国德州官方转运仓（美仓）是不收录入库费的。\\n\\n此外，如果你使用的是 Temu 美区官方认证仓，目前还有免收入库费、免上架费以及达到周转率永久免仓租等优惠政策。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-21 19:19:29\",\"用户\":\"平凡\",\"群\":\"\",\"用户问询\":\"进入美客多个站点官方仓需要入仓费吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n进入美客多官方仓不需要入仓费。目前美客多不收取入库处理费，但会根据商品的尺寸和存储时长收取仓储费。智利仓库目前的仓储费在另行通知前也是不收取的。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-21 17:26:22\",\"用户\":\"太平洋\",\"群\":\"\",\"用户问询\":\"你好，请问中国的营业执照可以做海外仓吗\",\"AI响应\":\"可以的。国内营业执照完全可以申请海外仓店铺模式。您用国内营业执照申请的就是跨境店，可以选择海外仓或自发货模式。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-21 16:10:24\",\"用户\":\"Alien\",\"群\":\"\",\"用户问询\":\"已经出单的海外仓店铺怎么更换邮箱？\",\"AI响应\":\"亲爱的卖家，对于已经出单的海外仓店铺，更换邮箱的操作需要非常谨慎。\\n\\n1. 提交邮箱后尽量不要修改。如果必须修改，审核时效将在原基础上再增加一个月，这可能会影响您店铺的正常运营。\\n\\n2. 新邮箱必须从未注册过美客多的任何账号。请确保使用谷歌邮箱（Gmail）、Outlook邮箱或阿里云邮箱，不要使用163、QQ、新浪等国内邮箱，以免无法收到系统邮件。\\n\\n3. 修改邮箱可能会触发平台的安全审核或重新验证流程。如果您的店铺正在进行KYC审核，建议等审核完成后再操作，否则会导致审核进度进一步延迟。\\n\\n4. 具体的修改路径通常在后台 Settings 模块的账户信息设置中。\\n\\n由于修改邮箱涉及账号安全和审核周期，建议您在操作前确保新邮箱状态活跃且安全。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-21 10:15:16\",\"用户\":\"一二三四五\",\"群\":\"\",\"用户问询\":\"你好，超大件入FULL怎么申请白名单\",\"AI响应\":\"你好！很高兴为你解答。新卖家的大件商品初始库容配额为1000件，在后台创建大件商品即刻生效。若现有库容无法满足需求，且IPI分数大于70分，可以向您的客户经理申请额外库容。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-20 19:36:48\",\"用户\":\"纳洛童\",\"群\":\"\",\"用户问询\":\"Full是中国东莞仓，怎么会这样\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n如果是东莞全托管备货仓（Full托管），出现“Package content anomaly”通常是包裹检测出现异常，系统自动取消了订单。\\n\\n由于该包裹在到达墨西哥后显示投递失败并取消，可能原因包括：\\n1. **末端配送异常**：包裹在墨西哥当地配送时发现外包装严重破损或内容物泄露，导致无法投递。\\n2. **海关/仓库复核异常**：货物在进入墨西哥境内的抽检或分拣环节被发现与申报信息严重不符。\\n\\n建议你联系对接的客户经理或在后台开Case，提供订单号查询包裹异常的具体原因。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-26 17:29:23\",\"用户\":\"朵儿\",\"群\":\"\",\"用户问询\":\"Full店怎么备货\",\"AI响应\":\"你好！很高兴为你解答。全托管店铺在系统推送备货计划后，按计划创建发货单即可。若需调整数量，请将带#号的SKU代码和数量私下发给对接人员申请。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-25 13:53:00\",\"用户\":\"要等晚上\",\"群\":\"\",\"用户问询\":\"海外仓的话，仓库再美国可以做么\",\"AI响应\":\"可以。您可以选择美国转运仓（美仓）模式，仓库位于德州，支持一仓发拉美五国，且无需办理墨西哥RFC税号。但目前不支持卖家使用自有的美国私人仓直发，商品需入美客多官方德州仓后方可销售。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-24 16:52:33\",\"用户\":\"liang\",\"群\":\"\",\"用户问询\":\"海外仓没有巴西站吗\",\"AI响应\":\"你的问题我暂时无法回答，后续我会丰富我的知识库，敬请见谅。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-24 10:39:52\",\"用户\":\"简简单单普罗达商贸\",\"群\":\"\",\"用户问询\":\"可以直接用第三方海外仓吗？\",\"AI响应\":\"可以。跨境海外仓卖家需要先将货物从国内运输到墨西哥本地第三方仓，随后由物流商在系统线上预约送仓时间，再根据系统分配的具体FULL仓地址按时送达。建议操作前先在卖家后台完成备货计划的创建。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-24 10:38:19\",\"用户\":\"简简单单普罗达商贸\",\"群\":\"\",\"用户问询\":\"你好，怎么备货到海外仓？\",\"AI响应\":\"若跨境海外仓卖家需要发货至平台full仓，首先应找到可发货到墨西哥的第三方物流商，将货物从国内运至墨西哥本地第三方仓。随后，让物流商在系统线上预约送仓时间，系统将分配具体仓库，物流商按约送达即可。建议操作前先在卖家后台完成备货计划创建。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-23 17:43:56\",\"用户\":\"Susan\",\"群\":\"\",\"用户问询\":\"香**公司主体申请全托管或者是半托管，是不是也和国内主体申请的托管店铺一样，把货发到国内的仓库，还是会要求发到香港托管仓库？\",\"AI响应\":\"是的，香**公司主体申请全托管或半托管，货物同样需发送至国内东莞集货仓（广东省东莞市沙田镇进港南路第一产业园205号库台），流程与国内主体一致。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-22 21:50:31\",\"用户\":\"Candy Bai\",\"群\":\"\",\"用户问询\":\"什么情况下海外仓会弃置我的产品\",\"AI响应\":\"以下情况会导致海外仓产品被弃置：\\n1. 退货地址空缺，Full仓退货在20天内未提取。\\n2. 墨西哥站点未填写美国或墨西哥当地三方仓地址。\\n3. 平台使用UPS配送退货，配送三次不成功。\\n4. 4-5月到仓异常件未在规定时间内（如6月23号）取件。\\n5. 商品损坏且卖家选择弃置。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-22 21:49:41\",\"用户\":\"Candy Bai\",\"群\":\"\",\"用户问询\":\"什么情况海外仓会弃置我的货物\",\"AI响应\":\"若商品被判定为不可售且您在20天内未提取，或未填写当地退货地址，商品将被捐赠或销毁。此外，平台使用UPS配送退货，若配送三次不成功也将视为弃货。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-22 21:49:06\",\"用户\":\"Candy Bai\",\"群\":\"\",\"用户问询\":\"什么情况会弃置海外仓 怎么提仓\",\"AI响应\":\"若配送三次不成功将视为弃货。墨西哥站点若未填写美国或墨西哥当地三方仓地址，也将默认弃置。提仓需进入后台Full库存管理部分，预约上门取货，跨境卖家通常需委托当地货代或第三方海外仓代取。目前平台不支持上门自提。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-21 11:57:51\",\"用户\":\"晨夕\",\"群\":\"\",\"用户问询\":\"fti，产品有full标？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\nFTI模式的产品**没有Full标**。\\n\\nFTI（工贸一体）属于自发货/直邮模式的一种，产品从中国发货。只有将货物提前备货至美客多位于拉美当地的官方仓库（海外仓模式），产品才会带 **Full** 标志并享受对应的流量倾斜。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-21 10:58:47\",\"用户\":\"一二三四五\",\"群\":\"\",\"用户问询\":\"你好，超大件入仓怎么申请\",\"AI响应\":\"目前平台暂不支持超大件货物入仓。建议你优先核查货件尺寸是否符合海外仓入库标准，或考虑通过自发货模式进行配送。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-21 10:58:39\",\"用户\":\"一二三四五\",\"群\":\"\",\"用户问询\":\"超大件入仓怎么申请\",\"AI响应\":\"关于海外仓发货及入仓流程，建议参考以下视频指引：\\nhttps://mercadolibre.cn/news/info?id=102\\u0026type=%E7%89%A9%E6%B5%81%E6%96%B9%E6%A1%88\\nhttps://mercadolibre.cn/news/info?id=152\\u0026type=live\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-21 10:06:10\",\"用户\":\"L^\",\"群\":\"\",\"用户问询\":\"海外仓模式算半托？\",\"AI响应\":\"不是的。海外仓模式（Full模式）属于跨境店的一种，卖家需提前备货至拉美当地仓库。而半托管模式是商家自主定价运营，备货至国内东莞仓，由平台负责跨境派送。两者在备货地点和物流流程上是不同的。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-20 18:46:54\",\"用户\":\"Mark\",\"群\":\"\",\"用户问询\":\"请问跨境卖家能不能申请海外仓\",\"AI响应\":\"跨境卖家可以申请海外仓。\\n\\n海外仓模式非常适合希望提升物流效率、缩短配送时间以及提升买家购物体验的卖家。通常，具备以下特点的卖家更适合申请：\\n1. 拥有稳定且较大销售量的企业卖家，能够提前备货到海外仓。\\n2. 具备一定的资金实力和运营能力，能承担备货和物流成本。\\n3. 品牌店铺，尤其是拥有R标或TM标的品牌卖家。\\n\\n如果你已经申请了自发货店铺，想要发海外仓是需要另外申请的。你可以直接联系自己的客户经理申请，或者填写问卷等待海外仓经理联系。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-20 16:34:59\",\"用户\":\"是酥鱼吖\",\"群\":\"\",\"用户问询\":\"美客多full有客服助手吗\",\"AI响应\":\"你好！美客多有智能卖家助手（Seller Assistant）。你可以点击页面上方或下方的 Help 进入帮助中心，点击 Contact Us，右下角将弹出该助手。它支持中、英、西语，可处理货件表现、信誉管理、入仓成本及物流等问题。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-20 15:47:35\",\"用户\":\"沫小北\",\"群\":\"\",\"用户问询\":\"48小时没有入仓会怎么样\",\"AI响应\":\"自发货物流的48小时时效是指：从订单生成开始计算，48个小时内物流商成功揽件，并以物流官网显示的已揽收状态为准。\\n\\n若未在规定时效内完成，属于延迟发货，超时将影响店铺声誉，可能导致流量降权。\\n\\n关于这个时效，有几点关键信息需要您注意：\\n1. 时效计算仅包含工作日，不含周末及节假日。平台会根据中国境内的法定节假日和周末进行剔除。\\n2. 如果在48小时内物流商已取件或包裹已送达仓库，但未扫描，您仍有24小时宽限期联系菜鸟催促扫描。\\n\\n建议您在收到订单后，尽快在中国境内将商品打包并贴上物流面单，确保在规定时间内发送至我们指定的国内物流集运仓。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-20 12:43:40\",\"用户\":\"七\",\"群\":\"\",\"用户问询\":\"美国的海外仓可以吗\",\"AI响应\":\"可以的。普通卖家可以做美国转运仓（美仓）模式。您只需将货物备货至美客多位于美国德克萨斯州的官方仓库，即可实现“一仓发拉美”，覆盖墨西哥、智利、巴西等站点。该模式无需提供RFC税号，由平台负责尾程配送。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"物流咨询\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-23 15:53:04\",\"用户\":\"三毛\",\"群\":\"\",\"用户问询\":\"一定要入仓吗\",\"AI响应\":\"不一定哦，美客多支持多种物流模式，是否入仓取决于你选择的模式：  \\n\\n- **自发货模式**：不需要入仓，可直接从国内直发（支持菜鸟空运等方式），适合新卖家起步，无库存压力。  \\n- **海外仓模式**：需将货物存入美客多官方海外仓（如墨西哥、智利仓），由平台负责后续物流配送，适合有稳定供应链的卖家，能提升配送时效。  \\n- **美国转运仓模式**：需将货物发至美国德州仓库，平台负责尾程派送，适合主打美国市场的卖家。  \\n\\n如果你目前有工厂但缺乏跨境经验，建议先从自发货模式起步，积累运营经验后再考虑海外 \"提现/回款/资金结算\"},{\"时间\":\"2026-07-24 15:46:20\",\"用户\":\"不爱吃饭\",\"群\":\"\",\"用户问询\":\"你好 我的店铺5月6日之后就没有正常回款了，店铺信誉是绿色的，上周根据客服提示换了银行账户，账户显示有余额但是还无法提款，这要怎么办\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n根据你的描述，银行卡号无法更改或更换后无法提款可能有以下几个原因：\\n1. 账户审核状态：您的收款账户可能正在审核中，审核期间会限制修改或结算。\\n2. 订单冻结：如果有未完成的订单或资金结算，系统会锁定收款方式修改。\\n3. 系统权限：某些情况下平台会临时限制账户信息修改功能。\\n4. 余额限制：平台的回款周期是当账户单个站点的余额达到500美金或以上时，会每周自动结算一次。如果余额没有达到500美金，就不会自动扣款或结算，余额会一直留在平台账户里。\\n5. 认证流程：作为设置国际银行账户的必经步骤，卖家须完成面部重新认证流程。\\n\\n建议你联系我们的同事核实具体原因，并提供您的店铺信息，我们会帮您排查是技术问题还是账户状态问题，并协助您恢复修改及提款功能。\\n\\n网页参考资料：\\nhttps://file.marsmind.cc/kgmultimodal/knowledge/multimodal/default/20260203/ab2f4249b08e4dd6ac8e498042bbee06.png\",\"一级大类\":\"财税合规\",\"二级子类\":\"资金管理\",\"问题主题\":\"提现/回款/资金结算\"},{\"时间\":\"2026-07-24 16:28:19\",\"用户\":\"李伟\",\"群\":\"\",\"用户问询\":\"已绑定好pingpong账号了，但怎么还无法提现？美客多后台显示已可提现500美金 刚绑定后预计多久可入账\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n虽然你已经在美客多后台绑定了 PingPong，且余额达到了 500 美金，但款项并不会立即出现在 PingPong 账户中。\\n\\n具体的打款时间取决于第三方收款服务商的处理周期。美客多平台会按照固定的结算周期（通常是每周）自动发起打款请求。由于你刚刚完成绑定，系统需要时间来识别并处理这笔款项。\\n\\n建议你耐心等待 3-5 个工作日，并留意 PingPong 账户的状态变化。如果超过一个结算周期仍未入账，建议咨询 PingPong 客服核实链路状态。\",\"一级大类\":\"财税合规\",\"二级子类\":\"资金管理\",\"问题主题\":\"提现/回款/资金结算\"},{\"时间\":\"2026-07-24 14:08:47\",\"用户\":\"李伟\",\"群\":\"\",\"用户问询\":\"你好，我的美客多跨境店可提现金额已超过500美金，请指导如何提现的设置流程？目前我们采取用连连支付的系统\",\"AI响应\":\"你好！很高兴为你解答。账户中单个站点的可结算金额达到 ***美元可每周提现。\\n\\n关于绑定连连国际（Lianlian）收款的操作，目前连连没有实现后台的钱包直连，你需要绑定连连提供的非美国的美金账号即可。\\n\\n具体提现流程如下：\\n1. 登录卖家中心，进入收款账户设置页面。\\n2. 填写并绑定连连国际提供的非美国美金账号信息。\\n3. 卖家可以在卖家中心申请提现，平台会处理提现请求，并将款项转入你绑定的收款账户。\",\"一级大类\":\"财税合规\",\"二级子类\":\"资金管理\",\"问题主题\":\"提现/回款/资金结算\"},{\"时间\":\"2026-07-20 16:42:39\",\"用户\":\"明月清风\",\"群\":\"\",\"用户问询\":\"你只需要准备以下资料即可申请入驻： A. 中**公司营业执照（须是“有**公司”，不接受个体户） 只有这些要求吗 B. 法人身份证，法人需配合人脸识别认证 C. 收款的银行账户（美金账户或第三方收款账户） D. 注册邮箱（建议使用 Gmail/Outlook/Aliyun 等）\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n是的，目前普通自发货和海外仓模式的入驻资料要求就是这些，不需要提供流水。\\n\\n总结一下，你只需要准备好以下材料即可：\\n1. 中**公司营业执照（不接受个体户，须是“有**公司”）。\\n2. 法人身份证（法人需配合人脸识别认证）。\\n3. 收款的银行账户（美金银行账户/第三方收款账户）。\\n4. 邮箱及联系人电话（邮箱建议使用Gmail/Outlook/Aliyun/Hotmail/Foxmail）。\\n5. 如果是品牌店，还需提供R标或TM标。\\n\\n普通自发货/海外仓也可选择自注册（PC端登入）：https://global-selling.mercadolibre.com/landing/about\",\"一级大类\":\"财税合规\",\"二级子类\":\"资金管理\",\"问题主题\":\"提现/回款/资金结算\"},{\"时间\":\"2026-07-24 22:32:34\",\"用户\":\"wong\",\"群\":\"\",\"用户问询\":\"全托管：产生售后是否正常结算货款，退仓费是什么费用：全托管核价后是否可以调整 半托管：售后问题是否可以联系客人沟通解决，如果产生退货，仓库是否提供回收和二次打包销售服务，是否会产生成本\",\"AI响应\":\"全托管：产生售后不结算货款。退仓费指商品退回商家产生的物流费。核价通过后，若需调价需联系买手或通过核价表申诉。\\n\\n半托管：可以联系客人沟通。产生退货由平台处理，目前不提供二次打包销售服务。若商品损坏弃置会产生弃置费，退仓则由商家承担运费。\",\"一级大类\":\"财税合规\",\"二级子类\":\"资金管理\",\"问题主题\":\"提现/回款/资金结算\"},{\"时间\":\"2026-07-21 11:12:40\",\"用户\":\"timeless\",\"群\":\"\",\"用户问询\":\"那如果销量较差的站点，没有达到可结算的门槛，余额永远都无法提现？？\",\"AI响应\":\"你好！很高兴为你解答。是的，此提现门槛针对单站点计算，单站点满 500 美元即可自动结算回款。若不满该额度，资金会保留在账户直至达标。\",\"一级大类\":\"财税合规\",\"二级子类\":\"资金管理\",\"问题主题\":\"提现/回款/资金结算\"},{\"时间\":\"2026-07-21 05:05:58\",\"用户\":\"水果🍉\",\"群\":\"\",\"用户问询\":\"要卖完全部货才会回款吗，回款是怎么回的，一单一单还是一批\",\"AI响应\":\"不需要卖完全部货才回款。全托管模式下，订单妥投后7个工作日即可结算。当单站点可结算金额累计满500美元时，系统会按周自动触发回款至您绑定的收款账户。\",\"一级大类\":\"财税合规\",\"二级子类\":\"资金管理\",\"问题主题\":\"提现/回款/资金结算\"},{\"时间\":\"2026-07-25 11:52:20\",\"用户\":\"彬\",\"群\":\"\",\"用户问询\":\"扣款是签收完才开始扣款和回款吗？\",\"AI响应\":\"你好！很高兴为你解答。佣金和运费通常在订单产生或发货时记录，但最终结算是在订单妥投后进行的。全托管模式在妥投后7个工作日回款，回款金额为你的目标收益价。\",\"一级大类\":\"财税合规\",\"二级子类\":\"资金管理\",\"问题主题\":\"提现/回款/资金结算\"},{\"时间\":\"2026-07-24 15:58:22\",\"用户\":\"李伟\",\"群\":\"\",\"用户问询\":\"已绑定好pingpong了，然后怎么安排提现\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n绑定好 PingPong 账户后，你不需要手动操作提现。\\n\\n美客多跨境店铺的结算机制是自动触发的：只要你单个站点的可结算金额超过 500 美金，平台会在每周的结算日自动将款项汇入你绑定的 PingPong 账户。\\n\\n你只需要留意 PingPong 账户的入账通知即可。若后续需要更改收款账户，仍需前往后台路径 Settings \\u003e Selling preferences \\u003e Collection method 操作，且更改操作需要完成法人人脸识别验证。\",\"一级大类\":\"财税合规\",\"二级子类\":\"资金管理\",\"问题主题\":\"提现/回款/资金结算\"},{\"时间\":\"2026-07-24 10:30:17\",\"用户\":\"Sik-\",\"群\":\"\",\"用户问询\":\"意思就是按照当日的实际汇率来结算回款？\",\"AI响应\":\"是的，回款金额是按照实时汇率将当地货币转换为美金。当单站点净余额达到500美金时，系统会自动触发回款。\",\"一级大类\":\"财税合规\",\"二级子类\":\"资金管理\",\"问题主题\":\"提现/回款/资金结算\"},{\"时间\":\"2026-07-23 14:18:46\",\"用户\":\"彩虹\",\"群\":\"\",\"用户问询\":\"老师 我现在只是通过了kyc法人资料验证，其他比如说收款方式啥的或者其他的设置还没有去弄 然后有具体得一些上款运营发货的细节流程吗？\",\"AI响应\":\"您好~您可以按以下步骤推进运营：  \\n\\n1. **绑定收款**：进入后台 `Settings \\u003e Selling preferences \\u003e Collection method` 完成收款方式绑定，需完成法人人脸识别（入口仅对KYC通过用户开放哦~）；  \\n   2. **上架商品**：直接在后台创建商品，填写标题、描述、图片等信息，注意女鞋类目合规要求；  \\n   3. **物流配置**：在“物流”模块为各站点（如墨西哥、哥伦比亚等）设置自发货物流，选择合适的物流商（如官方推荐的自发货方式）；  \\n   4. **订单处理**：订单生成后，及时打包发货并更新物流单号，跟进售后问题。  \\n\\n如果需要更细节的操作指引，可以告诉我哦~\",\"一级大类\":\"财税合规\",\"二级子类\":\"资金管理\",\"问题主题\":\"提现/回款/资金结算\"},{\"时间\":\"2026-07-23 10:24:36\",\"用户\":\"tr\",\"群\":\"\",\"用户问询\":\"如果店铺被封了。想将余额提现怎么操作\",\"AI响应\":\"店铺封禁后，资金通常会被冻结90天，待所有在途订单妥投且售后索赔期结束后，剩余款项才会释放，建议届时联系美客多官方客服申请结算。\",\"一级大类\":\"财税合规\",\"二级子类\":\"资金管理\",\"问题主题\":\"提现/回款/资金结算\"},{\"时间\":\"2026-07-22 16:09:05\",\"用户\":\"TMR商学院运营-萍萍\",\"群\":\"\",\"用户问询\":\"绑定了pingpong收款账户，但是pingpong上没有显示店铺，美客多销售偏好里有pingpong，我该怎么解绑旧的账户，重新进行验证\",\"AI响应\":\"你好！很高兴为你解答。需前往后台 Settings \\u003e Selling preferences \\u003e Collection method，点击对应站点进行解绑或更换。绑定或更换操作均需完成法人人脸识别验证。该设置入口仅在 KYC 通过后才会展示。\",\"一级大类\":\"财税合规\",\"二级子类\":\"资金管理\",\"问题主题\":\"提现/回款/资金结算\"},{\"时间\":\"2026-07-22 13:52:04\",\"用户\":\"若初见\",\"群\":\"\",\"用户问询\":\"站点退掉，提现，后续站点还能再开吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n如您需要注销美客多店铺下的站点账户，请登录卖家后台，进入\\\"帮助中心\\\"页面联系客服。注销申请通过审核后，客服将帮助发起最终结算对账，应结算款项将在店铺注销完成后7个工作日内，转至您站点的绑定回款账户。\\n\\n关于注销后是否能再开，目前平台政策规定，站点一旦注销完成，该账号下的对应站点通常无法再次开启或恢复。如果您未来仍想经营该市场，可能需要重新申请新的账号。因此，在申请注销前请务必谨慎考虑。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"财税合规\",\"二级子类\":\"资金管理\",\"问题主题\":\"提现/回款/资金结算\"},{\"时间\":\"2026-07-21 11:11:01\",\"用户\":\"timeless\",\"群\":\"\",\"用户问询\":\"看到了可提现的余额，如何操作提现呢\",\"AI响应\":\"你好！很高兴为你解答。只要您在后台绑定了收款账户，当单站点可结算金额达到***美元门槛后，系统会每周自动触发打款，无需手动操作提现。\",\"一级大类\":\"财税合规\",\"二级子类\":\"资金管理\",\"问题主题\":\"提现/回款/资金结算\"},{\"时间\":\"2026-07-25 11:54:11\",\"用户\":\"彬\",\"群\":\"\",\"用户问询\":\"回款还不够扣除7月份的扣款麽？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n从图片看，7月总开票金额为***比索，这是平台收取的各项服务费总额。目前你的可提现余额仅为64.19美元，待释放金额为***美元。\\n\\n如果你的销售额扣除这些服务费后，剩余净利润不足以覆盖账单，余额就会显示较少。建议点击“操作”下载明细，核对各项扣款是否准确。\",\"一级大类\":\"财税合规\",\"二级子类\":\"资金管理\",\"问题主题\":\"提现/回款/资金结算\"},{\"时间\":\"2026-07-25 11:52:32\",\"用户\":\"彬\",\"群\":\"\",\"用户问询\":\"扣款和回款是同步的吗？\",\"AI响应\":\"你好！很高兴为你解答。扣款和回款并非完全同步。订单妥投后，系统会先扣除佣金、物流费等各项费用，剩余净利润在满足7个工作日等待期且单站点余额满500美金时，才会触发自动回款。\",\"一级大类\":\"财税合规\",\"二级子类\":\"资金管理\",\"问题主题\":\"提现/回款/资金结算\"},{\"时间\":\"2026-07-24 17:01:43\",\"用户\":\"啊楼🍉\",\"群\":\"\",\"用户问询\":\"提现拒绝是什么原因\",\"AI响应\":\"目前无法直接判断具体原因。提现拒绝可能由以下原因导致：提交的资料不完整或不真实、不符合平台运营要求、收款账户信息有误或存在安全风险。建议优先核查收款账户状态及平台站内信通知。\",\"一级大类\":\"财税合规\",\"二级子类\":\"资金管理\",\"问题主题\":\"提现/回款/资金结算\"},{\"时间\":\"2026-07-24 14:55:29\",\"用户\":\"C君\",\"群\":\"\",\"用户问询\":\"美客多，提现在哪里看？？\",\"AI响应\":\"账户中单个站点的可结算金额达到 ***美元可每周提现。您可以登录卖家后台，在结算或钱包相关模块查看可提现金额及状态。\",\"一级大类\":\"财税合规\",\"二级子类\":\"资金管理\",\"问题主题\":\"提现/回款/资金结算\"},{\"时间\":\"2026-07-24 10:29:26\",\"用户\":\"Sik-\",\"群\":\"\",\"用户问询\":\"那金额回款是按照什么汇率来结算\",\"AI响应\":\"回款金额是按照美金结算的。系统会根据实时汇率将前台当地货币售价转换为美金，当单站点净余额达到500美金时自动触发回款。\",\"一级大类\":\"财税合规\",\"二级子类\":\"资金管理\",\"问题主题\":\"提现/回款/资金结算\"},{\"时间\":\"2026-07-23 10:25:25\",\"用户\":\"tr\",\"群\":\"\",\"用户问询\":\"没封店的想闭店提现怎么申请\",\"AI响应\":\"卖家您好，若店铺未被封禁且需闭店提现，可按以下步骤操作：  \\n1. 先完成店铺闭店流程（路径：卖家中心→店铺设置→关闭店铺）；  \\n2. 在卖家中心的“资金管理”模块中，点击“申请提现”，系统会自动结算可提现余额；  \\n3. 若账户有未完成订单，需确保所有订单售后周期结束后再操作提现。  \\n\\n操作前建议联系美客多官方客服确认当前账户状态及可提现金额，避免因未完成订单导致资金冻结。\",\"一级大类\":\"财税合规\",\"二级子类\":\"资金管理\",\"问题主题\":\"提现/回款/资金结算\"},{\"时间\":\"2026-07-22 02:53:05\",\"用户\":\"水果🍉\",\"群\":\"\",\"用户问询\":\"美**公司公户提现吗\",\"AI响应\":\"你好！很高兴为你解答。美客多支持绑定第三方收款账户（如万里汇、派安盈等），不**公司公户。只要在后台完成第三方账户绑定，款项达标后会自动结算至该账户。\",\"一级大类\":\"财税合规\",\"二级子类\":\"资金管理\",\"问题主题\":\"提现/回款/资金结算\"},{\"时间\":\"2026-07-21 14:13:52\",\"用户\":\"官方提醒\",\"群\":\"\",\"用户问询\":\"美客多的提现政策是什么\",\"AI响应\":\"账户中单个站点的可结算金额达到 ***美元可每周提现。绑定万里汇（WorldFirst）后，系统会自动触发打款，无需手动操作。\",\"一级大类\":\"财税合规\",\"二级子类\":\"资金管理\",\"问题主题\":\"提现/回款/资金结算\"},{\"时间\":\"2026-07-21 11:07:29\",\"用户\":\"timeless\",\"群\":\"\",\"用户问询\":\"可提现金额在哪里查看\",\"AI响应\":\"你好！很高兴为你解答。卖家可以在平台卖家中心的财务报表或交易记录中查询收款账户的交易明细及可提现金额。\",\"一级大类\": ,\"问题主题\":\"提现/回款/资金结算\"},{\"时间\":\"2026-07-20 15:51:32\",\"用户\":\"明月清风\",\"群\":\"\",\"用户问询\":\"可以随时提现吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n美客多店铺的提现并不是随时进行的，而是有固定的周期和门槛要求：\\n\\n1. 提现门槛：账户中单个站点的可结算金额达到 ***美元。\\n2. 提现周期：当达到 500 美元门槛后，系统会每周自动触发打款，将款项转入你绑定的第三方收款账户。\\n\\n卖家可以在卖家中心申请提现，平台会处理提现请求。如果单个站点的净余额不足 500 美金，则需要继续累计直到达到门槛后才会结算。\",\"一级大类\":\"财税合规\",\"二级子类\":\"资金管理\",\"问题主题\":\"提现/回款/资金结算\"},{\"时间\":\"2026-07-26 00:50:21\",\"用户\":\"回家吃饭啰\",\"群\":\"\",\"用户问询\":\"你好，想问一下，我要绑定美客多收款帐户，人脸一直过不了，几个星期了。怎么解决？能否用短信验证码\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n关于绑定收款账户时人脸识别失败的问题，建议你尝试以下解决方案：\\n\\n1. 确保在光线充足、无阴影的环境下进行人脸识别。\\n2. 如果在电脑端扫码没反应，可以直接使用有摄像头的电脑进行人脸认证。\\n3. 建议将验证链接复制到苹果手机的 Safari 浏览器或使用谷歌浏览器（Chrome）再次尝试。\\n4. 绑定或更换收款账户的操作路径为：Settings \\u003e Selling preferences \\u003e Collection method。\\n\\n关于你提到的短信验证码，美客多近期更新了收款方式政策。当卖家更改收款方式时会触发二次KYC，此时系统会提供短信或者邮箱验证的选项，这可以帮助商家避免无法扫脸的问题。\\n\\n请注意，绑定或更换收款账户的操作必须由法人本人完成，且该设置入口仅在KYC通过后才会展示。若多次尝试仍无法通过，建议联系后台客服寻求进一步支持。\",\"一级大类\":\"财税合规\",\"二级子类\":\"资金管理\",\"问题主题\":\"提现/回款/资金结算\"},{\"时间\":\"2026-07-22 11:03:55\",\"用户\":\"Evan Li\",\"群\":\"\",\"用户问询\":\"按照供货价结算是什么意思呢？定价是我们自主设置吧，价格是分成几个模块，要设置净收益+供货价？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n按照供货价结算指平台最终打款给你的金额就是你提报的供货价。\\n\\n在全托管/半托管模式下，你只需设置一个价格，即“供货价”（也叫净收益）。\\n\\n供货价 = 产品成本 + 你的目标利润 + 国内发货至东莞仓的物流成本。\\n\\n你不需要设置前端售价。平台会在你填写的供货价基础上，自动叠加佣金和国际运费生成前端售价。无论平台前端如何调价促销，只要供货价不变，你的回款金额就不会变。\",\"一级大类\":\"财税合规\",\"二级子类\":\"资金管理\",\"问题主题\":\"提现/回款/资金结算\"},{\"时间\":\"2026-07-21 09:35:22\",\"用户\":\"B.\",\"群\":\"\",\"用户问询\":\"新店铺还没有出单，账户没有余额可以开广告吗？开广告的费用是必须账户有钱才能开还是可以预付款\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n美客多的广告费用只能从您的卖家账户余额中扣除，不支持信用卡充值或预充值。\\n\\n由于新店铺还没有出单，账户余额为零，这种情况下是无法开启广告的。您需要先通过自然流量或者参加平台活动实现出单，待账户内有了销售回款产生的余额后，系统才能扣除广告费用，届时您才能正常使用广告工具。\",\"一级大类\":\"财税合规\",\"二级子类\":\"资金管理\",\"问题主题\":\"提现/回款/资金结算\"},{\"时间\":\"2026-07-25 22:11:21\",\"用户\":\"Liam\",\"群\":\"\",\"用户问询\":\"我可以绑定 连连国际的收款方式吗？ 是香港的银行卡 应该属于国际银行卡吧？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n可以绑定连连国际的收款账号。美客多支持香港、新加坡、英国等非美国账号。只要你的连连账号是非美国银行账号，就可以用于绑定收款。\",\"一级大类\":\"财税合规\",\"二级子类\":\"资金管理\", :\"\",\"用户问询\":\"- Modelos: Rumi, Mira, Zoey写具体的这些名字不会侵权吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n**Rumi, Mira, Zoey** 这些名字本身属于常见人名，通常不构成商标侵权。但如果这些名字与特定知名动漫（如《鬼灭之刃》或其他热门作品）中的角色名完全对应，且产品形象高度相似，则存在**版权侵权**的风险。\\n\\n**建议处理方式：**\\n1. 如果这三个名字是该系列玩偶的通用型号名，可以保留。\\n2. 如果你担心风险，建议将其改为更通用的描述，例如：**Modelo A, Modelo B, Modelo C**。\\n3. 严禁在标题或描述中提及 **Demon Slayer** 或 **Kimetsu no Yaiba** 等明确的动漫品牌词。\\n\\n**自查建议：**\\n建议建立“事前查清单 + 事后看 Health”的双重防御机制。上架前请务必通过官方入口核实风险：https://global-selling.mercadolibre.com/help/1078\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-23 20:59:20\",\"用户\":\"Yang          .\",\"群\":\"\",\"用户问询\":\"你可以帮我消除侵权影响吗，我认为我的这个商品没有侵权， 请帮我排除下\",\"AI响应\":\"您好！如果您认为商品没有侵权，需要排除侵权影响，您可以这样操作：  \\n1. 登录美客多后台，进入Listings \\u003e Health（健康度）模块，找到被标记为侵权的商品；  \\n2. 点击“申诉”或“提交反通知”，向平台提供证明您无侵权的相关证据，例如：  \\n   - 证明您是商品权利人的文件（如品牌授权书、版权证明等）；  \\n   - 商品图片/内容的存证副本（证明未侵权的原创性或合规性）；  \\n3. 提交后等待平台审核，审核结果会通过后台通知您。  \\n\\n请尽快处理，侵权可能影响账户状态，建议提前自查商品合规性。\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-23 17:37:05\",\"用户\":\"Tao Zhu\",\"群\":\"\",\"用户问询\":\"经理 这个品牌保护计划 最后一步确定怎么点击不了\",\"AI响应\":\"你好！品牌保护计划提交时最后一步按钮无法点击，通常是网络或浏览器兼容性问题导致。建议用Chrome浏览器并清除缓存，关闭网页自动翻译，避开邮件链接直接从后台进入，换设备或网络重试。若仍不行可联系客服。\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-23 14:55:06\",\"用户\":\"纯属巧合\",\"群\":\"\",\"用户问询\":\"我是半托管店铺， 只需要我品牌备案就可以成为官方店铺吗\",\"AI响应\":\"你好！很高兴为你解答。  \\n\\n半托管店铺若想升级为官方店铺，**仅品牌备案是不够的**，还需满足以下核心条件：  \\n\\n### 1. **品牌资质要求**  \\n- **商标与授权**：需提交 **品牌商标注册证**（R标或TM标均可，部分站点需R标），若为代理销售还需提供 **品牌方授权书**（明确授权范围及期限）。  \\n- **类目合规**：官方店铺对特定类目（如电子产品、奢侈品）有额外资质要求，需提前确认目标类目是否开放官方店入驻。  \\n\\n\\n### 2. **店铺运营资质**  \\n- **企业资质**：半托管店铺若为个人卖家，需升级为企业主体（如公司账号）；若为企业账号，需确保营业执照与品牌商标主体一致。  \\n- **税务合规**：需完成墨西哥RFC税号注册（若销售墨西哥站点产品），并通过平台税务资质审核。  \\n\\n\\n### 3.** 官方店与半托管店的本质区别**  \\n半托管店属于基础服务型店铺，官方店是**品牌化资质认证**，两者功能权限差异较大：  \\n- ✅ 官方店可获得「品牌搜索加权」「首页推荐位」「专属客服」等权益；  \\n- ❌ 半托管店仅享受基础仓储与物流服务，无额外品牌资质加成。  \\n\\n\\n### 操作建议  \\n你可通过后台【店铺设置】→【商家资质】提交上述资料，平台会对品牌真实性及合规性进行审核评估周期约7个工作日。若后续有疑问，可联系客户经理获取最新指引。  \\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-23 02:52:56\",\"用户\":\"艳子慧里\",\"群\":\"\",\"用户问询\":\"产品有美国品牌，是否在克重要求放宽或者其他优势吗\",\"AI响应\":\"不好意思，该问题我没有答案\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-22 11:43:46\",\"用户\":\"7881302346208177\",\"群\":\"TT - 晋江市卡陆奇贸易有限责任公司 - 自发货经理对接群\",\"用户问询\":\"@美客多跨境小助手小文 你好，自发的仿冒品牌这个要怎么处理\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n针对自发货产品因仿冒品牌导致未激活的问题，建议按以下步骤处理：\\n\\n1. 核实授权：若销售知名品牌，需准备好正规采购发票、品牌授权书及带有Logo的实物图。\\n2. 品牌备案：若为自主品牌，请在后台提交商标证书（R标）进行备案。\\n3. 修改Listing：若无授权，请移除标题、描述及图片中的品牌信息。在品牌字段填写通用，不要填写具体品牌名称，避免系统抓取判定侵权。\\n4. 提交申诉：通过后台Help模块或联系客户经理提交合规证明材料。\\n\\n如果确认产品存在侵权风险，建议立即删除Listing，以免影响店铺信誉。\\n\\n普通自发货也可选择自注册（PC端登入）：https://global-selling.mercadolibre.com/landing/about\\n\\n入驻准备材料：\\n1. 营业执照彩色扫描件。\\n2. 法人身份证正反面彩色扫描件。\\n3. 准确的联系电话及邮箱。\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-20 16:38:19\",\"用户\":\"Freya\",\"群\":\"\",\"用户问询\":\"我们有自己的品牌，有R标认证，可以在平台申请品牌标吗？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n平台对品牌注册有一定要求，卖家需要拥有有效的商标注册证，并遵循平台的品牌注册指南。\\n\\n如果你拥有R标，可以加入美客多的品牌保护计划（BPP），加入后可以投诉侵权商品。申请材料只接受当地R标或R标授权，不接受其他目的地商标（如国内商标、美标）。\\n\\n申请地址（官网）：https://global-selling.mercadolibre.com/brandprotection/enforcement \\n\\n注：中**公司税号ID type 填写TIN，后面ID number 写数字。如果商家纳税是在大陆，一般是内陆税号或者香港税号。\\n\\n网页参考资料：\\n关于品牌保护计划的详细介绍：https://mp.weixin.qq.com/s/126NjDEYue76huIoq_X-Hg\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-20 15:55:45\",\"用户\":\"明月清风\",\"群\":\"\",\"用户问询\":\"某某品牌售后件 是允许售卖的吗 且不会违反平台规则\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n在美客多平台，售卖某品牌的售后件或通用件是允许的，但必须严格遵守以下规则以确保不违反平台政策：\\n\\n1. 品牌字段填写：\\n在后台上架产品时，【品牌】（Brand）处必须填写为“Generic”（通用），绝对不能填写该原厂品牌名称。如果填写了原厂品牌，会被系统抓取并判定为侵权。\\n\\n2. 标题描述规范：\\n标题中不能直接使用品牌名作为主语。你必须使用适配性描述，例如“适配于 [品牌名] [型号]”或“适用于 [品牌名]”。这样可以明确告知消费者这是第三方生产的兼容配件，而非原厂品牌件。\\n\\n3. 图片要求：\\n产品图片中严禁出现该品牌的Logo或任何受版权保护的标识。\\n\\n4. 零容忍政策：\\n平台对售卖假冒品牌商品采取零容忍政策。如果你将第三方生产的配件冒充原厂品牌件售卖，一经发现，将立即移除商品，并可能对卖家账户进行处罚。\\n\\n只要你严格按照“通用件”的定义进行描述和上架，不误导消费者，不盗用他人品牌标识，是可以正常售卖的。\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-20 15:44:31\",\"用户\":\"明月清风\",\"群\":\"\",\"用户问询\":\"那墨西哥对于是某某品牌的售后件和通用件的配件，有什么政策要求呢\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n在墨西哥站点销售品牌售后件或通用件，必须严格遵守平台的知识产权政策和法律监管要求：\\n\\n1. 标题与描述规范\\n严禁在标题中直接使用品牌名称作为主语。必须使用适配性描述，例如“适配于 [品牌名] [型号]”或“适用于 [品牌名]”。严禁在产品图片中展示该品牌的Logo。\\n\\n2. 品牌字段填写\\n在上传产品时，如果该配件不是品牌原厂件，【品牌】（Brand）字段必须填写为“Generic”（通用），不得填写原厂品牌名称，否则会被系统判定为侵权。\\n\\n3. 法律与监管责任\\n卖家必须对所提供物品的合法性和正当性负责，拥有销售该产品所需的必要授权或许可。确保包裹内容符合墨西哥的海关规定和进口要求。\\n\\n4. 墨西哥RFC税号相关\\n在墨西哥经营，涉及RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\\n\\n如果你准备入驻，普通自发货/海外仓也可选择自注册（PC端登入）：https://global-selling.mercadolibre.com/landing/about\\n\\n入驻准备材料：\\nA. 中**公司营业执照\\nB. 法人身份证\\nC. 收款银行账户\\nD. 注册邮箱（建议Gmail、Outlook等）\\nE. 手机号\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-24 15:21:29\",\"用户\":\"喵\",\"群\":\"\",\"用户问询\":\"你好 我想咨询下巴西品牌店铺的申请\",\"AI响应\":\"你好！很高兴为你解答。申请巴西品牌官方店，绿色信誉是必备条件。品牌备案需提供巴西注册成功的商标证书（R标）、品牌授权书、产品实物图及品牌信息，通过卖家中心后台提交，审核通常需要2至4周。若涉及巴西本土店申请，请咨询官方招商经理。\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-22 16:46:03\",\"用户\":\"蓝七\",\"群\":\"\",\"用户问询\":\"你好 在哪里可以查看商品是否侵权？\",\"AI响应\":\"你好！很高兴为你解答。你可以登录美客多后台，查看 Listings \\u003e Health（健康度）模块，找到被标记为侵权的商品。建议在销售品牌相关产品前，先通过以下链接自查：https://doc.weixin.qq.com/pdf/d3_ARIAagYiAMICNl0DIxxkJSRSEfA4a?scode=AI8A3wfvAAoau66dDWARIAagYiAMI\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-22 15:39:58\",\"用户\":\"洁珍\",\"群\":\"\",\"用户问询\":\"我的FTI品牌店，可以上传不是自己品牌的产品吗\",\"AI响应\":\"卖家您好，很高兴为您解答。\\n\\nFTI店铺可以上传非自有品牌的产品，但必须确保拥有该品牌的合法授权。\\n\\n如果您上传其他品牌的产品，请务必在后台提交对应的品牌授权书，以证明您拥有销售该品牌产品的权利。如果无法提供授权证明，建议以无品牌（Generic）的形式上架，但请注意，无品牌产品在流量和转化上可能不如品牌产品，且仍需确保不侵犯他人的知识产权。\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-21 16:50:41\",\"用户\":\"￴ ￴￴ ￴￴\",\"群\":\"\",\"用户问询\":\"我有自己的品牌，美客多这边可以上传品牌授权吗\",\"AI响应\":\"可以的。你可以登录卖家后台，在 Listings 菜单下找到 Brand Protection 或 Brand Registry 选项上传资料。如果你是授权品牌商而非权利人，请在添加时选择第二个选项。\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-21 15:32:14\",\"用户\":\"Daoma.\",\"群\":\"\",\"用户问询\":\"跨境店铺 怎么上传 品牌授权 我自己有品牌\",\"AI响应\":\"你好！很高兴为你解答。你自己有品牌的话，请登录卖家后台，在 Listings 菜单下找到 Brand Protection 或 Brand Registry 选项进行操作。\\n\\n备案核心材料：\\n1. 销售目的国注册成功的商标证书（R标）。\\n2. 带有品牌 Logo 的产品实物照片。\\n3. 品牌名称、所属类目等基本信息。\\n\\n提交后审核周期通常为 2 至 4 周。若注册阶段申请表未填，提交后记得及时补上。\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-20 11:57:28\",\"用户\":\"Ivan\",\"群\":\"\",\"用户问询\":\"若与平台相似可能存在侵权风险是什么意思\",\"AI响应\":\"虽然注册时通过了，但店铺名称与平台名称相似可能存在商标侵权风险。建议您尽快联系我们的招商经理或客服确认是否需要修改店铺名称，避免后续可能的违规处理。\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-26 13:47:32\",\"用户\":\"Andrew\",\"群\":\"\",\"用户问询\":\"怎么避免侵权，什么情况下会侵权\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n在美客多经营，建议建立“事前查清单 + 事后看 Health”的双重防御机制。\\n\\n关于如何避免侵权及常见的侵权场景，请参考以下建议：\\n\\n1. 品牌侵权（商标权）\\n场景：在标题、描述或图片中使用他人注册商标；未获授权暗示自己是官方分销商。\\n避免方法：\\n- 店铺没有做品牌备案的，后台上品时【品牌】处填写“通用（Generic）”，不要填具体品牌。\\n- 标题和图片不能使用对应品牌。\\n- 若出售品牌产品的配件，标题中必须加上“for”或“compatible with”。例如：Case compatible with iPhone 16 Plus。\\n\\n2. 版权侵权\\n场景：未经授权提供书籍（如PDF）、软件、视频游戏、照片、音乐或电影的副本；使用未经授权的图库照片。\\n避免方法：\\n- 仅使用获得权利持有人明确授权的照片，或来自授权商业使用的图库。\\n- 不要提供未经授权的衍生作品（如翻译和改编）。\\n\\n3. 专利及实用新型侵权\\n场景：提供相同技术解决方案的产品或复制品。\\n避免方法：\\n- 避免提供复制品。\\n- 仅在您可以证明自己是专利拥有者或获得拥有者授权时，才提供该产品。\\n\\n4. 平台自查建议\\n- 上架前：务必对照官方品牌/禁售清单核实风险。\\n- 运营中：每日监控后台 Listings \\u003e Health（健康度）模块及邮件通知，发现预警立即下架整改。\\n- 品牌保护：如果您拥有品牌，强烈建议加入美客多的品牌保护计划（BPP）。\\n\\n官方自查入口：https://global-selling.mercadolibre.com/help/1078\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-24 22:48:23\",\"用户\":\"吕亚举\",\"群\":\"\",\"用户问询\":\"没有品牌可以投诉吗\",\"AI响应\":\"你好！没有品牌备案的情况下，投诉侵权的难度较大。建议你优先通过后台举报对方“货不对板”或“描述不符”，并提供产品对比图、发票等证据证明对方销售劣质货，以维护链接环境。\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-23 20:38:43\",\"用户\":\"Yang          .\",\"群\":\"\",\"用户问询\":\"能帮我消除侵权影响吗？\",\"AI响应\":\"您好！关于删除侵权商品，我建议您：1. 登录美客多后台，查看Listings \\u003e Health（健康度）模块，找到被标记为侵权的商品；2. 立即下架相关侵权产品；3. 检查商品是否涉及假冒品牌、未授权使用商标或版权内容；4. 如需申诉，可提供权利人授权证明。请注意，侵权可能导致账户暂停甚至永久封禁，请及时处理并加强事前自查。\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-23 19:54:53\",\"用户\":\"😐\",\"群\":\"\",\"用户问询\":\"跨境店主体可以认证品牌店吗\",\"AI响应\":\"是的，跨境店主体（即通过跨境方式入驻的店铺主体）若符合品牌店认证的主体要求，就可以认证品牌店。  \\n\\n品牌大商认证（Tienda Oficial官方品牌店）的基础门槛之一是**主体为大陆/香**有限公司**（不能是个体户；公司成立满6个月；经营范围含进出口、电商贸易）。若你的跨境店主体满足上述条件，且提供近12个月其他跨境平台年GMV≥30万美金的流水截图、自有商标/R标或完整一级品牌授权书等材料，则可申请认证品牌店。  \\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-23 19:53:14\",\"用户\":\"😐\",\"群\":\"\",\"用户问询\":\"商标可以认证品牌店么\",\"AI响应\":\"你好！很高兴为你解答。商标可以用于认证品牌店，具体要求如下：  \\n- **自有商标**：若您持有销售目的国（如墨西哥、巴西等）注册成功的商标证书（R标），可直接用于品牌店认证。  \\n- **代理商标**：若为品牌代理商，需提供商标证书+完整一级品牌授权文件+品牌方营业执照。  \\n\\n品牌店认证需满足上述商标要求，同**公司资质、流水等材料（具体以平台最新规则为准）。  \\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-22 18:32:30\",\"用户\":\"zurich\",\"群\":\"\",\"用户问询\":\"可以给我发一份品牌授权模板吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n关于品牌授权书，平台并没有提供统一的固定模板。通常情况下，一份有效的品牌授权书应包含以下核心信息：\\n\\n1. 授权方信息：品**公司名称、地址、联系方式。\\n2. 被授权方信息：您的店铺名称、公司名称、店铺ID。\\n3. 授权范围：明确说明授权您在美客多（Mercado Libre）平台上销售该品牌的产品。\\n4. 授权期限：明确授权的开始和结束日期。\\n5. 品牌信息：授权的品牌名称及商标注册号。\\n6. 签署盖章：授**公司公章。\\n\\n您可以根据上述要点自行起草，或向品牌方索取其常用的授权证明文件。\\n\\n网页参考资料：\\nhttps://global-selling.mercadolibre.com/guides/115\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-21 16:26:13\",\"用户\":\"Hellen\",\"群\":\"\",\"用户问询\":\"我们自己品牌也不行吗\",\"AI响应\":\"你好！是的，即便拥有自主品牌，首图也严禁添加品牌Logo、文字或水印。Logo只能出现在产品实物本身或包装上，不能作为额外的后期元素添加。\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-21 15:07:20\",\"用户\":\"Mira\",\"群\":\"\",\"用户问询\":\"品牌店TM标在哪里上传\",\"AI响应\":\"在注册流程中，若您有品牌，可以在填写店铺信息或品牌授权环节上传TM标相关证明文件。若已开店，可在卖家后台的品牌保护（Brand Protection）板块进行备案。\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-20 11:28:45\",\"用户\":\"傅辉梁\",\"群\":\"\",\"用户问询\":\"如何进行品牌店铺申请滚\",\"AI响应\":\"您好，申请品牌官方旗舰店（Official Store）的流程如下：\\n\\n1. 准备资料：\\n您需要准备在销售目的国注册成功的商标证书（R标）、品牌授权书（若非商标持有人）、带有品牌Logo的产品实物图以及品牌基本信息。\\n\\n2. 提交申请：\\n跨境卖家通常需要通过对接的客户经理进行内部提报。请将准备好的资料发送给您的经理，由经理协助发起申请。\\n\\n3. 审核周期：\\n品牌审核通常需要2至4周。审核通过后，您的店铺将获得官方店标识、品牌保护以及品牌广告（Display）的投放权限。\\n\\n4. 注意事项：\\n官方旗舰店对店铺装修有要求，店铺首页的所有文字（包括图片中的文字）必须使用本地语言（西班牙语或葡萄牙语）。\\n\\n若您目前没有对接经理，建议通过提升销量或参加官方活动来获取对接机会。若提交后超过4周无回音，请按“【品牌审核跟进】+店铺名+ID”的邮件标题格式联系经理或官方客服催促。\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-25 11:39:03\",\"用户\":\"99💭\",\"群\":\"\",\"用户问询\":\"侵权处理怎么办\",\"AI响应\":\"如果你的产品涉及侵权，建议按照以下步骤处理：\\n\\n1. 及时下架违规产品：一旦发现产品存在侵权风险或收到平台侵权通知，应立即下架并删除相关Listing，避免违规记录累积导致店铺受损。\\n\\n2. 确认侵权类型：版权侵权可能包括提供软件的授权副本，如Adobe或Microsoft 365，或出售预装了视频游戏的原始游戏机。请核查你的产品描述、图片及产品本身是否包含未经授权的品牌信息或受版权保护的内容。\\n\\n3. 申诉处理：如果是误判，可以准备好合法的授权证明、采购发票等资料，通过卖家后台的申诉渠道提交证据。\\n\\n4. 预防措施：在选品和上架阶段，务必对品牌、专利和版权进行严格审核。不要使用他人的品牌名称、Logo或受版权保护的图片。\\n\\n建议定期查看平台关于知识产权保护的相关政策，确保店铺合规经营。\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-20 15:03:30\",\"用户\":\"David Xu\",\"群\":\"\",\"用户问询\":\"椰子鞋侵权吗\",\"AI响应\":\"你好！很高兴为你解答。平台根据知识产权法规和政策界定商标、版权、专利等侵权行为。建议上架前在官方自查入口核实风险：https://global-selling.mercadolibre.com/help/1078\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-24 18:41:44\",\"用户\":\"孫明山\",\"群\":\"\",\"用户问询\":\"本土店铺销售的小家电和汽车配件，都需要做巴西当地的认证吗？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n你的问题我暂时无法回答，后续我会丰富我的知识库，敬请见谅。\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-25 10:56:29\",\"用户\":\".\",\"群\":\"\",\"用户问询\":\"售卖纯电池的产品需要上传某些认证吗\",\"AI响应\":\"锂电池不能作为产品本身运输，必须包含在产品中。此外，墨西哥站点涉及电气安全的产品需关注NOM认证。建议确保包装牢固以防短路，并与指定物流商确认具体的运输限制。\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-24 16:00:12\",\"用户\":\"简简单单普罗达商贸\",\"群\":\"\",\"用户问询\":\"美客多墨西哥市场太阳镜、运动眼镜需要认证吗？\",\"AI响应\":\"墨西哥跨境自发货普通体育器材一般无需准入认证。但如果产品涉及电子功能，则可能需要NOM认证。若Listing无法激活，请核查是否缺少当地要求的准入资质。\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-25 10:57:35\",\"用户\":\".\",\"群\":\"\",\"用户问询\":\"伐木机电池需要上传某些认证吗\",\"AI响应\":\"伐木机电池属于带电产品，在墨西哥站点销售需关注NOM认证。此外，锂电池不能作为产品本身运输，必须包含在产品中。建议您核实产品是否属于墨西哥强制认证目录，并确保包装牢固以防短路。\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-24 17:16:31\",\"用户\":\"F-🐿\",\"群\":\"\",\"用户问询\":\"摩托车头盔需不需要用CE认证吗\",\"AI响应\":\"不好意思，该问题我没有答案，请点击以下链接咨询人工客服：\\nhttps://work.weixin.qq.com/kfid/kfc7c47108dec2b0070?enc_scene=ENCGH59j4kB9XCrk4dX6Jt2BZeAhKD7ZBUNQhrF2CcGYyCW\\u0026scene_param=customer_id=7881****3284\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-24 16:02:13\",\"用户\":\"嫣然一笑\",\"群\":\"\",\"用户问询\":\"认证完成了 接下来呢？\",\"AI响应\":\"认证完成后，请登录阿里云邮箱获取您的完整邮箱地址。然后点击下方链接进入美客多入驻页面，按要求填写企业信息、联系人及该邮箱地址提交申请。\\n\\n普通自发货/海外仓也可选择自注册（PC端登入）：https://global-selling.mercadolibre.com/landing/about\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-24 11:13:09\",\"用户\":\"观云\",\"群\":\"\",\"用户问询\":\"就是可以发是吧 这个毫安呢\",\"AI响应\":\"可以发货。图片中的灭蚊灯电池容量在1500-2000毫安，属于正常带电产品范围。只要电池是内置在机器里的，就可以通过海外仓（Full仓）或符合条件的自发货渠道运输。请确保包装牢固，并注意墨西哥站点涉及电气安全的产品可能需要NOM认证。\",\"一级大类\":\"产品管理\",\"二级子类\":\"侵权合规\",\"问题主题\":\"侵权/品牌/合规处理\"},{\"时间\":\"2026-07-24 10:03:46\",\"用户\":\"D~\",\"群\":\"\",\"用户问询\":\"除了墨西哥，其他站点需要认证吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n除了墨西哥，其他站点同样存在相关的认证要求，具体如下：\\n\\n1. 巴西站点：\\n巴西对电子产品和通信设备的管控非常严格。带有蓝牙、Wifi功能的无线电通讯设备通常需要 ANATEL 认证。此外，光源、灯泡、家电等涉及电气安全的产品，通常需要通过 INMETRO 认证。\\n\\n2. 智利和阿根廷站点：\\n这些站点对电气安全也有特定要求。由于智利和阿根廷使用特殊的插头标准，建议在产品设计阶段就考虑当地的电压、频率和插头差异，尽可能符合当地的标准认证。\\n\\n3. 通用规则：\\n虽然平台在入驻阶段可能没有明确强制要求提供所有证书，但如果缺少当地要求的强制认证（如巴西的ANATEL或INMETRO），你的 Listing 可能无法激活，或者在清关环节面临被海关扣押的风险。\\n\\n总结来说，只要涉及带电、无线传输、医疗器械或儿童玩具等类目，在拉美各国通常都需要对应的本地认证。\\n\\n关于墨西 are\":0.013085690164626424,\"高频问题\":\"佣金/定价/利润\",\"__details\":[{\"时间\":\"2026-07-21 23:27:47\",\"用户\":\"灿烂阳光\",\"群\":\"\",\"用户问询\":\"这只是一个算利润的逻辑，保持15%利润率也是这个逻辑，我就知道怎么定价了\",\"AI响应\":\"没错，逻辑完全正确。只要你掌握了这个核心公式，无论是追求 15% 还是 30% 的利润率，只需要倒推你的“目标净收益”即可。\\n\\n在实际定价时，你可以直接套用这个思路：\\n**目标净收益 = (拿货成本 + 运费 + 预期利润) ÷ 折扣比例**\\n\\n把这个算出来的数值填入后台的“Net Proceeds”框里，系统就会自动帮你叠加上平台佣金和运费，生成最终的前台售价。\\n\\n**最后再给你两个定价小贴士：**\\n1. **预留广告位**：如果你打算开广告，建议在 15% 的利润率基础上再多预留 5%-10% 的空间，因为广告费是按点击扣费的，会直接摊薄你的利润。\\n2. **关注起征点**：如果做墨西哥站，尽量让折后的最终售价高于 299 比索，这样买家可以享受免邮，对你的转化率非常有帮助。\\n\\n既然逻辑已经跑通了，那就大胆去定价吧。祝你开市大卖。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-26 10:38:44\",\"用户\":\"if you\",\"群\":\"\",\"用户问询\":\"关于定价，我只需要填写净利润吗？\",\"AI响应\":\"在收益价格模式下，你只需录入目标净收益，即采购成本加利润。系统会自动叠加运费与佣金生成最终售价，最终到账金额即为你设定的净收益。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-24 15:32:04\",\"用户\":\"灿烂阳光\",\"群\":\"\",\"用户问询\":\"你说的不是废话，这是出单了才知道客户的付款金额和平台的成本33.45元啊！ 要不我哪里知道30%利润率基数是什么\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n我理解你的意思，你是觉得“不出单根本不知道各项费用具体是多少，所以没法倒推利润”。但其实在美客多的**净收益模式**下，逻辑是反过来的，你不需要等出单才知道基数。\\n\\n**1. 你的利润基数其实就是你的“采购成本”**\\n你已经知道成本是 **33.45元**，如果你想要 **30%的利润**，那么：\\n*   **目标利润** = 33.45 × 30% ≈ **10元**。\\n*   **你的目标净收益（Net Proceeds）** = 33.45（成本） + 10（利润） = **43.45元**。\\n\\n**2. 为什么不需要等出单才知道定价？**\\n你只需要在智赢ERP或后台的【Net Proceeds】字段填入这个 **43.45元**（折算成美金约 6.1 USD）。\\n*   **系统会自动计算**：它知道这个类目的佣金是15%，也知道你填写的商品重量对应的运费是5美金。\\n*   **自动生成售价**：系统会自动算出前台售价 = (6.1 + 5) / (1 - 15%) = 约13美金。\\n\\n**3. 为什么你之前的订单亏了？**\\n是因为你参与了**折扣活动**。\\n当你设定了净收益，但又去后台点了一个“41%的折扣”时，系统会优先执行折扣指令。它把原本能保住你利润的售价强行砍掉了一半，但**运费和佣金的比例是减不掉的**，所以最后结算给你的钱就跌破了你的成本线。\\n\\n**总结建议：**\\n*   **定价时**：直接以“成本+你想赚的钱”作为净收益填入，让系统去算那个你“不知道”的运费和佣金。\\n*   **打折时**：一定要看系统提示的“你将收到（You will receive）”那个数字。**只要那个数字小于你的成本 33.45元，这个折扣就绝对不能做。**\\n\\n你不需要等出单才知道亏不亏，在设置折扣的那一刻，系统给出的“你将收到”就已经预告了你的结算金额。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-25 11:26:29\",\"用户\":\"李玲娅\",\"群\":\"\",\"用户问询\":\"{\\\"subMsgDesc\\\":\\\"\\\",\\\"subMsgList\\\":[{\\\"subMsgSenderId\\\":\\\"0\\\",\\\"subMsgSenderCorpId\\\":0,\\\"subMsgId\\\":\\\"\\\",\\\"subMsgType\\\":14,\\\"subMsgSenderAvatar\\\":\\\"\\\",\\\"subMsgSenderName\\\":\\\"\\\",\\\"subMsgSenderCorpName\\\":\\\"\\\",\\\"subMsgFromId\\\":\\\"0\\\",\\\"subMsgData\\\":{\\\"filename\\\":\\\"企业微信截图_17849499789901.png\\\",\\\"fileAesKey\\\":\\\"c85e527ea3a6e65bb78468b80b5c9437\\\",\\\"fileSize\\\":319977,\\\"width\\\":1600,\\\"fileMd5\\\":\\\"85d68aca27c8c474c552d81a7985d1da\\\",\\\"fileId\\\":\\\"306b0201020464306202010002047953720602030f4df90204c113607102046a642ce3042431653637363339362d313563662d343662632d393362652d3836633833633663336266380203103800020304e1f0041085d68aca27c8c474c552d81a7985d1da0201****0400\\\",\\\"height\\\":712,\\\"imageHasHd\\\":true},\\\"subMsgTimestamp\\\":0},{\\\"subMsgSenderId\\\":\\\"0\\\",\\\"subMsgSenderCorpId\\\":0,\\\"subMsgId\\\":\\\"\\\",\\\"subMsgType\\\":2,\\\"subMsgSenderAvatar\\\":\\\"\\\",\\\"subMsgSenderName\\\":\\\"\\\",\\\"subMsgSenderCorpName\\\":\\\"\\\",\\\"subMsgFromId\\\":\\\"0\\\",\\\"subMsgData\\\":{\\\"reply\\\":{},\\\"atList\\\":[],\\\"moreDetail\\\":[{\\\"subtype\\\":0,\\\"text\\\":\\\"这里的价格是什么币别\\\"}],\\\"content\\\":\\\"这里的价格是什么币别\\\"},\\\"subMsgTimestamp\\\":0}],\\\"subMsgFlag\\\":0}\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n从你提供的截图来看，这是巴西站点的后台页面。\\n\\n这里的价格币种是 **巴西雷亚尔（BRL）**。\\n\\n在美客多平台，各站点的后台管理页面通常会以当地货币显示售价和运费。虽然最终结算给你的可能是美金，但在设置商品价格、查看运费以及参加促销活动时，看到的数值都是当地货币。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-25 16:51:18\",\"用户\":\"平安喜乐\",\"群\":\"\",\"用户问询\":\"我的成本是19，我需要60%、70%、80%的利润我分别要怎么计算\",\"AI响应\":\"你好！在美客多的收益定价模式下，你不需要去算复杂的售价，只需要算出不同利润率下的“净收益”金额，然后直接填入后台的 **Net Proceeds** 框里即可。\\n\\n计算公式为：**成本 + (成本 × 利润率) = 净收益**\\n\\n按照你的成本 19 元计算：\\n\\n1. **60% 利润**：\\n19 + (19 × 60%) = **30.4 元**（约 4.22 USD）\\n\\n2. **70% 利润**：\\n19 + (19 × 70%) = **32.3 元**（约 4.48 USD）\\n\\n3. **80% 利润**：\\n19 + (19 × 80%) = **34.2 元**（约 4.75 USD）\\n\\n**操作建议：**\\n你只需要根据你想要的利润档位，把算出来的这个金额（换算成美金）填到后台。系统会自动在上面叠加佣金和运费，生成买家看到的价格。无论前台最后卖多少钱，只要出单了，平台结算给你的就是你填写的这个金额。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-25 04:01:47\",\"用户\":\"Aurora\",\"群\":\"\",\"用户问询\":\"全托管定价是根据什么来的，为什么我的供货价那么低，他售价高那么多，导致无浏览\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n在全托管模式下，定价和流量的逻辑如下：\\n\\n1. 价格构成：你设置的供货价是你最终的回款金额。平台会在你供货价的基础上，自动加上佣金、国际运费、仓储费、配送费以及平台的运营成本，从而形成最终的前端销售价。\\n\\n2. 平台定价权：全托管模式下，平台拥有最终的市场定价权。如果前端售价看起来比供货价高出很多，通常是因为系统将上述各项跨境运营成本都计算在了售价中。\\n\\n3. 浏览量低的原因：\\n- 价格竞争力：如果前端售价远高于当地市场同类产品，确实会影响点击和转化。建议你的供货价尽量比市场价低15%以上，给平台留出定价空间，以确保前端价格有竞争力。\\n- 权重与流量：全托管商品需要通过核价和买手选品。如果核价时供货价过高，可能导致审核不通过或流量扶持力度减弱。\\n- 运营成本：平台会根据算法推荐和流量扶持来推广商品，但如果前端价格脱离市场水平，算法推荐的效果也会打折扣。\\n\\n建议你参考寻品清单中的建议供货价进行调整。如果觉得目前供货价无法支撑盈利，可以通过后台的 Listing Management 页面尝试修改价格或发起核价申诉。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-24 10:38:08\",\"用户\":\"图个吉祥.\",\"群\":\"\",\"用户问询\":\"你好唐经理 我现在有点迷茫[Emm]上的产品全是跟卖产品，也没什么价格优势，大家都是铺货且都一样 且都是从1688上面拿货大家都是亏钱在做。我也不知道怎么是对错了。迷茫\",\"AI响应\":\"你好！很高兴为你解答。面对同质化严重的铺货竞争，建议你从以下几个维度寻找突破口，提升产品竞争力：\\n\\n1. 选品差异化\\n与其在1688上寻找大众爆款进行跟卖，不如尝试挖掘具有差异化的产品。平台建议卖家关注产品差异化，寻找市场中尚未被满足的细分需求，避免陷入纯粹的价格战。\\n\\n2. 优化Listing质量\\n高质量得分的Listing结合广告会增加产品额外曝光机会。确保你的产品拥有3张以上高质量图片，全方位展示细节，并进行准确的本地化描述。在商品列表中实现高质量可以增加销售机会并维持可靠的展示。\\n\\n3. 灵活的价格策略\\n动态追踪市场波动与竞品定价策略，灵活调整售价。在自然情况下，商品降价后系统会有反应期，通常在降价后的第4天开始才会有明显的流量加持和出单。你可以提供有吸引力的折扣以吸引更多买家。\\n\\n4. 利用官方工具获取流量\\n使用Clips短视频工具为商品添加小视频，这能直接增加曝光入口。从数据看，Clips能帮助销量提升25%到30%左右。\\n\\n5. 品牌与服务\\n提升品牌知名度并优化客户服务。确保产品的价格与链接质量有优势，并配上广告支持。\\n\\n6. 广告策略\\n对于新品，建议设置较高的目标ACOS值，去和有销售记录的商品抢夺曝光机会。\\n\\n总结来说，出单并不完全取决于上架数量，而是取决于选品的精准度、Listing的质量以及流量的获取。建议先精细化运营几十个优质Listing，配合合理的定价和广告策略，逐步建立自己的竞争优势。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-23 10:55:09\",\"用户\":\"治酉\",\"群\":\"深圳市百舸争流网络技术有限公司\",\"用户问询\":\"好的，8%的佣金是已经减半后的吗？还是实际佣金是8%，现在减半是4%\",\"AI响应\":\"半托管模式佣金为8%，是对比常规模式减免50%后的结果，实际收取的佣金比例即为8%。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-21 17:49:50\",\"用户\":\"平凡\",\"群\":\"\",\"用户问询\":\"那这个图片举例子 如果产品成本是8元，那么卖家这单的净利润就是73.55元对吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n根据图片，你设定的净收入是 ***USD（约 85.55 元人民币）。如果你的产品成本是 8 元人民币，那么你的净利润约为 ***人民币。\\n\\n需要注意的是，最终到账金额为 ***USD，但可能会因物流实测尺寸重量校准产生微小偏差。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-24 15:34:21\",\"用户\":\"灿烂阳光\",\"群\":\"\",\"用户问询\":\"我的33.45怎么来的 没有出单我知道吗？ 我在问你怎么定价\",\"AI响应\":\"你好！我明白你的意思了，你是卡在**“还没出单，我怎么知道这个产品的总成本（含运费）是多少，从而去定那个3倍的价格”**对吧？\\n\\n确实，如果不知道运费，就没法算出那个“33.45”的基数。要解决**“还没出单怎么定价”**，你得按这三步走：\\n\\n**1. 找准你的“死成本”**\\n这个是你上架前就知道的：\\n*   **采购价**：你买货花的钱。\\n*   **国内运费**：发到转运仓的钱。\\n*   **贴标费/包装费**：几毛钱一个。\\n**假设这几项加起来是 15 元。**\\n\\n**2. 预估“活成本”（运费和佣金）**\\n这是你最头疼的，其实不用等出单，你可以提前查：\\n*   **查运费表**：美客多后台有官方运费表（Cainiao模式）。比如你的笔袋是 100g，查表得知墨西哥自发货运费大约是 4-5 美金。\\n*   **查佣金率**：大部分类目是 17.5% 或 19.5%。\\n*   **使用工具**：最简单的办法是去卖家后台搜索**“利润计算器（Profit Calculator）”**。你把预估的重量填进去，它会直接告诉你这一单的运费和佣金大概是多少。\\n\\n**3. 具体的定价公式（二选一）**\\n*   **如果你想用“3倍定价”**：\\n    售价 = (采购成本 + 预估运费) × 3。\\n    *注意：这种定法在拉美很容易导致价格过高卖不动，因为国际运费本身就很贵。*\\n*   **如果你想用“净收益定价”（最推荐）**：\\n    你只需要在智赢ERP里填一个数字：**采购成本 + 你想赚的利润**。\\n    **操作**：比如成本 15 元，你想赚 10 元，你就填 **25 元**。\\n    **结果**：系统会自动抓取这个产品的重量，查出运费（比如 30 元），加上佣金，最后在前台显示售价（比如 70 元）。\\n\\n**总结：**\\n你不需要等出单才知道成本。你只需要知道**“货值”**，然后把**“货值+利润”**填进**【净收益】**栏，剩下的运费和佣金，平台系统比你算得准，它会自动加在售价里。\\n\\n你之前那个 33.45 元的单子之所以亏，是因为你**手动设置的折扣**把系统自动算好的“保护价”给冲掉了。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-23 16:57:45\",\"用户\":\"Hello\",\"群\":\"\",\"用户问询\":\"为什么我的FTI店铺，低佣金是11.5，高佣金是16\",\"AI响应\":\"不好意思，该问题我没有答案，请点击以下链接咨询人工客服：\\nhttps://work.weixin.qq.com/kfid/kfc7c47108dec2b0070?enc_scene=ENCGH59j4kB9XCrk4dX6Jt2BZeAhKD7ZBUNQhrF2CcGYyCW\\u0026scene_param=customer_id=7881****9870\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-21 17:54:39\",\"用户\":\"平凡\",\"群\":\"\",\"用户问询\":\"卖家净利润=6.58-2.76-0.82=3 对吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n是的，计算逻辑正确。商品标价 6.58 USD 扣除运费 2.76 USD 和佣金 0.82 USD 后，剩余的 3 USD 即为你设定的净收入。你的净利润则需在此基础上再减去产品采购成本。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-20 18:00:05\",\"用户\":\"明月清风\",\"群\":\"\",\"用户问询\":\"销售佣金跟classic和presume模式的费率是一个吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n是的，销售佣金的费率与你选择的 Classic 或 Premium 模式直接相关。\\n\\n简单来说，销售佣金 = 基础品类佣金 + 模式溢价。\\n\\n1. Classic 模式：\\n佣金费率较低。它通常是该品类的基础佣金比例。\\n\\n2. Premium 模式：\\n佣金费率较高。Premium 模式的费率通常比 Classic 模式高出 4% 左右。\\n\\n这两者的区别在于：\\n- Classic：费率低，但买家无法享受免息分期，且产品的搜索权重（曝光量）相对较低。\\n- Premium：费率高，但买家可以享受免息分期（利息由平台/卖家承担），且产品会获得更高的曝光量和流量支持。\\n\\n所以，你在后台看到的最终扣除的“销售佣金”，就是根据你选择的模式所对应的那个费率来计算的。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-25 14:46:09\",\"用户\":\"对方正在输入...\",\"群\":\"\",\"用户问询\":\"所以利润计算器是我们实际到手的利润？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n利润计算器中显示的“您的实际收益”并不是最终的纯利润，而是指该笔订单扣除平台费用后的到账金额。\\n\\n具体逻辑如下：\\n\\n1. 实际收益计算公式：\\n您的实际收益 = 商品售价 - 平台销售佣金 - 税费 - 配送费用。\\n\\n2. 您需要自行扣除的成本：\\n这个“实际收益”中还没有扣除您的产品采购成本、国内段发货到集运仓的运费、包装费以及可能的仓储费（针对海外仓）。\\n\\n3. 误差说明：\\n最终到账金额可能会因为物流实测的尺寸和重量与您预估的数值存在偏差，从而导致配送费用产生微小变动。\\n\\n简单来说，计算器算出来的是平台打款给您的钱，您再减去自己的拿货成本和国内杂费，才是您真正的纯利润。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-24 20:24:26\",\"用户\":\"灿烂阳光\",\"群\":\"\",\"用户问询\":\"我的商品是货源价12人民币，这个佣金怎么收\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n佣金的收取不是直接根据你的“12元货源价”来算的，而是根据**“买家在前台看到的最终售价”**来算的。\\n\\n具体的收取逻辑如下：\\n\\n**1. 佣金计算公式**\\n**佣金 = 前台最终售价 × 类目佣金比例**\\n假设你这个12元的商品，加上运费、利润和税费后，在前台卖 200 比索（约 10 美金），如果家居类目佣金是 15%，那么平台收取的佣金就是：200 × 15% = 30 比索。\\n\\n**2. 针对 12 元低价货源的特殊收费（非常重要）**\\n因为你的货源价只有 12 元，属于低客单价商品，你一定要注意**“单笔固定费用”**：\\n在墨西哥等站点，如果商品售价低于一定金额（比如 299 比索），平台除了收 15% 的比例佣金，还会每单额外收一笔**固定手续费**（通常在 20-30 比索左右）。\\n\\n**3. 建议定价操作**\\n你千万不要只按 12 元去想佣金，你要用**“净收益模式”**：\\n*   在后台填入你的目标净收益：比如 12元（成本）+ 5元（利润）= **17元**。\\n*   系统会自动帮你算出：17元 + 佣金 + 固定手续费 + 国际运费 = **最终前台售价**。\\n*   这样无论平台收多少佣金，最后结算给你的一定是那 17 元。\\n\\n**总结：**\\n佣金是按**卖出去的价格**收的。对于 12 元这种便宜货，固定手续费和运费才是大头，一定要用净收益模式定价，否则极容易亏本。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-24 12:19:08\",\"用户\":\"Felicity 103%\",\"群\":\"\",\"用户问询\":\"你好，请问现在FTI店铺，佣金是多少？\",\"AI响应\":\"你好！工贸一体FTI入驻的全类目佣金已降至8%，而常规佣金比例通常在15-23%之间。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-24 09:39:39\",\"用户\":\"笑\",\"群\":\"\",\"用户问询\":\"全托前台平台是怎么定价的，我怎么算收益或者毛利\",\"AI响应\":\"全托管模式下，前台定价由平台根据市场供需、竞品价格等因素，在商家提报的**供货价**基础上确定（需确保供货价低于市场价15%以上，预留平台定价空间）。  \\n\\n商家的收益=最终确认的供货价（妥投后7个工作日回款），毛利=供货价-产品成本-国内发货到仓物流成本。  \\n\\n**核心逻辑**：平台承担所有费用（佣金、运费、仓储费等），商家只需专注成本控制与利润目标。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-23 16:49:00\",\"用户\":\"李鑫 Lixin\",\"群\":\"\",\"用户问询\":\"我感觉我的定价有些问题，请问如何修改价格？\",\"AI响应\":\"在listing management页面，点击商品标题进入详情页，即可修改价格。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-23 10:51:51\",\"用户\":\"治酉\",\"群\":\"深圳市百舸争流网络技术有限公司\",\"用户问询\":\"半托管的平台佣金是收取多少个点？\",\"AI响应\":\"半托管模式收取8%佣金，且佣金对比常规模式有50%的减免。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-21 12:14:56\",\"用户\":\"Hellen\",\"群\":\"\",\"用户问询\":\"好的，谢谢。请问有平台佣金表吗？\",\"AI响应\":\"平台佣金根据品类收取，一般在 8%-15% 之间。您可以点击下方链接下载最新的佣金明细表，在表格中找到对应类目即可查看具体比例：\\nhttps://file.marsmind.cc/boot-admin/mercado/20260421/2046****6337.xlsx\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-20 13:38:35\",\"用户\":\"刘霞\",\"群\":\"\",\"用户问询\":\"您好，现在墨西哥站点和智利站点的价格我是更改不了的呢，这是个什么情况？后台切换到哥伦比亚站点是可以更改的，但是墨西哥站点的是改不了的？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n目前无法直接判断具体原因，建议按以下方向核查：\\n\\n1. 促销活动锁定：请检查墨西哥和智利站点的商品是否正在参加促销活动。活动创建成功或进行中，价格通常无法修改。\\n2. 站点系统差异：不同站点的后台加载可能存在延迟，建议在墨西哥站点页面关闭自动翻译，并尝试清除缓存或使用无痕模式。\\n3. 核心信息锁定：若商品在对应站点已有销量，部分核心销售信息可能会被系统锁定。\\n\\n如果哥伦比亚站点正常而其他站点异常，建议在卖家后台针对墨西哥站点开case，提供具体报错截图联系官方客服核实后台权限。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-20 10:46:14\",\"用户\":\"Daniel\",\"群\":\"\",\"用户问询\":\"美客多对于女装毛衣的佣金是怎么算的\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n美客多平台的佣金是根据商品品类收取的，通常在 11%-23% 之间。\\n\\n对于女装毛衣类目，具体的佣金比例取决于你选择的 Listing 类型：\\n1. Classic 类型：费率相对较低，但流量稍小，且买家无法享受分期付款。\\n2. Premium 类型：费率更高，但能获得更多流量曝光，且买家可以享受免息分期付款，这通常更有利于提升转化率。\\n\\n平台会根据你设定的“净收益（Net Proceeds）”金额，自动在前端加上对应品类的佣金和运费，从而计算出最终展示给消费者的售价。这意味着平台收取的佣金不会从你设定的净收益中扣除，而是由买家承担。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-25 10:57:04\",\"用户\":\"灿烂阳光\",\"群\":\"\",\"用户问询\":\"这个对不对？30%利润率\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n你的计算逻辑在**业务操作**上是没问题的，但在**数学定义的“利润率”**上有一点小偏差，我帮你精准理一下：\\n\\n1. **按你的算式（成本加成法）**：\\n你是用 15元 × 30% 算出利润，这在行业里叫“加价率”。这样算出来的 19.5元，利润率其实是 4.5 ÷ 19.5 ≈ **23%**。\\n\\n2. **如果你追求严格的 30% 利润率**：\\n公式应该是：进价 ÷ (1 - 利润率)\\n即：15 ÷ 0.7 = **21.42 元**（约 **3.15 美金**）。\\n\\n**总结建议：**\\n如果你觉得赚 4.5 元人民币已经达到预期，那么你图片里的 **2.86 美金** 填入后台是完全**正确且可行**的。\\n\\n只要你填了这个数，平台结算给你的就是 2.86 美金，你的 15 元成本和 4.5 元利润就保住了。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-24 09:38:15\",\"用户\":\"笑\",\"群\":\"\",\"用户问询\":\"前台是怎么定价的\",\"AI响应\":\"你好！前台定价由商家提报基础价格，平台叠加佣金、运费等生成最终售价。自发货/半托管商家设净收益（采购+利润），平台自动算售价；全托管商家提供货价，平台根据市场定价。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-24 09:36:21\",\"用户\":\"笑\",\"群\":\"\",\"用户问询\":\"全托店铺的定价是怎么计算的\",\"AI响应\":\"全托管定价采用供货价模式，商家只需提报期望收益价格（供货价），公式为：供货价 = 产品成本 + 目标利润 + 单件国内发货到东莞仓的物流成本。建议比市场价低15%以上，平台承担佣金、运费等。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-23 16:56:09\",\"用户\":\"Hello\",\"群\":\"\",\"用户问询\":\"FTI店铺，佣金是多少？\",\"AI响应\":\"全类目佣金降至8%（常规15-23%）\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-23 15:29:26\",\"用户\":\"亦锦\",\"群\":\"\",\"用户问询\":\"可以发一份定价表给我吗\",\"AI响应\":\"美客多目前没有提供专门的定价表格哦。商品定价主要由您自主决定，您可以参考产品成本、市场竞争情况、目标利润空间和平台佣金（11%-23%不等）来定价。建议定价时预留25%以上的折扣空间，因为平台经常有活动需要打折。如需更详细的定价指导，可以咨询我们的招商经理同事。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-23 15:13:08\",\"用户\":\"灿烂阳光\",\"群\":\"\",\"用户问询\":\"你的意思不需要定价？\",\"AI响应\":\"你好！我不是说“不需要定价”，而是**需要用更科学的定价逻辑替代“简单3倍定价”**。以下是核心区别和操作建议：\\n\\n\\n### **一、“3倍定价”的本质问题**  \\n你之前提到的“3倍定价”是**经验式定价**（成本×3），但美客多的定价逻辑是**“净收益=成本+固定利润”**，两者的核心差异在于：  \\n- **3倍定价**：默认假设“售价=成本×3”，但忽略了平台佣金、运费、税费等隐性成本，导致实际到手金额远低于预期。  \\n- **净收益定价**：仅需录入“目标净收益”（即成本+固定利润），其他费用由系统自动计算，避免人工叠加错误。\\n\\n\\n### **二、如何用智赢ERP实现“精准定价+折扣安全”**  \\n#### **1. 正确设置「净收益定价」**  \\n在智赢ERP→**商品管理→新增商品**：  \\n- **采购成本**：录入实际进货价（如10元）；  \\n- **目标利润**：填写你期望的净利润（如2元，即净收益=12元）；  \\n- **定价模式**：选择 **“净收益模式（NetProceeds）”**，系统自动计算售价=净收益+平台佣金+运费+税费。  \\n\\n**关键**：无需手动计算“3倍”，系统会根据实时数据（如墨西哥站当前汇率、物流费用）动态生成合理售价。\\n\\n\\n#### **2. 折扣操作的“安全阈值”**  \\n- **折扣上限公式**：  \\n  假设你目标净收益为 **N**（即成本+利润），平台费为 **F**（如10%佣金+5元运费），则：  \\n  **最大允许折扣 = 1 - (N + F) / 原售价**  \\n \\n  **示例**：  \\n  - 成本10元，目标利润*** → 净收益N=¥12  \\n  - 平台费F≈¥1.2（10%佣金）+¥5（运费）=¥6.2  \\n  - 原售价=12+6.2=¥18.2  \\n  - 最大折扣=1 - (12+6.2)/18.2 ≈7%（即最多打93折，仍能保证净收益≥12元）\\n\\n\\n#### **3. 用「阶梯折扣」保护利润**  \\n在智赢ERP→**营销活动→折扣设置**：  \\n- **销量＜10单**：允许折扣至原价的70%（用低价冲量，积累销量）；  \\n- **销量≥100单**：折扣上限提升至原价的90%（此时规模效应已覆盖前期成本，可维持较高利润率）。  \\n\\n\\n### **三、总结：定价不是“不需要”，而是“要精准”**  \\n- **3倍定价**：适合新手快速起量，但需警惕隐性成本导致的亏损；  \\n- **净收益定价**：通过智赢ERP自动计算，确保每单到手金额=成本+利润，且折扣可控；  \\n- **核心工具**：用智赢ERP的「利润计算器试算」和「阶梯折扣设置」，既能规避亏损，又能高效提升销量。  \\n\\n如果需要进一步优化某款商品的定价模型，可以提供具体SKU信息，我会帮你拆解计算~  \\n\\n关于墨西哥RFC税号及定价的更多细节，可参考官方指南链接🔗：  \\nhttps://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-22 18:21:21\",\"用户\":\"品牌（出口版）\",\"群\":\"\",\"用户问询\":\"产品定价需要怎么去定价\",\"AI响应\":\"美客多自发货采用净收益定价模式（NetProceeds）。您只需录入目标净收益（即：采购成本 + 利润），系统会自动叠加运费与佣金生成最终售价。最终到账金额即为您设定的净收益。建议动态追踪市场波动与竞品策略，灵活调整以维持竞争力。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-21 21:53:41\",\"用户\":\"Ivan\",
