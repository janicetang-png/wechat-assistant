. **查看价格变动历史**：\\n如果你的商品价格在没有人工操作的情况下发生了微调，且处于你设定的底价之上，那通常就是自动定价功能在生效。\\n\\n目前从你的截图来看，该 SKU 并没有开启自动定价，因为系统提示找不到竞争对手参考。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-20 10:41:50\",\"用户\":\"迷迷 苏\",\"群\":\"\",\"用户问询\":\"哪里查找自动定价\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n价格自动化工具可以在卖家后台的以下位置找到：\\n\\n1. 进入卖家后台，点击进入 **Listings（列表）** 页面。\\n2. 在页面上方或侧边菜单中找到 **Price management（价格管理）** 部分。\\n3. 在该部分中即可找到 **Price automation（价格自动化）** 工具。\\n\\n在这里，你可以选择想要自动定价的商品，并设定最低价格限制，确保系统在调价时不会亏损。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-25 10:54:24\",\"用户\":\"廖永蓉\",\"群\":\"\",\"用户问询\":\"在哪里看利润？\",\"AI响应\":\"您可以在发布商品或管理库存页面查看费用明细。建议使用官方利润计算器精准测算：https://global-selling.mercadolibre.com/listings/cost-calculator\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-21 11:14:45\",\"用户\":\"Nini\",\"群\":\"\",\"用户问询\":\"全托管怎么定价\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n全托管模式采用供货价模式，定价逻辑如下：\\n\\n1. 定价权归属：平台拥有最终市场定价权，商家仅需提报供货价（期望收益价格）。\\n2. 计算公式：供货价 = 产品成本 + 目标利润 + 单件国内发货到东莞仓的物流成本。\\n3. 建议策略：供货价建议比市场价低15%以上，以确保平台有足够的定价空间来获取流量。\\n4. 费用承担：商家无需承担平台佣金、店铺年费、仓储费、广告费及国际段运费。\\n\\n商家提报供货价后，平台会根据市场情况进行核价并最终定价销售。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-21 01:48:32\",\"用户\":\"水果🍉\",\"群\":\"\",\"用户问询\":\"怎么单独定价\",\"AI响应\":\"在UP模式下，您可以直接在卖家后台的商品列表页面找到对应商品进行编辑。您可以为同一个商品链接中的不同变体独立设置净收益，系统会根据各变体信息自动计算并生成对应的售价。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-25 16:10:38\",\"用户\":\"蒙面大侠缺颗牙。\",\"群\":\"\",\"用户问询\":\"我是源头工厂 工贸一体卖家，具备自有生产线和明显的成本优势，能向平台申请特批放宽吗？\",\"AI响应\":\"你好！很高兴为你解答。针对工贸一体卖家，平台设有FTI专项入驻通道，但仍需满足近12个月托管平台流水大于30万美金的硬性门槛。若流水暂未达标，建议先通过普通海外仓或自发货模式入驻，积累业绩后再申请转入。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-24 22:25:36\",\"用户\":\"wong\",\"群\":\"\",\"用户问询\":\"全托与半托的商品售后问题，客人取消订单问题等，由谁负责或承担成本？\",\"AI响应\":\"全托管：平台负责售后处理。若因质量问题退货，商家承担退仓费用。买家取消订单由平台处理。\\n\\n半托管：商家自主负责售后。买家取消订单由商家处理。\\n\\n成本方面：全托管和半托管的退仓费用均由商家承担。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-22 03:25:10\",\"用户\":\"爱老虎呦🐯\",\"群\":\"\",\"用户问询\":\"设置完价格可以变成为设置的价格对吗？不需要通过客户经理就可以操作\",\"AI响应\":\"是的，您可以直接在卖家后台自行修改价格或设置促销折扣，修改后会实时生效，不需要通过客户经理操作。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-21 18:38:51\",\"用户\":\"平凡\",\"群\":\"\",\"用户问询\":\"那么跨站点同步手动操作发布到其他站点时，还需要再次填其他站点的价格吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n在进行跨站点同步时，系统通常会根据你设置的全球销售规则自动换算价格。但由于各站点汇率和成本不同，建议你在同步后进入对应站点后台核对并手动微调，以确保各站点的净收益符合你的预期。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-24 08:34:32\",\"用户\":\"焱七\",\"群\":\"\",\"用户问询\":\"想问一下 销售一笔订单的成本都包含什么 不满299比索\",\"AI响应\":\"销售不满299比索（墨西哥站为例）的订单成本包含：  \\n1. **产品进货成本**  \\n   2. **平台佣金**（16%-22%，按类目和销售额）  \\n   3. **物流费用**（含国内头程+跨境运费，菜鸟承运为主）  \\n   4.?**营销费用**（广告等推广支出）  \\n   5. **低价附加费**（若单价低于599 MXN，每件加收20 MXN）  \\n\\n**网页参考资料**  \\nhttps://global-selling.mercadolibre.com/help/3\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-22 13:58:52\",\"用户\":\"小张向前进\",\"群\":\"\",\"用户问询\":\"那就是说我这边显示的商品价格 跟买家看到的前端售价还会有不同吗\",\"AI响应\":\"是的。买家看到的前端售价会比你设置的价格更高。平台会自动在你的价格基础上，叠加销售佣金、国际运费（自发货）以及相关的预扣税费，最终生成前端展示给买家的价格。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-22 07:16:55\",\"用户\":\"wd\",\"群\":\"\",\"用户问询\":\"为什么我的商品价格在我没有更改的情况下卖给顾客少了3美金\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n这通常是因为平台在特定时期为买家提供了折扣补贴，或者是因为汇率波动导致的显示差异。请放心，平台补贴部分不会影响你的实际结算收入，你可以核对后台账单中的净收益。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-21 15:10:59\",\"用户\":\"Nini\",\"群\":\"\",\"用户问询\":\"我给平台报价之后，平台会根据什么来给出前端展示架 价格\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n平台会根据以下因素在你的供货价基础上进行“藏价”，生成前端展示价格：\\n\\n1. 销售佣金：根据产品类目收取的平台服务费。\\n2. 国际运费：从中国到目的国的跨境段物流成本。\\n3. 市场竞争：平台会参考同类产品的市场价格进行动态调整。\\n4. 促销活动：平台拥有最终定价权，可能会为了促销而调低前端售价。\\n\\n只要你提报的供货价没有变动，无论前端价格如何波动，你的结算收益依然以你提报的供货价为准。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-24 13:35:11\",\"用户\":\"歪歪\",\"群\":\"\",\"用户问询\":\"菜鸟上门取件的价格怎么抠出 扣除\",\"AI响应\":\"菜鸟物流问题请咨询美客多后台客服。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-24 08:45:53\",\"用户\":\"重塑\",\"群\":\"\",\"用户问询\":\"哥伦比亚站点的包邮临界点是什么价格，换算成美元\",\"AI响应\":\"哥伦比亚站点的包邮临界点（免邮门槛）为 **300,000哥伦比亚比索**，换算成美元约为 **79.5美元**（汇率以实时为准，仅供参考）。  \\n\\n若商品售价达到或超过该金额，买家可享受包邮服务；若低于此金额，买家需自行承担运费。  \\n\\n网页参考资料：https://global-selling.mercadolibre.com/help/shipping-fees-colombia-cainiao_37289\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-22 09:26:09\",\"用户\":\"爱喝咖啡的懒人\",\"群\":\"\",\"用户问询\":\"他要求的这个价格相当于多少美元？是否超出货值？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n根据目前阿根廷比索（ARS）的汇率，**50,000 比索约等于 54 美元左右**。\\n\\n从图片右侧的信息看，该产品的售价是 **34.15 美元**。\\n\\n**结论：**\\n买家要求的退款金额（约 54 美元）**已经明显超出了货值**（34.15 美元）。这属于不合理诉求，建议不要答应。\\n\\n**操作建议：**\\n由于平台已经放款给你（Mediation completed），你无需私下补差价。你可以回复买家：很抱歉，您要求的金额超出了订单总额，且平台已结案，建议您直接联系 Mercado Libre 官方客服咨询售后。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"},{\"时间\":\"2026-07-21 18:37:30\",\"用户\":\"平凡\",\"群\":\"\",\"用户问询\":\"拿为什么填价格表的时候会填各个站点的价格\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n这是因为不同站点的货币汇率、佣金比例、免邮门槛以及国际运费均不相同。为了保证你在每个站点都能获得预期的净收益，需要针对各站点的成本差异分别设置对应的价格。\",\"一级大类\":\"营销活动\",\"二级子类\":\"佣金定价\",\"问题主题\":\"佣金/定价/利润\"}]},{\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"Past 7 Days\":87,\"Previous 2026-07-13 to 2026-07-19\":149,\"Change\":-62,\"WoW\":-0.4161073825503356,\"Past 7 Share\":0.012241452089489235,\"高频问题\":\"广告/关键词投放\",\"__details\":[{\"时间\":\"2026-07-21 10:27:50\",\"用户\":\"晨夕\",\"群\":\"\",\"用户问询\":\"开广告选销量好的站点？不会开广告，教我一下，选什么站点，什么产品，话费多少钱， 花费\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n**1. 站点选择：** 建议优先选择你目前**销量最稳定、转化率最高**的站点（如墨西哥或阿根廷），因为广告是用来放大优势的。\\n\\n**2. 产品选择：** 选品遵循“优中选优”，建议将**稳定出单**的商品放在一个广告组，设置充足预算；将**新品**放在另一个组，设置较高的目标ACOS去抢曝光。\\n\\n**3. 开启步骤：**\\n*   进入后台 **Advertising**，点击“创建广告活动”。\\n*   设置广告组名称、每日最高预算和目标ROAS（出价）。\\n*   选择要推广的具体商品即可完成。\\n\\n**4. 广告花费：** 采用CPC（按点击付费），有点击才扣费。建议根据自身预算设置每日上限，系统有最低预算限制，若输入金额过低会给出提示。\\n\\n从精细化运营角度，建议一个广告组下只开启一个商品，方便灵活调整。\\n\\n网页参考资料：\\nhttps://file.marsmind.cc/boot-admin/mercado/20260715/2077****2450.jpg\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-21 09:12:08\",\"用户\":\"B.\",\"群\":\"\",\"用户问询\":\"是开启了cpc就能出现在这些广告位吗？这些是实时竞价胜出的卖家可以排在最好的位置依次排列\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n是的，开启了商品广告（CPC模式）后，您的商品就有机会出现在搜索结果页和商品详情页的推荐板块。\\n\\n美客多的竞价系统是一个自动竞争机制。每当有买家搜索时，系统会综合考量商家的出价（基于目标ACOS换算）和商品的广告质量分，计算出每个广告的排名。排名最高的商品将赢得最靠前的展示位。\\n\\n需要注意的是，竞价成功与否并非仅由出价决定。如果您的链接质量（如图片、描述、转化率）较低，或者店铺信誉不是绿色，即便出价很高，在竞价分流中也可能处于劣势，导致无法获得理想的展示位置。\\n\\n网页参考资料：\\nhttps://file.marsmind.cc/boot-admin/mercado/20260715/2077****4145.png\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-26 07:28:31\",\"用户\":\"水果🍉\",\"群\":\"\",\"用户问询\":\"广告曝光和点击好的产品，但是转化不高，roas可以设置高一点吗\",\"AI响应\":\"转化不高时不建议调高ROAS。ROAS设定过高会使系统收紧流量，导致曝光受限。建议先排查价格、Listing描述及评价，优化转化后再逐步调整。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-23 17:38:17\",\"用户\":\"汤立文\",\"群\":\"\",\"用户问询\":\"我的店铺需要达到什么标准才能让经理单独开关键词广告权限\",\"AI响应\":\"不好意思，该问题我没有答案，请点击以下链接咨询人工客服：\\nhttps://work.weixin.qq.com/kfid/kfc7c47108dec2b0070?enc_scene=ENCGH59j4kB9XCrk4dX6Jt2BZeAhKD7ZBUNQhrF2CcGYyCW\\u0026scene_param=customer_id=7881****4462\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-22 03:08:58\",\"用户\":\"水果🍉\",\"群\":\"\",\"用户问询\":\"美客多广告逻辑，怎么投流，为什么我设置roas还是亏本的\",\"AI响应\":\"你好！很高兴为你解答。广告亏本可能是因为预设ROAS目标与类目大盘脱节。若ROAS设置过高，系统会限流控单；若设置过低，ACOS会拉高导致成本居高不下。建议新品ROAS设在1-5区间，并根据实际转化水平动态调整。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-20 17:59:24\",\"用户\":\"Daniel\",\"群\":\"\",\"用户问询\":\"为什么墨西哥可以开广告，巴西智利阿根廷等其他国家不可以、》\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n目前美客多跨境贸易（Global Selling）的广告功能确实主要在墨西哥站点开放。\\n\\n其他国家如巴西、智利、哥伦比亚等站点，广告功能是逐步向卖家开放的。如果你的后台无法开启，通常是因为以下原因：\\n\\n1. 站点限制：部分站点的广告功能仍处于灰度测试或分批开放阶段，并非所有跨境账号都能立即使用。\\n\\n2. 账号表现：广告功能的开启通常需要店铺达到一定的信誉等级（如成为领头羊卖家）或满足一定的销售额、订单量门槛。\\n\\n3. 配送模式：目前广告功能主要支持官方海外仓（FBM）模式的商品。\\n\\n至于阿根廷站点，目前主要对本土卖家开放，跨境卖家暂时无法在该站点进行广告投放。\\n\\n建议你持续提升店铺的信誉表现和销量，当满足系统要求时，后台会自动激活对应站点的广告管理权限。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-25 10:02:28\",\"用户\":\"爱月如诗\",\"群\":\"\",\"用户问询\":\"美客多投放广告后的收入是净收益嘛？\",\"AI响应\":\"美客多的广告费用是直接从您的卖家账户余额中扣除的。\\n\\n关于您的收入，美客多采用的是净收益模式。净收益是指在销售后扣除所有平台适用费用（如销售佣金、运费、每单位额外费用等）后，您最终获得的金额。\\n\\n在您设定产品价格时，您只需要关注并填写您想要的“净收益”金额，系统会自动叠加运费与佣金生成前端售价。最终到账的金额即为您设定的净收益，但广告费作为额外的运营支出，会从您的账户余额（即累计的净收益总额）中扣除。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-24 11:13:50\",\"用户\":\"纯属巧合\",\"群\":\"\",\"用户问询\":\"我们店铺现在刚转化为MercadoLeader， 店铺正常运营了2个月， 粉丝为270个， 请问我们怎么样利用好这些粉丝使得订单利润最大化\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n恭喜你成为 MercadoLeader！在美客多，粉丝不仅是数字，更是你店铺的“私域流量”。2个月积累270个粉丝是一个非常好的开端，利用好这些粉丝可以有效降低获客成本，提升利润。\\n\\n以下是针对粉丝运营和利润最大化的具体建议：\\n\\n**1. 利用 My Page 店铺装修工具**\\n- **品牌形象营造**：使用 My Page 完善店铺装修，设置清晰的产品分类。粉丝进入店铺后，良好的视觉体验能增加信任感，引导他们购买更多高利润的关联产品。\\n- **新品优先展示**：将利润款或新品放在店铺首页显眼位置。粉丝通常会通过关注列表回访店铺，这是免费的精准流量。\\n\\n**2. 善用 Clips 短视频工具**\\n- **直观展示**：为你的高利润产品拍摄 Clips 短视频。短视频能直接增加曝光入口，直观展示产品功能和外观。\\n- **转化提升**：从热销链接数据看，Clips 能帮助销量提升 25%~30%。对于粉丝来说，动态的视频比静态图片更有说服力，能有效提升转化率。\\n\\n**3. 参与平台大促与活动**\\n- **利用大促刺激**：美客多的 Hot Sale、BUEN FIN 等大促是免费参加的。粉丝在这些期间的购买意愿最强。\\n- **组合策略**：在大促期间，针对粉丝关注度高的产品提报活动。虽然活动有折扣，但通过粉丝的高转化率，可以带动店铺内其他非活动款（高利润款）的销售，实现整体利润最大化。\\n\\n**4. 保持绿色信誉与服务质量**\\n- **维护粉丝忠诚度**：MercadoLeader 身份本身就是一种背书。确保订单履约率和售后质量，维持绿色信誉。粉丝的复购是零成本流量，复购率越高，你的平均订单利润就越高。\\n\\n**5. 广告精准投放**\\n- **收割精准流量**：既然已经是 MercadoLeader，建议开启广告工具。针对粉丝经常浏览或购买的类目进行精准投放，利用广告工具撬动更多类似人群，实现从 0 到 1 后的规模化盈利。\\n\\n**总结：**\\n不要只盯着单笔订单的折扣，要通过 **Clips 视频吸引、My Page 留存、大促转化** 的组合拳，利用粉丝的信任降低营销成本，从而实现利润最大化。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-21 18:40:50\",\"用户\":\"Daniel\",\"群\":\"\",\"用户问询\":\"广告来说，是围绕净收入计算，还是挂牌售价？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n美客多的广告费用是直接从你的**卖家账户余额**中扣除的。\\n\\n在定价逻辑上，建议你围绕**净收益（Net Proceeds）**来考虑广告成本：\\n\\n1. **保护净收益**：美客多的定价模式会优先保证你设定的净收益。系统生成挂牌售价时，已经自动计算了佣金、运费和操作费。\\n2. **预留利润空间**：由于广告费是额外产生的支出，建议你在设置“净收益”时，将预留的广告推广成本计算在“目标利润”内。\\n3. **自动扣款**：广告费不会直接加在挂牌售价上由买家支付，而是根据实际点击情况，从你出单后产生的账户余额里扣除。\\n\\n总结来说，广告费是你经营成本的一部分，你应该在核算净收益（即你最终想拿到的钱）时，提前把这部分预算预留出来。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-21 16:41:06\",\"用户\":\"桑子\",\"群\":\"\",\"用户问询\":\"广告投入模式是怎么样的，按成交收费吗\",\"AI响应\":\"美客多广告采用按点击付费（CPC）模式，而非按成交收费。商品广告通过实时竞价获取展位，系统会根据您设置的每日预算和目标ROAS自动竞价。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-20 10:10:51\",\"用户\":\"XNGc2\",\"群\":\"\",\"用户问询\":\"您好，我们的邮箱接收不到广告报告下载入口的邮件\",\"AI响应\":\"你好！很高兴为你解答。建议使用 outlook/gmail/hotmail 等邮箱，并且可以重新填写表单。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-26 11:51:36\",\"用户\":\"Daniel\",\"群\":\"\",\"用户问询\":\"其他国家站点可以开广告吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n目前美客多跨境贸易（Global Selling）的广告功能主要在墨西哥站点开放。\\n\\n对于巴西、智利、哥伦比亚等其他站点，广告功能目前处于逐步开放阶段，并非所有跨境账号都能立即使用。如果你的后台在这些站点没有广告模块，通常是因为账号尚未达到开启权限的门槛（如信誉等级、销量要求等）。\\n\\n至于阿根廷等其他前端看到的国家，目前主要针对本土卖家，跨境卖家暂时无法在这些站点投放广告。\\n\\n建议你优先做好墨西哥站点的广告投放，并持续提升其他站点的店铺信誉和销量，系统会根据账号表现自动激活更多站点的广告权限。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-26 05:42:23\",\"用户\":\"水果🍉\",\"群\":\"\",\"用户问询\":\"短视频能开广告吗\",\"AI响应\":\"目前 Clips 短视频暂不支持直接投放广告。它主要通过系统在 App 端的独立入口主动推送，为您获取额外的免费流量。建议通过高质量视频提升点击和转化，从而间接带动 Listing 的权重。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-25 16:47:08\",\"用户\":\"鸿铄博洋科技\",\"群\":\"\",\"用户问询\":\"怎么开启广告工具\",\"AI响应\":\"只需简单的三步：\\n1. 进入广告管理后台，点击“创建广告活动”。\\n2. 设置广告活动名称，设置每日最高预算和目标出价。\\n3. 选择要推广的具体商品，完成创建。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-24 19:03:40\",\"用户\":\"Dola\",\"群\":\"\",\"用户问询\":\"为什么关闭广告了反而有订单？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n从图片看，关闭广告后产生的订单属于 **Other orders**（浅蓝色柱状图）。\\n\\n这通常是因为：\\n1. **自然流量出单**：广告关闭后，你的产品仍会在自然搜索结果中展示，这些订单不通过广告点击产生。\\n2. **归因周期**：买家可能在广告关闭前点击了产品，但在关闭后的几天内才下单，系统仍会记录这部分转化。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-23 21:35:01\",\"用户\":\"大耳狐\",\"群\":\"\",\"用户问询\":\"新品广告预算设置多少合适？\",\"AI响应\":\"不好意思，该问题我没有答案\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-23 17:56:03\",\"用户\":\"海盜\",\"群\":\"\",\"用户问询\":\"开通广告 需要提前充值吗\",\"AI响应\":\"美客多广告费用不需要提前充值，直接从卖家账户余额中扣除。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-22 18:29:12\",\"用户\":\"zurich\",\"群\":\"\",\"用户问询\":\"官方仓可以开dsp广告吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n官方仓（Full仓）是可以开通展示型广告（DSP）的。\\n\\n展示型广告（DSP）通过大数据分析为你提供主动触达目标消费人群的机会。根据商品特性和你的需求，定向投放不同目标人群和广告位，并对其进行优化，帮助你获得最大曝光和转化。\\n\\n需要注意的是，绿色信誉是参与平台大流量活动、投放竞价广告（包括DSP）的必备条件。只要你的店铺信誉处于绿色状态，即可申请或开通相关广告功能。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-22 10:43:45\",\"用户\":\"迷迷 苏\",\"群\":\"\",\"用户问询\":\"开一个广告为什么会显示2个\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n从你提供的截图来看，确实出现了两个名称完全一样的广告组（F303 Campaign），但它们的状态不同：\\n\\n1. **第一个 F303 Campaign**：显示为 **0 ads**。这意味着这个广告组虽然创建了，但里面没有包含任何正在推广的商品。\\n2. **第二个 F303 Campaign**：显示为 **1 ad**。这说明这个广告组里已经成功添加并关联了一个商品。\\n\\n**为什么会出现这种情况：**\\n这通常是因为在创建过程中，系统可能出现了短暂的延迟或重复提交，导致生成了一个空的广告组和一个包含商品的广告组。\\n\\n**建议操作：**\\n为了保证账户逻辑清晰和精细化运营，建议你将那个显示 **0 ads** 的广告组关闭或删除，只保留那个显示 **1 ad** 的广告组进行投放。这样可以避免预算分散或管理混乱。\\n\\n从精细化运营的角度出发，我们建议每一个广告组（Campagin）下，只开启一个商品的广告（Ads），进而可以参照曝光占比分析，灵活调整目标ACOS或者广告预算，实现更精准的竞价投放。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-21 21:55:01\",\"用户\":\"Ivan\",\"群\":\"\",\"用户问询\":\"预留广告推广空间是什么意思\",\"AI响应\":\"预留广告推广空间是指在设置“收益价格”时，将未来可能产生的广告费（Product Ads）作为成本计入。\\n\\n因为半托管由你自主定价，如果你计划通过广告引流，建议在“目标利润”中多加一部分预算。这样即使扣除广告支出，也能保证你的最终净利润符合预期。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-21 19:05:28\",\"用户\":\"蓝七\",\"群\":\"\",\"用户问询\":\"我在哪里看我的广告有实际推广？\",\"AI响应\":\"你好！很高兴为你解答。平台提供推广效果报告，你可以通过卖家后台的广告管理界面，追踪广告点击、转化率、销售额等数据来评估推广效果。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-21 18:59:07\",\"用户\":\"蓝七\",\"群\":\"\",\"用户问询\":\"你好广告是按美元计算的吗？\",\"AI响应\":\"你好！很高兴为你解答。美客多广告费用的结算方式取决于你的账户类型。如果是跨境卖家，广告费用通常以美元计费；如果是本土账号，则以当地货币计费。建议在卖家后台广告管理界面查看具体的账单明细。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-21 16:40:23\",\"用户\":\"桑子\",\"群\":\"\",\"用户问询\":\"半托可以进行广告投放吗\",\"AI响应\":\"半托管商家可自行设置广告。开通门槛为：店铺信誉黄色及以上、注册满15天、销售满1单且没有逾期未付发票。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-21 15:32:34\",\"用户\":\"百事可乐\",\"群\":\"\",\"用户问询\":\"市场广告为什么无法访问\",\"AI响应\":\"卖家您好，市场广告无法访问通常由以下原因引起：\\n\\n1. 浏览器兼容性：建议优先使用Chrome浏览器，并关闭网页自动翻译功能。\\n2. 缓存问题：请尝试清除浏览器缓存或使用无痕模式访问。\\n3. 网络环境：建议尝试更换设备或切换网络环境重试。\\n4. 权限同步：如果是新开站点，可能存在权限同步延迟，建议等待后再试。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-21 10:03:22\",\"用户\":\"晨夕\",\"群\":\"\",\"用户问询\":\"广告费需要充值吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n不需要充值。美客多的广告费用没有预充值功能，也不支持信用卡充值，系统会直接从您出单后的卖家账户余额中扣除。只有账户里有了余额，广告才能正常运行。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-21 09:09:58\",\"用户\":\"B.\",\"群\":\"\",\"用户问询\":\"美客多有什么广告位\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n美客多后台商品广告（Product Ads）主要展示在以下位置：\\n\\n1. 搜索结果页：当买家搜索特定关键词时，广告商品会展示在搜索结果的顶部、中部或底部，并带有“Promocionado”或“Ads”标识。\\n\\n2. 商品详情页：在其他类似商品的详情页面中，广告会出现在“相关产品”或“您可能感兴趣的产品”推荐栏位。\\n\\n美客多广告致力于全渠道解决方案，除了上述站内位置，还会帮助卖家在受众进行浏览和购物的任何合适位置与目标受众建立连接。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-21 05:11:12\",\"用户\":\"水果🍉\",\"群\":\"\",\"用户问询\":\"广告也是商家负责吗\",\"AI响应\":\"全托管模式下，广告和营销费用由平台承担。商家只需负责供货，无需额外支付广告费用，平台会通过流量分配和营销活动来带动产品销售。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-21 00:26:41\",\"用户\":\"Gccc\",\"群\":\"\",\"用户问询\":\"新开的店能开广告吗\",\"AI响应\":\"普通店铺开通广告须符合：有绿色信誉、活跃15天以上、出10单、且账户余额充足没有逾期欠款。新店需先满足这些条件。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-20 10:59:03\",\"用户\":\"马永婷\",\"群\":\"\",\"用户问询\":\"如何对接广告经理\",\"AI响应\":\"自注册账号默认无客户经理。若需对接，您可填写官方客户经理申请表，或通过提升销售业绩触发系统自动分配。若您已入驻墨西哥海外仓且单店周GMV达***美金以上，可关注美客多高阶卖家成长服务，符合资质后专属经理会联系您。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-20 10:41:32\",\"用户\":\"爱凑热闹\",\"群\":\"\",\"用户问询\":\"平台投广告怎么扣费\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n美客多广告费用的扣款规则如下：\\n\\n1. 扣款方式：广告费用不是提前充值的，只能从你的账户余额中扣除。\\n\\n2. 扣费逻辑：广告采用每日预算制，只有当买家点击了你的广告时才会产生费用。\\n\\n3. 账单差异：如果你发现广告花费和账单金额对不上，通常是因为费用存在跨月结算（当月未完成校验的费用顺延到下月），或者是后台显示的花费不含税，而账单金额是含税金额。\\n\\n建议你定期查看卖家后台的扣款明细，确保账户余额充足。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-20 10:41:22\",\"用户\":\"爱凑热闹\",\"群\":\"\",\"用户问询\":\"平台投广告怎么扣分\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n美客多广告费用的扣除方式如下：\\n\\n1. 广告费用会直接从你的账户余额中扣除。\\n2. 扣费周期通常是每周一次，系统会自动结算上一周产生的广告账单。\\n3. 如果你的账户余额不足以支付广告费，系统会尝试从你绑定的信用卡或支付方式中扣款。\\n4. 若持续扣款失败，广告活动可能会被暂停，直到欠款结清。\\n\\n建议你定期关注卖家后台的账单明细，确保账户资金充足，以免影响广告的正常投放。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-20 10:10:39\",\"用户\":\"七\",\"群\":\"\",\"用户问询\":\"广告付费怎么付费\",\"AI响应\":\"商品广告采用按点击付费（CPC）模式，只有当买家点击您的广告时才会产生费用。广告费用会直接从您的账户余额中扣除，无需额外手动充值。您只需在系统设置每日预算上限即可控制成本。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-23 13:56:27\",\"用户\":\"纯属巧合\",\"群\":\"\",\"用户问询\":\"我们账号昨天成为了MercadoLeader， 但是整体的销量和流量看着与之前的变化不大， 这个正常吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n成为 MercadoLeader 后短期内销量和流量变化不大是完全正常的，主要原因如下：\\n\\n1. **系统更新周期**：平台的算法调整和流量分配需要一定时间同步，认证后的权限生效可能需要 1-3 个工作日才能完全反映在数据上。\\n\\n2. **流量转化路径**：MercadoLeader 的优势（如搜索权重、广告曝光）是长期积累的过程。例如，搜索排名提升后，新订单可能会在 1-2 周内逐步显现。而你当前的流量可能仍受限于产品本身的竞争力（如图片、描述、价格）。\\n\\n3. **营销活动时机**：平台大促（如 Hot Sale、Buen Fin）通常在认证后 2-3 周才会邀请大商参与，短期内可能无法立即获得额外曝光。\\n\\n**建议你重点关注以下动作**：\\n- **优化 Listing 细节**：确保产品标题、关键词、图片清晰度符合平台标准，MercadoLeader 的搜索权重会优先匹配优质内容。\\n- **开启广告投放**：使用 Product Ads 定向投放，将认证后的流量优势转化为实际订单。\\n- **利用粉丝运营**：通过店铺主页和 Clips 短视频持续触达现有粉丝，提升复购率。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-21 10:36:01\",\"用户\":\"晨夕\",\"群\":\"\",\"用户问询\":\"广告管理在哪里\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n广告管理入口在卖家后台左侧菜单栏的 **Advertising**（或西班牙语 **Publicidad**）选项中。点击进入后即可看到广告仪表盘，进行创建活动、设置预算及查看数据等操作。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-21 10:34:33\",\"用户\":\"晨夕\",\"群\":\"\",\"用户问询\":\"怎么开广告\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n创建广告活动只需简单三步：\\n1. 进入广告管理后台，点击“创建广告活动”。\\n2. 设置广告活动名称，设置每日最高预算和目标出价（ROAS）。\\n3. 选择要推广的具体商品，完成创建。\\n\\n建议一个广告组只放一个商品，方便精准控制。\\n\\n网页参考资料\\nhttps://file.marsmind.cc/boot-admin/mercado/20260715/2077****2450.jpg\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-24 18:54:30\",\"用户\":\"ㅤ  ㅤ\",\"群\":\"\",\"用户问询\":\"平台会竞价同款产品吗谁的价格更低谁得到的流量更多\",\"AI响应\":\"你好！平台存在竞价机制。价格是影响流量分配的重要因素，价格更具竞争力的产品通常能获得更多曝光和转化机会，但流量也受物流时效、信誉等级和Listing质量等综合影响。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-21 16:50:11\",\"用户\":\"Hellen\",\"群\":\"\",\"用户问询\":\"商品管理里，有待达成的质量目标，完成目标后，产品有流量加权吗\",\"AI响应\":\"你好！实现目标后，商品列表的竞争力评分将会提高，这有助于提升产品的搜索排名和曝光机会。当商品质量和购物体验评分都达到100分时，即表示已实现目标。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-21 14:08:37\",\"用户\":\"Jungle King    Jackie\",\"群\":\"\",\"用户问询\":\"点击“contact us”无效，什么都没跳出来\",\"AI响应\":\"如果点击 Contact us 无反应，建议您尝试以下操作：\\n1. 更换浏览器（推荐使用 Chrome 浏览器最新版）。\\n2. 清除浏览器缓存或开启无痕模式。\\n3. 检查是否被浏览器拦截了弹出窗口。\\n4. 尝试切换网络环境。\\n\\n若依然无法打开，建议稍后再试，或通过注册邮箱查看是否有平台发送的相关审核邮件，直接回复邮件咨询。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-26 15:04:43\",\"用户\":\"Larson Kingdom\",\"群\":\"\",\"用户问询\":\"最近流量为什么这么差，平台有什么调整？\",\"AI响应\":\"你好，看到店铺单量下降先不要焦虑，建议你从以下几个方面排查原因：\\n\\n首先，请检查你的店铺信誉等级。非绿色信誉的店铺会被系统削减流量，同时也会影响买家的下单决策，导致转化率降低。如果是因为近期有投诉或延迟发货导致信誉降级，建议通过降价或广告引流获取新订单，以此稀释负面指标。同理，你也需要检查各个链接的信誉分数，是否有因为客诉/退货导致的链接分数下降，请及时处理售后问题，并优化链接描述、图片、属性、添加操作视频Clips等方式尽量降低未来客诉率，确实有质量问题的链接，建议做提仓处理。\\n\\n其次，检查广告投放情况。如果你的商品数量较多，建议进行分组管理。如果稳定出单的商品广告预算不足导致断档，广告算法需要重新累计，会直接影响单量。\\n\\n另外，如果是近期进行了降价操作，请耐心等待。在自然情况下，系统对降价的反应有一个周期，通常在降价后的第4天开始才会有明显的流量加持和出单增长。\\n\\n最后，请核查是否有Listing被暂停。比如定价错误被薅羊毛后手动暂停，或者库存不足导致权重下降。建议定期核查后台指标波动，依据系统诊断建议优化运营动作。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-26 13:02:16\",\"用户\":\"静待花开🌸\",\"群\":\"\",\"用户问询\":\"那想要客户经理流量扶持需要怎么做\",\"AI响应\":\"想要获得客户经理的流量扶持，您可以参考以下几种方式：\\n\\n1. 提升销售业绩：这是最常见的方式。当您的店铺业绩达到一定水平时，系统会自动触发分配机制，为您匹配专属的客户经理。\\n\\n2. 报名高阶卖家成长服务：如果您希望直接对接经理获得精准的扶持，可以关注美客多高阶卖家成长服务。\\n- 自发货卖家：若单店周流水达到***美金以上且信誉良好，可以申请IDS PRO服务。\\n- 海外仓卖家：若单店周GMV达***美金以上，可以扫码报名高阶服务。\\n符合条件的店铺，专属团队会在5-10个工作日内与您联系。\\n\\n3. 参加官方活动：主动报名参加平台举办的各类线上线下交流活动，也有机会在活动中对接招商经理。\\n\\n自注册账号默认由官方客服支持，建议您先通过优化Listing、提升店铺信誉来积累销量，从而争取对接经理的机会。\\n\\n海外仓高阶卖家请参考如下海报：\\nhttps://file.marsmind.cc/boot-admin/mercado/20260325/2036****6242.jpg\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-26 05:45:08\",\"用户\":\"水果🍉\",\"群\":\"\",\"用户问询\":\"Clips工具这个可以做视频是吧\",\"AI响应\":\"Clips工具主要用于上传和管理视频。您可以自己制作或联系代理商拍摄，视频需为竖屏格式、时长一分钟以内，重点展示产品使用场景和功能。\\n\\n网页参考资料\\nhttps://doc.weixin.qq.com/pdf/d3_ARIAagYiAMICNyEe2BK5CQPCOSXrw?scode=AI8A3wfvAAo41o0vELAXUA7AYZANA\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-26 02:43:53\",\"用户\":\"水果🍉\",\"群\":\"\",\"用户问询\":\"新店没流量，连曝光都没有 怎么处理\",\"AI响应\":\"针对新店没流量的情况，建议按以下步骤操作：\\n\\n1. **快速积累信誉**：通过降价或推广尽快完成前10单履约，拿到绿色信誉以开启流量通道。\\n2. **优化Listing**：确保每个产品有3张以上高清图，优化标题关键词，点亮基础权重。\\n3. **使用Clips短视频**：这是目前最推荐的工具，能直接增加曝光入口，提升25%-30%销量。\\n4. **开启广告**：注册满15天且账户健康即可开启广告，利用广告撬动流量实现突破。\\n5. **参加活动**：提报平台免费的促销活动，借助大促流量提升曝光。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-23 18:56:47\",\"用户\":\"大大大明\",\"群\":\"\",\"用户问询\":\"马槽这款产品在墨西哥的关键词是什么\",\"AI响应\":\"你好！很高兴为你解答。马槽产品在墨西哥的常用西班牙语关键词有：**Nacimientos（耶稣诞生场景）、Belén（马槽）、Figura de Belén（马槽人物）、Relieve de Belén（马槽浮雕）**。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-21 18:47:15\",\"用户\":\"大大大明\",\"群\":\"\",\"用户问询\":\"ROSA和ACOS分别是什么意思\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n**ROAS**（广告支出回报率）：衡量广告效果的指标，计算公式为：广告产生的收入 / 广告花费。数值越高，代表每投入1元广告费带来的收入越多。\\n\\n**ACOS**（广告销售成本比）：衡量广告成本占比的指标，计算公式为：广告花费 / 广告产生的销售额。数值越低，代表广告成本越低，利润空间越大。\\n\\n两者互为倒数关系：ACOS = 1 / ROAS。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-20 14:49:06\",\"用户\":\"AA依然指间砂\",\"群\":\"\",\"用户问询\":\"老师，怎么提高商品曝光量和成交量\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n关于提高商品的曝光量和成交量，建议从以下几个方面入手：\\n\\n1. 优化产品Listing：完善标题和关键词，确保合理使用相关关键词以提高搜索排名。同时上传高质量、多角度的产品图片，让产品更加突出。\\n\\n2. 价格竞争力：降低价格是提高商品列表竞争力的直接方式。你可以观察竞争对手的定价，保持价格优势。\\n\\n3. 开启广告投放：建议为链接配上广告。在优化广告时，要关注预算是否充足以及排名情况。如果因为排名不足导致曝光受限，可以考虑提高CPC出价和商品的转化率。\\n\\n4. 制作优秀视频：通过开箱、评测或展示产品用途的视频来吸引访客。视频应在光线充足的地方录制，展示产品的好处，并以号召性用语结束，引导用户下单。\\n\\n5. 积极参与活动：提报平台的各类促销活动，这能为店铺带来更多的流量资源。\\n\\n6. 保持上新频率：充足的在售库存和持续上新至关重要，这有助于在平台算法中获得更多曝光机会。\\n\\n网页参考资料：\\nhttps://file.marsmind.cc/boot-admin/mercado/20260715/2077****6706.jpg\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-20 14:42:36\",\"用户\":\"纳洛童\",\"群\":\"\",\"用户问询\":\"手表的关键转化词前5个参数排名分别是哪些？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n根据美客多平台大数据及手表类目转化逻辑，影响转化的前5个关键参数排名如下：\\n\\n1. **Resistencia al agua（防水深度）**：如 30m/50m，是买家最关注的耐用性指标。\\n2. **Tipo de movimiento（机芯类型）**：如 Cuarzo（石英）、Digital（电子）或 Dual（双显）。\\n3. **Material de la correa（表带材质）**：如 TPU、Resina（树脂）或 Acero inoxidable（不锈钢），直接影响佩戴舒适度。\\n4. **Diámetro de la caja（表盘直径）**：如 53mm，决定了佩戴后的视觉风格（大表盘在拉美极受欢迎）。\\n5. **Funciones（核心功能）**：如 Cronógrafo（秒表）、Luz LED（夜光）及 Alarma（闹钟）。\\n\\n准确填写这 5 项参数能显著降低退货率并提升转化。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-26 17:52:08\",\"用户\":\"Jenny  Yu\",\"群\":\"\",\"用户问询\":\"一定要上传视频吗？\",\"AI响应\":\"不是必须上传视频。上传视频是为了增加产品展示效果和转化率，但如果不上传，产品依然可以正常发布和销售。\\n\\n如果决定上传，请确保视频符合以下要求：\\n- 竖屏格式（9:16），时长10秒至1分钟。\\n- 包含声音或背景音乐，展示产品使用状态。\\n- 不得包含联系方式、价格优惠或水印。\\n\\n网页参考资料：\\nhttps://mp.weixin.qq.com/s?biz=MzI5NDU3NzE0NQ==\\u0026mid=2247509458\\u0026idx=1\\u0026sn=097489beab779671868e146f1e458cb4\\u0026scene=21wechat_redirect\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-21 17:50:27\",\"用户\":\"大大大明\",\"群\":\"\",\"用户问询\":\"这种高曝光低点击的一般怎么优化\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n高曝光低点击说明主图或标题不够吸引人。请重点优化：\\n1. **主图质量**：确保清晰、突出产品，可尝试情景化背景。\\n2. **标题优化**：使用当地语言及高频关键词，确保前几个词能吸引点击。\\n3. **价格竞争力**：检查价格是否高于同类竞品，设置合理折扣。\",\"一级大类\":\"营销活动\",\"二级子类\":\"广告投放\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-21 17:48:29\",\"用户\":\"大大大明\",\" 后怎么处理？\",\"AI响应\":\"美客多售后处理方式取决于您的经营模式：\\n\\n1. 全托管模式：正常售后由平台负责处理，无需商家介入。若出现批量产品质量问题，平台可能会联系您协助处理。\\n\\n2. 海外仓（Full）模式：由平台官方负责客服和售后退换货处理。\\n\\n3. 自发货模式：卖家需自行负责售后。若买家发起投诉或退货申请，您需在后台及时响应，与买家协商退款、部分退款或重新发货。\\n\\n建议定期关注卖家后台的“投诉（Claims）”板块，确保及时处理以维护店铺信誉。\",\"一级大类\":\"其他\",\"二级子类\":\"买家纠纷\",\"问题主题\":\"买家纠纷/客诉/售后\"},{\"时间\":\"2026-07-21 09:52:16\",\"用户\":\"sun*\",\"群\":\"\",\"用户问询\":\"你有售后的教程吗\",\"AI响应\":\"您好！我这边没有权限直接提供示意图，但您可以在我们平台的卖家帮助中心（https://global-selling.mercadolibre.com/help）查看详细的操作指南和视频教程。店铺审核通过后，您的运营经理会提供新卖家手册，里面包含详细的操作流程图。建议联系您的客户经理获取更具体的操作示意图。\",\"一级大类\":\"其他\",\"二级子类\":\"买家纠纷\",\"问题主题\":\"买家纠纷/客诉/售后\"},{\"时间\":\"2026-07-21 09:46:22\",\"用户\":\"sun*\",\"群\":\"\",\"用户问询\":\"你好，售后的规则是怎么样的\",\"AI响应\":\"你好！很高兴为你解答。美客多支持买家在收到商品后的30天内无理由退货。若因产品质量或描述不符产生纠纷，平台会介入处理。建议您保持良好的沟通并及时处理买家投诉，以维护店铺信誉。\",\"一级大类\":\"其他\",\"二级子类\":\"买家纠纷\",\"问题主题\":\"买家纠纷/客诉/售后\"},{\"时间\":\"2026-07-25 09:58:52\",\"用户\":\"Silvia\",\"群\":\"\",\"用户问询\":\"那还有 跨境店 买家下单是收税的吧？那如果买家退货 或者货物损坏了 这个税怎么处理呢\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n关于跨境店在退货或货物损坏时的税费处理，情况如下：\\n\\n1. 进口税费（买家承担部分）：在自发货模式下，各站点的税费由买家承担。如果买家发起退货，这部分由买家支付给当地海关或物流商的税费，通常是不退还给卖家的，由平台根据退货政策处理买家的退款。\\n\\n2. 平台代扣税（卖家部分）：\\n- 墨西哥站点：目前自发货卖家不涉及墨西哥36%的增值税代扣。但如果你是海外仓模式且未上传RFC税号，平台会预扣20%的所得税。\\n- 货物损坏/退货：如果订单发生了全额退款，平台通常会退回该笔订单对应的佣金。对于已经预扣并缴纳给税局的税款，处理流程非常复杂，通常无法直接退回到卖家的账户余额中。\\n\\n3. 货物损坏的处理：\\n- 售后由平台处理，商家无需介入。\\n- 平台会根据买家退款申请的原因和卖家提交的证据进行审核。\\n- 退货商品由平台评估是否退仓或销毁。如果是由于物流原因导致的损坏，你可以尝试向平台发起申诉。\\n\\n总结来说，自发货卖家无需支付16%的增值税，税费由买家承担，因此退货时你主要损失的是货值和发货运费，不涉及税费的退还问题。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ\",\"一级大类\":\"其他\",\"二级子类\":\"买家纠纷\",\"问题主题\":\"买家纠纷/客诉/售后\"},{\"时间\":\"2026-07-25 10:13:36\",\"用户\":\"君\",\"群\":\"\",\"用户问询\":\"买家发起了投诉，会使声誉受影响，我愿意给他退款，怎么可以让声誉不受影响\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n要在退款的同时保护信誉，你需要在48小时内处理投诉并给出买家满意的解决方案，确保投诉被关闭。成功关闭的投诉不会影响店铺信誉。\\n\\n请务必在后台投诉界面操作退款，不要私下转账，确保系统识别到投诉已妥善解决。\",\"一级大类\":\"其他\",\"二级子类\":\"买家纠纷\",\"问题主题\":\"买家纠纷/客诉/售后\"},{\"时间\":\"2026-07-22 11:31:08\",\"用户\":\"Dan.\",\"群\":\"\",\"用户问询\":\"买家点了我已与卖家达成协议这个选项之后，我就可以直接操作部分退款了吗\",\"AI响应\":\"不是的。在买家点击“已达成协议”或平台介入后，通常会有以下两种情况：\\n\\n1. 平台客服介入执行：当双方达成一致后，平台客服会根据你们的聊天记录证据，手动操作扣除约定的比例（如50%）并完成退款，随后关闭纠纷。\\n\\n2. 系统释放部分退款选项：在某些情况下，只有当纠纷状态更新为“双方协商中”或特定阶段时，卖家后台才会出现“部分退款”的输入框。\\n\\n如果目前界面依然只有“退款”按钮，请不要盲目点击。最稳妥的做法是：\\n点击“联系 Mercado Libre”，上传买家同意的截图，留言说明“买家已同意50%部分退款，请协助处理”。这样可以确保不会被系统误判为全额退款，同时也能保证纠纷处理不影响你的声誉。\\n\\n网页参考资料：\\nhttps://doc.weixin.qq.com/pdf/d3_ARIAagYiAMICN5QzxCVQdTRmdC6gC?scode=AI8A3wfvAAotfooSbE\",\"一级大类\":\"其他\",\"二级子类\":\"买家纠纷\",\"问题主题\":\"买家纠纷/客诉/售后\"},{\"时间\":\"2026-07-21 22:26:39\",\"用户\":\"￴ ￴￴ ￴￴\",\"群\":\"\",\"用户问询\":\"发到东莞仓的货品，如果退货的话，是必须退到海外本土仓是吗，不能退回国内地址\",\"AI响应\":\"你好！很高兴为你解答。是的，滞销或退回的商品无法退回国内仓库，只能选择销毁或者退到你提供的墨西哥本土海外仓地址。\",\"一级大类\":\"其他\",\"二级子类\":\"买家纠纷\",\"问题主题\":\"买家纠纷/客诉/售后\"},{\"时间\":\"2026-07-21 18:31:06\",\"用户\":\"Chelsey Chen\",\"群\":\"\",\"用户问询\":\"经理，在业务报告这里，如果我想知道这个退货退款具体销售额是多少，在哪里能看？\",\"AI响应\":\"你好！很高兴为你解答。回款金额需减去退款金额、广告费、佣金、物流费、仓储费等费用。具体退款明细建议在后台账单或结算报告中核查。\",\"一级大类\":\"其他\",\"二级子类\":\"买家纠纷\",\"问题主题\":\"买家纠纷/客诉/售后\"},{\"时间\":\"2026-07-21 11:58:43\",\"用户\":\" John\",\"群\":\"时骏科技-美客多助手\",\"用户问询\":\"@美客多小助手萝拉 买家在美客多平台上从哪里可以查看到卖家产品的条码？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n买家在美客多平台的前台页面是无法直接查看到卖家产品的内部条码（如卖家自编的SKU条码或UPC/EAN码）的。\\n\\n买家通常只能看到以下信息：\\n1. 商品详情：包括标题、图片、价格、描述和技术规格。\\n2. 平台编码：即MLB/MLM开头的链接ID，这是平台用于识别该Listing的唯一编号。\\n3. 物流单号：在订单生成并由物流商扫描后，买家可以在订单详情中看到国际段的物流追踪号。\\n\\n如果您是指产品包装上的条码，买家只有在收到实物包裹后，通过查看您贴在产品上的标签才能看到。如果您是为了方便买家核对商品，建议将相关的产品型号或关键参数直接写在商品标题或描述中。\",\"一级大类\":\"其他\",\"二级子类\":\"买家纠纷\",\"问题主题\":\"买家纠纷/客诉/售后\"},{\"时间\":\"2026-07-21 09:48:01\",\"用户\":\"sun*\",\"群\":\"\",\"用户问询\":\"投诉率 有三种，为什么会有这三种，就是不影响绩效，影响绩效，解决后不影响绩效\",\"AI响应\":\"投诉分为三种是因为平台会根据投诉的严重程度、处理时效及买家反馈来判定。及时解决可避免影响店铺信誉，但所有投诉仍会计入购物体验分考核，影响Listing权重。\",\"一级大类\":\"其他\",\"二级子类\":\"买家纠纷\",\"问题主题\":\"买家纠纷/客诉/售后\"},{\"时间\":\"2026-07-20 14:15:44\",\"用户\":\"奶黄包💰\",\"群\":\"\",\"用户问询\":\"在 **Sales \\u003e Claims**（纠纷）这个版块在哪里？\",\"AI响应\":\"你好！很高兴为你解答。请登录卖家后台，在左侧菜单栏找到 **Sales**（销售）选项，点击展开后即可看到 **Claims**（纠纷）。在这里你可以查看并处理所有买家的投诉。\",\"一级大类\":\"其他\",\"二级子类\":\"买家纠纷\",\"问题主题\":\"买家纠纷/客诉/售后\"},{\"时间\":\"2026-07-25 15:48:55\",\"用户\":\"夏天的风\",\"群\":\"\",\"用户问询\":\"这个每个国家的退货地址必须填的吗？如果必须的话 可以乱填吗\",\"AI响应\":\"必须填写，且不能乱填。未填或乱填会导致纠纷中无法要求退货，只能被迫仅退款。若无当地仓库，建议联系第三方物流商获取本土退货地址。\",\"一级大类\":\"其他\",\"二级子类\":\"买家纠纷\",\"问题主题\":\"买家纠纷/客诉/售后\"},{\"时间\":\"2026-07-25 11:01:54\",\"用户\":\"君\",\"群\":\"\",\"用户问询\":\"但是它不是说买家取消了退货吗 为什么又向买家退款了\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n从图片看，虽然之前显示买家取消退货，但最终状态已更新为“调解完成并向买家退款”。这通常是因为平台介入调解后，判定由平台操作退款给买家，且买家无需退回货物。\\n\\n由于系统已执行退款流程，该订单的最终结算金额变为了 0。\",\"一级大类\":\"其他\",\"二级子类\":\"买家纠纷\",\"问题主题\":\"买家纠纷/客诉/售后\"},{\"时间\":\"2026-07-25 10:16:10\",\"用户\":\"君\",\"群\":\"\",\"用户问询\":\"有什么办法可以让买家撤销投诉，但是我继续给他退款吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n你可以通过订单聊天窗口与买家协商，请买家在后台点击“撤销投诉”或选择“已解决”。\\n\\n只要买家主动撤销投诉，该笔订单就不会计入你的纠纷率，从而保护店铺信誉。在买家撤销后，你可以在后台操作退款，或者通过平台系统完成退款流程。请确保在 48 小时内完成沟通和处理。\",\"一级大类\":\"其他\",\"二级子类\":\"买家纠纷\",\"问题主题\":\"买家纠纷/客诉/售后\"},{\"时间\":\"2026-07-24 16:13:51\",\"用户\":\"孫明山\",\"群\":\"\",\"用户问询\":\"买家分期购物，由平台和买家进行对接，负责后期的货款回收，对吧？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n是的，你的理解非常准确。\\n\\n买家选择分期购物后，后续的还款事宜由买家与美客多平台（Mercado Pago）或相关的金融机构直接对接。平台会负责后期货款的回收，卖家不需要参与其中，也不会承担买家逾期还款的风险。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"其他\",\"二级子类\":\"买家纠纷\",\"问题主题\":\"买家纠纷/客诉/售后\"},{\"时间\":\"2026-07-21 14:12:36\",\"用户\":\"黄静华\",\"群\":\"\",\"用户问询\":\"超过30天的买家反馈，无法申请退款，请问是什么原因\",\"AI响应\":\"你好！很高兴为你解答。平台会根据买家退款申请的原因和卖家提交的证据进行审核处理。通常情况下，买家发起退款申请有一定的时间限制，若超过规定时效，系统可能不再支持直接申请退款。\",\"一级大类\":\"其他\",\"二级子类\":\"买家纠纷\",\"问题主题\":\"买家纠纷/客诉/售后\"},{\"时间\":\"2026-07-21 10:51:19\",\"用户\":\".\",\"群\":\"\",\"用户问询\":\"那我能不能和买家说取消投诉，这样会不会有什么影响\",\"AI响应\":\"可以和买家协商取消投诉。如果买家在48小时内撤销或关闭投诉，该投诉将不会计入店铺投诉率，也不会影响店铺信誉。但请注意，引导买家取消投诉时需确保其满意，避免因处理不当引发二次投诉或平台违规风险。\",\"一级大类\":\"其他\",\"二级子类\":\"买家纠纷\",\"问题主题\":\"买家纠纷/客诉/售后\"},{\"时间\":\"2026-07-20 12:05:46\",\"用户\":\"蓝天白云\",\"群\":\"时骏科技-美客多助手\",\"用户问询\":\"@美客多小助手萝拉 卖家不需要在外箱上贴买家的地址对吗？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n是的，卖家不需要额外在外箱上贴买家的地址。\\n\\n你从卖家后台下载并打印的美客多官方物流面单（即你之前提到的显示送往深圳沙井的那张面单）已经包含了所有必要的信息。\\n\\n这张面单是“二合一”的：\\n1. 前半段：用于国内物流段，指引包裹送达菜鸟集运仓。\\n2. 后半段：包含了买家的加密信息和国际段物流所需的条码。\\n\\n当包裹到达菜鸟仓库并被扫描后，物流商会根据面单上的信息处理后续的国际运输和末端派送。你只需要确保这张官方面单清晰、平整地贴在包裹外层即可，千万不要自行粘贴其他包含买家地址的标签，以免干扰仓库扫描。\",\"一级大类\":\"其他\",\"二级子类\":\"买家纠纷\",\"问题主题\":\"买家纠纷/客诉/售后\"},{\"时间\":\"2026-07-20 11:11:30\",\"用户\":\"赵天昊\",\"群\":\"\",\"用户问询\":\"与买家协商好部分退款 开启调解后为什么还是声誉受影响\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n关于产品和描述不一致的投诉，即使你与买家协商一致并进行了退款处理，该投诉仍然会被计入购物体验分的考核中。\\n\\n虽然这种情况可能不会直接导致店铺信誉降级，但它会作为考核指标影响你的整体评分。为了避免此类情况，建议你后续格外重视完善商品的Listing图片、属性和描述等要素，确保信息清晰准确，避免因买家误解而引发投诉。\\n\\n网页参考资料：\\nhttps://global-selling.mercadolibre.com/help/28594\",\"一级大类\":\"其他\",\"二级子类\":\"买家纠纷\",\"问题主题\":\"买家纠纷/客诉/售后\"},{\"时间\":\"2026-07-26 22:12:06\",\"用户\":\"NPT\",\"群\":\"\",\"用户问询\":\"这个回复 回复错了 怎么重新回复\",\"AI响应\":\"你好！美客多平台的售前咨询一旦回复，目前是不支持修改或撤回重新回复的。\\n\\n如果回复内容有误，建议你等待买家再次提问，或者在其他买家询问类似问题时确保回复准确。为了避免此类问题，建议在回复前仔细核对买家的问题内容。\",\"一级大类\":\"其他\",\"二级子类\":\"买家纠纷\",\"问题主题\":\"买家纠纷/客诉/售后\"},{\"时间\":\"2026-07-25 10:50:47\",\"用户\":\"夏天的风\",\"群\":\"\",\"用户问询\":\"一般退货地址是怎么填呢 填国内？\",\"AI响应\":\"全托管后台建议填写您自己的国内收件地址。但需注意，每个国家都必须填写对应的退货地址，不能统一填写同一个国家的地址。\",\"一级大类\":\"其他\",\"二级子类\":\"买家纠纷\",\"问题主题\":\"买家纠纷/客诉/售后\"},{\"时间\":\"2026-07-25 10:50:04\",\"用户\":\"夏天的风\",\"群\":\"\",\"用户问询\":\"这些需要设置吗 我这个是全托管的\",\"AI响应\":\"从图片看，您的智利、巴西、墨西哥、哥伦比亚和阿根廷站点均已处于“活跃”状态。全托管模式下，您需要为每个运营国家设置退货地址。\",\"一级大类\":\"其他\",\"二级子类\":\"买家纠纷\",\"问题主题\":\"买家纠纷/客诉/售后\"},{\"时间\":\"2026-07-24 10:36:44\",\"用户\":\"致欣\",\"群\":\"\",\"用户问询\":\"麻烦问一下，我怎么能在买家端查到我的店铺呢\",\"AI响应\":\"在列表中，我们将首先显示目录产品。从那里，买家将找到所有在产品页面上汇集的现有产品报价。\\n\\n通常买家可以通过以下方式看到你的产品：\\n1. 搜索关键词：买家在搜索框输入你产品的关键词，如果你的Listing权重较高，就会出现在搜索结果中。\\n2. 目录页面：买家进入特定类目浏览时，可以看到你的产品。\\n3. 店铺链接：你可以通过店铺介绍让潜在买家了解你的店铺。一个出色的店铺介绍能展示主营产品和品牌背景，给买家留下良好的第一印象。\\n\\n如果你想直接查看自己的Listing在买家端的展示效果，可以在卖家后台点击对应产品的链接跳转到前台页面。\",\"一级大类\":\"其他\",\"二级子类\":\"买家纠纷\",\"问题主题\":\"买家纠纷/客诉/售后\"},{\"时间\":\"2026-07-22 09:46:19\",\"用户\":\"Elaine \",\"群\":\"\",\"用户问询\":\"现在已经没有退款按钮了，应该怎么处理？\",\"AI响应\":\"如果调解页面已没有退款按钮，说明该投诉已进入平台人工介入阶段。\\n\\n目前 dTRmdC6gC?scode=AI8A3wfvAAotfooSbE\",\"一级大类\":\"其他\",\"二级子类\":\"买家纠纷\",\"问题主题\":\"买家纠纷/客诉/售后\"},{\"时间\":\"2026-07-21 18:34:53\",\"用户\":\"Chelsey Chen\",\"群\":\"\",\"用户问询\":\"如何查看退货和退款明细？\",\"AI响应\":\"你好！很高兴为你解答。你可以通过以下链接查看退款相关信息：\\nhttps://global-selling.mercadolibre.com/help/28594\",\"一级大类\":\"其他\",\"二级子类\":\"买家纠纷\",\"问题主题\":\"买家纠纷/客诉/售后\"},{\"时间\":\"2026-07-21 17:04:07\",\"用户\":\"Hellen\",\"群\":\"\",\"用户问询\":\"买家最多可以分多少期付款\",\"AI响应\":\"你好！美客多支持买家使用分期付款和现金支付等多样化的支付方式，有效提高大件商品的转化率。具体分期期数取决于买家使用的银行卡及平台政策。\",\"一级大类\":\"其他\",\"二级子类\":\"买家纠纷\",\"问题主题\":\"买家纠纷/客诉/售后\"},{\"时间\":\"2026-07-21 16:38:38\",\"用户\":\"喜柿\",\"群\":\"\",\"用户问询\":\"在哪里下载投诉订单报告\",\"AI响应\":\"卖家您好，请登录卖家后台，进入 Reputation 页面，在页面下方可以找到并下载投诉订单报告，查看具体受损指标和订单详情。\",\"一级大类\":\"其他\",\"二级子类\":\"买家纠纷\",\"问题主题\":\"买家纠纷/客诉/售后\"},{\"时间\":\"2026-07-21 10:54:19\",\"用户\":\"梁海波\",\"群\":\"\",\"用户问询\":\"如果客户退款，需要我们承担吗\",\"AI响应\":\"半托管模式下，买家可以发起退货，退货费用由商家承担。全托管模式下，如果买家退款，平台会自动处理退款，无需卖家手动操作。\",\"一级大类\":\"其他\",\"二级子类\":\"买家纠纷\",\"问题主题\":\"买家纠纷/客诉/售后\"},{\"时间\":\"2026-07-20 16:16:52\",\"用户\":\"明月清风\",\"群\":\"\",\"用户问询\":\"平台有买家联系卖家的渠道吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n美客多平台为了保护买家隐私和维护交易秩序，买家与卖家的沟通主要分为两个阶段，且渠道有所不同：\\n\\n1. 售前咨询（Pre-sale Questions）：\\n买家在下单前，可以在产品详情页下方的“问答区”向卖家提问。卖家需要及时在后台回复，这些问答是公开显示的，其他买家也能看到。\\n\\n2. 售后沟通（Post-sale Messaging）：\\n只有在买家下单付款后，买卖双方才能通过订单详情页中的“发送消息”功能进行私密对话。\\n\\n特别提醒：\\n在任何沟通渠道中，严禁卖家向买家索要或提供个人联系方式（如电话、邮箱、社交账号等），也严禁引导买家脱离平台交易。一旦被系统检测到，可能会导致店铺被警告甚至封禁。\\n\\n网页参考资料：\\n如何处理买家咨询：https://mercadolibre.cn/news/info?id=81\\u0026type=live\",\"一级大类\":\"其他\",\"二级子类\":\"买家纠纷\",\"问题主题\":\"买家纠纷/客诉/售后\"}]},{\"一级大类\":\"其他\",\"二级子类\":\"政策咨询\",\"Past 7 Days\":62,\"Previous 2026-07-13 to 2026-07-19\":59,\"Change\":3,\"WoW\":0.05084745762711865,\"Past 7 Share\":0.008723793443084283,\"高频问题\":\"平台政策/官方规则\",\"__details\":[{\"时间\":\"2026-07-20 20:06:35\",\"用户\":\"明月清风\",\"群\":\"\",\"用户问询\":\"采用的计算方式是 长度 × 宽度 × 高度）÷ 6,000 吗 到巴西时效是？ 包裹要求\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n关于你提到的计算方式、时效及包裹要求，具体如下：\\n\\n**1. 计费重量计算方式**\\n美客多自发货（菜鸟物流）的计费重量是取**实际重量**与**体积重量**中的较大者。\\n体积重量的计算公式确实是：**（长度 × 宽度 × 高度）÷ 6,000**（单位为厘米）。\\n如果体积重量大于实际重量，则按体积重量计费。\\n\\n**2. 到巴西的物流时效**\\n自发货模式下，从中国发往巴西的整体时效通常在 **15-25 个工作日**左右。\\n商家只需在规定时间内（通常为72小时内）发货至国内官方仓，后续的国际运输和末端配送由平台及物流合作伙伴负责。\\n\\n**3. 包裹要求（自发货模式）**\\n请严格遵守以下尺寸和重量限制，否则包裹可能被拦截或产生额外费用：\\n- **长度：** ≤ 60 cm\\n- **宽度：** ≤ 40 cm \\n- **高度：** ≤ 35 cm\\n- **三边之和：** ≤ 135 cm\\n- **重量：** ≤ 15 kg\\n\\n**特别提醒：**\\n在包装时，请确保包裹牢固且符合菜鸟揽收仓的操作规范，并在包裹上系彩色扎带或粘贴彩色胶带，这是包裹快速处理的“通行证”。\\n\\n网页参考资料：\\n自发货产品尺寸及重量限制：https://global-selling.mercadolibre.com/help/dimensiones-paquetes-cainiao_37370\",\"一级大类\":\"其他\",\"二级子类\":\"政策咨询\",\"问题主题\":\"平台政策/官方规则\"},{\"时间\":\"2026-07-21 16:21:25\",\"用户\":\"Hellen\",\"群\":\"\",\"用户问询\":\"刚发布了一个产品，后台提示：它不符合我们的照片质量要求。 我需要怎么修改呢？\",\"AI响应\":\"你好！请根据以下要求修改：\\n1. 背景：使用纯白背景，无阴影、边框或水印。\\n2. 构图：产品居中，占据图像95%以上，且不被遮挡。\\n3. 规格：正方形，建议1200x1200px，分辨率72dpi，RGB模式。\\n4. 内容：只显示销售的产品，不含Logo或文字。\",\"一级大类\":\"其他\",\"二级子类\":\"政策咨询\",\"问题主题\":\"平台政策/官方规则\"},{\"时间\":\"2026-07-20 12:55:38\",\"用户\":\"泰戈\",\"群\":\"\",\"用户问询\":\"一条手链大致也就五六克、十几克重，但是平台是不是最低要求 50 克起步？\",\"AI响应\":\"卖家您好，是的。\\n\\n在美客多自发货模式下，运费是按货件毛重计收的。如果您的商品实际重量（含包装）低于50克，平台系统在计算运费时通常会按**50克**作为起步重量进行计费。\\n\\n因此，对于手链这类极轻的商品，建议您在录入重量时按实际重量填写，但核算成本时需考虑到平台最低计费标准的限制。同时，请务必确保申报的尺寸准确，以免产生额外的差异收费。\",\"一级大类\":\"其他\",\"二级子类\":\"政策咨询\",\"问题主题\":\"平台政策/官方规则\"},{\"时间\":\"2026-07-25 10:33:15\",\"用户\":\"灵感菇oi\",\"群\":\"\",\"用户问询\":\"您好，巴西站点有最低PROCEED NET要求吗\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n巴西站点目前没有明确的最低净收益（Net Proceed）金额限制，但平台对商品的最终销售价格有最低要求。\\n\\n目前巴西站点的最低售价要求为 7 雷亚尔。如果您的净收益设置过低，导致系统计算出的最终售价低于 7 雷亚尔，该商品将无法成功发布或激活。建议您在设置净收益时，综合考虑采购成本、利润以及平台可能产生的各项费用。\",\"一级大类\":\"其他\",\"二级子类\":\"政策咨询\",\"问题主题\":\"平台政策/官方规则\"},{\"时间\":\"2026-07-25 10:02:20\",\"用户\":\"纳洛童\",\"群\":\"\",\"用户问询\":\"乌拉圭客户有被要求一年只能 3 次购买国际包裹吗？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n是的，乌拉圭对个人跨境购物有严格的限制。根据乌拉圭海关规定，个人买家每年最多只能进行 **3次** 免税跨境购物（Franquicia）。\\n\\n**具体规则如下：**\\n1. **次数限制**：每人每年（自然年）仅限 3 次。\\n2. **金额限制**：每次包裹的离岸价（FOB）不得超过 **200美元**。\\n3. **重量限制**：每个包裹重量不得超过 **20公斤**。\\n4. **身份要求**：买家必须使用乌拉圭当地身份证（CI）进行申报，且支付卡片持有人必须与收件人身份一致。\\n\\n**如果超过 3 次会怎样？**\\n如果买家当年的 3 次免税额度已用完，后续的跨境包裹将无法享受免税政策，必须按照一般进口流程缴纳高额关税（通常为商品价值的 60% 左右），或者包裹会被海关扣留。\\n\\n**建议：**\\n在与乌拉圭买家沟通时，可以友好提醒对方核实当年的免税额度，以免因超额导致清关失败或产生额外税费。\",\"一级大类\":\"其他\",\"二级子类\":\"政策咨询\",\"问题主题\":\"平台政策/官方规则\"},{\"时间\":\"2026-07-24 17:05:21\",\"用户\":\"不爱吃饭\",\"群\":\"\",\"用户问询\":\"什么情况下可以正常提款？对银行账户有什么要求吗？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n在美客多平台，正常回款需要满足以下条件：\\n\\n1. 结算门槛：单站点可结算净余额累计达到 500 美元。\\n2. 结算周期：款项是自动触发的，通常为每周结算一次，无需手动操作提现。\\n3. 账户状态：店铺信誉良好，且KYC审核、RFC验证（如适用）均处于 Approved 状态。\\n4. 验证流程：设置或更新国际银行账户后，卖家须完成面部重新认证流程。如果重新认证成功，账户将显示为设置成功。\\n\\n关于银行账户的要求如下：\\n\\n1. 账户类型：支持电子钱包（第三方支付平台收款账号，如万里汇、派安盈等）和本地银行账户。\\n2. 币种与地区：必须是美元（USD）银行账户，且必须是非美国境内的银行账户（例如香港、新加坡、英国等地的账户均可）。\\n3. 信息完整性：平台可能需要提供完整的开户行信息，包括银行名称、地址、SWIFT代码等。\\n4. 账户性质：全托管模式下没有强制要求必须是企业账户，只要能接收美金的账户即可。\\n\\n由于你近期更换了账户，请务必确认是否已完成系统要求的面部重新认证，这是激活新账户收款功能的必经步骤。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ\",\"一级大类\":\"其他\",\"二级子类\":\"政策咨询\",\"问题主题\":\"平台政策/官方规则\"},{\"时间\":\"2026-07-23 16:24:19\",\"用户\":\"巍\",\"群\":\"\",\"用户问询\":\"我可以发给你看看吗。帮我看下填得对不对 是这个吗。\",\"AI响应\":\"您好！从图片看这份文件可能是股东证明书中的部分内容，需注意以下几点：  \\n1.** 公司中文名 **：需**公司中文全称（若有）；  \\n2.** 必填字段 **：表格中“Tax ID”“Date of birth”等标记星号的字段需填写完整；  \\n3.** 签字要求 **：需确保文件末尾有被授权董事的手写签字（不可电子签/代签）。  \\n\\n建议核对后重新提交，或补充中文名称及缺失信息。\",\"一级大类\":\"其他\",\"二级子类\":\"政策咨询\",\"问题主题\":\"平台政策/官方规则\"},{\"时间\":\"2026-07-22 21:11:19\",\"用户\":\"零一\",\"群\":\"\",\"用户问询\":\"今天美客多有没有新政策 美客多为什么会改商家的体积\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n关于体积变化，自6月份起，平台对300g以上的产品按体积重计费。若发现体积被修改，通常是由于仓库重新测量或计费逻辑调整。建议优化包装以降低成本。\\n\\n目前暂无其他最新政策，建议关注官方通知。\",\"一级大类\":\"其他\",\"二级子类\":\"政策咨询\",\"问题主题\":\"平台政策/官方规则\"},{\"时间\":\"2026-07-21 17:12:52\",\"用户\":\"海\",\"群\":\"\",\"用户问询\":\"我上传的是标准pdf文件，不可能不清晰的，是不是其他问题？\",\"AI响应\":\"你好！虽然你上传的是标准PDF文件，但如果系统依然提示“not legible”，通常是因为以下原因：\\n\\n1. 关键信息缺失：对**公司，如果只上传了商业登记证（BR），系**公司成立细节而报错。请确保你同时上传了包含股东信息的周年申报表（NAR1）或法团成立表格（NNC1）。\\n\\n2. 最终受益人（UBO）信息未通过：图片中明确提到了“Beneficial Owner Declaration”，这说明系统需要核实占股25 账号入驻与安全\",\"二级子类\":\"店铺等级\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-26 11:20:09\",\"用户\":\"奋斗的小鸟\",\"群\":\"\",\"用户问询\":\"经理，你好，请教你写一个问题，信誉变红了以后，感觉流量都被系统屏蔽了，广告也不能开，这不都成了死循环，感觉上在多品也没用了，根本就没有一点流量\",\"AI响应\":\"你好！很高兴为你解答。非绿色信誉确实会被系统削减流量，且无法开启广告。建议通过降价引流获取新订单，完成10单履约来稀释负面指标，尽快恢复绿色信誉以重新接入流量通道。\",\"一级大类\":\"账号入驻与安全\",\"二级子类\":\"店铺等级\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-23 15:25:51\",\"用户\":\"YYY\",\"群\":\"\",\"用户问询\":\"@美客多小助手萝拉 店铺信誉等级，我是投诉率取消率延迟率其中一个不符合就会降级还是三个都不符合才会\",\"AI响应\":\"店铺信誉等级是系统根据过去60天内履约的40个订单的综合表现，通过**订单延迟率、订单投诉率、订单取消率**三个维度来评定的。只要**任意一个维度的指标不达标**（如延迟率过高、投诉率过高或取消率过高），就可能导致店铺信用评级下降（例如从绿色变为黄色或红色）。  \\n\\n例如，若您的订单延迟率持续超过阈值，即使投诉率和取消率正常也仍会触发降级风险；反之亦然。平台为60天滚动考核制，需持续关注这三项核心指标，避免因单维度问题影响整体信誉。  \\n\\n关于墨西哥 R F C税号的相关信息，请查看文章 https : //mp.weixin.qq.com/s/ng4ZFY6S3uO eWXCCeSCjBQ。\",\"一级大类\":\"账号入驻与安全\",\"二级子类\":\"店铺等级\",\"问题主题\":\"买家纠纷/客诉/售后\"},{\"时间\":\"2026-07-22 10:14:02\",\"用户\":\"Lucky\",\"群\":\"\",\"用户问询\":\"您好 我们的货到达full仓了 麻烦开一下信誉吧\",\"AI响应\":\"你好！新店铺初始信誉为灰色。需完成履约10个订单后，系统会根据订单处理的综合表现自动评定信誉等级，目前无法人工开启。\",\"一级大类\":\"账号入驻与安全\",\"二级子类\":\"店铺等级\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-26 17:40:22\",\"用户\":\"朵儿\",\"群\":\"\",\"用户问询\":\"跨境店的信誉会不会影响Full店\",\"AI响应\":\"你好！很高兴为你解答。跨境店海外仓模式（Full模式）的产品带有Full标志，享受流量倾斜。店铺信誉是针对单个店铺评定的，非绿色信誉会削减该店铺流量并影响转化率。建议保持良好履约以维护信誉。\",\"一级大类\":\"账号入驻与安全\",\"二级子类\":\"店铺等级\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-24 18:24:52\",\"用户\":\"YYY\",\"群\":\"\",\"用户问询\":\"@美客多小助手萝拉 店铺信誉红色会怎样\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n**1. 关于外箱标签（Master Box Label）**\\n外箱标签是你在创建备货计划（Shipment）后，由系统生成的PDF文件。它需要贴在发往美客多仓库的每一个最外层运输纸箱上。\\n- **作用**：仓库人员通过扫描外箱标签来识别这箱货属于哪个卖家、哪个货件编号（Shipment ID）以及箱内包含哪些商品。\\n- **注意**：如果外箱标签缺失、模糊或粘贴错误，仓库将无法识别货物，可能导致拒收或丢件。\\n\\n**2. 关于店铺信誉红色（Red Reputation）的影响**\\n如果店铺信誉等级降为红色，说明店铺的经营状况极差，会面临非常严重的后果：\\n- **流量大幅削减**：系统会严重限制店铺的曝光量，Listing 在搜索结果中排名会垫底，导致订单量骤减。\\n- **转化率降低**：红色信誉会直接显示在 Listing 前台，买家看到后会失去信任，极大影响下单意愿。\\n- **运费折扣取消**：你将无法享受任何运费折扣，必须支付全额运费，这会直接压缩甚至耗尽你的利润。\\n- **功能受限**：无法参加平台大促活动，无法投放竞价广告，也无法申请品牌官方店。\\n- **账户封禁风险**：如果红色信誉持续超过30天，或者长期无法改善，美客多可能会认为你违反了销售承诺，从而永久暂停你的销售账户，且无法创建新列表。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"账号入驻与安全\",\"二级子类\":\"店铺等级\",\"问题主题\":\"店铺等级综合咨询\"},{\"时间\":\"2026-07-22 18:25:04\",\"用户\":\"若初见\",\"群\":\"\",\"用户问询\":\"投诉订单解决，信誉取消影响，多长时间同步\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n成功关闭的投诉不会影响店铺信誉。您需要在48小时内处理投诉并给出买家满意的解决方案，确保投诉被关闭。\\n\\n店铺信誉等级是系统根据过去60天内履约的40个订单的综合表现来评定的。如果投诉已经妥善解决并关闭，它不会计入投诉率指标。但如果投诉未能在规定时间内解决而影响了信誉，系统会随着60天考核周期的滚动，在违规订单移出周期后完成指标同步和恢复。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"账号入驻与安全\",\"二级子类\":\"店铺等级\",\"问题主题\":\"买家纠纷/客诉/售后\"},{\"时间\":\"2026-07-22 18:24:23\",\"用户\":\"若初见\",\"群\":\"\",\"用户问询\":\"订单解决，取消对我信誉的影响，多长时间才能同步\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n店铺信誉等级的更新通常是实时的，但具体的指标统计（如订单取消率）是基于过去 60 天的滚动数据进行计算的。\\n\\n如果你因为取消订单导致信誉变色，影响会立即体现。要恢复信誉，你需要通过后续持续稳定的订单履约来稀释取消率。随着时间推移，那些违规订单会逐渐移出 60 天的考核周期，届时信誉指标才会恢复正常。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"账号入驻与安全\",\"二级子类\":\"店铺等级\",\"问题主题\":\"店铺等级综合咨询\"},{\"时间\":\"2026-07-21 02:04:47\",\"用户\":\"水果🍉\",\"群\":\"\",\"用户问询\":\"这个店铺是我哥开的，不是我开的 但是有这个群\",\"AI响应\":\"从您提供的截图来看，群聊名称明确标注为“美客多FTI对接群”，且群内有官方经理对接，这说明该店铺确实是FTI（工贸一体）店铺。FTI店铺对发货时效要求很高，必须在出单后48小时内将包裹送达集运仓并完成扫码，否则会严重影响店铺信誉和流量。\",\"一级大类\":\"账号入驻与安全\",\"二级子类\":\"店铺等级\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-26 11:20:38\",\"用户\":\"奋斗的小鸟\",\"群\":\"\",\"用户问询\":\"有没有办法扭转一下信誉\",\"AI响应\":\"你好！很高兴为你解答。建议及时查看后台各项指标数据并下载投诉报告进行优化。在单量较少时，建议通过降价手段让店铺完成更多订单履约，以平衡综合数据表现。同时需在48小时内处理投诉，确保投诉关闭。若持续红色信誉超过30天，账户可能面临永久停用风险。\",\"一级大类\":\"账号入驻与安全\",\"二级子类\":\"店铺等级\",\"问题主题\":\"店铺等级综合咨询\"}]},{\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"Past 7 Days\":59,\"Previous 2026-07-13 to 2026-07-19\":87,\"Change\":-28,\"WoW\":-0.3218390804597701,\"Past 7 Share\":0.008301674405515689,\"高频问题\":\"海外仓/FULL/入仓\",\"__details\":[{\"时间\":\"2026-07-23 16:04:15\",\"用户\":\"冯鹏程\",\"群\":\"\",\"用户问询\":\"为什么我这边FTI店铺显示有FULL仓，但是却还需要海外仓单独申请呢\",\"AI响应\":\"你好！根据平台规则，FTI店铺目前仅开放5个自发货站点，无法直接发FULL仓。海外仓需单独申请，可联系客户经理或填写问卷等待海外仓经理对接哦。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-24 10:13:50\",\"用户\":\"David Xu\",\"群\":\"莉娅测试群\",\"用户问询\":\"@美客多本土小助手莉娅(美客多本土小助手莉娅) 怎么开full仓\",\"AI响应\":\"你好！很高兴能为你解答。提交申请前，请务必仔细阅读《FULL仓申请指南》，按照指南完成后台的“退货仓库地址设置”及“税务设置”。完成前置准备后，请进行以下 3步登记操作：\\n\\nStep 1: 请确保扫码添加小助手。\\nStep 2: 完整填写“本土号卖家入驻信息收集表”：https://28151754.beschannels-plus.com/forms/6WU4ZMA；\\nStep 3: 完成“巴西本土FULL仓申请表”：https://28151754.beschannels-plus.com/forms/6XU4ZNB。\\n\\n目前 FULL 仓申请每周审批 1 次，通过后 7-10 个工作日内生效，请耐心等待。\\n\\n网页参考资料：\\nFULL仓申请指南：https://doc.weixin.qq.com/pdf/d3_AQIAAQbOAJoCN52Q7ezFTSeqcDUDW?scode=AI8A3wfvAAovXGjhqUAQIAAQbOAJo\\n\\n小助手二维码：\\nhttps://file.marsmind.cc/boot-admin/mercado_local/20260716/2077****8034.png\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-22 13:41:16\",\"用户\":\"小张向前进\",\"群\":\"\",\"用户问询\":\"平台是如何收取税费 我们做的是发到美客多full仓的如何收费\",\"AI响应\":\"如果你使用墨西哥Full仓且没有RFC税号，平台会依法对你的销售额进行36%的税费预扣（16%增值税+20%所得税）。\\n\\n在定价时，你不需要人工计算税费，系统会根据你录入的目标净收益自动叠加税费、佣金和运费生成最终售价，税费由买家承担。\\n\\n此外，Full仓费用还包括：\\n1. 销售佣金。\\n2. 仓储费（按商品体积和存放时间计收）。\\n3. 订单处理费（尾程配送费，根据重量和尺寸计收）。\\n4. 广告费（若开启）。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-20 17:57:50\",\"用户\":\"Rosa Chen（家居家具汽摩配full仓）\",\"群\":\"\",\"用户问询\":\"我们有两票的货件，之前提前已经约了送仓时间，可是预约信还没有下载，现在那个我们自己的预约系统登不进去了，那现在这种的怎么办呢？马上就要到预约送仓的时间了\",\"AI响应\":\"目前无法直接判断系统无法登录的具体原因。建议优先核查网络环境或尝试更换浏览器。若仍无法登录，请立即联系您的货代或物流商，确认其是否能通过其他渠道获取预约凭证。若确实无法下载预约信，建议在预约截止日期前至少提前1个工作日取消或重新安排预约，以避免产生每单位0.61美金的未送达费用。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-20 19:42:54\",\"用户\":\"凝眸\",\"群\":\"\",\"用户问询\":\"跨境店墨西哥站开Full仓需要店铺满足什么条件\",\"AI响应\":\"你好！很高兴为你解答。跨境店墨西哥站开通Full仓通常需要满足以下条件：\\n1. 店铺信誉等级达到绿色。\\n2. 过去30天内有稳定的销售记录。\\n3. 账户无违规记录且各项指标正常。\\n4. 需完成RFC税号合规。\\n具体开通权限以后台系统邀请或客户经理通知为准。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-20 18:57:20\",\"用户\":\"凝眸\",\"群\":\"\",\"用户问询\":\"想问下您开Full仓需要什么条件\",\"AI响应\":\"你好！很高兴为你解答。海外仓模式适合具备以下条件的卖家：\\n1. 拥有稳定且较大销售量的企业卖家。\\n2. 具备一定的资金实力和运营能力，能承担备货和物流成本。\\n3. 品牌店铺，尤其是拥有R标或TM标的卖家。\\n4. 希望提升物流时效和买家体验。\\n国内营业执照可申请跨境店海外仓模式。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-25 19:30:49\",\"用户\":\"困告羊\",\"群\":\"\",\"用户问询\":\"新店没有full仓是正常的吗\",\"AI响应\":\"是的，这是正常的。Full仓权限通常由系统根据店铺信誉等级（需处于绿色状态）、销售表现和运营合规性自动激活。建议先通过自发货模式积累数据，达标后系统会自动开通。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-24 22:25:08\",\"用户\":\"王秀地\",\"群\":\"\",\"用户问询\":\"那可以加白入full仓吗\",\"AI响应\":\"你好。目前危险品无法申请加白入Full仓。建议通过自发货模式进行销售，或联系后台客服确认具体产品的限制详情。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-23 22:12:42\",\"用户\":\"LiSONG\",\"群\":\"\",\"用户问询\":\"你这边是负责FULL仓店铺的吗\",\"AI响应\":\"不好意思，该问题我没有答案\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-23 16:22:06\",\"用户\":\"J·Alex\",\"群\":\"\",\"用户问询\":\"墨西哥full仓入库有通知吗\",\"AI响应\":\"你的问题我暂时无法回答，后续我会丰富我的知识库，敬请见谅。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-23 00:43:10\",\"用户\":\"A吴先生\",\"群\":\"\",\"用户问询\":\"Full仓是全托管吗？\",\"AI响应\":\"Full仓是全托管模式下的仓储服务，商家仅需负责供货，平台负责运营、物流、仓储等全流程。在全托管模式中，商家无需自行管理海外仓，货物会被统一存储在平台指定的海外仓（如墨西哥仓），由平台完成配送、售后等环节。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-23 11:11:20\",\"用户\":\"楠故\",\"群\":\"\",\"用户问询\":\"在7月27号之前预约的货件，预约到7月27号之后，过了7月27号是不能再改约的，是吗\",\"AI响应\":\"是的，根据系统调整通知，如需更改预约需在7月27日前完成，7月27日后所有预约将最终确认且不可更改。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-22 09:11:06\",\"用户\":\"楠故\",\"群\":\"\",\"用户问询\":\"我们后台选择的pickup，不应该是上门取货吗，为什么司机师傅要说没有预约，取不了件\",\"AI响应\":\"你好！很高兴为你解答。在卖家后台处理订单并打印面单后，系统会根据发货设置通知物流商。建议你通过拨打菜鸟揽收电话 0532-****2077 或访问菜鸟服务点查询页面获取负责该区域的司机电话，直接联系司机确认预约状态。若司机仍无法取件，为避免影响时效，建议在48小时内自行送至菜鸟指定扫码仓。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-21 15:10:03\",\"用户\":\"小张向前进\",\"群\":\"\",\"用户问询\":\"那我理解一下 我现在想要马上送仓 我需要购买110个小件库容 然后购买的是7月份的对吗\",\"AI响应\":\"是的，如果您希望在7月份完成送仓，需要购买7月份的中小型库容。购买并分配生效后，您就可以在后台尝试预约7月可用的送仓时间。如果7月已约满，则需按前述规则考虑8月预约及库容。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-24 15:15:19\",\"用户\":\"楠故\",\"群\":\"\",\"用户问询\":\"7月27日前没预约，7月27号之后再预约的，是否还可以改约\",\"AI响应\":\"你好！很高兴为你解答。根据通知，7月27日之后所有预约将最终确认且不可更改。这意味着在此日期之后安排的预约同样无法再次修改，请务必确认好时间。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-24 15:14:28\",\"用户\":\"楠故\",\"群\":\"\",\"用户问询\":\"7月27日后再预约的，是否还可以改约\",\"AI响应\":\"你好！很高兴为你解答。根据现有信息，7月27日之后所有预约将最终确认且不可更改。若错过预约，货件将被取消。建议你务必在规定时间内确认好最终的预约计划。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-20 15:57:22\",\"用户\":\"Eason\",\"群\":\"\",\"用户问询\":\"是创建退仓单后，立刻发送预约邮件吗\",\"AI响应\":\"商家您好！不是在创建后立刻发送，而是要等退仓单已经打包完成后再发送邮件预约。\\n\\n请在后台查询退仓单状态，确认已经打包完成（查询路径：商家后台-Listings management-created pickup full），然后即刻发邮件预约并安排取货。\\n\\n注意：库内停滞时长超过【5天】未提货的货件将会被销毁，请务必在打包完成后及时处理。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-21 17:20:20\",\"用户\":\"集\",\"群\":\"\",\"用户问询\":\"从哪里预约收货呢？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n预约收货的操作流程如下：\\n\\n1. 跨境海外仓（CBT）卖家：\\n你需要先在卖家后台完成备货计划的创建。随后，联系你合作的第三方物流商，由物流商在物流系统线上预约送仓时间。美客多系统会将货件分配到具体的某个Full仓，物流商再根据预约的时间和地点按时送仓。\\n\\n2. 半托管模式卖家：\\n直接在商家后台进行预约操作。请注意，预约是为了安排仓库接收货物，未预约或迟到可能导致仓库无法入库。\\n\\n3. 巴西本土店铺卖家：\\n在后台选择“Gestão de estoque Full”，点击“Enviar mercadorias”创建备货计划。系统分配仓库地址后，你可以在系统内选择送货方式，如预约官方揽收服务（Coleta）或自行送货（Entrega própria）。\\n\\n温馨提示：一旦预约确定，你最多可以在预约日期前1个工作日内添加或移除最多20%的单位。如果物流供应商错过预约，或者在预约截止日期前少于1个工作日修改或取消，平台将按该批次商品每单位收取 US$0.61 的费用。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-24 17:19:05\",\"用户\":\"美客多本土号小助手黛西\",\"群\":\"黛西测试群\",\"用户问询\":\"@ 关于美客多平台的开通full仓事宜，请添加我们的美客多本土小助手。 添加成功后，请直接私聊发送“开full”，小助手将为您提供详细指引，协助您快速完成账号登记与开通full仓流程。 请扫描该二维码：\",\"AI响应\":\"你好！Full仓权限通常由系统根据店铺信誉等级、销售表现和运营合规性自动激活。建议先通过自发货积累数据，信誉达标后系统会自动在库存管理板块开放送仓入口。若需人工协助，请按您提到的方式私聊小助手登记。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-23 11:05:22\",\"用户\":\"楠故\",\"群\":\"\",\"用户问询\":\"我们正在更新系统，使您的预约管理更快速、更便捷。此为内部调整，不会影响您当前的货件。 若您计划按原预约时间履约，则无需任何操作。如需更改预约，请在 7 月 27 日前重新安排。 此日期之后，所有预约将最终确认，且不可更改。如错过预约，您的货件将被取消。\",\"AI响应\":\"你好！这是系统优化内部调整哦，不影响当前货件。若按原预约时间履约无需操作，如需改约请于7月27日前重新安排，之后不可更改，错过预约货件将取消。建议联系司机或物流方再次确认预约状态~\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-24 12:38:07\",\"用户\":\"J·Alex\",\"群\":\"\",\"用户问询\":\"发往墨西哥FULL仓的货物被拒收\",\"AI响应\":\"你好！很高兴为你解答。发往墨西哥FULL仓的货物被拒收，通常是因为不符合入库规范。请检查以下几点：\\n\\n1. 标签问题：是否漏贴了产品标签或外箱标签，或者标签被折叠、覆盖了关键信息。\\n2. 包装问题：包装是否破损，或者不符合平台要求的尺寸和重量限制。\\n3. 预约问题：是否按照系统生成的预约时间准时送达。\\n4. 违禁品或限制品：产品是否属于禁售品，或者玩具类产品是否缺少必要的NOM认证标签。\\n\\n未提供RFC税号目前不影响您在美客多平台的现有销售权限，也不会导致货物因此被拒收。但建议您尽快完善，以避免高额的代扣税。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-23 10:16:01\",\"用户\":\"Leo\",\"群\":\"\",\"用户问询\":\"美客多墨西哥站的Full仓的仓储费率\",\"AI响应\":\"美客多Full仓储费用包括存储服务费和长期存储费。长期存储费针对存放超过120天的商品，按尺寸和时长计费。例如，Small尺寸存放4-6个月费用为0.77 USD；Extra large或重型产品存放超12个月为25.32 USD。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-22 15:52:21\",\"用户\":\"Leo\",\"群\":\"\",\"用户问询\":\"美客多墨西哥站的Full仓的仓储费率\",\"AI响应\":\"美客多Full仓储费用包括存储服务费和长期存储费。长期存储费针对存放超过120天的商品，按尺寸和时长计费。例如，Small尺寸存放4-6个月费用为0.77 USD；Extra large或重型产品存放超12个月为25.32 USD。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-21 14:50:43\",\"用户\":\"Xiyunfei05\",\"群\":\"\",\"用户问询\":\"墨西哥full仓跨境卖家账户绑定\",\"AI响应\":\"跨境海外仓卖家需要先绑定美金账号，再绑定墨西哥本土银行账号。务必先在国际收款入口完成美元账户绑定，刷新后台弹出本土收款入口后再进行绑定。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-24 22:21:57\",\"用户\":\"王秀地\",\"群\":\"\",\"用户问询\":\"产品被禁入full仓\",\"AI响应\":\"你好。产品被禁入FULL仓通常是因为违反了禁售政策或属于危险品。建议在卖家后台通过Need Help联系邮件或在线客服，提供Case ID和相关佐证向客户经理反馈。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"仓储预约\",\"问题主题\":\"海外仓/FULL/入仓\"}, a\",\"群\":\"\",\"用户问询\":\"全托管模式下，没有派发备货单，商家可以自己申请发送库存吗\",\"AI响应\":\"你好！很高兴为你解答。  \\n\\n根据全托管模式的发货规则：**如果系统未推送备货计划，商家无法手动申请发货单**，因此不能自行发送库存。  \\n\\n只有在收到平台推送的备货计划后，商家才能按照计划将货物发送至指定的国内集货仓（广东省东莞市沙田镇进港南路第一产业园205号库台）。若未收到备货计划，建议先检查后台“商品管理-海外仓库存管理-配送计划”是否有更新，或联系招商经理确认是否需要补充备货信息。  \\n\\n全托管模式的库存发送需严格遵循平台推送的备货计划，不可擅自发货。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-22 16:34:53\",\"用户\":\"Zeke郑\",\"群\":\"\",\"用户问询\":\"半托管的库容问题 可以购买吗 新手多少 受到ipi3.0影响吗\",\"AI响应\":\"关于半托管模式的库容问题，解答如下：\\n\\n1. 库容限制：半托管模式下有上品额度限制，每个店铺初始通常为100个listing限制，每个listing下建议不超过5个sku。这主要与您入驻时与买手沟通的寻品清单相关。\\n\\n2. 库容申请与购买：目前半托管模式的库容主要通过联系对接的买手申请扩容，前提是账号表现良好。关于“购买库容”功能，目前主要针对墨西哥海外仓中IPI处于红色或黄色状态且库容不足的卖家，半托管模式是否适用请以您的后台显示或买手通知为准。\\n\\n3. 新手库容：新卖家的大件商品初始库容配额通常为1,000件。\\n\\n4. IPI影响：半托管模式的库容和上品额度受账号表现影响。虽然IPI 3.0主要针对海外仓（FULL）模式的库存健康度进行考核，但良好的店铺信誉和动销表现始终是申请扩容的基础。\\n\\n网页参考资料\\nWhat are the listing limits?（https://global-selling.mercadolibre.com/help/21423）\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-21 17:47:01\",\"用户\":\"牛奶\",\"群\":\"\",\"用户问询\":\"这个是半托管ML code吗 怎么搜索不到产品的\",\"AI响应\":\"图中红圈处是 Item ID。搜不到产品是因为右侧状态显示为“无库存下架”，商品目前处于非活跃状态。建议您先补充库存，待状态变为 Active 后即可正常搜索。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-21 17:33:19\",\"用户\":\"David Xu\",\"群\":\"莉娅测试群\",\"用户问询\":\"@美客多本土小助手莉娅(美客多本土小助手莉娅) 库容申请\",\"AI响应\":\"你好！很高兴能为你解答。请完成以下3步登记操作：\\n\\nStep1: 请确保扫码添加小助手。\\n\\nStep2: 完整填写“本土号卖家入驻信息收集表”：https://28151754.beschannels-plus.com/forms/6WU4ZMA。\\n\\nStep3: 完成“巴西本土库容申请”：https://28151754.beschannels-plus.com/forms/6SU4ZNC。\\n\\n【库容申请须知】\\n申请门槛：仅面向 IPI 绿色（IPI \\u003e 70）的商户开放，每个 Cust ID 每月限申请 1 次。\\n申请限制：最大可申请库容额度（含后台现有库容）为过去 30 天销量的 10 倍。\\n前置条件：提交申请前，请确保已在后台提前创建好货件。\\n申请时间节点：每月 23 日前申请计为当月库容；每月 23 日后申请计为下月库容，将于下月首周统一生效。\\n注：平台每周将审批库容申请，审批通过后预计 3-5 个工作日内生效，请您耐心等待。\\n\\n网页参考资料：\\nhttps://vendedores.mercadolivre.com.br/nota/guia-para-envios-e-reposicao-de-estoque-no-full\\n\\nhttps://file.marsmind.cc/boot-admin/me 8:14:39\",\"用户\":\"Hellen\",\"群\":\"\",\"用户问询\":\"产品没有库存，会影响权重吗\",\"AI响应\":\"你好！会影响。库存不足会导致系统将 Listing 标记为“无库存”，降低曝光优先级。频繁断货会使权重迅速下降，广告算法也需重新累计，直接影响单量。建议保持稳定库存以维持 Listing 激活状态。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-24 15:37:44\",\"用户\":\"Z\",\"群\":\"\",\"用户问询\":\"库存是共用的吗？\",\"AI响应\":\"备货到仓的库存是各站点共享的。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-24 11:28:40\",\"用户\":\"鱼\",\"群\":\"\",\"用户问询\":\"全托滞销剩下的库存怎么处理\",\"AI响应\":\"你好！很高兴为你解答。库存退出机制如下：入库30天无动销可能面临退仓或清货处理。7天销量为0或14天销量低的SKU也可能被清退。退仓费用由商家承担。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-23 14:37:48\",\"用户\":\"A.roc\",\"群\":\"\",\"用户问询\":\"那我怎么转移库存呢\",\"AI响应\":\"你好！很高兴为你解答。  \\n\\n在芒果店长后台找到“库存管理”模块，选择原商品和新商品，通过“库存调拨”或“库存转移”功能，将原库存数量转移至新链接。若工具无直接操作入口，建议直接登录美客多卖家后台，在“库存管理”中手动调整库存关联新SKU。  \\n\\n注意：确保新链接类目正确，转移后及时检查库存状态是否同步。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-23 14:34:30\",\"用户\":\"A.roc\",\"群\":\"\",\"用户问询\":\"怎么移至新库存，怎么操作\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n操作步骤如下：\\n1. **创建新商品链接**：登录卖家后台，进入“Listings”页面，点击 “Add listings” 创建类目正确的新商品。\\n2. **库存分配**：进入“库存管理”，找到原下架商品，通过“库存调整”功能将可售库存转移至新链接的对应SKU。\\n3. **重新上架**：确认新链接类目合规后，点击 “重新上架商品” 完成库存迁移。\\n\\n建议在24小时内完成操作，避免库存因长期“不适合销售”被平台自动处置哦。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-22 16:37:53\",\"用户\":\"Zeke郑\",\"群\":\"\",\"用户问询\":\"那我半托如何提升库容\",\"AI响应\":\"半托管模式提升库容主要通过以下方式：\\n\\n1. 提升账号表现：半托管的上品额度与您的账号表现密切相关。建议您专注提升订单履约率、销售业绩以及保持良好的店铺信誉等级。\\n\\n2. 联系买手申请：如果您的账号表现良好，且现有的上品额度已无法满足发货需求，可以主动联系对接的买手申请扩容。\\n\\n3. 优化寻品清单：半托管的额度主要与入驻时沟通的寻品清单相关，确保您的产品符合平台需求，有助于获得更多额度支持。\\n\\n4. 关注IPI分数：虽然半托管有其特定的额度限制，但保持IPI分数在绿色状态（通常建议大于70分）是所有模式下申请额外支持的重要参考指标。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-22 15:54:11\",\"用户\":\"水果🍉\",\"群\":\"\",\"用户问询\":\"没库存发不出货怎么处理呢\",\"AI响应\":\"你好！很高兴为你解答。若因缺货无法发货，请主动与客户沟通换货方案，以有效预防客诉与订单取消。若最终无法发出，请尽快处理，避免因超时导致买家取消或产生纠纷。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-21 14:42:08\",\"用户\":\"小张向前进\",\"群\":\"\",\"用户问询\":\"那我就需要购买8月份库容了是吗\",\"AI响应\":\"是的，如果系统显示最早只能预约到8月，您就需要购买8月份的库容才能完成预约。请注意，如果您购买了未来月份的库容，但随后IPI分数提升至绿色健康度，系统会自动取消该购买并为您全额退款。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-20 11:23:51\",\"用户\":\"若初见\",\"群\":\"\",\"用户问询\":\"为什么点开仓库库存显示出错了\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n仓库库存显示出错通常有以下几种原因：\\n\\n1. 系统维护或网络波动：这属于常见情况，建议你更换浏览器（推荐使用Chrome）重试，或者开启浏览器的无痕模式再次尝试。\\n\\n2. 数据同步延迟：如果是新入库的商品，系统数据同步可能存在延迟，建议耐心等待一段时间后再刷新查看。\\n\\n3. 权限同步问题：如果是新开通的站点或刚分配的权限，可能存在权限同步不完整的情况。\\n\\n4. 浏览器缓存：建议清理浏览器缓存后再登录后台。\\n\\n如果尝试以上方法后仍然报错，建议联系你的客户经理或通过后台技术支持提交工单处理。\\n\\n关于墨西哥RFC税号的相关信息，请查看文章：https://mp.weixin.qq.com/s/ng4ZFY6S3uOeWXCCeSCjBQ。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-23 16:35:16\",\"用户\":\"David Xu\",\"群\":\"\",\"用户问询\":\"库容申请\",\"AI响应\":\"你好！很高兴为你解答。已为你发送库容申请表格，请查收。表格文件名称为“库容申请表格.xls”，提交后可通过该链接进行邮箱验证：https://28151754.beschannels-plus.com/forms/6WU4ZNQ?wechat=9XU4ZET\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-20 09:30:24\",\"用户\":\"Pawel\",\"群\":\"\",\"用户问询\":\"怎么购买库容\",\"AI响应\":\"购买库容仅限IPI分数低于70分的卖家。你可以提前购买未来长达3个月的额外库容，每月23日前截止当月操作。若IPI达标，系统会自动分配充足库容，无需购买。购买库容比超量罚款更划算。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-21 15:04:42\",\"用户\":\"小张向前进\",\"群\":\"\",\"用户问询\":\"因为我现在想要购买库容 但是我不知道我的产品具体属于中小型还是大件\",\"AI响应\":\"您可以根据截图中的分类来判断：点击“中小型”标签，如果显示那批152件货物在其中，则属于标准件；当前截图显示“大件、超大件或重物”下有42件，说明这批货是大件。平台定义尺寸大于50x60x60cm或重量大于18kg为大件。建议您在购买前切换标签确认各分类的剩余额度。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-24 11:30:30\",\"用户\":\"鱼\",\"群\":\"\",\"用户问询\":\"假如100件滞销库存，退仓费是多少钱\",\"AI响应\":\"你好！很高兴为你解答。目前全托管产品滞销退仓，仓库不收取仓储费或退货运费。退仓由商家自行安排提货并承担相关提货费用。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-21 15:03:26\",\"用户\":\"小张向前进\",\"群\":\"\",\"用户问询\":\"库容占用情况 稍等 我发一个截图\",\"AI响应\":\"好的，收到。请发送截图，我为您查看具体的库容占用情况。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-26 15:18:21\",\"用户\":\"James\",\"群\":\"\",\"用户问询\":\"现在库存变成0了\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n从你提供的图片看，取件单状态为“已预订”，此时这 69 件商品会被系统从可售库存中划扣出来，准备交付提货，所以你的前台库存会显示为 0。\\n\\n如果无法在后台直接取消，请按照以下方式处理：\\n1. 只要你不安排车辆去仓库，且不提供接收码进行扫描，货物就不会被提走。\\n2. 建议你立即点击页面右上角的“我需要帮助”，联系后台客服说明是误操作，申请取消该取件单（编号 #11966992）。\\n3. 一旦取件单被成功取消，系统会将这部分商品重新释放回可售库存中，届时库存数量就会恢复。\\n\\n请尽快联系客服处理，避免货物在取件区存放时间过长。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-24 11:11:58\",\"用户\":\"鱼\",\"群\":\"\",\"用户问询\":\"全托滞销剩下的库存谁承担费用\",\"AI响应\":\"你好！很高兴为你解答。全托管模式下，滞销商品的退仓费用由商家承担。若选择退货，目前只能销毁或退回海外，无法退回国内。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-21 16:11:00\",\"用户\":\"Tao Zhu\",\"群\":\"\",\"用户问询\":\"超龄库容，多久算超龄\",\"AI响应\":\"存放满4个月（120个自然日）或以上的商品即被视为超龄库存，会产生长期存储费用。此外，若商品在美仓存放超过60天且动销停滞，也可能被界定为不健康库存。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-21 14:37:37\",\"用户\":\"小张向前进\",\"群\":\"\",\"用户问询\":\"我想要向平台购买库容\",\"AI响应\":\"针对墨西哥海外仓或美国转运仓，若您的IPI分数低于70分（处于红/黄健康度），可通过后台“购买额外库容”工具操作。您可以提前购买未来长达3个月的库容，每月23日前截止当月操作。若IPI为绿色，系统会自动分配充足库容，无需购买。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-20 12:10:35\",\"用户\":\"李玲娅\",\"群\":\"\",\"用户问询\":\"可是我还有一个库存啊\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n如果后台显示还有一个库存但前端链接消失，建议你从以下几个细节排查：\\n\\n1. 预留库存（Reserved）：请检查这一个库存是否处于“Reserved”状态。如果该库存已被买家下单（待付款或处理中），或者正在仓库内部调拨，虽然显示有1个库存，但实际可售数量为0，链接就会在前端隐藏。\\n\\n2. 站点同步问题：如果你是通过美国转运仓模式销售至阿根廷，请确认该 Listing 在阿根廷站点的状态是否为 Active。有时候系统在库存极低时，为了防止超卖，可能会提前下架链接。\\n\\n3. 检查 Listing 报错：进入编辑页面，看是否有红色的报错提醒。如果 Listing 的某些属性（如分类、描述或图片）被判定为不合规，即使有库存也会被下架。\\n\\n4. 配送范围限制：请确认该产品是否属于阿根廷站点的禁售品类，或者是否因为体积重量超过了转运仓的配送限制。\\n\\n如果以上都正常，建议刷新后台或联系在线客服确认该库存的具体状态。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-21 16:15:37\",\"用户\":\"Tao Zhu\",\"群\":\"\",\"用户问询\":\"长期库存\",\"AI响应\":\"存放满4个月（120个自然日）或以上的商品将产生长期存储费用。费用每月根据产品老化程度和尺寸收取。建议在120天前通过调整价格、参加促销或清理库存来避免额外费用。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"海外仓/FULL/入仓\"},{\"时间\":\"2026-07-22 10:20:43\",\"用户\":\"Hao.S\",\"群\":\"\",\"用户问询\":\"2000****2675 我这个订单7/6已发出，但是一直没有物流信息，我有问人工官方客服说等，我也给买家留言，说明情况并建议她取消订单可以重新拍 我这边重新发货，但一直都是已读不回，现在她以商品无库存要求退款并投诉\",\"AI响应\":\"关于您提到的订单纠纷，平台的处理原则和建议如下：\\n\\n平台处理原则\\n美客多在处理此类纠纷时遵循公平原则。针对买家以“无库存”为由要求退款并投诉的情况，平台会审核双方提交的证据。由于您的包裹实际已发出，这属于物流更新延迟而非无库存。\\n\\n处理建议\\n1. 提交证据：请务必在纠纷处理界面提交您的发货证明，包括国内快递单号、包裹称重照片、以及您与买家沟通的聊天记录截图（证明您已告知货件发出并积极处理）。\\n2. 申诉说明：向平台客服说明包裹已于7/6发出，目前处于物流商揽收处理阶段，并非无库存。\\n3. 持续跟进物流：建议您同步联系菜鸟客服（0532-****2077）核实该订单的扫描进度。只要包裹在仓库完成扫描（A-Scan），物流信息就会更新，这能有力反驳“无库存”的投诉。\\n4. 预防影响：由卖家发起的订单取消会计入取消率，影响店铺信誉。既然买家已发起投诉，请通过纠纷系统申请平台介入裁决，由平台根据物流实际情况进行判定。\\n\\n如果买家坚持不退货且要求退款，您可以引用平台的退货政策，正常情况下退款需要伴随退货流程。建议您继续尝试与买家友好沟通，同时等待平台客服基于证据做出最终裁决。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-26 15:35:30\",\"用户\":\"James\",\"群\":\"\",\"用户问询\":\"因为这个后台不动以为提货就是申请提高库存发货的意识 不只是取回货物的意识 以为是提高货的库存量\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n非常理解，这确实是很多新手卖家容易混淆的地方。在美客多后台：\\n\\n1. **发货（Envío）**：是指你把货发往美客多仓库，增加库存。\\n2. **取货/提货（Retiro）**：是指你把存放在美客多仓库里的货取回来，这会减少并扣除你的库存。\\n\\n因为你误点了“取货”，系统认为你要把货拿走，所以才把可售库存清零了。\\n\\n既然你已经提交了邮件 Case 说明了情况，客服会明白这是误操作的。只要他们后台撤销了这个取件指令，这批货就会重新上架变成可售库存。以后操作时，记得认准 **\\\"Envío\\\"** 或者 **\\\"Send units\\\"** 才是增加库存的操作。\\n\\n现在耐心等待客服回邮处理即可，不用担心。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-20 13:52:11\",\"用户\":\"彬\",\"群\":\"\",\"用户问询\":\"在该商品的销售情况改善之前，您无法发货。但库存只剩1个还不让备货，什么原因\",\"AI响应\":\"限制原因通常是该商品近期没有销量，或者现有库存已超过预期销售速度。系统会基于过去销售和未来预期给出建议，若动销未达标，即使库存极低也会限制发货。建议先通过促销提升销量。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"库容管理\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-26 10:13:10\",\"用户\":\"95后一场梦\",\"群\":\"\",\"用户问询\":\"你好 麻烦看一下，这个款已经显示有库存了 为什么还有待发货\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n这种情况在全托管模式下是正常的，主要有以下几个原因：\\n\\n1. **系统自动补货机制**：全托管的订单是由系统统一推送的。即便你现在已经有30件库存（Full: 30 u.），但如果系统根据当前的销售速度、历史销量或者市场预测，判断这30件很快就会卖完，它就会提前推送新的“待发货”任务，要求你继续补货，以确保链接不会断货。\\n\\n2. **多站点库存分配 al Invoice），然后点击图片中的“附上发票”上传，或通过订单聊天窗口发送给买家。\",\"一级大类\":\"财税合规\",\"二级子类\":\"发票开具\",\"问题主题\":\"广告/关键词投放\"},{\"时间\":\"2026-07-21 00:55:36\",\"用户\":\"骑着毛驴去拉萨\",\"群\":\"\",\"用户问询\":\"点哪里拆单\",\"AI响应\":\"你好！很高兴为你解答。从你提供的图片来看，该订单目前没有拆单选项。通常点击订单右侧三个点可以进行查看详情、取消订单、打印发票和查看售后消息等操作。如果需要拆分包裹发货，建议联系平台客服确认该订单是否支持拆单。\",\"一级大类\":\"财税合规\",\"二级子类\":\"发票开具\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-20 20:50:10\",\"用户\":\"95后一场梦\",\"群\":\"\",\"用户问询\":\"我邮箱看到的 现在不知道是哪一个款违规\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n根据你提供的邮件截图，违规的产品标题是：Conjunto De 2 Peças De Camiseta E Shorts Com Estampa Colorid Branco 5-6y。\\n\\n这封邮件提示该产品被取消是因为“该品牌易被仿冒”（brand is susceptible to counterfeiting）。这通常意味着系统触发了平台的品牌保护与防伪审核机制。\\n\\n针对这种情况，建议你按以下步骤处理：\\n\\n1. 核实品牌授权：如果你销售的是知名品牌产品，请确保拥有合法的品牌授权书。如果是自主品牌，请务必在美客多进行品牌备案。\\n\\n2. 检查Listing信息：检查标题、描述或图片中是否使用了高风险的违规词、他人品牌名称，或者图片中出现了他人的品牌Logo、水印。\\n\\n3. 提交申诉材料：如果你确认是系统误判，需要通过后台的 Help 模块或联系客户经理提交证明材料，包括正规采购发票、品牌授权书、带有品牌Logo的产品实物照片以及营业执照。\\n\\n4. 及时删除：如果该产品确实存在侵权风险或无法提供授权，建议立即删除该Listing，避免导致店铺信誉等级下降甚至封号。\\n\\n美客多对仿品和侵权产品采取零容忍政策，请务必谨慎对待。\",\"一级大类\":\"财税合规\",\"二级子类\":\"发票开具\",\"问题主题\":\"账号风控/限制/申诉\"}]},{\"一级大类\":\"物流仓储\",\"二级子类\":\"入库异常\",\"Past 7 Days\":4,\"Previous 2026-07-13 to 2026-07-19\":3,\"Change\":1,\"WoW\":0.3333333333333333,\"Past 7 Share\":0.0005628253834247924,\"高频问题\":\"买家纠纷/客诉/售后\",\"__details\":[{\"时间\":\"2026-07-25 19:34:18\",\"用户\":\"苏全喜\",\"群\":\"\",\"用户问询\":\"运输损坏，怎么向菜鸟索赔\",\"AI响应\":\"亲爱的卖家，如果您的包裹在运输过程中发生损坏，可以按照以下流程向菜鸟申请赔偿：\\n\\n1. 准备证据材料：请准备好受损包裹的照片（包含外包装破损情况和内部商品损坏细节）、对应的订单号、运单号、包裹详情以及物流跟踪截图。\\n\\n2. 联系美客多官方客服：卖家需要先联系美客多后台的官方客服，说明运输损坏的情况并提交上述证据。\\n\\n3. 官方介入处理：由美客多官方客服核实情况后，会联系菜鸟物流进行定损与赔付。\\n\\n需要注意的是，平台承担国际段物流风险，但商家在发货至官方仓（或菜鸟国内集运仓）前，需自行保障包装牢固，确保货物能抵御正常的物流运输压力。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"入库异常\",\"问题主题\":\"买家纠纷/客诉/售后\"},{\"时间\":\"2026-07-25 09:40:07\",\"用户\":\"Silvia\",\"群\":\"\",\"用户问询\":\"那买家买多件的时候 卖家收到的是多份净收益\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n是的，你的理解完全正确。\\n\\n在美客多的净收益定价模式下，你为产品设定的“净收益”是单件产品的结算金额。\\n\\n1. 收益结算：如果买家一个订单买了2件产品，你最终获得的结算金额就是：单件净收益 x 2。\\n2. 运费处理：系统会自动根据两件产品的总重量计算出一份总运费，并将其叠加在前端售价中。无论运费如何变化，平台都会保护你设定的单件净收益不受影响。\\n3. 自动调价：当买家增加购买数量时，系统会实时重新计算总运费和总佣金，并展示给买家一个最终的总价，而你到账的金额依然是按照件数累加的净收益。\\n\\n这种模式的好处在于，你不需要担心多件购买时运费怎么算，只需要关注每卖出一件货你想赚多少钱即可。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"入库异常\",\"问题主题\":\"买家纠纷/客诉/售后\"},{\"时间\":\"2026-07-25 09:31:28\",\"用户\":\"Silvia\",\"群\":\"\",\"用户问询\":\"那也就是说 订单有多件产品的时候 是按实际重量来收运费的，比如30g的产品 买一件5刀 买两件是10刀吗？还是买两件的运费只收一份运费 价格会变8刀？\",\"AI响应\":\"你好！很高兴为你解答。\\n\\n在美客多自发货模式下，运费的收取逻辑如下：\\n\\n1. 运费按包裹总重计算：如果一个订单包含两件产品，平台会将这两件产品打包成一个包裹发送。运费是根据这个包裹的总毛重（两件产品+包装材料）来收取的，而不是简单地将单件产品的运费乘以二。\\n\\n2. 运费承担方：\\n- 如果订单总金额低于包邮门槛：买家需要支付运费。此时你收到的货款是你的净收益部分。\\n- 如果订单总金额高于包邮门槛：由你（卖家）承担全额运费。\\n\\n3. 价格变化示例：\\n假设单件产品30g，运费在0.13lb（约59g）档位是6.67美金。\\n- 买一件：如果售价低于包邮门槛，买家付运费，你拿走你的净收益。\\n- 买两件：总重70g，落在0.25lb（约113g）档位，运费为6.85美金。\\n\\n由于两件产品的总重通常会跨入更高的重量档位，运费会略有上升（比如从6.67美金变成6.85美金），但绝对不是翻倍。\\n\\n4. 自动定价机制：美客多采用收益价格模式。你只需在后台录入你想要的净收益（成本+利润），系统会自动根据当前的重量档位、佣金和包邮政策，实时计算并生成前台售价。所以，当买家购买两件时，系统会自动重新计算总重对应的运费并调整总价，不需要你人工干预。\\n\\n总结来说，买两件时的总运费通常比买两件单件的运费总和要便宜很多，这也就是为什么多件购买对买家和卖家都更划算。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"入库异常\",\"问题主题\":\"物流发货/面单/包装\"},{\"时间\":\"2026-07-21 04:33:35\",\"用户\":\"水果🍉\",\"群\":\"\",\"用户问询\":\"美客多货代是干嘛的\",\"AI响应\":\"美客多货代主要负责货物的运输，支持散货、整柜海运、汽运及铁路运输等多种方式，帮助卖家将货物送达目的地，违禁品除外。\",\"一级大类\":\"物流仓储\",\"二级子类\":\"入库异常\",\"问题主题\":\"入库异常综合咨询\"}]}],\"category_issues\":[{\"二级子类\":\"其他\",\"高频问题\":\"其他具体问题\",\"Past 7 Days\":2761,\"Previous\":2454,\"WoW\":0.12510187449062754,\"代表性问询\":\"帮我看一下这个提示，是指再提交Beneficial Owner Declaration就可以了吗？还是包括什么商业登记证那些文件全部都要重新再提交？\",\"Past 7 Days代表性问询\":\"帮我看一下这个提示，是指再提交Beneficial Owner Declaration就可以了吗？还是包括什么商业登记证那些文件全部都要重新再提交？\",\"Previous代表性问询\":\"您好，这边提交过，这边是还需要继续提交吗？\"},{\"二级子类\":\"产品上架\",\"高频问题\":\"产品上架/变体/SKU\",\"Past 7 Days\":549,\"Previous\":426,\"WoW\":0.2887323943661972,\"代表性问询\":\"没事，你可以先发我链接，等周一我再去提交\",\"Past 7 Days代表性问询\":\"没事，你可以先发我链接，等周一我再去提交\",\"Previous代表性问询\":\"不是这个链接提交的 是在你们官方提交的可以吗\"},{\"二级子类\":\"产品上架\",\"高频问题\":\"账号风控/限制/申诉\",\"Past 7 Days\":5,\"Previous\":0,\"WoW\":null,\"代表性问询\":\"
